<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Commit Tool - Selective Merge</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --accent-red: #ff4444;
            --accent-blue: #4488ff;
            --accent-purple: #8844ff;
            --text-primary: #ffffff;
            --text-secondary: #888;
            --border-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: var(--accent-gold);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .dashboard-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        button {
            background: linear-gradient(135deg, var(--accent-gold), #ffaa00);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        button.secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        button.danger {
            background: linear-gradient(135deg, var(--accent-red), #cc0000);
            color: white;
        }

        button.success {
            background: linear-gradient(135deg, var(--accent-green), #00cc66);
            color: #000;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value.pending { color: var(--accent-gold); }
        .stat-value.selected { color: var(--accent-blue); }
        .stat-value.merged { color: var(--accent-green); }
        .stat-value.rejected { color: var(--accent-red); }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .proposals-grid {
            display: grid;
            gap: 15px;
        }

        .proposal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s;
        }

        .proposal-card:hover {
            border-color: var(--accent-gold);
        }

        .proposal-card.selected {
            border-color: var(--accent-blue);
            background: rgba(68, 136, 255, 0.1);
        }

        .proposal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .proposal-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .proposal-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .change-type {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .change-type.SAFE { background: rgba(0, 255, 136, 0.2); color: var(--accent-green); }
        .change-type.REVIEWED { background: rgba(68, 136, 255, 0.2); color: var(--accent-blue); }
        .change-type.BREAKING { background: rgba(255, 68, 68, 0.2); color: var(--accent-red); }

        .xp-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .proposal-description {
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .diff-preview {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .diff-preview .added { color: var(--accent-green); }
        .diff-preview .removed { color: var(--accent-red); }

        .proposal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .creator-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .creator-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-green);
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.error { border-color: var(--accent-red); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 20px;
        }

        .modal textarea {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 15px;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Dashboard DNA -->
    <script type="application/json" id="dashboard-dna">
    {
        "name": "Dashboard Commit Tool",
        "version": "1.0.0",
        "purpose": "Selective Merge System - Review and apply dashboard improvements",
        "domain": "2_BUILD",
        "sphere": "SYSTEM_TOOLS",
        "created": "2026-02-23",
        "updated": "2026-02-23",
        "status": "LIVE",
        "url": "https://consciousnessrevolution.io/DASHBOARD_COMMIT_TOOL.html",
        "features": ["supabase", "selective-merge", "xp-rewards", "diff-preview"],
        "trinity": {
            "c1_built": "2026-02-23",
            "c2_reviewed": null,
            "c3_validated": null
        },
        "lfsme": {
            "lighter": 8,
            "faster": 9,
            "stronger": 9,
            "elegant": 8,
            "less_expensive": 10,
            "average": 8.8
        }
    }
    </script>

    <div class="container">
        <header>
            <h1>
                <span>Dashboard Commit Tool</span>
                <span class="badge">SELECTIVE MERGE</span>
            </h1>
            <div class="dashboard-selector">
                <input type="text" id="dashboardId" placeholder="Enter dashboard ID or URL" style="width: 300px;">
                <button onclick="loadProposals()">Load Proposals</button>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value pending" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-value selected" id="selectedCount">0</div>
                <div class="stat-label">Selected</div>
            </div>
            <div class="stat-card">
                <div class="stat-value merged" id="mergedCount">0</div>
                <div class="stat-label">Merged</div>
            </div>
            <div class="stat-card">
                <div class="stat-value rejected" id="rejectedCount">0</div>
                <div class="stat-label">Rejected</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--accent-gold);" id="totalXp">0</div>
                <div class="stat-label">Total XP Available</div>
            </div>
        </div>

        <div id="proposalsList" class="proposals-grid">
            <div class="empty-state">
                <h3>No Dashboard Selected</h3>
                <p>Enter a dashboard ID above to view pending improvements</p>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="modal-overlay" id="rejectModal">
        <div class="modal">
            <h2>Reject Improvement</h2>
            <p style="margin-bottom: 15px; color: var(--text-secondary);">
                Please provide a reason for rejection. This helps contributors improve.
            </p>
            <textarea id="rejectReason" placeholder="Reason for rejection..."></textarea>
            <div class="modal-actions">
                <button class="secondary" onclick="closeRejectModal()">Cancel</button>
                <button class="danger" onclick="confirmReject()">Reject</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '/.netlify/functions/dashboard-commit';
        let currentDashboardId = null;
        let rejectingProposalId = null;

        // Show toast notification
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Load proposals for a dashboard
        async function loadProposals() {
            const input = document.getElementById('dashboardId').value.trim();
            if (!input) {
                showToast('Please enter a dashboard ID', true);
                return;
            }

            // Extract dashboard ID from URL if needed
            currentDashboardId = input.includes('/') ? input.split('/').pop().replace('.html', '') : input;

            const container = document.getElementById('proposalsList');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                // Load all statuses
                const [pending, selected, merged, rejected] = await Promise.all([
                    fetch(`${API_BASE}?dashboard_id=${currentDashboardId}&status=pending`).then(r => r.json()),
                    fetch(`${API_BASE}?dashboard_id=${currentDashboardId}&status=selected`).then(r => r.json()),
                    fetch(`${API_BASE}?dashboard_id=${currentDashboardId}&status=merged`).then(r => r.json()),
                    fetch(`${API_BASE}?dashboard_id=${currentDashboardId}&status=rejected`).then(r => r.json())
                ]);

                // Update stats
                document.getElementById('pendingCount').textContent = pending.count || 0;
                document.getElementById('selectedCount').textContent = selected.count || 0;
                document.getElementById('mergedCount').textContent = merged.count || 0;
                document.getElementById('rejectedCount').textContent = rejected.count || 0;

                // Calculate total XP
                const totalXp = (pending.proposals || []).reduce((sum, p) => sum + (p.xp_reward || 0), 0);
                document.getElementById('totalXp').textContent = totalXp;

                // Render proposals
                const allProposals = [
                    ...(pending.proposals || []),
                    ...(selected.proposals || [])
                ];

                if (allProposals.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No Pending Improvements</h3>
                            <p>This dashboard has no improvements waiting for review</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = allProposals.map(p => renderProposal(p)).join('');

            } catch (error) {
                console.error('Error loading proposals:', error);
                showToast('Failed to load proposals', true);
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Error Loading Proposals</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Render a single proposal card
        function renderProposal(p) {
            const initials = (p.creator_name || 'U').substring(0, 2).toUpperCase();
            const createdAt = new Date(p.created_at).toLocaleDateString();

            // Format diff preview
            let diffPreview = '';
            if (p.html_diff) diffPreview += `<span class="added">HTML: ${p.html_diff.substring(0, 200)}...</span>\n`;
            if (p.css_diff) diffPreview += `<span class="added">CSS: ${p.css_diff.substring(0, 200)}...</span>\n`;
            if (p.js_diff) diffPreview += `<span class="added">JS: ${p.js_diff.substring(0, 200)}...</span>\n`;

            const isSelected = p.status === 'selected';

            return `
                <div class="proposal-card ${isSelected ? 'selected' : ''}" data-id="${p.id}">
                    <div class="proposal-header">
                        <div>
                            <div class="proposal-title">${p.title}</div>
                            <div class="proposal-meta">
                                <div class="creator-info">
                                    <div class="creator-avatar">${initials}</div>
                                    <span>${p.creator_name} (${p.creator_type})</span>
                                </div>
                                <span>${createdAt}</span>
                                ${p.domain ? `<span>${p.domain}</span>` : ''}
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <span class="change-type ${p.change_type}">${p.change_type}</span>
                            <div class="xp-badge">+${p.xp_reward} XP</div>
                        </div>
                    </div>

                    ${p.description ? `<div class="proposal-description">${p.description}</div>` : ''}

                    ${diffPreview ? `<div class="diff-preview">${diffPreview || 'No diff preview available'}</div>` : ''}

                    <div class="proposal-actions">
                        ${isSelected ? `
                            <button class="success" onclick="mergeProposal('${p.id}')">Merge</button>
                            <button class="secondary" onclick="updateProposal('${p.id}', 'reject')">Unselect</button>
                        ` : `
                            <button onclick="updateProposal('${p.id}', 'select')">Select</button>
                            <button class="danger" onclick="openRejectModal('${p.id}')">Reject</button>
                        `}
                        <button class="secondary" onclick="viewFullDiff('${p.id}')">View Full Diff</button>
                    </div>
                </div>
            `;
        }

        // Update proposal status
        async function updateProposal(proposalId, action, reason = null) {
            try {
                const response = await fetch(API_BASE, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        proposal_id: proposalId,
                        action,
                        reason
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showToast(result.message);
                    loadProposals(); // Refresh
                } else {
                    showToast(result.error, true);
                }
            } catch (error) {
                showToast('Failed to update proposal', true);
            }
        }

        // Merge proposal (apply changes)
        async function mergeProposal(proposalId) {
            if (!confirm('Are you sure you want to merge this improvement? This will apply the changes to the dashboard.')) {
                return;
            }
            await updateProposal(proposalId, 'merge');
        }

        // Open reject modal
        function openRejectModal(proposalId) {
            rejectingProposalId = proposalId;
            document.getElementById('rejectModal').style.display = 'flex';
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectReason').focus();
        }

        // Close reject modal
        function closeRejectModal() {
            rejectingProposalId = null;
            document.getElementById('rejectModal').style.display = 'none';
        }

        // Confirm rejection
        async function confirmReject() {
            const reason = document.getElementById('rejectReason').value.trim();
            if (!reason) {
                showToast('Please provide a rejection reason', true);
                return;
            }
            await updateProposal(rejectingProposalId, 'reject', reason);
            closeRejectModal();
        }

        // View full diff (placeholder)
        function viewFullDiff(proposalId) {
            showToast('Full diff viewer coming soon');
        }

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeRejectModal();
        });

        // Close modal on overlay click
        document.getElementById('rejectModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) closeRejectModal();
        });
    </script>
</body>
</html>
