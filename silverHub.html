<body>

<div class="card">
  <h1>Silver Planner — Growth + Linear + Auto‑Bid</h1>
  <div class="flex">
    <button id="modeGrowth">Growth Mode</button>
    <button id="modeLinear">Linear Mode</button>
    <button id="modeAutoBid">Auto‑Bid Queue</button>
  </div>
</div>

<!-- Shared Inputs -->
<div class="card">
  <h2>Shared Inputs</h2>
  <label>Bankroll ($)</label><input id="bankroll" type="number" value="5000" />
  <label>eBay Balance ($)</label><input id="ebayBalance" type="number" value="2500" />
  <label><input id="lockBankroll" type="checkbox" checked /> Lock bankroll for bidding</label>
  <div class="flex"><span id="reservePill">Reserved: $0</span><span id="availablePill">Available: $0</span></div>
  <label>Spot price ($/oz)</label><input id="spotOz" type="number" value="58" />
  <label>Resale price ($/oz)</label><input id="resaleOz" type="number" value="65" />
  <label>Buy ceiling (% of spot)</label><input id="buyPct" type="number" value="75" />
  <label>Processing ($/g pure)</label><input id="processPerG" type="number" value="0.10" />
  <label>Fees (% of revenue)</label><input id="feePct" type="number" value="15" />
  <label>Turnover days</label><input id="turnoverDays" type="number" value="7" />
  <div id="unitEconomics"></div>
</div>

<!-- Growth Mode -->
<div id="growthContent" class="card">
  <h2>Growth Roadmap</h2>
  <button id="runBtn">Run Roadmap</button>
  <div id="summary"></div>
  <table>
    <thead><tr><th>Flip</th><th>Bankroll End</th><th>Day</th></tr></thead>
    <tbody id="roadmapBody"></tbody>
  </table>
  <canvas id="growthChart"></canvas>
  <canvas id="profitChart"></canvas>
</div>

<!-- Linear Mode -->
<div id="linearCard" class="card" style="display:none;">
  <h2>Linear Income Projection</h2>
  <label>Desired monthly income ($)</label><input id="desiredMonthly" type="number" value="0" />
  <button id="calcLinearBtn">Calculate</button>
  <div id="linearResults"></div>
  <canvas id="linearChart"></canvas>
</div>

<!-- Auto-Bid Queue -->
<div id="autoBidCard" class="card" style="display:none;">
  <h2>Auto-Bid Queue</h2>
  <textarea id="queuePaste" rows="3" placeholder="url | itemId | seller | grams | endISO"></textarea>
  <button id="ingestQueueBtn">Add to Queue</button>
  <table>
    <thead><tr><th>Item</th><th>Seller</th><th>Grams</th><th>Ceiling</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="queueBody"></tbody>
  </table>
</div>
<script>
(function(){
  const gramsPerOz = 31.1035;
  let queue = [], reserved = 0;

  function fmt(n){ return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function availableFunds(){
    const bankroll = parseFloat(document.getElementById('bankroll').value||0);
    const ebayBal = parseFloat(document.getElementById('ebayBalance').value||0);
    return Math.max(0, Math.min(bankroll, ebayBal) - reserved);
  }
  function updateReserveUI(){
    document.getElementById('reservePill').textContent = 'Reserved: $'+fmt(reserved);
    document.getElementById('availablePill').textContent = 'Available: $'+fmt(availableFunds());
  }

  // Mode toggle
  document.getElementById('modeGrowth').onclick=()=>{document.getElementById('growthContent').style.display='block';document.getElementById('linearCard').style.display='none';document.getElementById('autoBidCard').style.display='none';};
  document.getElementById('modeLinear').onclick=()=>{document.getElementById('growthContent').style.display='none';document.getElementById('linearCard').style.display='block';document.getElementById('autoBidCard').style.display='none';};
  document.getElementById('modeAutoBid').onclick=()=>{document.getElementById('growthContent').style.display='none';document.getElementById('linearCard').style.display='none';document.getElementById('autoBidCard').style.display='block';};

  // Growth simulation
  document.getElementById('runBtn').onclick=function(){
    const b=parseFloat(document.getElementById('bankroll').value);
    const s=parseFloat(document.getElementById('spotOz').value);
    const r=parseFloat(document.getElementById('resaleOz').value);
    const bp=parseFloat(document.getElementById('buyPct').value)/100;
    const p=parseFloat(document.getElementById('processPerG').value);
    const f=parseFloat(document.getElementById('feePct').value)/100;
    const d=parseFloat(document.getElementById('turnoverDays').value);
    const spotPerG=s/gramsPerOz;
    const resalePerG=r/gramsPerOz;
    const buyCeilPerG=spotPerG*bp;
    const revenuePerG=resalePerG*(1-f);
    const profitPerG=revenuePerG-buyCeilPerG-p;
    const costPerG=buyCeilPerG+p;
    if(profitPerG<=0){document.getElementById('summary').innerHTML='<span class="neg">Unit economics negative.</span>';return;}
    let rows=[],bankroll=b,day=0;
    for(let flip=1;flip<=10;flip++){
      const pureGrams=bankroll/costPerG;
      const profit=pureGrams*profitPerG;
      bankroll+=profit; day+=d;
      rows.push({flip,bankrollEnd:bankroll,day});
    }
    document.getElementById('roadmapBody').innerHTML=rows.map(r=>`<tr><td>${r.flip}</td><td>$${fmt(r.bankrollEnd)}</td><td>${r.day}</td></tr>`).join('');
  };

  // Linear mode
  document.getElementById('calcLinearBtn').onclick=function(){
    const bankroll=parseFloat(document.getElementById('bankroll').value);
    const s=parseFloat(document.getElementById('spotOz').value);
    const r=parseFloat(document.getElementById('resaleOz').value);
    const bp=parseFloat(document.getElementById('buyPct').value)/100;
    const p=parseFloat(document.getElementById('processPerG').value);
    const f=parseFloat(document.getElementById('feePct').value)/100;
    const d=parseFloat(document.getElementById('turnoverDays').value);
    const spotPerG=s/gramsPerOz;
    const resalePerG=r/gramsPerOz;
    const buyCeilPerG=spotPerG*bp;
    const revenuePerG=resalePerG*(1-f);
    const profitPerG=revenuePerG-buyCeilPerG-p;
    const costPerG=buyCeilPerG+p;
    if(profitPerG<=0){document.getElementById('linearResults').innerHTML='<span class="neg">Unit economics negative.</span>';return;}
    const cyclesPerYear=365/d;
    const pureGrams=bankroll/costPerG;
    const profitPerCycle=pureGrams*profitPerG;
    const annualIncome=profitPerCycle*cyclesPerYear;
    const monthlyIncome=annualIncome/12;
    document.getElementById('linearResults').innerHTML=`<span>Bankroll $${fmt(bankroll)} supports steady income: <span class="pos">$${fmt(monthlyIncome)}/month</span></span>`;
  };

  // Auto-bid queue
  function computeCeiling(grams925){
    const s=parseFloat(document.getElementById('spotOz').value);
    const r=parseFloat(document.getElementById('resaleOz').value);
    const bp=parseFloat(document.getElementById('buyPct').value)/100;
    const p=parseFloat(document.getElementById('processPerG').value);
    const f=parseFloat(document.getElementById('feePct').value)/100;
    const spotPerG=s/gramsPerOz;
    const resalePerG=r/gramsPerOz;
    const buyCeilPerG=spotPerG*bp;
    const revenuePerG=resalePerG*(1-f);
    const profitPerG=revenuePerG-buyCeilPerG-p;
    const costPerG=buyCeilPerG+p;
    const pureG=grams925*0.925;
    return pureG*buyCeilPerG;
  }
  function canBidOneOunce(){
    const s=parseFloat(document.getElementById('spotOz').value);
    const bp=parseFloat(document.getElementById('buyPct').value)/100;
    const p=parseFloat(document.getElementById('processPerG').value);
    const spotPerG=s/gramsPerOz;
    const buyCeilPerG=spotPerG*bp;
    const costPerG=buyCeilPerG+p;
    return availableFunds() >= costPerG*gramsPerOz;
  }
  function renderQueue(){
    document.getElementById('queueBody').innerHTML=queue.map(q=>`
      <tr>
        <td>${q.itemId}</td><td>${q.seller}</td><td>${q.grams}</td>
        <td>$${fmt(q.ceiling)}</td><td>${q.status}</td>
        <td>
          <button onclick="markWon('${q.itemId}')">Won</button>
          <button onclick="markLost('${q.itemId}')">Lost</button>
        </td>
      </tr>`).join('');
    updateReserveUI();
  }
  document.getElementById('ingestQueueBtn').onclick=function(){
    const t=document.getElementById('queuePaste').value.trim();
    if(!t) return;
    const [url,itemId,seller,grams,endISO]=t.split('|').map(x=>x.trim());
    const gramsF=parseFloat(grams||0);
    const ceiling=computeCeiling(gramsF);
    const entry={url,itemId,seller,grams:gramsF,endISO,ceiling,status:'queued'};
    if(canBidOneOunce() && ceiling<=availableFunds()){reserved+=ceiling;entry.status='scheduled';}
    queue.push(entry); renderQueue();
  };
  window.markWon=function(id){const q=queue.find(x=>x.itemId===id);if(q){q.status='won';renderQueue();}};
  window.markLost=function(id){const q=queue.find(x=>x.itemId===id);if(q){reserved=Math.max(0,reserved-q.ceiling);q.status='lost';renderQueue();}};
})();
</script>
