<body>
    <div class="header">
        <h1>🔬 SQL Schema Analyzer Pro</h1>
        <p>Automated Security Analysis • Performance Optimization • Interactive Visualization</p>
    </div>

    <div class="container">
        <!-- Input Panel -->
        <div class="panel">
            <h2>📥 Schema Input</h2>
            <div class="input-section">
                <textarea id="sqlInput" placeholder="Paste your SQL CREATE TABLE statements here...

Example:
CREATE TABLE users (
    id INT PRIMARY KEY AUTO_INCREMENT,
    username VARCHAR(50) NOT NULL,
    password VARCHAR(255) NOT NULL,
    email VARCHAR(100) UNIQUE,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE orders (
    id INT PRIMARY KEY AUTO_INCREMENT,
    user_id INT NOT NULL,
    total DECIMAL(10,2),
    status VARCHAR(20),
    FOREIGN KEY (user_id) REFERENCES users(id)
);"></textarea>
                
                <div class="button-group">
                    <button class="btn-primary" onclick="analyzeSchema()">
                        🔍 Analyze Schema
                    </button>
                    <button class="btn-secondary" onclick="loadExample()">
                        📝 Load Example
                    </button>
                    <button class="btn-success" onclick="clearAll()">
                        🗑️ Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Analyzing schema and detecting vulnerabilities...</p>
        </div>

        <!-- Summary Stats -->
        <div id="summarySection" style="display: none;">
            <div class="panel">
                <h2>📊 Analysis Summary</h2>
                <div class="summary-stats" id="summaryStats"></div>
            </div>
        </div>

        <!-- Visualization Panel -->
        <div class="panel" id="visualizationPanel" style="display: none;">
            <h2>🎨 Interactive Schema Visualization</h2>
            <div id="visualizationContainer"></div>
        </div>

        <!-- Results Tabs -->
        <div id="resultsSection" style="display: none;">
            <div class="panel">
                <h2>📋 Analysis Results</h2>
                
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('vulnerabilities')">
                        🛡️ Security Vulnerabilities
                    </button>
                    <button class="tab" onclick="switchTab('optimizations')">
                        ⚡ Performance Optimizations
                    </button>
                    <button class="tab" onclick="switchTab('schema')">
                        📚 Schema Details
                    </button>
                </div>

                <div id="vulnerabilities" class="tab-content active">
                    <div class="results-grid" id="vulnerabilitiesGrid"></div>
                </div>

                <div id="optimizations" class="tab-content">
                    <div class="results-grid" id="optimizationsGrid"></div>
                </div>

                <div id="schema" class="tab-content">
                    <div class="results-grid" id="schemaGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load dependencies -->
    <script src="js/sql-schema-analyzer.js"></script>
    <script src="js/sql-visualizer.js"></script>
    
    <script>
        let analyzer;
        let visualizer;
        let currentReport;

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            analyzer = new SQLSchemaAnalyzer();
            console.log('✅ SQL Schema Analyzer initialized');
        });

        // Analyze schema function
        function analyzeSchema() {
            const sqlInput = document.getElementById('sqlInput').value.trim();
            
            if (!sqlInput) {
                alert('Please enter SQL schema statements');
                return;
            }

            // Show loading
            document.getElementById('loadingIndicator').classList.add('active');
            hideResults();

            // Simulate processing time for better UX
            setTimeout(() => {
                try {
                    // Parse schema
                    analyzer.parseSchema(sqlInput);
                    
                    // Run analysis
                    analyzer.analyzeSecurityVulnerabilities();
                    analyzer.analyzePerformanceOptimizations();
                    analyzer.extractRelationships();
                    
                    // Get report
                    currentReport = analyzer.getAnalysisReport();
                    
                    // Display results
                    displayResults(currentReport);
                    
                    // Hide loading
                    document.getElementById('loadingIndicator').classList.remove('active');
                    
                    console.log('Analysis complete:', currentReport);
                } catch (error) {
                    console.error('Analysis error:', error);
                    alert('Error analyzing schema. Please check your SQL syntax.');
                    document.getElementById('loadingIndicator').classList.remove('active');
                }
            }, 1500);
        }

        // Display results
        function displayResults(report) {
            // Show summary
            displaySummary(report.summary);
            
            // Show visualization
            displayVisualization(report);
            
            // Show detailed results
            displayVulnerabilities(report.vulnerabilities);
            displayOptimizations(report.optimizations);
            displaySchemaDetails(report.schemas);
            
            // Show sections
            document.getElementById('summarySection').style.display = 'block';
            document.getElementById('visualizationPanel').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'block';
            
            // Scroll to results
            document.getElementById('summarySection').scrollIntoView({ behavior: 'smooth' });
        }

        // Display summary stats
        function displaySummary(summary) {
            const summaryStats = document.getElementById('summaryStats');
            summaryStats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${summary.totalTables}</div>
                    <div class="stat-label">Tables</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${summary.totalColumns}</div>
                    <div class="stat-label">Columns</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${summary.totalIndexes}</div>
                    <div class="stat-label">Indexes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${summary.criticalVulnerabilities}</div>
                    <div class="stat-label">Critical Issues</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${summary.highPriorityOptimizations}</div>
                    <div class="stat-label">High Priority Optimizations</div>
                </div>
            `;
        }

        // Display visualization
        function displayVisualization(report) {
            const container = document.getElementById('visualizationContainer');
            container.innerHTML = ''; // Clear previous content
            
            // Create bubble map
            visualizer = new SQLVisualizer('visualizationContainer');
            visualizer.createBubbleMap(report.schemas, report.relationships);
            
            // Create workflow visualization
            visualizer.createWorkflowVisualization(report.optimizations);
        }

        // Display vulnerabilities
        function displayVulnerabilities(vulnerabilities) {
            const grid = document.getElementById('vulnerabilitiesGrid');
            
            if (vulnerabilities.length === 0) {
                grid.innerHTML = '<div class="result-card low"><h3>✅ No vulnerabilities detected</h3><p>Your schema follows security best practices!</p></div>';
                return;
            }
            
            grid.innerHTML = vulnerabilities.map(vuln => `
                <div class="result-card ${vuln.severity.toLowerCase()}">
                    <h3>
                        <span class="badge ${vuln.severity.toLowerCase()}">${vuln.severity}</span>
                        ${vuln.type.replace(/_/g, ' ')}
                    </h3>
                    <p><strong>Table:</strong> ${vuln.table}</p>
                    ${vuln.column ? `<p><strong>Column:</strong> ${vuln.column}</p>` : ''}
                    <p><strong>Issue:</strong> ${vuln.description}</p>
                    <p><strong>💡 Recommendation:</strong> ${vuln.recommendation}</p>
                </div>
            `).join('');
        }

        // Display optimizations
        function displayOptimizations(optimizations) {
            const grid = document.getElementById('optimizationsGrid');
            
            if (optimizations.length === 0) {
                grid.innerHTML = '<div class="result-card low"><h3>✅ Schema is well optimized</h3><p>No performance improvements needed at this time.</p></div>';
                return;
            }
            
            grid.innerHTML = optimizations.map(opt => `
                <div class="result-card ${opt.priority.toLowerCase()}">
                    <h3>
                        <span class="badge ${opt.priority.toLowerCase()}">${opt.priority}</span>
                        ${opt.type.replace(/_/g, ' ')}
                    </h3>
                    <p><strong>Table:</strong> ${opt.table}</p>
                    ${opt.columns ? `<p><strong>Columns:</strong> ${opt.columns.join(', ')}</p>` : ''}
                    <p><strong>Issue:</strong> ${opt.description}</p>
                    <p><strong>💡 Recommendation:</strong> ${opt.recommendation}</p>
                    <p><strong>📈 Impact:</strong> ${opt.estimatedImpact}</p>
                </div>
            `).join('');
        }

        // Display schema details
        function displaySchemaDetails(schemas) {
            const grid = document.getElementById('schemaGrid');
            
            grid.innerHTML = schemas.map(table => `
                <div class="result-card low">
                    <h3>📋 ${table.name}</h3>
                    <p><strong>Columns:</strong> ${table.columns.length}</p>
                    <p><strong>Indexes:</strong> ${table.indexes.length}</p>
                    <p><strong>Constraints:</strong> ${table.constraints.length}</p>
                    <details style="margin-top: 10px;">
                        <summary style="cursor: pointer; color: #4cc9f0;">View Details</summary>
                        <div style="margin-top: 10px;">
                            <strong>Column List:</strong>
                            <ul style="margin-left: 20px; margin-top: 5px;">
                                ${table.columns.map(col => `
                                    <li>${col.name} (${col.type}${col.size ? `(${col.size})` : ''})
                                        ${col.primaryKey ? ' 🔑' : ''}
                                        ${col.unique ? ' ⭐' : ''}
                                        ${!col.nullable ? ' ⚡' : ''}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </details>
                </div>
            `).join('');
        }

        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
        }

        // Load example schema
        function loadExample() {
            const exampleSQL = `CREATE TABLE users (
    id INT PRIMARY KEY AUTO_INCREMENT,
    username VARCHAR(50) NOT NULL UNIQUE,
    password VARCHAR(255) NOT NULL,
    email VARCHAR(100) NOT NULL UNIQUE,
    ssn VARCHAR(11),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
);

CREATE TABLE products (
    id INT PRIMARY KEY AUTO_INCREMENT,
    name VARCHAR(200) NOT NULL,
    description TEXT,
    price DECIMAL(10,2) NOT NULL,
    stock INT DEFAULT 0,
    category_id INT,
    INDEX idx_category (category_id)
);

CREATE TABLE orders (
    id INT PRIMARY KEY AUTO_INCREMENT,
    user_id INT NOT NULL,
    total_amount DECIMAL(10,2) NOT NULL,
    status VARCHAR(20) DEFAULT 'pending',
    order_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    FOREIGN KEY (user_id) REFERENCES users(id)
);

CREATE TABLE order_items (
    id INT PRIMARY KEY AUTO_INCREMENT,
    order_id INT NOT NULL,
    product_id INT NOT NULL,
    quantity INT NOT NULL,
    price DECIMAL(10,2) NOT NULL,
    FOREIGN KEY (order_id) REFERENCES orders(id),
    FOREIGN KEY (product_id) REFERENCES products(id)
);

CREATE TABLE reviews (
    id INT PRIMARY KEY AUTO_INCREMENT,
    product_id INT NOT NULL,
    user_id INT NOT NULL,
    rating INT NOT NULL,
    comment TEXT,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    FOREIGN KEY (product_id) REFERENCES products(id),
    FOREIGN KEY (user_id) REFERENCES users(id)
);`;

            document.getElementById('sqlInput').value = exampleSQL;
            alert('Example schema loaded! Click "Analyze Schema" to see the magic ✨');
        }

        // Clear all
        function clearAll() {
            document.getElementById('sqlInput').value = '';
            hideResults();
        }

        // Hide results
        function hideResults() {
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('visualizationPanel').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
        }
    </script>
