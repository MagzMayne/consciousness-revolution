  <script>
    // --- Utilities ---
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const nowISO = () => new Date().toISOString();

    // Deterministic hashing utility (SHA-256 via SubtleCrypto)
    async function sha256Hex(str) {
      const enc = new TextEncoder().encode(str);
      const digest = await crypto.subtle.digest('SHA-256', enc);
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // --- Service Worker registration (for offline) ---
    (function registerSW() {
      const swCode = `
        self.addEventListener('install', e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { self.clients.claim(); });
        // Basic offline pass-through; extend with caching if desired.
        self.addEventListener('fetch', () => {});
      `;
      // Inline service worker via Blob
      if ('serviceWorker' in navigator) {
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    })();

    // --- OPFS Storage Layer ---
    const OPFS = (() => {
      let root;
      async function init() {
        if (!root) {
          root = await navigator.storage.getDirectory();
          // Create app folder
          root = await root.getDirectoryHandle('dev-value-hub', { create: true });
        }
        return root;
      }
      async function getFileHandle(path, create = true) {
        const parts = path.split('/').filter(Boolean);
        let dir = await init();
        for (let i = 0; i < parts.length - 1; i++) {
          dir = await dir.getDirectoryHandle(parts[i], { create });
        }
        return dir.getFileHandle(parts.at(-1), { create });
      }
      async function writeJSON(path, obj) {
        const fh = await getFileHandle(path, true);
        const ws = await fh.createWritable();
        await ws.write(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
        await ws.close();
      }
      async function readJSON(path, def = null) {
        try {
          const fh = await getFileHandle(path, false);
          const f = await fh.getFile();
          const text = await f.text();
          return JSON.parse(text);
        } catch { return def; }
      }
      async function appendText(path, text) {
        const prev = await readText(path, '');
        const fh = await getFileHandle(path, true);
        const ws = await fh.createWritable();
        await ws.write(prev + text);
        await ws.close();
      }
      async function readText(path, def = '') {
        try {
          const fh = await getFileHandle(path, false);
          const f = await fh.getFile();
          return await f.text();
        } catch { return def; }
      }
      return { writeJSON, readJSON, appendText, readText };
    })();

    // --- Hash-chained Audit Log ---
    const Audit = (() => {
      async function append(entry) {
        const prev = await OPFS.readText('audit/log.txt', '');
        const prevHash = prev ? (prev.trim().split('\n').pop().split(' | ').at(-1) || '') : '';
        const payload = JSON.stringify(entry);
        const thisHash = await sha256Hex(payload + prevHash);
        const line = `${nowISO()} | ${payload} | ${thisHash}\n`;
        await OPFS.appendText('audit/log.txt', line);
      }
      return { append };
    })();

    // --- Event Bus (local pub/sub) ---
    const Bus = (() => {
      const subs = new Map();
      function on(topic, fn) {
        if (!subs.has(topic)) subs.set(topic, new Set());
        subs.get(topic).add(fn);
        return () => subs.get(topic)?.delete(fn);
      }
      async function emit(topic, data) {
        const set = subs.get(topic);
        if (!set) return;
        for (const fn of set) {
          try { await fn(data); } catch (e) { console.error('Bus handler error', e); }
        }
      }
      return { on, emit };
    })();

    // --- Parameter Store (deterministic, versioned) ---
    const Params = {
      version: 1,
      t_char_ms: 25,   // default per-character typing time (ms)
      alpha: 0.35,     // overhead factor
      beta: 0.25,      // complexity factor
      gamma: 0.15,     // novelty bonus factor
      k_value_per_ms: 0.002, // base value per ms of effective time (abstract units)
      nonsense_threshold: 0.35, // minimum quality score to include
      linkage: { lambda_in: 0.08, lambda_out: 0.05, lambda_collab: 0.12 }
    };

    // --- Mock Ingestion (Replace with real GitHub ingestion) ---
    // For a working demo: we simulate repos/projects/ideas locally.
    const Ingestor = (() => {
      function demoData() {

            },

      }
      async function sync() {
        const data = demoData();
        await OPFS.writeJSON('data/snapshot.json', data);
        await Audit.append({ type: 'ingest', source: 'demo', items: {
          devs: data.developers.length,
          projects: data.projects.length,
          ideas: data.ideas.length
        }});
        return data;
      }
      async function load() {
        const data = await OPFS.readJSON('data/snapshot.json', null);
        return data || demoData();
      }
      return { sync, load };
    })();

    // --- Metrics & Valuation ---
    function qualityScore(q) {
      // Weighted aggregation; normalize to [0,1]
      const weights = { lint: 0.25, tests: 0.30, docs: 0.20, runtime: 0.25 };
      const score =
        q.lint * weights.lint +
        q.tests * weights.tests +
        q.docs * weights.docs +
        q.runtime * weights.runtime;
      return Math.max(0, Math.min(1, score));
    }

    function complexityScore(c) {
      // Simple normalized complexity: cyclomatic + nesting influence
      const cycloNorm = Math.min(1, c.cyclomatic / 40);
      const nestingNorm = Math.min(1, c.nesting / 5);
      const filesNorm = Math.min(1, c.files / 25);
      return (cycloNorm * 0.6) + (nestingNorm * 0.25) + (filesNorm * 0.15);
    }

    function linkageFactor(lk) {
      const { lambda_in, lambda_out, lambda_collab } = Params.linkage;
      return 1 +
        (lambda_in * lk.in) +
        (lambda_out * lk.out) +
        (lambda_collab * lk.collab);
    }

    function completionPercent(comp) {
      const planned = Math.max(1, comp.planned_units || 1);
      const done = Math.min(planned, Math.max(0, comp.done_units || 0));
      const base = Math.round((done / planned) * 100);
      // Confidence modifier: milestones + velocity
      const confBoost = (comp.has_milestones ? 5 : 0) + Math.round((comp.velocity || 0) * 5);
      return Math.min(100, base + confBoost);
    }

    function effectiveTimeMs(chars, cScore, novelty) {
      const T_chars = chars * Params.t_char_ms;
      const T_over = Params.alpha * T_chars;
      const T_complex = Params.beta * cScore * T_chars;
      const T_reuse = Params.gamma * novelty * T_chars;
      return T_chars + T_over + T_complex + T_reuse;
    }

    function valueFromTime(timeMs, qScore, lkFactor) {
      const base = timeMs * Params.k_value_per_ms;
      return base * (0.5 + qScore / 2) * lkFactor; // quality scales 0.5–1.0 multiplier
    }

    function classifyNonsense(qScore) {
      return qScore < Params.nonsense_threshold;
    }

    function valuate(item) {
      const q = qualityScore(item.quality);
      const c = complexityScore(item.complexity);
      const lk = linkageFactor(item.linkage);
      const tMs = effectiveTimeMs(item.chars, c, item.novelty);
      const val = valueFromTime(tMs, q, lk);
      const nonsense = classifyNonsense(q);
      return {
        qScore: q, cScore: c, lkFactor: lk,
        timeMs: Math.round(tMs),
        value: Math.round(val),
        nonsense
      };
    }

    function aggregateByDeveloper(data) {
      const devMap = new Map(data.developers.map(d => [d.id, { ...d, value: 0, projects: [], ideas: [] }]));
      for (const p of data.projects) {
        const v = valuate(p);
        if (!v.nonsense) {
          const dev = devMap.get(p.owner);
          if (dev) {
            dev.value += v.value;
            dev.projects.push({ ...p, metrics: v });
          }
        }
      }
      for (const i of data.ideas) {
        const v = valuate(i);
        if (!v.nonsense) {
          const dev = devMap.get(i.owner);
          if (dev) {
            dev.value += Math.round(v.value * 0.6); // ideas count less than projects
            dev.ideas.push({ ...i, metrics: v });
          }
        }
      }
      return [...devMap.values()].sort((a,b) => b.value - a.value);
    }

    // --- Calibration: measure t_char_ms by typing test (simple) ---
    async function runCalibration() {
      const sample = "def value(x):\n    return x * 2  # calibrate\n";
      alert("Calibration: you'll type a short snippet to estimate typing speed.\n\nYou'll see the text, then type it exactly into the prompt.");
      await sleep(250);
      const start = performance.now();
      const input = prompt("Type exactly:\n\n" + sample);
      const end = performance.now();
      const durationMs = end - start;
      if (!input || input !== sample) {
        alert("Calibration canceled or mismatch. Keeping defaults.");
        return Params.t_char_ms;
      }
      const chars = sample.length;
      const tChar = durationMs / chars;
      // Clamp to reasonable bounds (5–120 ms/char)
      const clamped = Math.max(5, Math.min(120, Math.round(tChar)));
      Params.t_char_ms = clamped;
      await Audit.append({ type: 'calibration', t_char_ms: clamped, durationMs, chars });
      updateParamChips();
      return clamped;
    }

    // --- UI Rendering ---
    function setStatus(text) {
      const badge = document.getElementById('statusBadge');
      badge.textContent = text;
    }

    function updateCounts(data) {
      document.getElementById('projectCount').textContent = data.projects.length;
      document.getElementById('ideaCount').textContent = data.ideas.length;
    }

    function updateParamChips() {
      document.getElementById('typingSpeedChip').textContent = `t_char: ${Params.t_char_ms} ms`;
      document.getElementById('alphaChip').textContent = `α overhead: ${Params.alpha}`;
      document.getElementById('betaChip').textContent = `β complexity: ${Params.beta}`;
      document.getElementById('gammaChip').textContent = `γ novelty: ${Params.gamma}`;
    }

    function renderHub(data) {
      const grid = document.getElementById('hubGrid');
      grid.innerHTML = '';

      const items = [
        ...data.projects.map(p => ({ kind: 'project', item: p })),
        ...data.ideas.map(i => ({ kind: 'idea', item: i }))
      ].sort((a,b) => new Date(b.item.updated) - new Date(a.item.updated));

      for (const { kind, item } of items) {
        const m = valuate(item);
        const comp = completionPercent(item.completion);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">${item.name} <span class="chip">${kind}</span></div>
            <div class="chips">
              <span class="chip">${item.language}</span>
              <span class="chip">${item.chars} chars</span>
              <span class="chip">q=${m.qScore.toFixed(2)}</span>
              <span class="chip">c=${m.cScore.toFixed(2)}</span>
              <span class="chip">lk=${m.lkFactor.toFixed(2)}</span>
            </div>
          </div>
          <div class="meta">
            <div>Updated: ${new Date(item.updated).toLocaleString()}</div>
            <div>Owner: ${item.owner}</div>
          </div>
          <div class="row">
            <div>Value</div>
            <div class="value ${m.nonsense ? 'bad' : (m.qScore < 0.5 ? 'low' : '')}">${m.nonsense ? 'Excluded (nonsense)' : m.value}</div>
          </div>
          <div class="row">
            <div>Completion</div>
            <div style="min-width:120px">${comp}%</div>
          </div>
          <div class="progress" aria-label="Completion progress">
            <span style="width:${comp}%"></span>
          </div>
        `;
        grid.appendChild(card);
      }
    }

        row.innerHTML = `
          <div class="card-header">
            <div class="card-title">#${i+1} ${d.name}</div>
            <div class="value">${d.value}</div>
          </div>
          <div class="meta">
            <div>Projects: ${d.projects.length}</div>
            <div>Ideas: ${d.ideas.length}</div>
          </div>
        `;
        el.appendChild(row);
      }
    }

    // --- Export Snapshot (audit + data + params) ---
    async function exportSnapshot() {
      const data = await Ingestor.load();
      const audit = await OPFS.readText('audit/log.txt', '');
      const payload = {
        exportedAt: nowISO(),
        params: Params,
        data,
        audit
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `dev-value-hub-${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      await Audit.append({ type: 'export', bytes: blob.size });
    }

    // --- Reset local state ---
    async function resetState() {
      // Overwrite files with empty; OPFS has no easy recursive delete here
      await OPFS.writeJSON('data/snapshot.json', { developers: [], projects: [], ideas: [] });
      await OPFS.appendText('audit/log.txt', '');
      await Audit.append({ type: 'reset' });
      await refresh();
    }

    // --- Refresh pipeline ---
    async function refresh({ resync = false } = {}) {
      setStatus(resync ? 'Syncing…' : 'Refreshing…');
      const data = resync ? await Ingestor.sync() : await Ingestor.load();
      updateCounts(data);
      renderHub(data);
      const devs = aggregateByDeveloper(data);
      renderLeaderboard(devs);
      document.getElementById('lastSync').textContent = new Date().toLocaleString();
      setStatus('Idle');
    }

    // --- Wire up controls ---
    document.getElementById('btnSync').addEventListener('click', () => refresh({ resync: true }));
    document.getElementById('btnCalibrate').addEventListener('click', () => runCalibration());
    document.getElementById('btnExport').addEventListener('click', () => exportSnapshot());
    document.getElementById('btnReset').addEventListener('click', () => resetState());

    // Initial load
    (async function boot() {
      updateParamChips();
      await Audit.append({ type: 'boot', ua: navigator.userAgent });
      await refresh();
    })();

    // Optional: background gentle refresh (every 60s)
    setInterval(() => refresh({ resync: false }), 60000);
  </script>
