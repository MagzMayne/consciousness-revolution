<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-8589B67A">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Dashboard - Consciousness Revolution</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #00f0ff, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,240,255,0.3);
            border-radius: 12px;
            padding: 15px 25px;
            text-align: center;
            min-width: 120px;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #00f0ff;
        }
        .stat-label { font-size: 0.85em; opacity: 0.7; }
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(0,240,255,0.2);
            border-color: #00f0ff;
        }
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .user-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }
        .user-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0,240,255,0.5);
        }
        .user-card.needs-review {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245,158,11,0.2);
        }
        .user-card.verified {
            border-color: #22c55e;
        }
        .user-card.rejected {
            border-color: #ef4444;
            opacity: 0.6;
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-name {
            font-size: 1.2em;
            font-weight: bold;
        }
        .user-score {
            background: linear-gradient(135deg, #00f0ff, #8b5cf6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .verdict-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-right: 8px;
        }
        .verdict-badge.BUILDER { background: #22c55e; color: #000; }
        .verdict-badge.SUSPICIOUS { background: #f59e0b; color: #000; }
        .verdict-badge.DESTROYER { background: #ef4444; color: #fff; }
        .verdict-badge.NEEDS_REVIEW { background: #6366f1; color: #fff; }
        .trinity-badge {
            background: rgba(139,92,246,0.3);
            border: 1px solid #8b5cf6;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
        }
        .responses {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            font-size: 0.9em;
        }
        .response-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .response-item:last-child { border: none; margin: 0; padding: 0; }
        .response-question {
            color: #00f0ff;
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 4px;
        }
        .response-answer {
            color: #ccc;
            line-height: 1.4;
        }
        .flags {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        .flags-title {
            color: #ef4444;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .flag-item {
            font-size: 0.85em;
            padding: 2px 0;
            color: #fca5a5;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .action-btn:hover { transform: scale(1.02); }
        .action-btn.approve {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
        }
        .action-btn.reject {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .action-btn.promote {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #00f0ff, #0ea5e9);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px auto;
            display: block;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #22c55e;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { background: #ef4444; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/dashboard-enhancements.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>Verification Dashboard</h1>
        <p>Semi-Automated Member Verification Pipeline</p>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-number" id="pending-count">-</div>
            <div class="stat-label">Pending Review</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="verified-count">-</div>
            <div class="stat-label">Verified</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="rejected-count">-</div>
            <div class="stat-label">Rejected</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="total-count">-</div>
            <div class="stat-label">Total Members</div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-filter="pending_review">Needs Review</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="verified">Verified</button>
        <button class="filter-btn" data-filter="rejected">Rejected</button>
        <button class="filter-btn" data-filter="all">All</button>
    </div>

    <button class="refresh-btn" onclick="loadUsers()">Refresh</button>

    <div class="users-grid" id="users-grid">
        <div class="loading">Loading verification queue...</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '/.netlify/functions/discord-verification';
        let currentFilter = 'pending_review';

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadUsers();
            });
        });

        async function loadUsers() {
            const grid = document.getElementById('users-grid');
            grid.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const response = await fetch(`${API_BASE}?status=${currentFilter}`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load');
                }

                // Update stats
                updateStats(data);

                if (!data.users || data.users.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No users found for this filter.</div>';
                    return;
                }

                grid.innerHTML = data.users.map(user => renderUserCard(user)).join('');

            } catch (error) {
                grid.innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
            }
        }

        function renderUserCard(user) {
            const analysis = user.verification_analysis || {};
            const responses = user.verification_responses || {};
            const patternAnalysis = analysis.patternAnalysis || {};
            const flags = patternAnalysis.flags || [];
            const verdict = analysis.finalVerdict || 'UNKNOWN';
            const trinityFit = analysis.trinityFit || 'UNKNOWN';
            const score = user.builder_score || 0;

            const statusClass = user.verification_status === 'verified' ? 'verified' :
                               user.verification_status === 'rejected' ? 'rejected' :
                               'needs-review';

            return `
                <div class="user-card ${statusClass}" data-user-id="${user.user_id}">
                    <div class="user-header">
                        <span class="user-name">${user.username || 'Unknown'}</span>
                        <span class="user-score">${score}%</span>
                    </div>

                    <div>
                        <span class="verdict-badge ${verdict}">${verdict}</span>
                        ${trinityFit !== 'UNKNOWN' ? `<span class="trinity-badge">${trinityFit.replace('_', ' ')}</span>` : ''}
                    </div>

                    ${responses.whoAreYou ? `
                        <div class="responses">
                            <div class="response-item">
                                <div class="response-question">WHO ARE YOU?</div>
                                <div class="response-answer">${escapeHtml(responses.whoAreYou)}</div>
                            </div>
                            <div class="response-item">
                                <div class="response-question">WHY HERE?</div>
                                <div class="response-answer">${escapeHtml(responses.whyHere)}</div>
                            </div>
                            <div class="response-item">
                                <div class="response-question">MISSION?</div>
                                <div class="response-answer">${escapeHtml(responses.mission)}</div>
                            </div>
                        </div>
                    ` : '<div class="responses"><em>No responses recorded</em></div>'}

                    ${user.social_links && user.social_links.count > 0 ? `
                        <div class="socials" style="background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.3); border-radius: 8px; padding: 10px; margin: 10px 0;">
                            <div style="color: #8b5cf6; font-size: 0.8em; font-weight: bold; margin-bottom: 5px;">SOCIAL LINKS (${user.social_links.count})</div>
                            ${user.social_links.twitter ? `<div style="font-size: 0.85em; padding: 2px 0;">🐦 Twitter: <a href="https://twitter.com/${user.social_links.twitter}" target="_blank" style="color: #00f0ff;">@${user.social_links.twitter}</a></div>` : ''}
                            ${user.social_links.instagram ? `<div style="font-size: 0.85em; padding: 2px 0;">📸 Instagram: <a href="https://instagram.com/${user.social_links.instagram}" target="_blank" style="color: #00f0ff;">@${user.social_links.instagram}</a></div>` : ''}
                            ${user.social_links.linkedin ? `<div style="font-size: 0.85em; padding: 2px 0;">💼 LinkedIn: <a href="https://linkedin.com/in/${user.social_links.linkedin}" target="_blank" style="color: #00f0ff;">${user.social_links.linkedin}</a></div>` : ''}
                            ${user.social_links.github ? `<div style="font-size: 0.85em; padding: 2px 0;">💻 GitHub: <a href="https://github.com/${user.social_links.github}" target="_blank" style="color: #00f0ff;">${user.social_links.github}</a></div>` : ''}
                            ${user.social_links.youtube ? `<div style="font-size: 0.85em; padding: 2px 0;">📺 YouTube: <a href="https://youtube.com/@${user.social_links.youtube}" target="_blank" style="color: #00f0ff;">${user.social_links.youtube}</a></div>` : ''}
                            ${user.social_links.tiktok ? `<div style="font-size: 0.85em; padding: 2px 0;">🎵 TikTok: <a href="https://tiktok.com/@${user.social_links.tiktok}" target="_blank" style="color: #00f0ff;">@${user.social_links.tiktok}</a></div>` : ''}
                            ${user.social_links.website ? `<div style="font-size: 0.85em; padding: 2px 0;">🌐 Website: <a href="${user.social_links.website}" target="_blank" style="color: #00f0ff;">${user.social_links.website}</a></div>` : ''}
                        </div>
                    ` : ''}

                    ${flags.length > 0 ? `
                        <div class="flags">
                            <div class="flags-title">RED FLAGS (${flags.length})</div>
                            ${flags.map(f => `<div class="flag-item">- ${escapeHtml(f)}</div>`).join('')}
                        </div>
                    ` : ''}

                    ${analysis.aiReasoning ? `
                        <div style="font-size: 0.85em; color: #8b5cf6; margin: 10px 0;">
                            <strong>AI Analysis:</strong> ${escapeHtml(analysis.aiReasoning)}
                        </div>
                    ` : ''}

                    <div class="action-buttons">
                        <button class="action-btn approve" onclick="handleAction('${user.user_id}', 'approve')">Approve</button>
                        <button class="action-btn reject" onclick="handleAction('${user.user_id}', 'reject')">Reject</button>
                        <button class="action-btn promote" onclick="handleAction('${user.user_id}', 'promote')">Promote to BUILDER</button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function handleAction(userId, action) {
            try {
                const response = await fetch(API_BASE, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId,
                        action,
                        reviewedBy: 'Dashboard'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`User ${action}d successfully!`);
                    // Remove card or reload
                    loadUsers();
                } else {
                    showToast(`Error: ${data.error}`, true);
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function updateStats(data) {
            // For now, just show counts from current filter
            // In production, you'd fetch all statuses
            document.getElementById('pending-count').textContent = data.count || '0';
        }

        // Initial load
        loadUsers();

        // Auto-refresh every 30 seconds
        setInterval(loadUsers, 30000);
    </script>
</body>
</html>
