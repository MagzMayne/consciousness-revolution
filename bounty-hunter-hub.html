    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #141420;
            --bg-card: #1a1a2e;
            --accent-primary: #00d4ff;
            --accent-secondary: #7b2cbf;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --accent-red: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b8b8b8;
            --border-color: rgba(0, 212, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            border-bottom: 2px solid var(--accent-primary);
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .filters {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .bounties-grid {
            display: grid;
            gap: 1.5rem;
        }

        .bounty-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .bounty-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
        }

        .bounty-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .bounty-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .bounty-reward {
            background: linear-gradient(135deg, var(--accent-gold), #ff9900);
            color: var(--bg-primary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .bounty-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .bounty-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-secondary);
            color: var(--accent-secondary);
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        .bounty-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-open {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-claimed {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
        }

        .status-completed {
            background: rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        .difficulty {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .difficulty-easy {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
        }

        .difficulty-medium {
            background: rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
        }

        .difficulty-hard {
            background: rgba(255, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .bounty-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--text-primary);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-secondary:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            color: var(--accent-primary);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--accent-red);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .bounty-header {
                flex-direction: column;
                gap: 1rem;
            }

            .bounty-reward {
                align-self: flex-start;
            }

            .bounty-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>

</head>
<body>
    <div class="header">
        <h1>💰 Bounty Hunter Hub</h1>
        <p>Find and claim bounties for remote development work. Earn money solving real technical challenges.</p>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalBounties">0</div>
                <div class="stat-label">Active Bounties</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRewards">$0</div>
                <div class="stat-label">Total Rewards</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgReward">$0</div>
                <div class="stat-label">Average Bounty</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedBounties">0</div>
                <div class="stat-label">Completed This Month</div>

        <div class="filters">
            <h3 style="margin-bottom: 1rem; color: var(--accent-primary);">🔍 Filter Bounties</h3>
            <div class="filter-row">
                <div class="filter-group">
                    <label>Category</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="frontend">Frontend</option>
                        <option value="backend">Backend</option>
                        <option value="fullstack">Full Stack</option>
                        <option value="ai">AI/ML</option>
                        <option value="blockchain">Blockchain</option>
                        <option value="bug">Bug Fix</option>
                        <option value="feature">Feature</option>
                        <option value="documentation">Documentation</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Difficulty</label>
                    <select id="difficultyFilter">
                        <option value="">All Levels</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select id="statusFilter">
                        <option value="open">Open</option>
                        <option value="claimed">Claimed</option>
                        <option value="completed">Completed</option>
                        <option value="">All Statuses</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Sort By</label>
                    <select id="sortFilter">
                        <option value="reward-desc">Highest Reward</option>
                        <option value="reward-asc">Lowest Reward</option>

        <div class="bounties-grid" id="bountiesGrid">

    <!-- Claim Bounty Modal -->
    <div class="modal" id="claimModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Claim Bounty</h2>
                <button class="close-btn" onclick="closeModal('claimModal')">&times;</button>
            </div>
            <div id="claimModalContent">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Bounty Details</h2>
                <button class="close-btn" onclick="closeModal('detailsModal')">&times;</button>
            </div>
            <div id="detailsModalContent">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <script>
        // Sample bounty data (will be loaded from bounties.json in production)
        let bounties = [
            {
                id: 1,
                title: "Add Dark Mode Toggle to All Dashboards",
                description: "Implement a persistent dark mode toggle that works across all 78 dashboard files. Should save preference to localStorage and apply consistently.",
                reward: 150,
                category: "frontend",
                difficulty: "medium",
                status: "open",
                tags: ["CSS", "JavaScript", "UI/UX"],
                estimatedTime: "8-12 hours",
                requirements: [
                    "Add toggle switch to dashboard headers",
                    "Implement CSS variables for theme switching",
                    "Save preference to localStorage",
                    "Test across all dashboards"
                ],
                posted: "2026-02-18",
                deadline: "2026-03-01"
            },
            {
                id: 2,
                title: "PayPal Integration for Bounty Payouts",
                description: "Integrate automated PayPal payouts for completed bounties. Should use existing PayPal utilities and handle payment tracking.",
                reward: 300,
                category: "backend",
                difficulty: "hard",
                status: "open",
                tags: ["PayPal API", "JavaScript", "Payment Processing"],
                estimatedTime: "16-24 hours",
                requirements: [
                    "Integrate with PayPal REST API",
                    "Create payout workflow",
                    "Add payment tracking/logging",
                    "Handle errors and retries"
                ],
                posted: "2026-02-17",
                deadline: "2026-03-05"
            },
            {
                id: 3,
                title: "Create Mobile-Responsive Navigation",
                description: "Build a hamburger menu system that works across all pages. Should be touch-friendly and accessible.",
                reward: 100,
                category: "frontend",
                difficulty: "easy",
                status: "open",
                tags: ["HTML", "CSS", "Mobile"],
                estimatedTime: "4-6 hours",
                requirements: [
                    "Create hamburger menu component",
                    "Add smooth animations",
                    "Test on mobile devices",
                    "Ensure accessibility"
                ],
                posted: "2026-02-19",
                deadline: "2026-02-28"
            },
            {
                id: 4,
                title: "AI Integration for Bounty Matching",
                description: "Build an AI system that matches developers to bounties based on skills and past work.",
                reward: 500,
                category: "ai",
                difficulty: "hard",
                status: "open",
                tags: ["AI/ML", "JavaScript", "Recommendation System"],
                estimatedTime: "24-32 hours",
                requirements: [
                    "Design matching algorithm",
                    "Integrate with developer profiles",
                    "Train on historical data",
                    "Build recommendation UI"
                ],
                posted: "2026-02-15",
                deadline: "2026-03-15"
            },
            {
                id: 5,
                title: "Fix Blockchain Wallet Connection Issues",
                description: "Debug and fix intermittent wallet connection failures on BankSky and other blockchain projects.",
                reward: 200,
                category: "blockchain",
                difficulty: "medium",
                status: "claimed",
                tags: ["Web3", "Solana", "Ethereum", "Debugging"],
                estimatedTime: "10-15 hours",
                requirements: [
                    "Reproduce connection issues",
                    "Identify root causes",
                    "Implement fixes",
                    "Test across browsers"
                ],
                posted: "2026-02-16",
                deadline: "2026-03-02",
                claimedBy: "dev123"
            },
            {
                id: 6,
                title: "Write API Documentation for All Endpoints",
                description: "Document all backend API endpoints with examples, parameters, and response formats.",
                reward: 75,
                category: "documentation",
                difficulty: "easy",
                status: "open",
                tags: ["Documentation", "API", "Markdown"],
                estimatedTime: "6-8 hours",
                requirements: [
                    "Document all endpoints",
                    "Add code examples",
                    "Include error responses",
                    "Create interactive examples"
                ],
                posted: "2026-02-18",
                deadline: "2026-03-10"
            }
        ];

        // Initialize on load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadBounties();
            renderBounties();
            updateStats();
            setupFilters();
        });

        // Load bounties from JSON file
        async function loadBounties() {
            try {
                const response = await fetch('/bounties.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data.bounties && data.bounties.length > 0) {
                        bounties = data.bounties;
                    }
                }
            } catch (error) {
                console.log('Using default bounties data');
            }
        }

        function renderBounties() {
            const grid = document.getElementById('bountiesGrid');
            const categoryFilter = document.getElementById('categoryFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const sortFilter = document.getElementById('sortFilter').value;

            // Filter bounties
            let filtered = bounties.filter(bounty => {
                if (categoryFilter && bounty.category !== categoryFilter) return false;
                if (difficultyFilter && bounty.difficulty !== difficultyFilter) return false;
                if (statusFilter && bounty.status !== statusFilter) return false;
                return true;
            });

            // Sort bounties
            filtered.sort((a, b) => {
                switch(sortFilter) {
                    case 'reward-desc':
                        return b.reward - a.reward;
                    case 'reward-asc':
                        return a.reward - b.reward;
                    case 'date-desc':
                        return new Date(b.posted) - new Date(a.posted);
                    case 'date-asc':
                        return new Date(a.posted) - new Date(b.posted);
                    default:
                        return 0;
                }
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No bounties found</h3>
                        <p>Try adjusting your filters or check back later for new opportunities.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(bounty => `
                <div class="bounty-card">
                    <div class="bounty-header">
                        <div>
                            <div class="bounty-title">${bounty.title}</div>
                            <span class="status-badge status-${bounty.status}">${bounty.status.toUpperCase()}</span>
                            <span class="difficulty difficulty-${bounty.difficulty}" style="margin-left: 0.5rem;">${bounty.difficulty.toUpperCase()}</span>
                        </div>
                        <div class="bounty-reward">$${bounty.reward}</div>
                    </div>
                    <div class="bounty-description">${bounty.description}</div>
                    <div class="bounty-tags">
                        ${bounty.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="bounty-meta">
                        <div class="meta-item">⏱️ ${bounty.estimatedTime}</div>
                        <div class="meta-item">📅 Posted: ${bounty.posted}</div>
                        <div class="meta-item">⏳ Deadline: ${bounty.deadline}</div>
                    </div>
                    <div class="bounty-actions">
                        ${bounty.status === 'open' ? 
                            `<button class="btn btn-primary" onclick="claimBounty(${bounty.id})">💰 Claim Bounty</button>` :
                            `<button class="btn btn-secondary" disabled>Already Claimed</button>`
                        }
                        <button class="btn btn-secondary" onclick="viewDetails(${bounty.id})">View Details</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const openBounties = bounties.filter(b => b.status === 'open');
            const totalRewards = openBounties.reduce((sum, b) => sum + b.reward, 0);
            const avgReward = openBounties.length > 0 ? Math.round(totalRewards / openBounties.length) : 0;
            const completed = bounties.filter(b => b.status === 'completed').length;

            document.getElementById('totalBounties').textContent = openBounties.length;
            document.getElementById('totalRewards').textContent = `$${totalRewards}`;
            document.getElementById('avgReward').textContent = `$${avgReward}`;
            document.getElementById('completedBounties').textContent = completed;
        }

        function setupFilters() {
            ['categoryFilter', 'difficultyFilter', 'statusFilter', 'sortFilter'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => {
                    renderBounties();
                });
            });
        }

        function claimBounty(id) {
            const bounty = bounties.find(b => b.id === id);
            if (!bounty) return;

            const modal = document.getElementById('claimModal');
            const content = document.getElementById('claimModalContent');

            content.innerHTML = `
                <h3>${bounty.title}</h3>
                <div class="bounty-reward" style="margin: 1rem 0;"">$${bounty.reward} Reward</div>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">${bounty.description}</p>
                
                <div style="background: var(--bg-secondary); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                    <h4 style="color: var(--accent-gold); margin-bottom: 0.5rem;">Requirements:</h4>
                    <ul style="color: var(--text-secondary); padding-left: 1.5rem;">
                        ${bounty.requirements.map(req => `<li>${req}</li>`).join('')}
                    </ul>
                </div>

                <div class="form-group">
                    <label>Your GitHub Username</label>
                    <input type="text" id="githubUsername" placeholder="e.g., yourname" required>
                </div>

                <div class="form-group">
                    <label>PayPal Email (for payment)</label>
                    <input type="email" id="paypalEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Brief Introduction & Why You're a Good Fit</label>
                    <textarea id="introduction" placeholder="Tell us about your experience with similar projects..." required></textarea>
                </div>

                <button class="btn btn-primary" onclick="submitClaim(${id})" style="width: 100%; margin-top: 1rem;">
                    Claim This Bounty
                </button>
            `;

            modal.classList.add('active');
        }

        function submitClaim(id) {
            const githubUsername = document.getElementById('githubUsername').value;
            const paypalEmail = document.getElementById('paypalEmail').value;
            const introduction = document.getElementById('introduction').value;

            if (!githubUsername || !paypalEmail || !introduction) {
                alert('Please fill in all fields');
                return;
            }

            // In production, this would send to backend
            console.log('Claiming bounty:', {
                bountyId: id,
                githubUsername,
                paypalEmail,
                introduction
            });

            // Update bounty status
            const bounty = bounties.find(b => b.id === id);
            if (bounty) {
                bounty.status = 'claimed';
                bounty.claimedBy = githubUsername;
            }

            closeModal('claimModal');
            renderBounties();
            updateStats();

            alert('Bounty claimed successfully! We\'ll review your application and get back to you within 24 hours.');
        }

        function viewDetails(id) {
            const bounty = bounties.find(b => b.id === id);
            if (!bounty) return;

            const modal = document.getElementById('detailsModal');
            const content = document.getElementById('detailsModalContent');

            content.innerHTML = `
                <h3>${bounty.title}</h3>
                <div class="bounty-reward" style="margin: 1rem 0;"">$${bounty.reward} Reward</div>
                
                <div style="margin-bottom: 1rem;">
                    <span class="status-badge status-${bounty.status}">${bounty.status.toUpperCase()}</span>
                    <span class="difficulty difficulty-${bounty.difficulty}" style="margin-left: 0.5rem;">${bounty.difficulty.toUpperCase()}</span>
                </div>

                <div class="bounty-tags" style="margin-bottom: 1rem;">
                    ${bounty.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>

                <h4 style="color: var(--accent-primary); margin-bottom: 0.5rem;">Description</h4>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">${bounty.description}</p>

                <h4 style="color: var(--accent-primary); margin-bottom: 0.5rem;">Requirements</h4>
                <ul style="color: var(--text-secondary); padding-left: 1.5rem; margin-bottom: 1rem;">
                    ${bounty.requirements.map(req => `<li>${req}</li>`).join('')}
                </ul>

                <div style="background: var(--bg-secondary); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <strong style="color: var(--accent-gold);">Estimated Time:</strong><br>
                            <span style="color: var(--text-secondary);">${bounty.estimatedTime}</span>
                        </div>
                        <div>
                            <strong style="color: var(--accent-gold);">Category:</strong><br>
                            <span style="color: var(--text-secondary);">${bounty.category}</span>
                        </div>
                        <div>
                            <strong style="color: var(--accent-gold);">Posted:</strong><br>
                            <span style="color: var(--text-secondary);">${bounty.posted}</span>
                        </div>
                        <div>
                            <strong style="color: var(--accent-gold);">Deadline:</strong><br>
                            <span style="color: var(--text-secondary);">${bounty.deadline}</span>
                        </div>
                    </div>
                </div>

                ${bounty.status === 'open' ? 
                    `<button class="btn btn-primary" onclick="closeModal('detailsModal'); claimBounty(${bounty.id});" style="width: 100%;">
                        💰 Claim This Bounty
                    </button>` :
                    `<div style="text-align: center; padding: 1rem; background: rgba(255, 215, 0, 0.1); border-radius: 8px;">
                        <strong style="color: var(--accent-gold);">This bounty has been claimed</strong>
                    </div>`
                }
            `;

            modal.classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Close modal on outside click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
