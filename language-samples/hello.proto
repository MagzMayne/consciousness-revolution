"""
Protocol Buffers sample for GitHub language detection
BarbrickDesign - Complete Language Portfolio
"""

syntax = "proto3";

package barbrickdesign;

option java_package = "com.barbrickdesign.proto";
option java_outer_classname = "LanguageProtos";

// Greeter service
service Greeter {
  rpc Greet(GreetRequest) returns (GreetResponse);
  rpc GetLanguages(Empty) returns (LanguageList);
}

// Request message
message GreetRequest {
  string name = 1;
  string language = 2;
}

// Response message
message GreetResponse {
  string message = 1;
  int64 timestamp = 2;
}

// Empty message
message Empty {}

// Language information
message LanguageInfo {
  string name = 1;
  string paradigm = 2;
  string typing = 3;
  repeated string features = 4;
  
  enum Category {
    UNKNOWN = 0;
    COMPILED = 1;
    INTERPRETED = 2;
    JIT = 3;
  }
  
  Category category = 5;
}

// List of languages
message LanguageList {
  repeated LanguageInfo languages = 1;
  int32 total_count = 2;
}

// Metadata
message Metadata {
  map<string, string> properties = 1;
  repeated string tags = 2;
}
