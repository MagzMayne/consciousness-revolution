# TOML sample for GitHub language detection
# BarbrickDesign - Complete Language Portfolio

[package]
name = "barbrickdesign-language-samples"
version = "1.0.0"
authors = ["BarbrickDesign <barbrickdesign@gmail.com>"]
edition = "2021"
description = "Complete programming language portfolio for GitHub language detection"
license = "MIT"
repository = "https://github.com/barbrickdesign/barbrickdesign.github.io"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.28", features = ["full"] }
axum = "0.6"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = ["cli"]
cli = []
web = ["axum"]

[[bin]]
name = "hello"
path = "src/main.rs"

[metadata]
language = "TOML"
paradigm = "Configuration"
typing = "Schema-based"

[metadata.info]
description = "Tom's Obvious, Minimal Language"
extensions = [".toml"]
use_cases = ["configuration", "manifests", "data"]
