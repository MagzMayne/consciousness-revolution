"""
GraphQL sample for GitHub language detection
BarbrickDesign - Complete Language Portfolio
"""

type Query {
  greeting(name: String!): String!
  languages(category: LanguageCategory): [Language!]!
  language(id: ID!): Language
}

type Mutation {
  createLanguage(input: CreateLanguageInput!): Language!
  updateLanguage(id: ID!, input: UpdateLanguageInput!): Language!
  deleteLanguage(id: ID!): Boolean!
}

type Subscription {
  languageAdded: Language!
  languageUpdated(id: ID!): Language!
}

enum LanguageCategory {
  COMPILED
  INTERPRETED
  JIT
  HYBRID
}

enum TypingSystem {
  STATIC
  DYNAMIC
  GRADUAL
}

interface ProgrammingEntity {
  id: ID!
  name: String!
  createdAt: DateTime!
}

type Language implements ProgrammingEntity {
  id: ID!
  name: String!
  paradigm: String!
  typing: TypingSystem!
  category: LanguageCategory!
  features: [String!]!
  extensions: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  popularity: Int
  frameworks: [Framework!]!
}

type Framework {
  id: ID!
  name: String!
  language: Language!
  description: String
}

input CreateLanguageInput {
  name: String!
  paradigm: String!
  typing: TypingSystem!
  category: LanguageCategory!
  features: [String!]
  extensions: [String!]
}

input UpdateLanguageInput {
  name: String
  paradigm: String
  typing: TypingSystem
  category: LanguageCategory
  features: [String!]
}

scalar DateTime

"""
Custom directive for authentication
"""
directive @auth(requires: Role = USER) on FIELD_DEFINITION | OBJECT

enum Role {
  USER
  ADMIN
  GUEST
}
