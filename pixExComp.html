<body>
  <h1>Pixel Mapper Tool (Compressed)</h1>
  <input type="file" id="upload" accept="image/*">
  <canvas id="canvas"></canvas>
  <button id="extract">Extract & Compress</button>
  <div id="status">No extraction yet.</div>
  <textarea id="output" placeholder="Full compressed HTML will appear here..."></textarea>

<script>
const upload = document.getElementById('upload');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const output = document.getElementById('output');
let img = new Image();

upload.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      status.textContent = `Image loaded: ${img.width} × ${img.height} (${img.width * img.height} pixels)`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('extract').addEventListener('click', () => {
  if (!img.src) {
    status.textContent = "No image loaded.";
    return;
  }

  const w = canvas.width;
  const h = canvas.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  const totalPixels = w * h;

  status.textContent = `Extracting & compressing...`;

  // Convert RGBA array to binary string
  let binary = "";
  for (let i = 0; i < data.length; i++) {
    binary += String.fromCharCode(data[i]);
  }
  const base64Data = btoa(binary);

  status.textContent = `Done! Extracted ${totalPixels} pixels.`;

  // Generate full HTML with base64 embedded
  const openScript = "<" + "script>";
  const closeScript = "</" + "script>";

  const rendererJS =
`${openScript}
const width = ${w}, height = ${h};
const base64Data = "${base64Data}";
function base64ToUint8(base64) {
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8ClampedArray(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}
window.onload = () => {
  const pixelData = base64ToUint8(base64Data);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const imgData = new ImageData(pixelData, width, height);
  ctx.putImageData(imgData, 0, 0);
};
${closeScript}`;

  const html =
`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Pixel Image (Compressed)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { margin:0; background:#000; display:grid; place-items:center; height:100vh; }
</style>
    <style>

            position: fixed;

            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 9999;
            font-weight: 600;
        }
        .aul-badge:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
${rendererJS}
  <!-- Mobile Enhanced JS -->
  <script src="/js/mobile-enhancer.js"></script>
  <!-- Self-Healing Script -->
  <script src="/self-healing.js"></script>
    <!-- AI Universal Language (AUL) Support Badge -->
    <div class="aul-badge" onclick="window.open('/ai-universal-language.html', '_blank')" title="This page supports AI Universal Language - Click to learn more">
        🤖 AUL-enabled
    </div>
    <script src="/js/universal-utilities.js"></script>

    <!-- Universal Navigation - Added by Project Fixer -->

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof BarbrickUniversal !== 'undefined') {
                // Only add navigation if not already present
                if (!document.querySelector('.universal-header')) {
                    BarbrickUniversal.createBackButton();
                }
                
                // Add footer if not present
                if (!document.querySelector('.universal-footer')) {
                    BarbrickUniversal.createFooter();
                }
            }
        });
    </script>
</body>
</html>`;

  output.value = html;
  status.textContent = "Full compressed HTML generated. Copy from textarea.";
});
</script>
