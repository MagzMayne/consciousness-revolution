            50% {

        let currentPack = null;
        let scene, camera, renderer, packMesh;
        let wrapperMeshes = [];
        let touchStartY = 0;
        let touchEndY = 0;
        let isOpening = false;

        function init() {
            if (!packId || !PACK_TYPES[packId]) {
                alert('Invalid pack! Redirecting...');
                window.location.href = 'packs.html';
                return;
            }

            currentPack = PACK_TYPES[packId];
            document.getElementById('packTitle').textContent = currentPack.name;

            init3DScene();
            createParticles();
            initSwipeGesture();
        }

        function initSwipeGesture() {
            const container = document.getElementById('pack-3d-scene');
            
            // Touch events
            container.addEventListener('touchstart', handleTouchStart, { passive: false });
            container.addEventListener('touchmove', handleTouchMove, { passive: false });
            container.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // Mouse events for desktop
            let mouseDown = false;
            container.addEventListener('mousedown', (e) => {
                mouseDown = true;
                touchStartY = e.clientY;
            });
            
            container.addEventListener('mousemove', (e) => {
                if (mouseDown) {
                    touchEndY = e.clientY;
                    updateWrapperPeel();
                }
            });
            
            container.addEventListener('mouseup', (e) => {
                if (mouseDown) {
                    mouseDown = false;
                    touchEndY = e.clientY;
                    checkSwipeGesture();
                }
            });
        }

        function handleTouchStart(e) {
            if (isOpening) return;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchMove(e) {
            if (isOpening) return;
            e.preventDefault();
            touchEndY = e.touches[0].clientY;
            updateWrapperPeel();
        }

        function handleTouchEnd(e) {
            if (isOpening) return;
            checkSwipeGesture();
        }

        function updateWrapperPeel() {
            const swipeDistance = touchEndY - touchStartY;
            const wrapper = document.getElementById('wrapperPeel');
            
            if (swipeDistance > 0) {
                // Gradually peel based on swipe distance
                const peelProgress = Math.min(swipeDistance / 200, 1);
                wrapper.style.transform = `translate(-50%, -${50 - peelProgress * 60}%) rotateX(-${peelProgress * 90}deg) scale(${1 - peelProgress * 0.2})`;
                wrapper.style.opacity = 1 - peelProgress * 0.5;
            }
        }

        function checkSwipeGesture() {
            const swipeDistance = touchEndY - touchStartY;
            const swipeThreshold = 100; // Minimum distance for swipe
            
            if (swipeDistance > swipeThreshold && !isOpening) {
                // Valid swipe down detected
                openPack();
            } else {
                // Reset wrapper if swipe wasn't enough
                const wrapper = document.getElementById('wrapperPeel');
                wrapper.style.transform = 'translate(-50%, -50%)';
                wrapper.style.opacity = '1';
            }
            
            touchStartY = 0;
            touchEndY = 0;
        }

        function init3DScene() {
            const container = document.getElementById('pack-3d-scene');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Create pack core
            const geometry = new THREE.BoxGeometry(3, 4, 0.8);
            const material = new THREE.MeshPhongMaterial({
                color: 0x38bdf8,
                emissive: 0x38bdf8,
                emissiveIntensity: 0.3,
                shininess: 100
            });

            packMesh = new THREE.Mesh(geometry, material);
            scene.add(packMesh);

            // Create wrapper meshes (banana peel effect)
            createWrapperMeshes();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x38bdf8, 2, 100);
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xa855f7, 2, 100);
            pointLight2.position.set(-5, 5, 5);
            scene.add(pointLight2);

            camera.position.z = 8;

            animate3D();
        }

        function createWrapperMeshes() {
            // Create 4 wrapper pieces (like banana peel segments)
            const wrapperGeometry = new THREE.BoxGeometry(3.2, 1.5, 0.1);
            const wrapperMaterial = new THREE.MeshPhongMaterial({
                color: 0x7c3aed,
                emissive: 0x7c3aed,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });

            const positions = [
                { x: 0, y: 2.5, z: 0.5, rotX: 0 },     // Top
                { x: 0, y: -2.5, z: 0.5, rotX: 0 },    // Bottom
                { x: 1.8, y: 0, z: 0.5, rotZ: Math.PI / 2 },  // Right
                { x: -1.8, y: 0, z: 0.5, rotZ: Math.PI / 2 }  // Left
            ];

            positions.forEach((pos, index) => {
                const wrapper = new THREE.Mesh(wrapperGeometry, wrapperMaterial.clone());
                wrapper.position.set(pos.x, pos.y, pos.z);
                if (pos.rotX) wrapper.rotation.x = pos.rotX;
                if (pos.rotZ) wrapper.rotation.z = pos.rotZ;
                wrapper.userData = { index, originalPos: { ...pos } };
                scene.add(wrapper);
                wrapperMeshes.push(wrapper);
            });
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            
            packMesh.rotation.y += 0.01;
            packMesh.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;

            renderer.render(scene, camera);
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 3 + 's';
                    particle.style.animationDuration = (2 + Math.random() * 2) + 's';
                    container.appendChild(particle);
                }, i * 50);
            }
        }

        function openPack() {
            if (isOpening) return;
            isOpening = true;

            // Hide opening UI
            document.getElementById('openingUI').style.display = 'none';
            document.getElementById('swipeIndicator').classList.add('hidden');

            // Trigger HTML wrapper peel animation
            const htmlWrapper = document.getElementById('wrapperPeel');
            htmlWrapper.classList.add('peeling');

            // Animate 3D wrapper meshes (banana peel effect)
            animateWrapperPeel();

            // Animate pack explosion after wrapper peels
            setTimeout(() => {
                animatePackExplosion();
            }, 600);

            // Generate cards
            setTimeout(() => {
                const cards = generateCards();
                revealCards(cards);
                saveCardsToCollection(cards);
            }, 2500);
        }

        function animateWrapperPeel() {
            const peelDuration = 1200;
            const startTime = Date.now();

            function peelAnimation() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / peelDuration, 1);
                
                wrapperMeshes.forEach((wrapper, index) => {
                    const easedProgress = 1 - Math.pow(1 - progress, 3); // Ease-out cubic
                    
                    switch(index) {
                        case 0: // Top
                            wrapper.position.y = 2.5 + easedProgress * 3;
                            wrapper.rotation.x = easedProgress * -Math.PI / 2;
                            break;
                        case 1: // Bottom
                            wrapper.position.y = -2.5 - easedProgress * 3;
                            wrapper.rotation.x = easedProgress * Math.PI / 2;
                            break;
                        case 2: // Right
                            wrapper.position.x = 1.8 + easedProgress * 3;
                            wrapper.rotation.y = easedProgress * Math.PI / 2;
                            break;
                        case 3: // Left
                            wrapper.position.x = -1.8 - easedProgress * 3;
                            wrapper.rotation.y = easedProgress * -Math.PI / 2;
                            break;
                    }
                    
                    wrapper.material.opacity = 0.8 * (1 - easedProgress);
                });

                if (progress < 1) {
                    requestAnimationFrame(peelAnimation);
                } else {
                    // Remove wrappers after animation
                    wrapperMeshes.forEach(wrapper => {
                        scene.remove(wrapper);
                    });
                }
            }

            peelAnimation();
        }

        function animatePackExplosion() {
            let explosionSpeed = 0;
            const explosionAnimation = setInterval(() => {
                explosionSpeed += 0.1;
                packMesh.rotation.y += explosionSpeed;
                packMesh.scale.x += 0.05;
                packMesh.scale.y += 0.05;
                packMesh.scale.z += 0.05;
                
                if (packMesh.scale.x > 3) {
                    clearInterval(explosionAnimation);
                    packMesh.visible = false;
                }
            }, 16);

            // More particles on explosion
            const container = document.getElementById('particles');
            for (let i = 0; i < 100; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = (50 + (Math.random() - 0.5) * 40) + '%';
                particle.style.top = '50%';
                particle.style.animationDuration = '1s';
                particle.style.width = particle.style.height = (2 + Math.random() * 6) + 'px';
                container.appendChild(particle);
            }
        }

        function generateCards() {
            const cards = [];
            const chances = currentPack.chances;
            const packTheme = packId; // Use pack ID as theme

            for (let i = 0; i < currentPack.cards; i++) {
                const rarity = determineRarity(chances);
                // Get theme-specific names or fall back to generic
                const themeNames = CARD_NAMES[packTheme];
                const names = (themeNames && themeNames[rarity]) ? themeNames[rarity] : ['Mysterious Card', 'Unknown Card', 'Secret Card', 'Hidden Card'];
                const baseName = names[Math.floor(Math.random() * names.length)];
                const name = baseName + ' #' + Math.floor(Math.random() * 1000);
                
                cards.push({
                    id: 'card_' + Date.now() + '_' + i,
                    name: name,
                    rarity: rarity,
                    power: Math.floor(60 + Math.random() * 40),
                    purchasePrice: getPriceForRarity(rarity),
                    theme: packTheme
                });
            }

            return cards;
        }

        function determineRarity(chances) {
            const rand = Math.random() * 100;
            let cumulative = 0;

            if (rand < (cumulative += chances.legendary)) return 'legendary';
            if (rand < (cumulative += chances.epic)) return 'epic';
            if (rand < (cumulative += chances.rare)) return 'rare';
            return 'common';
        }

        function getPriceForRarity(rarity) {
            const prices = { common: 0.1, rare: 0.5, epic: 2.0, legendary: 8.0 };
            return prices[rarity] * (0.9 + Math.random() * 0.2);
        }

        function revealCards(cards) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card-reveal-item ${card.rarity}`;
                cardEl.innerHTML = `
                    <div class="card-3d-mini" id="card-mini-${index}"></div>
                    <h3 class="card-name">${card.name}</h3>
                    <span class="card-rarity ${card.rarity}">${card.rarity}</span>
                    <div class="card-stats">
                        <div class="stat">
                            <div class="stat-label">Power</div>
                            <div class="stat-value">${card.power}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Value</div>
                            <div class="stat-value">${card.purchasePrice.toFixed(2)} SOL</div>
                        </div>
                    </div>
                `;
                grid.appendChild(cardEl);

                // Initialize mini 3D preview
                setTimeout(() => {
                    init3DCardMini(`card-mini-${index}`, card.rarity);
                }, 100 + index * 100);
            });

            document.getElementById('cardsReveal').classList.add('active');
        }

        function init3DCardMini(containerId, rarity) {
            const container = document.getElementById(containerId);
            if (!container || !window.THREE) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(2, 2.8, 0.1);
            
            const colors = {
                common: 0x9ca3af,
                rare: 0x3b82f6,
                epic: 0xa855f7,
                legendary: 0xfbbf24
            };

            const material = new THREE.MeshPhongMaterial({
                color: colors[rarity],
                emissive: colors[rarity],
                emissiveIntensity: 0.4,
                shininess: 100
            });

            const card = new THREE.Mesh(geometry, material);
            scene.add(card);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(colors[rarity], 2, 100);
            pointLight.position.set(2, 3, 5);
            scene.add(pointLight);

            camera.position.z = 5;

            let rotation = 0;
            function animate() {
                requestAnimationFrame(animate);
                rotation += 0.02;
                card.rotation.y = Math.sin(rotation) * 0.5;
                renderer.render(scene, camera);
            }
            animate();
        }

        function saveCardsToCollection(cards) {
            const collection = JSON.parse(localStorage.getItem('card_collection') || '[]');
            
            const currentWallet = 'demo_' + Math.random().toString(36).substring(2, 11);
            
            cards.forEach(card => {
                collection.push({
                    ...card,
                    purchaseDate: new Date().toISOString(),
                    owner: currentWallet,
                    baseValue: card.purchasePrice
                });
            });

            localStorage.setItem('card_collection', JSON.stringify(collection));
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
