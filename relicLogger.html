    </select>

    <label for="syncTarget">Sync Target</label>
    <select id="syncTarget">
      <option value="mandem">Mandem.os</option>
      <option value="null">null.os</option>
      <option value="both">Mandem + null</option>
    </select>

    <label for="githubToken">GitHub Token</label>
    <input type="password" id="githubToken" placeholder="GitHub Personal Access Token" />

    <label for="repoPath">GitHub Repo (user/repo)</label>
    <input type="text" id="repoPath" placeholder="e.g. AgentR/mandem-sync" />

    <button onclick="logRelic()">Log & Sync Relic</button>

    <div class="log" id="logOutput">🧾 Output will appear here…</div>
  </div>

  <script src="https://cdn.skypack.dev/@octokit/rest"></script>
  <script>
    async function logRelic() {
      const keyId = document.getElementById('keyId').value.trim();
      const walletLink = document.getElementById('walletLink').value.trim();
      const relicType = document.getElementById('relicType').value;
      const syncTarget = document.getElementById('syncTarget').value;
      const githubToken = document.getElementById('githubToken').value.trim();
      const repoPath = document.getElementById('repoPath').value.trim();
      const timestamp = new Date().toISOString();

      const [owner, repo] = repoPath.split('/');
      const coinId = 'coin_' + Math.random().toString(36).substring(2, 10);
      const valueUSD = (relicType === 'symbolic' || relicType === 'test') ? 0 : Math.floor(Math.random() * 1000);

      let relic = {
        relic_id: keyId,
        wallet_link: walletLink,
        relic_type: relicType,
        coin_id: coinId,
        value_usd: valueUSD,
        creator_id: 'AgentR',
        timestamp
      };

      let output = `✅ Relic Created:\n${JSON.stringify(relic, null, 2)}\n`;

      if (syncTarget === 'null' || syncTarget === 'both') {
        relic.creator_id = 'null_agent';
        relic.value_usd = 0;
        output += `🕳️ Synced to null.os — value nullified, creator anonymized\n`;
      }

      if (syncTarget === 'mandem' || syncTarget === 'both') {
        output += `📡 Synced to Mandem.os — lineage + classification registered\n`;
      }

      if (githubToken && owner && repo) {
        const octokit = new Octokit.Octokit({ auth: githubToken });
        const path = `relics/${timestamp.split('T')[0]}-${keyId}.json`;
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(relic, null, 2))));

        try {
          await octokit.repos.createOrUpdateFileContents({
            owner,
            repo,
            path,
            message: `Relic sync: ${keyId}`,
            content,
            committer: { name: "RelicBot", email: "bot@mandem.os" },
            author: { name: "RelicBot", email: "bot@mandem.os" }
          });
          output += `📁 Pushed to GitHub: ${owner}/${repo}/${path}\n`;
        } catch (err) {
          output += `❌ GitHub Push Failed: ${err.message}\n`;
        }
      } else {
        output += `⚠️ GitHub sync skipped — missing token or repo path\n`;
      }

      document.getElementById('logOutput').textContent = output;
    }
  </script>
