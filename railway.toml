# Railway Configuration for Consciousness Revolution
# This configuration forces Railway to use Node.js instead of Ruby

[build]
builder = "NIXPACKS"

[build.nixpacksPlan]
# Explicitly tell Railway this is a Node.js project
providers = ["node"]

[start]
# Use the npm start command as configured in Railway settings
cmd = "npm run start"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
