# Railway Configuration for Consciousness Revolution
# This configuration forces Railway to treat this as a static site

[build]
builder = "NIXPACKS"

[start]
# Serve static files using npx serve
cmd = "npx serve . -p ${PORT:-8080}"

[deploy]
# Ensure Railway doesn't try to detect Ruby
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
