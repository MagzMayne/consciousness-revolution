# Railway Configuration for Consciousness Revolution
# This configuration forces Railway to use Nixpacks with Node.js instead of Ruby/Railpack
# 
# IMPORTANT: This project is a frontend Node.js application hosted on GitHub Pages.
# The Gemfile exists only for local Jekyll development and should NOT trigger Ruby detection.
# The .python-version file is for local Python tools only.

[build]
builder = "NIXPACKS"

[build.nixpacksPlan]
# Explicitly tell Nixpacks this is a Node.js project ONLY
providers = ["node"]

[start]
# Start command from package.json
cmd = "npm run start"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Ensure Node environment is set
NODE_ENV = "production"
