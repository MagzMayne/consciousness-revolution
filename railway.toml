# Railway Configuration for Consciousness Revolution
# This configuration forces Railway to use Nixpacks with Node.js instead of Ruby/Railpack
# 
# IMPORTANT: This project is a frontend Node.js application hosted on GitHub Pages.
# The Gemfile exists only for local Jekyll development and should NOT trigger Ruby detection.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"

[start]
# Start command from package.json - serves static files
cmd = "npm start"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
