  /* -------------------- Styles (readable, high contrast) -------------------- */
  const css = `
    :root {

    .progress { height:10px; background:#182230; border:1px solid var(--border); border-radius:999px; overflow:hidden; }

          <div class="wallet-box">

            <span class="pill" id="solBalance">SOL: —</span>
            <span class="pill" id="tokenStatus">Token: —</span>
          </div>
        </div>
      </div>
      <div class="merlin-body">
        <div class="left">
          <div class="track-wrap"><div class="track" id="track"></div></div>
          <div class="nav">
            <button class="btn" id="prevBtn">Prev</button>
            <span class="pill" id="pageInfo">Page 1 / 1</span>
            <button class="btn" id="nextBtn">Next</button>
          </div>
        </div>
        <div class="right">
          <div class="panel-box">
            <div class="panel-title">Governance mint</div>
            <div class="kv">
              <div>Token mint</div><div style="font-family:ui-monospace,monospace; font-size:12px;">${GOVERNANCE_TOKEN_MINT}</div>
              <div>Status</div><div class="pill" id="gateStatus">Not connected</div>
            </div>
          </div>
          <div class="panel-box">
            <div class="panel-title">Repo snapshot</div>
            <div class="kv">
              <div>Entries</div><div id="snapCount">—</div>
              <div>Last refresh</div><div id="snapTime">—</div>
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
              <button class="btn" id="exportSnap">Export snapshot</button>
              <button class="btn" id="importSnap">Import snapshot</button>
              <input type="file" id="snapFile" accept="application/json" style="display:none;" />

          </div>
          <div class="panel-box">
            <div class="panel-title">Funding overview</div>
            <div class="kv">
              <div>Total goal</div><div id="totalGoal">—</div>
              <div>Total invested</div><div id="totalInvested">—</div>

            <div class="merlin-sub" style="margin-top:6px;">Pledges recorded locally for transparency; pledge button unlocks when governance token is held.</div>
          </div>
        </div>
      </div>
      <div class="foot">
        <div class="status">
          <span class="pill ok" id="cacheStatus">Offline cache: Ready</span>
          <span class="pill" id="snapshotStatus">Snapshot: Pending</span>

        <div class="merlin-sub">Coverflow previews use iframes scaled like screenshots for portability.</div>
      </div>

  `;
  document.body.appendChild(panel);

  /* -------------------- Elements -------------------- */
  const ui = {
    toggle: panel.querySelector('#merlinToggle'),
    panel: panel.querySelector('#merlinPanel'),
    filter: panel.querySelector('#filterInput'),
    pageSize: panel.querySelector('#pageSize'),
    refresh: panel.querySelector('#refreshBtn'),
    close: panel.querySelector('#closeBtn'),
    track: panel.querySelector('#track'),
    prev: panel.querySelector('#prevBtn'),
    next: panel.querySelector('#nextBtn'),
    pageInfo: panel.querySelector('#pageInfo'),
    cacheStatus: panel.querySelector('#cacheStatus'),
    snapshotStatus: panel.querySelector('#snapshotStatus'),
    snapCount: panel.querySelector('#snapCount'),
    snapTime: panel.querySelector('#snapTime'),
    exportSnap: panel.querySelector('#exportSnap'),
    importSnap: panel.querySelector('#importSnap'),
    snapFile: panel.querySelector('#snapFile'),
    connectBtn: panel.querySelector('#connectBtn'),
    genBtn: panel.querySelector('#genBtn'),
    addr: panel.querySelector('#addr'),
    solBalance: panel.querySelector('#solBalance'),
    tokenStatus: panel.querySelector('#tokenStatus'),
    gateStatus: panel.querySelector('#gateStatus'),
    totalGoal: panel.querySelector('#totalGoal'),
    totalInvested: panel.querySelector('#totalInvested')
  };
  ui.toggle.addEventListener('click', () => ui.panel.classList.toggle('open'));
  ui.close.addEventListener('click', () => ui.panel.classList.remove('open'));

  /* -------------------- Data helpers -------------------- */
  function fetchJSON(url, timeout = 20000) {
    return new Promise((resolve, reject) => {
      const ctrl = new AbortController();
      const t = setTimeout(() => { ctrl.abort(); reject(new Error('timeout')); }, timeout);
      fetch(url, { signal: ctrl.signal, headers: { 'Accept':'application/vnd.github+json' } })
        .then(r => r.ok ? r.json() : Promise.reject(new Error('http '+r.status)))
        .then(j => { clearTimeout(t); resolve(j); })
        .catch(err => { clearTimeout(t); reject(err); });
    });
  }

  async function listHtmlFiles() {
    try {
      const tree = await fetchJSON(API_TREE, 25000);
      return (tree.tree || []).filter(n => n.type==='blob' && n.path.toLowerCase().endsWith('.html')).map(n => n.path);
    } catch (e) {
      const snap = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
      return snap.map(x => x.path);
    }
  }

  async function enrichPage(path) {
    const rawUrl = `${RAW_BASE}/${path}`;
    const liveUrl = `${LIVE_BASE}/${path.replace('index.html','')}`;
    let title = path.split('/').slice(-1)[0];
    let tags = [];
    try {
      const html = await fetch(rawUrl).then(r => r.ok ? r.text() : '');
      const tMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
      if (tMatch) title = tMatch[1].trim();
      const metaTags = [...html.matchAll(/<meta[^>]+name=["']?keywords["']?[^>]+content=["']([^"']+)["']/ig)]
        .map(m => m[1].split(',').map(x => x.trim())).flat();
      tags = metaTags.slice(0, 5);
    } catch (e) {}
    return { path, title, liveUrl, rawUrl, tags };
  }

  /* -------------------- Funding model (integrated with investment system) -------------------- */
  function getFunding(path) {
    if (window.projectInvestmentSystem) {
      const status = window.projectInvestmentSystem.getProjectStatus(path);
      return { goal: 10000, invested: status.totalInvested, investorCount: status.investorCount };
    }
    const store = JSON.parse(localStorage.getItem(FUND_KEY) || '{}');
    return store[path] || { goal: 1000, invested: 0 };
  }
  function setFunding(path, data) {
    const store = JSON.parse(localStorage.getItem(FUND_KEY) || '{}');
    store[path] = data;
    localStorage.setItem(FUND_KEY, JSON.stringify(store));
    refreshFundingTotals();
  }
  function refreshFundingTotals() {
    const store = JSON.parse(localStorage.getItem(FUND_KEY) || '{}');
    let totalGoal = 0, totalInvested = 0;
    Object.values(store).forEach(({goal, invested}) => { totalGoal += Number(goal)||0; totalInvested += Number(invested)||0; });
    ui.totalGoal.textContent = Intl.NumberFormat().format(totalGoal);
    ui.totalInvested.textContent = Intl.NumberFormat().format(totalInvested);
  }

  /* -------------------- Coverflow rendering -------------------- */
  const MAX_IFRAME_WIDTH = 1200, MAX_IFRAME_HEIGHT = 800;
  function computeScale() {
    const thumbH = 0.56 * 400;
    const thumbW = 340;
    const sx = thumbW / MAX_IFRAME_WIDTH, sy = thumbH / MAX_IFRAME_HEIGHT;
    return Math.min(sx, sy);
  }

  function progressClass(pct) {
    if (pct >= 100) return 'full';
    if (pct >= 50) return 'mid';
    return 'low';
  }

  function cardHTML(item, scale) {
    const f = getFunding(item.path);
    const pct = Math.max(0, Math.min(100, (f.invested / Math.max(1, f.goal)) * 100));
    const barClass = progressClass(pct);
    return `
      <div class="card" data-title="${item.title.toLowerCase()}" data-path="${item.path.toLowerCase()}">
        <div class="thumb">
          <div class="loading">Loading preview…</div>
          <iframe class="preview-frame" sandbox="allow-scripts allow-same-origin" src="${item.liveUrl}"
            style="transform: scale(${scale}); width:${MAX_IFRAME_WIDTH}px; height:${MAX_IFRAME_HEIGHT}px;" title="Preview of ${item.title}"></iframe>
        </div>
        <div class="card-body">
          <div class="name">${item.title}</div>
          <div class="path">${item.path}</div>
          <div class="tags">${(item.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          <div class="fund-row">
            <div>
              <div class="merlin-sub">Goal</div>
              <div><input class="input" type="number" min="0" value="${f.goal}" data-goal="${item.path}" style="width:100%;"></div>
            </div>
            <div>
              <div class="merlin-sub">Invested</div>
              <div class="${f.invested>=f.goal?'status-funded':'pill warn'}" data-funded="${item.path}">${Intl.NumberFormat().format(f.invested)}${f.invested>=f.goal?' • Funded':''}</div>
            </div>
          </div>
          <div class="progress"><div class="bar ${barClass}" style="width:${pct}%"></div></div>
          <div class="actions">
            <a class="link" href="${item.liveUrl}" target="_blank" rel="noopener">Open</a>
            <a class="link" href="${item.rawUrl}" target="_blank" rel="noopener">Raw</a>
            <button class="link" data-copy="${item.liveUrl}">Copy URL</button>
            <button class="link" data-pin="${item.path}">Pin</button>
            <input class="input" type="number" min="0" placeholder="GBUV pledge" style="width:130px;" data-pledge="${item.path}">
            <button class="link" data-pledge-btn="${item.path}" disabled>Pledge (token-gated)</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderTrack(items, page, pageSize) {
    const start = page * pageSize;
    const slice = items.slice(start, start + pageSize);
    const scale = computeScale();
    ui.track.innerHTML = slice.map(it => cardHTML(it, scale)).join('');

    const cards = [...ui.track.querySelectorAll('.card')];
    function layout(centerIdx) {
      cards.forEach((card, i) => {
        const d = i - centerIdx;
        const rotY = d * -18;
        const tz = -Math.abs(d) * 90;
        const tx = d * 68;
        card.style.transform = `translate3d(${tx}px, 0, ${tz}px) rotateY(${rotY}deg)`;
      });
    }
    let center = Math.floor(cards.length / 2);
    layout(center);

    cards.forEach(card => {
      const iframe = card.querySelector('.preview-frame');
      const loader = card.querySelector('.loading');
      iframe.addEventListener('load', () => loader.style.display='none');

      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        const x = ((e.clientX - r.left)/r.width - 0.5) * 8;
        const y = ((e.clientY - r.top)/r.height - 0.5) * -6;
        const base = `translate3d(${card.style.transform.match(/translate3d\([^)]+\)/)?.[0]?.split('translate3d(')[1] || '0px, 0px, 0px'}) rotateY(${card.style.transform.match(/rotateY\([^)]+\)/)?.[0]?.split('rotateY(')[1] || '0deg'})`;
        card.style.transform = base + ` rotateX(${y}deg) rotateY(${x}deg)`;
      });
      card.addEventListener('mouseleave', () => layout(center));

      const copyBtn = card.querySelector('button[data-copy]');
      copyBtn.addEventListener('click', () => {
        const url = copyBtn.getAttribute('data-copy');
        navigator.clipboard.writeText(url).then(()=>{ copyBtn.textContent='Copied'; setTimeout(()=>copyBtn.textContent='Copy URL',1200); });
      });

      const pinBtn = card.querySelector('button[data-pin]');
      pinBtn.addEventListener('click', () => {
        const path = pinBtn.getAttribute('data-pin');
        const pins = JSON.parse(localStorage.getItem(PINS_KEY)||'[]');
        if (!pins.includes(path)) pins.push(path);
        localStorage.setItem(PINS_KEY, JSON.stringify(pins));
        pinBtn.textContent='Pinned'; setTimeout(()=>pinBtn.textContent='Pin',1200);
      });

      const goalInput = card.querySelector('input[data-goal]');
      goalInput.addEventListener('change', () => {
        const path = goalInput.getAttribute('data-goal');
        const f = getFunding(path);
        f.goal = Math.max(0, Number(goalInput.value)||0);
        setFunding(path, f);
        const status = card.querySelector(`*[data-funded="${path}"]`);
        const pct = Math.max(0, Math.min(100, (f.invested / Math.max(1, f.goal))*100));
        const bar = card.querySelector('.bar');
        bar.style.width = pct+'%';
        bar.className = 'bar ' + progressClass(pct);
        status.className = f.invested>=f.goal ? 'status-funded' : 'pill warn';
        status.textContent = Intl.NumberFormat().format(f.invested) + (f.invested>=f.goal?' • Funded':'');
      });

      const pledgeInput = card.querySelector('input[data-pledge]');
      const pledgeBtn = card.querySelector('button[data-pledge-btn]');
      pledgeBtn.addEventListener('click', async () => {
        const path = pledgeBtn.getAttribute('data-pledge-btn');
        const amt = Math.max(0, Number(pledgeInput.value)||0);
        if (amt <= 0) { pledgeBtn.textContent='Enter amount'; setTimeout(()=>pledgeBtn.textContent='Pledge (token-gated)',1200); return; }
        
        pledgeBtn.textContent='Processing...';
        pledgeBtn.disabled = true;
        
        try {
          // Get current user from session
          const currentUser = JSON.parse(sessionStorage.getItem('gembot_session') || '{}');
          if (!currentUser.username) {
            throw new Error('Please log in to invest');
          }
          
          // Use real investment system with blockchain transaction
          if (window.projectInvestmentSystem) {
            const result = await window.projectInvestmentSystem.investInProject(path, amt, currentUser.username);
            
            // Update UI with new funding data
            const f = getFunding(path);
            const status = card.querySelector(`*[data-funded="${path}"]`);
            const pct = Math.max(0, Math.min(100, (f.invested / Math.max(1, f.goal))*100));
            const bar = card.querySelector('.bar');
            bar.style.width = pct+'%';
            bar.className = 'bar ' + progressClass(pct);
            status.className = f.invested>=f.goal ? 'status-funded' : 'pill warn';
            status.textContent = Intl.NumberFormat().format(f.invested) + (f.invested>=f.goal?' • Funded':'');
            
            // Show rewards
            pledgeBtn.textContent=`+${result.rewards.xp} XP earned!`;
            setTimeout(()=>{ pledgeBtn.textContent='Pledge (token-gated)'; pledgeBtn.disabled = !tokenHeld; },2000);
            
            // Notify user
            if (result.rewards.badges.length > 0) {
              alert(`🏆 Investment complete!\n\nRewards:\n+${result.rewards.xp} XP\n+${result.rewards.bonusGems} Gems\nBadge: ${result.rewards.badges[0]}\n\nTx: ${result.txSignature.slice(0,8)}...`);
            }
          } else {
            // Fallback to local tracking
            const f = getFunding(path);
            f.invested = Math.max(0, Number(f.invested)||0) + amt;
            setFunding(path, f);
            const status = card.querySelector(`*[data-funded="${path}"]`);
            const pct = Math.max(0, Math.min(100, (f.invested / Math.max(1, f.goal))*100));
            const bar = card.querySelector('.bar');
            bar.style.width = pct+'%';
            bar.className = 'bar ' + progressClass(pct);
            status.className = f.invested>=f.goal ? 'status-funded' : 'pill warn';
            status.textContent = Intl.NumberFormat().format(f.invested) + (f.invested>=f.goal?' • Funded':'');
            pledgeBtn.textContent='Recorded'; setTimeout(()=>{ pledgeBtn.textContent='Pledge (token-gated)'; pledgeBtn.disabled = !tokenHeld; },1200);
          }
        } catch (error) {
          console.error('Investment failed:', error);
          pledgeBtn.textContent='Failed: ' + error.message;
          setTimeout(()=>{ pledgeBtn.textContent='Pledge (token-gated)'; pledgeBtn.disabled = !tokenHeld; },3000);
        }
      });

      // Enable if token verified
      if (tokenHeld) pledgeBtn.removeAttribute('disabled'); else pledgeBtn.setAttribute('disabled','');
    });

    ui.prev.disabled = page <= 0;
    const pages = Math.max(1, Math.ceil(filteredEntries.length / pageSize));
    ui.next.disabled = page >= pages - 1;
    ui.pageInfo.textContent = `Page ${Math.min(page+1, pages)} / ${pages}`;
  }

  /* -------------------- Filter + pagination -------------------- */
  let allEntries = [], filteredEntries = [], currentPage = 0;
  ui.filter.addEventListener('input', () => {
    const q = ui.filter.value.trim().toLowerCase();
    filteredEntries = allEntries.filter(x => x.title.toLowerCase().includes(q) || x.path.toLowerCase().includes(q));
    currentPage = 0;
    renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
  });
  ui.pageSize.addEventListener('change', () => {
    currentPage = 0;
    renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
  });
  ui.prev.addEventListener('click', () => {
    currentPage = Math.max(0, currentPage - 1);
    renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
  });
  ui.next.addEventListener('click', () => {
    const pages = Math.max(1, Math.ceil(filteredEntries.length / parseInt(ui.pageSize.value,10)));
    currentPage = Math.min(pages - 1, currentPage + 1);
    renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
  });

  /* -------------------- Snapshot + restore -------------------- */
  function saveSnapshot(entries) {
    localStorage.setItem(SNAP_KEY, JSON.stringify(entries));
    ui.snapshotStatus.textContent = `Snapshot: ${entries.length} pages`;
    ui.snapshotStatus.classList.add('ok');
    ui.snapCount.textContent = String(entries.length);
    ui.snapTime.textContent = new Date().toLocaleString();
  }
  ui.exportSnap.addEventListener('click', () => {
    const snap = localStorage.getItem(SNAP_KEY) || '[]';
    const blob = new Blob([snap], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'repo_snapshot.json'; a.click();
    URL.revokeObjectURL(url);
  });
  ui.importSnap.addEventListener('click', () => ui.snapFile.click());
  ui.snapFile.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      localStorage.setItem(SNAP_KEY, JSON.stringify(data));
      allEntries = data; filteredEntries = data.slice(); currentPage = 0;
      renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
      saveSnapshot(data);
    } catch { alert('Invalid snapshot JSON'); }
  });

  /* -------------------- Boot -------------------- */
  async function boot() {
    ui.snapshotStatus.textContent = 'Snapshot: Loading…';
    const paths = await listHtmlFiles();
    const entries = [];
    for (const p of paths) {
      if (p.startsWith('node_modules') || p.startsWith('dist/') || p.startsWith('build/')) continue;
      entries.push(await enrichPage(p));
      const f = getFunding(p); setFunding(p, f);
    }
    allEntries = entries;
    filteredEntries = entries.slice();
    currentPage = 0;
    renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
    saveSnapshot(entries);
    refreshFundingTotals();
  }

  ui.refresh.addEventListener('click', boot);

  // Preload from snapshot if present
  const snap = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
  if (snap.length) {
    allEntries = snap; filteredEntries = snap.slice(); currentPage = 0;
    renderTrack(filteredEntries, currentPage, parseInt(ui.pageSize.value,10));
    ui.snapCount.textContent = String(snap.length);
    ui.snapTime.textContent = new Date().toLocaleString();
    refreshFundingTotals();
  }
  boot();

  /* -------------------- Service Worker (offline cache) -------------------- */
  (function registerSW(){
    if (!('serviceWorker' in navigator)) {
      ui.cacheStatus.textContent = 'Offline cache: Unsupported';
      ui.cacheStatus.classList.add('warn'); return;
    }
    const swCode = `
      const CACHE='merlin-coverflow-v2';
      const ORIGINS=['${LIVE_BASE}','https://raw.githubusercontent.com','https://api.github.com'];
      self.addEventListener('install',e=>{self.skipWaiting(); e.waitUntil(caches.open(CACHE));});
      self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});
      self.addEventListener('fetch',e=>{
        const u=new URL(e.request.url);
        if (ORIGINS.some(o=>u.origin.startsWith(o))) {
          e.respondWith((async()=>{
            const c=await caches.open(CACHE);
            const hit=await c.match(e.request);
            if (hit) return hit;
            try {
              const res=await fetch(e.request);
              if (res.ok && e.request.method==='GET') c.put(e.request,res.clone());
              return res;
            } catch(err) {
              return hit || new Response('Offline',{status:503});
            }
          })());
        }
      });
    `;
    const blob = new Blob([swCode],{type:'text/javascript'});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).then(()=>{
      ui.cacheStatus.textContent='Offline cache: Ready';
      ui.cacheStatus.classList.add('ok');
    }).catch(()=>{
      ui.cacheStatus.textContent='Offline cache: Disabled';
      ui.cacheStatus.classList.add('warn');
    });
  })();

  /* -------------------- Solana wallet + token gate -------------------- */
  let solana = null, connection = null, wallet = null, externalPK = null, tokenHeld = false;

  function solanaReady() {
    solana = window.solanaWeb3;
    connection = new solana.Connection('https://api.mainnet-beta.solana.com','confirmed');
    ui.genBtn.addEventListener('click', generateLocalWallet);
    ui.connectBtn.addEventListener('click', connectInjectedWallet);
    const saved = localStorage.getItem('merlin_local_wallet');
    if (saved) {
      try {
        const arr = Uint8Array.from(JSON.parse(saved));
        const kp = solana.Keypair.fromSecretKey(arr);
        wallet = { publicKey: kp.publicKey, secretKey: kp.secretKey };
        ui.addr.textContent = kp.publicKey.toBase58();
        refreshBalances().then(checkGovernanceToken);
      } catch {}
    }
  }

  const s = document.createElement('script');
  s.src = 'https://unpkg.com/@solana/web3.js@1.91.7/lib/index.iife.min.js';
  s.onload = solanaReady;
  document.head.appendChild(s);

  function generateLocalWallet() {
    if (!solana) return;
    const kp = solana.Keypair.generate();
    localStorage.setItem('merlin_local_wallet', JSON.stringify(Array.from(kp.secretKey)));
    wallet = { publicKey: kp.publicKey, secretKey: kp.secretKey }; externalPK = null;
    ui.addr.textContent = kp.publicKey.toBase58();
    refreshBalances().then(checkGovernanceToken);
  }

  async function connectInjectedWallet() {
    try {
      const provider = window.solana && window.solana.isPhantom ? window.solana : null;
      if (!provider) { alert('No injected Solana wallet found. Use "Generate" to create a local wallet.'); return; }
      const res = await provider.connect();
      externalPK = new solana.PublicKey(res.publicKey.toString());
      wallet = null;
      ui.addr.textContent = externalPK.toBase58();
      await refreshBalances(); await checkGovernanceToken();
    } catch { alert('Wallet connect failed.'); }
  }

  async function refreshBalances() {
    const pk = wallet ? wallet.publicKey : externalPK;
    if (!pk || !connection) return;
    try {
      const lamports = await connection.getBalance(pk);
      const sol = lamports / (solana ? solana.LAMPORTS_PER_SOL : 1_000_000_000);
      ui.solBalance.textContent = `SOL: ${sol.toFixed(4)}`;
      ui.solBalance.classList.add('ok');
      ui.gateStatus.textContent = 'Connected';
    } catch {
      ui.solBalance.textContent = 'SOL: —';
      ui.solBalance.classList.add('warn');
    }
  }

  async function checkGovernanceToken() {
    const pk = wallet ? wallet.publicKey : externalPK;
    if (!pk || !connection) { ui.tokenStatus.textContent='Token: —'; return; }
    try {
      const tokenProgramId = new (solana.PublicKey)('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
      const res = await connection.getParsedTokenAccountsByOwner(pk, { programId: tokenProgramId });
      tokenHeld = false;
      for (const { account } of res.value) {
        const info = account.data.parsed.info;
        if (info.mint === GOVERNANCE_TOKEN_MINT) {
          const amt = parseFloat(info.tokenAmount.uiAmountString || '0');
          if (amt > 0) { tokenHeld = true; break; }
        }
      }
      ui.tokenStatus.textContent = tokenHeld ? 'Token: Held' : 'Token: None';
      ui.tokenStatus.classList.toggle('ok', tokenHeld);
      ui.tokenStatus.classList.toggle('warn', !tokenHeld);
      ui.gateStatus.textContent = tokenHeld ? 'Governance token verified' : 'No governance token';
      document.querySelectorAll('button[data-pledge-btn]').forEach(btn=>{
        if (tokenHeld) btn.removeAttribute('disabled'); else btn.setAttribute('disabled','');
      });
    } catch {
      ui.tokenStatus.textContent = 'Token: Error';
      ui.tokenStatus.classList.add('error');
    }
  }

})();
</script>
