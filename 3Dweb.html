  <script>
    (function () {

      let currentDocumentDom = null;
      let currentSelectedLayer = null;
      let currentTranslateX = 0;
      let currentTranslateY = 0;
      let baseTransform = "";
      let originalStyleSnapshot = new WeakMap();
      let undoStack = [];
      let redoStack = [];
      const MAX_UNDO_STACK = 50;

      function setStatus(text) {
        viewportStatus.textContent = text;
      }

      function validateHexColor(color) {
        if (!color) return true;
        return /^#[0-9A-Fa-f]{6}$/.test(color.trim());
      }

      function validateUrl(url) {
        try {
          new URL(url);
          return true;
        } catch {
          return false;
        }
      }

      function sanitizeNumber(value, min = -Infinity, max = Infinity) {
        const num = parseFloat(value);
        if (isNaN(num)) return null;
        return Math.max(min, Math.min(max, num));
      }

      function saveState() {
        if (!currentDocumentDom) return;
        
        const state = {
          html: viewerRoot.innerHTML,
          selectedIndex: currentSelectedLayer 
            ? Array.from(viewerRoot.querySelectorAll('.window3d-layer')).indexOf(currentSelectedLayer)
            : -1
        };
        
        undoStack.push(JSON.stringify(state));
        if (undoStack.length > MAX_UNDO_STACK) {
          undoStack.shift();
        }
        redoStack = [];
      }

      function undo() {
        if (undoStack.length === 0) {
          setStatus("Nothing to undo.");
          return;
        }
        
        const currentState = {
          html: viewerRoot.innerHTML,
          selectedIndex: currentSelectedLayer 
            ? Array.from(viewerRoot.querySelectorAll('.window3d-layer')).indexOf(currentSelectedLayer)
            : -1
        };
        redoStack.push(JSON.stringify(currentState));
        
        const prevState = JSON.parse(undoStack.pop());
        // Safe to use innerHTML here: content is from our own generated state, not user input
        viewerRoot.innerHTML = prevState.html;
        attachLayerInteraction();
        
        if (prevState.selectedIndex >= 0) {
          const layers = viewerRoot.querySelectorAll('.window3d-layer');
          if (layers[prevState.selectedIndex]) {
            selectLayer(layers[prevState.selectedIndex]);
          }
        } else {
          clearSelection();
        }
        
        setStatus("Undo successful.");
      }

      function redo() {
        if (redoStack.length === 0) {
          setStatus("Nothing to redo.");
          return;
        }
        
        const currentState = {
          html: viewerRoot.innerHTML,
          selectedIndex: currentSelectedLayer 
            ? Array.from(viewerRoot.querySelectorAll('.window3d-layer')).indexOf(currentSelectedLayer)
            : -1
        };
        undoStack.push(JSON.stringify(currentState));
        
        const nextState = JSON.parse(redoStack.pop());
        // Safe to use innerHTML here: content is from our own generated state, not user input
        viewerRoot.innerHTML = nextState.html;
        attachLayerInteraction();
        
        if (nextState.selectedIndex >= 0) {
          const layers = viewerRoot.querySelectorAll('.window3d-layer');
          if (layers[nextState.selectedIndex]) {
            selectLayer(layers[nextState.selectedIndex]);
          }
        } else {
          clearSelection();
        }
        
        setStatus("Redo successful.");
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        // Ctrl+Z or Cmd+Z for undo
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
          e.preventDefault();
          undo();
        }
        // Ctrl+Shift+Z or Cmd+Shift+Z for redo
        else if ((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey) {
          e.preventDefault();
          redo();
        }
        // Ctrl+S or Cmd+S for save
        else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveStateBtn.click();
        }
        // Escape to clear selection
        else if (e.key === 'Escape') {
          clearSelection();
        }
        // Delete to reset element
        else if (e.key === 'Delete' && currentSelectedLayer) {
          resetElementBtn.click();
        }
      });

      function wrapHtmlIn3D(html) {
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");

          const body = doc.body;
          if (!body) {
            console.error("No body element found in parsed HTML");
            return null;
          }

          const originalChildren = Array.from(body.childNodes).filter(
            (node) =>
              node.nodeType === Node.ELEMENT_NODE ||
              (node.nodeType === Node.TEXT_NODE &&
                node.textContent.trim().length > 0)
          );
          
          if (originalChildren.length === 0) {
            console.warn("No content found in HTML body");
            // Create a placeholder
            const placeholder = doc.createElement("div");
            placeholder.textContent = "Empty HTML body - add content to continue";
            originalChildren.push(placeholder);
          }

          const wrapper = doc.createElement("div");
          wrapper.className = "window3d-auto";

          originalChildren.forEach((child) => {
            wrapper.appendChild(child);
          });

          body.innerHTML = "";
          body.appendChild(wrapper);

          const window3d = doc.createElement("div");
          window3d.className = "window3d";

          const scene = doc.createElement("div");
          scene.className = "window3d-scene";

          const room = doc.createElement("div");
          room.className = "window3d-room";

          const children = Array.from(wrapper.children);
          const mid = (children.length - 1) / 2;

          children.forEach((child, index) => {
            const layer = doc.createElement("div");
            layer.className = "window3d-layer";

            const inner = doc.createElement("div");
            inner.className = "window3d-layer-inner";

            inner.appendChild(child);

            const offsetY = (index - mid) * 40;
            const depth = (index - mid) * 80;

            layer.dataset.depth = depth.toString();
            layer.style.top = "50%";
            layer.style.left = "50%";
            layer.style.transform =
              "translate3d(-50%, calc(-50% + " +
              offsetY +
              "px), " +
              depth +
              "px)";

            layer.appendChild(inner);
            room.appendChild(layer);
          });

          scene.appendChild(room);
          window3d.appendChild(scene);
          wrapper.replaceWith(window3d);

          return doc;
        } catch (err) {
          console.error("Error in wrapHtmlIn3D:", err);
          return null;
        }
      }

      function renderDocIntoViewport(doc) {
        try {
          viewerRoot.innerHTML = "";
          const bodyChildren = Array.from(doc.body.children);
          
          if (bodyChildren.length === 0) {
            setStatus("No content to render.");
            return;
          }
          
          bodyChildren.forEach((node) => {
            viewerRoot.appendChild(node.cloneNode(true));
          });

          currentDocumentDom = doc;
          attachLayerInteraction();
          
          // Clear undo/redo stacks on new document load
          undoStack = [];
          redoStack = [];
          
          setStatus(`Site loaded with ${bodyChildren.length} element(s). Click to edit.`);
        } catch (err) {
          console.error("Error rendering document:", err);
          setStatus("Error rendering document. Check console.");
        }
      }

      function attachLayerInteraction() {
        viewerRoot.querySelectorAll(".window3d-layer").forEach((layer) => {
          layer.addEventListener("click", (event) => {
            event.stopPropagation();
            selectLayer(layer);
          });
        });

        viewerRoot.addEventListener("click", () => {
          clearSelection();
        });
      }

      function selectLayer(layer) {
        if (currentSelectedLayer === layer) return;

        if (currentSelectedLayer) {
          currentSelectedLayer.classList.remove("layer-selected");
        }

        currentSelectedLayer = layer;
        currentSelectedLayer.classList.add("layer-selected");

        const rect = layer.getBoundingClientRect();
        const hostRect = viewerRoot.getBoundingClientRect();

        selectionOutline.style.left = rect.left - hostRect.left + "px";
        selectionOutline.style.top = rect.top - hostRect.top + "px";
        selectionOutline.style.width = rect.width + "px";
        selectionOutline.style.height = rect.height + "px";
        selectionOutline.classList.remove("hidden");

        const inner = layer.querySelector(".window3d-layer-inner");
        let labelText = "Element";
        if (inner && inner.firstElementChild) {
          const tag = inner.firstElementChild.tagName.toLowerCase();
          labelText = "<" + tag + ">";
        }
        selectedTagLabel.textContent = labelText;
        selectionLabel.textContent = labelText;

        const style = window.getComputedStyle(inner);
        bgColorText.value = rgbToHex(style.backgroundColor) || "";
        textColorText.value = rgbToHex(style.color) || "";
        if (bgColorText.value) bgColorInput.value = bgColorText.value;
        if (textColorText.value) textColorInput.value = textColorText.value;

        widthInput.value = parseInt(style.width) || "";
        heightInput.value = parseInt(style.height) || "";

        const transform = layer.style.transform || "";
        const translateMatch = transform.match(
          /translate3d\(-50%, calc\(-50% \+ ([\d.-]+)px\), ([\d.-]+)px\)/
        );
        if (translateMatch) {
          const baseY = parseFloat(translateMatch[1]);
          const depth = parseFloat(translateMatch[2]);
          baseTransform =
            "translate3d(-50%, calc(-50% + " + baseY + "px), " + depth + "px)";
        } else {
          baseTransform = transform || "";
        }
        currentTranslateX = 0;
        currentTranslateY = 0;
        posxInput.value = 0;
        posyInput.value = 0;

        if (!originalStyleSnapshot.has(inner)) {
          originalStyleSnapshot.set(inner, inner.getAttribute("style") || "");
        }

        editPanel.classList.remove("hidden");
      }

      function clearSelection() {
        if (currentSelectedLayer) {
          currentSelectedLayer.classList.remove("layer-selected");
        }
        currentSelectedLayer = null;
        selectionOutline.classList.add("hidden");
        selectedTagLabel.textContent = "None selected";
        editPanel.classList.add("hidden");
      }

      function updateSelectionOutline() {
        if (!currentSelectedLayer) return;
        const rect = currentSelectedLayer.getBoundingClientRect();
        const hostRect = viewerRoot.getBoundingClientRect();

        selectionOutline.style.left = rect.left - hostRect.left + "px";
        selectionOutline.style.top = rect.top - hostRect.top + "px";
        selectionOutline.style.width = rect.width + "px";
        selectionOutline.style.height = rect.height + "px";
      }

      window.addEventListener("resize", updateSelectionOutline);

      function rgbToHex(rgb) {
        if (!rgb) return "";
        const match = rgb.match(
          /rgba?\(\s*(\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\s*\)/
        );
        if (!match) {
          if (rgb.startsWith("#")) return rgb;
          return "";
        }
        const r = parseInt(match[1], 10);
        const g = parseInt(match[2], 10);
        const b = parseInt(match[3], 10);
        return (
          "#" +
          [r, g, b]
            .map((x) => {
              const h = x.toString(16);
              return h.length === 1 ? "0" + h : h;
            })
            .join("")
        );
      }

      bgColorInput.addEventListener("input", () => {
        bgColorText.value = bgColorInput.value;
        applyColorChange();
      });

      textColorInput.addEventListener("input", () => {
        textColorText.value = textColorInput.value;
        applyColorChange();
      });

      bgColorText.addEventListener("change", () => {
        const color = bgColorText.value.trim();
        if (color && !validateHexColor(color)) {
          setStatus("Invalid color format. Use hex format like #111827");
          return;
        }
        applyColorChange();
      });
      textColorText.addEventListener("change", () => {
        const color = textColorText.value.trim();
        if (color && !validateHexColor(color)) {
          setStatus("Invalid color format. Use hex format like #e5e7eb");
          return;
        }
        applyColorChange();
      });

      function applyColorChange() {
        if (!currentSelectedLayer) return;
        const inner = currentSelectedLayer.querySelector(".window3d-layer-inner");
        if (!inner) return;
        
        saveState();
        
        if (bgColorText.value.trim()) {
          inner.style.backgroundColor = bgColorText.value.trim();
        }
        if (textColorText.value.trim()) {
          inner.style.color = textColorText.value.trim();
        }
        updateSelectionOutline();
      }

      widthInput.addEventListener("change", () => {
        if (!currentSelectedLayer) return;
        const inner = currentSelectedLayer.querySelector(".window3d-layer-inner");
        if (!inner) return;
        
        const w = sanitizeNumber(widthInput.value, 10, 5000);
        if (w === null) {
          setStatus("Invalid width value.");
          return;
        }
        
        saveState();
        
        if (w > 0) {
          inner.style.width = w + "px";
        } else {
          inner.style.removeProperty("width");
        }
        updateSelectionOutline();
      });

      heightInput.addEventListener("change", () => {
        if (!currentSelectedLayer) return;
        const inner = currentSelectedLayer.querySelector(".window3d-layer-inner");
        if (!inner) return;
        
        const h = sanitizeNumber(heightInput.value, 10, 5000);
        if (h === null) {
          setStatus("Invalid height value.");
          return;
        }
        
        saveState();
        
        if (h > 0) {
          inner.style.height = h + "px";
        } else {
          inner.style.removeProperty("height");
        }
        updateSelectionOutline();
      });

      posxInput.addEventListener("change", applyPositionChange);
      posyInput.addEventListener("change", applyPositionChange);

      function applyPositionChange() {
        if (!currentSelectedLayer) return;
        
        const x = sanitizeNumber(posxInput.value, -2000, 2000);
        const y = sanitizeNumber(posyInput.value, -2000, 2000);
        
        if (x === null || y === null) {
          setStatus("Invalid position values.");
          return;
        }
        
        saveState();
        
        currentTranslateX = x;
        currentTranslateY = y;

        const extra = " translate(" + x + "px, " + y + "px)";
        currentSelectedLayer.style.transform = baseTransform + extra;
        updateSelectionOutline();
      }

      resetElementBtn.addEventListener("click", () => {
        if (!currentSelectedLayer) return;
        const inner = currentSelectedLayer.querySelector(".window3d-layer-inner");
        if (!inner) return;
        
        saveState();
        
        const origStyle = originalStyleSnapshot.get(inner) || "";
        if (origStyle) {
          inner.setAttribute("style", origStyle);
        } else {
          inner.removeAttribute("style");
        }
        bgColorText.value = "";
        textColorText.value = "";
        widthInput.value = "";
        heightInput.value = "";
        posxInput.value = 0;
        posyInput.value = 0;
        currentTranslateX = 0;
        currentTranslateY = 0;
        currentSelectedLayer.style.transform = baseTransform;
        updateSelectionOutline();
        setStatus("Element reset to original styles.");
      });

      ingestHtmlBtn.addEventListener("click", () => {
        const html = htmlInput.value.trim();
        if (!html) {
          setStatus("No HTML to ingest. Please paste HTML first.");
          return;
        }
        
        try {
          ingestHtmlBtn.disabled = true;
          setStatus("Parsing HTML...");
          
          const doc = wrapHtmlIn3D(html);
          if (!doc) {
            setStatus("Unable to parse HTML. Check your HTML syntax.");
            return;
          }
          
          renderDocIntoViewport(doc);
          setStatus("HTML ingested successfully. Click elements to edit.");
          htmlInput.value = "";
        } catch (err) {
          console.error("HTML ingestion error:", err);
          setStatus(`Error parsing HTML: ${err.message}`);
        } finally {
          ingestHtmlBtn.disabled = false;
        }
      });

      loadUrlBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        if (!url) {
          setStatus("Enter a URL first.");
          return;
        }
        
        if (!validateUrl(url)) {
          setStatus("Invalid URL format. Please enter a valid URL.");
          return;
        }
        
        try {
          setStatus("Loading URL...");
          loadUrlBtn.disabled = true;
          
          const resp = await fetch(url);
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
          }
          
          const text = await resp.text();
          if (!text || text.trim().length === 0) {
            throw new Error("Empty response from URL");
          }
          
          const doc = wrapHtmlIn3D(text);
          if (!doc) {
            setStatus("Unable to parse HTML from URL.");
            return;
          }
          renderDocIntoViewport(doc);
          setStatus("URL loaded successfully. Click elements to edit.");
        } catch (err) {
          console.error("URL load error:", err);
          setStatus(`Failed to load URL: ${err.message}. Try pasting HTML instead.`);
        } finally {
          loadUrlBtn.disabled = false;
        }
      });

      saveStateBtn.addEventListener("click", () => {
        const exportHtml = getExportHtml();
        if (!exportHtml) {
          setStatus("Nothing to save. Load HTML first.");
          return;
        }
        try {
          localStorage.setItem("editorLastState", exportHtml);
          setStatus("State saved locally. Press Ctrl+S anytime to save.");
        } catch (e) {
          console.error("Save state error:", e);
          setStatus("Unable to save state (storage quota exceeded or disabled).");
        }
      });

      exportHtmlBtn.addEventListener("click", () => {
        const exportHtml = getExportHtml();
        if (!exportHtml) {
          setStatus("Nothing to export. Load HTML first.");
          return;
        }
        
        try {
          const filename = exportNameInput.value.trim() || "modified-site.html";
          const blob = new Blob([exportHtml], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setStatus(`HTML exported as ${filename}`);
        } catch (err) {
          console.error("Export error:", err);
          setStatus("Error exporting HTML. Check console for details.");
        }
      });

      function getExportHtml() {
        if (!currentDocumentDom) return null;

        const exportDoc = currentDocumentDom.cloneNode(true);
        exportDoc.body.innerHTML = "";
        Array.from(viewerRoot.children).forEach((node) => {
          exportDoc.body.appendChild(node.cloneNode(true));
        });

        const serializer = new XMLSerializer();
        const full = "<!DOCTYPE html>\n" + serializer.serializeToString(exportDoc);
        return full;
      }

      window.addEventListener("load", () => {
        try {
          const last = localStorage.getItem("editorLastState");
          if (last) {
            const doc = new DOMParser().parseFromString(last, "text/html");
            currentDocumentDom = doc;
            renderDocIntoViewport(doc);
            setStatus("Restored last saved state. Click elements to edit.");
          }
        } catch (e) {
          console.error("Error restoring state:", e);
          setStatus("Could not restore previous state.");
        }
      });

      helpBtn.addEventListener("click", () => {
        const helpText = `
3D Website Editor - Keyboard Shortcuts:

• Ctrl/Cmd + Z: Undo
• Ctrl/Cmd + Shift + Z: Redo
• Ctrl/Cmd + S: Save State
• Escape: Clear Selection
• Delete: Reset Selected Element

How to Use:
1. Paste HTML or load a URL
2. Click elements in the 3D view to select
3. Edit colors, size, and position in the sidebar
4. Export your modified HTML when done

Tips:
- Use hex colors like #111827
- Changes are saved in undo history
- Save state to localStorage for later
        `.trim();
        
        alert(helpText);
      });
    })();
  </script>
