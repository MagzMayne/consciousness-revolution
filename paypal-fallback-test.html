  <div class="test-container">
    <h1>PayPal Fallback Integration Test</h1>
    <p class="subtitle">This page tests the PayPal fallback mechanism when the primary API is not configured.</p>
    
    <div id="status"></div>
    
    <div class="config-info">
      <h3>Configuration Status:</h3>
      <pre id="config-output">Loading...</pre>
    </div>
    
    <div>
      <button onclick="testIntegration()">Test Integration</button>
      <button onclick="renderTestButton()">Render PayPal Button</button>
    </div>
    
    <div id="paypal-button-container"></div>
    
    <div id="test-results"></div>
  </div>

  <!-- PayPal Integration Script -->
  <script src="/src/utils/paypal-integration.js"></script>

  <script>
    // Display configuration on load
    function displayConfig() {
      const config = PayPalIntegration.getConfig();
      document.getElementById('config-output').textContent = JSON.stringify(config, null, 2);
      
      if (config.usingFallback) {
        showStatus('warning', 'Using fallback PayPal configuration. Primary CLIENT_ID not configured.');
      } else {
        showStatus('success', 'Using primary PayPal configuration.');
      }
    }

    function showStatus(type, message) {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status ' + type;
      statusDiv.textContent = message;
    }

    function testIntegration() {
      const resultsDiv = document.getElementById('test-results');
      resultsDiv.innerHTML = '<h3>Test Results:</h3>';
      
      try {
        // Test 1: Check if PayPal is available
        const isAvailable = PayPalIntegration.isAvailable();
        addTestResult('PayPal Available', isAvailable, isAvailable ? 'success' : 'error');
        
        // Test 2: Get configuration
        const config = PayPalIntegration.getConfig();
        addTestResult('Configuration Retrieved', true, 'success');
        addTestResult('Using Fallback', config.usingFallback, config.usingFallback ? 'warning' : 'success');
        addTestResult('Has Fallback', config.hasFallback, config.hasFallback ? 'success' : 'error');
        
        // Test 3: Initialize
        PayPalIntegration.init()
          .then(() => {
            addTestResult('Initialization', true, 'success');
            showStatus('success', 'All tests passed! PayPal integration is working.');
          })
          .catch(err => {
            addTestResult('Initialization', false, 'error');
            showStatus('error', 'Initialization failed: ' + err.message);
          });
        
      } catch (err) {
        showStatus('error', 'Test failed: ' + err.message);
      }
    }

    function addTestResult(name, result, status) {
      const resultsDiv = document.getElementById('test-results');
      const resultItem = document.createElement('div');
      resultItem.className = 'status ' + status;
      resultItem.textContent = `${name}: ${result}`;
      resultsDiv.appendChild(resultItem);
    }

    function renderTestButton() {
      showStatus('warning', 'Rendering PayPal button...');
      
      PayPalIntegration.renderButton('paypal-button-container', {
        amount: 10.00,
        description: 'Test Payment - $10.00',
        onSuccess: function(data) {
          showStatus('success', 'Payment successful! Order ID: ' + data.orderID);
          console.log('Payment success:', data);
        },
        onError: function(err) {
          showStatus('error', 'Payment error: ' + err.message);
          console.error('Payment error:', err);
        },
        onCancel: function(data) {
          showStatus('warning', 'Payment cancelled');
          console.log('Payment cancelled:', data);
        }
      }).then(() => {
        showStatus('success', 'PayPal button rendered successfully!');
      }).catch(err => {
        showStatus('error', 'Failed to render button: ' + err.message);
      });
    }

    // Display config on page load
    window.addEventListener('load', () => {
      setTimeout(displayConfig, 1000);
    });
  </script>
