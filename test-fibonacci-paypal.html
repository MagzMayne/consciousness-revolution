<body>
  <h1>🔧 Fibonacci Timing & PayPal Verification Test</h1>
  
  <div id="status" class="status">
    <strong>Status:</strong> <span id="statusText">Initializing...</span>
  </div>

  <div>
    <h2>Metrics</h2>
    <div class="metric">
      <div class="metric-label">Fibonacci Index</div>
      <div class="metric-value" id="fibIndex">0</div>
    </div>
    <div class="metric">
      <div class="metric-label">PayPal Valid</div>
      <div class="metric-value" id="paypalValid">-</div>
    </div>
    <div class="metric">
      <div class="metric-label">Agent R Signature</div>
      <div class="metric-value" id="agentR" style="font-size: 14px;">-</div>
    </div>
    <div class="metric">
      <div class="metric-label">Healing Runs</div>
      <div class="metric-value" id="healingRuns">0</div>
    </div>
  </div>

  <div>
    <h2>Test Controls</h2>
    <button onclick="testFibonacciSequence()">Test Fibonacci Sequence</button>
    <button onclick="testPayPalVerification()">Verify PayPal Link</button>
    <button onclick="testAgentRSignature()">Check Agent R Signature</button>
    <button onclick="testFullHealth()">Get Full Health Report</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div id="log"></div>

  <!-- Load self-healing script -->
  <script src="/self-healing.js"></script>
  
  <script>
    const logEl = document.getElementById('log');
    const statusTextEl = document.getElementById('statusText');
    const statusEl = document.getElementById('status');

    function addLog(type, message) {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toISOString()}] [${type.toUpperCase()}] ${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateStatus(text, statusClass) {
      statusTextEl.textContent = text;
      statusEl.className = `status ${statusClass}`;
    }

    function updateMetrics() {
      if (window.SelfHealing) {
        const health = window.SelfHealing.getHealth();
        document.getElementById('fibIndex').textContent = health.fibonacciIndex || 0;
        document.getElementById('paypalValid').textContent = health.paypalValid ? '✓' : '✗';
        document.getElementById('agentR').textContent = health.agentRSignature || 'N/A';
        document.getElementById('healingRuns').textContent = health.healingRuns || 0;
      }
    }

    function testFibonacciSequence() {
      addLog('info', 'Testing Fibonacci sequence...');
      
      if (window.SelfHealing) {
        const sequence = window.SelfHealing.getFibonacciSequence();
        const currentIndex = window.SelfHealing.getCurrentFibonacciIndex();
        
        addLog('info', `Fibonacci sequence (first 10): ${sequence.slice(0, 10).join(', ')}`);
        addLog('info', `Current Fibonacci index: ${currentIndex}`);
        addLog('info', `Current Fibonacci value: ${sequence[currentIndex]}`);
        
        updateStatus('Fibonacci test complete', 'ok');
      } else {
        addLog('error', 'SelfHealing module not loaded');
        updateStatus('Error: Module not loaded', 'error');
      }
    }

    function testPayPalVerification() {
      addLog('info', 'Testing PayPal link verification...');
      
      if (window.SelfHealing) {
        const isValid = window.SelfHealing.verifyPayPal();
        
        if (isValid) {
          addLog('info', 'PayPal link verified: barbrickdesign@gmail.com');
          updateStatus('PayPal verification successful', 'ok');
        } else {
          addLog('error', 'PayPal link verification failed');
          updateStatus('PayPal verification failed', 'error');
        }
        
        updateMetrics();
      } else {
        addLog('error', 'SelfHealing module not loaded');
        updateStatus('Error: Module not loaded', 'error');
      }
    }

    function testAgentRSignature() {
      addLog('info', 'Testing Agent R signature...');
      
      if (window.SelfHealing) {
        const signature = window.SelfHealing.getAgentRSignature();
        addLog('info', `Agent R Signature: ${signature}`);
        
        // Check if signature is in global scope
        if (window.__AGENT_R_SIGNATURE__) {
          addLog('info', `Global signature: ${window.__AGENT_R_SIGNATURE__}`);
        }
        
        updateStatus('Agent R signature test complete', 'ok');
        updateMetrics();
      } else {
        addLog('error', 'SelfHealing module not loaded');
        updateStatus('Error: Module not loaded', 'error');
      }
    }

    function testFullHealth() {
      addLog('info', 'Getting full health report...');
      
      if (window.SelfHealing) {
        const health = window.SelfHealing.getHealth();
        
        addLog('info', `Status: ${health.status}`);
        addLog('info', `Healing Runs: ${health.healingRuns}`);
        addLog('info', `Fibonacci Index: ${health.fibonacciIndex}`);
        addLog('info', `PayPal Valid: ${health.paypalValid ? 'Yes' : 'No'}`);
        addLog('info', `Agent R Signature: ${health.agentRSignature}`);
        addLog('info', `Last Agent R Sync: ${health.agentRLastSync ? new Date(health.agentRLastSync).toISOString() : 'N/A'}`);
        
        updateStatus(`System ${health.status}`, health.status === 'healthy' ? 'ok' : 'warn');
        updateMetrics();
      } else {
        addLog('error', 'SelfHealing module not loaded');
        updateStatus('Error: Module not loaded', 'error');
      }
    }

    function clearLog() {
      logEl.innerHTML = '';
      addLog('info', 'Log cleared');
    }

    // Initialize test page
    window.addEventListener('load', () => {
      addLog('info', 'Test page loaded');
      
      // Wait for self-healing to initialize
      setTimeout(() => {
        if (window.SelfHealing) {
          addLog('info', 'Self-Healing module detected');
          updateStatus('Self-Healing module loaded successfully', 'ok');
          updateMetrics();
          
          // Run initial tests
          testFibonacciSequence();
          testPayPalVerification();
          testAgentRSignature();
        } else {
          addLog('error', 'Self-Healing module not found');
          updateStatus('Error: Self-Healing module not loaded', 'error');
        }
      }, 1000);
      
      // Update metrics periodically
      setInterval(updateMetrics, 2000);
    });

    // Log console messages
    const originalConsoleLog = console.log;
    const originalConsoleWarn = console.warn;
    const originalConsoleError = console.error;

    console.log = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('[SelfHealing')) {
        addLog('info', args[0]);
      }
      originalConsoleLog.apply(console, args);
    };

    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('[SelfHealing')) {
        addLog('warn', args[0]);
      }
      originalConsoleWarn.apply(console, args);
    };

    console.error = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('[SelfHealing')) {
        addLog('error', args[0]);
      }
      originalConsoleError.apply(console, args);
    };
  </script>
