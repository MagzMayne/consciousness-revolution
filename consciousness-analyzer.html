<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-079FB1CA">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciousness Analyzer | Pattern Theory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/futuristic-ui.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
            background: #020208;
            background-image:
                linear-gradient(rgba(0,200,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,255,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            color: #d0d8f0;
            min-height: 100vh;
            padding: 28px 20px 60px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        h1 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 36px;
            background: linear-gradient(90deg, #00c8ff, #9b30ff, #00f5ff, #00c8ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fui-shimmer 5s linear infinite;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: rgba(6,8,28,0.9);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid rgba(0,200,255,0.15);
            position: relative;
            overflow: hidden;
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #00c8ff;
            text-shadow: 0 0 8px rgba(0,200,255,0.5);
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,200,255,0.2);
            border-radius: 10px;
            color: #d0d8f0;
            padding: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(0,200,255,0.5);
            box-shadow: 0 0 10px rgba(0,200,255,0.15);
        }

        button {
            background: linear-gradient(90deg, #00c8ff, #9b30ff, #00c8ff);
            background-size: 250% auto;
            animation: fui-shimmer 3s linear infinite;
            color: #000;
            border: none;
            padding: 13px 24px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            min-height: 48px;
            box-shadow: 0 0 16px rgba(0,200,255,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 28px rgba(0,200,255,0.55);
        }

        button:active { transform: scale(0.98); }

        .result {
            margin-top: 14px;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,200,255,0.1);
            border-radius: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.78rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            color: rgba(200,220,255,0.75);
            line-height: 1.55;
        }

        .score-display {
            text-align: center;
            padding: 20px;
        }

        .score-value {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 8vw, 4rem);
            font-weight: 900;
            color: #00c8ff;
            text-shadow: 0 0 18px rgba(0,200,255,0.7);
            line-height: 1;
        }

        .score-label {
            color: rgba(200,220,255,0.5);
            margin-top: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', sans-serif;
        }

        .domain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

        .domain-item {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(0,200,255,0.1);
        }

        .domain-item label {
            display: block;
            color: rgba(200,220,255,0.5);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
        }

        .domain-item input {
            width: 100%;
            background: rgba(0,200,255,0.05);
            border: 1px solid rgba(0,200,255,0.25);
            border-radius: 6px;
            color: #00c8ff;
            padding: 8px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .domain-item input:focus {
            outline: none;
            border-color: rgba(0,200,255,0.6);
            box-shadow: 0 0 8px rgba(0,200,255,0.2);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .status-high   { background: rgba(57,255,20,0.15); border: 1px solid #39ff14; color: #39ff14; }
        .status-medium { background: rgba(255,170,0,0.15); border: 1px solid #ffaa00; color: #ffaa00; }
        .status-low    { background: rgba(255,68,68,0.15);  border: 1px solid #ff4444; color: #ff4444; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>⚡ Consciousness Analyzer</h1>

        <div class="grid">
            <!-- Pattern Analysis -->
            <div class="card">
                <h2>📊 Pattern Analysis</h2>
                <textarea id="patternText" placeholder="Enter text to analyze for truth/deceit patterns..."></textarea>
                <button onclick="analyzePatterns()">Analyze Patterns</button>
                <div class="result" id="patternResult">Results will appear here...</div>
            </div>

            <!-- Consciousness Score -->
            <div class="card">
                <h2>🧠 Seven Domains Score</h2>
                <div class="domain-grid">
                    <div class="domain-item">
                        <label>Physical</label>
                        <input type="number" id="d-physical" value="70" min="0" max="100">
                    </div>
                    <div class="domain-item">
                        <label>Financial</label>
                        <input type="number" id="d-financial" value="60" min="0" max="100">
                    </div>
                    <div class="domain-item">
                        <label>Mental</label>
                        <input type="number" id="d-mental" value="80" min="0" max="100">
                    </div>
                    <div class="domain-item">
                        <label>Emotional</label>
                        <input type="number" id="d-emotional" value="65" min="0" max="100">
                    </div>
                    <div class="domain-item">
                        <label>Social</label>
                        <input type="number" id="d-social" value="55" min="0" max="100">
                    </div>
                    <div class="domain-item">
                        <label>Creative</label>
                        <input type="number" id="d-creative" value="75" min="0" max="100">
                    </div>
                    <div class="domain-item">
                        <label>Integration</label>
                        <input type="number" id="d-integration" value="70" min="0" max="100">
                    </div>
                </div>
                <button onclick="calculateScore()">Calculate Consciousness</button>
                <div class="score-display" id="scoreDisplay">
                    <div class="score-value">--</div>
                    <div class="score-label">Consciousness Level</div>
                </div>
            </div>
        </div>

        <!-- Full Results -->
        <div class="card" style="margin-top: 20px;">
            <h2>📋 Full Analysis Results</h2>
            <div class="result" id="fullResult">Run an analysis to see detailed results...</div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        async function analyzePatterns() {
            const text = document.getElementById('patternText').value;
            if (!text.trim()) {
                console.warn('Enter text to analyze');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/pattern-analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();

                document.getElementById('patternResult').textContent = JSON.stringify(data, null, 2);
                document.getElementById('fullResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('patternResult').textContent = 'Error: ' + error.message;
            }
        }

        async function calculateScore() {
            const domains = {
                physical: parseInt(document.getElementById('d-physical').value),
                financial: parseInt(document.getElementById('d-financial').value),
                mental: parseInt(document.getElementById('d-mental').value),
                emotional: parseInt(document.getElementById('d-emotional').value),
                social: parseInt(document.getElementById('d-social').value),
                creative: parseInt(document.getElementById('d-creative').value),
                integration: parseInt(document.getElementById('d-integration').value),
                pattern_recognition: 75,
                prediction_accuracy: 70,
                neutralization_success: 65
            };

            try {
                const response = await fetch(`${API_BASE}/api/consciousness-score`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(domains)
                });
                const data = await response.json();

                const scoreDiv = document.getElementById('scoreDisplay');
                scoreDiv.innerHTML = `
                    <div class="score-value">${data.combined_score}</div>
                    <div class="score-label">Consciousness Level</div>
                    <span class="status-badge ${data.combined_score >= 70 ? 'status-high' : data.combined_score >= 50 ? 'status-medium' : 'status-low'}">
                        ${data.status}
                    </span>
                `;

                document.getElementById('fullResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('scoreDisplay').innerHTML = '<div class="score-value">ERR</div>';
            }
        }
    </script>
    <script src="/js/bug-widget.js"></script>
    <p style="text-align:center;color:#666;font-family:monospace;margin:40px 0;">Pattern: 3 → 7 → 13 → ∞</p>
    <script src="/js/robot-assistant-loader.js"></script>
  <script src="/js/mesh-engine-client.js"></script>
</body>
</html>
