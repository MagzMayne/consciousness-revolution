<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA - AI Response & Insight Archiver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="aria-popup">
    <header class="aria-header">
      <div class="aria-logo">
        <span class="aria-icon">A</span>
        <span class="aria-title">ARIA</span>
      </div>
      <span class="aria-subtitle">AI Response & Insight Archiver</span>
    </header>

    <div class="aria-stats">
      <div class="stat-item">
        <span class="stat-value" id="totalCaptured">0</span>
        <span class="stat-label">Captured</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="lastPlatform">-</span>
        <span class="stat-label">Last Platform</span>
      </div>
    </div>

    <div class="aria-actions">
      <button id="captureAll" class="aria-btn aria-btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Capture All on Page
      </button>

      <button id="exportJson" class="aria-btn aria-btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Export JSON
      </button>

      <button id="exportZip" class="aria-btn aria-btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 8v13H3V8"/>
          <path d="M1 3h22v5H1z"/>
          <path d="M10 12h4"/>
        </svg>
        Export ZIP
      </button>

      <button id="clearAll" class="aria-btn aria-btn-danger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Clear All
      </button>
    </div>

    <div class="aria-captured-list" id="capturedList">
      <p class="empty-state">No blocks captured yet. Visit an AI platform and click the ARIA button on code blocks.</p>
    </div>

    <footer class="aria-footer">
      <a href="https://conciousnessrevolution.io" target="_blank">consciousnessrevolution.io</a>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
