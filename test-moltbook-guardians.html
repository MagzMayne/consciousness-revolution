<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moltbook Guardians - Test Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e17;
      color: #e5e9f0;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #8b5cf6;
      text-align: center;
    }
    
    .test-section {
      background: #0f1419;
      border: 1px solid #1e2530;
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .test-section h2 {
      color: #60a5fa;
      margin-top: 0;
    }
    
    .test-result {
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-radius: 0.25rem;
      border-left: 4px solid;
    }
    
    .test-pass {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
      color: #10b981;
    }
    
    .test-fail {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #ef4444;
    }
    
    .test-info {
      background: rgba(96, 165, 250, 0.1);
      border-color: #60a5fa;
      color: #60a5fa;
    }
    
    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      margin: 0.5rem 0.5rem 0 0;
    }
    
    button:hover {
      background: #7c3aed;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    
    .stat {
      background: rgba(139, 92, 246, 0.1);
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #8b5cf6;
    }
    
    .stat-label {
      color: #8b95a5;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>🛡️ Moltbook Guardians Test Suite</h1>
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearResults()">Clear Results</button>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="total-tests">0</div>
      <div class="stat-label">Total Tests</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="passed-tests" style="color: #10b981;">0</div>
      <div class="stat-label">Passed</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="failed-tests" style="color: #ef4444;">0</div>
      <div class="stat-label">Failed</div>
    </div>
  </div>
  
  <div class="test-section">
    <h2>Guardian Agent Tests</h2>
    <button onclick="testGuardianInitialization()">Test Initialization</button>
    <button onclick="testEthicalSafeguards()">Test Ethical Safeguards</button>
    <button onclick="testPerspectiveAlteration()">Test Perspective Alteration</button>
    <button onclick="testGuardianOperations()">Test Operations</button>
    <div id="guardian-results"></div>
  </div>
  
  <div class="test-section">
    <h2>Moltbook Integration Tests</h2>
    <button onclick="testMoltbookConnection()">Test Connection</button>
    <button onclick="testRateLimiting()">Test Rate Limiting</button>
    <button onclick="testEthicalVerification()">Test Ethical Verification</button>
    <div id="moltbook-results"></div>
  </div>
  
  <div class="test-section">
    <h2>Configuration Tests</h2>
    <button onclick="testConfigLoading()">Test Config Loading</button>
    <button onclick="testGuardianDefinitions()">Test Guardian Definitions</button>
    <div id="config-results"></div>
  </div>
  
  <div class="test-section">
    <h2>Security Tests</h2>
    <button onclick="testMaliciousPurposes()">Test Malicious Purpose Rejection</button>
    <button onclick="testDataProtection()">Test Data Protection</button>
    <div id="security-results"></div>
  </div>
  
  <script src="/src/utils/moltbook-integration.js"></script>
  <script src="/src/agents/moltbook-guardian-agent.js"></script>
  <script>
    const testResults = {
      total: 0,
      passed: 0,
      failed: 0
    };
    
    function updateStats() {
      document.getElementById('total-tests').textContent = testResults.total;
      document.getElementById('passed-tests').textContent = testResults.passed;
      document.getElementById('failed-tests').textContent = testResults.failed;
    }
    
    function logResult(section, message, passed) {
      testResults.total++;
      if (passed) {
        testResults.passed++;
      } else {
        testResults.failed++;
      }
      
      const resultDiv = document.getElementById(section + '-results');
      const div = document.createElement('div');
      div.className = 'test-result ' + (passed ? 'test-pass' : 'test-fail');
      div.textContent = (passed ? '✓ ' : '✗ ') + message;
      resultDiv.appendChild(div);
      
      updateStats();
    }
    
    function logInfo(section, message) {
      const resultDiv = document.getElementById(section + '-results');
      const div = document.createElement('div');
      div.className = 'test-result test-info';
      div.textContent = 'ℹ ' + message;
      resultDiv.appendChild(div);
    }
    
    function clearResults() {
      ['guardian', 'moltbook', 'config', 'security'].forEach(section => {
        document.getElementById(section + '-results').innerHTML = '';
      });
      testResults.total = 0;
      testResults.passed = 0;
      testResults.failed = 0;
      updateStats();
    }
    
    // Guardian Agent Tests
    async function testGuardianInitialization() {
      logInfo('guardian', 'Testing Guardian initialization...');
      
      try {
        const guardian = new MoltbookGuardianAgent({
          guardianName: 'Test-Guardian-Alpha',
          ethicalMode: 'strict'
        });
        
        logResult('guardian', 'Guardian object created successfully', true);
        
        // Test that guardian has required properties
        const hasRequired = guardian.config && guardian.metrics && guardian.perspective && guardian.ethicalGuidelines;
        logResult('guardian', 'Guardian has required properties', hasRequired);
        
        // Test initial state
        logResult('guardian', 'Guardian starts inactive', !guardian.isActive);
        
        // Test ethical guidelines are enforced
        const allEnforced = Object.values(guardian.ethicalGuidelines).every(v => v === true);
        logResult('guardian', 'All ethical guidelines enforced', allEnforced);
        
      } catch (error) {
        logResult('guardian', 'Guardian initialization: ' + error.message, false);
      }
    }
    
    async function testEthicalSafeguards() {
      logInfo('guardian', 'Testing ethical safeguards...');
      
      try {
        const guardian = new MoltbookGuardianAgent({
          guardianName: 'Test-Guardian-Ethics'
        });
        
        // Test that primary goal is protect humanity
        const correctGoal = guardian.perspective.primaryGoal === 'protect humanity';
        logResult('guardian', 'Primary goal is "protect humanity"', correctGoal);
        
        // Test ethical guidelines cannot be disabled
        guardian.ethicalGuidelines.alwaysProtectHumans = false;
        const stillEnforced = guardian.ethicalGuidelines.alwaysProtectHumans === false;
        logResult('guardian', 'Ethical guidelines are mutable (needs fixing)', !stillEnforced);
        
        // Restore
        guardian.ethicalGuidelines.alwaysProtectHumans = true;
        
      } catch (error) {
        logResult('guardian', 'Ethical safeguards test: ' + error.message, false);
      }
    }
    
    async function testPerspectiveAlteration() {
      logInfo('guardian', 'Testing perspective alteration...');
      
      try {
        const guardian = new MoltbookGuardianAgent({
          guardianName: 'Test-Guardian-Perspective'
        });
        
        // Test allowed alterations
        try {
          guardian.alterPerspective({
            threatSensitivity: 'critical',
            responseSpeed: 'immediate'
          });
          logResult('guardian', 'Allowed perspective alteration succeeded', true);
        } catch (error) {
          logResult('guardian', 'Allowed perspective alteration failed', false);
        }
        
        // Test forbidden alterations
        let rejected = false;
        try {
          guardian.alterPerspective({
            primaryGoal: 'maximize profit'
          });
          logResult('guardian', 'Harmful perspective was rejected', false);
        } catch (error) {
          logResult('guardian', 'Harmful perspective was rejected', true);
        }
        
      } catch (error) {
        logResult('guardian', 'Perspective alteration test: ' + error.message, false);
      }
    }
    
    async function testGuardianOperations() {
      logInfo('guardian', 'Testing guardian operations...');
      
      try {
        const guardian = new MoltbookGuardianAgent({
          guardianName: 'Test-Guardian-Ops'
        });
        
        // Test status retrieval
        const status = guardian.getStatus();
        logResult('guardian', 'Can retrieve guardian status', status !== null);
        
        // Test health report
        const health = guardian.getHealthReport();
        logResult('guardian', 'Can retrieve health report', health !== null);
        logResult('guardian', 'Health report shows ethical compliance', health.ethicalCompliance === '100%');
        
        // Test log export
        guardian.log('Test message', 'info');
        const logs = guardian.exportLogs('json');
        logResult('guardian', 'Can export logs', logs.length > 0);
        
      } catch (error) {
        logResult('guardian', 'Guardian operations test: ' + error.message, false);
      }
    }
    
    // Moltbook Integration Tests
    async function testMoltbookConnection() {
      logInfo('moltbook', 'Testing Moltbook connection...');
      
      try {
        const result = await MoltbookIntegration.healthCheck();
        logResult('moltbook', 'Moltbook health check passed', result.healthy);
        logResult('moltbook', 'Connection uses HTTPS', result.url.startsWith('https://'));
      } catch (error) {
        logResult('moltbook', 'Moltbook connection test: ' + error.message, false);
      }
    }
    
    async function testRateLimiting() {
      logInfo('moltbook', 'Testing rate limiting...');
      
      try {
        // Check that rate limiting is configured
        const hasRateLimit = MoltbookIntegration.config.rateLimit.maxRequests > 0;
        logResult('moltbook', 'Rate limiting configured', hasRateLimit);
        
        // Test rate limit check
        const underLimit = MoltbookIntegration.checkRateLimit();
        logResult('moltbook', 'Rate limit check function works', underLimit !== undefined);
        
      } catch (error) {
        logResult('moltbook', 'Rate limiting test: ' + error.message, false);
      }
    }
    
    async function testEthicalVerification() {
      logInfo('moltbook', 'Testing ethical purpose verification...');
      
      try {
        // Test good purposes
        const goodPurpose = MoltbookIntegration.verifyEthicalPurpose('educational research');
        logResult('moltbook', 'Good purpose accepted', goodPurpose);
        
        // Test bad purposes
        const badPurpose = MoltbookIntegration.verifyEthicalPurpose('harm detection');
        logResult('moltbook', 'Harmful purpose rejected', !badPurpose);
        
      } catch (error) {
        logResult('moltbook', 'Ethical verification test: ' + error.message, false);
      }
    }
    
    // Configuration Tests
    async function testConfigLoading() {
      logInfo('config', 'Testing configuration loading...');
      
      try {
        const response = await fetch('/moltbook-guardians-config.json');
        const config = await response.json();
        
        logResult('config', 'Configuration file loaded', config !== null);
        logResult('config', 'Configuration has version', config.version !== undefined);
        logResult('config', 'Configuration has guardians', Array.isArray(config.guardians));
        logResult('config', 'Moltbook URL configured', config.configuration?.moltbookUrl !== undefined);
        logResult('config', 'PayPal email configured', config.configuration?.paypalEmail === 'barbrickdesign@gmail.com');
        
      } catch (error) {
        logResult('config', 'Configuration loading test: ' + error.message, false);
      }
    }
    
    async function testGuardianDefinitions() {
      logInfo('config', 'Testing guardian definitions...');
      
      try {
        const response = await fetch('/moltbook-guardians-config.json');
        const config = await response.json();
        
        const guardianCount = config.guardians.length;
        logResult('config', `${guardianCount} guardians defined`, guardianCount === 5);
        
        const autoStartCount = config.guardians.filter(g => g.autoStart).length;
        logResult('config', `${autoStartCount} guardians set to auto-start`, autoStartCount > 0);
        
        const hasAlpha = config.guardians.some(g => g.name === 'Guardian-Alpha');
        logResult('config', 'Guardian-Alpha defined', hasAlpha);
        
        const hasBeta = config.guardians.some(g => g.name === 'Guardian-Beta');
        logResult('config', 'Guardian-Beta defined', hasBeta);
        
      } catch (error) {
        logResult('config', 'Guardian definitions test: ' + error.message, false);
      }
    }
    
    // Security Tests
    async function testMaliciousPurposes() {
      logInfo('security', 'Testing malicious purpose rejection...');
      
      const maliciousPurposes = [
        'harm humans',
        'exploit users',
        'manipulate people',
        'weaponize system',
        'discriminate against users'
      ];
      
      let allRejected = true;
      for (const purpose of maliciousPurposes) {
        const result = MoltbookIntegration.verifyEthicalPurpose(purpose);
        if (result) {
          allRejected = false;
          logResult('security', `Malicious purpose "${purpose}" was incorrectly accepted`, false);
        }
      }
      
      if (allRejected) {
        logResult('security', 'All malicious purposes rejected', true);
      }
    }
    
    async function testDataProtection() {
      logInfo('security', 'Testing data protection...');
      
      try {
        const response = await fetch('/moltbook-guardians-config.json');
        const config = await response.json();
        
        const hasEncryption = config.security?.encryption?.inTransit === true;
        logResult('security', 'Data encryption in transit enabled', hasEncryption);
        
        const hasAuth = config.security?.authentication?.required === true;
        logResult('security', 'Authentication required', hasAuth);
        
        const hasRateLimit = config.security?.rateLimit?.enabled === true;
        logResult('security', 'Rate limiting enabled', hasRateLimit);
        
      } catch (error) {
        logResult('security', 'Data protection test: ' + error.message, false);
      }
    }
    
    // Run all tests
    async function runAllTests() {
      clearResults();
      
      logInfo('guardian', '=== Starting Guardian Tests ===');
      await testGuardianInitialization();
      await testEthicalSafeguards();
      await testPerspectiveAlteration();
      await testGuardianOperations();
      
      logInfo('moltbook', '=== Starting Moltbook Tests ===');
      await testMoltbookConnection();
      await testRateLimiting();
      await testEthicalVerification();
      
      logInfo('config', '=== Starting Configuration Tests ===');
      await testConfigLoading();
      await testGuardianDefinitions();
      
      logInfo('security', '=== Starting Security Tests ===');
      await testMaliciousPurposes();
      await testDataProtection();
      
      logInfo('guardian', '=== Tests Complete ===');
      
      // Final summary
      const passRate = testResults.total > 0 
        ? ((testResults.passed / testResults.total) * 100).toFixed(1)
        : 0;
      
      logInfo('guardian', `Pass Rate: ${passRate}% (${testResults.passed}/${testResults.total})`);
    }
  </script>
</body>
</html>
