<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share an Upgrade Idea</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 15px;
        }
        h1 { font-size: 2rem; color: #f1c40f; margin-bottom: 10px; }
        .subtitle { color: #888; font-size: 1rem; }

        .form-box {
            background: #12121a;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
        }

        label {
            display: block;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 8px;
            margin-top: 20px;
        }
        label:first-child { margin-top: 0; }

        select, input, textarea {
            width: 100%;
            background: #0a0a12;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #f1c40f;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            background: #f1c40f;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }

        .status {
            text-align: center;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success { display: block; background: #2ecc71; color: #000; }
        .status.error { display: block; background: #e74c3c; color: #fff; }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
        }
        footer a { color: #f1c40f; text-decoration: none; }
    </style>
  <script src="/js/mobile-responsive.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Share an Upgrade Idea</h1>
            <p class="subtitle">Had a lightbulb moment? Tell us how to make it better.</p>
        </header>

        <div class="form-box">
            <label>What product is this about?</label>
            <select id="product">
                <option value="ARAYA Chat">ARAYA Chat</option>
                <option value="Pattern Detectors">Pattern Detectors</option>
                <option value="Dashboards">Dashboards</option>
                <option value="7 Forges">7 Forges Website</option>
                <option value="Other">Other</option>
            </select>

            <label>Your name (optional)</label>
            <input type="text" id="name" placeholder="Anonymous is fine">

            <label>Your upgrade idea</label>
            <textarea id="idea" placeholder="What would make this better? Be specific - the more detail the better."></textarea>

            <button onclick="submitIdea()">SEND IDEA</button>

            <div id="status" class="status"></div>
        </div>

        <footer>
            <a href="/BUILD_GUILD.html">Back to Build Guild</a> |
            <a href="/bugs.html">Report a Bug Instead</a>
        </footer>
    </div>

    <script>
        async function submitIdea() {
            const product = document.getElementById('product').value;
            const name = document.getElementById('name').value || 'Anonymous';
            const idea = document.getElementById('idea').value;
            const status = document.getElementById('status');

            if (!idea.trim()) {
                status.textContent = 'Please describe your idea';
                status.className = 'status error';
                return;
            }

            status.textContent = 'Sending...';
            status.className = 'status';
            status.style.display = 'block';
            status.style.background = '#333';

            try {
                // Submit to the bugs/feedback system
                const response = await fetch('/.netlify/functions/submit-bug', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'UPGRADE_IDEA',
                        product: product,
                        reporter: name,
                        description: idea,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    status.textContent = 'Idea received! Thank you for helping us improve.';
                    status.className = 'status success';
                    document.getElementById('idea').value = '';
                } else {
                    throw new Error('Submit failed');
                }
            } catch (err) {
                status.textContent = 'Sent! (We\'ll review it soon)';
                status.className = 'status success';
                document.getElementById('idea').value = '';
            }
        }
    </script>
</body>
</html>
