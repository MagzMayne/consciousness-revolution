# Jekyll Configuration for Barbrick Design GitHub Pages

# Site settings
title: Barbrick Design - Web Projects Hub
description: A collection of 300+ interactive web projects
author: Ryan Barbrick
email: BarbrickDesign@gmail.com
url: https://barbrickdesign.github.io
baseurl: ""

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links

# Enable optional front matter for markdown files
optional_front_matter:
  enabled: true

# Convert relative links to work properly
relative_links:
  enabled: true
  collections: false

# Include markdown files in the build
include:
  - "*.md"
  - "**/*.md"

# Exclude unnecessary files
exclude:
  - node_modules/
  - vendor/
  - .git/
  - .github/
  - "*.log"
  - package.json
  - package-lock.json
  - netlify.toml
  - "*.sh"
  - "*.bat"
  - backend/
  - approvals/

# Markdown file handling
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Theme
theme: jekyll-theme-minimal

# Enable emoji support
emoji: true

# Safe mode
safe: false
