<!DOCTYPE html>
<html lang="en">
<head>

    <title>Evidence Gallery - Case 21-3-00460-32</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header .case-number {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .search-bar {
            padding: 15px;
            background: rgba(0,0,0,0.2);
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: white;
            font-size: 16px;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .filter-chips {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .exhibits-container {
            padding: 15px;
        }

        .exhibit-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .exhibit-card:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.08);
        }

        .exhibit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exhibit-id {
            font-size: 20px;
            font-weight: 700;
            color: #4CAF50;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-have {
            background: #4CAF50;
            color: white;
        }

        .status-icloud {
            background: #2196F3;
            color: white;
        }

        .status-samsung {
            background: #FF9800;
            color: white;
        }

        .status-gdrive {
            background: #9C27B0;
            color: white;
        }

        .exhibit-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .exhibit-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #888;
            flex-wrap: wrap;
        }

        .exhibit-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .priority-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f44336;
            display: inline-block;
        }

        .exhibit-notes {
            margin-top: 10px;
            padding: 10px;
            background: rgba(244,67,54,0.1);
            border-left: 3px solid #f44336;
            font-size: 12px;
            border-radius: 4px;
            display: none;
        }

        .exhibit-card.expanded .exhibit-notes {
            display: block;
        }

        .type-icon {
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 12px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #888;
            font-size: 11px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-btn.active {
            color: #4CAF50;
            background: rgba(76,175,80,0.1);
        }

        .count-badge {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
            color: #888;
        }

        @media print {
            .search-bar, .filter-chips, .bottom-nav {
                display: none;
            }
            .exhibit-card {
                page-break-inside: avoid;
                border: 1px solid #000;
            }
            body {
                background: white;
                color: black;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📂 Evidence Gallery</h1>
        <div class="case-number">Case 21-3-00460-32 • Preble v. Preble</div>
    </div>

    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search exhibits...">
    </div>

    <div class="filter-chips">
        <div class="chip active" data-filter="all">All <span class="count-badge" id="countAll">0</span></div>
        <div class="chip" data-filter="photo">📸 Photos</div>
        <div class="chip" data-filter="video">🎥 Videos</div>
        <div class="chip" data-filter="audio">🎵 Audio</div>
        <div class="chip" data-filter="document">📄 Docs</div>
        <div class="chip" data-filter="priority">🔴 Priority</div>
    </div>

    <div class="exhibits-container" id="exhibitsContainer">
        <!-- Exhibits will be generated here -->
    </div>

    <div class="bottom-nav">
        <a href="case-index.html" class="nav-btn">
            <span style="font-size: 20px;">📋</span>
            <span>Overview</span>
        </a>
        <a href="case-timeline.html" class="nav-btn">
            <span style="font-size: 20px;">📅</span>
            <span>Timeline</span>
        </a>
        <a href="case-evidence-mobile.html" class="nav-btn active">
            <span style="font-size: 20px;">📂</span>
            <span>Evidence</span>
        </a>
        <a href="LEGAL_COCKPIT.html" class="nav-btn">
            <span style="font-size: 20px;">⚙️</span>
            <span>Control</span>
        </a>
    </div>

    <script>
        const exhibits = [
            // EX-1XX: Court Documents
            { id: "EX-101", title: "Decree of Dissolution", type: "document", status: "have", priority: 1, location: "Physical + PDF", notes: "Original signed decree", category: "Court Docs" },
            { id: "EX-102", title: "Parenting Plan", type: "document", status: "have", priority: 1, location: "Physical + PDF", notes: "Original parenting plan", category: "Court Docs" },
            { id: "EX-103", title: "Child Support Worksheet", type: "document", status: "have", priority: 1, location: "Physical + PDF", notes: "Financial calculations", category: "Court Docs" },

            // EX-2XX: Photos
            { id: "EX-201", title: "Distance Map - 0.62 miles", type: "photo", status: "have", priority: 1, location: "Google Maps Screenshot", notes: "Proves Karlee's house is NEXT DOOR (not 15 miles)", category: "Photos" },
            { id: "EX-202", title: "Protection Order - Page 6", type: "photo", status: "have", priority: 1, location: "iPhone Camera Roll", notes: "Shows 15-mile language on KARLEE PAGE (not mine)", category: "Photos" },
            { id: "EX-203", title: "Protection Order - My Page", type: "photo", status: "have", priority: 1, location: "iPhone Camera Roll", notes: "My page has NO 15-mile restriction", category: "Photos" },
            { id: "EX-204", title: "Karlee's House from Backyard", type: "photo", status: "samsung", priority: 2, location: "Samsung S22", notes: "Visual proof of proximity", category: "Photos" },
            { id: "EX-205", title: "Property Deed - Karlee's Name", type: "photo", status: "icloud", priority: 1, location: "iCloud Photos", notes: "Proves breach of parenting plan", category: "Photos" },

            // EX-3XX: Videos
            { id: "EX-301", title: "El - Secret Hearing Proof", type: "video", status: "samsung", priority: 1, location: "Samsung S22 Camera Roll", duration: "5:59", notes: "NEEDS BACKUP - Priority 1. Proves knowledge of secret hearing", category: "Videos" },
            { id: "EX-302", title: "Bloxham Surveillance Admission", type: "video", status: "samsung", priority: 1, location: "Samsung S22", duration: "3:22", notes: "Attorney admits to surveillance tactics", category: "Videos" },
            { id: "EX-303", title: "Karlee Pattern - Multiple Calls", type: "video", status: "icloud", priority: 2, location: "iCloud", duration: "2:15", notes: "Shows manipulation pattern", category: "Videos" },
            { id: "EX-304", title: "Children Statement - Coercion", type: "video", status: "samsung", priority: 2, location: "Samsung S22", duration: "4:10", notes: "Kids describe pressure tactics", category: "Videos" },
            { id: "EX-305", title: "Jan 14 Arrest - Body Cam 1", type: "video", status: "have", priority: 1, location: "USB Drive", duration: "12:43", notes: "Police body camera footage", category: "Videos" },
            { id: "EX-306", title: "Jan 14 Arrest - Body Cam 2", type: "video", status: "have", priority: 1, location: "USB Drive", duration: "8:17", notes: "Second officer perspective", category: "Videos" },

            // EX-4XX: Audio Recordings
            { id: "EX-401", title: "Karlee Threat - Dec 2024", type: "audio", status: "icloud", priority: 2, location: "Voice Memos iCloud", duration: "1:45", notes: "Threatening language documented", category: "Audio" },
            { id: "EX-402", title: "Attorney Call - Bloxham", type: "audio", status: "samsung", priority: 2, location: "Samsung Voice Recorder", duration: "6:30", notes: "Settlement discussion recording", category: "Audio" },

            // EX-5XX: Financial Evidence
            { id: "EX-501", title: "Payment Ledger - Full History", type: "document", status: "have", priority: 1, location: "Excel + PDF", notes: "$137,813 paid vs $129,300 required", category: "Financial" },
            { id: "EX-502", title: "Bank Statements - 2022-2024", type: "document", status: "have", priority: 2, location: "PDF Bundle", notes: "Payment verification", category: "Financial" },
            { id: "EX-503", title: "Venmo Receipts", type: "photo", status: "have", priority: 2, location: "Screenshot Collection", notes: "Digital payment trail", category: "Financial" },

            // EX-6XX: Pleadings & Filings
            { id: "EX-601", title: "Motion to Modify (Karlee) - 2022", type: "document", status: "have", priority: 2, location: "Court Records", notes: "First modification attempt", category: "Pleadings" },
            { id: "EX-602", title: "Response (Darrick) - 2022", type: "document", status: "have", priority: 2, location: "Court Records", notes: "Counter arguments", category: "Pleadings" },
            { id: "EX-603", title: "Declaration (Karlee) - 2022", type: "document", status: "have", priority: 1, location: "Court Records", notes: "Contains perjury - conflicts with 2025", category: "Pleadings" },
            { id: "EX-604", title: "Declaration (Karlee) - 2025", type: "document", status: "have", priority: 1, location: "Court Records", notes: "Contradicts 2022 declaration", category: "Pleadings" },
            { id: "EX-605", title: "Motion for Contempt", type: "document", status: "have", priority: 1, location: "Court Records", notes: "Current motion in play", category: "Pleadings" },
        ];

        let currentFilter = 'all';
        let currentSearch = '';

        function renderExhibits() {
            const container = document.getElementById('exhibitsContainer');
            const filtered = exhibits.filter(ex => {
                const matchesFilter = currentFilter === 'all' ||
                                     ex.type === currentFilter ||
                                     (currentFilter === 'priority' && ex.priority === 1);
                const matchesSearch = !currentSearch ||
                                     ex.id.toLowerCase().includes(currentSearch) ||
                                     ex.title.toLowerCase().includes(currentSearch) ||
                                     ex.category.toLowerCase().includes(currentSearch);
                return matchesFilter && matchesSearch;
            });

            document.getElementById('countAll').textContent = exhibits.length;

            container.innerHTML = filtered.map(ex => `
                <div class="exhibit-card" data-id="${ex.id}" onclick="toggleCard('${ex.id}')">
                    <div class="exhibit-header">
                        <div class="exhibit-id">${ex.id}</div>
                        <div class="status-badge status-${ex.status}">${ex.status.toUpperCase()}</div>
                    </div>
                    <div class="exhibit-title">
                        ${ex.priority === 1 ? '<span class="priority-indicator"></span> ' : ''}
                        ${getTypeIcon(ex.type)} ${ex.title}
                    </div>
                    <div class="exhibit-meta">
                        <span>📁 ${ex.category}</span>
                        ${ex.duration ? `<span>⏱️ ${ex.duration}</span>` : ''}
                        <span>📍 ${ex.location}</span>
                    </div>
                    ${ex.notes ? `<div class="exhibit-notes">⚠️ ${ex.notes}</div>` : ''}
                </div>
            `).join('');
        }

        function getTypeIcon(type) {
            const icons = {
                photo: '📸',
                video: '🎥',
                audio: '🎵',
                document: '📄'
            };
            return icons[type] || '📄';
        }

        function toggleCard(id) {
            const card = document.querySelector(`[data-id="${id}"]`);
            card.classList.toggle('expanded');
        }

        // Filter chips
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderExhibits();
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', function(e) {
            currentSearch = e.target.value.toLowerCase();
            renderExhibits();
        });

        // Initial render
        renderExhibits();
    </script>
</body>
</html>
