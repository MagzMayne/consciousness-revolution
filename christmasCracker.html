  <style>
    :root {
      --bg: #05060a;
      --grid-major: #0a1220;
      --grid-minor: #09101b;

      --capsule-width: 18vmin;
      --capsule-height: 48vmin;
      --spiral-bright: rgba(60,220,255,0.9);
      --spiral-dim: rgba(15,40,80,0.6);

      --red: #ff2a4e;
      --ribbon-dark: #b3122a;

      --snow-bloom-1: rgba(60,220,255,0.6);
      --snow-bloom-2: rgba(60,220,255,0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    body { display: grid; place-items: center; overflow: hidden; }

    .scene {
      width: 100vw; height: 100vh;
      perspective: 120vmin; perspective-origin: 50% 40%;
      position: relative;
    }

    .camera {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(16deg) rotateY(-18deg);
      transition: transform 0.25s ease-out;
    }

    .floor {
      position: absolute;
      inset: 50% 10% 0% 10%;
      transform: rotateX(90deg) translateZ(-18vmin);
      background:
        linear-gradient(var(--grid-minor) 1px, transparent 1px) 0 0 / 1.5vmin 1.5vmin,
        linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px) 0 0 / 1.5vmin 1.5vmin,
        linear-gradient(var(--grid-major) 2px, transparent 2px) 0 0 / 6vmin 6vmin,
        linear-gradient(90deg, var(--grid-major) 2px, transparent 2px) 0 0 / 6vmin 6vmin;
      box-shadow: 0 0 160px 60px rgba(14,43,128,0.25) inset;
      border-radius: 2vmin;
    }

    .capsule {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) translateZ(6vmin);
      width: var(--capsule-width); height: var(--capsule-height);
      border-radius: 50% / 20%;
      background:
        repeating-conic-gradient(
          from 0deg,
          var(--spiral-bright) 0deg 4deg,
          var(--spiral-dim) 4deg 8deg
        );
      background-size: 100% 100%;
      background-blend-mode: screen;
      box-shadow:
        0 0 24px 10px rgba(58,194,255,0.25),
        0 0 64px 24px rgba(58,194,255,0.12);
      position: relative;
      overflow: visible;
    }

    .capsule::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(to bottom, transparent 20%, rgba(60,220,255,0.2) 50%, transparent 80%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .capsule-glow {
      position: absolute;
      left: 50%;
      top: calc(50% + var(--capsule-height)/2 - 2vmin);
      transform: translate(-50%, 0);
      width: 20vmin;
      height: 6vmin;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(60,220,255,0.3), transparent 70%);
      filter: blur(12px);
      z-index: 0;
    }

    .ribbon {
      position: absolute; left: 50%; bottom: -6%;
      transform: translateX(-50%) rotate(2deg);
      width: 62%; height: 9%;
      border-radius: 50% / 40%;
      background: linear-gradient(180deg, var(--red), var(--ribbon-dark));
      box-shadow: 0 0 16px 10px rgba(255,42,78,0.22);
    }

    .ribbon::before, .ribbon::after {
      content: ""; position: absolute; top: 50%;
      width: 38%; height: 60%;
      transform-origin: 0 50%;
      background:
        radial-gradient(90% 80% at 35% 35%, rgba(255,255,255,0.18), transparent 70%),
        linear-gradient(180deg, var(--red), var(--ribbon-dark));
      filter: drop-shadow(0 0 8px rgba(255,42,78,0.35));
      clip-path: polygon(0% 0%, 100% 0%, 76% 48%, 100% 100%, 0% 100%, 24% 48%);
    }

    .ribbon::before { left: -26%; transform: translateY(-50%) rotate(-10deg); }
    .ribbon::after  { right: -26%; transform: translateY(-50%) rotate(10deg) scaleX(-1); }

    .snowflake {
      position: absolute; left: 50%;
      top: calc(50% - var(--capsule-height)/2 - 7.5vmin);
      transform: translate(-50%, -50%);
      width: 15vmin; height: 15vmin;
      filter:
        drop-shadow(0 0 18px var(--snow-bloom-1))
        drop-shadow(0 0 36px var(--snow-bloom-2));
      z-index: 2;
    }
  </style>
