<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-B5E0BDC2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100X Discord Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
        }

        .admin-key-section {
            max-width: 500px;
            margin: 0 auto 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .admin-key-section input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .admin-key-section button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .admin-key-section button:hover {
            transform: scale(1.02);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #00d9ff;
        }

        .stat-card .label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .stat-card.verified .number { color: #00ff88; }
        .stat-card.pending .number { color: #ffaa00; }
        .stat-card.flagged .number { color: #ff4444; }

        .export-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .export-btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: 2px solid;
            background: transparent;
            color: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn.csv { border-color: #00ff88; color: #00ff88; }
        .export-btn.json { border-color: #00d9ff; color: #00d9ff; }
        .export-btn.sheets { border-color: #ffaa00; color: #ffaa00; }

        .export-btn:hover {
            transform: scale(1.05);
        }

        .export-btn.csv:hover { background: rgba(0,255,136,0.1); }
        .export-btn.json:hover { background: rgba(0,217,255,0.1); }
        .export-btn.sheets:hover { background: rgba(255,170,0,0.1); }

        .members-table {
            max-width: 1400px;
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: rgba(0,217,255,0.1);
            color: #00d9ff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-verified { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status-pending { background: rgba(255,170,0,0.2); color: #ffaa00; }
        .status-flagged { background: rgba(255,68,68,0.2); color: #ff4444; }
        .status-approved { background: rgba(0,217,255,0.2); color: #00d9ff; }

        .tier-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .tier-SEED { background: rgba(128,128,128,0.3); color: #808080; }
        .tier-SEEDLING { background: rgba(144,238,144,0.2); color: #90EE90; }
        .tier-SAPLING { background: rgba(50,205,50,0.2); color: #32CD32; }
        .tier-TREE { background: rgba(34,139,34,0.2); color: #228B22; }
        .tier-FOREST { background: rgba(255,215,0,0.2); color: #FFD700; }
        .tier-ORACLE { background: rgba(139,0,139,0.2); color: #8B008B; }

        .builder-score {
            font-weight: bold;
        }
        .builder-score.high { color: #00ff88; }
        .builder-score.medium { color: #ffaa00; }
        .builder-score.low { color: #ff4444; }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #444;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            border-color: #00d9ff;
            color: #00d9ff;
            background: rgba(0,217,255,0.1);
        }

        .filter-tab:hover {
            border-color: #00d9ff;
        }

        .actions-cell {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn.approve { background: #00ff88; color: #000; }
        .action-btn.review { background: #ffaa00; color: #000; }
        .action-btn.block { background: #ff4444; color: #fff; }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>100X Discord Admin</h1>
        <p>Member Management & Export Dashboard</p>
    </div>

    <div class="admin-key-section" id="authSection">
        <input type="password" id="adminKey" placeholder="Enter admin key..." value="">
        <button onclick="authenticate()">🔐 Authenticate</button>
    </div>

    <div id="dashboard" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalCount">-</div>
                <div class="label">Total Members</div>
            </div>
            <div class="stat-card verified">
                <div class="number" id="verifiedCount">-</div>
                <div class="label">Verified</div>
            </div>
            <div class="stat-card pending">
                <div class="number" id="pendingCount">-</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-card flagged">
                <div class="number" id="flaggedCount">-</div>
                <div class="label">Flagged</div>
            </div>
        </div>

        <div class="export-buttons">
            <button class="export-btn csv" onclick="exportCSV()">
                📊 Export CSV
            </button>
            <button class="export-btn json" onclick="exportJSON()">
                📋 Export JSON
            </button>
            <button class="export-btn sheets" onclick="copyForSheets()">
                📑 Copy for Google Sheets
            </button>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all" onclick="filterMembers('all')">All</button>
            <button class="filter-tab" data-filter="verified" onclick="filterMembers('verified')">✅ Verified</button>
            <button class="filter-tab" data-filter="pending" onclick="filterMembers('pending')">⏳ Pending</button>
            <button class="filter-tab" data-filter="flagged" onclick="filterMembers('flagged')">🚩 Flagged</button>
        </div>

        <div class="members-table">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Status</th>
                        <th>Tier</th>
                        <th>XP</th>
                        <th>Builder Score</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="membersBody">
                    <tr>
                        <td colspan="7" class="loading">Loading members...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let adminKey = '';
        let allMembers = [];
        let currentFilter = 'all';

        function authenticate() {
            adminKey = document.getElementById('adminKey').value;
            if (!adminKey) {
                alert('Please enter admin key');
                return;
            }

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadMembers();
        }

        async function loadMembers() {
            try {
                const response = await fetch(`/.netlify/functions/export-members?key=${adminKey}&format=json`);
                const data = await response.json();

                if (data.error) {
                    alert('Authentication failed: ' + data.error);
                    document.getElementById('authSection').style.display = 'block';
                    document.getElementById('dashboard').style.display = 'none';
                    return;
                }

                allMembers = data.members || [];
                updateStats();
                renderMembers();
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('membersBody').innerHTML = `
                    <tr><td colspan="7" class="loading">Error loading members: ${error.message}</td></tr>
                `;
            }
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allMembers.length;
            document.getElementById('verifiedCount').textContent = allMembers.filter(m => m.verified).length;
            document.getElementById('pendingCount').textContent = allMembers.filter(m => m.verification_status === 'pending').length;
            document.getElementById('flaggedCount').textContent = allMembers.filter(m => m.verification_status === 'flagged').length;
        }

        function filterMembers(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            renderMembers();
        }

        function renderMembers() {
            let filtered = allMembers;

            if (currentFilter === 'verified') {
                filtered = allMembers.filter(m => m.verified);
            } else if (currentFilter === 'pending') {
                filtered = allMembers.filter(m => m.verification_status === 'pending');
            } else if (currentFilter === 'flagged') {
                filtered = allMembers.filter(m => m.verification_status === 'flagged');
            }

            if (filtered.length === 0) {
                document.getElementById('membersBody').innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <div class="icon">📭</div>
                        <div>No members found</div>
                    </td></tr>
                `;
                return;
            }

            const html = filtered.map(member => {
                const statusClass = member.verified ? 'verified' :
                                   (member.verification_status === 'flagged' ? 'flagged' : 'pending');
                const statusLabel = member.verified ? 'Verified' :
                                   (member.verification_status || 'Pending');

                const tierClass = member.trust_tier || 'SEED';
                const builderScore = parseFloat(member.builder_score || 0.5);
                const scoreClass = builderScore >= 0.7 ? 'high' : (builderScore >= 0.4 ? 'medium' : 'low');

                const joinedDate = member.joined_at ? new Date(member.joined_at).toLocaleDateString() : '-';

                return `
                    <tr>
                        <td><strong>${member.username || member.discord_id || 'Unknown'}</strong></td>
                        <td><span class="status-badge status-${statusClass}">${statusLabel}</span></td>
                        <td><span class="tier-badge tier-${tierClass}">${tierClass}</span></td>
                        <td>${member.total_xp || member.xp || 0}</td>
                        <td><span class="builder-score ${scoreClass}">${(builderScore * 100).toFixed(0)}%</span></td>
                        <td>${joinedDate}</td>
                        <td class="actions-cell">
                            ${!member.verified ? `<button class="action-btn approve" onclick="approveMember('${member.id}')">✓</button>` : ''}
                            <button class="action-btn review" onclick="reviewMember('${member.id}')">👁</button>
                            ${!member.is_blocked ? `<button class="action-btn block" onclick="blockMember('${member.id}')">✗</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('membersBody').innerHTML = html;
        }

        function exportCSV() {
            window.open(`/.netlify/functions/export-members?key=${adminKey}&format=csv&filter=${currentFilter}`, '_blank');
        }

        function exportJSON() {
            window.open(`/.netlify/functions/export-members?key=${adminKey}&format=json&filter=${currentFilter}`, '_blank');
        }

        function copyForSheets() {
            const headers = ['Username', 'Discord ID', 'Status', 'Tier', 'XP', 'Builder Score', 'Verified', 'Joined'];
            const rows = allMembers.map(m => [
                m.username || '',
                m.discord_id || '',
                m.verification_status || 'pending',
                m.trust_tier || 'SEED',
                m.total_xp || m.xp || 0,
                ((m.builder_score || 0.5) * 100).toFixed(0) + '%',
                m.verified ? 'Yes' : 'No',
                m.joined_at ? new Date(m.joined_at).toLocaleDateString() : ''
            ]);

            const tsv = [headers, ...rows].map(row => row.join('\t')).join('\n');
            navigator.clipboard.writeText(tsv).then(() => {
                alert('✅ Copied! Now paste directly into Google Sheets.');
            });
        }

        async function approveMember(id) {
            // TODO: Implement approval API
            alert('Approval API coming soon. Member ID: ' + id);
        }

        async function reviewMember(id) {
            const member = allMembers.find(m => m.id === id);
            if (member) {
                alert(`Member Details:\n\nUsername: ${member.username}\nDiscord ID: ${member.discord_id}\nIntro: ${member.intro_message || 'None'}\nSocial: ${member.social_link || 'None'}\nBuilder Score: ${((member.builder_score || 0.5) * 100).toFixed(0)}%`);
            }
        }

        async function blockMember(id) {
            if (confirm('Are you sure you want to block this member?')) {
                // TODO: Implement block API
                alert('Block API coming soon. Member ID: ' + id);
            }
        }

        // Auto-authenticate if key in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('key')) {
            document.getElementById('adminKey').value = urlParams.get('key');
            authenticate();
        }
    </script>
</body>
</html>
