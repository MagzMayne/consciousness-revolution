    <!-- Script to ensure THREE.js is properly loaded -->
    <script>
        // Check if THREE is properly loaded
        if (typeof THREE === 'undefined') {
            console.error('THREE.js not loaded properly, trying to fix...');
            window.THREE = window.THREE || {};
        }
        // Wait for THREE.js to load completely
        function ensureThreeJsLoaded() {
            return new Promise((resolve) => {
                if (typeof THREE !== 'undefined' && THREE.Scene && THREE.PerspectiveCamera) {
                    resolve();
                } else {
                    console.log("Waiting for THREE.js to load...");
                    setTimeout(() => ensureThreeJsLoaded().then(resolve), 100);
                }
            });
        }
    </script>
    
    <!-- Make sure your script is loaded as a module -->
    <script type="module">
        // Unified authentication check
        function checkAuthentication() {
            const currentUser = localStorage.getItem('currentUser');
            const userLoggedIn = localStorage.getItem('userLoggedIn') === 'true';

            if (!currentUser && !userLoggedIn) {
                // Save this page as the redirect target after login
                localStorage.setItem('authRedirect', 'warehouse.html');
                // Redirect to login page
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        // Run authentication check immediately
        if (!checkAuthentication()) {
            // Stop further script execution if authentication failed
            throw new Error('Authentication required');
        }

        // Create a modal function for login prompts
        function showLoginModal() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const userLoggedIn = localStorage.getItem('userLoggedIn') === 'true';
            
            // Use either authentication method
            if (!currentUser && !userLoggedIn) {
                const modalOverlay = document.createElement('div');
                modalOverlay.style.position = 'fixed';
                modalOverlay.style.top = '0';
                modalOverlay.style.left = '0';
                modalOverlay.style.width = '100%';
                modalOverlay.style.height = '100%';
                modalOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
                modalOverlay.style.display = 'flex';
                modalOverlay.style.justifyContent = 'center';
                modalOverlay.style.alignItems = 'center';
                modalOverlay.style.zIndex = '1000';
                
                const modalContent = document.createElement('div');
                modalContent.style.backgroundColor = 'rgba(0, 0, 0, 0.9)';
                modalContent.style.padding = '20px';
                modalContent.style.borderRadius = '10px';
                modalContent.style.color = 'white';
                modalContent.style.textAlign = 'center';
                modalContent.style.maxWidth = '500px';
                
                modalContent.innerHTML = `
                    <h2>Enhanced Warehouse Access</h2>
                    <p>To access all machines and features in the warehouse environment, please login or create an account.</p>
                    <p>As a guest, you can still explore but some machines will remain locked.</p>
                    <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                        <button id="login-btn" style="flex: 1; margin-right: 10px; padding: 10px; background-color: #2196f3; color: white; border: none; border-radius: 5px; cursor: pointer;">Login</button>
                        <button id="guest-btn" style="flex: 1; margin-left: 10px; padding: 10px; background-color: rgba(255,255,255,0.2); color: white; border: none; border-radius: 5px; cursor: pointer;">Continue as Guest</button>
                    </div>
                `;
                
                modalOverlay.appendChild(modalContent);
                document.body.appendChild(modalOverlay);
                
                document.getElementById('login-btn').addEventListener('click', () => {
                    window.location.href = 'login.html';
                });
                
                document.getElementById('guest-btn').addEventListener('click', () => {
                    // Set a basic guest flag so we don't keep prompting
                    localStorage.setItem('userLoggedIn', 'true');
                    document.body.removeChild(modalOverlay);
                });
                
                // Auto-remove after 10 seconds if no action
                setTimeout(() => {
                    if (document.body.contains(modalOverlay)) {
                        document.body.removeChild(modalOverlay);
                    }
                }, 10000);
            }
        }

        // Initialize background effects
        document.addEventListener('DOMContentLoaded', () => {
            window.backgroundEffects = new BackgroundEffects({
                color: '#1a90ff',
                particleCount: 100,
                particleSize: 2.5,
                connectionDistance: 180,
                speed: 0.4
            });
            
            // Add particle burst on click (like app.cline.bot)
            document.addEventListener('click', (e) => {
                window.backgroundEffects.addParticleBurst(e.clientX, e.clientY, 8);
            });
        });

        // Initialize Cline integration
        document.addEventListener('DOMContentLoaded', () => {
            // Replace with your actual API key or get from environment variables
            const clineApiKey = localStorage.getItem('clineApiKey') || '';
            
            window.clineAssistant = new ClineIntegration({
                apiKey: clineApiKey,
                theme: 'dark',
                placement: 'right',
                initialMessage: 'Hello! I\'m your assistant for the Gem Warehouse. How can I help you today?'
            });
            
            // Try to connect to your fork of Cline
            window.clineAssistant.connectToGithubFork('your-github-username', 'cline-fork')
                .then(success => {
                    if (!success && !clineApiKey) {
                        // If connecting to GitHub fork failed and no API key, offer to provide one
                        window.clineAssistant.addMessage('cline', 'It looks like you haven\'t set up your Cline API key. You can provide one in the settings or continue with limited functionality.');
                    }
                });
        });

        // Show a loading message while imports are happening
        const loadingElement = document.getElementById('loading');

        // Ensure THREE.js is loaded before loading the main script
        ensureThreeJsLoaded().then(() => {
            console.log("THREE.js successfully loaded, now loading warehouse script");
            // Import your scene script
            import('./warehouse.js')
                .then(() => {
                    // Hide loading message when script is loaded
                    if (loadingElement) loadingElement.style.display = 'none';
                    console.log("Warehouse script loaded successfully");
                    
                    // Show login modal after a short delay
                    setTimeout(() => {
                        showLoginModal();
                    }, 2000);
                    
                    // Set up view toggle functionality
                    const viewToggleBtn = document.getElementById('viewToggleBtn');
                    let currentView = 'third-person';
                    
                    if (viewToggleBtn) {
                        viewToggleBtn.addEventListener('click', () => {
                            if (window.playerControls) {
                                currentView = currentView === 'third-person' ? 'first-person' : 'third-person';
                                window.playerControls.setViewMode(currentView);
                                
                                viewToggleBtn.textContent = currentView === 'third-person' 
                                    ? 'Switch to First Person' 
                                    : 'Switch to Third Person';
                                
                                // Add small visual effect on button click
                                viewToggleBtn.style.transform = 'scale(1.1)';
                                setTimeout(() => {
                                    viewToggleBtn.style.transform = 'scale(1)';
                                }, 200);
                                
                                // Add particle burst around button
                                const rect = viewToggleBtn.getBoundingClientRect();
                                window.backgroundEffects.addParticleBurst(
                                    rect.left + rect.width/2, 
                                    rect.top + rect.height/2, 
                                    15
                                );
                            }
                        });
                    }
                    
                    // Hide control instructions after 10 seconds
                    setTimeout(() => {
                        const instructions = document.getElementById('controlInstructions');
                        if (instructions) {
                            instructions.style.opacity = '0';
                            setTimeout(() => {
                                instructions.style.display = 'none';
                            }, 1000);
                        }
                    }, 10000);
                })
                .catch(error => {
                    console.error("Error loading warehouse script:", error);
                    const errorDiv = document.getElementById('error');
                    if (errorDiv) {
                        errorDiv.textContent = `Failed to load: ${error.message}`;
                        errorDiv.style.display = 'block';
                    }
                    if (loadingElement) loadingElement.textContent = "Failed to load scene.";
                });
        });
    </script>
