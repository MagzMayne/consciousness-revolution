# Gitleaks Configuration
# Defines secret patterns to detect and files/paths to allow-list.
# Reference: https://github.com/gitleaks/gitleaks

title = "Consciousness Revolution Secret Scanner"

[extend]
# Use gitleaks default ruleset as the base
useDefault = true

# ──────────────────────────────────────────────────────────────────────────────
# CUSTOM RULES (in addition to the default ruleset)
# ──────────────────────────────────────────────────────────────────────────────

[[rules]]
id          = "google-api-key"
description = "Detected a Google/Firebase/Gemini API key"
regex       = '''AIza[0-9A-Za-z_\-]{35}'''
tags        = ["google", "firebase", "gemini", "api-key"]

[[rules]]
id          = "stripe-live-publishable-key"
description = "Detected a Stripe live publishable key"
regex       = '''pk_live_[0-9a-zA-Z]{24,}'''
tags        = ["stripe", "payment", "api-key"]

[[rules]]
id          = "stripe-test-publishable-key"
description = "Detected a Stripe test publishable key"
regex       = '''pk_test_[0-9a-zA-Z]{24,}'''
tags        = ["stripe", "payment", "api-key"]

# ──────────────────────────────────────────────────────────────────────────────
# ALLOW-LISTS — patterns and files that are intentionally safe to commit
# ──────────────────────────────────────────────────────────────────────────────

[allowlist]
description = "Global allowlist"

# Supabase anon keys are designed to be public (security enforced via RLS)
regexes = [
    # Supabase JWT anon keys
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6''',
]

# Files that contain dummy/placeholder/example keys only
paths = [
    # Example and template files
    '''.env\.example''',
    '''.env\.core\.example''',
    '''.env\.test\.example''',
    '''.env\.contributor\.example''',
    '''.env\.template''',
    # Pre-commit hook (contains patterns for detection, not real keys)
    '''scripts/pre-commit-hook\.js''',
    # Backend health checker (contains format patterns, not real keys)
    '''backend-health-checker\.js''',
    # Test files with dummy keys
    '''test-autonomous-api-manager\.js''',
    # Archive directories (old code, rotated credentials)
    '''\.archive/''',
    '''\.backups/''',
    # Tools directory
    '''tools/''',
]
