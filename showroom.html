    <script>
        // Sample featured cards data
        const FEATURED_CARDS = [
            {
                id: 'card_001',
                name: 'Golden Dragon',
                rarity: 'legendary',
                power: 95,
                edition: '1st Edition',
                price: 15.5,
                seller: '0x742d...3f8a',
                forSale: true,
                image: null
            },
            {
                id: 'card_002',
                name: 'Crystal Phoenix',
                rarity: 'legendary',
                power: 92,
                edition: 'Limited',
                price: 12.0,
                seller: '0x8d3c...9a2b',
                forSale: true,
                image: null
            },
            {
                id: 'card_003',
                name: 'Shadow Assassin',
                rarity: 'epic',
                power: 85,
                edition: '2nd Edition',
                price: 5.5,
                seller: '0x1f5e...7c4d',
                forSale: true,
                image: null
            },
            {
                id: 'card_004',
                name: 'Mystic Sage',
                rarity: 'epic',
                power: 88,
                edition: '1st Edition',
                price: 6.2,
                seller: '0x9b2a...5e6f',
                forSale: true,
                image: null
            },
            {
                id: 'card_005',
                name: 'Thunder Knight',
                rarity: 'rare',
                power: 78,
                edition: 'Standard',
                price: 2.3,
                seller: '0x4c7d...8a1b',
                forSale: true,
                image: null
            },
            {
                id: 'card_006',
                name: 'Fire Elemental',
                rarity: 'rare',
                power: 75,
                edition: 'Standard',
                price: 1.9,
                seller: '0x6e8f...2d3c',
                forSale: true,
                image: null
            }
        ];

        let currentFilter = 'all';
        let currentWallet = null;
        let currentBalance = 10.0;

        // Initialize
        function init() {
            initWallet();
            renderCards();
            setupFilters();
            updateWalletUI();
        }

        function initWallet() {
            if (window.SharedWalletSystem) {
                const wallet = new SharedWalletSystem();
                if (wallet.connected) {
                    currentWallet = wallet.address;
                }
            }
            if (!currentWallet) {
                currentWallet = 'demo_' + Math.random().toString(36).substring(2, 11);
            }
        }

        function updateWalletUI() {
            const walletEl = document.getElementById('walletAddress');
            const balanceEl = document.getElementById('balance');

            if (currentWallet) {
                walletEl.textContent = currentWallet.substring(0, 6) + '...' + currentWallet.substring(currentWallet.length - 4);
                balanceEl.textContent = `${currentBalance.toFixed(2)} SOL`;
            }
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderCards();
                });
            });
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            
            // Filter cards
            let filteredCards = FEATURED_CARDS;
            if (currentFilter !== 'all') {
                if (currentFilter === 'for-sale') {
                    filteredCards = FEATURED_CARDS.filter(c => c.forSale);
                } else {
                    filteredCards = FEATURED_CARDS.filter(c => c.rarity === currentFilter);
                }
            }

            if (filteredCards.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No cards found</h3>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            filteredCards.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                cardEl.innerHTML = `
                    <div class="card-3d-preview" id="preview-${card.id}"></div>
                    <div class="card-details">
                        <h3 class="card-name">${card.name}</h3>
                        <span class="card-rarity ${card.rarity}">${card.rarity}</span>
                        <div class="card-stats">
                            <div class="stat">
                                <div class="stat-label">Power</div>
                                <div class="stat-value">${card.power}</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">Edition</div>
                                <div class="stat-value" style="font-size: 0.9rem;">${card.edition}</div>
                            </div>
                        </div>
                        ${card.forSale ? `
                            <div class="card-price">
                                <span class="price-label">Listed Price</span>
                                <span class="price-value">${card.price} SOL</span>
                            </div>
                            <div class="card-seller">
                                <span>Seller:</span>
                                <span class="seller-address">${card.seller}</span>
                            </div>
                            <button class="btn btn-primary" onclick="buyCard('${card.id}')">
                                Buy Now
                            </button>
                        ` : `
                            <div class="card-price">
                                <span class="price-label">Market Value</span>
                                <span class="price-value">${card.price} SOL</span>
                            </div>
                            <button class="btn btn-secondary" disabled>
                                Not For Sale
                            </button>
                        `}
                    </div>
                `;
                grid.appendChild(cardEl);

                // Initialize 3D preview
                init3DCardPreview(`preview-${card.id}`, card.rarity);
            });
        }

        function init3DCardPreview(containerId, rarity) {
            const container = document.getElementById(containerId);
            if (!container || !window.THREE) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Card geometry
            const geometry = new THREE.BoxGeometry(2.5, 3.5, 0.1);
            
            const colors = {
                common: 0x9ca3af,
                rare: 0x3b82f6,
                epic: 0xa855f7,
                legendary: 0xfbbf24
            };

            const material = new THREE.MeshPhongMaterial({
                color: colors[rarity] || 0x38bdf8,
                emissive: colors[rarity] || 0x38bdf8,
                emissiveIntensity: 0.3,
                shininess: 100,
                flatShading: false
            });

            const card = new THREE.Mesh(geometry, material);
            scene.add(card);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(colors[rarity] || 0x38bdf8, 1.5, 100);
            pointLight.position.set(2, 3, 5);
            scene.add(pointLight);

            camera.position.z = 6;

            // Animation
            let rotation = 0;
            function animate() {
                requestAnimationFrame(animate);
                rotation += 0.01;
                card.rotation.y = Math.sin(rotation) * 0.3;
                card.rotation.x = Math.cos(rotation * 0.5) * 0.1;
                renderer.render(scene, camera);
            }
            animate();
        }

        function buyCard(cardId) {
            const card = FEATURED_CARDS.find(c => c.id === cardId);
            if (!card) return;

            if (currentBalance < card.price) {
                alert('Insufficient balance to purchase this card!');
                return;
            }

            if (confirm(`Purchase ${card.name} for ${card.price} SOL?`)) {
                currentBalance -= card.price;
                updateWalletUI();
                
                // Remove from sale
                card.forSale = false;
                
                // Save to local collection
                const collection = JSON.parse(localStorage.getItem('card_collection') || '[]');
                collection.push({
                    ...card,
                    purchasePrice: card.price,
                    purchaseDate: new Date().toISOString(),
                    owner: currentWallet
                });
                localStorage.setItem('card_collection', JSON.stringify(collection));

                alert(`Successfully purchased ${card.name}! Check your collection.`);
                renderCards();
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>

                    BarbrickUniversal.createFooter();
                }
            }
        });
    </script>
</body>
