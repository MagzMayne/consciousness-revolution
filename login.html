    <script>
        // Initialize Google Authentication
        async function initGoogleAuth() {
            try {
                // Try to load OAuth config
                let clientId = null;
                if (window.OAuthConfig) {
                    const config = new window.OAuthConfig();
                    if (config.isGoogleConfigured()) {
                        clientId = config.getGoogleClientId();
                    }
                }
                
                // Initialize Google OAuth
                if (window.googleOAuthAuth) {
                    await window.googleOAuthAuth.init(clientId);
                    
                    // Render sign-in buttons if configured
                    if (window.googleOAuthAuth.isInitialized) {
                        window.googleOAuthAuth.renderSignInButton('google-signin-button', {
                            theme: 'filled_blue',
                            size: 'large',
                            text: 'signin_with',
                            width: 300
                        });
                        
                        window.googleOAuthAuth.renderSignInButton('google-signup-button', {
                            theme: 'filled_blue',
                            size: 'large',
                            text: 'signup_with',
                            width: 300
                        });
                    }
                    
                    // Listen for auth changes
                    window.googleOAuthAuth.onAuthChange((isAuthenticated, user) => {
                        if (isAuthenticated) {
                            console.log('✅ Google authentication successful');
                            
                            // Store user in localStorage for compatibility with existing auth
                            localStorage.setItem('currentUser', JSON.stringify({
                                email: user.email,
                                displayName: user.name,
                                photoURL: user.picture,
                                provider: 'google'
                            }));
                            localStorage.setItem('isLoggedIn', 'true');
                            
                            // Redirect after successful login
                            const redirectUrl = localStorage.getItem('authRedirect');
                            if (redirectUrl) {
                                localStorage.removeItem('authRedirect');
                                window.location.href = redirectUrl;
                            } else {
                                window.location.href = 'SEVEN_DOMAINS_HUB.html';
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Error initializing Google auth:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Clear any stale bypass flags that may have been set previously
            localStorage.removeItem('araya_commander');

            // Initialize Google Auth
            initGoogleAuth();
            
            // Toggle between login and signup forms
            document.getElementById('show-signup').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
            });

            document.getElementById('show-login').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            });
            
            // Check if URL has #signup hash
            if (window.location.hash === '#signup') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
            }

            // Handle login form submission
            document.getElementById('login-button').addEventListener('click', async () => {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                if (!email || !password) {
                    alert('Please enter your email and password.');
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert('Please enter a valid email address.');
                    return;
                }

                const btn = document.getElementById('login-button');
                btn.disabled = true;
                btn.textContent = 'Logging in...';

                try {
                    if (typeof login === 'function') {
                        await login(email, password);
                        // Only redirect on success (login() throws on failure)
                        const redirectUrl = localStorage.getItem('authRedirect');
                        if (redirectUrl) {
                            localStorage.removeItem('authRedirect');
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = 'SEVEN_DOMAINS_HUB.html';
                        }
                    } else {
                        alert('Login functionality is not available. Please try again later.');
                    }
                } catch (err) {
                    if (err && err.message && !String(err.message).toLowerCase().includes('login failed')) {
                        alert('Login failed. Please check your credentials and try again.');
                    }
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            });

            // Handle signup form submission
            document.getElementById('signup-button').addEventListener('click', async () => {
                const displayName = document.getElementById('display-name').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const password = document.getElementById('signup-password').value;

                if (!email || !password) {
                    alert('Please enter your email and password.');
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert('Please enter a valid email address.');
                    return;
                }

                if (password.length < 8) {
                    alert('Password must be at least 8 characters long.');
                    return;
                }

                const btn = document.getElementById('signup-button');
                btn.disabled = true;
                btn.textContent = 'Creating account...';

                try {
                    if (typeof signUp === 'function') {
                        await signUp(email, password, displayName);
                        // Only redirect on success (signUp() throws on failure)
                        const redirectUrl = localStorage.getItem('authRedirect');
                        if (redirectUrl) {
                            localStorage.removeItem('authRedirect');
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = 'SEVEN_DOMAINS_HUB.html';
                        }
                    } else {
                        alert('Signup functionality is not available. Please try again later.');
                    }
                } catch (err) {
                    if (err && err.message && !String(err.message).toLowerCase().includes('signup failed')) {
                        alert('Signup failed. Please try again.');
                    }
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Sign Up';
                }
            });

            // If user is already authenticated via a valid session, redirect
            const currentUser = localStorage.getItem('currentUser');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (currentUser && isLoggedIn) {
                const redirectUrl = localStorage.getItem('authRedirect');
                if (redirectUrl) {
                    localStorage.removeItem('authRedirect');
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = 'SEVEN_DOMAINS_HUB.html';
                }
            }
        });
