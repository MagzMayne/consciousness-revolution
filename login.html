    <script>
        // Initialize Google Authentication
        async function initGoogleAuth() {
            try {
                // Try to load OAuth config
                let clientId = null;
                if (window.OAuthConfig) {
                    const config = new window.OAuthConfig();
                    if (config.isGoogleConfigured()) {
                        clientId = config.getGoogleClientId();
                    }
                }
                
                // Initialize Google OAuth
                if (window.googleOAuthAuth) {
                    await window.googleOAuthAuth.init(clientId);
                    
                    // Render sign-in buttons if configured
                    if (window.googleOAuthAuth.isInitialized) {
                        window.googleOAuthAuth.renderSignInButton('google-signin-button', {
                            theme: 'filled_blue',
                            size: 'large',
                            text: 'signin_with',
                            width: 300
                        });
                        
                        window.googleOAuthAuth.renderSignInButton('google-signup-button', {
                            theme: 'filled_blue',
                            size: 'large',
                            text: 'signup_with',
                            width: 300
                        });
                    }
                    
                    // Listen for auth changes
                    window.googleOAuthAuth.onAuthChange((isAuthenticated, user) => {
                        if (isAuthenticated) {
                            console.log('✅ Google authentication successful:', user.email);
                            
                            // Store user in localStorage for compatibility with existing auth
                            localStorage.setItem('currentUser', JSON.stringify({
                                email: user.email,
                                displayName: user.name,
                                photoURL: user.picture,
                                provider: 'google'
                            }));
                            
                            // Redirect after successful login
                            const redirectUrl = localStorage.getItem('authRedirect');
                            if (redirectUrl) {
                                localStorage.removeItem('authRedirect');
                                window.location.href = redirectUrl;
                            } else {
                                window.location.href = 'SEVEN_DOMAINS_HUB.html';
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Error initializing Google auth:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Google Auth
            initGoogleAuth();
            
            // Toggle between login and signup forms
            document.getElementById('show-signup').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
            });

            document.getElementById('show-login').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            });
            
            // Check if URL has #signup hash
            if (window.location.hash === '#signup') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
            }

            // Handle login form submission
            document.getElementById('login-button').addEventListener('click', () => {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Use the global login function
                if (typeof login === 'function') {
                    login(email, password);
                    
                    // Check for redirect URL from localStorage
                    const redirectUrl = localStorage.getItem('authRedirect');
                    if (redirectUrl) {
                        localStorage.removeItem('authRedirect');
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = 'SEVEN_DOMAINS_HUB.html';
                    }
                } else {
                    console.error("Login function not found");
                    alert("Login functionality is not available. Please try again later.");
                }
            });

            // Handle signup form submission
            document.getElementById('signup-button').addEventListener('click', () => {
                const displayName = document.getElementById('display-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                
                // Use the global signUp function
                if (typeof signUp === 'function') {
                    signUp(email, password, displayName);
                    
                    // Check for redirect URL from localStorage
                    const redirectUrl = localStorage.getItem('authRedirect');
                    if (redirectUrl) {
                        localStorage.removeItem('authRedirect');
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = 'SEVEN_DOMAINS_HUB.html';
                    }
                } else {
                    console.error("SignUp function not found");
                    alert("Signup functionality is not available. Please try again later.");
                }
            });

            // Handle Phantom Wallet buttons removed - replaced with Google Sign-In
            
            // If user is already logged in, redirect to intended destination
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                const redirectUrl = localStorage.getItem('authRedirect');
                if (redirectUrl) {
                    localStorage.removeItem('authRedirect');
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = 'SEVEN_DOMAINS_HUB.html';
                }
            }
        });

        // Transaction section and MGC wallet functions removed - not needed for consciousness revolution
    </script>
