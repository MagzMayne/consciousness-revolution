<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Lobby - Consciousness Revolution</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #1a1a1a;
      --bg-hover: #252525;
      --text-primary: #ffffff;
      --text-secondary: #999999;
      --border-color: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .lobby-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-button {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .back-button:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .forge-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .forge-icon-large {
      font-size: 2.5rem;
    }

    .forge-title h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .forge-title p {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* Progress Widget */
    .progress-widget {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .progress-widget.locked {
      opacity: 0.6;
      border-color: #555;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .progress-title {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .title-text h3 {
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
    }

    .forge-tagline {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .overall-level {
      text-align: right;
    }

    .level-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .level-number {
      display: block;
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .progress-main {
      margin-bottom: 1.5rem;
    }

    .level-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .level-display .level-label {
      font-size: 0.9rem;
    }

    .level-display .level-number {
      font-size: 2rem;
    }

    .xp-bar-container {
      position: relative;
      background: #222;
      border-radius: 20px;
      height: 32px;
      overflow: hidden;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border-color);
    }

    .xp-bar {
      height: 100%;
      border-radius: 20px;
      position: relative;
      transition: width 0.5s ease;
      overflow: hidden;
    }

    .xp-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shine 2s infinite;
    }

    @keyframes shine {
      to { left: 200%; }
    }

    .xp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.85rem;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .xp-separator {
      margin: 0 0.5rem;
      color: var(--text-secondary);
    }

    .progress-footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .forge-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .stat {
      text-align: center;
    }

    .stat-icon {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .stat-value {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .stat-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Locked State */
    .locked-state {
      text-align: center;
      padding: 2rem 0;
    }

    .lock-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .lock-message {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .lock-hint {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Main Content */
    .lobby-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Daily Ritual */
    .daily-ritual {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .ritual-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .ritual-prompt {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .ritual-input {
      width: 100%;
      max-width: 600px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      color: var(--text-primary);
      font-size: 1rem;
      margin-bottom: 1rem;
      resize: vertical;
      min-height: 80px;
    }

    .ritual-submit {
      background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .ritual-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
    }

    /* Navigation Cards */
    .nav-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .nav-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .nav-card:hover {
      transform: translateY(-4px);
      border-color: var(--text-secondary);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .nav-card-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    .nav-card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .nav-card-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Journey Timeline */
    .journey-timeline {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .timeline-header h2 {
      font-size: 1.5rem;
    }

    .view-all-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .view-all-link:hover {
      color: var(--text-primary);
    }

    .timeline-items {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
    }

    .timeline-item {
      flex: 0 0 200px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .timeline-item:hover {
      border-color: var(--text-secondary);
      transform: scale(1.05);
    }

    .timeline-item.completed {
      border-color: #00ff00;
    }

    .timeline-item.current {
      border-color: #FFD700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
    }

    .timeline-item.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .timeline-number {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .timeline-name {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .timeline-status {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Login Prompt */
    .login-prompt {
      text-align: center;
      padding: 3rem;
    }

    .login-content h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .login-content p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    #email-input {
      width: 100%;
      max-width: 400px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .primary-button {
      background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
    }

    /* Level Up Overlay */
    .level-up-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .level-up-overlay.fade-out {
      animation: fadeOut 0.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .level-up-content {
      text-align: center;
      animation: scaleIn 0.5s;
    }

    @keyframes scaleIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .level-up-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: rotate 1s infinite linear;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .level-up-content h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-level {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .lobby-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1rem;
      }

      .forge-icon-large {
        font-size: 2rem;
      }

      .forge-title h1 {
        font-size: 1.4rem;
      }

      .lobby-content {
        padding: 1rem;
      }

      .nav-cards {
        grid-template-columns: 1fr;
      }

      .forge-stats {
        grid-template-columns: 1fr;
      }

      .timeline-items {
        flex-wrap: nowrap;
      }
    }

    /* Error State */
    .error-state {
      text-align: center;
      padding: 3rem;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    .error-content h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .error-content p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="lobby-header">
    <div class="header-left">
      <button class="back-button" onclick="window.location.href='/'">← All Forges</button>
      <div class="forge-title">
        <span class="forge-icon-large" id="header-icon">🔥</span>
        <div>
          <h1 id="header-title">Reality Forge</h1>
          <p id="header-tagline">Build the foundation of your world</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="lobby-content">

    <!-- Progress Widget -->
    <div id="progress-widget-container"></div>

    <!-- Lobby Message -->
    <div class="daily-ritual">
      <div class="ritual-icon" id="ritual-icon">🔥</div>
      <div class="ritual-prompt" id="ritual-prompt">What truth did you face today?</div>
      <textarea class="ritual-input" id="ritual-input" placeholder="Share your reflection..."></textarea>
      <button class="ritual-submit" onclick="submitRitual()">Submit Reflection</button>
    </div>

    <!-- Navigation Cards -->
    <div class="nav-cards" id="nav-cards-container">
      <!-- Populated by JS -->
    </div>

    <!-- Journey Timeline -->
    <div class="journey-timeline">
      <div class="timeline-header">
        <h2>Your Journey</h2>
        <a href="#" class="view-all-link" onclick="viewAllLevels(); return false;">View All Levels →</a>
      </div>
      <div class="timeline-items" id="timeline-items">
        <!-- Populated by JS -->
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="forge-data.js"></script>
  <script src="lobby-progress-widget.js"></script>

  <script>
    // Get forge slug from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const forgeSlug = urlParams.get('forge') || 'reality';

    // Get forge data
    const forge = getForgeBySlug(forgeSlug);

    if (!forge) {
      window.location.href = '/';
    }

    // Initialize page
    let progressWidget;

    function initPage() {
      // Set dynamic content
      document.getElementById('header-icon').textContent = forge.icon;
      document.getElementById('header-title').textContent = forge.name;
      document.getElementById('header-tagline').textContent = forge.tagline;
      document.getElementById('ritual-icon').textContent = forge.icon;
      document.getElementById('ritual-prompt').textContent = forge.dailyRitual;

      // Set theme color
      document.documentElement.style.setProperty('--forge-color', forge.color);
      document.documentElement.style.setProperty('--forge-gradient', forge.gradient);

      // Update ritual button gradient
      const ritualButton = document.querySelector('.ritual-submit');
      ritualButton.style.background = forge.gradient;

      // Initialize progress widget
      progressWidget = new LobbyProgressWidget('progress-widget-container', forgeSlug);
      progressWidget.init();

      // Render navigation cards
      renderNavigationCards();

      // Render timeline
      renderTimeline();
    }

    function renderNavigationCards() {
      const container = document.getElementById('nav-cards-container');
      container.innerHTML = forge.navigationCards.map(card => `
        <a href="${card.route}" class="nav-card">
          <span class="nav-card-icon">${card.icon}</span>
          <div class="nav-card-title">${card.title}</div>
          <div class="nav-card-description">${card.description}</div>
        </a>
      `).join('');
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-items');
      const levels = [
        { num: 1, name: "Awakening", status: "completed" },
        { num: 2, name: "Foundation", status: "completed" },
        { num: 3, name: "Growth", status: "current" },
        { num: 4, name: "Power", status: "locked" },
        { num: 5, name: "Mastery", status: "locked" },
        { num: 6, name: "Wisdom", status: "locked" },
        { num: 7, name: "Transcendence", status: "locked" }
      ];

      container.innerHTML = levels.map(level => `
        <div class="timeline-item ${level.status}" onclick="viewLevel(${level.num})">
          <div class="timeline-number">${level.num}</div>
          <div class="timeline-name">${level.name}</div>
          <div class="timeline-status">${level.status}</div>
        </div>
      `).join('');
    }

    async function submitRitual() {
      const input = document.getElementById('ritual-input');
      const reflection = input.value.trim();

      if (!reflection) {
        alert('Please enter your reflection');
        return;
      }

      // Award XP for completing daily ritual
      const xpGained = 50;
      await progressWidget.addXP(xpGained);

      // Show success message
      alert(`✨ Reflection submitted! +${xpGained} XP`);

      // Clear input
      input.value = '';

      // Store reflection (could save to API/database)
      const reflections = JSON.parse(localStorage.getItem('reflections') || '[]');
      reflections.push({
        forge: forgeSlug,
        date: new Date().toISOString(),
        text: reflection
      });
      localStorage.setItem('reflections', JSON.stringify(reflections));
    }

    function viewLevel(levelNum) {
      window.location.href = `/forge/${forgeSlug}/level?num=${levelNum}`;
    }

    function viewAllLevels() {
      window.location.href = `/forge/${forgeSlug}/levels`;
    }

    // Initialize on load
    initPage();
  </script>

</body>
</html>
