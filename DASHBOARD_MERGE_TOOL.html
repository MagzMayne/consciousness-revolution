<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Merge Tool - Consciousness Revolution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #00ffff;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ffff;
    }

    .tagline {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .workflow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .panel {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 8px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: #00ffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      margin-top: 15px;
    }

    label:first-child {
      margin-top: 0;
    }

    select, input {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1px solid #00ffff;
      color: #00ffff;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    select:focus, input:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(0,255,255,0.5);
    }

    .feature-list {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 4px;
      padding: 10px;
      background: rgba(0,0,0,0.2);
    }

    .feature-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      margin-bottom: 5px;
      background: rgba(0,255,255,0.05);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .feature-checkbox:hover {
      background: rgba(0,255,255,0.1);
      transform: translateX(5px);
    }

    .feature-checkbox input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    .feature-info {
      flex: 1;
    }

    .feature-name {
      font-weight: bold;
      color: #00ffff;
    }

    .feature-meta {
      font-size: 0.75rem;
      color: #888;
      margin-top: 3px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      background: linear-gradient(135deg, #00ffff 0%, #0099ff 100%);
      border: none;
      color: #000;
      padding: 12px 30px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0,255,255,0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary {
      background: linear-gradient(135deg, #888 0%, #555 100%);
    }

    button.danger {
      background: linear-gradient(135deg, #ff6b6b 0%, #cc0000 100%);
    }

    .preview-panel {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      display: none;
    }

    .preview-panel.visible {
      display: block;
    }

    .preview-panel h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: #ffd700;
    }

    .preview-iframe {
      width: 100%;
      height: 600px;
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 4px;
      background: white;
    }

    .injection-log {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 4px;
      padding: 15px;
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
    }

    .log-entry {
      padding: 8px;
      margin-bottom: 5px;
      background: rgba(0,255,255,0.05);
      border-left: 3px solid #00ff88;
      border-radius: 4px;
    }

    .log-entry.error {
      border-left-color: #ff6b6b;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: #00ffff;
    }

    .error {
      background: rgba(255,107,107,0.1);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .success {
      background: rgba(0,255,136,0.1);
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .warning {
      background: rgba(255,215,0,0.1);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .stat-card {
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0,255,255,0.5);
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 DASHBOARD MERGE TOOL</h1>
    <p class="tagline">Cherry-pick features between dashboards with smart injection</p>

    <div class="workflow">
      <!-- Source Selection -->
      <div class="panel">
        <h2>📦 Source Dashboard</h2>
        <label for="sourceDashboard">Select Source</label>
        <select id="sourceDashboard">
          <option value="">-- Select Dashboard --</option>
        </select>

        <label>Available Features</label>
        <div id="sourceFeatures" class="feature-list">
          <div style="text-align: center; color: #666; padding: 20px;">
            Select a source dashboard to see features
          </div>
        </div>
      </div>

      <!-- Target Selection -->
      <div class="panel">
        <h2>🎯 Target Dashboard</h2>
        <label for="targetDashboard">Select Target</label>
        <select id="targetDashboard">
          <option value="">-- Select Dashboard --</option>
        </select>

        <label for="injectionStrategy">Injection Strategy</label>
        <select id="injectionStrategy">
          <option value="append">Append (before &lt;/body&gt;)</option>
          <option value="smart">Smart (near similar widgets)</option>
          <option value="quadrant">Quadrant (top-right)</option>
        </select>

        <div class="button-group">
          <button id="previewBtn" disabled>🔍 Preview</button>
          <button id="mergeBtn" class="danger" disabled>🚀 Merge</button>
        </div>
      </div>
    </div>

    <!-- Preview Panel -->
    <div id="previewPanel" class="preview-panel">
      <h2>👁️ Preview (Changes NOT Saved)</h2>

      <div id="previewStats" class="stats">
        <div class="stat-card">
          <div class="stat-value" id="statFeaturesMerged">0</div>
          <div class="stat-label">Features Merged</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statStrategy">-</div>
          <div class="stat-label">Strategy Used</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statVersion">-</div>
          <div class="stat-label">New Version</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statSize">-</div>
          <div class="stat-label">Size Change</div>
        </div>
      </div>

      <div id="injectionLog" class="injection-log"></div>

      <iframe id="previewFrame" class="preview-iframe"></iframe>
    </div>

    <div id="results"></div>
  </div>

  <script>
    let selectedFeatures = new Set();
    let registry = null;

    // Load available dashboards
    async function loadDashboards() {
      try {
        const response = await fetch('/DASHBOARD_FEATURES_REGISTRY.json');
        registry = await response.json();

        // Extract unique dashboard names
        const dashboards = new Set();
        registry.features.forEach(feature => {
          feature.installations.forEach(inst => {
            dashboards.add(inst.dashboard);
          });
        });

        // Populate dropdowns
        const sortedDashboards = Array.from(dashboards).sort();
        const sourceSelect = document.getElementById('sourceDashboard');
        const targetSelect = document.getElementById('targetDashboard');

        sortedDashboards.forEach(dash => {
          const displayName = dash.replace('.html', '');
          sourceSelect.innerHTML += `<option value="${dash}">${displayName}</option>`;
          targetSelect.innerHTML += `<option value="${dash}">${displayName}</option>`;
        });

      } catch (error) {
        console.error('Failed to load dashboards:', error);
        showError(`Failed to load dashboard list: ${error.message}`);
      }
    }

    // Load features for selected source dashboard
    document.getElementById('sourceDashboard').addEventListener('change', (e) => {
      const dashboard = e.target.value;
      if (!dashboard) {
        document.getElementById('sourceFeatures').innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">Select a source dashboard to see features</div>';
        return;
      }

      loadSourceFeatures(dashboard);
    });

    function loadSourceFeatures(dashboard) {
      selectedFeatures.clear();
      const features = [];

      registry.features.forEach(feature => {
        const installation = feature.installations.find(inst => inst.dashboard === dashboard);
        if (installation) {
          features.push({
            id: feature.id,
            name: feature.name,
            version: installation.version,
            category: feature.category,
            author: feature.author
          });
        }
      });

      if (features.length === 0) {
        document.getElementById('sourceFeatures').innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No features found on this dashboard</div>';
        return;
      }

      const html = features.map(feat => `
        <label class="feature-checkbox">
          <input type="checkbox" value="${feat.id}" onchange="toggleFeature('${feat.id}')">
          <div class="feature-info">
            <div class="feature-name">${feat.name}</div>
            <div class="feature-meta">
              v${feat.version} • ${feat.category} • ${feat.author}
            </div>
          </div>
        </label>
      `).join('');

      document.getElementById('sourceFeatures').innerHTML = html;
      updateButtons();
    }

    function toggleFeature(featureId) {
      if (selectedFeatures.has(featureId)) {
        selectedFeatures.delete(featureId);
      } else {
        selectedFeatures.add(featureId);
      }
      updateButtons();
    }

    function updateButtons() {
      const source = document.getElementById('sourceDashboard').value;
      const target = document.getElementById('targetDashboard').value;
      const hasFeatures = selectedFeatures.size > 0;

      document.getElementById('previewBtn').disabled = !(source && target && hasFeatures);
      document.getElementById('mergeBtn').disabled = !(source && target && hasFeatures);
    }

    document.getElementById('targetDashboard').addEventListener('change', updateButtons);

    // Preview merge
    document.getElementById('previewBtn').addEventListener('click', async () => {
      await performMerge(true);
    });

    // Execute merge
    document.getElementById('mergeBtn').addEventListener('click', async () => {
      if (!confirm(`⚠️ This will MODIFY ${document.getElementById('targetDashboard').value}. Continue?`)) {
        return;
      }
      await performMerge(false);
    });

    async function performMerge(previewOnly) {
      const source = document.getElementById('sourceDashboard').value;
      const target = document.getElementById('targetDashboard').value;
      const strategy = document.getElementById('injectionStrategy').value;
      const featureIds = Array.from(selectedFeatures);

      document.getElementById('results').innerHTML = '<div class="loading">⚡ Processing merge...</div>';

      try {
        const response = await fetch('/.netlify/functions/dashboard-merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source_dashboard: source,
            target_dashboard: target,
            feature_ids: featureIds,
            strategy: strategy,
            preview_only: previewOnly
          })
        });

        const data = await response.json();

        if (!response.ok) {
          if (data.missing_dependencies) {
            showWarning('Missing Dependencies', data.missing_dependencies);
          } else {
            throw new Error(data.error || 'Merge failed');
          }
          return;
        }

        if (previewOnly) {
          displayPreview(data);
        } else {
          displaySuccess(data);
        }

      } catch (error) {
        console.error('Merge error:', error);
        showError(`Merge failed: ${error.message}`);
      }
    }

    function displayPreview(data) {
      document.getElementById('previewPanel').classList.add('visible');

      // Update stats
      document.getElementById('statFeaturesMerged').textContent = data.features_merged;
      document.getElementById('statStrategy').textContent = data.injection_log[0]?.strategy_used || 'N/A';
      document.getElementById('statSize').textContent = `+${(data.merged_html.length / 1024).toFixed(1)}KB`;

      // Display injection log
      const logHTML = data.injection_log.map(log => `
        <div class="log-entry ${log.success ? '' : 'error'}">
          <strong>${log.feature_name}</strong><br>
          Strategy: ${log.strategy_used}<br>
          Injected at: ${log.injection_point}
        </div>
      `).join('');
      document.getElementById('injectionLog').innerHTML = logHTML;

      // Load preview in iframe
      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(data.merged_html);
      iframeDoc.close();

      document.getElementById('results').innerHTML = '<div class="success">✅ Preview generated. Review changes above, then click MERGE to save.</div>';
    }

    function displaySuccess(data) {
      document.getElementById('results').innerHTML = `
        <div class="success">
          ✅ Successfully merged ${data.features_merged} feature(s) into ${data.target_dashboard}
          <br><br>
          ${data.injection_log.map(log => `• ${log.feature_name} → ${log.injection_point}`).join('<br>')}
        </div>
      `;

      // Clear selections
      selectedFeatures.clear();
      document.getElementById('sourceDashboard').value = '';
      document.getElementById('targetDashboard').value = '';
      document.getElementById('sourceFeatures').innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">Select a source dashboard to see features</div>';
      document.getElementById('previewPanel').classList.remove('visible');
      updateButtons();
    }

    function showError(message) {
      document.getElementById('results').innerHTML = `<div class="error">❌ ${message}</div>`;
    }

    function showWarning(title, dependencies) {
      const depList = dependencies.map(dep => `
        • ${dep.dependency} (required by ${dep.required_by})
      `).join('<br>');

      document.getElementById('results').innerHTML = `
        <div class="warning">
          ⚠️ <strong>${title}</strong><br><br>
          ${depList}<br><br>
          Install these features first or include them in the merge.
        </div>
      `;
    }

    // Initialize
    loadDashboards();
  </script>
</body>
</html>
