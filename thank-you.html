<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        .checkmark {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        h1 {
            color: #2ecc71;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        p {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #f39c12;
            color: #000;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 5px;
        }
        .btn:hover { opacity: 0.9; }
        .btn.secondary {
            background: transparent;
            border: 2px solid #f39c12;
            color: #f39c12;
        }
    </style>
  <script src="/js/mobile-responsive.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="checkmark">&#10003;</div>
        <h1>You are In!</h1>
        <p>Welcome to the Build Guild. You will be the first to know when new tools drop.</p>
        <a href="/BUILD_GUILD.html" class="btn">Back to Build Guild</a>
        <a href="/araya-chat.html" class="btn secondary">Talk to ARAYA</a>

</html>
