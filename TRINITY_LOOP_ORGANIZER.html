<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trinity Loop Organizer — Path to Divinity</title>
  <style>
    :root {
      --bg: #060d18;
      --surface: #0c1a2e;
      --card: #0f2240;
      --border: rgba(96, 165, 250, 0.12);
      --accent: #60a5fa;
      --gold: #fbbf24;
      --good: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --muted: #8ba3c0;
      --text: #e2eaf5;
      --divine: #a78bfa;
      --transcendent: #818cf8;
      --enlightened: #34d399;
      --awakened: #60a5fa;
      --conscious: #fb923c;
      --aware: #f87171;
      --seeker: #9ca3af;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, #0a1628 0%, #0f2040 50%, #0a1628 100%);
      border-bottom: 2px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .tagline { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .btn {
      background: var(--accent);
      color: #04111e;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
    .btn.gold { background: var(--gold); color: #111; }

    main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }

    /* Summary cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    .summary-card .num {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }
    .summary-card .label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    /* Overall progress */
    .progress-bar-wrap { margin-bottom: 2rem; }
    .progress-bar-wrap h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: var(--gold); }
    .progress-bar {
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      transition: width 1s ease;
    }
    .progress-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; text-align: right; }

    /* Controls */
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .controls input[type="search"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      min-width: 220px;
    }
    .controls select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .controls label { font-size: 0.85rem; color: var(--muted); }

    /* Domain sections */
    .domain-section { margin-bottom: 2.5rem; }
    .domain-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-left: 4px solid var(--accent);
    }
    .domain-header.COMMAND { border-left-color: #60a5fa; }
    .domain-header.BUILD   { border-left-color: #34d399; }
    .domain-header.CONNECT { border-left-color: #a78bfa; }
    .domain-header.PROTECT { border-left-color: #f87171; }
    .domain-header.GROW    { border-left-color: #fbbf24; }
    .domain-header.LEARN   { border-left-color: #fb923c; }
    .domain-header.TRANSCEND { border-left-color: #c084fc; }
    .domain-icon { font-size: 1.5rem; }
    .domain-name { font-size: 1.2rem; font-weight: 700; }
    .domain-desc { font-size: 0.8rem; color: var(--muted); }
    .domain-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .domain-progress {
      flex: 0 0 120px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .domain-progress .mini-bar {
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    .domain-progress .mini-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--divine));
    }
    .domain-progress .mini-label { font-size: 0.7rem; color: var(--muted); text-align: right; }

    /* Project grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.75rem;
    }
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .project-card:hover {
      border-color: rgba(96, 165, 250, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .project-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .project-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .divinity-badge {
      flex-shrink: 0;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .divinity-badge.DIVINE       { background: rgba(167,139,250,0.2); color: #a78bfa; }
    .divinity-badge.TRANSCENDENT { background: rgba(129,140,248,0.2); color: #818cf8; }
    .divinity-badge.ENLIGHTENED  { background: rgba(52,211,153,0.2); color: #34d399; }
    .divinity-badge.AWAKENED     { background: rgba(96,165,250,0.2); color: #60a5fa; }
    .divinity-badge.CONSCIOUS    { background: rgba(251,146,60,0.2); color: #fb923c; }
    .divinity-badge.AWARE        { background: rgba(248,113,113,0.2); color: #f87171; }
    .divinity-badge.SEEKER       { background: rgba(156,163,175,0.15); color: #9ca3af; }

    .project-score-bar {
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
      height: 5px;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }
    .project-score-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s;
    }
    .project-meta { font-size: 0.75rem; color: var(--muted); }
    .project-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.65rem;
    }
    .project-actions a {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--accent);
      text-decoration: none;
      transition: all 0.2s;
    }
    .project-actions a:hover { background: rgba(96,165,250,0.1); }

    /* Tier legend */
    .tier-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tier-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tier-pill:hover { opacity: 0.75; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
      z-index: 999;
      max-width: 320px;
    }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <div>
    <h1>✦ Trinity Loop Organizer</h1>
    <div class="tagline">Organize all projects by functionality & true value — run the trinity loop until all reach DIVINE</div>
  </div>
  <div class="header-right">
    <a href="trinityLoop.html" class="btn">⟳ Trinity Pool</a>
    <a href="trinityLooper.html" class="btn ghost">◎ 3D Loop</a>
    <a href="organized-projects-hub.html" class="btn ghost">⊞ Hub</a>
    <a href="index.html" class="btn ghost">← Back</a>
  </div>
</header>

<main>
  <div id="loading" style="text-align:center;padding:4rem;color:var(--muted)">
    Loading projects catalog…
  </div>

  <div id="app" style="display:none">
    <!-- Summary cards -->
    <div class="summary-grid" id="summaryGrid"></div>

    <!-- Overall progress to divinity -->
    <div class="progress-bar-wrap">
      <h2>⚡ Overall Progress to DIVINE</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="overallProgress" style="width:0%"></div>
      </div>
      <div class="progress-label" id="overallLabel"></div>
    </div>

    <!-- Tier legend -->
    <div class="tier-legend" id="tierLegend"></div>

    <!-- Controls -->
    <div class="controls">
      <input type="search" id="searchInput" placeholder="🔍 Search projects…" />
      <select id="filterDomain">
        <option value="">All Domains</option>
        <option value="COMMAND">COMMAND</option>
        <option value="BUILD">BUILD</option>
        <option value="CONNECT">CONNECT</option>
        <option value="PROTECT">PROTECT</option>
        <option value="GROW">GROW</option>
        <option value="LEARN">LEARN</option>
        <option value="TRANSCEND">TRANSCEND</option>
      </select>
      <select id="filterTier">
        <option value="">All Tiers</option>
        <option value="DIVINE">DIVINE (100)</option>
        <option value="TRANSCENDENT">TRANSCENDENT (90-99)</option>
        <option value="ENLIGHTENED">ENLIGHTENED (80-89)</option>
        <option value="AWAKENED">AWAKENED (70-79)</option>
        <option value="CONSCIOUS">CONSCIOUS (60-69)</option>
        <option value="AWARE">AWARE (40-59)</option>
        <option value="SEEKER">SEEKER (0-39)</option>
      </select>
      <select id="filterStatus">
        <option value="">All Trinity Status</option>
        <option value="complete">Complete ✓</option>
        <option value="needs_polish">Needs Polish</option>
        <option value="in_progress">In Progress</option>
        <option value="needs_work">Needs Work</option>
      </select>
      <select id="sortBy">
        <option value="domain">Sort: Domain</option>
        <option value="score_desc">Sort: Score ↓</option>
        <option value="score_asc">Sort: Score ↑</option>
        <option value="title">Sort: Name</option>
      </select>
      <label>
        <input type="checkbox" id="showDivineOnly"> DIVINE only
      </label>
      <button class="btn ghost" onclick="runTrinityLoop()">⟳ Run Trinity Loop</button>
    </div>

    <!-- Domain sections -->
    <div id="domainSections"></div>
  </div>
</main>

<div id="toast"></div>

<script>
const DOMAIN_META = {
  COMMAND:   { icon: "⚡", color: "#60a5fa", desc: "Control, dashboards, management, cockpits, orchestration" },
  BUILD:     { icon: "🔧", color: "#34d399", desc: "Creation, development, 3D, hardware, blockchain, tools" },
  CONNECT:   { icon: "🌐", color: "#a78bfa", desc: "Social, messaging, communication, networking, outreach" },
  PROTECT:   { icon: "🛡️", color: "#f87171", desc: "Security, safety, detection, legal, patterns, boundaries" },
  GROW:      { icon: "📈", color: "#fbbf24", desc: "Finance, trading, grants, investment, economy, rewards" },
  LEARN:     { icon: "🧠", color: "#fb923c", desc: "Education, AI/ML, courses, analytics, research, intelligence" },
  TRANSCEND: { icon: "✦", color: "#c084fc", desc: "Consciousness, art, healing, spiritual, trinity, vision" },
};

const TIER_META = {
  DIVINE:       { color: "#a78bfa", label: "DIVINE (100)" },
  TRANSCENDENT: { color: "#818cf8", label: "TRANSCENDENT (90-99)" },
  ENLIGHTENED:  { color: "#34d399", label: "ENLIGHTENED (80-89)" },
  AWAKENED:     { color: "#60a5fa", label: "AWAKENED (70-79)" },
  CONSCIOUS:    { color: "#fb923c", label: "CONSCIOUS (60-69)" },
  AWARE:        { color: "#f87171", label: "AWARE (40-59)" },
  SEEKER:       { color: "#9ca3af", label: "SEEKER (0-39)" },
};

const DOMAIN_ORDER = ["COMMAND", "BUILD", "CONNECT", "PROTECT", "GROW", "LEARN", "TRANSCEND"];

let allProjects = [];
let filteredProjects = [];

async function loadProjects() {
  try {
    const res = await fetch("projects.json?" + Date.now());
    const data = await res.json();
    allProjects = data.projects || [];
    renderAll(data.meta);
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
  } catch (e) {
    document.getElementById("loading").textContent = "Error loading projects.json: " + e.message;
  }
}

function renderAll(meta) {
  renderSummary(meta);
  renderOverallProgress();
  renderTierLegend(meta);
  applyFilters();
}

function renderSummary(meta) {
  const dc = meta.domain_counts || {};
  const tc = meta.trinity_status_counts || {};
  const total = allProjects.length;
  const divine = allProjects.filter(p => p.divinity_score >= 100).length;
  const avgScore = Math.round(allProjects.reduce((s, p) => s + (p.divinity_score || 0), 0) / (total || 1));

  const grid = document.getElementById("summaryGrid");
  grid.innerHTML = [
    { num: total, label: "Total Projects", color: "#60a5fa" },
    { num: divine, label: "DIVINE ✦", color: "#a78bfa" },
    { num: avgScore, label: "Avg Divinity Score", color: "#34d399" },
    { num: tc.complete || 0, label: "Loop Complete", color: "#34d399" },
    { num: tc.needs_polish || 0, label: "Needs Polish", color: "#fbbf24" },
    { num: tc.in_progress || 0, label: "In Progress", color: "#fb923c" },
    { num: tc.needs_work || 0, label: "Needs Work", color: "#f87171" },
    { num: Object.keys(dc).filter(d => dc[d] > 0).length, label: "Domains Active", color: "#c084fc" },
  ].map(({ num, label, color }) => `
    <div class="summary-card">
      <div class="num" style="color:${color}">${num}</div>
      <div class="label">${label}</div>
    </div>
  `).join("");
}

function renderOverallProgress() {
  const total = allProjects.length;
  if (!total) return;
  const avgScore = allProjects.reduce((s, p) => s + (p.divinity_score || 0), 0) / total;
  const pct = Math.round(avgScore);
  document.getElementById("overallProgress").style.width = pct + "%";
  document.getElementById("overallLabel").textContent =
    `Average divinity score: ${pct}/100 — ${total - allProjects.filter(p => p.divinity_score >= 100).length} projects remaining until all reach DIVINE`;
}

function renderTierLegend(meta) {
  const tc = meta.divinity_tier_counts || {};
  const legend = document.getElementById("tierLegend");
  legend.innerHTML = Object.entries(TIER_META).map(([tier, { color, label }]) => `
    <span class="tier-pill" style="background:${color}22;color:${color}"
      onclick="filterByTier('${tier}')">
      ${label}: ${tc[tier] || 0}
    </span>
  `).join("");
}

function filterByTier(tier) {
  document.getElementById("filterTier").value = tier;
  applyFilters();
}

function getScoreColor(score) {
  if (score >= 100) return "#a78bfa";
  if (score >= 90)  return "#818cf8";
  if (score >= 80)  return "#34d399";
  if (score >= 70)  return "#60a5fa";
  if (score >= 60)  return "#fb923c";
  if (score >= 40)  return "#f87171";
  return "#9ca3af";
}

function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const domain = document.getElementById("filterDomain").value;
  const tier = document.getElementById("filterTier").value;
  const status = document.getElementById("filterStatus").value;
  const divineOnly = document.getElementById("showDivineOnly").checked;
  const sortBy = document.getElementById("sortBy").value;

  filteredProjects = allProjects.filter(p => {
    if (divineOnly && p.divinity_score < 100) return false;
    if (domain && p.domain !== domain) return false;
    if (tier && p.divinity_tier !== tier) return false;
    if (status && p.trinity_status !== status) return false;
    if (search) {
      const haystack = (p.title + " " + p.description + " " + (p.filename || "")).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  if (sortBy === "score_desc") {
    filteredProjects.sort((a, b) => (b.divinity_score || 0) - (a.divinity_score || 0));
  } else if (sortBy === "score_asc") {
    filteredProjects.sort((a, b) => (a.divinity_score || 0) - (b.divinity_score || 0));
  } else if (sortBy === "title") {
    filteredProjects.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  } else {
    // domain order
    filteredProjects.sort((a, b) => {
      const di = DOMAIN_ORDER.indexOf(a.domain) - DOMAIN_ORDER.indexOf(b.domain);
      if (di !== 0) return di;
      return (b.divinity_score || 0) - (a.divinity_score || 0);
    });
  }

  renderDomainSections();
}

function renderDomainSections() {
  const container = document.getElementById("domainSections");
  const sortBy = document.getElementById("sortBy").value;
  const filterDomain = document.getElementById("filterDomain").value;

  if (sortBy !== "domain" || filterDomain) {
    // Flat list
    container.innerHTML = `
      <div class="domain-section">
        <div class="domain-header" style="border-left-color:var(--accent)">
          <span>Results</span>
          <span class="domain-badge">${filteredProjects.length} projects</span>
        </div>
        <div class="projects-grid">${filteredProjects.map(projectCard).join("")}</div>
      </div>
    `;
    return;
  }

  // Group by domain
  const byDomain = {};
  DOMAIN_ORDER.forEach(d => { byDomain[d] = []; });
  filteredProjects.forEach(p => {
    const d = p.domain || "BUILD";
    if (!byDomain[d]) byDomain[d] = [];
    byDomain[d].push(p);
  });

  container.innerHTML = DOMAIN_ORDER.map(domain => {
    const projects = byDomain[domain] || [];
    if (!projects.length) return "";

    const meta = DOMAIN_META[domain] || { icon: "•", color: "#60a5fa", desc: "" };
    const avgScore = projects.length
      ? Math.round(projects.reduce((s, p) => s + (p.divinity_score || 0), 0) / projects.length)
      : 0;
    const divineCount = projects.filter(p => p.divinity_score >= 100).length;

    return `
      <div class="domain-section" id="domain-${domain}">
        <div class="domain-header ${domain}" style="border-left-color:${meta.color}">
          <span class="domain-icon">${meta.icon}</span>
          <div>
            <div class="domain-name" style="color:${meta.color}">${domain}</div>
            <div class="domain-desc">${meta.desc}</div>
          </div>
          <div class="domain-progress">
            <div class="mini-bar">
              <div class="mini-fill" style="width:${avgScore}%;background:${meta.color}"></div>
            </div>
            <div class="mini-label">${avgScore}% avg · ${divineCount}/${projects.length} DIVINE</div>
          </div>
          <span class="domain-badge">${projects.length} projects</span>
        </div>
        <div class="projects-grid">${projects.map(projectCard).join("")}</div>
      </div>
    `;
  }).join("");
}

function projectCard(p) {
  const score = p.divinity_score || 0;
  const tier = p.divinity_tier || "AWARE";
  const color = getScoreColor(score);
  const path = p.path || p.filename || "#";
  const title = p.title || p.filename || "Untitled";
  const status = p.trinity_status || "unknown";

  const statusLabel = {
    complete: "✓ Complete",
    needs_polish: "✨ Polish",
    in_progress: "⟳ Progress",
    needs_work: "⚠ Needs Work",
  }[status] || status;

  return `
    <div class="project-card" onclick="openProject('${path}')">
      <div class="project-card-header">
        <div class="project-title">${escHtml(title)}</div>
        <span class="divinity-badge ${tier}">${tier.slice(0,3)}</span>
      </div>
      <div class="project-score-bar">
        <div class="project-score-fill" style="width:${score}%;background:${color}"></div>
      </div>
      <div class="project-meta">
        <span style="color:${color};font-weight:700">${score}/100</span>
        &nbsp;·&nbsp;${escHtml(statusLabel)}
        &nbsp;·&nbsp;${escHtml(p.filename || "")}
      </div>
      <div class="project-actions">
        <a href="${escHtml(path)}" target="_blank" onclick="event.stopPropagation()">Open</a>
        <a href="trinityLoop.html" target="_blank" onclick="event.stopPropagation()">Trinity</a>
        ${p.value ? `<span style="color:var(--gold);font-size:0.72rem;padding:3px 6px">\$${Number(p.value).toLocaleString()}</span>` : ""}
      </div>
    </div>
  `;
}

function openProject(path) {
  if (path && path !== "#") {
    window.open(path, "_blank");
  }
}

function escHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function runTrinityLoop() {
  const needs = filteredProjects.filter(p => (p.divinity_score || 0) < 100);
  if (!needs.length) {
    showToast("✦ All displayed projects have reached DIVINE status!");
    return;
  }
  showToast(`⟳ Opening Trinity Loop for ${needs.length} project(s) needing improvement…`);
  setTimeout(() => window.open("trinityLooper.html", "_blank"), 300);
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 4000);
}

// Wire up controls
["searchInput", "filterDomain", "filterTier", "filterStatus", "sortBy", "showDivineOnly"].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener("change", applyFilters);
});
document.getElementById("searchInput").addEventListener("input", applyFilters);

// Boot
loadProjects();
</script>
</body>
</html>
