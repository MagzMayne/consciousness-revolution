    <style>
        /* ============================================================

        ============================================================ */
        :root {
            /* Domain Colors - 7 Forges */

        .domain-actions {

        .btn {

        .btn-start {

        .btn-start:hover {

        .btn-done {

        /* ============================================================

    <!-- ============================================================
         ARAYA EDITOR INTEGRATION
         Enables ARAYA to edit this dashboard within permissions
    ============================================================ -->
    <script id="araya-editor-integration">
    (function() {
        // ARAYA Dashboard Editor v1.0
        window.ARAYA_EDITOR = {
            version: '1.0.0',
            dashboardId: 'lifeforge-domain-reminder',

            // Permission checker
            canEdit: function(element) {
                // Check if element or any parent has framework="true"
                if (element.closest('[data-framework="true"]')) {
                    return {
                        allowed: false,
                        reason: 'Framework element - requires Commander approval',
                        action: 'queue_for_approval'
                    };
                }
                // Check if element has editable="true"
                if (element.closest('[data-editable="true"]') || element.hasAttribute('data-editable')) {
                    return { allowed: true };
                }
                // Default: check parent
                return { allowed: true, warning: 'No explicit permission set' };
            },

            // Queue change for Commander approval
            queueForApproval: function(change) {
                const queue = JSON.parse(localStorage.getItem('araya_approval_queue') || '[]');
                queue.push({
                    id: Date.now(),
                    timestamp: new Date().toISOString(),
                    dashboard: this.dashboardId,
                    change: change,
                    status: 'pending'
                });
                localStorage.setItem('araya_approval_queue', JSON.stringify(queue));
                console.log('Change queued for Commander approval:', change);
                return queue.length;
            },

            // Edit content (with permission check)
            editContent: function(selector, newContent) {
                const element = document.querySelector(selector);
                if (!element) return { success: false, error: 'Element not found' };

                const permission = this.canEdit(element);
                if (!permission.allowed) {
                    this.queueForApproval({
                        type: 'content',
                        selector: selector,
                        oldValue: element.textContent,
                        newValue: newContent,
                        reason: permission.reason
                    });
                    return { success: false, queued: true, reason: permission.reason };
                }

                element.textContent = newContent;
                return { success: true };
            },

            // Edit priority for a domain
            editPriority: function(domainId, newPriority) {
                const priorities = JSON.parse(localStorage.getItem('lifeforge_custom_priorities') || '{}');
                priorities[domainId] = newPriority;
                localStorage.setItem('lifeforge_custom_priorities', JSON.stringify(priorities));
                renderDomains(); // Re-render with new priority
                return { success: true, domainId: domainId };
            },

            // Navigate to another page
            navigate: function(url) {
                window.location.href = url;
            },

            // Get current state
            getState: function() {
                return {
                    dashboard: this.dashboardId,
                    editableSections: document.querySelectorAll('[data-editable="true"]').length,
                    frameworkSections: document.querySelectorAll('[data-framework="true"]').length,
                    approvalQueue: JSON.parse(localStorage.getItem('araya_approval_queue') || '[]').length
                };
            }
        };

        // Expose to ARAYA
        window.postMessage({ type: 'ARAYA_EDITOR_READY', editor: window.ARAYA_EDITOR.getState() }, '*');
        console.log('ARAYA Dashboard Editor loaded:', window.ARAYA_EDITOR.getState());
    })();
    </script>

    <!-- ============================================================
         BASE FUNCTIONS - Protected Layer (Tier 2)
    ============================================================ -->
    <script>
        // ============================================================
        // DOMAIN DATA - The 7 Forges (Immutable Structure)
        // ============================================================
        const DOMAINS = [
            {
                id: 1,
                name: "COMMAND",
                forge: "Reality Forge",
                icon: "&#x1F3AF;", // Target
                verb: "DIRECT",
                color: "#ff4444"
            },
            {
                id: 2,
                name: "BUILD",
                forge: "Creation Forge",
                icon: "&#x1F528;", // Hammer
                verb: "CREATE",
                color: "#ff8800"
            },
            {
                id: 3,
                name: "CONNECT",
                forge: "Comms Forge",
                icon: "&#x1F517;", // Link
                verb: "RELATE",
                color: "#ffcc00"
            },
            {
                id: 4,
                name: "PROTECT",
                forge: "Guardian Forge",
                icon: "&#x1F6E1;", // Shield
                verb: "DEFEND",
                color: "#00cc66"
            },
            {
                id: 5,
                name: "GROW",
                forge: "Wealth Forge",
                icon: "&#x1F4C8;", // Chart
                verb: "EXPAND",
                color: "#0099ff"
            },
            {
                id: 6,
                name: "LEARN",
                forge: "Character Forge",
                icon: "&#x1F4DA;", // Books
                verb: "EVOLVE",
                color: "#9966ff"
            },
            {
                id: 7,
                name: "TRANSCEND",
                forge: "Infinity Forge",
                icon: "&#x267E;", // Infinity
                verb: "INTEGRATE",
                color: "#ff66cc"
            }
        ];

        // ============================================================
        // PRIORITY ENGINE - Fetches #1 priority per domain from API
        // ============================================================
        const API_URL = '/api/lifeforge-priorities';
        let cachedPriorities = null;
        let cacheTimestamp = 0;
        const CACHE_TTL = 60000; // 1 minute cache

        async function fetchAllPriorities() {
            const now = Date.now();
            if (cachedPriorities && (now - cacheTimestamp) < CACHE_TTL) {
                return cachedPriorities;
            }

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API unavailable');
                const data = await response.json();
                if (data.success && data.priorities) {
                    cachedPriorities = data.priorities;
                    cacheTimestamp = now;
                    updateConnectionStatus(true, data.meta?.source || 'api');
                    return data.priorities;
                }
            } catch (error) {
                console.log('API fetch failed, using fallbacks:', error.message);
                updateConnectionStatus(false, 'offline');
            }
            return null;
        }

        async function getDomainPriority(domainId) {
            // Try API first
            const apiPriorities = await fetchAllPriorities();
            if (apiPriorities && apiPriorities[domainId]) {
                return apiPriorities[domainId];
            }

            // Fallback to local defaults
            const fallbackPriorities = {
                1: { action: "Set today's mission and direction", impact: "high", time: "15m" },
                2: { action: "Complete the next build task", impact: "high", time: "2h" },
                3: { action: "Reach out to one person who matters", impact: "medium", time: "20m" },
                4: { action: "Review security and backups", impact: "medium", time: "15m" },
                5: { action: "Check financial dashboard", impact: "low", time: "10m" },
                6: { action: "Learn something new today", impact: "medium", time: "30m" },
                7: { action: "Reflect on patterns across domains", impact: "high", time: "15m" }
            };

            return fallbackPriorities[domainId];
        }

        function updateConnectionStatus(connected, source) {
            const badge = document.querySelector('.pattern-badge');
            if (badge) {
                if (connected) {
                    badge.innerHTML = `Connected: ${source} | Pattern Theory: 91.0%`;
                    badge.style.borderColor = 'var(--success)';
                } else {
                    badge.innerHTML = `Offline Mode | Pattern Theory: 91.0%`;
                    badge.style.borderColor = 'var(--warning)';
                }
            }
        }

        // ============================================================
        // STATE MANAGEMENT - User Preferences (Tier 1 - localStorage)
        // ============================================================
        const STATE_KEY = 'lifeforge_state';

        function loadState() {
            try {
                const saved = localStorage.getItem(STATE_KEY);
                return saved ? JSON.parse(saved) : {
                    completed: {},
                    streak: 0,
                    lastDate: null,
                    totalCompleted: 0
                };
            } catch (e) {
                console.error('Failed to load state:', e);
                return { completed: {}, streak: 0, lastDate: null, totalCompleted: 0 };
            }
        }

        function saveState(state) {
            try {
                localStorage.setItem(STATE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Failed to save state:', e);
            }
        }

        // ============================================================
        // RENDER ENGINE - Builds the UI
        // ============================================================
        async function renderDomains() {
            const grid = document.getElementById('domainGrid');
            const state = loadState();
            const today = new Date().toDateString();

            // Reset daily completions if new day
            if (state.lastDate !== today) {
                state.completed = {};
                state.lastDate = today;

                // Update streak
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (state.lastDate === yesterday.toDateString()) {
                    state.streak++;
                } else {
                    state.streak = 1;
                }
                saveState(state);
            }

            let html = '';

            for (const domain of DOMAINS) {
                const priority = await getDomainPriority(domain.id);
                const isCompleted = state.completed[domain.id];

                html += `
                    <div class="domain-card ${isCompleted ? 'completed' : ''}" data-domain="${domain.id}">
                        <div class="domain-header">
                            <div class="domain-icon">${domain.icon}</div>
                            <div class="domain-info">
                                <div class="domain-name">${domain.name}</div>
                                <div class="domain-forge">${domain.forge}</div>
                            </div>
                        </div>
                        <div class="domain-priority">${priority.action}</div>
                        <div class="domain-meta">
                            <span class="meta-tag ${priority.impact}">${priority.impact.toUpperCase()}</span>
                            <span class="meta-tag">${priority.time}</span>
                        </div>
                        <div class="domain-actions">
                            <button class="btn btn-start" onclick="startDomain(${domain.id})">
                                ${domain.verb}
                            </button>
                            <button class="btn btn-done ${isCompleted ? 'checked' : ''}" onclick="toggleComplete(${domain.id})">
                                ${isCompleted ? '&#x2714;' : '&#x2610;'}
                            </button>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
            updateStats();
        }

        // ============================================================
        // ACTION HANDLERS
        // ============================================================
        function startDomain(domainId) {
            const domain = DOMAINS.find(d => d.id === domainId);
            console.log(`Starting ${domain.name} domain action...`);

            // TODO: Connect to action system
            // For now, just show an alert
            alert(`${domain.verb}: Opening ${domain.forge}...`);
        }

        function toggleComplete(domainId) {
            const state = loadState();
            state.completed[domainId] = !state.completed[domainId];

            if (state.completed[domainId]) {
                state.totalCompleted++;
            } else {
                state.totalCompleted = Math.max(0, state.totalCompleted - 1);
            }

            saveState(state);
            renderDomains();
        }

        function updateStats() {
            const state = loadState();
            const completedCount = Object.values(state.completed).filter(Boolean).length;

            // Update completion bar
            const percentage = (completedCount / 7) * 100;
            document.getElementById('completionFill').style.width = `${percentage}%`;
            document.getElementById('completedCount').textContent = completedCount;

            // Update stats
            document.getElementById('streakCount').textContent = state.streak || 0;
            document.getElementById('totalCount').textContent = state.totalCompleted || 0;

            // Weekly count (mock for now)
            const weeklyCount = Math.min(completedCount * 3 + state.streak, 49);
            document.getElementById('weeklyCount').textContent = weeklyCount;
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderDomains();
        });
    </script>
