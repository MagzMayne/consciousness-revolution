    <script>
        // ==================== GLOBAL STATE ====================
        let port = null;
        let isConnected = false;
        let motorSpeed = 1;
        let motorMode = 'continuous';
        let motorStepSize = 1;
        let cameraActive = false;
        let recordingActive = false;

        // Local ML Model State
        const mlModel = {
            isActive: false,
            sessionData: [],
            predictions: [],
            confidence: 0,
            frameCount: 0,
            learningData: []
        };

        // ==================== WEB SERIAL API ====================
        class GemBotSerial {
            constructor() {
                this.port = null;
                this.reader = null;
                this.isConnected = false;
                this.availablePorts = [];
                this.buffer = '';
                this.dataStats = {
                    bytesReceived: 0,
                    linesProcessed: 0,
                    errorsFound: 0
                };
            }

            async scanPorts() {
                try {
                    if (!('serial' in navigator)) {
                        addDebugLog('❌ Web Serial API not supported', 'error');
                        return;
                    }

                    addDebugLog('🔍 Scanning for devices...', 'system');
                    const ports = await navigator.serial.getPorts();
                    this.availablePorts = ports;

                    const portSelect = document.getElementById('portSelect');
                    portSelect.innerHTML = '<option value="">Select Port...</option>';

                    if (ports.length === 0) {
                        addDebugLog('⚠️ No devices found', 'warning');
                    } else {
                        addDebugLog(`✅ Found ${ports.length} device(s)`, 'system');
                        ports.forEach((port, idx) => {
                            const info = port.getInfo?.() || {};
                            const vendorId = info.usbVendorId ? '0x' + info.usbVendorId.toString(16).padStart(4, '0') : 'Unknown';
                            const option = document.createElement('option');
                            option.value = idx;
                            option.textContent = `Port ${idx + 1} (${vendorId})`;
                            portSelect.appendChild(option);
                        });
                    }
                } catch (error) {
                    addDebugLog(`❌ Scan failed: ${error.message}`, 'error');
                }
            }

            async connect() {
                try {
                    const portSelect = document.getElementById('portSelect');
                    const idx = portSelect.value;

                    if (idx === '') {
                        addDebugLog('⚠️ Please select a port', 'warning');
                        return;
                    }

                    this.port = this.availablePorts[idx];
                    await this.port.open({ baudRate: 9600 });
                    
                    this.isConnected = true;
                    addDebugLog('✅ Connected!', 'success');
                    updateConnectionStatus(true);
                    
                    document.getElementById('connectBtn').classList.add('hidden');
                    document.getElementById('disconnectBtn').classList.remove('hidden');
                    document.getElementById('portSelect').disabled = true;
                    document.getElementById('scanBtn').disabled = true;

                    this.startReading();
                } catch (error) {
                    addDebugLog(`❌ Connection failed: ${error.message}`, 'error');
                }
            }

            async disconnect() {
                try {
                    if (this.port) {
                        await this.port.close();
                        this.isConnected = false;
                        addDebugLog('✅ Disconnected', 'system');
                        updateConnectionStatus(false);

                        document.getElementById('connectBtn').classList.remove('hidden');
                        document.getElementById('disconnectBtn').classList.add('hidden');
                        document.getElementById('portSelect').disabled = false;
                        document.getElementById('scanBtn').disabled = false;
                    }
                } catch (error) {
                    addDebugLog(`❌ Disconnect error: ${error.message}`, 'error');
                }
            }

            async startReading() {
                try {
                    while (this.isConnected && this.port?.readable) {
                        this.reader = this.port.readable.getReader();
                        try {
                            while (true) {
                                const { value, done } = await this.reader.read();
                                if (done) break;
                                
                                const text = new TextDecoder().decode(value);
                                this.buffer += text;
                                this.dataStats.bytesReceived += text.length;
                                this.processBuffer();
                            }
                        } finally {
                            this.reader.releaseLock();
                        }
                    }
                } catch (error) {
                    addDebugLog(`❌ Reading error: ${error.message}`, 'error');
                }
            }

            processBuffer() {
                const lines = this.buffer.split('\n');
                this.buffer = lines[lines.length - 1];
                
                let menuItems = [];
                let isMenuMode = false;
                
                for (let i = 0; i < lines.length - 1; i++) {
                    const line = lines[i].trim();
                    if (!line || line.length <= 2) continue;
                    
                    // Detect menu start
                    if (line.includes('menu:')) {
                        isMenuMode = true;
                        addDebugLog('📋 MAIN MENU', 'info');
                        continue;
                    }
                    
                    // Detect menu end
                    if (line.includes('------') || line.includes('Motor Shield') || (isMenuMode && !line.includes('<') && !line.includes(',') && line.includes('Settings'))) {
                        if (menuItems.length > 0) {
                            this.displayMenu(menuItems);
                            menuItems = [];
                        }
                        isMenuMode = false;
                        continue;
                    }
                    
                    // Parse menu items (format: "< Label , ID" or "Label, ID")
                    const menuMatch = line.match(/^<?(.+?)\s*,\s*(\d+)$/);
                    if (menuMatch && isMenuMode) {
                        const label = menuMatch[1].trim();
                        const id = menuMatch[2];
                        menuItems.push({ label, id, isSubmenu: line.includes('<') });
                        continue;
                    }
                    
                    // Parse position data
                    if (line.includes('pX:') || line.includes('pY:') || line.includes('pA:') || line.includes('pI:')) {
                        this.parsePositionData(line);
                    } else if (!isMenuMode && line.length > 2) {
                        addDebugLog(`📥 ${line}`, 'info');
                    }
                    
                    this.dataStats.linesProcessed++;
                }
                
                if (menuItems.length > 0) {
                    this.displayMenu(menuItems);
                }
            }
            
            displayMenu(menuItems) {
                if (menuItems.length === 0) return;
                
                const submenus = menuItems.filter(m => m.isSubmenu);
                const actions = menuItems.filter(m => !m.isSubmenu);
                
                // Log to AI Chat
                if (submenus.length > 0) {
                    addDebugLog('═══ SUBMENUS ═══', 'system');
                    submenus.forEach(item => {
                        addDebugLog(`  ➤ ${item.label}`, 'system');
                    });
                }
                
                if (actions.length > 0) {
                    addDebugLog('═══ ACTIONS ═══', 'system');
                    actions.forEach(item => {
                        addDebugLog(`  ○ ${item.label}`, 'system');
                    });
                }
                
                // Display in menu control panel
                const menuDisplay = document.getElementById('menuDisplay');
                const menuContent = document.getElementById('menuContent');
                if (menuDisplay && menuContent) {
                    menuContent.innerHTML = '';
                    
                    // Add submenus
                    submenus.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'menu-item submenu';
                        div.textContent = `➤ ${item.label}`;
                        div.title = `ID: ${item.id}`;
                        div.onclick = () => {
                            if (serial.isConnected) {
                                serial.sendCommand(`m${item.id}`);
                                addDebugLog(`📤 Selected: ${item.label}`, 'system');
                            }
                        };
                        menuContent.appendChild(div);
                    });
                    
                    // Add actions
                    actions.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'menu-item';
                        div.textContent = `○ ${item.label}`;
                        div.title = `ID: ${item.id}`;
                        div.onclick = () => {
                            if (serial.isConnected) {
                                serial.sendCommand(`m${item.id}`);
                                addDebugLog(`📤 Selected: ${item.label}`, 'system');
                            }
                        };
                        menuContent.appendChild(div);
                    });
                    
                    // Show menu display if has items
                    if (menuContent.children.length > 0) {
                        menuDisplay.style.display = 'block';
                    }
                }
            }

            isMenuOutput(line) {
                const menuPatterns = ['Setting', 'Motor', 'Shield', 'found', '---', '>'];
                return line.length <= 2 || menuPatterns.some(p => line.includes(p));
            }

            parsePositionData(line) {
                try {
                    const xMatch = line.match(/pX:(\d+)/);
                    const yMatch = line.match(/pY:(\d+)/);
                    const aMatch = line.match(/pA:(\d+)/);
                    const iMatch = line.match(/pI:(\d+)/);
                    
                    if (xMatch) updateStatusBox('X', parseInt(xMatch[1]));
                    if (yMatch) updateStatusBox('Y', parseInt(yMatch[1]));
                    if (aMatch) updateStatusBox('ANGLE', parseInt(aMatch[1]));
                    if (iMatch) updateStatusBox('INDEX', parseInt(iMatch[1]));
                } catch (error) {
                    this.dataStats.errorsFound++;
                }
            }

            async sendCommand(cmd) {
                try {
                    if (!this.isConnected || !this.port?.writable) return;
                    const writer = this.port.writable.getWriter();
                    await writer.write(new TextEncoder().encode(cmd + '\n'));
                    writer.releaseLock();
                } catch (error) {
                    addDebugLog(`❌ Send error: ${error.message}`, 'error');
                }
            }
        }

        const serial = new GemBotSerial();

        // ==================== AI ASSISTANT ====================
        class GemBotAI {
            constructor() {
                this.conversationHistory = [];
                this.systemPrompt = `You are GemBot AI, an intelligent gemstone cutting assistant. You:
- Provide real-time guidance for optimal cutting angles and positions
- Analyze cutting patterns and suggest improvements
- Help troubleshoot issues with the cutting machine
- Provide entertainment and motivation during long cutting sessions
- Learn from cutting data and improve suggestions over time
- Use emoji and be friendly while staying professional`;
            }

            addMessage(role, content) {
                this.conversationHistory.push({ role, content, timestamp: Date.now() });
                this.displayMessage(role, content);
            }

            displayMessage(role, content) {
                const messagesDiv = document.getElementById('aiMessages');
                const msg = document.createElement('div');
                msg.className = `ai-message ${role}`;
                msg.textContent = content;
                messagesDiv.appendChild(msg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            generateResponse(userMessage) {
                const responses = [
                    `💡 Great observation! ${userMessage}... Let me analyze the cutting parameters.`,
                    `🔍 Interesting query! Based on current positioning: Consider adjusting the angle for optimal facet alignment.`,
                    `✨ Smart thinking! Current gem position is optimal for ${Math.random() > 0.5 ? 'precision' : 'speed'} cutting.`,
                    `🎯 Perfect timing! The ML model detected smooth cutting progress. Keep current settings!`,
                    `⚙️ Analyzing... Recommend slight adjustment to speed for better surface finish.`,
                    `🌟 Excellent execution! Your cutting technique is improving. The AI has learned your style!`,
                    `📈 Performance metrics show ${Math.floor(Math.random() * 20) + 75}% efficiency. Outstanding!`
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }
        }

        const ai = new GemBotAI();

        // ==================== LOCAL ML MODEL ====================
        class LocalMLModel {
            constructor() {
                this.model = null;
                this.isLoading = false;
                this.frameBuffer = [];
                this.maxBufferSize = 30;
            }

            async initialize() {
                try {
                    addDebugLog('🤖 Initializing local ML model...', 'system');
                    // Placeholder for actual ML initialization
                    // In production, load TensorFlow.js or similar
                    this.isLoading = false;
                    addDebugLog('✅ ML Model initialized', 'success');
                } catch (error) {
                    addDebugLog(`❌ ML init failed: ${error.message}`, 'error');
                }
            }

            analyzeFrame(imageData) {
                // Placeholder for ML analysis
                mlModel.frameCount++;
                mlModel.confidence = Math.random() * 100;
                
                if (mlModel.frameCount % 30 === 0) {
                    const suggestion = this.generateSuggestion();
                    if (suggestion) {
                        addDebugLog(suggestion, 'info');
                        ai.addMessage('assistant', suggestion);
                    }
                }
            }

            generateSuggestion() {
                const suggestions = [
                    '📍 Consider rotating 2-3 degrees for better symmetry',
                    '⚡ Speed could increase by 1 level without quality loss',
                    '💎 Surface finish looks optimal - maintain current settings',
                    '🔄 Time to check index positioning for next facet'
                ];
                return Math.random() > 0.7 ? suggestions[Math.floor(Math.random() * suggestions.length)] : null;
            }
        }

        const mlModel2 = new LocalMLModel();

        // ==================== CAMERA & ML PROCESSING ====================
        let stream = null;
        let canvasCtx = null;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                const video = document.getElementById('cameraFeed');
                video.srcObject = stream;
                
                cameraActive = true;
                document.getElementById('cameraStartBtn').style.display = 'none';
                document.getElementById('cameraStopBtn').style.display = 'block';
                
                addDebugLog('📷 Camera started', 'success');
                ai.addMessage('system', '📷 Camera activated - AI monitoring cutting process');
                
                const canvas = document.getElementById('mlCanvas');
                canvasCtx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                processVideoFrames();
            } catch (error) {
                addDebugLog(`❌ Camera error: ${error.message}`, 'error');
            }
        }

        async function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                cameraActive = false;
                document.getElementById('cameraStartBtn').style.display = 'block';
                document.getElementById('cameraStopBtn').style.display = 'none';
                addDebugLog('⏹ Camera stopped', 'system');
                ai.addMessage('system', '⏹ Camera deactivated');
            }
        }

        function processVideoFrames() {
            if (!cameraActive) return;
            
            const video = document.getElementById('cameraFeed');
            const canvas = document.getElementById('mlCanvas');
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Analyze frame
                mlModel2.analyzeFrame(canvasCtx.getImageData(0, 0, canvas.width, canvas.height));
                
                // Update ML status
                const mlStatus = document.getElementById('mlStatus');
                mlStatus.textContent = `🔴 Recording • Frame: ${mlModel.frameCount} • Confidence: ${mlModel.confidence.toFixed(1)}%`;
            }
            
            requestAnimationFrame(processVideoFrames);
        }

        // ==================== UI HELPERS ====================
        function addDebugLog(message, type = 'info') {
            // Messages go through AI system
            ai.addMessage('system', message);
        }

        function updateConnectionStatus(connected) {
            const badge = document.getElementById('connectionStatus');
            const indicator = document.getElementById('statusIndicator');
            
            if (connected) {
                badge.textContent = 'CONNECTED';
                indicator.classList.add('connected');
            } else {
                badge.textContent = 'DISCONNECTED';
                indicator.classList.remove('connected');
            }
        }

        function updateStatusBox(axis, value) {
            const elementId = `status${axis}`;
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = axis === 'ANGLE' ? `${value}°` : value;
                element.style.animation = 'none';
                setTimeout(() => { element.style.animation = 'pulse 0.5s'; }, 10);
            }
        }

        // ==================== EVENT LISTENERS ====================
        function initializeEventListeners() {
            // Connection
            document.getElementById('scanBtn')?.addEventListener('click', () => serial.scanPorts());
            document.getElementById('connectBtn')?.addEventListener('click', () => serial.connect());
            document.getElementById('disconnectBtn')?.addEventListener('click', () => serial.disconnect());

            // Camera
            document.getElementById('cameraStartBtn')?.addEventListener('click', startCamera);
            document.getElementById('cameraStopBtn')?.addEventListener('click', stopCamera);
            document.getElementById('recordBtn')?.addEventListener('click', () => {
                recordingActive = !recordingActive;
                const btn = document.getElementById('recordBtn');
                btn.style.background = recordingActive ? '#c41e3a' : '#2e4a7c';
                btn.textContent = recordingActive ? '⏹ STOP RECORD' : '⚫ RECORD';
                addDebugLog(recordingActive ? '🔴 Recording started' : '⏹ Recording stopped', 'system');
            });

            // Speed
            document.getElementById('speedSlider')?.addEventListener('input', (e) => {
                motorSpeed = parseInt(e.target.value);
                document.getElementById('speedDisplay').textContent = motorSpeed;
                if (serial.isConnected) serial.sendCommand('s' + motorSpeed);
            });

            // Mode
            document.getElementById('btnContinuous')?.addEventListener('click', () => {
                motorMode = 'continuous';
                document.getElementById('btnContinuous').classList.add('active');
                document.getElementById('btnStep').classList.remove('active');
                if (serial.isConnected) serial.sendCommand('y');
            });

            document.getElementById('btnStep')?.addEventListener('click', () => {
                motorMode = 'step';
                document.getElementById('btnStep').classList.add('active');
                document.getElementById('btnContinuous').classList.remove('active');
                if (serial.isConnected) serial.sendCommand('y');
            });

            // Step size
            document.getElementById('stepSlider')?.addEventListener('input', (e) => {
                motorStepSize = parseInt(e.target.value);
                document.getElementById('stepDisplay').textContent = motorStepSize;
                if (serial.isConnected) serial.sendCommand('n' + motorStepSize);
            });

            // Movement pad
            document.querySelectorAll('.dpad-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (serial.isConnected) serial.sendCommand(btn.dataset.cmd);
                });
            });

            // Rotation
            document.getElementById('btnRotateCCW')?.addEventListener('click', () => {
                if (serial.isConnected) serial.sendCommand('j');
            });

            document.getElementById('btnRotateCW')?.addEventListener('click', () => {
                if (serial.isConnected) serial.sendCommand('e');
            });

            // Index
            document.getElementById('btnIndexBack')?.addEventListener('click', () => {
                if (serial.isConnected) serial.sendCommand('i');
            });

            document.getElementById('btnIndexFwd')?.addEventListener('click', () => {
                if (serial.isConnected) serial.sendCommand('c');
            });

            // Emergency
            document.getElementById('emergencyStop')?.addEventListener('click', () => {
                addDebugLog('🛑 EMERGENCY STOP', 'error');
                if (serial.isConnected) serial.sendCommand('u');
            });

            document.getElementById('btnHome')?.addEventListener('click', () => {
                if (serial.isConnected) serial.sendCommand('h');
            });

            // AI Chat
            document.getElementById('aiSendBtn')?.addEventListener('click', () => {
                const input = document.getElementById('aiInput');
                const message = input.value.trim();
                if (message) {
                    ai.addMessage('user', message);
                    const response = ai.generateResponse(message);
                    setTimeout(() => ai.addMessage('assistant', response), 500);
                    input.value = '';
                }
            });

            document.getElementById('aiInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('aiSendBtn').click();
            });

            console.log('Event listeners initialized');
        }

        setTimeout(initializeEventListeners, 100);

        // Initialize AI
        ai.addMessage('system', '🤖 GemBot AI System Ready');
        ai.addMessage('assistant', '👋 Welcome! I\'m your AI cutting assistant. Connect to the device and start the camera to begin. I\'ll monitor your work and provide real-time guidance!');
