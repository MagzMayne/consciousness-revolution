<script>
const cfg = JSON.parse(document.getElementById('config').textContent);

// Conversation history management
class ConversationManager {
  constructor() {
    this.history = this.loadHistory();
    this.totalTokens = 0;
  }

  loadHistory() {
    try {
      const saved = localStorage.getItem('greenai_history');
      return saved ? JSON.parse(saved) : [];
    } catch (e) {
      console.warn('Failed to load history:', e);
      return [];
    }
  }

  saveHistory() {
    try {
      localStorage.setItem('greenai_history', JSON.stringify(this.history));
    } catch (e) {
      console.warn('Failed to save history:', e);
    }
  }

  addMessage(role, content, metadata = {}) {
    const message = {
      id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).substring(2, 11)}`,
      role,
      content,
      timestamp: new Date().toISOString(),
      ...metadata
    };
    this.history.push(message);
    this.saveHistory();
    return message;
  }

  clear() {
    this.history = [];
    this.totalTokens = 0;
    this.saveHistory();
    // Don't remove settings - they should persist across conversation clears
  }

  exportAsJson() {
    return JSON.stringify({
      exported: new Date().toISOString(),
      totalMessages: this.history.length,
      totalTokens: this.totalTokens,
      messages: this.history
    }, null, 2);
  }

  exportAsText() {
    let text = `Green AI Terminal - Conversation Export\n`;
    text += `Exported: ${new Date().toISOString()}\n`;
    text += `Total Messages: ${this.history.length}\n`;
    text += `Total Tokens (est): ${this.totalTokens}\n`;
    text += `${'='.repeat(60)}\n\n`;
    
    this.history.forEach((msg, idx) => {
      text += `[${idx + 1}] ${msg.role.toUpperCase()} - ${msg.timestamp}\n`;
      if (msg.model) text += `Model: ${msg.model} | Mode: ${msg.mode} | Task: ${msg.task}\n`;
      if (msg.tokens) text += `Tokens (est): ${msg.tokens}\n`;
      text += `${'-'.repeat(60)}\n`;
      text += `${msg.content}\n\n`;
    });
    
    return text;
  }
}

// Settings management
class SettingsManager {
  constructor() {
    this.loadSettings();
  }

  loadSettings() {
    try {
      const saved = localStorage.getItem('greenai_settings');
      if (saved) {
        const settings = JSON.parse(saved);
        if (settings.energyMode) {
          document.getElementById('energyMode').value = settings.energyMode;
        }
        if (settings.taskType) {
          document.getElementById('taskType').value = settings.taskType;
        }
      }
    } catch (e) {
      console.warn('Failed to load settings:', e);
    }
  }

  saveSettings() {
    try {
      const settings = {
        energyMode: document.getElementById('energyMode').value,
        taskType: document.getElementById('taskType').value
      };
      localStorage.setItem('greenai_settings', JSON.stringify(settings));
    } catch (e) {
      console.warn('Failed to save settings:', e);
    }
  }
}

const conversation = new ConversationManager();
const settings = new SettingsManager();

function classifyTask(text) {
  const len = text.split(/\s+/).length;
  if (len < 30 && /^(what|who|when|where|why|how)\b/i.test(text)) return "simple_qna";
  if (/summari[sz]e|tl;dr/i.test(text)) return "summarize";
  if (/rewrite|rephrase|improve/i.test(text)) return "rewrite";
  if (/error|stack trace|exception|bug|traceback/i.test(text)) return "code_fix";
  return len > 200 ? "deep_reasoning" : "simple_qna";
}

function chooseModel(task, mode) {
  const table = {
    "eco": {
      "simple_qna": "tiny",
      "summarize": "tiny",
      "rewrite": "small",
      "code_fix": "small",
      "deep_reasoning": "standard"
    },
    "balanced": {
      "simple_qna": "tiny",
      "summarize": "small",
      "rewrite": "small",
      "code_fix": "standard",
      "deep_reasoning": "standard"
    },
    "performance": {
      "simple_qna": "small",
      "summarize": "standard",
      "rewrite": "standard",
      "code_fix": "standard",
      "deep_reasoning": "large"
    }
  };
  return table[mode]?.[task] || "small";
}

function estimateTokens(text) {
  // Rough estimation: ~1.3 tokens per word on average
  const words = text.split(/\s+/).length;
  return Math.ceil(words * 1.3);
}

function formatTimestamp(isoString) {
  const date = new Date(isoString);
  return date.toLocaleTimeString();
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showStatus('Copied to clipboard!', 2000);
    }).catch(err => {
      console.error('Failed to copy:', err);
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showStatus('Copied to clipboard!', 2000);
  } catch (err) {
    console.error('Fallback copy failed:', err);
    showStatus('Failed to copy to clipboard', 3000);
  }
  document.body.removeChild(textarea);
}

function showStatus(message, duration = 3000) {
  const statusEl = document.getElementById('status');
  const originalText = statusEl.textContent;
  statusEl.textContent = message;
  setTimeout(() => {
    statusEl.textContent = originalText;
  }, duration);
}

function updateStats() {
  document.getElementById('messageCount').textContent = conversation.history.length;
  document.getElementById('totalTokens').textContent = conversation.totalTokens;
}

function renderMessage(message) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${message.role}`;
  
  // Create header
  const headerDiv = document.createElement('div');
  headerDiv.className = 'message-header';
  
  const leftDiv = document.createElement('div');
  const strong = document.createElement('strong');
  strong.textContent = message.role === 'user' ? 'You' : 'Assistant';
  leftDiv.appendChild(strong);
  
  const rightDiv = document.createElement('div');
  const timeSpan = document.createElement('span');
  timeSpan.textContent = formatTimestamp(message.timestamp);
  rightDiv.appendChild(timeSpan);
  
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = 'Copy';
  copyBtn.addEventListener('click', () => copyToClipboard(message.content));
  rightDiv.appendChild(copyBtn);
  
  headerDiv.appendChild(leftDiv);
  headerDiv.appendChild(rightDiv);
  
  // Create content
  const contentDiv = document.createElement('div');
  contentDiv.className = 'message-content';
  contentDiv.textContent = message.content;
  
  // Create meta
  let metaDiv = null;
  if (message.model) {
    metaDiv = document.createElement('div');
    metaDiv.className = 'message-meta';
    metaDiv.textContent = `Model: ${message.model} · Mode: ${message.mode} · Task: ${message.task}${message.tokens ? ` · ~${message.tokens} tokens` : ''}`;
  }
  
  // Assemble message
  msgDiv.appendChild(headerDiv);
  msgDiv.appendChild(contentDiv);
  if (metaDiv) msgDiv.appendChild(metaDiv);
  
  return msgDiv;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderConversation() {
  const container = document.getElementById('conversation');
  container.innerHTML = '';
  conversation.history.forEach(msg => {
    container.appendChild(renderMessage(msg));
  });
  container.scrollTop = container.scrollHeight;
  updateStats();
}

async function send() {
  const promptEl = document.getElementById('prompt');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const loadingEl = document.getElementById('loading');
  const sendBtn = document.getElementById('send');
  const mode = document.getElementById('energyMode').value;
  let task = document.getElementById('taskType').value;

  const text = promptEl.value.trim();
  if (!text) return;

  // Save settings
  settings.saveSettings();

  // Disable input while processing
  sendBtn.disabled = true;
  promptEl.disabled = true;

  if (task === "auto") task = classifyTask(text);
  const modelKey = chooseModel(task, mode);
  const endpoint = cfg.endpoints[modelKey];
  const estTokens = Math.min(estimateTokens(text), endpoint.maxTokens);

  // Add user message
  conversation.addMessage('user', text);
  promptEl.value = '';
  renderConversation();

  statusEl.textContent = `Sending → ${modelKey} · ${mode} · est. ${estTokens} tokens`;
  metaEl.textContent = `Task: ${task} · Model: ${modelKey}`;
  loadingEl.classList.add('active');

  try {
    // Simulate API call with appropriate delay based on mode
    const fakeDelay = mode === "eco" ? 1200 : mode === "balanced" ? 800 : 400;
    await new Promise(r => setTimeout(r, fakeDelay));
    
    // Generate simulated response
    const responseText = generateSimulatedResponse(text, task, modelKey, mode);
    const responseTokens = estimateTokens(responseText);
    
    // Add assistant message
    conversation.addMessage('assistant', responseText, {
      model: modelKey,
      mode: mode,
      task: task,
      tokens: estTokens + responseTokens
    });
    
    // Update total tokens
    conversation.totalTokens += (estTokens + responseTokens);
    
    renderConversation();
    statusEl.textContent = `Done · ${modelKey} · ${mode} · ~${estTokens + responseTokens} tokens`;
  } catch (e) {
    const errorMsg = `Error: ${e.message || e}`;
    conversation.addMessage('assistant', errorMsg, {
      model: modelKey,
      mode: mode,
      task: task,
      error: true
    });
    renderConversation();
    statusEl.textContent = `Error`;
  } finally {
    loadingEl.classList.remove('active');
    sendBtn.disabled = false;
    promptEl.disabled = false;
    promptEl.focus();
  }
}

function generateSimulatedResponse(prompt, task, model, mode) {
  const responses = {
    simple_qna: [
      `Based on your question, here's a concise answer:\n\n`,
      `Let me help you with that:\n\n`,
      `Here's what I found:\n\n`
    ],
    summarize: [
      `Here's a summary of the key points:\n\n`,
      `TL;DR:\n\n`,
      `Main takeaways:\n\n`
    ],
    rewrite: [
      `Here's a rewritten version:\n\n`,
      `I've improved the text as follows:\n\n`,
      `Rewritten for clarity:\n\n`
    ],
    code_fix: [
      `I've identified the issue. Here's the fix:\n\n`,
      `The problem appears to be:\n\n`,
      `Try this solution:\n\n`
    ],
    deep_reasoning: [
      `Let me analyze this step by step:\n\n`,
      `After careful consideration:\n\n`,
      `Here's a comprehensive analysis:\n\n`
    ]
  };

  const prefix = responses[task]?.[Math.floor(Math.random() * responses[task].length)] || responses.simple_qna[0];
  
  const suffixes = {
    eco: `\n\n[Simulated ${model} response in ${mode} mode - configured for energy efficiency]`,
    balanced: `\n\n[Simulated ${model} response in ${mode} mode - balanced performance and efficiency]`,
    performance: `\n\n[Simulated ${model} response in ${mode} mode - optimized for best quality]`
  };

  const mockContent = `${prefix}This is a simulated response to: "${prompt.substring(0, 100)}${prompt.length > 100 ? '...' : ''}"\n\nIn a production environment, this would connect to an actual AI API endpoint. The green AI approach optimizes model selection based on task complexity and energy mode.${suffixes[mode] || ''}`;
  
  return mockContent;
}

function downloadFile(content, filename, type = 'text/plain') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Event listeners
document.getElementById('send').addEventListener('click', send);

document.getElementById('prompt').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    send();
  }
});

document.getElementById('clear').addEventListener('click', () => {
  if (confirm('Clear all conversation history? This cannot be undone.')) {
    conversation.clear();
    renderConversation();
    showStatus('Conversation cleared', 2000);
  }
});

document.getElementById('exportJson').addEventListener('click', () => {
  const json = conversation.exportAsJson();
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  downloadFile(json, `greenai-export-${timestamp}.json`, 'application/json');
  showStatus('Exported as JSON', 2000);
});

document.getElementById('exportText').addEventListener('click', () => {
  const text = conversation.exportAsText();
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  downloadFile(text, `greenai-export-${timestamp}.txt`, 'text/plain');
  showStatus('Exported as text', 2000);
});

// Save settings when changed
document.getElementById('energyMode').addEventListener('change', () => settings.saveSettings());
document.getElementById('taskType').addEventListener('change', () => settings.saveSettings());

// Initialize
renderConversation();
document.getElementById('prompt').focus();
</script>
