<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sCheck.html Functionality Test Suite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0e1a;
            color: #e5e7eb;
        }
        h1 { color: #38bdf8; }
        h2 { color: #60a5fa; margin-top: 30px; }
        .test-section {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #38bdf8;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .pass {
            background: #064e3b;
            border-left: 4px solid #10b981;
        }
        .fail {
            background: #7f1d1d;
            border-left: 4px solid #ef4444;
        }
        .info {
            background: #1e3a8a;
            border-left: 4px solid #3b82f6;
        }
        button {
            background: #38bdf8;
            color: #0a0e1a;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin: 10px 5px;
        }
        button:hover {
            background: #0ea5e9;
        }
        code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
        .summary {
            font-size: 1.2em;
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 sCheck.html Functionality Test Suite</h1>
    <p>This test suite validates all enhancements made to sCheck.html to ensure it can scan all artifact types.</p>
    
    <button onclick="runAllTests()">▶️ Run All Tests</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    
    <div id="summary" class="summary" style="display:none;">
        <strong>Test Summary:</strong>
        <div id="summaryContent"></div>
    </div>
    
    <div id="results"></div>

    <script>
        const results = [];
        
        function logTest(category, testName, passed, details = '') {
            results.push({ category, testName, passed, details });
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✅' : '❌'} ${testName}</strong>
                ${details ? `<div style="margin-top: 5px; font-size: 0.9em;">${details}</div>` : ''}
            `;
            
            let categorySection = document.getElementById(`category-${category}`);
            if (!categorySection) {
                categorySection = document.createElement('div');
                categorySection.id = `category-${category}`;
                categorySection.className = 'test-section';
                categorySection.innerHTML = `<h2>${category}</h2>`;
                document.getElementById('results').appendChild(categorySection);
            }
            categorySection.appendChild(resultDiv);
        }
        
        function logInfo(category, message) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result info';
            resultDiv.innerHTML = `<strong>ℹ️ ${message}</strong>`;
            
            let categorySection = document.getElementById(`category-${category}`);
            if (!categorySection) {
                categorySection = document.createElement('div');
                categorySection.id = `category-${category}`;
                categorySection.className = 'test-section';
                categorySection.innerHTML = `<h2>${category}</h2>`;
                document.getElementById('results').appendChild(categorySection);
            }
            categorySection.appendChild(resultDiv);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
            results.length = 0;
        }
        
        function showSummary() {
            const total = results.length;
            const passed = results.filter(r => r.passed).length;
            const failed = total - passed;
            const percentage = Math.round((passed / total) * 100);
            
            document.getElementById('summaryContent').innerHTML = `
                <div style="margin-top: 10px;">
                    Total Tests: <strong>${total}</strong> |
                    Passed: <strong style="color: #10b981;">${passed}</strong> |
                    Failed: <strong style="color: #ef4444;">${failed}</strong> |
                    Success Rate: <strong>${percentage}%</strong>
                </div>
            `;
            document.getElementById('summary').style.display = 'block';
            window.scrollTo(0, 0);
        }
        
        async function runAllTests() {
            clearResults();
            
            // Test 1: File Upload Button
            logInfo('🔍 Core Features', 'Testing file upload button...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasUploadButton = html.includes('Upload File (All Types Supported)');
                const hasFileInput = html.includes('type="file"');
                logTest('🔍 Core Features', 'File Upload Button Exists', hasUploadButton && hasFileInput,
                    hasUploadButton && hasFileInput ? 'Upload button and file input found in HTML' : 'Missing upload components');
            } catch (error) {
                logTest('🔍 Core Features', 'File Upload Button Exists', false, `Error: ${error.message}`);
            }
            
            // Test 2: Content Sanitization Function
            logInfo('🔒 Security', 'Testing content sanitization...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasSanitizeFunction = html.includes('function sanitizeContent');
                const usesTextContent = html.includes('div.textContent = content');
                logTest('🔒 Security', 'XSS Prevention - sanitizeContent()', hasSanitizeFunction && usesTextContent,
                    hasSanitizeFunction ? 'Sanitization function implemented with textContent' : 'Missing sanitization');
            } catch (error) {
                logTest('🔒 Security', 'XSS Prevention - sanitizeContent()', false, `Error: ${error.message}`);
            }
            
            // Test 3: Enhanced Uniqueness Scoring
            logInfo('📊 Scoring Algorithms', 'Testing enhanced uniqueness scoring...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasMultiMetric = html.includes('lexicalRatio') && 
                                      html.includes('charDiversity') && 
                                      html.includes('lineComplexity') &&
                                      html.includes('lengthFactor');
                const hasConstants = html.includes('UNIQUENESS_CONSTANTS');
                logTest('📊 Scoring Algorithms', 'Enhanced Uniqueness Score (4-metric)', hasMultiMetric,
                    hasMultiMetric ? 'Multi-metric algorithm with lexical, char, line, length factors' : 'Simple algorithm detected');
                logTest('📊 Scoring Algorithms', 'Named Constants for Magic Numbers', hasConstants,
                    hasConstants ? 'UNIQUENESS_CONSTANTS defined for ASCII_RANGE, TYPICAL_LINE_LENGTH, LOG_SCALE_DIVISOR' : 'Magic numbers found');
            } catch (error) {
                logTest('📊 Scoring Algorithms', 'Enhanced Uniqueness Score (4-metric)', false, `Error: ${error.message}`);
            }
            
            // Test 4: Enhanced Value Scoring
            logInfo('📊 Scoring Algorithms', 'Testing enhanced value scoring...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasFileTypeScoring = html.includes("currentFileType === 'image'") ||
                                          html.includes("currentFileType === 'video'");
                const hasKeywordScoring = html.includes('keywords.high') && html.includes('keywords.medium');
                const hasCodeComplexity = html.includes('function|class|import');
                logTest('📊 Scoring Algorithms', 'Enhanced Value Score - File Type Detection', hasFileTypeScoring,
                    hasFileTypeScoring ? 'Scores images, videos, audio, code differently' : 'No file type consideration');
                logTest('📊 Scoring Algorithms', 'Enhanced Value Score - Keyword Analysis', hasKeywordScoring,
                    hasKeywordScoring ? 'Multi-tier keyword matching (high/medium/low)' : 'Simple keyword matching');
                logTest('📊 Scoring Algorithms', 'Enhanced Value Score - Code Complexity', hasCodeComplexity,
                    hasCodeComplexity ? 'Detects code patterns for bonus scoring' : 'No code detection');
            } catch (error) {
                logTest('📊 Scoring Algorithms', 'Enhanced Value Score', false, `Error: ${error.message}`);
            }
            
            // Test 5: Content Type Detection
            logInfo('📁 File Handling', 'Testing content type detection...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasDetectFunction = html.includes('function detectContentType');
                const supportsMultipleTypes = html.includes('imageExts') && 
                                             html.includes('videoExts') && 
                                             html.includes('audioExts') &&
                                             html.includes('codeExts');
                const hasFilenameCheck = html.includes('parts.length > 1');
                logTest('📁 File Handling', 'detectContentType() Function', hasDetectFunction,
                    hasDetectFunction ? 'Function exists for file type detection' : 'Missing detection function');
                logTest('📁 File Handling', 'Multiple File Type Support', supportsMultipleTypes,
                    supportsMultipleTypes ? 'Supports image, video, audio, code files' : 'Limited file type support');
                logTest('📁 File Handling', 'Filename Without Extension Handling', hasFilenameCheck,
                    hasFilenameCheck ? 'Handles files without extensions correctly' : 'May fail on extensionless files');
            } catch (error) {
                logTest('📁 File Handling', 'Content Type Detection', false, `Error: ${error.message}`);
            }
            
            // Test 6: Creator Reset Bug Fix
            logInfo('🐛 Bug Fixes', 'Testing creator field reset...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const handleClearMatch = html.match(/function handleClear\(\) \{[\s\S]*?\}/);
                if (handleClearMatch) {
                    const handleClearCode = handleClearMatch[0];
                    const resetsCreator = handleClearCode.includes('creatorInput.value = ""');
                    const resetsAgent = handleClearCode.includes('agentIdInput.value = ""');
                    const resetsLineage = handleClearCode.includes('lineageInput.value = ""');
                    logTest('🐛 Bug Fixes', 'Creator Field Reset in handleClear()', resetsCreator,
                        resetsCreator ? 'creatorInput properly reset to empty string' : 'Creator field not reset');
                    logTest('🐛 Bug Fixes', 'All Metadata Fields Reset', resetsCreator && resetsAgent && resetsLineage,
                        'All metadata inputs (creator, agent, lineage) are cleared');
                } else {
                    logTest('🐛 Bug Fixes', 'Creator Field Reset', false, 'handleClear() function not found');
                }
            } catch (error) {
                logTest('🐛 Bug Fixes', 'Creator Field Reset', false, `Error: ${error.message}`);
            }
            
            // Test 7: Smart Content Preview
            logInfo('✂️ Content Handling', 'Testing smart content preview...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasSmarterTruncation = html.includes('content.length > 500');
                const hasEllipsis = html.includes('...(truncated for preview)');
                const usesSanitize = html.includes('sanitizeContent(');
                logTest('✂️ Content Handling', 'Smart Truncation (500 chars vs 220)', hasSmarterTruncation,
                    hasSmarterTruncation ? 'Increased from 220 to 500 chars with conditional logic' : 'Still using old 220 limit');
                logTest('✂️ Content Handling', 'Ellipsis Indicator', hasEllipsis,
                    hasEllipsis ? 'Clear truncation indicator added' : 'No truncation indicator');
                logTest('✂️ Content Handling', 'Sanitized Content Preview', usesSanitize,
                    usesSanitize ? 'Content preview is sanitized before display' : 'Raw content used');
            } catch (error) {
                logTest('✂️ Content Handling', 'Smart Content Preview', false, `Error: ${error.message}`);
            }
            
            // Test 8: Export Functionality
            logInfo('💾 Export Features', 'Testing export functionality...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasExportButton = html.includes('Export Envelope');
                const hasExportFunction = html.includes('function handleExport');
                const hasBlobCreation = html.includes('new Blob');
                const hasDownloadLogic = html.includes('a.download');
                logTest('💾 Export Features', 'Export Envelope Button', hasExportButton,
                    hasExportButton ? 'Export button added to UI' : 'No export button');
                logTest('💾 Export Features', 'handleExport() Function', hasExportFunction,
                    hasExportFunction ? 'Export handler implemented' : 'No export handler');
                logTest('💾 Export Features', 'File Download Logic', hasBlobCreation && hasDownloadLogic,
                    hasBlobCreation && hasDownloadLogic ? 'Proper blob creation and download trigger' : 'Incomplete download logic');
            } catch (error) {
                logTest('💾 Export Features', 'Export Functionality', false, `Error: ${error.message}`);
            }
            
            // Test 9: Enhanced Envelope Structure
            logInfo('📦 Envelope Structure', 'Testing enhanced envelope fields...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasContentType = html.includes('content_type:');
                const hasFileName = html.includes('file_name:');
                const hasLines = html.includes('lines:');
                logTest('📦 Envelope Structure', 'content_type Field', hasContentType,
                    hasContentType ? 'Envelope includes content_type field' : 'Missing content_type');
                logTest('📦 Envelope Structure', 'file_name Field', hasFileName,
                    hasFileName ? 'Envelope includes file_name field' : 'Missing file_name');
                logTest('📦 Envelope Structure', 'lines Count in Metrics', hasLines,
                    hasLines ? 'Metrics include line count' : 'Missing line count');
            } catch (error) {
                logTest('📦 Envelope Structure', 'Enhanced Envelope', false, `Error: ${error.message}`);
            }
            
            // Test 10: File Upload Handler
            logInfo('📤 File Upload', 'Testing file upload handler...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasFileInputListener = html.includes('fileInput.addEventListener');
                const handlesImages = html.includes('fileType.startsWith(\'image/\')');
                const handlesVideo = html.includes('fileType.startsWith(\'video/\')');
                const handlesAudio = html.includes('fileType.startsWith(\'audio/\')');
                const handlesText = html.includes('file.text()');
                logTest('📤 File Upload', 'File Input Event Listener', hasFileInputListener,
                    hasFileInputListener ? 'File input change handler implemented' : 'No file handler');
                logTest('📤 File Upload', 'Image File Support', handlesImages,
                    handlesImages ? 'Images converted to base64' : 'No image support');
                logTest('📤 File Upload', 'Video File Support', handlesVideo,
                    handlesVideo ? 'Video metadata extraction' : 'No video support');
                logTest('📤 File Upload', 'Audio File Support', handlesAudio,
                    handlesAudio ? 'Audio metadata extraction' : 'No audio support');
                logTest('📤 File Upload', 'Text File Support', handlesText,
                    handlesText ? 'Text files read directly' : 'No text support');
            } catch (error) {
                logTest('📤 File Upload', 'File Upload Handler', false, `Error: ${error.message}`);
            }
            
            // Test 11: Race Condition Fix
            logInfo('🐛 Bug Fixes', 'Testing async race condition fix...');
            try {
                const response = await fetch('sCheck.html');
                const html = await response.text();
                const hasEarlyReturn = html.includes('return; // Early return prevents duplicate updateCharCount()');
                logTest('🐛 Bug Fixes', 'Async Race Condition Prevention', hasEarlyReturn,
                    hasEarlyReturn ? 'Early return prevents duplicate updateCharCount() calls' : 'Potential race condition exists');
            } catch (error) {
                logTest('🐛 Bug Fixes', 'Race Condition Fix', false, `Error: ${error.message}`);
            }
            
            // Summary
            showSummary();
        }
    </script>
</body>
</html>
