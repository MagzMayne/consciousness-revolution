<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-3067B636">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget System Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #00ffaa;
            margin-bottom: 20px;
        }
        .test-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        #widget-container {
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(0,255,170,0.3);
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }
        .btn {
            padding: 10px 20px;
            background: rgba(0,255,170,0.2);
            border: 1px solid #00ffaa;
            color: #00ffaa;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background: rgba(0,255,170,0.3);
        }
        .log {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .log-entry { margin-bottom: 5px; }
        .log-success { color: #00ff88; }
        .log-error { color: #ff4444; }
        .log-info { color: #0ff; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <h1>Widget System Test</h1>

    <div class="test-section">
        <h2>1. Widget Library Test</h2>
        <button class="btn" onclick="testLibrary()">Test Library API</button>
        <button class="btn" onclick="listWidgets()">List All Widgets</button>
        <button class="btn" onclick="listCategories()">List Categories</button>
    </div>

    <div class="test-section">
        <h2>2. Onboarding Widget Test</h2>
        <div id="widget-container">
            <p style="color:#666; text-align:center;">Widget will render here...</p>
        </div>
        <div style="margin-top: 15px;">
            <button class="btn" onclick="renderOnboardingWidget()">Render Onboarding Widget</button>
            <button class="btn" onclick="refreshWidget()">Refresh Widget</button>
        </div>
    </div>

    <div class="test-section">
        <h2>3. Test Log</h2>
        <div id="log" class="log">
            <div class="log-entry log-info">Ready for testing...</div>
        </div>
    </div>

    <!-- Load widget system files -->
    <script src="/js/widget-library.js"></script>
    <script src="/js/widgets/onboarding-widget.js"></script>

    <script>
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function testLibrary() {
            log('Testing WidgetLibrary API...', 'info');

            if (typeof window.WidgetLibrary === 'undefined') {
                log('ERROR: WidgetLibrary not loaded!', 'error');
                return;
            }

            log('WidgetLibrary.getAll() exists: ' + (typeof window.WidgetLibrary.getAll === 'function'), 'success');
            log('WidgetLibrary.get() exists: ' + (typeof window.WidgetLibrary.get === 'function'), 'success');
            log('WidgetLibrary.register() exists: ' + (typeof window.WidgetLibrary.register === 'function'), 'success');

            const onboarding = window.WidgetLibrary.get('onboarding-status');
            if (onboarding) {
                log('Found onboarding-status widget: ' + onboarding.name, 'success');
            } else {
                log('ERROR: onboarding-status widget not found!', 'error');
            }
        }

        function listWidgets() {
            log('Listing all widgets...', 'info');

            if (!window.WidgetLibrary) {
                log('ERROR: WidgetLibrary not loaded!', 'error');
                return;
            }

            const widgets = window.WidgetLibrary.getAll();
            log(`Found ${widgets.length} widgets:`, 'success');
            widgets.forEach(w => {
                log(`  - ${w.icon} ${w.name} (${w.category}, ${w.size})`, 'info');
            });
        }

        function listCategories() {
            log('Listing categories...', 'info');

            if (!window.WidgetLibrary) {
                log('ERROR: WidgetLibrary not loaded!', 'error');
                return;
            }

            const categories = window.WidgetLibrary.getCategories();
            log(`Found ${categories.length} categories: ${categories.join(', ')}`, 'success');
        }

        function renderOnboardingWidget() {
            log('Rendering onboarding widget...', 'info');

            const container = document.getElementById('widget-container');

            if (!window.OnboardingWidget) {
                log('ERROR: OnboardingWidget not loaded!', 'error');
                return;
            }

            try {
                window.OnboardingWidget.render(container);
                log('Widget rendered successfully!', 'success');
            } catch (e) {
                log('ERROR: ' + e.message, 'error');
            }
        }

        function refreshWidget() {
            log('Refreshing widget...', 'info');

            if (!window.OnboardingWidget) {
                log('ERROR: OnboardingWidget not loaded!', 'error');
                return;
            }

            window.OnboardingWidget.refresh();
            log('Widget refresh triggered', 'success');
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            log('Page loaded, running initial tests...', 'info');
            setTimeout(testLibrary, 500);
            setTimeout(() => renderOnboardingWidget(), 1000);
        });
    </script>
  <script src="/js/mesh-engine-client.js"></script>
</body>
</html>
