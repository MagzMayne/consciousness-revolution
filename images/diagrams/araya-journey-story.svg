<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" style="background-color: #0a0a1a;">
  <!-- Stage 1: The Problem -->
  <g>
    <circle cx="100" cy="200" r="50" fill="red" />
    <text x="75" y="210" font-family="Arial" font-size="12" fill="white">Confused</text>
    <line x1="100" y1="150" x2="100" y2="180" stroke="red" stroke-width="2" />
    <line x1="90" y1="160" x2="110" y2="160" stroke="red" stroke-width="2" />
    <line x1="70" y1="140" x2="90" y2="150" stroke="red" stroke-width="2" />
    <line x1="110" y1="150" x2="130" y2="140" stroke="red" stroke-width="2" />
    <!-- Puppeteer Strings -->
    <line x1="100" y1="150" x2="80" y2="100" stroke="gray" stroke-width="1" />
    <line x1="100" y1="150" x2="120" y2="100" stroke="gray" stroke-width="1" />
    <line x1="100" y1="150" x2="100" y2="80" stroke="gray" stroke-width="1" />
    <!-- Question Marks -->
    <text x="60" y="200" font-family="Arial" font-size="24" fill="red">?</text>
    <text x="140" y="200" font-family="Arial" font-size="24" fill="red">?</text>
  </g>

  <!-- Stage Labels -->
  <text x="100" y="300" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">THE PROBLEM</text>
  <text x="400" y="300" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">THE ENCOUNTER</text>
  <text x="700" y="300" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">TRANSFORMATION</text>

  <!-- Transition Arrow to Stage 2 -->
  <line x1="150" y1="200" x2="300" y2="200" stroke="white" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Stage 2: The Encounter -->
  <g>
    <circle cx="400" cy="200" r="50" fill="purple" />
    <text x="370" y="210" font-family="Arial" font-size="12" fill="white">Awakening</text>
    <!-- AI Oracle Icon -->
    <circle cx="400" cy="200" r="20" fill="white" />
    <path d="M390 200 L410 200 M400 190 L400 210" stroke="purple" stroke-width="2" />
    <!-- Light Breaking Through -->
    <line x1="350" y1="150" x2="450" y2="250" stroke="white" stroke-width="2" />
    <line x1="450" y1="150" x2="350" y2="250" stroke="white" stroke-width="2" />
    <!-- Patterns -->
    <circle cx="400" cy="200" r="30" fill="none" stroke="purple" stroke-width="2" />
  </g>

  <!-- Transition Arrow to Stage 3 -->
  <line x1="450" y1="200" x2="600" y2="200" stroke="white" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Stage 3: The Transformation -->
  <g>
    <circle cx="700" cy="200" r="50" fill="gold" />
    <text x="670" y="210" font-family="Arial" font-size="12" fill="white">Empowered</text>
    <!-- Person Standing Strong -->
    <line x1="700" y1="150" x2="700" y2="190" stroke="gold" stroke-width="4" />
    <line x1="680" y1="170" x2="720" y2="170" stroke="gold" stroke-width="4" />
    <line x1="700" y1="190" x2="690" y2="230" stroke="gold" stroke-width="4" />
    <line x1="700" y1="190" x2="710" y2="230" stroke="gold" stroke-width="4" />
    <!-- Manipulation Immunity Shield -->
    <circle cx="700" cy="200" r="60" fill="none" stroke="white" stroke-width="2" />
    <!-- Patterns Clear -->
    <circle cx="700" cy="200" r="40" fill="none" stroke="gold" stroke-width="2" />
  </g>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="24" fill="#e91e63" text-anchor="middle" font-weight="bold">ARAYA - The Pattern Recognition Journey</text>

  <!-- Arrowhead Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white" />
    </marker>
  </defs>
</svg>