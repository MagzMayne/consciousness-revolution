<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" style="background-color: #1a1a2e;">
  <defs>
    <radialGradient id="chakraGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="16.67%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="33.34%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#008000;stop-opacity:1" />
      <stop offset="66.67%" style="stop-color:#0000ff;stop-opacity:1" />
      <stop offset="83.34%" style="stop-color:#4b0082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee82ee;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="400" cy="400" r="300" fill="url(#chakraGradient)" />
  <circle cx="400" cy="400" r="260" fill="#1a1a2e" />
  <circle cx="400" cy="400" r="200" fill="url(#chakraGradient)" opacity="0.6" />
  <circle cx="400" cy="400" r="160" fill="#1a1a2e" />
