  <text x="590" y="500" text-anchor="middle" font-family="Arial" font-size="14" fill="#9400d3">Infinity</text>

  <!-- Outer Ring: 13 Levels -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L1</text>
  <text x="300" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L2</text>
  <text x="220" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L3</text>
  <text x="170" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L4</text>
  <text x="140" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L5</text>
  <text x="140" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L6</text>
  <text x="170" y="510" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L7</text>
  <text x="220" y="590" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L8</text>
  <text x="300" y="660" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L9</text>
  <text x="400" y="700" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L10</text>
  <text x="500" y="660" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L11</text>
  <text x="580" y="590" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L12</text>
  <text x="630" y="510" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">L13</text>

