  <!-- Inner Ring: Trinity -->
  <text x="400" y="235" text-anchor="middle" font-family="Arial" font-size="18" fill="white" font-weight="bold">BODY</text>
  <text x="290" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="white" font-weight="bold">MIND</text>
  <text x="510" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="white" font-weight="bold">SPIRIT</text>

