<svg width="200" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- REALITY (Root) -->
  <circle cx="100" cy="600" r="30" fill="red" />
  <text x="100" y="600" font-size="12" text-anchor="middle" fill="white">
    REALITY
  </text>
  <text x="100" y="615" font-size="10" text-anchor="middle" fill="white">
    396Hz
  </text>

  <!-- CREATION (Sacral) -->
  <circle cx="100" cy="500" r="30" fill="orange" />
  <text x="100" y="500" font-size="12" text-anchor="middle" fill="white">
    CREATION
  </text>
  <text x="100" y="515" font-size="10" text-anchor="middle" fill="white">
    417Hz
  </text>

  <!-- WEALTH (Solar Plexus) -->
  <circle cx="100" cy="400" r="30" fill="yellow" />
  <text x="100" y="400" font-size="12" text-anchor="middle" fill="black">
    WEALTH
  </text>
  <text x="100" y="415" font-size="10" text-anchor="middle" fill="black">
    528Hz
  </text>

  <!-- GUARDIAN (Heart) -->
  <circle cx="100" cy="300" r="30" fill="green" />
  <text x="100" y="300" font-size="12" text-anchor="middle" fill="white">
    GUARDIAN
  </text>
  <text x="100" y="315" font-size="10" text-anchor="middle" fill="white">
    639Hz
  </text>

  <!-- SIGNAL (Throat) -->
  <circle cx="100" cy="200" r="30" fill="blue" />
  <text x="100" y="200" font-size="12" text-anchor="middle" fill="white">
    SIGNAL
  </text>
  <text x="100" y="215" font-size="10" text-anchor="middle" fill="white">
    741Hz
  </text>

  <!-- CHARACTER (Third Eye) -->
  <circle cx="100" cy="100" r="30" fill="indigo" />
  <text x="100" y="100" font-size="12" text-anchor="middle" fill="white">
    CHARACTER
  </text>
  <text x="100" y="115" font-size="10" text-anchor="middle" fill="white">
    852Hz
  </text>

  <!-- INFINITY (Crown) -->
  <circle cx="100" cy="20" r="30" fill="violet" />
  <text x="100" y="20" font-size="12" text-anchor="middle" fill="white">
    INFINITY
  </text>
  <text x="100" y="35" font-size="10" text-anchor="middle" fill="white">
    963Hz
  </text>

  <!-- Connecting Lines -->
  <line x1="100" y1="570" x2="100" y2="530" stroke="black" stroke-width="2" />
  <line x1="100" y1="470" x2="100" y2="430" stroke="black" stroke-width="2" />
  <line x1="100" y1="370" x2="100" y2="330" stroke="black" stroke-width="2" />
  <line x1="100" y1="270" x2="100" y2="230" stroke="black" stroke-width="2" />
  <line x1="100" y1="170" x2="100" y2="130" stroke="black" stroke-width="2" />
  <line x1="100" y1="70" x2="100" y2="50" stroke="black" stroke-width="2" />
</svg>