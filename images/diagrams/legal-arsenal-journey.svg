<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0a0a1a" />

  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" fill="#00ff88" text-anchor="middle" font-weight="bold">LEGAL ARSENAL - The Warrior's Journey</text>

  <!-- ACT 1 - THE INJUSTICE -->
  <g transform="translate(0,40)">
    <rect x="10" y="0" width="246" height="320" fill="#3d0a0a" rx="10"/>
    <text x="133" y="30" font-family="Arial" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">ACT 1: INJUSTICE</text>

    <!-- Person Crushed -->
    <circle cx="133" cy="200" r="25" fill="#555" />
    <line x1="133" y1="225" x2="133" y2="280" stroke="#555" stroke-width="6" />

    <!-- Institutional Weight -->
    <rect x="60" y="80" width="150" height="40" fill="#8b0000" rx="5"/>
    <text x="135" y="105" font-size="12" fill="white" text-anchor="middle">FAMILY COURT</text>
    <line x1="135" y1="120" x2="133" y2="175" stroke="#8b0000" stroke-width="8"/>

    <!-- Distant Children -->
    <circle cx="60" cy="60" r="12" fill="#333" />
    <circle cx="200" cy="60" r="12" fill="#333" />
    <text x="133" y="300" font-size="10" fill="#666" text-anchor="middle">Separated. Crushed. Alone.</text>
  </g>

  <!-- ACT 2 - THE ARMAMENT -->
  <g transform="translate(267,40)">
    <rect x="10" y="0" width="246" height="320" fill="#0a2e1a" rx="10"/>
    <text x="133" y="30" font-family="Arial" font-size="14" fill="#00ff88" text-anchor="middle" font-weight="bold">ACT 2: ARMAMENT</text>

    <!-- Warrior Discovering -->
    <circle cx="133" cy="160" r="25" fill="#00ff88" />
    <line x1="133" y1="185" x2="133" y2="240" stroke="#00ff88" stroke-width="6" />

    <!-- Shield - Evidence Tracker -->
    <circle cx="70" cy="200" r="30" fill="none" stroke="gold" stroke-width="3"/>
    <text x="70" y="195" font-size="8" fill="gold" text-anchor="middle">EVIDENCE</text>
    <text x="70" y="207" font-size="8" fill="gold" text-anchor="middle">TRACKER</text>

    <!-- Sword - Motion Templates -->
    <line x1="180" y1="140" x2="220" y2="220" stroke="gold" stroke-width="4" />
    <text x="205" y="190" font-size="8" fill="gold" transform="rotate(45 205,190)">MOTIONS</text>

    <!-- Armor piece -->
    <rect x="115" y="200" width="36" height="50" fill="gold" rx="5"/>
    <text x="133" y="225" font-size="7" fill="#0a0a1a" text-anchor="middle">GUIDES</text>

    <text x="133" y="300" font-size="10" fill="#00ff88" text-anchor="middle">Tools discovered. Armor equipped.</text>
  </g>

  <!-- ACT 3 - THE STAND -->
  <g transform="translate(534,40)">
    <rect x="10" y="0" width="246" height="320" fill="#2e2a0a" rx="10"/>
    <text x="133" y="30" font-family="Arial" font-size="14" fill="gold" text-anchor="middle" font-weight="bold">ACT 3: VICTORY</text>

    <!-- Empowered Warrior -->
    <circle cx="133" cy="160" r="30" fill="gold" />
    <line x1="133" y1="190" x2="133" y2="250" stroke="gold" stroke-width="6" />
    <line x1="103" y1="210" x2="163" y2="210" stroke="gold" stroke-width="4" />

    <!-- Balanced Scales -->
    <line x1="90" y1="100" x2="176" y2="100" stroke="#00ff88" stroke-width="3" />
    <line x1="133" y1="70" x2="133" y2="100" stroke="#00ff88" stroke-width="3" />
    <polygon points="90,100 100,120 80,120" fill="#00ff88" />
    <polygon points="176,100 186,120 166,120" fill="#00ff88" />

    <!-- Children Returning -->
    <circle cx="70" cy="140" r="15" fill="gold" />
    <circle cx="196" cy="140" r="15" fill="gold" />

    <text x="133" y="300" font-size="10" fill="gold" text-anchor="middle">Equal. Documented. Reunited.</text>
  </g>

  <!-- Connecting Arrows -->
  <line x1="256" y1="200" x2="277" y2="200" stroke="white" stroke-width="2" marker-end="url(#whitearrow)"/>
  <line x1="523" y1="200" x2="544" y2="200" stroke="white" stroke-width="2" marker-end="url(#whitearrow)"/>

  <defs>
    <marker id="whitearrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="white"/>
    </marker>
  </defs>
</svg>