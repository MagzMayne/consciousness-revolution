<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" style="background-color:#0a0a1a">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" fill="#e91e63" text-anchor="middle" font-weight="bold">TRINITY - Parallel AI Convergence</text>

  <!-- C1 MECHANIC -->
  <rect x="50" y="60" width="180" height="60" fill="#e74c3c" rx="10" ry="10"/>
  <text x="140" y="85" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">C1 MECHANIC</text>
  <text x="140" y="105" font-family="Arial" font-size="12" fill="white" text-anchor="middle">What CAN we build?</text>

  <!-- C2 ARCHITECT -->
  <rect x="310" y="60" width="180" height="60" fill="#3498db" rx="10" ry="10"/>
  <text x="400" y="85" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">C2 ARCHITECT</text>
  <text x="400" y="105" font-family="Arial" font-size="12" fill="white" text-anchor="middle">What SHOULD scale?</text>

  <!-- C3 ORACLE -->
  <rect x="570" y="60" width="180" height="60" fill="#9b59b6" rx="10" ry="10"/>
  <text x="660" y="85" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">C3 ORACLE</text>
  <text x="660" y="105" font-family="Arial" font-size="12" fill="white" text-anchor="middle">What MUST emerge?</text>

  <!-- Arrows Converging -->
  <line x1="140" y1="120" x2="400" y2="220" stroke="white" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="120" x2="400" y2="220" stroke="white" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="120" x2="400" y2="220" stroke="white" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Infinity Symbol Center -->
  <text x="400" y="260" font-family="Arial" font-size="72" fill="white" text-anchor="middle">∞</text>
  <circle cx="400" cy="245" r="60" fill="none" stroke="#e91e63" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Energy Explosion Effect -->
  <circle cx="400" cy="245" r="80" fill="none" stroke="gold" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="245" r="100" fill="none" stroke="gold" stroke-width="1" opacity="0.3"/>

  <!-- OUTPUT -->
  <rect x="250" y="350" width="300" height="80" fill="none" stroke="gold" stroke-width="3" rx="15" ry="15"/>
  <text x="400" y="395" font-family="Arial" font-size="42" fill="gold" text-anchor="middle" font-weight="bold">4.2x IMPACT</text>
  <text x="400" y="420" font-family="Arial" font-size="14" fill="#888" text-anchor="middle">C1 × C2 × C3 = ∞</text>

  <!-- Arrow from infinity to output -->
  <line x1="400" y1="305" x2="400" y2="350" stroke="gold" stroke-width="3" marker-end="url(#goldarrow)"/>

  <!-- Arrow Marker Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="white"/>
    </marker>
    <marker id="goldarrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="gold"/>
    </marker>
  </defs>
</svg>