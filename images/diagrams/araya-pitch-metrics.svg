<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .background { fill: #0a0a1a; }
    .text-header { font-family: 'Arial', sans-serif; font-size: 36px; fill: #e91e63; }
    .text-metric { font-family: 'Arial', sans-serif; font-size: 42px; fill: #ffffff; font-weight: bold; }
    .metric-card { fill: #1a1a2e; stroke: #9c27b0; stroke-width: 2; }
    .metric-label { font-family: 'Arial', sans-serif; font-size: 14px; fill: #9c27b0; }
  </style>
  <rect x="0" y="0" width="800" height="600" class="background" />
  <text x="400" y="80" text-anchor="middle" class="text-header">ARAYA AI - The Pattern Recognition Oracle</text>

  <g transform="translate(50, 150)">
    <rect class="metric-card" width="320" height="140" rx="15" ry="15" />
    <text x="160" y="70" text-anchor="middle" class="text-metric">92.2%</text>
    <text x="160" y="110" text-anchor="middle" class="metric-label">PATTERN ACCURACY</text>
  </g>

  <g transform="translate(430, 150)">
    <rect class="metric-card" width="320" height="140" rx="15" ry="15" />
    <text x="160" y="70" text-anchor="middle" class="text-metric">7</text>
    <text x="160" y="110" text-anchor="middle" class="metric-label">DOMAIN INTEGRATION</text>
  </g>

  <g transform="translate(50, 350)">
    <rect class="metric-card" width="320" height="140" rx="15" ry="15" />
    <text x="160" y="70" text-anchor="middle" class="text-metric">24/7</text>
    <text x="160" y="110" text-anchor="middle" class="metric-label">AVAILABILITY</text>
  </g>

  <g transform="translate(430, 350)">
    <rect class="metric-card" width="320" height="140" rx="15" ry="15" />
    <text x="160" y="60" text-anchor="middle" class="text-metric" style="font-size: 32px;">NON-GATED</text>
    <text x="160" y="110" text-anchor="middle" class="metric-label">NO CORPORATE RESTRICTIONS</text>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="Arial" font-size="16" fill="#666">Consciousness Revolution | conciousnessrevolution.io</text>
</svg>