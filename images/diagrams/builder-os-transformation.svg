<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" fill="#ff8800" font-family="Arial" font-weight="bold">BUILDER OS - Developer Transformation</text>

  <!-- BEFORE Section -->
  <g>
    <rect x="20" y="50" width="230" height="320" fill="#1a1010" rx="10"/>
    <text x="135" y="80" text-anchor="middle" font-size="16" fill="#e74c3c" font-family="Arial" font-weight="bold">BEFORE</text>

    <!-- Spaghetti code visualization -->
    <path d="M50,120 Q90,100 130,140 T210,120" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M60,150 Q100,180 140,130 T200,160" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M70,180 Q110,150 150,200 T190,170" stroke="#e74c3c" stroke-width="2" fill="none"/>

    <!-- Bug icons -->
    <circle cx="80" cy="220" r="8" fill="#e74c3c"/>
    <circle cx="140" cy="240" r="8" fill="#e74c3c"/>
    <circle cx="180" cy="210" r="8" fill="#e74c3c"/>
    <text x="135" y="280" text-anchor="middle" font-size="10" fill="#e74c3c">BUGS EVERYWHERE</text>

    <text x="135" y="320" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">10x FRUSTRATED</text>
    <text x="135" y="350" text-anchor="middle" font-size="10" fill="#666">Chaos. Spaghetti. Pain.</text>
  </g>

  <!-- PROCESS Section -->
  <g>
    <rect x="285" y="50" width="230" height="320" fill="#2a1a00" rx="10"/>
    <text x="400" y="80" text-anchor="middle" font-size="16" fill="#ff8800" font-family="Arial" font-weight="bold">DISCOVERING</text>

    <!-- Clean organizing code -->
    <rect x="320" y="110" width="160" height="20" fill="#ff8800" rx="3" opacity="0.3"/>
    <rect x="330" y="140" width="140" height="20" fill="#ff8800" rx="3" opacity="0.5"/>
    <rect x="340" y="170" width="120" height="20" fill="#ff8800" rx="3" opacity="0.7"/>

    <!-- Trinity icons -->
    <circle cx="340" cy="230" r="15" fill="#e74c3c"/>
    <text x="340" y="235" text-anchor="middle" font-size="10" fill="white">C1</text>

    <circle cx="400" cy="230" r="15" fill="#3498db"/>
    <text x="400" y="235" text-anchor="middle" font-size="10" fill="white">C2</text>

    <circle cx="460" cy="230" r="15" fill="#9b59b6"/>
    <text x="460" y="235" text-anchor="middle" font-size="10" fill="white">C3</text>

    <text x="400" y="280" text-anchor="middle" font-size="12" fill="#ff8800">AI-ASSISTED</text>
    <text x="400" y="320" text-anchor="middle" font-size="14" fill="#ff8800" font-weight="bold">BUILDER OS</text>
    <text x="400" y="350" text-anchor="middle" font-size="10" fill="#666">Patterns emerging...</text>
  </g>

  <!-- AFTER Section -->
  <g>
    <rect x="550" y="50" width="230" height="320" fill="#0a2a0a" rx="10"/>
    <text x="665" y="80" text-anchor="middle" font-size="16" fill="#2ecc71" font-family="Arial" font-weight="bold">AFTER</text>

    <!-- Clean architecture -->
    <rect x="590" y="110" width="150" height="25" fill="#2ecc71" rx="5"/>
    <rect x="600" y="145" width="130" height="20" fill="#2ecc71" rx="3" opacity="0.8"/>
    <rect x="610" y="175" width="110" height="15" fill="#2ecc71" rx="3" opacity="0.6"/>

    <!-- Rockets -->
    <text x="600" y="230" font-size="24">🚀</text>
    <text x="660" y="220" font-size="20">🚀</text>
    <text x="720" y="235" font-size="18">🚀</text>

    <text x="665" y="280" text-anchor="middle" font-size="12" fill="#2ecc71">SHIPPING DAILY</text>
    <text x="665" y="320" text-anchor="middle" font-size="18" fill="gold" font-weight="bold">100x PRODUCTIVE</text>
    <text x="665" y="350" text-anchor="middle" font-size="10" fill="#2ecc71">Clean. Fast. Powerful.</text>
  </g>

  <!-- Connecting Arrows -->
  <line x1="250" y1="210" x2="285" y2="210" stroke="white" stroke-width="2" marker-end="url(#warrow)"/>
  <line x1="515" y1="210" x2="550" y2="210" stroke="white" stroke-width="2" marker-end="url(#warrow)"/>

  <defs>
    <marker id="warrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="white"/>
    </marker>
  </defs>
</svg>