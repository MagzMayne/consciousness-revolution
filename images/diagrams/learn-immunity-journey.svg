<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0a0a1a" />

  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="20" fill="#f1c40f" text-anchor="middle" font-weight="bold">LEARN - Pattern Theory Training</text>

  <!-- Stage Labels -->
  <text x="133" y="70" font-family="Arial" font-size="12" fill="#e74c3c" text-anchor="middle">VULNERABLE</text>
  <text x="400" y="70" font-family="Arial" font-size="12" fill="#f1c40f" text-anchor="middle">TRAINING</text>
  <text x="667" y="70" font-family="Arial" font-size="12" fill="#2ecc71" text-anchor="middle">IMMUNE</text>

  <!-- Stage 1 - Vulnerable -->
  <g>
    <circle cx="133" cy="200" r="45" fill="#e74c3c" />
    <text x="133" y="100" fill="white" font-size="14" text-anchor="middle" font-weight="bold">0% IMMUNITY</text>

    <!-- Manipulation Arrows hitting -->
    <line x1="30" y1="120" x2="100" y2="175" stroke="#e74c3c" stroke-width="3" marker-end="url(#redarrow)" />
    <text x="20" y="110" fill="#e74c3c" font-size="9">LIES</text>

    <line x1="30" y1="280" x2="100" y2="225" stroke="#e74c3c" stroke-width="3" marker-end="url(#redarrow)" />
    <text x="5" y="290" fill="#e74c3c" font-size="9">GASLIGHTING</text>

    <line x1="236" y1="120" x2="166" y2="175" stroke="#e74c3c" stroke-width="3" marker-end="url(#redarrow)" />
    <text x="200" y="110" fill="#e74c3c" font-size="9">BLACKMAIL</text>

    <text x="133" y="320" fill="#888" font-size="11" text-anchor="middle">Defenseless against manipulation</text>
  </g>

  <!-- Stage 2 - Training -->
  <g>
    <circle cx="400" cy="200" r="45" fill="#f1c40f" />

    <!-- Brain with gears -->
    <circle cx="400" cy="130" r="25" fill="none" stroke="#f1c40f" stroke-width="2"/>
    <circle cx="390" cy="125" r="8" fill="#f1c40f"/>
    <circle cx="410" cy="135" r="8" fill="#f1c40f"/>

    <!-- Tool labels -->
    <rect x="340" y="260" width="50" height="25" fill="#333" rx="5"/>
    <text x="365" y="277" fill="#f1c40f" font-size="10" text-anchor="middle">DETECT</text>

    <rect x="400" y="260" width="50" height="25" fill="#333" rx="5"/>
    <text x="425" y="277" fill="#f1c40f" font-size="10" text-anchor="middle">ANALYZE</text>

    <rect x="340" y="295" width="110" height="25" fill="#333" rx="5"/>
    <text x="395" y="312" fill="#f1c40f" font-size="10" text-anchor="middle">RESPOND</text>

    <text x="400" y="355" fill="#888" font-size="11" text-anchor="middle">Learning the patterns</text>
  </g>

  <!-- Stage 3 - Immune -->
  <g>
    <circle cx="667" cy="200" r="45" fill="#2ecc71" />

    <!-- Shield -->
    <path d="M667,140 L710,160 L710,220 L667,250 L624,220 L624,160 Z" fill="none" stroke="#2ecc71" stroke-width="3"/>

    <text x="667" y="100" fill="#2ecc71" font-size="16" text-anchor="middle" font-weight="bold">92.2% IMMUNITY</text>

    <!-- Deflecting Arrows -->
    <line x1="570" y1="140" x2="620" y2="180" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="764" y1="140" x2="714" y2="180" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="570" y1="260" x2="620" y2="220" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>

    <text x="667" y="320" fill="#2ecc71" font-size="11" text-anchor="middle">Manipulation bounces off</text>
  </g>

  <!-- Connecting Arrows -->
  <line x1="190" y1="200" x2="340" y2="200" stroke="white" stroke-width="2" marker-end="url(#whitearrow)"/>
  <line x1="460" y1="200" x2="610" y2="200" stroke="white" stroke-width="2" marker-end="url(#whitearrow)"/>

  <defs>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e74c3c"/>
    </marker>
    <marker id="whitearrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="white"/>
    </marker>
  </defs>
</svg>