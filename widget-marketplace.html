<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Marketplace | Consciousness Revolution</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a12 0%, #0f1520 50%, #0a0a12 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(0,255,200,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00ffc8, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ffc8;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: #888;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0,255,200,0.15);
            border-color: #00ffc8;
            color: #00ffc8;
        }

        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .widget-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .widget-card:hover {
            border-color: rgba(0,255,200,0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,255,200,0.1);
        }

        .widget-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .widget-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
        }

        .widget-category {
            font-size: 0.8em;
            padding: 4px 10px;
            background: rgba(0,255,200,0.15);
            color: #00ffc8;
            border-radius: 10px;
        }

        .widget-preview {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            min-height: 150px;
            position: relative;
        }

        .widget-preview-label {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.7em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .widget-actions {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
        }

        .btn-install {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #00ffc8, #00aaff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-install:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0,255,200,0.3);
        }

        .btn-preview {
            padding: 12px 20px;
            background: rgba(0,170,255,0.15);
            border: 1px solid rgba(0,170,255,0.4);
            border-radius: 8px;
            color: #00aaff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-preview:hover {
            background: rgba(0,170,255,0.25);
            border-color: #00aaff;
        }

        /* Preview Modal */
        .preview-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .preview-modal-overlay.active {
            display: flex;
        }

        .preview-modal {
            background: #0d0d15;
            border: 2px solid rgba(0,255,200,0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,255,200,0.2);
        }

        .preview-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,255,200,0.1);
            border-bottom: 1px solid rgba(0,255,200,0.2);
        }

        .preview-modal-header h2 {
            color: #00ffc8;
            font-size: 1.2em;
        }

        .preview-modal-close {
            width: 36px;
            height: 36px;
            background: rgba(255,100,100,0.2);
            border: none;
            border-radius: 8px;
            color: #ff6464;
            font-size: 1.5em;
            cursor: pointer;
        }

        .preview-modal-body {
            padding: 0;
            height: 70vh;
        }

        .preview-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,255,200,0.2);
            border-top-color: #00ffc8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Code Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a24;
            border: 1px solid rgba(0,255,200,0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header h2 {
            color: #00ffc8;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: rgba(255,100,100,0.2);
            border: none;
            border-radius: 8px;
            color: #ff6464;
            font-size: 1.5em;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .code-section {
            margin-bottom: 20px;
        }

        .code-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-copy {
            padding: 4px 10px;
            background: rgba(0,255,200,0.15);
            border: none;
            border-radius: 4px;
            color: #00ffc8;
            font-size: 0.8em;
            cursor: pointer;
        }

        .code-block {
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            color: #00ffc8;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: rgba(0,255,200,0.2);
            border: 1px solid #00ffc8;
            border-radius: 10px;
            color: #00ffc8;
            font-weight: bold;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #00ffc8;
        }

        @media (max-width: 600px) {
            .widgets-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
            .stats-bar {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Home</a>

    <div class="header">
        <h1>🧩 Widget Marketplace</h1>
        <p>Drag-and-drop components for your dashboard</p>
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="widget-count">-</div>
                <div class="stat-label">Widgets</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="category-count">-</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>
    </div>

    <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-category="all">All Widgets</button>
    </div>

    <div id="widgets-container">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading widgets...</p>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal-overlay" id="preview-modal">
        <div class="preview-modal">
            <div class="preview-modal-header">
                <h2 id="preview-modal-title">Widget Preview</h2>
                <button class="preview-modal-close" onclick="closePreviewModal()">×</button>
            </div>
            <div class="preview-modal-body" id="preview-modal-body">
                <!-- Large preview iframe will be inserted here -->
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        let allWidgets = [];
        let currentWidgetCode = {};

        // Fetch widgets from API
        async function loadWidgets() {
            try {
                const response = await fetch('/.netlify/functions/widget-marketplace');
                const data = await response.json();

                if (data.success && data.widgets) {
                    allWidgets = data.widgets;
                    document.getElementById('widget-count').textContent = data.count;

                    // Get unique categories
                    const categories = [...new Set(allWidgets.map(w => w.category))];
                    document.getElementById('category-count').textContent = categories.length;

                    // Build filter buttons
                    buildFilters(categories);

                    // Load code and render widgets
                    await loadAllWidgetCode();
                    renderWidgets(allWidgets);
                }
            } catch (e) {
                console.error('Failed to load widgets:', e);
                document.getElementById('widgets-container').innerHTML =
                    '<div class="loading"><p style="color:#ff6464">Failed to load widgets</p></div>';
            }
        }

        // Load code for all widgets
        async function loadAllWidgetCode() {
            const promises = allWidgets.map(async (widget) => {
                try {
                    const response = await fetch('/.netlify/functions/widget-marketplace', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'getCode', widgetId: widget.id })
                    });
                    const data = await response.json();
                    if (data.success) {
                        widget.html = data.html;
                        widget.css = data.css;
                        widget.js = data.js;
                    }
                } catch (e) {
                    console.error(`Failed to load code for ${widget.id}:`, e);
                }
            });
            await Promise.all(promises);
        }

        // Build filter buttons
        function buildFilters(categories) {
            const filterBar = document.getElementById('filter-bar');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = cat;
                btn.textContent = formatCategory(cat);
                btn.onclick = () => filterWidgets(cat);
                filterBar.appendChild(btn);
            });
        }

        function formatCategory(cat) {
            return cat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function filterWidgets(category) {
            // Update active filter
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });

            if (category === 'all') {
                renderWidgets(allWidgets);
            } else {
                renderWidgets(allWidgets.filter(w => w.category === category));
            }
        }

        // Render widgets with live preview
        function renderWidgets(widgets) {
            const container = document.getElementById('widgets-container');

            if (widgets.length === 0) {
                container.innerHTML = '<div class="loading"><p>No widgets found</p></div>';
                return;
            }

            container.innerHTML = `<div class="widgets-grid">${widgets.map(w => `
                <div class="widget-card" data-widget="${w.id}">
                    <div class="widget-card-header">
                        <span class="widget-name">${w.name}</span>
                        <span class="widget-category">${formatCategory(w.category)}</span>
                    </div>
                    <div class="widget-preview" id="preview-${w.id}">
                        <span class="widget-preview-label">Live Preview</span>
                    </div>
                    <div class="widget-actions">
                        <button class="btn-install" onclick="installWidget('${w.id}')">
                            Install Widget
                        </button>
                        <button class="btn-preview" onclick="showPreview('${w.id}')">
                            👁️ View Preview
                        </button>
                    </div>
                </div>
            `).join('')}</div>`;

            // Render live previews
            widgets.forEach(w => {
                if (w.html && w.css) {
                    renderPreview(w);
                }
            });
        }

        // Render live preview using srcdoc (CSP-friendly)
        function renderPreview(widget) {
            const previewEl = document.getElementById(`preview-${widget.id}`);
            if (!previewEl) return;

            // Build HTML content
            const htmlContent = `<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d15;
    color: #fff;
    padding: 12px;
    overflow: hidden;
}
${widget.css}
</style>
</head>
<body>
${widget.html}
</body>
</html>`;

            // Create iframe with srcdoc
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'width:100%;height:130px;border:none;border-radius:8px;background:#0d0d15;';
            iframe.srcdoc = htmlContent;

            previewEl.innerHTML = '<span class="widget-preview-label">Live Preview</span>';
            previewEl.appendChild(iframe);
        }

        // Show fullscreen preview modal
        function showPreview(widgetId) {
            const widget = allWidgets.find(w => w.id === widgetId);
            if (!widget) return;

            // Build full HTML content for preview
            const htmlContent = `<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0a0a12 0%, #0f1520 50%, #0a0a12 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}
.widget-container {
    width: 100%;
    max-width: 600px;
}
${widget.css}
</style>
</head>
<body>
<div class="widget-container">
${widget.html}
</div>
<script>${widget.js || ''}<\/script>
</body>
</html>`;

            // Update modal title
            document.getElementById('preview-modal-title').textContent = widget.name + ' - Live Preview';

            // Create iframe with full preview
            const modalBody = document.getElementById('preview-modal-body');
            modalBody.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.srcdoc = htmlContent;
            modalBody.appendChild(iframe);

            // Show modal
            document.getElementById('preview-modal').classList.add('active');
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').classList.remove('active');
            document.getElementById('preview-modal-body').innerHTML = '';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function installWidget(widgetId) {
            // Store widget in localStorage as "installed"
            let installed = JSON.parse(localStorage.getItem('installed_widgets') || '[]');
            if (!installed.includes(widgetId)) {
                installed.push(widgetId);
                localStorage.setItem('installed_widgets', JSON.stringify(installed));
            }
            showToast('Widget installed! Add it to your dashboard.');
        }

        // Close preview modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreviewModal();
        });

        // Click outside modal to close
        document.getElementById('preview-modal').addEventListener('click', (e) => {
            if (e.target.classList.contains('preview-modal-overlay')) closePreviewModal();
        });

        // Init
        loadWidgets();
    </script>
</body>
</html>
