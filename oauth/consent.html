<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Authorize a third-party application to access your Consciousness Revolution account">
    <title>Authorize Application – Consciousness Revolution</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            padding: 1rem;
        }

        .consent-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid rgba(123, 44, 191, 0.35);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 1.4rem;
            background: linear-gradient(90deg, #7b2cbf, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: #888;
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(123, 44, 191, 0.2);
            margin: 1.25rem 0;
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(123, 44, 191, 0.08);
            border: 1px solid rgba(123, 44, 191, 0.2);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1.25rem;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7b2cbf, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .app-details h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .app-details p {
            font-size: 0.78rem;
            color: #888;
            word-break: break-all;
        }

        .prompt-text {
            font-size: 0.92rem;
            color: #b0b0c8;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .prompt-text strong { color: #fff; }

        .scopes-list {
            list-style: none;
            margin-bottom: 1.25rem;
        }

        .scopes-list li {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.45rem 0;
            font-size: 0.86rem;
            color: #c0c0d8;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .scopes-list li:last-child { border-bottom: none; }

        .scope-icon {
            flex-shrink: 0;
            margin-top: 1px;
            color: #7b2cbf;
        }

        .warning-box {
            background: rgba(255, 190, 0, 0.07);
            border: 1px solid rgba(255, 190, 0, 0.25);
            border-radius: 10px;
            padding: 0.75rem 0.9rem;
            font-size: 0.8rem;
            color: #d4b86a;
            margin-bottom: 1.5rem;
            line-height: 1.45;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:focus-visible {
            outline: 2px solid #7b2cbf;
            outline-offset: 2px;
        }

        .btn-deny {
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-deny:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .btn-approve {
            background: linear-gradient(135deg, #7b2cbf, #5a0fa0);
            color: #fff;
        }

        .btn-approve:hover { background: linear-gradient(135deg, #9b3fdf, #7b2cbf); }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg {
            text-align: center;
            font-size: 0.84rem;
            color: #888;
            margin-top: 1rem;
            min-height: 1.2em;
        }

        .status-msg.error { color: #e06060; }
        .status-msg.loading { color: #7b2cbf; }

        /* Spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(123, 44, 191, 0.3);
            border-top-color: #7b2cbf;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        /* Login-required state */
        .login-required {
            text-align: center;
            padding: 1rem 0;
        }

        .login-required p {
            color: #b0b0c8;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .btn-login {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #7b2cbf, #5a0fa0);
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-login:hover { background: linear-gradient(135deg, #9b3fdf, #7b2cbf); }

        @media (max-width: 480px) {
            .consent-card { padding: 1.75rem 1.25rem; }
            .actions { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>
    <div class="consent-card" role="main">
        <div class="logo">
            <h1>Consciousness Revolution</h1>
            <p>Identity &amp; Access</p>
        </div>

        <hr class="divider">

        <!-- Loaded dynamically -->
        <div id="consent-body">
            <p class="status-msg loading">
                <span class="spinner" aria-hidden="true"></span>
                Loading authorization request…
            </p>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* ── helpers ─────────────────────────────────────── */
        const $ = id => document.getElementById(id);
        const body = $('consent-body');

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = String(str || '');
            return d.innerHTML;
        }

        function setStatus(msg, cls = '') {
            const el = document.querySelector('.status-msg');
            if (el) { el.textContent = msg; el.className = 'status-msg ' + cls; }
        }

        /* ── parse URL params ────────────────────────────── */
        const params = new URLSearchParams(window.location.search);
        const clientId     = params.get('client_id')     || '';
        const redirectUri  = params.get('redirect_uri')  || '';
        const responseType = params.get('response_type') || 'code';
        const scope        = params.get('scope')         || 'openid profile email';
        const state        = params.get('state')         || '';
        const codeChallenge       = params.get('code_challenge')        || '';
        const codeChallengeMethod = params.get('code_challenge_method') || '';

        /* ── scope label map ─────────────────────────────── */
        const SCOPE_LABELS = {
            openid:  { icon: '🔐', label: 'Verify your identity' },
            profile: { icon: '👤', label: 'Read your public profile (name, avatar)' },
            email:   { icon: '📧', label: 'Read your email address' },
            offline_access: { icon: '🔄', label: 'Stay signed in (refresh token)' }
        };

        function renderScopes(scopeStr) {
            const scopes = scopeStr.split(/[\s,]+/).filter(Boolean);
            return scopes.map(s => {
                const info = SCOPE_LABELS[s] || { icon: '✔', label: s };
                return `<li>
                    <span class="scope-icon" aria-hidden="true">${esc(info.icon)}</span>
                    <span>${esc(info.label)}</span>
                </li>`;
            }).join('');
        }

        /* ── deny flow ───────────────────────────────────── */
        function denyAccess() {
            if (!redirectUri) { window.location.href = '/'; return; }
            try {
                const url = new URL(redirectUri);
                url.searchParams.set('error', 'access_denied');
                url.searchParams.set('error_description', 'The user denied the authorization request.');
                if (state) url.searchParams.set('state', state);
                window.location.href = url.toString();
            } catch (_) {
                window.location.href = '/';
            }
        }

        /* ── approve flow ────────────────────────────────── */
        async function approveAccess() {
            const approveBtn = document.querySelector('.btn-approve');
            const denyBtn    = document.querySelector('.btn-deny');
            if (approveBtn) approveBtn.disabled = true;
            if (denyBtn)    denyBtn.disabled    = true;
            setStatus('Completing authorization…', 'loading');

            try {
                // Build the Supabase OAuth authorize URL to complete the flow.
                // Supabase's OAuth server reads the project URL from env – we
                // fetch it from our secure relay so we never hardcode it.
                const cfgRes = await fetch('/api/supabase-config');
                if (!cfgRes.ok) throw new Error('Could not load Supabase config');
                const cfg = await cfgRes.json();
                if (!cfg.auth || !cfg.url) throw new Error('Supabase not configured');

                // Build the authorization URL back to Supabase's OAuth server.
                // Supabase will validate the consent and redirect to the client.
                const authorizeUrl = new URL(`${cfg.url}/auth/v1/oauth/authorize`);
                authorizeUrl.searchParams.set('client_id',     clientId);
                authorizeUrl.searchParams.set('redirect_uri',  redirectUri);
                authorizeUrl.searchParams.set('response_type', responseType);
                authorizeUrl.searchParams.set('scope',         scope);
                if (state)               authorizeUrl.searchParams.set('state',                  state);
                if (codeChallenge)       authorizeUrl.searchParams.set('code_challenge',         codeChallenge);
                if (codeChallengeMethod) authorizeUrl.searchParams.set('code_challenge_method',  codeChallengeMethod);
                // Signal that the user has given consent on this page
                authorizeUrl.searchParams.set('consent', 'true');

                window.location.href = authorizeUrl.toString();
            } catch (err) {
                console.error('[OAuth Consent] Approve error:', err);
                setStatus('Authorization failed: ' + err.message, 'error');
                if (approveBtn) approveBtn.disabled = false;
                if (denyBtn)    denyBtn.disabled    = false;
            }
        }

        /* ── render consent UI ───────────────────────────── */
        function renderConsent(appName, appUri) {
            const displayName = appName || clientId || 'Unknown Application';
            const displayUri  = appUri  || redirectUri;

            body.innerHTML = `
                <div class="app-info">
                    <div class="app-icon" aria-hidden="true">🔗</div>
                    <div class="app-details">
                        <h2>${esc(displayName)}</h2>
                        <p>${esc(displayUri)}</p>
                    </div>
                </div>

                <p class="prompt-text">
                    <strong>${esc(displayName)}</strong> is requesting access to your
                    <strong>Consciousness Revolution</strong> account.
                </p>

                <ul class="scopes-list" aria-label="Requested permissions">
                    ${renderScopes(scope)}
                </ul>

                <div class="warning-box" role="note">
                    ⚠ Only authorize applications you trust. You can revoke access
                    from your account settings at any time.
                </div>

                <div class="actions">
                    <button class="btn btn-deny"    type="button" id="btn-deny">Deny</button>
                    <button class="btn btn-approve" type="button" id="btn-approve">Authorize</button>
                </div>

                <p class="status-msg" aria-live="polite"></p>
            `;

            document.getElementById('btn-deny').addEventListener('click', denyAccess);
            document.getElementById('btn-approve').addEventListener('click', approveAccess);
        }

        /* ── show login-required state ───────────────────── */
        function renderLoginRequired() {
            const returnUrl = encodeURIComponent(window.location.href);
            body.innerHTML = `
                <div class="login-required">
                    <p>You must be signed in to authorize this application.</p>
                    <a class="btn-login" href="/auth.html?return=${returnUrl}">
                        Sign in to continue
                    </a>
                </div>
            `;
        }

        /* ── validate params & check auth ────────────────── */
        async function init() {
            if (!clientId) {
                body.innerHTML = `<p class="status-msg error">Invalid authorization request: missing client_id.</p>`;
                return;
            }
            if (!redirectUri) {
                body.innerHTML = `<p class="status-msg error">Invalid authorization request: missing redirect_uri.</p>`;
                return;
            }

            // Check if the user is already authenticated via the /api/auth-me endpoint.
            let isAuthenticated = false;
            try {
                const meRes = await fetch('/api/auth-me', { credentials: 'include' });
                if (meRes.ok) {
                    const me = await meRes.json();
                    isAuthenticated = me.success === true;
                }
            } catch (_) {
                // Network error – treat as unauthenticated; user can still sign in.
            }

            if (!isAuthenticated) {
                renderLoginRequired();
                return;
            }

            // Try to look up the OAuth client metadata from our server-side relay.
            // On failure we degrade gracefully and still render the consent UI.
            let appName = '';
            let appUri  = '';
            try {
                const regRes = await fetch(
                    `/api/oauth-server?action=client&client_id=${encodeURIComponent(clientId)}`
                );
                if (regRes.ok) {
                    const reg = await regRes.json();
                    appName = reg.client_name || '';
                    appUri  = reg.client_uri  || '';
                }
            } catch (_) { /* degrade gracefully */ }

            renderConsent(appName, appUri);
        }

        init();
    })();
    </script>
</body>
</html>
