<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Messenger | Commander ↔ Teddy</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a2e;
            --accent: #00f5d4;
            --accent-alt: #7b2cbf;
            --text: #e0e0e0;
            --text-dim: #888;
            --success: #00ff88;
            --warning: #ffd60a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-card), #16213e);
            border-radius: 15px;
            border: 1px solid var(--accent);
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--accent), var(--accent-alt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .identity-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .identity-btn {
            padding: 12px 30px;
            border: 2px solid var(--text-dim);
            background: transparent;
            color: var(--text);
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .identity-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .identity-btn.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            font-weight: bold;
        }

        .messages-container {
            background: var(--bg-card);
            border-radius: 15px;
            border: 1px solid #333;
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            background: linear-gradient(135deg, var(--accent), #00c4a7);
            color: var(--bg-dark);
            margin-left: auto;
            text-align: right;
        }

        .message.received {
            background: #2d2d44;
            color: var(--text);
        }

        .message-header {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #333;
            background: var(--bg-card);
            color: var(--text);
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: var(--accent);
        }

        #sendBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--accent), #00c4a7);
            border: none;
            border-radius: 25px;
            color: var(--bg-dark);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,245,212,0.4);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--bg-card);
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.disconnected {
            background: #ff4444;
            animation: none;
        }

        .no-messages {
            text-align: center;
            color: var(--text-dim);
            padding: 50px;
        }

        .no-messages .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Embed mode - smaller for embedding in other dashboards */
        .embed-mode .container { max-width: 100%; padding: 10px; }
        .embed-mode header { padding: 10px; margin-bottom: 15px; }
        .embed-mode h1 { font-size: 1.2rem; }
        .embed-mode .messages-container { height: 250px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard Messenger</h1>
            <p>Real-time communication between nodes</p>
            <div class="identity-selector">
                <button class="identity-btn" data-identity="COMMANDER" onclick="setIdentity('COMMANDER')">Commander</button>
                <button class="identity-btn" data-identity="TEDDY" onclick="setIdentity('TEDDY')">Teddy</button>
            </div>
        </header>

        <div class="messages-container" id="messagesContainer">
            <div class="no-messages" id="noMessages">
                <div class="icon">💬</div>
                <p>Select your identity above to start messaging</p>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <span id="messageCount">0 messages</span>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://lgibygzcbvrrykfaxvbg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnaWJ5Z3pjYnZycnlrZmF4dmJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYxMjA4MTcsImV4cCI6MjA1MTY5NjgxN30.oqGWL5_Xt-7hV_RsmKLJX_QNI6ynWcXpGMedlM7SDXE';

        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State
        let currentIdentity = null;
        let messages = [];
        let subscription = null;

        // Generate UUID v4
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Set user identity
        function setIdentity(identity) {
            currentIdentity = identity;

            // Update UI
            document.querySelectorAll('.identity-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.identity === identity);
            });

            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('noMessages').innerHTML = `
                <div class="icon">💬</div>
                <p>You are ${identity}. Send a message to start!</p>
            `;

            // Load existing messages and subscribe to new ones
            loadMessages();
            subscribeToMessages();
        }

        // Load existing messages
        async function loadMessages() {
            try {
                const { data, error } = await supabase
                    .from('atoms')
                    .select('*')
                    .eq('type', 'dashboard_message')
                    .order('created', { ascending: true })
                    .limit(100);

                if (error) {
                    console.error('Error loading messages:', error);
                    updateStatus(false, 'Error loading messages');
                    return;
                }

                messages = data || [];
                renderMessages();
                updateStatus(true, 'Connected');
            } catch (err) {
                console.error('Load error:', err);
                updateStatus(false, 'Connection failed');
            }
        }

        // Subscribe to real-time updates
        function subscribeToMessages() {
            if (subscription) {
                subscription.unsubscribe();
            }

            subscription = supabase
                .channel('dashboard_messages')
                .on('postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'atoms',
                        filter: 'type=eq.dashboard_message'
                    },
                    (payload) => {
                        console.log('New message:', payload);
                        messages.push(payload.new);
                        renderMessages();
                    }
                )
                .subscribe((status) => {
                    console.log('Subscription status:', status);
                    if (status === 'SUBSCRIBED') {
                        updateStatus(true, 'Live connected');
                    }
                });
        }

        // Render messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="no-messages">
                        <div class="icon">💬</div>
                        <p>No messages yet. Say hello!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const content = msg.content || '';
                const parts = content.split('|');
                const sender = parts[0] || 'Unknown';
                const recipient = parts[1] || 'Unknown';
                const text = parts.slice(2).join('|') || content;
                const isSent = sender === currentIdentity;
                const time = new Date(msg.created).toLocaleTimeString();

                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div class="message-header">
                            ${sender} → ${recipient} • ${time}
                        </div>
                        <div class="message-content">${escapeHtml(text)}</div>
                    </div>
                `;
            }).join('');

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;

            // Update count
            document.getElementById('messageCount').textContent = `${messages.length} messages`;
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentIdentity) return;

            const recipient = currentIdentity === 'COMMANDER' ? 'TEDDY' : 'COMMANDER';
            const messageContent = `${currentIdentity}|${recipient}|${text}`;

            // Disable button while sending
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const { data, error } = await supabase
                    .from('atoms')
                    .insert([{
                        id: generateUUID(),
                        type: 'dashboard_message',
                        content: messageContent,
                        domain: '3_CONNECT',
                        confidence: 1.0,
                        processed: 0,
                        created: new Date().toISOString()
                    }])
                    .select();

                if (error) {
                    console.error('Send error:', error);
                    alert('Failed to send message: ' + error.message);
                } else {
                    input.value = '';
                    // Message will appear via subscription
                }
            } catch (err) {
                console.error('Send error:', err);
                alert('Failed to send message');
            }

            btn.disabled = false;
            btn.textContent = 'Send';
            input.focus();
        }

        // Update connection status
        function updateStatus(connected, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            dot.classList.toggle('disconnected', !connected);
            statusText.textContent = text;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Check for embed mode
        if (window.location.search.includes('embed=true')) {
            document.body.classList.add('embed-mode');
        }

        // Auto-select identity from URL
        const urlParams = new URLSearchParams(window.location.search);
        const identity = urlParams.get('identity');
        if (identity === 'COMMANDER' || identity === 'TEDDY') {
            setIdentity(identity);
        }

        // Initial status
        updateStatus(false, 'Select identity to connect');
    </script>
</body>
</html>
