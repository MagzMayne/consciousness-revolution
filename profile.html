    <title>User Profile - Gem Bot Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 70px 0 0 0;
            background: linear-gradient(135deg, #1a2a6c, #069901, #0313f5);
            background-size: 600% 600%;
            animation: gradient 15s ease infinite;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        @keyframes gradient {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .profile-container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            max-width: 95%;
            margin-top: 40px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }
        .profile-row {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }
        input[type="number"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #2196f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0d8aee;
        }
        .phantom-btn {
            background-color: #8a2be2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phantom-btn img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
        .transaction-log {
            max-height: 120px;
            overflow: auto;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 5px;
            text-align: left;
        }
        .back-home {
            position: absolute;
            top: 90px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            z-index: 100;
        }
        .back-home:before {
            content: '←';
            margin-right: 5px;
            font-size: 20px;
        }
    </style>

  <!-- Update Notification System Meta Information -->
  <meta name="git-commit-hash" content="30bafb2">

  <!-- Update Notification System -->
  <script src="js/update-notification-system.js"></script>
  <script src="js/update-helper.js"></script>
    <link rel="stylesheet" href="/css/universal-styles.css">
</head>
<body>
    <a href="index.html" class="back-home">Back to Home</a>
    <div class="profile-container" id="profile-section">
        <h1>User Profile</h1>
        <div class="profile-row"><label>Display Name:</label> <span id="profile-display-name"></span></div>
        <div class="profile-row"><label>Email:</label> <span id="profile-email"></span></div>
        <div class="profile-row"><label>Wallet Address:</label> <span id="profile-wallet-address"></span><button id="connect-wallet-btn" style="display:none;margin-top:8px;width:auto;">Connect Wallet</button></div>
        <div class="profile-row"><label>Wallet MGC Balance:</label> <span id="profile-wallet-mgc">-</span></div>
        <div class="profile-row"><label>In-Game MGC Balance:</label> <span id="profile-ingame-mgc">-</span></div>
        <div class="profile-row">
            <label for="profile-deposit-amount">Deposit MGC to In-Game</label>
            <input type="number" id="profile-deposit-amount" min="1" placeholder="Amount to deposit">
            <button type="button" id="profile-deposit-btn">Deposit</button>
        </div>
        <div class="profile-row">
            <label for="profile-withdraw-amount">Withdraw MGC to Wallet</label>
            <input type="number" id="profile-withdraw-amount" min="1" placeholder="Amount to withdraw">
            <button type="button" id="profile-withdraw-btn">Request Withdraw</button>
        </div>
        <div class="profile-row">
            <label>Transaction Log:</label>
            <ul id="profile-transaction-log" class="transaction-log"></ul>
        </div>
        <div class="profile-row">
            <label>Travel & Leaderboard Stats:</label>
            <div id="leaderboard-stats">
                <div>Total Distance: <span id="stat-distance">0</span> meters</div>
                <div>Uptime: <span id="stat-uptime">0</span> seconds</div>
                <div>Last Sync: <span id="stat-last-sync">-</span></div>
                <div>Recent Locations:</div>
                <ul id="stat-travel-log" style="max-height:60px;overflow:auto;font-size:12px;"></ul>
            </div>
        </div>
    </div>
    <!-- Solana web3.js and SPL Token for blockchain functionality -->
    <script src="https://unpkg.com/@solana/web3.js@1.95.2/lib/index.iife.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@0.3.10/lib/index.iife.js"></script>
    <!-- Include auth.js for wallet and MGC logic -->
    <script src="./src/auth.js"></script>
    <script src="./profile.js"></script>
    <script src="/js/universal-utilities.js"></script>

    <!-- Universal Navigation - Added by Project Fixer -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof BarbrickUniversal !== 'undefined') {
                // Only add navigation if not already present
                if (!document.querySelector('.universal-header')) {
                    BarbrickUniversal.createBackButton();
                }
                
                // Add footer if not present
                if (!document.querySelector('.universal-footer')) {
                    BarbrickUniversal.createFooter();
                }
            }
        });
    </script>
</body>
