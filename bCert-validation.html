<body>
  <h1>✓ Barbrick's Certification Academy - Feature Validation</h1>
  <p>This page validates the key features implemented in bCert.html</p>

  <div class="test-section">
    <h2>✓ Core Structure Tests</h2>
    <div id="structure-tests"></div>
    <button onclick="testStructure()">Run Structure Tests</button>
  </div>

  <div class="test-section">
    <h2>✓ Section Navigation Tests</h2>
    <div id="navigation-tests"></div>
    <button onclick="testNavigation()">Run Navigation Tests</button>
  </div>

  <div class="test-section">
    <h2>✓ AI Proctor Tests</h2>
    <div id="proctor-tests"></div>
    <button onclick="testProctor()">Run Proctor Tests</button>
  </div>

  <div class="test-section">
    <h2>✓ Projects Integration Tests</h2>
    <div id="projects-tests"></div>
    <button onclick="testProjects()">Run Projects Tests</button>
  </div>

  <div class="test-section">
    <h2>✓ Payment Integration Tests</h2>
    <div id="payment-tests"></div>
    <button onclick="testPayments()">Run Payment Tests</button>
  </div>

  <script>
    function showResult(containerId, testName, passed, details = '') {
      const container = document.getElementById(containerId);
      const resultDiv = document.createElement('div');
      resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
      resultDiv.innerHTML = `<strong>${passed ? '✓ PASS' : '✗ FAIL'}</strong>: ${testName}${details ? '<br><small>' + details + '</small>' : ''}`;
      container.appendChild(resultDiv);
    }

    function testStructure() {
      const container = document.getElementById('structure-tests');
      container.innerHTML = '';

      // Test 1: File exists and can be accessed
      fetch('bCert.html')
        .then(response => {
          showResult('structure-tests', 'File Accessibility', response.ok, 
            `Status: ${response.status}, Size: ${response.headers.get('content-length')} bytes`);
          return response.text();
        })
        .then(html => {
          // Test 2: Contains required sections
          const sections = ['section-home', 'section-courses', 'section-projects', 
                           'section-learning', 'section-proctor', 'section-exams', 
                           'section-dashboard', 'section-payments'];
          sections.forEach(section => {
            showResult('structure-tests', `Section: ${section}`, 
              html.includes(`id="${section}"`), 
              html.includes(`id="${section}"`) ? 'Found in HTML' : 'Missing from HTML');
          });

          // Test 3: Has navigation buttons
          const navButtons = ['nav-home', 'nav-courses', 'nav-projects', 'nav-learning', 
                             'nav-proctor', 'nav-exams', 'nav-dashboard', 'nav-payments'];
          showResult('structure-tests', 'Navigation Buttons', 
            navButtons.every(btn => html.includes(`id="${btn}"`)),
            `Found ${navButtons.filter(btn => html.includes(`id="${btn}"`)).length}/${navButtons.length} buttons`);
        })
        .catch(err => {
          showResult('structure-tests', 'File Accessibility', false, err.message);
        });
    }

    function testNavigation() {
      const container = document.getElementById('navigation-tests');
      container.innerHTML = '';

      fetch('bCert.html')
        .then(response => response.text())
        .then(html => {
          // Test switchNav function exists
          showResult('navigation-tests', 'switchNav Function', 
            html.includes('function switchNav(key)'),
            'Navigation switching function present');

          // Test section toggle logic
          showResult('navigation-tests', 'Section Toggle Logic',
            html.includes('sections[k].classList.toggle'),
            'Dynamic section hiding/showing implemented');

          // Test active state management
          showResult('navigation-tests', 'Active State Management',
            html.includes("classList.toggle('active'"),
            'Button active state tracking present');
        });
    }

    function testProctor() {
      const container = document.getElementById('proctor-tests');
      container.innerHTML = '';

      fetch('bCert.html')
        .then(response => response.text())
        .then(html => {
          // Test AI Proctor section exists
          showResult('proctor-tests', 'AI Proctor Section',
            html.includes('section-proctor'),
            'Section found in HTML');

          // Test askProctor function
          showResult('proctor-tests', 'askProctor Function',
            html.includes('function askProctor()'),
            'Main chat function implemented');

          // Test getProctorResponse function
          showResult('proctor-tests', 'getProctorResponse Function',
            html.includes('function getProctorResponse(question)'),
            'Response generation function present');

          // Test knowledge base
          const knowledgeTopics = ['scrum', 'payment', 'project', 'integrity', 'exam'];
          const hasKB = knowledgeTopics.every(topic => 
            html.includes(`q.includes('${topic}')`)
          );
          showResult('proctor-tests', 'Knowledge Base Coverage',
            hasKB,
            `Covers: ${knowledgeTopics.join(', ')}`);

          // Test chat interface elements
          showResult('proctor-tests', 'Chat Interface Elements',
            html.includes('proctorChat') && html.includes('proctorInput'),
            'Chat container and input field present');

          // Test Enter key support
          showResult('proctor-tests', 'Enter Key Support',
            html.includes("e.key === 'Enter'"),
            'Keyboard interaction enabled');
        });
    }

    function testProjects() {
      const container = document.getElementById('projects-tests');
      container.innerHTML = '';

      fetch('bCert.html')
        .then(response => response.text())
        .then(html => {
          // Test Projects section exists
          showResult('projects-tests', 'Projects Section',
            html.includes('section-projects'),
            'Section found in HTML');

          // Test for specific projects
          const projects = [
            'Budget Boss', 'Gold Toner', 'Book Scanner',  // Beginner
            'BankSky', 'MicroTrader', 'SQL Analyzer',     // Intermediate
            'OASIS', 'MandemOS', 'Classified Contracts'   // Advanced
          ];
          
          projects.forEach(project => {
            showResult('projects-tests', `Project: ${project}`,
              html.includes(project),
              html.includes(project) ? 'Listed in projects section' : 'Not found');
          });

          // Test GitHub links
          showResult('projects-tests', 'GitHub Integration',
            html.includes('github.com/barbrickdesign'),
            'Repository links present');

          // Test live demo links
          showResult('projects-tests', 'Live Demo Links',
            html.includes('barbrickdesign.github.io'),
            'Demo URLs present');

          // Test startProject function
          showResult('projects-tests', 'startProject Function',
            html.includes('function startProject()'),
            'Project initiation function implemented');

          // Test XP tracking
          showResult('projects-tests', 'XP Tracking System',
            html.includes('completedProjects') && html.includes('projectXP'),
            'Progress tracking elements present');
        });
    }

    function testPayments() {
      const container = document.getElementById('payment-tests');
      container.innerHTML = '';

      fetch('bCert.html')
        .then(response => response.text())
        .then(html => {
          // Test PayPal email
          const paypalEmail = 'BarbrickDesign@gmail.com';
          const emailCount = (html.match(new RegExp(paypalEmail, 'g')) || []).length;
          showResult('payment-tests', 'PayPal Email Integration',
            emailCount > 0,
            `Found ${emailCount} references to ${paypalEmail}`);

          // Test pricing tiers
          const tiers = ['$49', '$149', '$399', '$999'];
          tiers.forEach((tier, index) => {
            showResult('payment-tests', `Tier ${index + 1} Pricing`,
              html.includes(tier),
              `${tier} pricing clearly displayed`);
          });

          // Test tier descriptions
          const tierFeatures = ['Self-study', 'AI feedback', 'Professional Bundle', 'Mastery'];
          tierFeatures.forEach((feature, index) => {
            showResult('payment-tests', `Tier ${index + 1} Features`,
              html.toLowerCase().includes(feature.toLowerCase()),
              `${feature} described`);
          });

          // Test simulatePay function
          showResult('payment-tests', 'simulatePay Function',
            html.includes('function simulatePay(tier)'),
            'Payment simulation function present');

          // Test payment note format
          showResult('payment-tests', 'Payment Instructions',
            html.includes('PayPal to') && html.includes('with the note'),
            'Clear payment instructions provided');
        });
    }

    // Auto-run all tests on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        testStructure();
        setTimeout(() => testNavigation(), 500);
        setTimeout(() => testProctor(), 1000);
        setTimeout(() => testProjects(), 1500);
        setTimeout(() => testPayments(), 2000);
      }, 500);
    });
  </script>
