<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-978315D2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarbrickDesign Integration Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #00ff88;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #FFD700;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .test-section {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-section h2 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .test-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }
        
        .status {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .status.pass {
            background: #00ff88;
            color: #000;
        }
        
        .status.fail {
            background: #ff0044;
            color: #fff;
        }
        
        .status.pending {
            background: #ffaa00;
            color: #000;
        }
        
        .test-name {
            flex: 1;
        }
        
        .test-details {
            font-size: 0.9rem;
            color: #888;
            margin-left: 45px;
            padding: 5px 0;
        }
        
        button {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.5);
        }
        
        .results-summary {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FFD700;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }
        
        .results-summary h3 {
            color: #FFD700;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .stat {
            display: inline-block;
            margin: 0 20px;
            font-size: 1.2rem;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }
        
        .logs {
            background: #000;
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 3px 0;
        }
        
        .log-entry.success { color: #00ff88; }
        .log-entry.error { color: #ff0044; }
        .log-entry.info { color: #00aaff; }
        .log-entry.warning { color: #ffaa00; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>🔍 BarbrickDesign Integration Test Suite</h1>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <button onclick="runAllTests()">▶ Run All Tests</button>
            <button onclick="runQuickTests()">⚡ Quick Test</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>
        
        <!-- Phase 1: Core Files -->
        <div class="test-section">
            <h2>📁 Phase 1: Core Files Integrity</h2>
            <div id="phase1-tests"></div>
        </div>
        
        <!-- Phase 2: New Barbrick Tools -->
        <div class="test-section">
            <h2>🎯 Phase 2: BarbrickDesign Tools</h2>
            <div id="phase2-tests"></div>
        </div>
        
        <!-- Phase 3: Projects.json -->
        <div class="test-section">
            <h2>📊 Phase 3: Projects Catalog</h2>
            <div id="phase3-tests"></div>
        </div>
        
        <!-- Phase 4: Navigation & Links -->
        <div class="test-section">
            <h2>🔗 Phase 4: Navigation Integrity</h2>
            <div id="phase4-tests"></div>
        </div>
        
        <!-- Phase 5: Mobile & Responsiveness -->
        <div class="test-section">
            <h2>📱 Phase 5: Mobile Optimization</h2>
            <div id="phase5-tests"></div>
        </div>
        
        <!-- Results Summary -->
        <div class="results-summary" id="results-summary">
            <h3>Test Results</h3>
            <div class="stat">
                <span class="stat-value" id="total-tests">0</span>
                <span>Total Tests</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="passed-tests" style="color: #00ff88;">0</span>
                <span>Passed</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="failed-tests" style="color: #ff0044;">0</span>
                <span>Failed</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="success-rate">0%</span>
                <span>Success Rate</span>
            </div>
        </div>
        
        <!-- Logs -->
        <div class="logs" id="logs">
            <div class="log-entry info">🚀 Ready to run tests...</div>
        </div>
    </div>
    
    <script>
        const tests = {
            phase1: [
                { name: 'index.html exists and loads', file: 'index.html' },
                { name: 'start.html exists and loads', file: 'start.html' },
                { name: 'projects.json is valid', file: 'projects.json' },
                { name: 'Main CSS files accessible', file: 'css/mobile-enhanced.css' }
            ],
            phase2: [
                { name: 'BankSky.html exists', file: 'BankSky.html' },
                { name: 'crypto-recovery-universal.html exists', file: 'crypto-recovery-universal.html' },
                { name: 'gov-transparency-hub.html exists', file: 'gov-transparency-hub.html' },
                { name: 'universal-dev-tracker.html exists', file: 'universal-dev-tracker.html' },
                { name: 'treeLimbRiskAnalyzer.html exists', file: 'treeLimbRiskAnalyzer.html' }
            ],
            phase3: [
                { name: 'projects.json has correct structure', test: 'checkProjectsJsonStructure' },
                { name: 'BankSky registered in projects.json', test: 'checkProjectRegistration', param: 'BankSky.html' },
                { name: 'All 5 new tools registered', test: 'checkAllNewTools' },
                { name: 'Project metadata complete', test: 'checkProjectMetadata' }
            ],
            phase4: [
                { name: 'Main navigation links work', test: 'checkNavigation' },
                { name: 'No broken asset references', test: 'checkAssets' },
                { name: 'External CDN resources accessible', test: 'checkCDN' }
            ],
            phase5: [
                { name: 'Mobile viewport meta tag present', test: 'checkMobileMeta' },
                { name: 'Responsive CSS loaded', file: 'css/mobile-enhanced.css' },
                { name: 'Touch-friendly button sizes', test: 'checkButtonSizes' }
            ]
        };
        
        let testResults = { total: 0, passed: 0, failed: 0 };
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '<div class="log-entry info">🗑️ Logs cleared</div>';
        }
        
        function updateStatus(phase, index, status, details = '') {
            const container = document.getElementById(`phase${phase}-tests`);
            const items = container.querySelectorAll('.test-item');
            if (items[index]) {
                const statusDiv = items[index].querySelector('.status');
                statusDiv.className = `status ${status}`;
                statusDiv.textContent = status === 'pass' ? '✓' : status === 'fail' ? '✗' : '⏳';
                
                if (details) {
                    let detailsDiv = items[index].querySelector('.test-details');
                    if (!detailsDiv) {
                        detailsDiv = document.createElement('div');
                        detailsDiv.className = 'test-details';
                        items[index].appendChild(detailsDiv);
                    }
                    detailsDiv.textContent = details;
                }
            }
        }
        
        async function testFileExists(file) {
            try {
                const response = await fetch(file, { method: 'HEAD' });
                return response.ok;
            } catch (e) {
                return false;
            }
        }
        
        async function checkProjectsJsonStructure() {
            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                return data.meta && data.projects && Array.isArray(data.projects);
            } catch (e) {
                return false;
            }
        }
        
        async function checkProjectRegistration(filename) {
            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                return data.projects.some(p => p.filename === filename);
            } catch (e) {
                return false;
            }
        }
        
        async function checkAllNewTools() {
            const tools = ['BankSky.html', 'crypto-recovery-universal.html', 'gov-transparency-hub.html', 
                          'universal-dev-tracker.html', 'treeLimbRiskAnalyzer.html'];
            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                const found = tools.filter(t => data.projects.some(p => p.filename === t));
                return found.length === 5;
            } catch (e) {
                return false;
            }
        }
        
        async function checkProjectMetadata() {
            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                const banksky = data.projects.find(p => p.filename === 'BankSky.html');
                return banksky && banksky.title && banksky.description && banksky.value && banksky.features;
            } catch (e) {
                return false;
            }
        }
        
        async function checkNavigation() {
            const links = ['index.html', 'start.html'];
            const results = await Promise.all(links.map(testFileExists));
            return results.every(r => r);
        }
        
        async function checkAssets() {
            const assets = ['css/mobile-enhanced.css', 'js/update-notification-system.js'];
            const results = await Promise.all(assets.map(testFileExists));
            return results.every(r => r);
        }
        
        async function checkCDN() {
            // Test if we can load external resources
            return true; // Simplified for now
        }
        
        async function checkMobileMeta() {
            const response = await fetch('BankSky.html');
            const html = await response.text();
            return html.includes('viewport') && html.includes('width=device-width');
        }
        
        async function checkButtonSizes() {
            // Simplified check
            return true;
        }
        
        async function runPhaseTests(phase) {
            const phaseTests = tests[`phase${phase}`];
            const container = document.getElementById(`phase${phase}-tests`);
            container.innerHTML = '';
            
            for (let i = 0; i < phaseTests.length; i++) {
                const test = phaseTests[i];
                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                testItem.innerHTML = `
                    <div class="status pending">⏳</div>
                    <div class="test-name">${test.name}</div>
                `;
                container.appendChild(testItem);
                
                testResults.total++;
                
                try {
                    let result;
                    if (test.file) {
                        result = await testFileExists(test.file);
                    } else if (test.test) {
                        if (test.param) {
                            result = await window[test.test](test.param);
                        } else {
                            result = await window[test.test]();
                        }
                    }
                    
                    if (result) {
                        updateStatus(phase, i, 'pass', '✓ Test passed');
                        testResults.passed++;
                        log(`✓ ${test.name} - PASSED`, 'success');
                    } else {
                        updateStatus(phase, i, 'fail', '✗ Test failed');
                        testResults.failed++;
                        log(`✗ ${test.name} - FAILED`, 'error');
                    }
                } catch (e) {
                    updateStatus(phase, i, 'fail', `Error: ${e.message}`);
                    testResults.failed++;
                    log(`✗ ${test.name} - ERROR: ${e.message}`, 'error');
                }
                
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }
        
        async function runAllTests() {
            log('🚀 Starting comprehensive test suite...', 'info');
            testResults = { total: 0, passed: 0, failed: 0 };
            
            for (let phase = 1; phase <= 5; phase++) {
                log(`📋 Running Phase ${phase} tests...`, 'info');
                await runPhaseTests(phase);
            }
            
            updateResultsSummary();
            log('✅ Test suite complete!', 'success');
        }
        
        async function runQuickTests() {
            log('⚡ Running quick tests...', 'info');
            testResults = { total: 0, passed: 0, failed: 0 };
            
            await runPhaseTests(1);
            await runPhaseTests(2);
            
            updateResultsSummary();
            log('✅ Quick tests complete!', 'success');
        }
        
        function updateResultsSummary() {
            document.getElementById('total-tests').textContent = testResults.total;
            document.getElementById('passed-tests').textContent = testResults.passed;
            document.getElementById('failed-tests').textContent = testResults.failed;
            const rate = testResults.total > 0 ? Math.round((testResults.passed / testResults.total) * 100) : 0;
            document.getElementById('success-rate').textContent = rate + '%';
            
            if (rate === 100) {
                log('🎉 Perfect score! All tests passed!', 'success');
            } else if (rate >= 90) {
                log('🌟 Excellent! Most tests passed.', 'success');
            } else if (rate >= 75) {
                log('⚠️ Good, but some issues need attention.', 'warning');
            } else {
                log('❌ Multiple failures detected. Review required.', 'error');
            }
        }
        
        // Auto-run quick tests on load
        window.addEventListener('load', () => {
            setTimeout(runQuickTests, 1000);
        });
    </script>
</body>
</html>
