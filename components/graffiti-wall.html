<!-- GRAFFITI WALL - Underground Message Board -->
<!-- Signal Forge Community Voice -->

<style>
.graffiti-wall {
    background: linear-gradient(135deg, #0a1510 0%, #1a2a20 50%, #0d1a15 100%);
    border: 3px solid #2ecc71;
    border-radius: 20px;
    padding: 40px;
    margin: 50px 0;
    position: relative;
    overflow: hidden;
}

.graffiti-wall::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
        repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(46, 204, 113, 0.03) 50px, rgba(46, 204, 113, 0.03) 51px),
        repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(46, 204, 113, 0.03) 50px, rgba(46, 204, 113, 0.03) 51px);
    pointer-events: none;
}

.graffiti-header {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
}

.graffiti-title {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 2.5rem;
    color: #2ecc71;
    text-shadow:
        3px 3px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        0 0 20px rgba(46, 204, 113, 0.5);
    letter-spacing: 3px;
    transform: skewX(-5deg);
}

.graffiti-subtitle {
    color: #888;
    font-size: 0.95rem;
    margin-top: 10px;
}

/* Message Input */
.wall-input-section {
    background: rgba(0, 0, 0, 0.5);
    border: 2px dashed rgba(46, 204, 113, 0.4);
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
}

.wall-input-row {
    display: flex;
    gap: 15px;
    align-items: flex-end;
}

.wall-input-group {
    flex: 1;
}

.wall-input-group label {
    display: block;
    color: #2ecc71;
    font-size: 0.85rem;
    margin-bottom: 8px;
    font-weight: bold;
}

.wall-input {
    width: 100%;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(46, 204, 113, 0.3);
    border-radius: 10px;
    padding: 15px;
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s;
}

.wall-input:focus {
    outline: none;
    border-color: #2ecc71;
    box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
}

.wall-input::placeholder {
    color: #555;
}

.tag-input {
    max-width: 120px;
}

.spray-btn {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    border: none;
    color: #000;
    padding: 15px 30px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
}

.spray-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(46, 204, 113, 0.5);
}

.spray-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* Messages Display */
.wall-messages {
    display: grid;
    gap: 20px;
    position: relative;
    z-index: 1;
}

.wall-message {
    background: rgba(0, 0, 0, 0.4);
    border-left: 4px solid;
    border-radius: 0 15px 15px 0;
    padding: 20px;
    position: relative;
    transform: rotate(var(--rotation, 0deg));
    transition: all 0.3s;
}

.wall-message:hover {
    transform: rotate(0deg) scale(1.02);
    background: rgba(0, 0, 0, 0.6);
}

.wall-message:nth-child(odd) { --rotation: -0.5deg; }
.wall-message:nth-child(even) { --rotation: 0.5deg; }
.wall-message:nth-child(3n) { --rotation: -1deg; }

.message-content {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #fff;
    margin-bottom: 12px;
    font-style: italic;
}

.message-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
}

.message-tag {
    color: #2ecc71;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.message-time {
    color: #555;
}

/* Color variations for variety */
.wall-message.color-1 { border-color: #2ecc71; }
.wall-message.color-2 { border-color: #3498db; }
.wall-message.color-3 { border-color: #9b59b6; }
.wall-message.color-4 { border-color: #f39c12; }
.wall-message.color-5 { border-color: #e74c3c; }

.wall-message.color-1 .message-tag { color: #2ecc71; }
.wall-message.color-2 .message-tag { color: #3498db; }
.wall-message.color-3 .message-tag { color: #9b59b6; }
.wall-message.color-4 .message-tag { color: #f39c12; }
.wall-message.color-5 .message-tag { color: #e74c3c; }

/* Loading & Empty States */
.wall-loading, .wall-empty {
    text-align: center;
    padding: 40px;
    color: #555;
}

.wall-loading::after {
    content: '';
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #2ecc71;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Mobile */
@media (max-width: 600px) {
    .graffiti-title { font-size: 1.8rem; }
    .wall-input-row { flex-direction: column; }
    .tag-input { max-width: 100%; }
    .spray-btn { width: 100%; }
}
</style>

<section class="graffiti-wall" id="graffitiWall">
    <div class="graffiti-header">
        <div class="graffiti-title">THE WALL</div>
        <p class="graffiti-subtitle">Leave your mark. Speak your truth. No algorithms. No censorship.</p>
    </div>

    <div class="wall-input-section">
        <div class="wall-input-row">
            <div class="wall-input-group tag-input">
                <label>YOUR TAG</label>
                <input type="text" class="wall-input" id="wallTag" placeholder="ANON" maxlength="15">
            </div>
            <div class="wall-input-group">
                <label>YOUR MESSAGE</label>
                <input type="text" class="wall-input" id="wallMessage" placeholder="What truth needs to be heard?" maxlength="280">
            </div>
            <button class="spray-btn" id="sprayBtn" onclick="sprayMessage()">SPRAY IT</button>
        </div>
    </div>

    <div class="wall-messages" id="wallMessages">
        <div class="wall-loading">Loading the wall...</div>
    </div>
    <!-- COMING SOON TEASERS -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; position: relative; z-index: 1;">
        <div style="background: rgba(0,0,0,0.4); border: 1px dashed rgba(46, 204, 113, 0.3); border-radius: 12px; padding: 20px; text-align: center; opacity: 0.7;">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">📻</div>
            <div style="color: #2ecc71; font-weight: bold; font-size: 0.9rem;">CHANNELS</div>
            <div style="color: #555; font-size: 0.75rem; margin-top: 5px;">Topic discussions</div>
            <div style="color: #f39c12; font-size: 0.7rem; margin-top: 8px;">COMING SOON</div>
        </div>
        <div style="background: rgba(0,0,0,0.4); border: 1px dashed rgba(46, 204, 113, 0.3); border-radius: 12px; padding: 20px; text-align: center; opacity: 0.7;">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">👥</div>
            <div style="color: #2ecc71; font-weight: bold; font-size: 0.9rem;">DIRECTORY</div>
            <div style="color: #555; font-size: 0.75rem; margin-top: 5px;">Find builders</div>
            <div style="color: #f39c12; font-size: 0.7rem; margin-top: 8px;">COMING SOON</div>
        </div>
        <div style="background: rgba(0,0,0,0.4); border: 1px dashed rgba(46, 204, 113, 0.3); border-radius: 12px; padding: 20px; text-align: center; opacity: 0.7;">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">📡</div>
            <div style="color: #2ecc71; font-weight: bold; font-size: 0.9rem;">BEACONS</div>
            <div style="color: #555; font-size: 0.75rem; margin-top: 5px;">Broadcast projects</div>
            <div style="color: #f39c12; font-size: 0.7rem; margin-top: 8px;">COMING SOON</div>
        </div>
    </div>
</section>

<script>
const WALL_API = '/.netlify/functions/graffiti-wall';
const colors = ['color-1', 'color-2', 'color-3', 'color-4', 'color-5'];

// Load messages on page load
document.addEventListener('DOMContentLoaded', loadWallMessages);

async function loadWallMessages() {
    const container = document.getElementById('wallMessages');

    try {
        const response = await fetch(WALL_API);
        const data = await response.json();

        if (data.messages && data.messages.length > 0) {
            container.innerHTML = data.messages.map((msg, i) => `
                <div class="wall-message ${colors[i % colors.length]}">
                    <div class="message-content">"${escapeHtml(msg.content)}"</div>
                    <div class="message-meta">
                        <span class="message-tag">${escapeHtml(msg.tag || 'ANON')}</span>
                        <span class="message-time">${formatTime(msg.timestamp)}</span>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<div class="wall-empty">The wall is empty. Be the first to leave your mark.</div>';
        }
    } catch (err) {
        container.innerHTML = '<div class="wall-empty">Wall offline. Try again later.</div>';
        console.error('Wall error:', err);
    }
}

async function sprayMessage() {
    const tagInput = document.getElementById('wallTag');
    const msgInput = document.getElementById('wallMessage');
    const btn = document.getElementById('sprayBtn');

    const tag = tagInput.value.trim() || 'ANON';
    const content = msgInput.value.trim();

    if (!content) {
        msgInput.focus();
        return;
    }

    btn.disabled = true;
    btn.textContent = 'SPRAYING...';

    try {
        const response = await fetch(WALL_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tag, content })
        });

        if (response.ok) {
            msgInput.value = '';
            await loadWallMessages();
        } else {
            alert('Failed to spray. Try again.');
        }
    } catch (err) {
        console.error('Spray error:', err);
        alert('Connection failed. Try again.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'SPRAY IT';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    const now = new Date();
    const diff = now - date;

    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return date.toLocaleDateString();
}

// Enter key to submit
document.getElementById('wallMessage')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sprayMessage();
});
</script>
