<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-6EA64441">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM.html AI Agents Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        h2 {
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #a855f7;
        }

        .test-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-case {
            background: #0f172a;
            border-left: 3px solid #64748b;
            padding: 15px;
            margin-bottom: 15px;
        }

        .test-case.pass {
            border-left-color: #10b981;
        }

        .test-case.fail {
            border-left-color: #ef4444;
        }

        .test-case.pending {
            border-left-color: #f59e0b;
        }

        .test-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .test-result {
            font-size: 13px;
            color: #94a3b8;
        }

        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .status.pass { background: #10b981; color: #000; }
        .status.fail { background: #ef4444; color: #fff; }
        .status.pending { background: #f59e0b; color: #000; }

        button {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #0ea5e9;
        }

        .log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.info { color: #38bdf8; }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
        .log-entry.warning { color: #f59e0b; }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>🧪 SAM.html AI Agents Test Suite</h1>
        <p style="margin-bottom: 20px; color: #94a3b8;">
            Comprehensive testing for Contract Seeker Agent and Proposal Generator Agent
        </p>

        <div class="test-section">
            <h2>Test Controls</h2>
            <button onclick="runAllTests()">▶️ Run All Tests</button>
            <button onclick="testContractSeeker()">🔍 Test Contract Seeker</button>
            <button onclick="testProposalGenerator()">📝 Test Proposal Generator</button>
            <button onclick="clearLog()">🗑️ Clear Log</button>
        </div>

        <div class="metrics" id="metricsContainer">
            <div class="metric">
                <div class="metric-value" id="totalTests">0</div>
                <div class="metric-label">Total Tests</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="passedTests">0</div>
                <div class="metric-label">Passed</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="failedTests">0</div>
                <div class="metric-label">Failed</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="pendingTests">0</div>
                <div class="metric-label">Pending</div>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Results</h2>
            <div id="testResults"></div>
        </div>

        <div class="test-section">
            <h2>Console Log</h2>
            <div class="log" id="consoleLog"></div>
        </div>
    </div>

    <!-- Load AI Agents -->
    <script src="/src/agents/contract-seeker-agent.js"></script>
    <script src="/src/agents/proposal-generator-agent.js"></script>

    <script>
        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            pending: 0
        };

        function log(message, level = 'info') {
            const logDiv = document.getElementById('consoleLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('consoleLog').innerHTML = '';
            log('Log cleared', 'info');
        }

        function addTestResult(title, status, message) {
            testResults.total++;
            testResults[status]++;

            const resultsDiv = document.getElementById('testResults');
            const testCase = document.createElement('div');
            testCase.className = `test-case ${status}`;
            testCase.innerHTML = `
                <div class="test-title">
                    ${title}
                    <span class="status ${status}">${status}</span>
                </div>
                <div class="test-result">${message}</div>
            `;
            resultsDiv.appendChild(testCase);

            updateMetrics();
        }

        function updateMetrics() {
            document.getElementById('totalTests').textContent = testResults.total;
            document.getElementById('passedTests').textContent = testResults.passed;
            document.getElementById('failedTests').textContent = testResults.failed;
            document.getElementById('pendingTests').textContent = testResults.pending;
        }

        async function runAllTests() {
            log('🚀 Starting test suite...', 'info');
            document.getElementById('testResults').innerHTML = '';
            testResults = { total: 0, passed: 0, failed: 0, pending: 0 };

            await testContractSeeker();
            await testProposalGenerator();

            log('✅ Test suite complete!', 'success');
            log(`Results: ${testResults.passed} passed, ${testResults.failed} failed, ${testResults.pending} pending`, 'info');
        }

        async function testContractSeeker() {
            log('📋 Testing Contract Seeker Agent...', 'info');

            // Test 1: Agent initialization
            try {
                const agent = new ContractSeekerAgent({
                    enabled: false,
                    peacefulOnly: true
                });

                await agent.init();

                if (agent.isActive) {
                    addTestResult(
                        'ContractSeekerAgent: Initialization',
                        'pass',
                        'Agent initialized successfully'
                    );
                    log('✅ Agent initialization: PASS', 'success');
                } else {
                    addTestResult(
                        'ContractSeekerAgent: Initialization',
                        'fail',
                        'Agent failed to activate'
                    );
                    log('❌ Agent initialization: FAIL', 'error');
                }
            } catch (error) {
                addTestResult(
                    'ContractSeekerAgent: Initialization',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Agent initialization: FAIL - ${error.message}`, 'error');
            }

            // Test 2: Peaceful filtering
            try {
                const agent = new ContractSeekerAgent({ peacefulOnly: true });
                await agent.init();

                const testOpportunities = [
                    { title: 'Educational Software Development', description: 'Build educational platform' },
                    { title: 'Missile Defense System', description: 'Weapon system upgrade' },
                    { title: 'Healthcare Infrastructure', description: 'Hospital IT system' }
                ];

                const filtered = agent.filterPeacefulContracts(testOpportunities);

                if (filtered.length === 2 && !filtered.some(o => o.title.includes('Missile'))) {
                    addTestResult(
                        'ContractSeekerAgent: Peaceful Filtering',
                        'pass',
                        `Correctly filtered out harmful contracts. ${filtered.length}/3 passed filter`
                    );
                    log('✅ Peaceful filtering: PASS', 'success');
                } else {
                    addTestResult(
                        'ContractSeekerAgent: Peaceful Filtering',
                        'fail',
                        `Filter failed. Expected 2 contracts, got ${filtered.length}`
                    );
                    log('❌ Peaceful filtering: FAIL', 'error');
                }
            } catch (error) {
                addTestResult(
                    'ContractSeekerAgent: Peaceful Filtering',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Peaceful filtering: FAIL - ${error.message}`, 'error');
            }

            // Test 3: Opportunity scoring
            try {
                const agent = new ContractSeekerAgent();
                await agent.init();

                const testOpportunities = [
                    {
                        title: 'IT Services',
                        naicsCode: '541512',
                        responseDeadLine: new Date(Date.now() + 21 * 24 * 60 * 60 * 1000), // 21 days
                        baseAndAllOptionsValue: '500000',
                        typeOfSetAside: 'SBA'
                    }
                ];

                const scored = agent.scoreOpportunities(testOpportunities, ['541512']);

                if (scored[0].score >= 80) {
                    addTestResult(
                        'ContractSeekerAgent: Opportunity Scoring',
                        'pass',
                        `High score achieved: ${scored[0].score}/100`
                    );
                    log(`✅ Opportunity scoring: PASS (${scored[0].score}/100)`, 'success');
                } else {
                    addTestResult(
                        'ContractSeekerAgent: Opportunity Scoring',
                        'pending',
                        `Score lower than expected: ${scored[0].score}/100`
                    );
                    log(`⚠️ Opportunity scoring: PENDING (${scored[0].score}/100)`, 'warning');
                }
            } catch (error) {
                addTestResult(
                    'ContractSeekerAgent: Opportunity Scoring',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Opportunity scoring: FAIL - ${error.message}`, 'error');
            }

            // Test 4: Knowledge base
            try {
                const agent = new ContractSeekerAgent();
                await agent.init();

                agent.knowledgeBase.successfulNAICS.push('541512', '541513');
                await agent.saveKnowledgeBase();
                await agent.loadKnowledgeBase();

                if (agent.knowledgeBase.successfulNAICS.includes('541512')) {
                    addTestResult(
                        'ContractSeekerAgent: Knowledge Base',
                        'pass',
                        `Knowledge base saved and loaded successfully. ${agent.knowledgeBase.successfulNAICS.length} codes stored`
                    );
                    log('✅ Knowledge base: PASS', 'success');
                } else {
                    addTestResult(
                        'ContractSeekerAgent: Knowledge Base',
                        'fail',
                        'Knowledge base failed to persist'
                    );
                    log('❌ Knowledge base: FAIL', 'error');
                }
            } catch (error) {
                addTestResult(
                    'ContractSeekerAgent: Knowledge Base',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Knowledge base: FAIL - ${error.message}`, 'error');
            }

            log('📋 Contract Seeker Agent tests complete', 'info');
        }

        async function testProposalGenerator() {
            log('📝 Testing Proposal Generator Agent...', 'info');

            // Test 1: Agent initialization
            try {
                const agent = new ProposalGeneratorAgent();
                await agent.init();

                if (agent.isActive) {
                    addTestResult(
                        'ProposalGeneratorAgent: Initialization',
                        'pass',
                        'Agent initialized successfully'
                    );
                    log('✅ Agent initialization: PASS', 'success');
                } else {
                    addTestResult(
                        'ProposalGeneratorAgent: Initialization',
                        'fail',
                        'Agent failed to activate'
                    );
                    log('❌ Agent initialization: FAIL', 'error');
                }
            } catch (error) {
                addTestResult(
                    'ProposalGeneratorAgent: Initialization',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Agent initialization: FAIL - ${error.message}`, 'error');
            }

            // Test 2: Requirements extraction
            try {
                const agent = new ProposalGeneratorAgent();
                await agent.init();

                const testOpportunity = {
                    title: 'IT Modernization',
                    description: 'The contractor must provide cloud infrastructure services. The project requires expertise in AWS and Azure. Deliverables shall be completed within 6 months.'
                };

                const requirements = agent.extractRequirements(testOpportunity);

                if (requirements.technical.length > 0) {
                    addTestResult(
                        'ProposalGeneratorAgent: Requirements Extraction',
                        'pass',
                        `Extracted ${requirements.technical.length} requirements`
                    );
                    log(`✅ Requirements extraction: PASS (${requirements.technical.length} found)`, 'success');
                } else {
                    addTestResult(
                        'ProposalGeneratorAgent: Requirements Extraction',
                        'fail',
                        'No requirements extracted'
                    );
                    log('❌ Requirements extraction: FAIL', 'error');
                }
            } catch (error) {
                addTestResult(
                    'ProposalGeneratorAgent: Requirements Extraction',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Requirements extraction: FAIL - ${error.message}`, 'error');
            }

            // Test 3: Full proposal generation
            try {
                const agent = new ProposalGeneratorAgent();
                await agent.init();

                const testOpportunity = {
                    noticeId: 'TEST-001',
                    title: 'Software Development Services',
                    description: 'Develop custom software solution for federal agency',
                    baseAndAllOptionsValue: '250000',
                    requirements: 'Must have experience with cloud platforms and agile development'
                };

                const proposal = await agent.generateProposal(testOpportunity);

                if (proposal && proposal.sections && Object.keys(proposal.sections).length === 6) {
                    addTestResult(
                        'ProposalGeneratorAgent: Full Proposal Generation',
                        'pass',
                        `Generated complete proposal with ${Object.keys(proposal.sections).length} sections. Quality score: ${proposal.qualityScore}/100`
                    );
                    log(`✅ Proposal generation: PASS (${proposal.qualityScore}/100)`, 'success');
                } else {
                    addTestResult(
                        'ProposalGeneratorAgent: Full Proposal Generation',
                        'fail',
                        'Incomplete proposal generated'
                    );
                    log('❌ Proposal generation: FAIL', 'error');
                }
            } catch (error) {
                addTestResult(
                    'ProposalGeneratorAgent: Full Proposal Generation',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Proposal generation: FAIL - ${error.message}`, 'error');
            }

            // Test 4: Quality scoring
            try {
                const agent = new ProposalGeneratorAgent();
                await agent.init();

                const testProposal = {
                    sections: {
                        executiveSummary: {},
                        technicalApproach: {},
                        managementPlan: {},
                        pastPerformance: {},
                        costProposal: {},
                        complianceMatrix: {}
                    }
                };

                const score = agent.assessProposalQuality(testProposal);

                if (score === 100) {
                    addTestResult(
                        'ProposalGeneratorAgent: Quality Scoring',
                        'pass',
                        `Perfect score achieved: ${score}/100`
                    );
                    log(`✅ Quality scoring: PASS (${score}/100)`, 'success');
                } else {
                    addTestResult(
                        'ProposalGeneratorAgent: Quality Scoring',
                        'pending',
                        `Score: ${score}/100`
                    );
                    log(`⚠️ Quality scoring: PENDING (${score}/100)`, 'warning');
                }
            } catch (error) {
                addTestResult(
                    'ProposalGeneratorAgent: Quality Scoring',
                    'fail',
                    `Error: ${error.message}`
                );
                log(`❌ Quality scoring: FAIL - ${error.message}`, 'error');
            }

            log('📝 Proposal Generator Agent tests complete', 'info');
        }

        // Auto-run tests on page load
        window.addEventListener('load', () => {
            log('🧪 Test suite ready. Click "Run All Tests" to begin.', 'info');
        });
    </script>
</body>
</html>
