  <title>Voice Extraction Test</title>
  <style>

<body>
  <h1>Voice Extraction Feature Test</h1>
  
  <div class="test-section">
    <h2>1. MIME Type Support Test</h2>
    <button onclick="testMimeTypes()">Run MIME Type Test</button>
    <div id="mime-results"></div>
  </div>

  <div class="test-section">
    <h2>2. Speaker Analysis Algorithm Test</h2>
    <button onclick="testSpeakerAnalysis()">Run Speaker Analysis Test</button>
    <div id="speaker-results"></div>
  </div>

  <div class="test-section">
    <h2>3. Audio Context Test</h2>
    <button onclick="testAudioContext()">Test Audio Context</button>
    <div id="audio-context-results"></div>
  </div>

  <div class="test-section">
    <h2>4. MediaRecorder Test</h2>
    <button onclick="testMediaRecorder()">Test MediaRecorder</button>
    <div id="mediarecorder-results"></div>
  </div>

  <div class="test-section">
    <h2>5. Video Upload Test</h2>
    <p>Upload a video file to test extraction:</p>
    <input type="file" id="video-upload" accept="video/*">
    <video id="test-video" style="display: none;"></video>
    <div id="video-results"></div>
  </div>

  <script>
    // Test MIME type support
    function testMimeTypes() {
      const resultsDiv = document.getElementById('mime-results');
      resultsDiv.innerHTML = '';
      
      const mimeTypes = [
        'audio/webm',
        'audio/webm;codecs=opus',
        'audio/ogg;codecs=opus',
        'audio/mp4'
      ];
      
      let results = '<h3>MediaRecorder Support:</h3>';
      let supportedType = null;
      
      mimeTypes.forEach(mimeType => {
        const isSupported = MediaRecorder.isTypeSupported(mimeType);
        results += `<div class="test-result ${isSupported ? 'success' : 'error'}">
          ${mimeType}: ${isSupported ? '✓ Supported' : '✗ Not Supported'}
        </div>`;
        
        if (isSupported && !supportedType) {
          supportedType = mimeType;
        }
      });
      
      if (supportedType) {
        results += `<div class="test-result success">
          <strong>✓ At least one format is supported. Best option: ${supportedType}</strong>
        </div>`;
      } else {
        results += `<div class="test-result error">
          <strong>✗ No supported audio format found!</strong>
        </div>`;
      }
      
      resultsDiv.innerHTML = results;
    }

    // Test speaker analysis algorithm
    function testSpeakerAnalysis() {
      const resultsDiv = document.getElementById('speaker-results');
      resultsDiv.innerHTML = '<div class="test-result info">Running speaker analysis tests...</div>';
      
      // Simulate different audio level patterns
      const testCases = [
        {
          name: 'Single Speaker (Low Variation)',
          audioLevels: Array(100).fill(0).map(() => 50 + Math.random() * 10),
          duration: 10
        },
        {
          name: 'Two Speakers (Moderate Variation)',
          audioLevels: Array(100).fill(0).map((_, i) => 
            i % 20 < 10 ? 60 + Math.random() * 15 : 40 + Math.random() * 15
          ),
          duration: 10
        },
        {
          name: 'Multiple Speakers (High Variation)',
          audioLevels: Array(100).fill(0).map(() => 20 + Math.random() * 80),
          duration: 10
        }
      ];
      
      let results = '<h3>Speaker Analysis Results:</h3>';
      
      testCases.forEach(testCase => {
        const analysis = analyzeAudioForSpeakers(testCase.audioLevels, testCase.duration);
        results += `<div class="test-result info">
          <strong>${testCase.name}</strong><br>
          Detected Speakers: ${analysis.speakerCount}<br>
          Confidence: ${(analysis.confidence * 100).toFixed(0)}%<br>
          Speech Segments: ${analysis.segments.length}<br>
          Variability: ${analysis.statistics.variability}
        </div>`;
      });
      
      resultsDiv.innerHTML = results;
    }

    // Copy of speaker analysis function from the main files
    function analyzeAudioForSpeakers(audioLevels, duration) {
      if (audioLevels.length === 0) {
        return { speakerCount: 1, confidence: 0, segments: [] };
      }

      const avgLevel = audioLevels.reduce((a, b) => a + b, 0) / audioLevels.length;
      const maxLevel = Math.max(...audioLevels);
      const minLevel = Math.min(...audioLevels);
      
      const threshold = avgLevel * 0.5;
      const segments = [];
      let inSegment = false;
      let segmentStart = 0;
      
      for (let i = 0; i < audioLevels.length; i++) {
        const time = (i / audioLevels.length) * duration;
        
        if (audioLevels[i] > threshold && !inSegment) {
          inSegment = true;
          segmentStart = time;
        } else if (audioLevels[i] <= threshold && inSegment) {
          inSegment = false;
          segments.push({
            start: segmentStart,
            end: time,
            duration: time - segmentStart
          });
        }
      }
      
      if (inSegment) {
        segments.push({
          start: segmentStart,
          end: duration,
          duration: duration - segmentStart
        });
      }

      const variance = audioLevels.reduce((sum, level) => {
        return sum + Math.pow(level - avgLevel, 2);
      }, 0) / audioLevels.length;
      
      const standardDev = Math.sqrt(variance);
      const coefficientOfVariation = standardDev / avgLevel;
      
      let estimatedSpeakers = 1;
      let confidence = 0.7;
      
      if (coefficientOfVariation > 0.8 && segments.length > 5) {
        estimatedSpeakers = 2;
        confidence = 0.6;
      }
      
      if (coefficientOfVariation > 1.2 && segments.length > 10) {
        estimatedSpeakers = 3;
        confidence = 0.5;
      }

      return {
        speakerCount: estimatedSpeakers,
        confidence: confidence,
        segments: segments,
        statistics: {
          avgLevel: avgLevel.toFixed(2),
          maxLevel: maxLevel.toFixed(2),
          variability: coefficientOfVariation.toFixed(2)
        }
      };
    }

    // Test Audio Context
    function testAudioContext() {
      const resultsDiv = document.getElementById('audio-context-results');
      resultsDiv.innerHTML = '';
      
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          throw new Error('AudioContext not supported');
        }
        
        const audioContext = new AudioContext();
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        
        resultsDiv.innerHTML = `<div class="test-result success">
          <strong>✓ AudioContext is supported</strong><br>
          Sample Rate: ${audioContext.sampleRate} Hz<br>
          State: ${audioContext.state}<br>
          FFT Size: ${analyser.fftSize}
        </div>`;
        
        audioContext.close();
      } catch (error) {
        resultsDiv.innerHTML = `<div class="test-result error">
          <strong>✗ AudioContext Error:</strong> ${error.message}
        </div>`;
      }
    }

    // Test MediaRecorder
    async function testMediaRecorder() {
      const resultsDiv = document.getElementById('mediarecorder-results');
      resultsDiv.innerHTML = '<div class="test-result info">Testing MediaRecorder with microphone...</div>';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 
                         MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : null;
        
        if (!mimeType) {
          throw new Error('No supported MIME type');
        }
        
        const recorder = new MediaRecorder(stream, { mimeType });
        
        resultsDiv.innerHTML = `<div class="test-result success">
          <strong>✓ MediaRecorder is working</strong><br>
          MIME Type: ${mimeType}<br>
          State: ${recorder.state}<br>
          <em>Microphone access granted</em>
        </div>`;
        
        stream.getTracks().forEach(track => track.stop());
      } catch (error) {
        resultsDiv.innerHTML = `<div class="test-result error">
          <strong>✗ MediaRecorder Error:</strong> ${error.message}<br>
          <em>You may need to grant microphone permission</em>
        </div>`;
      }
    }

    // Video upload test
    document.getElementById('video-upload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const resultsDiv = document.getElementById('video-results');
      resultsDiv.innerHTML = '<div class="test-result info">Loading video...</div>';
      
      const videoElement = document.getElementById('test-video');
      const videoURL = URL.createObjectURL(file);
      videoElement.src = videoURL;
      
      videoElement.onloadedmetadata = function() {
        const duration = videoElement.duration;
        
        let result = `<div class="test-result success">
          <strong>✓ Video loaded successfully</strong><br>
          File: ${file.name}<br>
          Size: ${(file.size / 1024 / 1024).toFixed(2)} MB<br>
          Duration: ${duration.toFixed(2)} seconds<br>
          Dimensions: ${videoElement.videoWidth}x${videoElement.videoHeight}
        </div>`;
        
        // Check for audio track
        const hasAudio = videoElement.mozHasAudio || 
                        videoElement.webkitAudioDecodedByteCount || 
                        (videoElement.audioTracks && videoElement.audioTracks.length > 0);
        
        if (hasAudio || hasAudio === undefined) {
          result += `<div class="test-result info">
            <strong>Audio Status:</strong> Likely present (will test during extraction)
          </div>`;
        } else {
          result += `<div class="test-result error">
            <strong>⚠️ Warning:</strong> No audio track detected. Extraction may fail.
          </div>`;
        }
        
        resultsDiv.innerHTML = result;
        URL.revokeObjectURL(videoURL);
      };
      
      videoElement.onerror = function(e) {
        let errorMsg = "Unknown error";
        if (videoElement.error) {
          switch (videoElement.error.code) {
            case MediaError.MEDIA_ERR_ABORTED:
              errorMsg = "Video loading aborted";
              break;
            case MediaError.MEDIA_ERR_NETWORK:
              errorMsg = "Network error";
              break;
            case MediaError.MEDIA_ERR_DECODE:
              errorMsg = "Video decoding failed";
              break;
            case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
              errorMsg = "Video format not supported";
              break;
          }
        }
        
        resultsDiv.innerHTML = `<div class="test-result error">
          <strong>✗ Video Error:</strong> ${errorMsg}<br>
          <em>Try a different video format (MP4 recommended)</em>
        </div>`;
        
        URL.revokeObjectURL(videoURL);
      };
    });

    // Run initial tests on load
    window.addEventListener('load', () => {
      console.log('Voice extraction test page loaded');
    });
  </script>
</body>
</html>
