    <script src="access-code-system.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        h1 {

            margin-bottom: 10px;

        h2 {

        button {
            padding: 12px 24px;

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<body>
    <h1>🔐 Access Code System Test Suite</h1>
    <p>Test all functionality of the access code system</p>

    <div class="test-section">
        <h2>1. Generate Access Codes</h2>
        <button onclick="testGenerateCode()">Generate New Code</button>
        <button onclick="generateMultipleCodes()">Generate 5 Codes</button>
        <div id="generate-result" class="status-display"></div>
    </div>

    <div class="test-section">
        <h2>2. Activate Access Code</h2>
        <input type="text" id="code-input" placeholder="Enter access code (ACC-XXXXX-XXXXX)">
        <button onclick="testActivateCode()">Activate Code</button>
        <div id="activate-result" class="status-display"></div>
    </div>

    <div class="test-section">
        <h2>3. Check Access Status</h2>
        <button onclick="checkStatus()">Check Current Status</button>
        <button onclick="testFeatureAccess()">Test Feature Access</button>
        <div id="status-result" class="status-display"></div>
    </div>

    <div class="test-section">
        <h2>4. Preview Mode</h2>
        <button onclick="enablePreview()">Enable Preview Mode</button>
        <button onclick="checkPreviewStatus()">Check Preview Status</button>
        <div id="preview-result" class="status-display"></div>
    </div>

    <div class="test-section">
        <h2>5. Device Management</h2>
        <button onclick="revokeCurrentAccess()">Revoke Access (for device switch)</button>
        <button onclick="showDeviceId()">Show Device ID</button>
        <div id="device-result" class="status-display"></div>
    </div>

    <div class="test-section">
        <h2>6. Access Code Validation</h2>
        <input type="text" id="validate-input" placeholder="Enter code to validate format">
        <button onclick="validateFormat()">Validate Format</button>
        <div id="validate-result" class="status-display"></div>
    </div>

    <div class="test-section">
        <h2>7. UI Tests</h2>
        <button onclick="showAccessPrompt()">Show Access Prompt</button>
        <button onclick="testPreviewBanner()">Show Preview Banner</button>
        <div id="ui-result" class="status-display"></div>
    </div>

    <script>
        // Test functions
        function testGenerateCode() {
            try {
                const code = AccessCodeSystem.generateAccessCode();
                document.getElementById('generate-result').innerHTML = 
                    `<span class="success">✓ Generated Code:</span> ${code}`;
            } catch (error) {
                document.getElementById('generate-result').innerHTML = 
                    `<span class="error">✗ Error:</span> ${error.message}`;
            }
        }

        function generateMultipleCodes() {
            try {
                const codes = [];
                for (let i = 0; i < 5; i++) {
                    codes.push(AccessCodeSystem.generateAccessCode());
                }
                document.getElementById('generate-result').innerHTML = 
                    `<span class="success">✓ Generated 5 Codes:</span>\n${codes.join('\n')}`;
            } catch (error) {
                document.getElementById('generate-result').innerHTML = 
                    `<span class="error">✗ Error:</span> ${error.message}`;
            }
        }

        function testActivateCode() {
            const code = document.getElementById('code-input').value;
            const result = AccessCodeSystem.activateAccessCode(code);
            
            if (result.success) {
                document.getElementById('activate-result').innerHTML = 
                    `<span class="success">✓ Success:</span> ${result.message}\n` +
                    `Type: ${result.type}\n` +
                    `Features: ${result.features.join(', ')}`;
            } else {
                document.getElementById('activate-result').innerHTML = 
                    `<span class="error">✗ Error:</span> ${result.error}`;
            }
        }


        function checkStatus() {
            const status = AccessCodeSystem.getAccessStatus();
            document.getElementById('status-result').innerHTML = 
                `<span class="info">Current Status:</span>\n${JSON.stringify(status, null, 2)}`;
        }

        function testFeatureAccess() {
            const features = ['trading', 'signals', 'automation'];
            const results = features.map(f => 
                `${f}: ${AccessCodeSystem.canAccessFeature(f) ? '✓ YES' : '✗ NO'}`
            );
            
            document.getElementById('status-result').innerHTML = 
                `<span class="info">Feature Access:</span>\n${results.join('\n')}`;
        }

        function enablePreview() {
            AccessCodeSystem.enablePreviewMode();
            document.getElementById('preview-result').innerHTML = 
                `<span class="success">✓ Preview mode enabled</span>\n` +
                `Check the top of the page for the preview banner.`;
        }

        function checkPreviewStatus() {
            const isPreview = AccessCodeSystem.isPreviewMode();
            document.getElementById('preview-result').innerHTML = 
                `<span class="info">Preview Mode:</span> ${isPreview ? 'ACTIVE' : 'INACTIVE'}`;
        }

        function revokeCurrentAccess() {
            const result = AccessCodeSystem.revokeAccess();
            document.getElementById('device-result').innerHTML = 
                result.success ? 
                `<span class="success">✓ Success:</span> ${result.message}` :
                `<span class="error">✗ Error:</span> ${result.error}`;
        }

        function showDeviceId() {
            const status = AccessCodeSystem.getAccessStatus();
            document.getElementById('device-result').innerHTML = 
                `<span class="info">Device ID:</span> ${status.deviceId || 'Not available'}`;
        }

        function validateFormat() {
            const code = document.getElementById('validate-input').value;
            const isValid = AccessCodeSystem.validateCodeFormat(code);
            
            document.getElementById('validate-result').innerHTML = 
                isValid ? 
                `<span class="success">✓ Valid format:</span> ${code}` :
                `<span class="error">✗ Invalid format:</span> ${code}\nExpected: ACC-XXXXX-XXXXX`;
        }

        function showAccessPrompt() {
            AccessCodeSystem.showAccessCodePrompt((result) => {
                document.getElementById('ui-result').innerHTML = 
                    `<span class="success">✓ Access activated:</span>\n${JSON.stringify(result, null, 2)}`;
            });
        }

        function testPreviewBanner() {
            AccessCodeSystem.enablePreviewMode();
            document.getElementById('ui-result').innerHTML = 
                `<span class="info">Check the top of the page for preview banner</span>`;
        }

        // Initial status check on load
        window.addEventListener('load', () => {
            checkStatus();
        });
    </script>
</body>
</html>
