<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-51AF73D3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah.html Mobile Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .viewports {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .viewport {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .viewport-header {
            background: #333;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
        }
        .viewport iframe {
            width: 100%;
            border: none;
            display: block;
        }
        .size-375 iframe { height: 667px; }
        .size-480 iframe { height: 720px; }
        .size-768 iframe { height: 1024px; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
</head>
<body>
    <div class="test-container">
        <h1>Leah.html Mobile Responsiveness Test</h1>
        <p style="text-align: center; color: #666;">
            Testing various mobile breakpoints: 375px (iPhone), 480px (Small Mobile), 768px (Tablet)
        </p>
        
        <div class="viewports">
            <div class="viewport size-375">
                <div class="viewport-header">375px - iPhone SE / Small Mobile</div>
                <iframe src="Leah.html" width="375" height="667"></iframe>
            </div>
            
            <div class="viewport size-480">
                <div class="viewport-header">480px - Medium Mobile</div>
                <iframe src="Leah.html" width="480" height="720"></iframe>
            </div>
            
            <div class="viewport size-768">
                <div class="viewport-header">768px - Tablet</div>
                <iframe src="Leah.html" width="768" height="1024"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
