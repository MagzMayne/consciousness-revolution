<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Tracker Test - Barbrick Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f3460 100%);
            color: white;
            padding: 80px 20px 20px 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .test-section h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: #4affff;
        }
        
        .button {
            background: linear-gradient(135deg, #4affff, #9f7aea);
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            color: #1a1a2e;
            font-weight: 700;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        
        .button:hover {
            transform: scale(1.05);
        }
        
        .log {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .success {
            color: #4ade80;
        }
        
        .error {
            color: #f87171;
        }
        
        .info {
            color: #60a5fa;
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>🧪 Autonomous Value Tracker Test Suite</h1>
        
        <div class="test-section">
            <h2>📊 Current Statistics</h2>
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Value</div>
                    <div class="stat-value" id="stat-total">Loading...</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Project Count</div>
                    <div class="stat-value" id="stat-count">Loading...</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Average Value</div>
                    <div class="stat-value" id="stat-avg">Loading...</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Last Update</div>
                    <div class="stat-value" id="stat-update" style="font-size: 1.2rem;">Loading...</div>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🎮 Test Controls</h2>
            <div style="text-align: center;">
                <button class="button" onclick="testManualRefresh()">🔄 Manual Refresh</button>
                <button class="button" onclick="testToggleAutoUpdate()">⏯️ Toggle Auto-Update</button>
                <button class="button" onclick="testShowStats()">📈 Show Statistics</button>
                <button class="button" onclick="clearLog()">🗑️ Clear Log</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>📝 Test Log</h2>
            <div class="log" id="test-log"></div>
        </div>
    </div>

    <!-- Load the value tracker -->
    <script src="/js/project-value-calculator.js"></script>
    <script src="/js/autonomous-value-tracker.js"></script>
    
    <script>
        // Log function
        function log(message, type = 'info') {
            const logDiv = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('test-log').innerHTML = '';
            log('Log cleared', 'info');
        }
        
        // Update stats display
        function updateStatsDisplay() {
            if (window.autonomousValueTracker) {
                const stats = window.autonomousValueTracker.getStats();
                
                document.getElementById('stat-total').textContent = stats.formattedValue;
                document.getElementById('stat-count').textContent = stats.projectCount.toLocaleString();
                document.getElementById('stat-avg').textContent = stats.formattedAverage;
                
                if (stats.lastUpdate) {
                    const timeAgo = getTimeAgo(stats.lastUpdate);
                    document.getElementById('stat-update').textContent = timeAgo;
                }
            }
        }
        
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return `${seconds}s ago`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            return `${Math.floor(seconds / 3600)}h ago`;
        }
        
        // Test functions
        async function testManualRefresh() {
            log('Testing manual refresh...', 'info');
            try {
                await window.autonomousValueTracker.loadProjectData();
                updateStatsDisplay();
                log('✅ Manual refresh successful', 'success');
            } catch (error) {
                log(`❌ Manual refresh failed: ${error.message}`, 'error');
            }
        }
        
        function testToggleAutoUpdate() {
            if (window.autonomousValueTracker.autoUpdateEnabled) {
                window.autonomousValueTracker.stopAutoUpdate();
                log('⏸️ Auto-update disabled', 'info');
            } else {
                window.autonomousValueTracker.autoUpdateEnabled = true;
                window.autonomousValueTracker.startAutoUpdate();
                log('▶️ Auto-update enabled', 'success');
            }
        }
        
        function testShowStats() {
            const stats = window.autonomousValueTracker.getStats();
            log('Current Statistics:', 'info');
            log(`  Total Value: ${stats.formattedValue}`, 'info');
            log(`  Project Count: ${stats.projectCount}`, 'info');
            log(`  Average Value: ${stats.formattedAverage}`, 'info');
            log(`  Last Update: ${stats.lastUpdate}`, 'info');
        }
        
        // Listen for value tracker events
        window.addEventListener('valuetracker:update', (e) => {
            log(`🔄 Value tracker updated: ${e.detail.totalValue.toLocaleString()} across ${e.detail.projectCount} projects`, 'success');
            updateStatsDisplay();
        });
        
        // Initial load
        window.addEventListener('DOMContentLoaded', () => {
            log('🚀 Test suite initialized', 'success');
            log('Waiting for value tracker to load...', 'info');
            
            // Wait for tracker to initialize
            setTimeout(() => {
                if (window.autonomousValueTracker) {
                    log('✅ Value tracker loaded successfully', 'success');
                    updateStatsDisplay();
                    
                    // Update display every second
                    setInterval(updateStatsDisplay, 1000);
                } else {
                    log('❌ Value tracker failed to load', 'error');
                }
            }, 2000);
        });
    </script>
</body>
</html>
