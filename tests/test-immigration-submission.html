<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-858053F8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immigration Navigator Submission Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #0f172a;
      color: #e5e7eb;
    }
    h1 {
      color: #38bdf8;
    }
    .test-section {
      background: #1e293b;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    button {
      padding: 12px 24px;
      margin: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #38bdf8;
      color: #000;
    }
    .btn-secondary {
      background: #64748b;
      color: #fff;
    }
    .btn-success {
      background: #10b981;
      color: #fff;
    }
    button:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
</head>
<body>
  <h1>🧪 Immigration Navigator Submission Test</h1>
  
  <div class="test-section">
    <h2>Test Submission Functions</h2>
    <p>Click the buttons below to test the submission automation features:</p>
    
    <button class="btn-primary" onclick="testDownload()">
      📥 Test Download Report
    </button>
    
    <button class="btn-secondary" onclick="testEmailToAttorney()">
      📧 Test Email to Attorney
    </button>
    
    <button class="btn-success" onclick="testScheduleConsultation()">
      📅 Test Schedule Consultation
    </button>
    
    <button class="btn-primary" onclick="testEmailToUser()">
      ✉️ Test Email to User
    </button>
  </div>
  
  <div class="test-section">
    <h2>Status</h2>
    <div id="status">Ready to test...</div>
  </div>
  
  <!-- Mock form data for testing -->
  <div style="display:none;">
    <input type="number" id="age" value="30" />
    <input type="text" id="countryOfBirth" value="Mexico" />
    <input type="text" id="currentCountry" value="United States" />
    <select id="currentStatus">
      <option value="visitor" selected>Tourist/Visitor</option>
    </select>
    <select id="entryMethod">
      <option value="visa" selected>Valid visa</option>
    </select>
    <select id="educationLevel">
      <option value="bachelors" selected>Bachelor's degree</option>
    </select>
  </div>
  
  <!-- Load the submission automation script -->
  <script src="js/immigration-nav-submission.js"></script>
  
  <script>
    function updateStatus(message) {
      const status = document.getElementById('status');
      const timestamp = new Date().toLocaleTimeString();
      status.textContent += `\n[${timestamp}] ${message}`;
      status.scrollTop = status.scrollHeight;
    }
    
    function testDownload() {
      updateStatus('Testing download function...');
      try {
        window.downloadCaseReport();
        updateStatus('✅ Download function executed');
      } catch (error) {
        updateStatus('❌ Error: ' + error.message);
      }
    }
    
    function testEmailToAttorney() {
      updateStatus('Testing email to attorney function...');
      try {
        window.emailToAttorney();
        updateStatus('✅ Email to attorney function executed');
      } catch (error) {
        updateStatus('❌ Error: ' + error.message);
      }
    }
    
    function testScheduleConsultation() {
      updateStatus('Testing schedule consultation function...');
      try {
        window.scheduleconsultation();
        updateStatus('✅ Schedule consultation function executed');
      } catch (error) {
        updateStatus('❌ Error: ' + error.message);
      }
    }
    
    function testEmailToUser() {
      updateStatus('Testing email to user function...');
      try {
        window.emailCaseReport();
        updateStatus('✅ Email to user function executed');
      } catch (error) {
        updateStatus('❌ Error: ' + error.message);
      }
    }
    
    // Log when script loads
    setTimeout(() => {
      updateStatus('Submission automation script loaded');
      updateStatus('Testing function availability:');
      updateStatus('- downloadCaseReport: ' + (typeof window.downloadCaseReport === 'function' ? '✅' : '❌'));
      updateStatus('- emailCaseReport: ' + (typeof window.emailCaseReport === 'function' ? '✅' : '❌'));
      updateStatus('- emailToAttorney: ' + (typeof window.emailToAttorney === 'function' ? '✅' : '❌'));
      updateStatus('- scheduleconsultation: ' + (typeof window.scheduleconsultation === 'function' ? '✅' : '❌'));
    }, 500);
  </script>
</body>
</html>
