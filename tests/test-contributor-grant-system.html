<head>

    <title>Contributor Grant System - Test Suite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;

        .container {
            max-width: 1200px;

        .test-section {

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>

<body>
    <div class="container">
        <h1>🧪 Contributor Grant System - Test Suite</h1>
        <p>Comprehensive testing for the donation-based contributor and grant system</p>

        <div class="test-section">
            <h2>System Status</h2>
            <div id="systemStatus"></div>
        </div>

        <div class="test-section">
            <h2>Quick Actions</h2>
            <button onclick="runAllTests()">🚀 Run All Tests</button>
            <button onclick="clearAllData()">🗑️ Clear All Data</button>
            <button onclick="generateTestData()">📊 Generate Test Data</button>
            <button onclick="viewContributors()">👥 View Contributors</button>
        </div>

        <div class="test-section">
            <h2>Test Results</h2>
            <div id="testResults"></div>
        </div>

        <div class="test-section">
            <h2>System Statistics</h2>
            <div id="systemStats"></div>
        </div>

        <div class="test-section">
            <h2>Test Data</h2>
            <div id="testData"></div>
        </div>
    </div>

    <script src="contributor-grant-system.js"></script>
    <script src="grant-contributor-integration.js"></script>
    <script>
        // Test utilities
        function logTest(message, status) {
            const resultsDiv = document.getElementById('testResults');
            const testResult = document.createElement('div');
            testResult.className = `test-result ${status}`;
            
            let icon = '';
            if (status === 'success') icon = '✅';
            else if (status === 'fail') icon = '❌';
            else icon = 'ℹ️';
            
            testResult.innerHTML = `
                <span class="icon">${icon}</span>
                <span>${message}</span>
            `;
            
            resultsDiv.appendChild(testResult);
        }

        // Check system status
        function checkSystemStatus() {
            const statusDiv = document.getElementById('systemStatus');
            let html = '';
            
            if (typeof window.ContributorGrantSystem !== 'undefined') {
                html += '<div class="test-result success"><span class="icon">✅</span><span>ContributorGrantSystem loaded</span></div>';
            } else {
                html += '<div class="test-result fail"><span class="icon">❌</span><span>ContributorGrantSystem NOT loaded</span></div>';
            }
            
            if (typeof window.grantContributorIntegration !== 'undefined') {
                html += '<div class="test-result success"><span class="icon">✅</span><span>GrantContributorIntegration loaded</span></div>';
            } else {
                html += '<div class="test-result fail"><span class="icon">❌</span><span>GrantContributorIntegration NOT loaded</span></div>';
            }
            
            statusDiv.innerHTML = html;
        }

        // Test 1: Profile Creation
        function testProfileCreation() {
            logTest('Testing profile creation...', 'info');
            
            try {
                const profile = ContributorGrantSystem.initializeProfile({
                    name: 'Test User ' + Date.now(),
                    email: 'test' + Date.now() + '@example.com',
                    donationAmount: 500,
                    skills: ['JavaScript', 'React', 'Node.js'],
                    githubUsername: 'testuser',
                    bio: 'Test contributor profile'
                });
                
                if (profile && profile.id && profile.tier === 'gold' && profile.revenueShare === 15) {
                    logTest('✓ Profile created successfully with correct tier and revenue share', 'success');
                    return true;
                } else {
                    logTest('✗ Profile creation failed - incorrect data', 'fail');
                    return false;
                }
            } catch (error) {
                logTest('✗ Profile creation error: ' + error.message, 'fail');
                return false;
            }
        }

        // Test 2: Contribution Tracking
        function testContributionTracking() {
            logTest('Testing contribution tracking...', 'info');
            
            try {
                const contributors = ContributorGrantSystem.getContributors();
                const contributorIds = Object.keys(contributors);
                
                if (contributorIds.length === 0) {
                    logTest('! No contributors found, creating test contributor', 'info');
                    testProfileCreation();
                    return testContributionTracking();
                }
                
                const contributorId = contributorIds[0];
                const contribution = ContributorGrantSystem.addContribution(contributorId, {
                    projectId: 'test-project-' + Date.now(),
                    projectName: 'Test Project',
                    type: 'development',
                    hours: 40,
                    description: 'Test contribution'
                });
                
                if (contribution && contribution.id) {
                    logTest('✓ Contribution added successfully', 'success');
                    return true;
                } else {
                    logTest('✗ Contribution tracking failed', 'fail');
                    return false;
                }
            } catch (error) {
                logTest('✗ Contribution tracking error: ' + error.message, 'fail');
                return false;
            }
        }

        // Test 3: Grant Linking
        function testGrantLinking() {
            logTest('Testing grant application linking...', 'info');
            
            try {
                const contributors = ContributorGrantSystem.getContributors();
                const contributorIds = Object.keys(contributors);
                
                if (contributorIds.length === 0) {
                    logTest('! No contributors found for grant linking', 'fail');
                    return false;
                }
                
                const contributorId = contributorIds[0];
                const grantLink = ContributorGrantSystem.linkToGrantApplication(contributorId, {
                    grantId: 'TEST-GRANT-' + Date.now(),
                    grantName: 'Test SBIR Grant',
                    grantAgency: 'NSF',
                    projectIds: ['test-project'],
                    fundingAmount: 250000
                });
                
                if (grantLink && grantLink.grantId) {
                    logTest('✓ Grant application linked successfully', 'success');
                    return true;
                } else {
                    logTest('✗ Grant linking failed', 'fail');
                    return false;
                }
            } catch (error) {
                logTest('✗ Grant linking error: ' + error.message, 'fail');
                return false;
            }
        }

        // Test 4: Revenue Distribution
        function testRevenueDistribution() {
            logTest('Testing revenue distribution...', 'info');
            
            try {
                const contributors = ContributorGrantSystem.getContributors();
                const contributorIds = Object.keys(contributors);
                
                if (contributorIds.length === 0) {
                    logTest('! No contributors for revenue distribution', 'fail');
                    return false;
                }
                
                // Get a grant ID from first contributor
                const contributor = contributors[contributorIds[0]];
                if (contributor.grantApplications.length === 0) {
                    logTest('! No grant applications to distribute revenue', 'info');
                    return false;
                }
                
                const grantId = contributor.grantApplications[0].grantId;
                const result = ContributorGrantSystem.processGrantSuccess(grantId, 250000);
                
                if (result.success && result.totalDistributed > 0) {
                    logTest(`✓ Revenue distributed: $${result.totalDistributed} to ${result.contributorCount} contributors`, 'success');
                    return true;
                } else {
                    logTest('✗ Revenue distribution failed', 'fail');
                    return false;
                }
            } catch (error) {
                logTest('✗ Revenue distribution error: ' + error.message, 'fail');
                return false;
            }
        }

        // Test 5: Team Generation
        function testTeamGeneration() {
            logTest('Testing grant team section generation...', 'info');
            
            try {
                const contributors = ContributorGrantSystem.getContributors();
                const contributorIds = Object.keys(contributors);
                
                if (contributorIds.length === 0) {
                    logTest('! No contributors for team generation', 'fail');
                    return false;
                }
                
                // Ensure we have contributions
                const contributor = contributors[contributorIds[0]];
                const projectIds = contributor.projects.length > 0 
                    ? contributor.projects 
                    : ['test-project'];
                
                const teamSection = ContributorGrantSystem.generateGrantTeamSection(projectIds);
                
                if (teamSection && teamSection.includes('Team Qualifications') && teamSection.includes('Revenue Share')) {
                    logTest('✓ Grant team section generated successfully', 'success');
                    return true;
                } else {
                    logTest('✗ Team generation failed', 'fail');
                    return false;
                }
            } catch (error) {
                logTest('✗ Team generation error: ' + error.message, 'fail');
                return false;
            }
        }

        // Test 6: Statistics
        function testStatistics() {
            logTest('Testing statistics calculation...', 'info');
            
            try {
                const stats = ContributorGrantSystem.getContributorStats();
                
                if (stats && typeof stats.total === 'number' && typeof stats.totalDonations === 'number') {
                    logTest(`✓ Statistics calculated: ${stats.total} contributors, $${stats.totalDonations} donations`, 'success');
                    return true;
                } else {
                    logTest('✗ Statistics calculation failed', 'fail');
                    return false;
                }
            } catch (error) {
                logTest('✗ Statistics error: ' + error.message, 'fail');
                return false;
            }
        }

        // Run all tests
        function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            
            logTest('========== STARTING TEST SUITE ==========', 'info');
            
            const tests = [
                { name: 'Profile Creation', fn: testProfileCreation },
                { name: 'Contribution Tracking', fn: testContributionTracking },
                { name: 'Grant Linking', fn: testGrantLinking },
                { name: 'Revenue Distribution', fn: testRevenueDistribution },
                { name: 'Team Generation', fn: testTeamGeneration },
                { name: 'Statistics', fn: testStatistics }
            ];
            
            let passed = 0;
            let failed = 0;
            
            tests.forEach(test => {
                if (test.fn()) {
                    passed++;
                } else {
                    failed++;
                }
            });
            
            logTest(`========== TEST SUITE COMPLETE ==========`, 'info');
            logTest(`Results: ${passed} passed, ${failed} failed`, passed > failed ? 'success' : 'fail');
            
            updateSystemStats();
        }

        // Generate test data
        function generateTestData() {
            logTest('Generating test data...', 'info');
            
            try {
                const tiers = ['bronze', 'silver', 'gold', 'platinum'];
                const names = ['Alice', 'Bob', 'Carol', 'Dave', 'Eve', 'Frank', 'Grace', 'Henry'];
                const skills = [
                    ['JavaScript', 'React', 'Node.js'],
                    ['Python', 'Django', 'Flask'],
                    ['Java', 'Spring', 'Hibernate'],
                    ['Go', 'Kubernetes', 'Docker'],
                    ['Rust', 'WebAssembly', 'Systems']
                ];
                
                for (let i = 0; i < 5; i++) {
                    const tier = tiers[Math.floor(Math.random() * tiers.length)];
                    const donationAmount = ContributorGrantSystem.CONFIG.tiers[tier].donation;
                    const name = names[i];
                    
                    const profile = ContributorGrantSystem.initializeProfile({
                        name: name + ' Contributor',
                        email: name.toLowerCase() + '@example.com',
                        donationAmount: donationAmount,
                        skills: skills[Math.floor(Math.random() * skills.length)],
                        githubUsername: name.toLowerCase(),
                        bio: `Test ${tier} contributor`
                    });
                    
                    // Add contributions
                    for (let j = 0; j < 3; j++) {
                        ContributorGrantSystem.addContribution(profile.id, {
                            projectId: `project-${j}`,
                            projectName: `Project ${j}`,
                            type: 'development',
                            hours: 20 + (j * 10),
                            description: `Worked on feature ${j}`
                        });
                    }
                    
                    // Link to grant
                    ContributorGrantSystem.linkToGrantApplication(profile.id, {
                        grantId: `GRANT-${i}`,
                        grantName: `Test Grant ${i}`,
                        grantAgency: 'NSF',
                        projectIds: [`project-${i}`],
                        fundingAmount: 250000
                    });
                }
                
                logTest('✓ Test data generated successfully: 5 contributors', 'success');
                updateSystemStats();
                viewContributors();
            } catch (error) {
                logTest('✗ Test data generation error: ' + error.message, 'fail');
            }
        }

        // Clear all data
        function clearAllData() {
            if (confirm('Are you sure you want to clear all data? This cannot be undone.')) {
                localStorage.removeItem(ContributorGrantSystem.CONFIG.storageKey);
                localStorage.removeItem(ContributorGrantSystem.CONFIG.revenueKey);
                logTest('✓ All data cleared', 'success');
                updateSystemStats();
                document.getElementById('testData').innerHTML = '<p>No data to display</p>';
            }
        }

        // View contributors
        function viewContributors() {
            const contributors = ContributorGrantSystem.getContributors();
            const dataDiv = document.getElementById('testData');
            
            if (Object.keys(contributors).length === 0) {
                dataDiv.innerHTML = '<p>No contributors found. Generate test data or register via the portal.</p>';
                return;
            }
            
            let html = '<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse;">';
            html += '<tr style="background: #6366f1; color: white;"><th>Name</th><th>Tier</th><th>Donations</th><th>Earnings</th><th>Projects</th><th>Grants</th></tr>';
            
            Object.values(contributors).forEach(c => {
                const tierConfig = ContributorGrantSystem.CONFIG.tiers[c.tier];
                html += `
                    <tr style="border-bottom: 1px solid #ddd;">
                        <td style="padding: 10px;">${tierConfig.badge} ${c.name}</td>
                        <td>${tierConfig.name}</td>
                        <td>$${c.donationAmount}</td>
                        <td style="color: #10b981; font-weight: bold;">$${c.totalEarnings.toLocaleString()}</td>
                        <td>${c.projects.length}</td>
                        <td>${c.grantApplications.length}</td>
                    </tr>
                `;
            });
            
            html += '</table></div>';
            dataDiv.innerHTML = html;
        }

        // Update system stats
        function updateSystemStats() {
            const stats = ContributorGrantSystem.getContributorStats();
            const statsDiv = document.getElementById('systemStats');
            
            statsDiv.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${stats.total}</div>
                        <div class="stat-label">Total Contributors</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">$${stats.totalDonations.toLocaleString()}</div>
                        <div class="stat-label">Total Donations</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">$${stats.totalEarnings.toLocaleString()}</div>
                        <div class="stat-label">Total Earnings</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.totalContributions}</div>
                        <div class="stat-label">Total Contributions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.grantApplications}</div>
                        <div class="stat-label">Grant Applications</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.fundedGrants}</div>
                        <div class="stat-label">Funded Grants</div>
                    </div>
                </div>
            `;
        }

        // Initialize
        checkSystemStatus();
        updateSystemStats();
        
        console.log('Test suite loaded. Use runAllTests() to start testing.');
    </script>
</body>
</html>
