<body>
    <h1>🧪 Management Agent System - Integration Test</h1>
    
    <div class="test-section">
        <h2>📋 Test Suite</h2>
        <button onclick="runAllTests()">▶️ Run All Tests</button>
        <button onclick="testManagementAgent()">🤖 Test Management Agent</button>
        <button onclick="testPayPalIntegration()">💰 Test PayPal Integration</button>
        <button onclick="testContractorSystem()">👥 Test Contractor System</button>
        <button onclick="clearResults()">🗑️ Clear Results</button>
    </div>
    
    <div class="test-section">
        <h2>📊 Test Results</h2>
        <div id="results"></div>
    </div>
    
    <div class="test-section">
        <h2>📈 System Status</h2>
        <div id="status"></div>
    </div>
    
    <div class="test-section">
        <h2>💳 PayPal Test Buttons</h2>
        <p style="color: #ccc;">Test payment buttons (configured to: barbrickdesign@gmail.com)</p>
        <div id="test-payment-button"></div>
        <div id="test-donation-button" style="margin-top: 20px;"></div>
    </div>

    <script>
        let testResults = [];
        
        function logResult(message, isError = false, isWarning = false) {
            const className = isError ? 'error' : (isWarning ? 'warning' : '');
            testResults.push({ message, className });
            updateResultsDisplay();
        }
        
        function updateResultsDisplay() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = testResults.map(result => 
                `<div class="test-result ${result.className}">${result.message}</div>`
            ).join('');
        }
        
        function clearResults() {
            testResults = [];
            updateResultsDisplay();
        }
        
        async function runAllTests() {
            clearResults();
            logResult('🚀 Starting comprehensive test suite...');
            
            await testManagementAgent();
            await testPayPalIntegration();
            await testContractorSystem();
            
            logResult('✅ All tests completed!');
        }
        
        async function testManagementAgent() {
            logResult('🤖 Testing Management Deployment Agent...');
            
            try {
                // Check if agent exists
                if (typeof ManagementDeploymentAgent === 'undefined') {
                    logResult('❌ ManagementDeploymentAgent class not found', true);
                    return;
                }
                logResult('✅ ManagementDeploymentAgent class loaded');
                
                // Check if auto-initialized
                if (typeof window.mdAgent === 'undefined') {
                    logResult('⚠️ Agent not auto-initialized, creating manually...', false, true);
                    window.mdAgent = new ManagementDeploymentAgent();
                } else {
                    logResult('✅ Agent auto-initialized successfully');
                }
                
                // Get status
                const status = window.mdAgent.getStatus();
                logResult(`✅ Agent ID: ${status.agentId}`);
                logResult(`✅ Agent Version: ${status.version}`);
                logResult(`✅ Tests Run: ${status.testsRun}`);
                logResult(`✅ Issues Found: ${status.issuesFound}`);
                logResult(`✅ Issues Fixed: ${status.issuesFixed}`);
                
                // Test logging
                window.mdAgent.log('info', 'Test log message from integration test');
                logResult('✅ Logging functionality works');
                
                // Check tracked files
                logResult(`✅ Tracking ${window.mdAgent.trackedFiles.size} files`);
                
                // Check configuration
                logResult(`✅ Auto-fix enabled: ${window.mdAgent.config.autoFix}`);
                logResult(`✅ Crawl interval: ${window.mdAgent.config.crawlInterval}ms`);
                
            } catch (error) {
                logResult(`❌ Management Agent test failed: ${error.message}`, true);
            }
        }
        
        async function testPayPalIntegration() {
            logResult('💰 Testing PayPal Integration...');
            
            try {
                // Check if PayPal integration exists
                if (typeof PayPalPaymentIntegration === 'undefined') {
                    logResult('❌ PayPalPaymentIntegration class not found', true);
                    return;
                }
                logResult('✅ PayPalPaymentIntegration class loaded');
                
                // Check if auto-initialized
                if (typeof window.paypalIntegration === 'undefined') {
                    logResult('⚠️ PayPal not auto-initialized, creating manually...', false, true);
                    window.paypalIntegration = new PayPalPaymentIntegration();
                    await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for init
                } else {
                    logResult('✅ PayPal auto-initialized successfully');
                }
                
                // Check configuration
                logResult(`✅ PayPal Email: ${window.paypalIntegration.paypalEmail}`);
                logResult(`✅ Currency: ${window.paypalIntegration.config.currency}`);
                logResult(`✅ Initialized: ${window.paypalIntegration.isInitialized}`);
                
                // Create test buttons
                logResult('🔘 Creating test payment button...');
                window.paypalIntegration.createPaymentButton('test-payment-button', {
                    amount: 10.00,
                    description: 'Test Payment',
                    itemName: 'Integration Test'
                });
                logResult('✅ Payment button created');
                
                logResult('🔘 Creating test donation button...');
                window.paypalIntegration.createDonationButton('test-donation-button');
                logResult('✅ Donation button created');
                
                // Test transaction history
                const history = window.paypalIntegration.getTransactionHistory();
                logResult(`✅ Transaction history loaded: ${history.totalTransactions} transactions`);
                
                // Test payment link generation
                const paymentLink = window.paypalIntegration.generatePayPalLink(25.00, 'Test', 'Test Item');
                if (paymentLink.includes('barbrickdesign@gmail.com')) {
                    logResult('✅ Payment link correctly configured to barbrickdesign@gmail.com');
                } else {
                    logResult('❌ Payment link not correctly configured', true);
                }
                
            } catch (error) {
                logResult(`❌ PayPal Integration test failed: ${error.message}`, true);
            }
        }
        
        async function testContractorSystem() {
            logResult('👥 Testing Contractor Payment System...');
            
            try {
                // Check if contractor system exists
                if (typeof ContractorPaymentSystem === 'undefined') {
                    logResult('⚠️ ContractorPaymentSystem class not found (may not be loaded)', false, true);
                    return;
                }
                logResult('✅ ContractorPaymentSystem class loaded');
                
                // Create instance
                const contractorSystem = new ContractorPaymentSystem();
                logResult('✅ Contractor system initialized');
                
                // Check PayPal configuration
                if (contractorSystem.config.paypalEmail === 'barbrickdesign@gmail.com') {
                    logResult('✅ PayPal email correctly configured in contractor system');
                } else {
                    logResult('❌ PayPal email not correctly configured', true);
                }
                
                logResult(`✅ PayPal payments enabled: ${contractorSystem.config.enablePayPalPayments}`);
                
                // Check PayPal integration connection
                if (contractorSystem.paypalIntegration) {
                    logResult('✅ Contractor system connected to PayPal integration');
                } else {
                    logResult('⚠️ Contractor system PayPal integration pending...', false, true);
                }
                
            } catch (error) {
                logResult(`❌ Contractor System test failed: ${error.message}`, true);
            }
        }
        
        function updateStatus() {
            const statusDiv = document.getElementById('status');
            let html = '<pre>';
            
            // Management Agent Status
            if (window.mdAgent) {
                const status = window.mdAgent.getStatus();
                html += '🤖 MANAGEMENT AGENT\n';
                html += `   Status: ${status.isRunning ? '🟢 Running' : '🔴 Stopped'}\n`;
                html += `   Agent ID: ${status.agentId}\n`;
                html += `   Version: ${status.version}\n`;
                html += `   Tests Run: ${status.testsRun}\n`;
                html += `   Issues: ${status.issuesFound} found, ${status.issuesFixed} fixed\n`;
                html += `   Active Issues: ${status.brokenFeatures.length}\n`;
                html += '\n';
            }
            
            // PayPal Status
            if (window.paypalIntegration) {
                const history = window.paypalIntegration.getTransactionHistory();
                html += '💰 PAYPAL INTEGRATION\n';
                html += `   Email: ${window.paypalIntegration.paypalEmail}\n`;
                html += `   Initialized: ${window.paypalIntegration.isInitialized ? '✅' : '❌'}\n`;
                html += `   Currency: ${window.paypalIntegration.config.currency}\n`;
                html += `   Transactions: ${history.totalTransactions}\n`;
                html += `   Total Amount: $${history.totalAmount.toFixed(2)}\n`;
                html += '\n';
            }
            
            // System Info
            html += '🖥️ SYSTEM INFO\n';
            html += `   Page: ${window.location.pathname}\n`;
            html += `   Browser: ${navigator.userAgent.split(' ').pop() || 'Unknown'}\n`;
            html += `   LocalStorage Available: ${typeof localStorage !== 'undefined' ? '✅' : '❌'}\n`;
            
            html += '</pre>';
            statusDiv.innerHTML = html;
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                logResult('✅ Test page loaded');
                logResult('ℹ️ Click "Run All Tests" to begin testing');
                updateStatus();
                setInterval(updateStatus, 5000); // Update status every 5 seconds
            }, 1000);
        });
    </script>
