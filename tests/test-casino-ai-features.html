        // Test Loss Calculator Logic
        function testLossCalculator() {
            const resultDiv = document.getElementById('lossCalcResult');
            resultDiv.innerHTML = '<p>Testing loss calculator...</p>';
            
            const tests = [];
            
            // Test 1: Basic calculation
            const dailyTransactions = 500;
            const avgTransactionValue = 250;
            const errorRate = 0.8;
            const avgErrorAmount = 125;
            
            const errorsPerDay = (dailyTransactions * (errorRate / 100));
            const dailyLoss = errorsPerDay * avgErrorAmount;
            const monthlyLoss = dailyLoss * 30;
            const annualLoss = dailyLoss * 365;
            const preventionRate = 0.95;
            const annualSavings = annualLoss * preventionRate;
            
            tests.push({
                name: 'Daily Loss Calculation',
                expected: 500, // 4 errors * 125 per error
                actual: dailyLoss,
                pass: Math.abs(dailyLoss - 500) < 1
            });
            
            tests.push({
                name: 'Annual Loss Calculation',
                expected: 182500, // 500 * 365
                actual: annualLoss,
                pass: Math.abs(annualLoss - 182500) < 1
            });
            
            tests.push({
                name: 'Annual Savings Calculation (95% prevention)',
                expected: 173375, // 182500 * 0.95
                actual: annualSavings,
                pass: Math.abs(annualSavings - 173375) < 1
            });
            
            // Test 2: Edge cases
            const zeroErrorRate = 0;
            const zeroErrors = (dailyTransactions * (zeroErrorRate / 100));
            tests.push({
                name: 'Zero Error Rate',
                expected: 0,
                actual: zeroErrors,
                pass: zeroErrors === 0
            });
            
            // Display results
            let html = '<h3>Test Results:</h3>';
            tests.forEach(test => {
                const className = test.pass ? '' : 'fail';
                html += `<div class="test-result ${className}">
                    ${test.pass ? '✅' : '❌'} <strong>${test.name}</strong><br>
                    Expected: ${test.expected.toFixed(2)}<br>
                    Actual: ${test.actual.toFixed(2)}<br>
                    Status: ${test.pass ? 'PASS' : 'FAIL'}
                </div>`;
            });
            
            resultDiv.innerHTML = html;
        }
        
        // Test Pricing Calculator Logic
        function testPricingCalculator() {
            const resultDiv = document.getElementById('pricingCalcResult');
            resultDiv.innerHTML = '<p>Testing pricing calculator...</p>';
            
            const tests = [];
            
            // Test 1: Basic pricing (100 machines, 24 cameras, 12 workers)
            const machines = 100;
            const cameras = 24;
            const workers = 12;
            
            const machineRate = 12; // 50-200 range
            const cameraRate = 180; // 10-50 range
            const workerRate = 175; // 10-50 range
            
            const machineCost = machines * machineRate;
            const cameraCost = cameras * cameraRate;
            const workerCost = workers * workerRate;
            const totalCost = machineCost + cameraCost + workerCost;
            
            tests.push({
                name: 'Machine Cost Calculation',
                expected: 1200,
                actual: machineCost,
                pass: machineCost === 1200
            });
            
            tests.push({
                name: 'Camera Cost Calculation',
                expected: 4320,
                actual: cameraCost,
                pass: cameraCost === 4320
            });
            
            tests.push({
                name: 'Worker Cost Calculation',
                expected: 2100,
                actual: workerCost,
                pass: workerCost === 2100
            });
            
            tests.push({
                name: 'Total Cost Calculation',
                expected: 7620,
                actual: totalCost,
                pass: totalCost === 7620
            });
            
            // Test 2: Volume discounts
            const largeMachines = 250;
            const largeMachineRate = 10; // Over 200
            const largeMachineCost = largeMachines * largeMachineRate;
            
            tests.push({
                name: 'Volume Discount (250 machines)',
                expected: 2500,
                actual: largeMachineCost,
                pass: largeMachineCost === 2500
            });
            
            // Test 3: Value-based pricing (10% of annual savings)
            const annualSavings = 171000;
            const valueBasedPrice = Math.round((annualSavings * 0.10) / 12);
            
            tests.push({
                name: 'Value-Based Pricing (10% monthly)',
                expected: 1425,
                actual: valueBasedPrice,
                pass: Math.abs(valueBasedPrice - 1425) < 1
            });
            
            // Display results
            let html = '<h3>Test Results:</h3>';
            tests.forEach(test => {
                const className = test.pass ? '' : 'fail';
                html += `<div class="test-result ${className}">
                    ${test.pass ? '✅' : '❌'} <strong>${test.name}</strong><br>
                    Expected: $${test.expected.toLocaleString()}<br>
                    Actual: $${test.actual.toLocaleString()}<br>
                    Status: ${test.pass ? 'PASS' : 'FAIL'}
                </div>`;
            });
            
            resultDiv.innerHTML = html;
        }
