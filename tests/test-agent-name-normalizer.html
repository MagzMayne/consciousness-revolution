<body>
    <h1>🧪 Agent Name Normalizer Test Suite</h1>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="testResults"></div>
    </div>

    <div class="test-section">
        <h2>Interactive Tests</h2>
        <button onclick="testAgentInput('arya')">Test: arya</button>
        <button onclick="testAgentInput('araya')">Test: araya</button>
        <button onclick="testAgentInput('Araya')">Test: Araya (uppercase)</button>
        <button onclick="testAgentInput('ARAYA')">Test: ARAYA (all caps)</button>
        <button onclick="testAgentInput('austin')">Test: austin</button>
        <button onclick="runAllTests()">Run All Tests</button>
    </div>

    <div class="test-section">
        <h2>Content Sharing Test</h2>
        <button onclick="testContentSharing()">Test Content Sharing with 'araya'</button>
    </div>

    <script>
        function log(message, isPass = true) {
            const resultsDiv = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${isPass ? '' : 'fail'}`;
            resultDiv.innerHTML = `${isPass ? '✅' : '❌'} ${message}`;
            resultsDiv.appendChild(resultDiv);
        }

        function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            
            log('Starting test suite...');

            // Test 1: Basic normalization
            const test1 = window.agentNameNormalizer.normalizeAgentName('araya');
            log(`normalizeAgentName('araya') = '${test1}'`, test1 === 'arya');

            // Test 2: Case insensitive
            const test2 = window.agentNameNormalizer.normalizeAgentName('ARAYA');
            log(`normalizeAgentName('ARAYA') = '${test2}'`, test2 === 'arya');

            // Test 3: Already canonical
            const test3 = window.agentNameNormalizer.normalizeAgentName('arya');
            log(`normalizeAgentName('arya') = '${test3}'`, test3 === 'arya');

            // Test 4: isValidAgent with alias
            const test4 = window.agentNameNormalizer.isValidAgent('araya');
            log(`isValidAgent('araya') = ${test4}`, test4 === true);

            // Test 5: isValidAgent with canonical
            const test5 = window.agentNameNormalizer.isValidAgent('arya');
            log(`isValidAgent('arya') = ${test5}`, test5 === true);

            // Test 6: getCanonicalName
            const test6 = window.agentNameNormalizer.getCanonicalName('araya');
            log(`getCanonicalName('araya') = '${test6}'`, test6 === 'arya');

            // Test 7: getAllAgentNames includes alias
            const allNames = window.agentNameNormalizer.getAllAgentNames();
            const test7 = allNames.includes('araya');
            log(`getAllAgentNames() includes 'araya' = ${test7}`, test7 === true);

            // Test 8: getAliases
            const aliases = window.agentNameNormalizer.getAliases('arya');
            const test8 = aliases.includes('araya');
            log(`getAliases('arya') includes 'araya' = ${test8}`, test8 === true);

            // Test 9: Other agents remain unchanged
            const test9 = window.agentNameNormalizer.normalizeAgentName('austin');
            log(`normalizeAgentName('austin') = '${test9}'`, test9 === 'austin');

            log('Test suite complete!');
        }

        function testAgentInput(input) {
            document.getElementById('testResults').innerHTML = '';
            log(`Testing input: "${input}"`);
            
            const normalized = window.agentNameNormalizer.normalizeAgentName(input);
            log(`Normalized to: "${normalized}"`);
            
            const isValid = window.agentNameNormalizer.isValidAgent(input);
            log(`Is valid agent: ${isValid}`, isValid);
            
            const canonical = window.agentNameNormalizer.getCanonicalName(input);
            log(`Canonical name: "${canonical}"`);
        }

        function testContentSharing() {
            document.getElementById('testResults').innerHTML = '';
            log('Testing Content Sharing Manager with "araya"...');
            
            if (window.contentSharingManager) {
                // Test hasAccess with 'araya'
                const hasAccess1 = window.contentSharingManager.hasAccess('araya');
                log(`contentSharingManager.hasAccess('araya') = ${hasAccess1}`, hasAccess1 === true);
                
                // Test hasAccess with 'arya'
                const hasAccess2 = window.contentSharingManager.hasAccess('arya');
                log(`contentSharingManager.hasAccess('arya') = ${hasAccess2}`, hasAccess2 === true);
                
                // Test hasAccess with uppercase
                const hasAccess3 = window.contentSharingManager.hasAccess('ARAYA');
                log(`contentSharingManager.hasAccess('ARAYA') = ${hasAccess3}`, hasAccess3 === true);
                
                log('Content Sharing Manager tests complete!');
            } else {
                log('Content Sharing Manager not initialized', false);
            }
        }

        // Run tests on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                log('Agent Name Normalizer loaded: ' + (typeof window.agentNameNormalizer !== 'undefined'), 
                    typeof window.agentNameNormalizer !== 'undefined');
                log('Content Sharing Manager loaded: ' + (typeof window.contentSharingManager !== 'undefined'),
                    typeof window.contentSharingManager !== 'undefined');
            }, 100);
        });
    </script>
