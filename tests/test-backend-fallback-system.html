<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-2ED5A522">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Fallback System Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0b1020;
      color: #e5e7eb;
    }
    .test-card {
      background: #151a2c;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      border: 1px solid #2b3553;
    }
    .status {
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
      margin: 8px 0;
    }
    .status.success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .status.warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .test-result {
      margin: 10px 0;
      padding: 8px;
      background: #0f1424;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    button {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin: 8px 4px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    h1 { color: #60a5fa; }
    h2 { color: #a78bfa; margin-top: 0; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
  <h1>🧪 Backend Fallback System Test Suite</h1>
  
  <div class="test-card">
    <h2>1. System Initialization</h2>
    <div id="init-status" class="status warning">Testing...</div>
    <div id="init-result" class="test-result"></div>
  </div>
  
  <div class="test-card">
    <h2>2. Backend Health Check</h2>
    <div id="health-status" class="status warning">Testing...</div>
    <div id="health-result" class="test-result"></div>
  </div>
  
  <div class="test-card">
    <h2>3. Frontend Mode (localStorage)</h2>
    <button onclick="testFrontendMode()">Run Frontend Test</button>
    <div id="frontend-status" class="status warning">Not tested</div>
    <div id="frontend-result" class="test-result"></div>
  </div>
  
  <div class="test-card">
    <h2>4. Email Operations</h2>
    <button onclick="testEmailOperations()">Test Email CRUD</button>
    <div id="email-status" class="status warning">Not tested</div>
    <div id="email-result" class="test-result"></div>
  </div>
  
  <div class="test-card">
    <h2>5. Lead Operations</h2>
    <button onclick="testLeadOperations()">Test Lead CRUD</button>
    <div id="lead-status" class="status warning">Not tested</div>
    <div id="lead-result" class="test-result"></div>
  </div>
  
  <div class="test-card">
    <h2>6. Statistics</h2>
    <button onclick="testStats()">Test Stats Calculation</button>
    <div id="stats-status" class="status warning">Not tested</div>
    <div id="stats-result" class="test-result"></div>
  </div>
  
  <div class="test-card">
    <h2>Test Summary</h2>
    <div id="summary-result" class="test-result">
      Run tests to see summary...
    </div>
  </div>

  <script src="src/utils/backend-fallback-system.js"></script>
  <script>
    let backendSystem;
    let testResults = {
      passed: 0,
      failed: 0,
      warnings: 0
    };
    
    // Initialize system
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        setStatus('init-status', 'warning', 'Initializing...');
        setResult('init-result', 'Creating BackendFallbackSystem instance...');
        
        backendSystem = new BackendFallbackSystem({
          backendUrl: 'http://localhost:4000',
          checkInterval: 5000,
          storagePrefix: 'test_'
        });
        
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        const status = backendSystem.getStatus();
        setResult('init-result', `✓ System initialized
Mode: ${status.mode}
Backend URL: ${status.backendUrl}
Backend Available: ${status.backendAvailable}`);
        
        setStatus('init-status', 'success', '✓ Initialized');
        testResults.passed++;
        
        // Auto-run health check
        await testHealthCheck();
        
      } catch (error) {
        setStatus('init-status', 'error', '✗ Failed');
        setResult('init-result', `Error: ${error.message}`);
        testResults.failed++;
      }
    });
    
    async function testHealthCheck() {
      try {
        setStatus('health-status', 'warning', 'Checking...');
        setResult('health-result', 'Checking backend health...');
        
        const isHealthy = await backendSystem.checkBackendHealth();
        const status = backendSystem.getStatus();
        
        if (isHealthy) {
          setResult('health-result', `✓ Backend is ONLINE
URL: ${status.backendUrl}
Mode: ${status.mode}
Last check: ${status.lastHealthCheck || 'N/A'}`);
          setStatus('health-status', 'success', '✓ Backend Online');
          testResults.passed++;
        } else {
          setResult('health-result', `⚠ Backend is OFFLINE (this is OK!)
URL: ${status.backendUrl}
Mode: ${status.mode} (will use localStorage)
Backend fallback system activated automatically`);
          setStatus('health-status', 'warning', '⚠ Backend Offline (Frontend mode)');
          testResults.warnings++;
        }
        
        updateSummary();
      } catch (error) {
        setStatus('health-status', 'error', '✗ Error');
        setResult('health-result', `Error: ${error.message}`);
        testResults.failed++;
        updateSummary();
      }
    }
    
    async function testFrontendMode() {
      try {
        setStatus('frontend-status', 'warning', 'Testing...');
        setResult('frontend-result', 'Testing frontend storage...');
        
        // Clear test data
        localStorage.removeItem('test_emails');
        localStorage.removeItem('test_leads');
        
        // Test localStorage write
        const testData = { id: 'test123', value: 'test' };
        backendSystem.saveToStorage('test_emails', [testData]);
        
        // Test localStorage read
        const retrieved = backendSystem.getFromStorage('test_emails');
        
        if (retrieved && retrieved[0].id === 'test123') {
          setResult('frontend-result', `✓ Frontend storage working
✓ localStorage write: OK
✓ localStorage read: OK
✓ Data persistence: OK`);
          setStatus('frontend-status', 'success', '✓ Passed');
          testResults.passed++;
        } else {
          throw new Error('Data mismatch');
        }
        
        updateSummary();
      } catch (error) {
        setStatus('frontend-status', 'error', '✗ Failed');
        setResult('frontend-result', `Error: ${error.message}`);
        testResults.failed++;
        updateSummary();
      }
    }
    
    async function testEmailOperations() {
      try {
        setStatus('email-status', 'warning', 'Testing...');
        setResult('email-result', 'Testing email CRUD operations...');
        
        // Clear test data
        localStorage.removeItem('test_emails');
        
        // CREATE
        const createResult = await backendSystem.request('/emails', {
          method: 'POST',
          body: {
            to_email: 'test@example.com',
            subject: 'Test Email',
            html: '<p>Test content</p>',
            status: 'sent'
          }
        });
        
        if (!createResult.success) throw new Error('Create failed');
        const emailId = createResult.data.id;
        
        // READ ALL
        const listResult = await backendSystem.request('/emails', {
          method: 'GET'
        });
        
        if (!listResult.success || listResult.data.length === 0) {
          throw new Error('Read failed');
        }
        
        // UPDATE
        const updateResult = await backendSystem.request(`/emails/${emailId}`, {
          method: 'PATCH',
          body: { status: 'confirmed' }
        });
        
        if (!updateResult.success) throw new Error('Update failed');
        
        setResult('email-result', `✓ Email operations working
✓ CREATE: OK (id: ${emailId})
✓ READ: OK (${listResult.data.length} emails)
✓ UPDATE: OK (status: confirmed)
Source: ${createResult.source}`);
        
        setStatus('email-status', 'success', '✓ Passed');
        testResults.passed++;
        updateSummary();
        
      } catch (error) {
        setStatus('email-status', 'error', '✗ Failed');
        setResult('email-result', `Error: ${error.message}`);
        testResults.failed++;
        updateSummary();
      }
    }
    
    async function testLeadOperations() {
      try {
        setStatus('lead-status', 'warning', 'Testing...');
        setResult('lead-result', 'Testing lead CRUD operations...');
        
        // Clear test data
        localStorage.removeItem('test_leads');
        
        // CREATE
        const createResult = await backendSystem.request('/leads', {
          method: 'POST',
          body: {
            name: 'John Doe',
            email: 'john@example.com',
            company: 'Test Corp',
            status: 'new'
          }
        });
        
        if (!createResult.success) throw new Error('Create failed');
        const leadId = createResult.data.id;
        
        // READ ALL
        const listResult = await backendSystem.request('/leads', {
          method: 'GET'
        });
        
        if (!listResult.success || listResult.data.length === 0) {
          throw new Error('Read failed');
        }
        
        // UPDATE
        const updateResult = await backendSystem.request(`/leads/${leadId}`, {
          method: 'PATCH',
          body: { status: 'active', revenue: 1000 }
        });
        
        if (!updateResult.success) throw new Error('Update failed');
        
        // ADD THREAD
        const threadResult = await backendSystem.request(`/leads/${leadId}/threads`, {
          method: 'POST',
          body: {
            message: 'Test thread message',
            author: 'agent',
            type: 'note'
          }
        });
        
        if (!threadResult.success) throw new Error('Thread create failed');
        
        setResult('lead-result', `✓ Lead operations working
✓ CREATE: OK (id: ${leadId})
✓ READ: OK (${listResult.data.length} leads)
✓ UPDATE: OK (status: active, revenue: $1000)
✓ ADD THREAD: OK
Source: ${createResult.source}`);
        
        setStatus('lead-status', 'success', '✓ Passed');
        testResults.passed++;
        updateSummary();
        
      } catch (error) {
        setStatus('lead-status', 'error', '✗ Failed');
        setResult('lead-result', `Error: ${error.message}`);
        testResults.failed++;
        updateSummary();
      }
    }
    
    async function testStats() {
      try {
        setStatus('stats-status', 'warning', 'Testing...');
        setResult('stats-result', 'Testing statistics calculation...');
        
        const result = await backendSystem.request('/stats', {
          method: 'GET'
        });
        
        if (!result.success) throw new Error('Stats request failed');
        
        const stats = result.data;
        
        setResult('stats-result', `✓ Statistics working
Emails: ${stats.emails.total} (${stats.emails.confirmed} confirmed)
Confirmation Rate: ${stats.emails.confirmationRate}%
Leads: ${stats.leads.total} (${stats.leads.active} active)
Revenue: ${stats.revenue.formatted}
Source: ${result.source}`);
        
        setStatus('stats-status', 'success', '✓ Passed');
        testResults.passed++;
        updateSummary();
        
      } catch (error) {
        setStatus('stats-status', 'error', '✗ Failed');
        setResult('stats-result', `Error: ${error.message}`);
        testResults.failed++;
        updateSummary();
      }
    }
    
    function setStatus(elementId, type, text) {
      const el = document.getElementById(elementId);
      el.className = `status ${type}`;
      el.textContent = text;
    }
    
    function setResult(elementId, text) {
      document.getElementById(elementId).textContent = text;
    }
    
    function updateSummary() {
      const total = testResults.passed + testResults.failed + testResults.warnings;
      const percentage = total > 0 ? ((testResults.passed / total) * 100).toFixed(0) : 0;
      
      document.getElementById('summary-result').innerHTML = `
<strong>Test Results Summary</strong>

✓ Passed: ${testResults.passed}
⚠ Warnings: ${testResults.warnings}
✗ Failed: ${testResults.failed}
Total: ${total}

Success Rate: ${percentage}%

${testResults.failed === 0 && testResults.passed > 0 ? '🎉 All critical tests passed!' : ''}
${testResults.warnings > 0 ? '⚠️ Backend offline - using frontend fallback mode (expected)' : ''}
      `;
    }
  </script>
</body>
</html>
