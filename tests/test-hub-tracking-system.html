<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-BC892882">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Tracking System Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0f1419;
            color: #e0e0e0;
        }
        
        h1 {
            color: #3aa0ff;
        }
        
        .test-section {
            background: #1a1f2e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #2a3545;
        }
        
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .success {
            background: rgba(63, 211, 139, 0.1);
            border-left: 3px solid #3fd38b;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border-left: 3px solid #ff6b6b;
        }
        
        .info {
            background: rgba(58, 160, 255, 0.1);
            border-left: 3px solid #3aa0ff;
        }
        
        button {
            background: #3aa0ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        
        button:hover {
            background: #5bb0ff;
        }
        
        .widget-container {
            margin: 20px 0;
            padding: 20px;
            background: #0f1419;
            border-radius: 8px;
        }
        
        pre {
            background: #0a0e14;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <h1>🧪 Hub Tracking System Test</h1>
    
    <div class="test-section">
        <h2>1. Module Loading</h2>
        <div id="module-loading-results"></div>
    </div>
    
    <div class="test-section">
        <h2>2. User Identity Detection</h2>
        <div id="identity-results"></div>
        <button onclick="testIdentity()">Test Identity Manager</button>
    </div>
    
    <div class="test-section">
        <h2>3. Hub Visit Tracking</h2>
        <div id="tracking-results"></div>
        <button onclick="testTracking()">Test Visit Tracking</button>
        <button onclick="simulateVisits()">Simulate Hub Visits</button>
    </div>
    
    <div class="test-section">
        <h2>4. Recent Hubs Widget</h2>
        <div id="widget-container" class="widget-container"></div>
        <button onclick="testWidget()">Test Widget</button>
    </div>
    
    <div class="test-section">
        <h2>5. Statistics & Recommendations</h2>
        <div id="stats-results"></div>
        <button onclick="testStatistics()">Show Statistics</button>
        <button onclick="testRecommendations()">Show Recommendations</button>
    </div>
    
    <div class="test-section">
        <h2>6. Export Data</h2>
        <div id="export-results"></div>
        <button onclick="exportData()">Export Visit Data</button>
        <button onclick="clearData()">Clear All Data</button>
    </div>

    <!-- Load the tracking system -->
    <script src="/src/core/user-identity-manager.js"></script>
    <script src="/src/core/hub-visit-tracker.js"></script>
    <script src="/src/core/recent-hubs-widget.js"></script>

    <script>
        // Test results display functions
        function displayResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const result = document.createElement('div');
            result.className = `test-result ${type}`;
            result.textContent = message;
            container.appendChild(result);
        }

        function displayJSON(containerId, obj) {
            const container = document.getElementById(containerId);
            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(obj, null, 2);
            container.appendChild(pre);
        }

        // Check module loading
        window.addEventListener('load', () => {
            const modules = [
                { name: 'userIdentityManager', obj: window.userIdentityManager },
                { name: 'hubVisitTracker', obj: window.hubVisitTracker },
                { name: 'recentHubsWidget', obj: window.recentHubsWidget }
            ];

            modules.forEach(module => {
                const type = module.obj ? 'success' : 'error';
                const status = module.obj ? '✅ Loaded' : '❌ Not loaded';
                displayResult('module-loading-results', `${module.name}: ${status}`, type);
            });
        });

        // Test identity manager
        function testIdentity() {
            const results = document.getElementById('identity-results');
            results.innerHTML = '';

            if (!window.userIdentityManager) {
                displayResult('identity-results', 'Identity Manager not available', 'error');
                return;
            }

            const identity = window.userIdentityManager.getIdentity();
            const userId = window.userIdentityManager.getUserId();
            const displayName = window.userIdentityManager.getDisplayName();
            const isIdentified = window.userIdentityManager.isIdentified();
            const isVerified = window.userIdentityManager.isVerified();

            displayResult('identity-results', `User ID: ${userId}`, 'success');
            displayResult('identity-results', `Display Name: ${displayName}`, 'success');
            displayResult('identity-results', `Identified: ${isIdentified}`, isIdentified ? 'success' : 'info');
            displayResult('identity-results', `Verified: ${isVerified}`, isVerified ? 'success' : 'info');
            displayJSON('identity-results', identity);
        }

        // Test tracking
        function testTracking() {
            const results = document.getElementById('tracking-results');
            results.innerHTML = '';

            if (!window.hubVisitTracker) {
                displayResult('tracking-results', 'Hub Visit Tracker not available', 'error');
                return;
            }

            const currentHub = window.hubVisitTracker.currentHub;
            const recentHubs = window.hubVisitTracker.getRecentHubs(5);
            const mostVisited = window.hubVisitTracker.getMostVisitedHubs(5);

            displayResult('tracking-results', `Current Hub: ${currentHub || 'None (not a hub page)'}`, 'info');
            displayResult('tracking-results', `Recent Hubs: ${recentHubs.length}`, 'success');
            displayResult('tracking-results', `Most Visited: ${mostVisited.length}`, 'success');
            
            if (recentHubs.length > 0) {
                displayJSON('tracking-results', recentHubs);
            }
        }

        // Simulate hub visits for testing
        function simulateVisits() {
            if (!window.hubVisitTracker) {
                alert('Hub Visit Tracker not available');
                return;
            }

            const hubsToSimulate = [
                'devValueHub.html',
                'agentHub.html',
                'team-launchpad-hub.html',
                'devPortal.html',
                'topstep-hub.html'
            ];

            hubsToSimulate.forEach((hubId, index) => {
                setTimeout(() => {
                    window.hubVisitTracker.trackVisit(hubId);
                    displayResult('tracking-results', `Simulated visit to: ${hubId}`, 'success');
                }, index * 500);
            });

            setTimeout(() => {
                displayResult('tracking-results', '✅ All simulated visits completed', 'success');
                testTracking();
            }, hubsToSimulate.length * 500 + 500);
        }

        // Test widget
        function testWidget() {
            const container = document.getElementById('widget-container');
            container.innerHTML = '<div id="recent-hubs-widget"></div>';
            
            if (window.recentHubsWidget) {
                window.recentHubsWidget.container = document.getElementById('recent-hubs-widget');
                window.recentHubsWidget.render();
                displayResult('widget-container', '✅ Widget rendered', 'success');
            } else {
                displayResult('widget-container', '❌ Widget not available', 'error');
            }
        }

        // Test statistics
        function testStatistics() {
            const results = document.getElementById('stats-results');
            results.innerHTML = '';

            if (!window.hubVisitTracker) {
                displayResult('stats-results', 'Hub Visit Tracker not available', 'error');
                return;
            }

            const stats = window.hubVisitTracker.getStatistics();
            displayJSON('stats-results', stats);
        }

        // Test recommendations
        function testRecommendations() {
            const results = document.getElementById('stats-results');
            
            if (!window.hubVisitTracker) {
                displayResult('stats-results', 'Hub Visit Tracker not available', 'error');
                return;
            }

            const recommendations = window.hubVisitTracker.getRecommendations(5);
            displayResult('stats-results', `Found ${recommendations.length} recommendations`, 'success');
            displayJSON('stats-results', recommendations);
        }

        // Export data
        function exportData() {
            const results = document.getElementById('export-results');
            results.innerHTML = '';

            if (!window.hubVisitTracker) {
                displayResult('export-results', 'Hub Visit Tracker not available', 'error');
                return;
            }

            const data = window.hubVisitTracker.exportVisitData();
            displayJSON('export-results', data);
            
            // Create download link
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hub-visits-${Date.now()}.json`;
            a.textContent = 'Download JSON';
            a.style.display = 'block';
            a.style.marginTop = '10px';
            results.appendChild(a);
        }

        // Clear data
        function clearData() {
            if (!window.hubVisitTracker) {
                alert('Hub Visit Tracker not available');
                return;
            }

            if (confirm('Are you sure you want to clear all visit data?')) {
                window.hubVisitTracker.clearVisitData();
                const results = document.getElementById('export-results');
                results.innerHTML = '';
                displayResult('export-results', '✅ All data cleared', 'success');
                
                // Refresh tests
                testIdentity();
                testTracking();
            }
        }
    </script>
</body>
</html>
