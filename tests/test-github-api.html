<body>
  <div class="container">
    <h1>GitHub API Test for FunctionChecker</h1>
    <p>This page tests the GitHub API integration used by FunctionChecker.html</p>
    
    <div>
      <input type="text" id="repo" placeholder="owner/repo (e.g., octocat/Hello-World)" value="octocat/Hello-World" style="width: 300px;">
      <button onclick="testAPI()">Test GitHub API</button>
    </div>
    
    <div id="result"></div>
  </div>

  <script>
    async function testAPI() {
      const resultDiv = document.getElementById('result');
      const repoInput = document.getElementById('repo').value.trim();
      
      if (!repoInput) {
        resultDiv.innerHTML = '<span class="error">Please enter a repository</span>';
        return;
      }
      
      const parts = repoInput.split('/');
      if (parts.length !== 2) {
        resultDiv.innerHTML = '<span class="error">Invalid format. Use owner/repo</span>';
        return;
      }
      
      const [owner, repo] = parts;
      resultDiv.innerHTML = 'Testing GitHub API...\n';
      
      try {
        // Test 1: Fetch repository tree
        resultDiv.innerHTML += '\n1. Fetching repository tree...\n';
        const treeUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`;
        const treeResponse = await fetch(treeUrl, {
          headers: {
            'Accept': 'application/vnd.github.v3+json'
          },
          mode: 'cors'
        });
        
        if (!treeResponse.ok) {
          throw new Error(`Tree API error: ${treeResponse.status} ${treeResponse.statusText}`);
        }
        
        const treeData = await treeResponse.json();
        resultDiv.innerHTML += `<span class="success">✓ Successfully fetched tree with ${treeData.tree.length} items</span>\n`;
        
        // Test 2: Fetch a sample file
        const sampleFile = treeData.tree.find(item => 
          item.type === 'blob' && 
          (item.path.endsWith('.js') || item.path.endsWith('.py') || item.path.endsWith('.md'))
        );
        
        if (sampleFile) {
          resultDiv.innerHTML += `\n2. Fetching sample file: ${sampleFile.path}...\n`;
          // Properly encode file path - split by / and encode each segment
          const pathSegments = sampleFile.path.split('/').map(seg => encodeURIComponent(seg));
          const encodedPath = pathSegments.join('/');
          const fileUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodedPath}`;
          const fileResponse = await fetch(fileUrl, {
            headers: {
              'Accept': 'application/vnd.github.v3.raw'
            },
            mode: 'cors'
          });
          
          if (!fileResponse.ok) {
            throw new Error(`File API error: ${fileResponse.status} ${fileResponse.statusText}`);
          }
          
          const fileContent = await fileResponse.text();
          resultDiv.innerHTML += `<span class="success">✓ Successfully fetched file (${fileContent.length} bytes)</span>\n`;
          resultDiv.innerHTML += `\nFirst 200 characters:\n${fileContent.substring(0, 200)}...\n`;
        }
        
        resultDiv.innerHTML += '\n<span class="success">✓✓✓ All tests passed! GitHub API integration is working.</span>\n';
        resultDiv.innerHTML += '\nThis confirms that FunctionChecker.html GitHub integration should work correctly when:\n';
        resultDiv.innerHTML += '- Accessed via HTTPS (when deployed to GitHub Pages)\n';
        resultDiv.innerHTML += '- Browser extensions (ad blockers) are not blocking GitHub API requests\n';
        
      } catch (error) {
        resultDiv.innerHTML += `\n<span class="error">✗ Error: ${error.message}</span>\n\n`;
        
        if (error.message.includes('Failed to fetch')) {
          resultDiv.innerHTML += 'This error typically indicates:\n';
          resultDiv.innerHTML += '1. Browser extension (ad blocker) blocking the request\n';
          resultDiv.innerHTML += '2. CORS restrictions (less likely with GitHub API)\n';
          resultDiv.innerHTML += '3. Network connectivity issues\n\n';
          resultDiv.innerHTML += 'Try:\n';
          resultDiv.innerHTML += '- Disabling browser extensions\n';
          resultDiv.innerHTML += '- Accessing this page via HTTPS when deployed\n';
        } else if (error.message.includes('404')) {
          resultDiv.innerHTML += 'Repository not found. Check the owner/repo format.\n';
        } else if (error.message.includes('403')) {
          resultDiv.innerHTML += 'GitHub API rate limit exceeded or access forbidden.\n';
        }
        
        console.error(error);
      }
    }
  </script>
