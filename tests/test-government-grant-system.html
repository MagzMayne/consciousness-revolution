<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Grant System - Test Suite</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #0f0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #0a0a0a;
            padding: 30px;
            border: 2px solid #0f0;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 5px;
        }
        .test-section h2 {
            color: #ff0;
            margin-bottom: 15px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        .test-result.pass {
            background: #0a3;
            border-left: 4px solid #0f0;
        }
        .test-result.fail {
            background: #a03;
            border-left: 4px solid #f00;
        }
        .test-result.info {
            background: #036;
            border-left: 4px solid #0ff;

        button {
            background: #0a0;

        }
        button:hover {

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>🧪 Government Grant System Test Suite</h1>
        
        <div class="test-section">
            <h2>System Status</h2>
            <div id="system-status"></div>
            <button onclick="runAllTests()">▶️ Run All Tests</button>
            <button onclick="clearResults()">🗑️ Clear Results</button>
        </div>

        <div class="test-section">
            <h2>1. System Initialization Tests</h2>
            <div id="init-tests"></div>
            <button onclick="testInitialization()">Run Init Tests</button>
        </div>

        <div class="test-section">
            <h2>2. Grants Database Tests</h2>
            <div id="database-tests"></div>
            <button onclick="testDatabase()">Run Database Tests</button>
        </div>

        <div class="test-section">
            <h2>3. AI Matching Tests</h2>
            <div id="matching-tests"></div>
            <button onclick="testMatching()">Run Matching Tests</button>
        </div>

        <div class="test-section">
            <h2>4. Access Management Tests</h2>
            <div id="access-tests"></div>
            <button onclick="testAccessManagement()">Run Access Tests</button>
        </div>

        <div class="test-section">
            <h2>5. Proposal Generation Tests</h2>
            <div id="proposal-tests"></div>
            <button onclick="testProposalGeneration()">Run Proposal Tests</button>
        </div>
    </div>

    <!-- Load the systems -->
    <script src="government-grant-ai-system.js"></script>
    <script src="grant-access-manager.js"></script>

    <script>
        // Test utilities
        function logResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            container.appendChild(div);
        }

        function clearResults() {
            ['system-status', 'init-tests', 'database-tests', 'matching-tests', 
             'access-tests', 'proposal-tests'].forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
        }

        // Test 1: System Initialization
        function testInitialization() {
            const container = 'init-tests';
            clearResults();
            
            try {
                // Check if systems loaded
                if (typeof window.governmentGrantAI !== 'undefined') {
                    logResult(container, '✅ Government Grant AI system loaded', 'pass');
                } else {
                    logResult(container, '❌ Government Grant AI system not found', 'fail');
                    return;
                }

                if (typeof window.grantAccessManager !== 'undefined') {
                    logResult(container, '✅ Grant Access Manager loaded', 'pass');
                } else {
                    logResult(container, '❌ Grant Access Manager not found', 'fail');
                    return;
                }

                // Check database loaded
                const stats = window.governmentGrantAI.getStatistics();
                logResult(container, `✅ Loaded ${stats.totalGrants} grants`, 'pass');
                logResult(container, `📊 Total funding available: ${stats.totalFunding}`, 'info');
                logResult(container, `📈 Average success rate: ${stats.averageSuccessRate}`, 'info');

                // Check access tiers
                const tiers = Object.keys(window.grantAccessManager.accessTiers);
                logResult(container, `✅ ${tiers.length} access tiers configured: ${tiers.join(', ')}`, 'pass');

            } catch (error) {
                logResult(container, `❌ Initialization failed: ${error.message}`, 'fail');
            }
        }

        // Test 2: Database Tests
        function testDatabase() {
            const container = 'database-tests';
            document.getElementById(container).innerHTML = '';

            try {
                const ai = window.governmentGrantAI;
                
                // Test getting all grants
                const allGrants = ai.getAllGrants();
                logResult(container, `✅ Retrieved ${allGrants.length} total grants`, 'pass');

                // Test category filtering
                const techGrants = ai.getGrantsByCategory('technology');
                logResult(container, `✅ Found ${techGrants.length} technology grants`, 'pass');

                const healthGrants = ai.getGrantsByCategory('health');
                logResult(container, `✅ Found ${healthGrants.length} health grants`, 'pass');

                // Test search functionality
                const sbirResults = ai.searchGrants('SBIR');
                logResult(container, `✅ Search for "SBIR" found ${sbirResults.length} results`, 'pass');

                const energyResults = ai.searchGrants('energy');
                logResult(container, `✅ Search for "energy" found ${energyResults.length} results`, 'pass');

                // Test grant amounts
                const largeGrants = allGrants.filter(g => g.amount.max >= 1000000);
                logResult(container, `📊 ${largeGrants.length} grants offer $1M+ funding`, 'info');

                const smallGrants = allGrants.filter(g => g.amount.max < 500000);
                logResult(container, `📊 ${smallGrants.length} grants offer under $500K funding`, 'info');

            } catch (error) {
                logResult(container, `❌ Database test failed: ${error.message}`, 'fail');
            }
        }

        // Test 3: AI Matching
        function testMatching() {
            const container = 'matching-tests';
            document.getElementById(container).innerHTML = '';

            try {
                const ai = window.governmentGrantAI;

                // Create test profiles
                const testProfiles = [
                    {
                        name: 'Tech Startup',
                        categories: ['technology'],
                        eligibility: ['small_business', 'tech_innovation'],
                        fundingNeeded: 250000,
                        focusAreas: ['technology', 'innovation']
                    },
                    {
                        name: 'Clean Energy Company',
                        categories: ['energy'],
                        eligibility: ['small_business', 'energy_focus'],
                        fundingNeeded: 1000000,
                        focusAreas: ['clean_energy', 'sustainability']
                    },
                    {
                        name: 'Medical Research Lab',
                        categories: ['health'],
                        eligibility: ['university', 'research_institution'],
                        fundingNeeded: 2000000,
                        focusAreas: ['health_research', 'biotechnology']
                    }
                ];

                testProfiles.forEach(profile => {
                    const matches = ai.matchGrants(profile);
                    logResult(container, 
                        `✅ ${profile.name}: Found ${matches.length} matching grants`, 
                        'pass');
                    
                    if (matches.length > 0) {
                        const topMatch = matches[0];
                        logResult(container,
                            `   Top match: ${topMatch.grant.name} (score: ${topMatch.score}, ` +
                            `success rate: ${Math.round(topMatch.estimatedSuccessRate * 100)}%)`,
                            'info');
                    }
                });

            } catch (error) {
                logResult(container, `❌ Matching test failed: ${error.message}`, 'fail');
            }
        }

        // Test 4: Access Management
        function testAccessManagement() {
            const container = 'access-tests';
            document.getElementById(container).innerHTML = '';

            try {
                const manager = window.grantAccessManager;

                // Test granting access
                const testEmail = `test-${Date.now()}@example.com`;
                const accessGrant = manager.grantAccess(testEmail, 'professional', {
                    transactionId: 'TEST-' + Date.now(),
                    amount: 500,
                    method: 'PayPal'
                });

                if (accessGrant.success) {
                    logResult(container, `✅ Created professional tier access for ${testEmail}`, 'pass');
                    logResult(container, `   Access Key: ${accessGrant.accessGrant.accessKey}`, 'info');
                    logResult(container, `   Expires: ${accessGrant.accessGrant.expiryDateReadable}`, 'info');

                    // Test verification
                    const verification = manager.verifyAccess(accessGrant.accessGrant.accessKey);
                    if (verification.valid) {
                        logResult(container, `✅ Access key verified successfully`, 'pass');
                        logResult(container, `   Tier: ${verification.tierName}`, 'info');
                        logResult(container, `   Features: ${verification.features.length}`, 'info');
                    } else {
                        logResult(container, `❌ Access verification failed`, 'fail');
                    }

                    // Test statistics
                    const stats = manager.getStatistics();
                    logResult(container, `📊 Total access grants: ${stats.total}`, 'info');
                    logResult(container, `📊 Active grants: ${stats.active}`, 'info');
                    logResult(container, `📊 Total revenue: $${stats.totalRevenue.toLocaleString()}`, 'info');

                } else {
                    logResult(container, `❌ Failed to grant access: ${accessGrant.error}`, 'fail');
                }

            } catch (error) {
                logResult(container, `❌ Access management test failed: ${error.message}`, 'fail');
            }
        }

        // Test 5: Proposal Generation
        function testProposalGeneration() {
            const container = 'proposal-tests';
            document.getElementById(container).innerHTML = '';

            try {
                const ai = window.governmentGrantAI;

                // Set access level for testing
                localStorage.setItem('grant_portal_access', JSON.stringify({
                    tier: 'professional',
                    expiryDate: Date.now() + (365 * 24 * 60 * 60 * 1000)
                }));
                ai.checkAccess();

                // Get a test grant
                const grants = ai.getAllGrants();
                const testGrant = grants.find(g => g.id === 'sbir-phase1');

                if (!testGrant) {
                    logResult(container, '❌ Test grant not found', 'fail');
                    return;
                }

                // Create test profile
                const testProfile = {
                    organization: 'Test Tech Startup',
                    focusAreas: ['technology', 'innovation'],
                    fundingNeeded: 250000
                };

                // Generate proposal
                const proposal = ai.generateProposal(testGrant, testProfile);

                if (proposal.error) {
                    logResult(container, `❌ Proposal generation failed: ${proposal.error}`, 'fail');
                } else {
                    logResult(container, `✅ Generated proposal for ${proposal.grantName}`, 'pass');
                    logResult(container, `   Sections: ${Object.keys(proposal.sections).length}`, 'info');
                    logResult(container, `   Estimated time: ${proposal.estimatedCompletionTime}`, 'info');
                    logResult(container, `   Required docs: ${proposal.requiredDocuments.length}`, 'info');

                    // Test budget generation
                    const budget = proposal.sections.budget;
                    logResult(container, `✅ Budget generated: ${ai.formatCurrency(budget.totalRequest)}`, 'pass');
                    logResult(container, `   Personnel: ${ai.formatCurrency(budget.breakdown.personnel)}`, 'info');
                    logResult(container, `   Equipment: ${ai.formatCurrency(budget.breakdown.equipment)}`, 'info');
                }

                // Test optimization
                const optimization = ai.optimizeApplication({}, testGrant);
                if (optimization.error) {
                    logResult(container, `❌ Optimization failed: ${optimization.error}`, 'fail');
                } else {
                    logResult(container, `✅ Application optimization completed`, 'pass');
                    logResult(container, `   Score improvement: ${optimization.originalScore} → ${optimization.optimizedScore}`, 'info');
                    logResult(container, `   Recommendations: ${optimization.recommendations.length}`, 'info');
                }

            } catch (error) {
                logResult(container, `❌ Proposal generation test failed: ${error.message}`, 'fail');
            }
        }

        // Run all tests
        function runAllTests() {
            clearResults();
            
            logResult('system-status', '🚀 Running all tests...', 'info');
            
            setTimeout(() => testInitialization(), 100);
            setTimeout(() => testDatabase(), 500);
            setTimeout(() => testMatching(), 1000);
            setTimeout(() => testAccessManagement(), 1500);
            setTimeout(() => testProposalGeneration(), 2000);
            
            setTimeout(() => {
                logResult('system-status', '✅ All tests completed!', 'pass');
            }, 2500);
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            logResult('system-status', '⏳ Systems loading...', 'info');
            setTimeout(() => {
                logResult('system-status', '✅ Systems ready. Click "Run All Tests" to begin.', 'pass');
            }, 500);
        });
    </script>
</body>
</html>
