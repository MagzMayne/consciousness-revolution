<body>
    <h1>🧪 FuturesByAgentR Toggle Fix Test</h1>
    
    <div class="info">
        <strong>Testing:</strong> Toggle between signaler and trading modes with paid license
    </div>
    
    <div class="test-section">
        <h2>Setup</h2>
        <button onclick="clearAccess()">Clear Access</button>
        <button onclick="setTestAccess()">Set Test Access</button>
        <button onclick="setPaidLicense()">Set Paid License</button>
        <div id="setup-status"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Manual Test</h2>
        <p>After setting test access above, click below to open FuturesByAgentR.html and test the toggle manually:</p>
        <button onclick="window.open('FuturesByAgentR.html', '_blank')">Open FuturesByAgentR.html</button>
    </div>
    
    <script src="access-code-system.js"></script>
    <script>
        function clearAccess() {
            localStorage.removeItem('access_code_data');
            localStorage.removeItem('futuresbyagentr_license');
            updateStatus('All access cleared', 'info');
        }
        
        function setAdminAccess() {
            // Simulate entering the admin code
            const accessData = {
                code: 'TEST-ACCESS-CODE',
                type: 'admin',
                activatedAt: Date.now(),
                expiresAt: Infinity,
                deviceId: 'test-device',
                features: ['signals', 'trading', 'analytics']
            };
            
            localStorage.setItem('access_code_data', JSON.stringify(accessData));
            updateStatus('Test access activated', 'pass');
            runTests();
        }
        
        function setPaidLicense() {
            const licenseData = {
                paid: true,
                timestamp: new Date().toISOString(),
                profitOwed: 0,
                profitableTrades: 0
            };
            localStorage.setItem('futuresbyagentr_license', JSON.stringify(licenseData));
            updateStatus('Paid license activated', 'pass');
            runTests();
        }
        
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('setup-status');
            statusDiv.innerHTML = `<div class="test-result ${type}">${message}</div>`;
        }
        
        function runTests() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '';
            
            // Test 1: Check if AccessCodeSystem is available
            addTestResult('AccessCodeSystem available', typeof AccessCodeSystem !== 'undefined', resultsDiv);
            
            // Test 2: Check access status
            if (typeof AccessCodeSystem !== 'undefined') {
                const status = AccessCodeSystem.getAccessStatus();
                addTestResult('Has access via AccessCodeSystem', status.hasAccess, resultsDiv);
                addTestResult(`Access type is correct (${status.type})`, 
                    status.type === 'admin' || status.hasAccess, resultsDiv);
            }
            
            // Test 3: Check if license data is set
            const licenseData = localStorage.getItem('futuresbyagentr_license');
            addTestResult('License data exists', licenseData !== null, resultsDiv);
            
            if (licenseData) {
                try {
                    const license = JSON.parse(licenseData);
                    addTestResult('License is paid', license.paid === true, resultsDiv);
                } catch (e) {
                    addTestResult('License data parseable', false, resultsDiv);
                }
            }
            
            // Test 4: Simulate checkLicenseStatus function
            let paidLicense = false;
            if (licenseData) {
                try {
                    const license = JSON.parse(licenseData);
                    paidLicense = license.paid === true;
                } catch (e) {
                    console.error('Error parsing license data:', e);
                }
            }
            
            // Check AccessCodeSystem for admin bypass
            if (typeof AccessCodeSystem !== 'undefined') {
                const codeStatus = AccessCodeSystem.getAccessStatus();
                if (codeStatus.hasAccess) {
                    paidLicense = true;
                    addTestResult('Access granted via AccessCodeSystem', true, resultsDiv);
                }
            }
            
            addTestResult('Final paidLicense status', paidLicense, resultsDiv);
            
            // Test 5: Simulate toggle check
            const newMode = 'auto-trader';
            const codeStatus = AccessCodeSystem.getAccessStatus();
            const hasAccess = paidLicense || codeStatus.hasAccess;
            
            addTestResult('Toggle would allow auto-trader mode', hasAccess, resultsDiv);
            addTestResult(`hasAccess calculation (paidLicense: ${paidLicense}, codeStatus.hasAccess: ${codeStatus.hasAccess})`, 
                hasAccess, resultsDiv);
        }
        
        function addTestResult(testName, passed, container) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `${passed ? '✅' : '❌'} ${testName}`;
            container.appendChild(resultDiv);
        }
        
        // Initial check
        document.addEventListener('DOMContentLoaded', () => {
            const status = AccessCodeSystem.getAccessStatus();
            if (status.hasAccess) {
                updateStatus(`Access already active (${status.type})`, 'pass');
                runTests();
            } else {
                updateStatus('No access set - use buttons above to test', 'info');
            }
        });
    </script>
</body>
