<body>
    <h1>🧪 SQL Schema Analyzer Test Suite</h1>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">▶️ Run All Tests</button>
        <button onclick="clearResults()">🗑️ Clear Results</button>
    </div>
    
    <div id="results"></div>
    
    <!-- Load the SQL analyzer -->
    <script src="js/sql-schema-analyzer.js"></script>
    <script src="js/sql-visualizer.js"></script>
    
    <script>
        let testResults = [];
        
        // Test 1: Schema Parsing
        function testSchemaParsing() {
            console.log('Running Test 1: Schema Parsing...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE users (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    username VARCHAR(50) NOT NULL,
                    email VARCHAR(100) UNIQUE
                );
            `;
            
            const schemas = analyzer.parseSchema(sql);
            
            const passed = schemas.length === 1 && 
                          schemas[0].name === 'users' && 
                          schemas[0].columns.length === 3;
            
            return {
                name: 'Schema Parsing',
                passed: passed,
                message: passed ? 
                    `✅ Successfully parsed 1 table with 3 columns` : 
                    `❌ Failed to parse schema correctly`,
                details: `Found ${schemas.length} table(s), ${schemas[0]?.columns.length || 0} columns`
            };
        }
        
        // Test 2: Security Vulnerability Detection
        function testSecurityDetection() {
            console.log('Running Test 2: Security Vulnerability Detection...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE users (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    password VARCHAR(255) NOT NULL,
                    ssn VARCHAR(11)
                );
            `;
            
            analyzer.parseSchema(sql);
            const vulnerabilities = analyzer.analyzeSecurityVulnerabilities();
            
            const hasCritical = vulnerabilities.some(v => v.severity === 'CRITICAL');
            const hasPasswordIssue = vulnerabilities.some(v => 
                v.type === 'UNENCRYPTED_SENSITIVE_DATA' && v.column === 'password'
            );
            
            const passed = hasCritical && hasPasswordIssue;
            
            return {
                name: 'Security Vulnerability Detection',
                passed: passed,
                message: passed ? 
                    `✅ Detected ${vulnerabilities.length} vulnerabilities including sensitive data` : 
                    `❌ Failed to detect security issues`,
                details: `Found ${vulnerabilities.filter(v => v.severity === 'CRITICAL').length} critical issues`
            };
        }
        
        // Test 3: Performance Optimization Detection
        function testPerformanceOptimization() {
            console.log('Running Test 3: Performance Optimization Detection...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE products (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    name VARCHAR(200) NOT NULL,
                    description TEXT,
                    price DECIMAL(10,2)
                );
            `;
            
            analyzer.parseSchema(sql);
            const optimizations = analyzer.analyzePerformanceOptimizations();
            
            const hasMissingIndexes = optimizations.some(o => o.type === 'MISSING_INDEXES');
            const hasFullTextSuggestion = optimizations.some(o => o.type === 'MISSING_FULLTEXT_INDEX');
            
            const passed = hasMissingIndexes && hasFullTextSuggestion;
            
            return {
                name: 'Performance Optimization Detection',
                passed: passed,
                message: passed ? 
                    `✅ Detected ${optimizations.length} optimization opportunities` : 
                    `❌ Failed to detect performance issues`,
                details: `Found ${optimizations.filter(o => o.priority === 'HIGH').length} high priority optimizations`
            };
        }
        
        // Test 4: Relationship Extraction
        function testRelationshipExtraction() {
            console.log('Running Test 4: Relationship Extraction...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE users (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    username VARCHAR(50) NOT NULL
                );
                
                CREATE TABLE orders (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    user_id INT NOT NULL,
                    FOREIGN KEY (user_id) REFERENCES users(id)
                );
            `;
            
            analyzer.parseSchema(sql);
            const relationships = analyzer.extractRelationships();
            
            const passed = relationships.length === 1 && 
                          relationships[0].source === 'orders' &&
                          relationships[0].target === 'users';
            
            return {
                name: 'Relationship Extraction',
                passed: passed,
                message: passed ? 
                    `✅ Successfully extracted ${relationships.length} foreign key relationship` : 
                    `❌ Failed to extract relationships`,
                details: `Found ${relationships.length} relationship(s) between tables`
            };
        }
        
        // Test 5: Column Type Detection
        function testColumnTypeDetection() {
            console.log('Running Test 5: Column Type Detection...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE test (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    name VARCHAR(100) NOT NULL,
                    price DECIMAL(10,2),
                    active BOOLEAN DEFAULT true
                );
            `;
            
            analyzer.parseSchema(sql);
            const schemas = analyzer.schemas;
            const columns = schemas[0].columns;
            
            const hasInt = columns.some(c => c.type === 'INT');
            const hasVarchar = columns.some(c => c.type === 'VARCHAR');
            const hasDecimal = columns.some(c => c.type === 'DECIMAL');
            
            const passed = hasInt && hasVarchar && hasDecimal;
            
            return {
                name: 'Column Type Detection',
                passed: passed,
                message: passed ? 
                    `✅ Successfully detected all column types` : 
                    `❌ Failed to detect column types correctly`,
                details: `Detected types: ${columns.map(c => c.type).join(', ')}`
            };
        }
        
        // Test 6: Index Detection
        function testIndexDetection() {
            console.log('Running Test 6: Index Detection...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE products (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    category_id INT,
                    name VARCHAR(200),
                    INDEX idx_category (category_id),
                    INDEX idx_name (name)
                );
            `;
            
            analyzer.parseSchema(sql);
            const schemas = analyzer.schemas;
            const indexes = schemas[0].indexes;
            
            const passed = indexes.length === 2 &&
                          indexes.some(i => i.name === 'idx_category') &&
                          indexes.some(i => i.name === 'idx_name');
            
            return {
                name: 'Index Detection',
                passed: passed,
                message: passed ? 
                    `✅ Successfully detected ${indexes.length} indexes` : 
                    `❌ Failed to detect indexes`,
                details: `Found indexes: ${indexes.map(i => i.name).join(', ')}`
            };
        }
        
        // Test 7: Complete Analysis Report
        function testCompleteReport() {
            console.log('Running Test 7: Complete Analysis Report...');
            
            const analyzer = new SQLSchemaAnalyzer();
            const sql = `
                CREATE TABLE users (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    username VARCHAR(50) NOT NULL,
                    password VARCHAR(255)
                );
                
                CREATE TABLE posts (
                    id INT PRIMARY KEY AUTO_INCREMENT,
                    user_id INT,
                    content TEXT,
                    FOREIGN KEY (user_id) REFERENCES users(id)
                );
            `;
            
            analyzer.parseSchema(sql);
            analyzer.analyzeSecurityVulnerabilities();
            analyzer.analyzePerformanceOptimizations();
            analyzer.extractRelationships();
            
            const report = analyzer.getAnalysisReport();
            
            const passed = report.summary.totalTables === 2 &&
                          report.vulnerabilities.length > 0 &&
                          report.optimizations.length > 0 &&
                          report.relationships.length === 1;
            
            return {
                name: 'Complete Analysis Report',
                passed: passed,
                message: passed ? 
                    `✅ Generated comprehensive report with all components` : 
                    `❌ Failed to generate complete report`,
                details: `Tables: ${report.summary.totalTables}, Vulnerabilities: ${report.vulnerabilities.length}, Optimizations: ${report.optimizations.length}, Relationships: ${report.relationships.length}`
            };
        }
        
        // Run all tests
        function runAllTests() {
            testResults = [];
            
            testResults.push(testSchemaParsing());
            testResults.push(testSecurityDetection());
            testResults.push(testPerformanceOptimization());
            testResults.push(testRelationshipExtraction());
            testResults.push(testColumnTypeDetection());
            testResults.push(testIndexDetection());
            testResults.push(testCompleteReport());
            
            displayResults();
        }
        
        // Display test results
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            const passedCount = testResults.filter(t => t.passed).length;
            const totalCount = testResults.length;
            
            let html = `
                <div class="test-section">
                    <h2>Test Results: ${passedCount}/${totalCount} Passed</h2>
            `;
            
            testResults.forEach((result, index) => {
                const statusClass = result.passed ? 'pass' : 'fail';
                html += `
                    <div class="test-case">
                        <h3>Test ${index + 1}: ${result.name}</h3>
                        <p class="${statusClass}">${result.message}</p>
                        <p><em>${result.details}</em></p>
                    </div>
                `;
            });
            
            html += `
                    <div class="test-result ${passedCount === totalCount ? 'pass' : 'fail'}">
                        ${passedCount === totalCount ? 
                            '✅ All tests passed! SQL Analyzer is working correctly.' : 
                            `⚠️ ${totalCount - passedCount} test(s) failed. Please review.`}
                    </div>
                </div>
            `;
            
            resultsDiv.innerHTML = html;
        }
        
        // Clear results
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            testResults = [];
        }
        
        // Auto-run tests on load
        console.log('SQL Analyzer Test Suite loaded');
    </script>
