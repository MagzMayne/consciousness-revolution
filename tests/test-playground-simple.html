<html>
<head>
  <meta name="rootib" content="RootIB: RB-20260224204035-78B462F6">
    <title>AUL Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
        .output { background: #2d2d2d; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { color: #51cf66; }
        .error { color: #ff6b6b; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <h1>AUL Feature Tests</h1>
    <div id="results"></div>
    
    <script type="module">
        import { Lexer } from './src/aul/lexer.js';
        import { Parser } from './src/aul/parser.js';
        import { Interpreter } from './src/aul/interpreter.js';
        
        function runTest(name, code) {
            try {
                const lexer = new Lexer(code);
                const tokens = lexer.tokenize();
                const parser = new Parser(tokens);
                const ast = parser.parse();
                const interpreter = new Interpreter();
                interpreter.interpret(ast);
                const output = interpreter.getOutput();
                
                document.getElementById('results').innerHTML += `
                    <div class="output">
                        <h3 class="success">✓ ${name}</h3>
                        <pre>${output}</pre>
                    </div>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML += `
                    <div class="output">
                        <h3 class="error">✗ ${name}</h3>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
        
        // Run tests
        runTest('Pattern Matching', `
fn test(x) {
    match x {
        case 90 => { print("A") }
        case 80 => { print("B") }
        case 70 => { print("C") }
        _ => { print("F") }
    }
}
test(90)
test(80)
test(60)
        `);
        
        runTest('Structs', `
struct Point {
    x,
    y
}
let p = new Point(10, 20)
print "Point: (" + p.x + ", " + p.y + ")"
        `);
        
        runTest('Classes', `
class Animal {
    fn constructor(name) {
        print "Created: " + name
    }
}
let dog = new Animal("Dog")
        `);
        
        runTest('For Loop', `
let nums = [1, 2, 3]
for n in nums {
    print "Number: " + n
}
        `);
        
        runTest('While Loop', `
let i = 1
while i <= 3 {
    print "Count: " + i
    i = i + 1
}
        `);
    </script>
</body>
</html>
