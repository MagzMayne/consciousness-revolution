    <title>Mock Data Detection Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;

<body>
    <h1>🧪 Mock Data Detection Test</h1>
    <p>This test validates the mock data detection functionality in ebaySwarm.html</p>

    <div class="test-section">
        <h2>Test Cases</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
        <div id="results"></div>
    </div>

    <script>
        // Copy the detectMockData function from ebaySwarm.html
        function detectMockData(listings) {
            // Common mock data patterns
            const mockPatterns = [
                'Apple iPhone 13 Pro',
                'PlayStation 5 Console',
                'Sony PlayStation 5',
                'Mock',
                'Test',
                'Sample',
                'Example'
            ];
            
            // Check if any listing matches mock patterns
            for (const listing of listings) {
                const title = listing.title || '';
                for (const pattern of mockPatterns) {
                    if (title.includes(pattern)) {
                        return true;
                    }
                }
                
                // Check for suspiciously generic item IDs
                const listingId = listing.listing_id || '';
                if (listingId.startsWith('item_') && !listingId.match(/item_\d{10,}/)) {
                    return true;
                }
            }
            
            return false;
        }

        const resultsDiv = document.getElementById('results');

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        function logResult(testName, passed, details = '') {
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✓' : '✗'} ${testName}</strong>
                ${details ? `<br><span class="info">${details}</span>` : ''}
            `;
            resultsDiv.appendChild(resultDiv);
        }

        function runAllTests() {
            clearResults();
            
            // Test 1: Detect iPhone mock data
            const test1 = [
                { listing_id: 'item_1', title: 'Apple iPhone 13 Pro 64GB - Unlocked, Mint Condition' }
            ];
            const result1 = detectMockData(test1);
            logResult('Detect iPhone mock data', result1 === true, 'Should detect "Apple iPhone 13 Pro" as mock data');

            // Test 2: Detect PlayStation mock data
            const test2 = [
                { listing_id: 'item_2', title: 'Sony PlayStation 5 Console Bundle with God of War' }
            ];
            const result2 = detectMockData(test2);
            logResult('Detect PlayStation mock data', result2 === true, 'Should detect "PlayStation 5" as mock data');

            // Test 3: Detect generic item IDs
            const test3 = [
                { listing_id: 'item_1', title: 'Regular Product' }
            ];
            const result3 = detectMockData(test3);
            logResult('Detect generic item IDs', result3 === true, 'Should detect "item_1" as mock data');

            // Test 4: Accept real eBay item IDs
            const test4 = [
                { listing_id: '123456789012', title: 'Real eBay Product' }
            ];
            const result4 = detectMockData(test4);
            logResult('Accept real eBay item IDs', result4 === false, 'Should accept real eBay item ID (12+ digits)');

            // Test 5: Detect "Test" keyword
            const test5 = [
                { listing_id: '123456789012', title: 'Test Product for Testing' }
            ];
            const result5 = detectMockData(test5);
            logResult('Detect "Test" keyword', result5 === true, 'Should detect "Test" in title as mock data');

            // Test 6: Detect "Mock" keyword
            const test6 = [
                { listing_id: '123456789012', title: 'Mock Item for Demo' }
            ];
            const result6 = detectMockData(test6);
            logResult('Detect "Mock" keyword', result6 === true, 'Should detect "Mock" in title as mock data');

            // Test 7: Accept real product
            const test7 = [
                { listing_id: '123456789012', title: 'Vintage Camera Lens 50mm F1.8' }
            ];
            const result7 = detectMockData(test7);
            logResult('Accept real product', result7 === false, 'Should accept real product listing');

            // Test 8: Mixed listings (one mock, one real)
            const test8 = [
                { listing_id: '123456789012', title: 'Real Product' },
                { listing_id: 'item_2', title: 'Apple iPhone 13 Pro' }
            ];
            const result8 = detectMockData(test8);
            logResult('Detect mock in mixed listings', result8 === true, 'Should detect mock data even with real listings present');

            // Test 9: Empty listings array
            const test9 = [];
            const result9 = detectMockData(test9);
            logResult('Handle empty array', result9 === false, 'Should return false for empty array');

            // Test 10: Real item ID starting with item_ but long enough
            const test10 = [
                { listing_id: 'item_12345678901', title: 'Real Product' }
            ];
            const result10 = detectMockData(test10);
            logResult('Accept long item_ IDs', result10 === false, 'Should accept item IDs with 10+ digits after item_');

            // Summary
            const allTests = [result1, result2, result3, !result4, result5, result6, !result7, result8, !result9, !result10];
            const passCount = allTests.filter(r => r === true).length;
            const totalTests = allTests.length;
            
            const summaryDiv = document.createElement('div');
            summaryDiv.className = `test-result ${passCount === totalTests ? 'pass' : 'fail'}`;
            summaryDiv.innerHTML = `
                <strong>Summary: ${passCount}/${totalTests} tests passed</strong>
            `;
            resultsDiv.appendChild(summaryDiv);
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 100);
        });
    </script>
</body>
