<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-51D3FD2B">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AUL Features</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <h1>AUL Feature Tests</h1>
    <div id="output"></div>
    
    <script type="module">
        import { Lexer } from './src/aul/lexer.js';
        import { Parser } from './src/aul/parser.js';
        import { Interpreter } from './src/aul/interpreter.js';
        
        const output = document.getElementById('output');
        
        function test(name, code) {
            try {
                const lexer = new Lexer(code);
                const tokens = lexer.tokenize();
                
                const parser = new Parser(tokens);
                const ast = parser.parse();
                
                const interpreter = new Interpreter();
                interpreter.interpret(ast);
                
                const result = interpreter.getOutput();
                output.innerHTML += `<h3>${name}: ✓</h3><pre>${result}</pre>`;
            } catch (error) {
                output.innerHTML += `<h3>${name}: ✗</h3><pre style="color: red;">${error.message}</pre>`;
            }
        }
        
        // Test 1: Pattern Matching
        test('Pattern Matching', `
fn gradeScore(score) {
    match score {
        case 90 => print "A"
        case 80 => print "B"
        _ => print "Other"
    }
}
gradeScore(90)
`);
        
        // Test 2: Natural Language Query
        test('Natural Language Query', `
let numbers = [10, 20, 30]
let total = query "sum of numbers" where numbers
print total
`);
        
        // Test 3: For Loop
        test('For Loop', `
let arr = [1, 2, 3]
for x in arr {
    print x
}
`);
        
        // Test 4: While Loop
        test('While Loop', `
let i = 0
while i < 3 {
    print i
    i = i + 1
}
`);
        
        // Test 5: Struct
        test('Struct', `
struct Point {
    x,
    y
}
let p = new Point(10, 20)
print p.x
`);
        
        // Test 6: Class
        test('Class', `
class Animal {
    fn constructor(name) {
        this.name = name
    }
}
let dog = new Animal("Dog")
print dog.name
`);
        
        output.innerHTML += '<h2>All tests completed!</h2>';
    </script>
</body>
</html>
