<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-EEF4B40D">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{DOMAIN_NAME}} - Ultimate Human OS</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --locked: #6b7280;
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .domain-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--card) 0%, rgba(99, 102, 241, 0.1) 100%);
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .domain-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .domain-name {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .domain-tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Progress Bar */
        .progress-section {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 12px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Aspect Grid */
        .aspects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .aspect-badge {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-decoration: none;
            color: var(--text);
        }

        .aspect-badge:hover:not(.locked) {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .aspect-badge.completed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            border-color: var(--success);
        }

        .aspect-badge.active {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .aspect-badge.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .aspect-number {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .aspect-status {
            font-size: 1.2rem;
        }

        .aspect-name {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 4px;
            color: var(--text-muted);
        }

        /* Current Aspect */
        .current-aspect {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .current-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .current-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .current-description {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tool-area {
            background: rgba(99, 102, 241, 0.1);
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tool-placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--text);
            color: var(--text);
        }

        /* Tier Lock Overlay */
        .tier-lock {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .tier-lock.hidden { display: none; }

        .lock-content {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }

        .lock-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .lock-title {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .lock-message {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .upgrade-btn {
            background: linear-gradient(90deg, var(--primary), #a855f7);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Navigation */
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .nav-back:hover { color: var(--text); }

        /* Responsive */
        @media (max-width: 600px) {
            .domain-name { font-size: 2rem; }
            .aspects-grid { grid-template-columns: repeat(4, 1fr); }
            .button-group { flex-direction: column; }
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <!-- Tier Lock Overlay (hidden by default, shown via JS if not authorized) -->
    <div class="tier-lock hidden" id="tierLock">
        <div class="lock-content">
            <div class="lock-icon">🔒</div>
            <h2 class="lock-title">Upgrade Required</h2>
            <p class="lock-message">This domain requires <strong id="requiredTier">SEEDLING</strong> tier or higher.</p>
            <button class="upgrade-btn" onclick="window.location.href='../pricing.html'">Upgrade Now</button>
        </div>
    </div>

    <div class="container">
        <a href="../index.html" class="nav-back">← Back to All Domains</a>

        <!-- Domain Header -->
        <div class="domain-header">
            <div class="domain-icon" id="domainIcon">🛡️</div>
            <h1 class="domain-name" id="domainName">{{DOMAIN_NAME}}</h1>
            <p class="domain-tagline" id="domainTagline">"{{DOMAIN_TAGLINE}}"</p>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-label">
                <span>YOUR PROGRESS</span>
                <span id="progressText">0/7 Aspects</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Aspect Grid -->
        <div class="aspects-grid" id="aspectsGrid">
            <!-- Generated by JS -->
        </div>

        <!-- Current Aspect -->
        <div class="current-aspect" id="currentAspect">
            <div class="current-label">CURRENT ASPECT</div>
            <h2 class="current-title" id="aspectTitle">Select an aspect above</h2>
            <p class="current-description" id="aspectDescription">Click on any unlocked aspect to begin.</p>

            <div class="tool-area" id="toolArea">
                <span class="tool-placeholder">Tool will load here</span>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="completeBtn" disabled>Mark Complete</button>
                <button class="btn btn-secondary" id="skipBtn" disabled>Skip for Now</button>
            </div>
        </div>
    </div>

    <script>
        // Domain Configuration (REPLACE THESE VALUES FOR EACH DOMAIN)
        const DOMAIN_CONFIG = {
            id: '{{DOMAIN_ID}}',           // e.g., 'peace', 'clarity', etc.
            name: '{{DOMAIN_NAME}}',       // e.g., 'PEACE'
            tagline: '{{DOMAIN_TAGLINE}}', // e.g., 'Shield yourself. Sleep soundly.'
            icon: '{{DOMAIN_ICON}}',       // e.g., '🛡️'
            requiredTier: '{{REQUIRED_TIER}}', // 'ghost', 'seedling', 'sapling', etc.
            aspects: [
                { id: 1, name: '{{ASPECT_1}}', description: '{{DESC_1}}', tool: '{{TOOL_1}}' },
                { id: 2, name: '{{ASPECT_2}}', description: '{{DESC_2}}', tool: '{{TOOL_2}}' },
                { id: 3, name: '{{ASPECT_3}}', description: '{{DESC_3}}', tool: '{{TOOL_3}}' },
                { id: 4, name: '{{ASPECT_4}}', description: '{{DESC_4}}', tool: '{{TOOL_4}}' },
                { id: 5, name: '{{ASPECT_5}}', description: '{{DESC_5}}', tool: '{{TOOL_5}}' },
                { id: 6, name: '{{ASPECT_6}}', description: '{{DESC_6}}', tool: '{{TOOL_6}}' },
                { id: 7, name: '{{ASPECT_7}}', description: '{{DESC_7}}', tool: '{{TOOL_7}}' }
            ]
        };

        // Tier hierarchy
        const TIER_LEVELS = {
            'ghost': 0,
            'seedling': 1,
            'sapling': 2,
            'tree': 3,
            'forest': 4
        };

        // Get user's tier from localStorage
        function getUserTier() {
            return localStorage.getItem('userTier') || 'ghost';
        }

        // Check if user has access to this domain
        function checkTierAccess() {
            const userTier = getUserTier();
            const requiredTier = DOMAIN_CONFIG.requiredTier;

            if (TIER_LEVELS[userTier] < TIER_LEVELS[requiredTier]) {
                document.getElementById('tierLock').classList.remove('hidden');
                document.getElementById('requiredTier').textContent = requiredTier.toUpperCase();
                return false;
            }
            return true;
        }

        // Get progress from localStorage
        function getProgress() {
            const key = `domain_${DOMAIN_CONFIG.id}_progress`;
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : { completed: [], currentAspect: 1 };
        }

        // Save progress to localStorage
        function saveProgress(progress) {
            const key = `domain_${DOMAIN_CONFIG.id}_progress`;
            localStorage.setItem(key, JSON.stringify(progress));
        }

        // Render the page
        function render() {
            // Set header info
            document.getElementById('domainIcon').textContent = DOMAIN_CONFIG.icon;
            document.getElementById('domainName').textContent = DOMAIN_CONFIG.name;
            document.getElementById('domainTagline').textContent = `"${DOMAIN_CONFIG.tagline}"`;
            document.title = `${DOMAIN_CONFIG.name} - Ultimate Human OS`;

            const progress = getProgress();
            const completedCount = progress.completed.length;

            // Update progress bar
            document.getElementById('progressText').textContent = `${completedCount}/7 Aspects`;
            document.getElementById('progressFill').style.width = `${(completedCount / 7) * 100}%`;

            // Render aspect grid
            const grid = document.getElementById('aspectsGrid');
            grid.innerHTML = DOMAIN_CONFIG.aspects.map(aspect => {
                const isCompleted = progress.completed.includes(aspect.id);
                const isActive = aspect.id === progress.currentAspect;
                const isLocked = aspect.id > progress.currentAspect && !isCompleted;

                let statusIcon = aspect.id;
                let className = 'aspect-badge';

                if (isCompleted) {
                    statusIcon = '✓';
                    className += ' completed';
                } else if (isActive) {
                    className += ' active';
                } else if (isLocked) {
                    statusIcon = '🔒';
                    className += ' locked';
                }

                return `
                    <div class="${className}" data-aspect="${aspect.id}" onclick="selectAspect(${aspect.id})">
                        <span class="aspect-number">${statusIcon}</span>
                        <span class="aspect-name">${aspect.name}</span>
                    </div>
                `;
            }).join('');

            // Load current aspect
            loadAspect(progress.currentAspect);
        }

        // Select an aspect
        function selectAspect(id) {
            const progress = getProgress();
            const isCompleted = progress.completed.includes(id);
            const isLocked = id > progress.currentAspect && !isCompleted;

            if (isLocked) return;

            progress.currentAspect = id;
            saveProgress(progress);
            render();
        }

        // Load aspect content
        function loadAspect(id) {
            const aspect = DOMAIN_CONFIG.aspects.find(a => a.id === id);
            if (!aspect) return;

            document.getElementById('aspectTitle').textContent = `Aspect ${id}: ${aspect.name}`;
            document.getElementById('aspectDescription').textContent = aspect.description;

            // Load tool (iframe or component)
            const toolArea = document.getElementById('toolArea');
            if (aspect.tool && aspect.tool !== '{{TOOL_' + id + '}}') {
                toolArea.innerHTML = `<iframe src="${aspect.tool}" style="width:100%;height:400px;border:none;border-radius:8px;"></iframe>`;
            } else {
                toolArea.innerHTML = '<span class="tool-placeholder">Tool coming soon...</span>';
            }

            // Enable buttons
            document.getElementById('completeBtn').disabled = false;
            document.getElementById('skipBtn').disabled = false;
        }

        // Mark current aspect complete
        function markComplete() {
            const progress = getProgress();
            if (!progress.completed.includes(progress.currentAspect)) {
                progress.completed.push(progress.currentAspect);
            }
            if (progress.currentAspect < 7) {
                progress.currentAspect++;
            }
            saveProgress(progress);
            render();

            // Celebrate if all complete
            if (progress.completed.length === 7) {
                alert(`Congratulations! You've mastered ${DOMAIN_CONFIG.name}!`);
            }
        }

        // Skip current aspect
        function skipAspect() {
            const progress = getProgress();
            if (progress.currentAspect < 7) {
                progress.currentAspect++;
                saveProgress(progress);
                render();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (checkTierAccess()) {
                render();
            }

            // Button handlers
            document.getElementById('completeBtn').addEventListener('click', markComplete);
            document.getElementById('skipBtn').addEventListener('click', skipAspect);
        });
    </script>

    <link rel="stylesheet" href="/ULTIMATE_HUMAN_OS/tier-gate.css">
    <script src="/ULTIMATE_HUMAN_OS/tier-gate.js"></script>
    <script src="/js/robot-assistant-loader.js"></script>
</body>
</html>
