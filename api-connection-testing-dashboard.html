<body>
    <div class="container">
        <header>
            <h1>🔌 API Connection Testing Dashboard</h1>
            <p class="subtitle">Comprehensive testing and monitoring for all API connections</p>
        </header>
        
        <div class="button-group">
            <button class="button success" onclick="runAllTests()">🧪 Run All Tests</button>
            <button class="button" onclick="checkAllConnections()">🔍 Check Connections</button>
            <button class="button secondary" onclick="showHealthDashboard()">📊 Health Dashboard</button>
            <button class="button secondary" onclick="clearLogs()">🗑️ Clear Logs</button>
            <button class="button danger" onclick="testAutoHealing()">🔧 Test Auto-Healing</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalTests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passedTests" style="color: var(--neon-green);">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failedTests" style="color: var(--neon-red);">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="warningTests" style="color: var(--neon-orange);">0</div>
                <div class="stat-label">Warnings</div>
            </div>
        </div>
        
        <h2 style="color: var(--neon-green); margin: 30px 0 20px;">API Services Status</h2>
        <div class="grid" id="servicesGrid"></div>
        
        <h2 style="color: var(--neon-green); margin: 30px 0 20px;">Test Log</h2>
        <div class="log-container" id="logContainer"></div>
    </div>
    
    <!-- Load dependencies -->
    <script src="src/utils/api-key-validator.js"></script>
    <script src="src/ai/api-connection-manager.js"></script>
    <script src="api-health-monitor.js"></script>
    
    <script>
        // State
        const state = {
            tests: { total: 0, passed: 0, failed: 0, warnings: 0 },
            services: {}
        };
        
        // Initialize
        window.addEventListener('load', () => {
            log('info', 'Dashboard initialized');
            checkAPIManagerAvailability();
            updateServicesDisplay();
            
            // Auto-refresh services every 5 seconds
            setInterval(updateServicesDisplay, 5000);
        });
        
        // Check if API Connection Manager is available
        function checkAPIManagerAvailability() {
            if (window.apiConnectionManager) {
                log('success', 'API Connection Manager loaded successfully');
                return true;
            } else {
                log('error', 'API Connection Manager not found. Some features may not work.');
                return false;
            }
        }
        
        // Log function
        function log(type, message, data = null) {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            const icon = type === 'success' ? '✅' :
                        type === 'error' ? '❌' :
                        type === 'warning' ? '⚠️' : 'ℹ️';
            
            entry.textContent = `[${timestamp}] ${icon} ${message}`;
            if (data) {
                entry.textContent += ` - ${JSON.stringify(data)}`;
            }
            
            logContainer.insertBefore(entry, logContainer.firstChild);
            
            // Keep only last 100 entries
            while (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }
        
        // Clear logs
        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
            log('info', 'Logs cleared');
        }
        
        // Update services display
        function updateServicesDisplay() {
            if (!window.apiConnectionManager) return;
            
            const grid = document.getElementById('servicesGrid');
            const status = window.apiConnectionManager.getConnectionStatus();
            
            grid.innerHTML = '';
            
            for (const [serviceId, info] of Object.entries(status)) {
                state.services[serviceId] = info;
                
                const card = document.createElement('div');
                const statusClass = info.status === 'connected' || info.status === 'ready' ? 'healthy' :
                                   info.status === 'disconnected' || !info.hasKey ? 'warning' :
                                   'error';
                card.className = `card service-card ${statusClass}`;
                
                const statusIcon = info.status === 'connected' || info.status === 'ready' ? '✅' :
                                  info.status === 'disconnected' || !info.hasKey ? '⚪' :
                                  info.status === 'error' ? '❌' : '❓';
                
                const healthScore = calculateHealthScore(info);
                
                card.innerHTML = `
                    <h2>${info.name}</h2>
                    <div class="status">
                        <span class="status-icon">${statusIcon}</span>
                        <div style="flex: 1;">
                            <div><strong>Status:</strong> ${info.status.toUpperCase()}</div>
                            <div><strong>API Key:</strong> ${info.hasKey ? 'Configured ✓' : 'Not Configured'}</div>
                        </div>
                    </div>
                    <div class="health-bar">
                        <div class="health-fill" style="width: ${healthScore}%;"></div>
                    </div>
                    <div style="text-align: center; margin-top: 5px;">
                        <small>Health: ${healthScore}%</small>
                    </div>
                    ${info.error ? `<div style="color: var(--neon-red); margin-top: 10px; font-size: 0.9rem;">⚠️ ${info.error}</div>` : ''}
                    ${info.fallbackAvailable ? `<div style="margin-top: 10px;"><span class="badge info">Fallback Available</span></div>` : ''}
                    <div style="margin-top: 15px;">
                        <button class="button secondary" style="width: 100%;" onclick="testService('${serviceId}')">
                            🧪 Test Connection
                        </button>
                    </div>
                `;
                
                grid.appendChild(card);
            }
        }
        
        // Calculate health score
        function calculateHealthScore(info) {
            if (info.status === 'connected' || info.status === 'ready') return 100;
            if (info.status === 'disconnected' && info.fallbackAvailable) return 70;
            if (info.status === 'disconnected' && !info.hasKey) return 50;
            if (info.status === 'error') return 25;
            return 0;
        }
        
        // Test individual service
        async function testService(serviceId) {
            if (!window.apiConnectionManager) {
                log('error', 'API Connection Manager not available');
                return;
            }
            
            log('info', `Testing ${serviceId} connection...`);
            
            try {
                const result = await window.apiConnectionManager.testConnection(serviceId);
                
                if (result.success) {
                    log('success', `${serviceId} connection successful`);
                    state.tests.passed++;
                } else {
                    log('error', `${serviceId} connection failed: ${result.error}`);
                    state.tests.failed++;
                }
                
                state.tests.total++;
                updateStats();
                updateServicesDisplay();
            } catch (error) {
                log('error', `Error testing ${serviceId}: ${error.message}`);
                state.tests.failed++;
                state.tests.total++;
                updateStats();
            }
        }
        
        // Check all connections
        async function checkAllConnections() {
            if (!window.apiConnectionManager) {
                log('error', 'API Connection Manager not available');
                return;
            }
            
            log('info', 'Checking all API connections...');
            
            const services = Object.keys(window.apiConnectionManager.services);
            
            for (const serviceId of services) {
                await testService(serviceId);
                // Small delay between tests to avoid potential rate limiting
                // This is configurable if needed
                const delayMs = 500;
                await new Promise(resolve => setTimeout(resolve, delayMs));
            }
            
            log('success', 'All connection checks complete');
        }
        
        // Run all tests
        async function runAllTests() {
            log('info', '🧪 Starting comprehensive API connection tests...');
            
            // Reset stats
            state.tests = { total: 0, passed: 0, failed: 0, warnings: 0 };
            updateStats();
            
            // Test 1: Check infrastructure
            log('info', 'Test 1: Checking infrastructure...');
            if (window.apiConnectionManager) {
                log('success', 'API Connection Manager: OK');
                state.tests.passed++;
            } else {
                log('error', 'API Connection Manager: NOT FOUND');
                state.tests.failed++;
            }
            state.tests.total++;
            
            if (window.apiHealthMonitor) {
                log('success', 'API Health Monitor: OK');
                state.tests.passed++;
            } else {
                log('warning', 'API Health Monitor: NOT FOUND');
                state.tests.warnings++;
            }
            state.tests.total++;
            
            updateStats();
            
            // Test 2: Check all connections
            log('info', 'Test 2: Testing all API connections...');
            await checkAllConnections();
            
            // Test 3: Check health monitoring
            if (window.apiHealthMonitor) {
                log('info', 'Test 3: Checking health monitoring...');
                const report = window.apiHealthMonitor.report();
                
                if (report.monitoring) {
                    log('success', 'Health monitoring is active');
                    state.tests.passed++;
                } else {
                    log('warning', 'Health monitoring is not active');
                    state.tests.warnings++;
                }
                state.tests.total++;
                
                log('info', `Health monitoring stats: ${JSON.stringify(report.stats)}`);
                updateStats();
            }
            
            // Summary
            const passRate = state.tests.total > 0 
                ? Math.round((state.tests.passed / state.tests.total) * 100)
                : 0;
            
            log('info', `Test Summary: ${state.tests.passed}/${state.tests.total} passed (${passRate}%)`);
            
            if (state.tests.failed === 0) {
                log('success', '🎉 All critical tests passed!');
            } else {
                log('warning', `⚠️ ${state.tests.failed} test(s) failed`);
            }
        }
        
        // Update stats display
        function updateStats() {
            document.getElementById('totalTests').textContent = state.tests.total;
            document.getElementById('passedTests').textContent = state.tests.passed;
            document.getElementById('failedTests').textContent = state.tests.failed;
            document.getElementById('warningTests').textContent = state.tests.warnings;
        }
        
        // Show health dashboard
        function showHealthDashboard() {
            if (!window.apiHealthMonitor) {
                log('error', 'API Health Monitor not available');
                return;
            }
            
            log('info', 'Opening health dashboard in console...');
            window.apiHealthMonitor.dashboard();
        }
        
        // Test auto-healing
        async function testAutoHealing() {
            if (!window.apiHealthMonitor) {
                log('error', 'API Health Monitor not available for auto-healing test');
                return;
            }
            
            log('info', 'Testing auto-healing capabilities...');
            log('info', 'Performing manual health check...');
            
            await window.apiHealthMonitor.check();
            
            const report = window.apiHealthMonitor.report();
            log('info', `Healing stats: ${report.stats.healingAttempts} attempts, ${report.stats.successfulHeals} successful`);
            
            log('success', 'Auto-healing test complete. Check console for detailed results.');
        }
    </script>
