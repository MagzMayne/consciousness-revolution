<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Empire Dashboard | OVERKILL KULTURE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #00ff88;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 20px #00ff88;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(0,255,136,0.1);
            border: 1px solid #00ff88;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }
        .stat-card h3 { font-size: 2em; }
        .stat-card p { color: #888; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }
        button.secondary {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
        }

        .album-creator {
            background: rgba(0,0,0,0.5);
            border: 2px solid #ffd700;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
        }
        .album-creator h2 { color: #ffd700; margin-bottom: 15px; }
        .album-creator input {
            background: #1a1a2e;
            border: 1px solid #ffd700;
            color: #fff;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        #selectedForAlbum {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,215,0,0.1);
            border-radius: 5px;
            min-height: 50px;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            background: #1a1a2e;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px;
            border-radius: 5px;
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .song-card {
            background: rgba(0,0,0,0.6);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .song-card:hover {
            border-color: #00ff88;
            transform: translateY(-3px);
        }
        .song-card.selected {
            border-color: #ffd700;
            background: rgba(255,215,0,0.1);
        }
        .song-card .title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #fff;
        }
        .song-card .theme {
            color: #00ff88;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .song-card .tier {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }
        .tier.free { background: #2ecc71; color: #000; }
        .tier.streaming { background: #3498db; color: #fff; }
        .tier.premium { background: #ffd700; color: #000; }
        .tier.uncategorized { background: #666; color: #fff; }

        .song-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .song-card button {
            padding: 8px 12px;
            font-size: 0.85em;
        }

        .album-preview {
            background: rgba(255,215,0,0.1);
            border: 2px solid #ffd700;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
            display: none;
        }
        .album-preview.active { display: block; }
        .album-preview h2 { color: #ffd700; }
        .album-preview ul { list-style: none; padding: 0; margin-top: 15px; }
        .album-preview li {
            padding: 8px 15px;
            background: rgba(0,0,0,0.5);
            margin-bottom: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            cursor: move;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border: 2px solid #00ff88;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h2 { margin-bottom: 20px; }
        .modal-content textarea {
            width: 100%;
            height: 200px;
            background: #0a0a0a;
            color: #00ff88;
            border: 1px solid #333;
            padding: 15px;
            font-family: monospace;
            border-radius: 5px;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00ff88;
            padding: 16px 32px;
            border-radius: 12px;
            border: 2px solid #00ff88;
            z-index: 10000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast .toast-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }
        .toast .toast-title {
            font-weight: bold;
            font-size: 1.1em;
        }
        .toast .toast-subtitle {
            color: #888;
            font-size: 0.9em;
            margin-top: 4px;
        }

        /* Button improvements */
        button.preview-btn {
            position: relative;
            overflow: hidden;
        }
        button.preview-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        button.preview-btn:active::after {
            width: 200px;
            height: 200px;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
        }
        .preview-active {
            animation: pulse 1s ease-in-out;
        }
    </style>
</head>

        let selectedSongs = [];
        let albums = JSON.parse(localStorage.getItem('musicAlbums') || '[]');

        function renderSongs(songsToRender = songs) {
            const grid = document.getElementById('songGrid');
            grid.innerHTML = songsToRender.map((song, index) => `
                <div class="song-card ${selectedSongs.includes(song.name) ? 'selected' : ''}"
                     onclick="toggleSong('${song.name}')"
                     data-tier="${song.tier}"
                     data-theme="${song.theme}">
                    <div class="tier ${song.tier}">${song.tier.toUpperCase()}${song.price ? ' $' + song.price : ''}</div>
                    <div class="title">${song.name}</div>
                    <div class="theme">🏷️ ${song.theme}</div>
                    <div class="actions">
                        <button onclick="event.stopPropagation(); playSong('${song.file}')" class="secondary preview-btn">▶️ Preview</button>
                        <button onclick="event.stopPropagation(); changeTier('${song.name}')" class="secondary">📁 Change Tier</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleSong(name) {
            if (selectedSongs.includes(name)) {
                selectedSongs = selectedSongs.filter(s => s !== name);
            } else {
                selectedSongs.push(name);
            }
            updateSelectedDisplay();
            renderSongs(getFilteredSongs());
        }

        function updateSelectedDisplay() {
            document.getElementById('selectedCount').textContent = selectedSongs.length;
            const container = document.getElementById('selectedForAlbum');
            if (selectedSongs.length === 0) {
                container.innerHTML = '<em>No songs selected. Click songs below to add to album.</em>';
            } else {
                container.innerHTML = selectedSongs.map(s => `<span style="background:#ffd700;color:#000;padding:3px 8px;margin:3px;display:inline-block;border-radius:3px;">${s}</span>`).join('');
            }
        }

        function filterSongs() {
            renderSongs(getFilteredSongs());
        }

        function getFilteredSongs() {
            const tier = document.getElementById('tierFilter').value;
            const theme = document.getElementById('themeFilter').value;
            const search = document.getElementById('searchBox').value.toLowerCase();

            return songs.filter(song => {
                if (tier !== 'all' && song.tier !== tier) return false;
                if (theme !== 'all' && song.theme !== theme) return false;
                if (search && !song.name.toLowerCase().includes(search)) return false;
                return true;
            });
        }

        function selectAll() {
            const filtered = getFilteredSongs();
            filtered.forEach(s => {
                if (!selectedSongs.includes(s.name)) {
                    selectedSongs.push(s.name);
                }
            });
            updateSelectedDisplay();
            renderSongs(getFilteredSongs());
        }

        function clearSelection() {
            selectedSongs = [];
            updateSelectedDisplay();
            renderSongs(getFilteredSongs());
        }

        function createAlbum() {
            const name = document.getElementById('albumName').value.trim();
            if (!name) {
                showToast('⚠️ Album Name Required', 'Please enter an album name first', 3000);
                return;
            }
            if (selectedSongs.length === 0) {
                showToast('⚠️ No Songs Selected', 'Please select at least one song', 3000);
                return;
            }

            const album = {
                name: name,
                tracks: [...selectedSongs],
                created: new Date().toISOString()
            };

            albums.push(album);
            localStorage.setItem('musicAlbums', JSON.stringify(albums));

            showAlbumPreview(album);
        }

        function showAlbumPreview(album) {
            document.getElementById('previewAlbumName').textContent = album.name;
            document.getElementById('previewTrackCount').textContent = album.tracks.length;
            document.getElementById('albumTrackList').innerHTML = album.tracks.map((t, i) =>
                `<li draggable="true">${i + 1}. ${t} <button onclick="removeFromAlbum(${i})" style="float:right;padding:2px 8px;font-size:0.8em;">❌</button></li>`
            ).join('');
            document.getElementById('albumPreview').classList.add('active');
        }

        function closePreview() {
            document.getElementById('albumPreview').classList.remove('active');
        }

        function exportAlbum() {
            const name = document.getElementById('previewAlbumName').textContent;
            const tracks = Array.from(document.getElementById('albumTrackList').querySelectorAll('li'))

            const exportText = `ALBUM: ${name}
Generated: ${new Date().toISOString()}
Tracks: ${tracks.length}

TRACKLIST:
${tracks.join('\n')}

---
Generated by OVERKILL KULTURE Music Dashboard
https://conciousnessrevolution.io/MUSIC_DASHBOARD.html`;

            document.getElementById('exportText').value = exportText;
            document.getElementById('exportModal').classList.add('active');
        }

        function copyExport() {
            const text = document.getElementById('exportText').value;
            navigator.clipboard.writeText(text).then(() => {
                showToast('✓ Copied to clipboard!', '', 2000);
            });

        function closeModal() {
            document.getElementById('exportModal').classList.remove('active');

        function pushToSite() {
            const name = document.getElementById('previewAlbumName').textContent;
            const tracks = selectedSongs;

            showToast(
                `🚀 Album "${name}" ready!`,
                `${tracks.length} tracks queued for deployment`,
                4000
            );

        // Toast notification system (Dashboard Quality Standard)
        function showToast(title, subtitle = '', duration = 4000) {
            // Remove existing toast if any
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <span class="toast-icon">🎵</span>
                <span class="toast-title">${title}</span>
                ${subtitle ? `<span class="toast-subtitle">${subtitle}</span>` : ''}
            `;
            document.body.appendChild(toast);

            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            // Remove after duration
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        function playSong(file) {
            // Extract just the song name for display
            const songName = file.replace(/_/g, ' ').replace('.mp3', '');

            showToast(
                `Preview: ${songName}`,
                'Streaming links coming soon! Files stored locally.',
                3500
            );

            // Find and animate the button that was clicked
            const buttons = document.querySelectorAll('.preview-btn');
            buttons.forEach(btn => {
                if (btn.onclick && btn.onclick.toString().includes(file)) {
                    btn.classList.add('pulse');
                    setTimeout(() => btn.classList.remove('pulse'), 1000);
                }
            });
        }

        function changeTier(name) {
            const song = songs.find(s => s.name === name);
            const newTier = prompt(`Change tier for "${name}":\n\nCurrent: ${song.tier}\n\nOptions: free, streaming, premium, uncategorized`, song.tier);
            if (newTier && ['free', 'streaming', 'premium', 'uncategorized'].includes(newTier)) {
                song.tier = newTier;
                renderSongs(getFilteredSongs());
                updateStats();
            }
        }

        function updateStats() {
            document.getElementById('totalTracks').textContent = songs.length;
            document.getElementById('freeCount').textContent = songs.filter(s => s.tier === 'free').length;
            document.getElementById('streamingCount').textContent = songs.filter(s => s.tier === 'streaming').length;
            document.getElementById('premiumCount').textContent = songs.filter(s => s.tier === 'premium').length;
        }

        // Initialize
        renderSongs();
        updateStats();
    </script>
</body>
</html>
