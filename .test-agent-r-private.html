    <div class="test-area">
        <h1>🧪 Agent R Text Activation Test</h1>
        <p>Type one of the activation phrases below to test the system:</p>
        <ul>
            <li>"I am agent R"</li>
            <li>"Agent R here"</li>
            <li>"This is agent R"</li>
            <li>"Agent R active"</li>
            <li>"Activate agent R"</li>
        </ul>
        
        <h2>Test Input:</h2>
        <textarea id="testInput" placeholder="Type an activation phrase here..."></textarea>
        
        <div class="status" id="status">
            Status: <span id="statusText">Not activated</span>
        </div>
        
        <h2>Activation Log:</h2>
        <div id="log" style="background: #000; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto;"></div>
    </div>
    
    <script src="http://localhost:8080/src/core/agent-r-activation.js"></script>
    <script>
        // Monitor activation status
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('statusText');
        
        function addLog(message, color = '#00d4ff') {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div style="color: ${color};">[${time}] ${message}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        // Override console.log to capture activation messages
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.join(' ');
            if (message.includes('AGENT R') || message.includes('Agent R') || message.includes('⚡')) {
                addLog(message, '#00ff00');
            }
        };
        
        // Check activation status periodically
        setInterval(() => {
            if (window.agentR && window.agentR.isActivated) {
                statusEl.textContent = '✅ ACTIVATED!';
                statusEl.parentElement.style.borderColor = '#00ff00';
                statusEl.parentElement.style.background = 'rgba(0, 255, 0, 0.2)';
            }
        }, 500);
        
        addLog('Test page loaded', '#7c5cff');
        addLog('Waiting for activation phrase...', '#7c5cff');
        
        // Log when Agent R system is ready
        setTimeout(() => {
            if (window.agentR) {
                addLog('✅ Agent R activation system loaded and ready', '#00ff00');
            } else {
                addLog('❌ Agent R activation system not found', '#ff0000');
            }
        }, 1000);
    </script>
