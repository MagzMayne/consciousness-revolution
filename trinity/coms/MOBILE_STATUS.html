<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trinity Mobile Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .operator-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .operator-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .operator-role {
            font-size: 0.8rem;
            color: #888;
        }

        .services {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .service {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .green { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .red { background: #ff4444; box-shadow: 0 0 10px #ff4444; }
        .yellow { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        .last-check {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .quick-link {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            font-size: 0.8rem;
        }

        .quick-link:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <h1>Trinity Status</h1>

    <div class="operator-card">
        <div class="operator-name">
            Commander
            <span class="operator-role">Darrick - Oversees All</span>
        </div>
        <div class="services">
            <div class="service"><span class="light green" id="cmd-github"></span> GitHub</div>
            <div class="service"><span class="light green" id="cmd-netlify"></span> Netlify</div>
            <div class="service"><span class="light green" id="cmd-railway"></span> Railway</div>
        </div>
    </div>

    <div class="operator-card">
        <div class="operator-name">
            Agent R
            <span class="operator-role">Ryan Barbaric - Builder</span>
        </div>
        <div class="services">
            <div class="service"><span class="light" id="ryan-github"></span> GitHub</div>
            <div class="service"><span class="light" id="ryan-netlify"></span> Netlify</div>
            <div class="service"><span class="light" id="ryan-railway"></span> Railway</div>
        </div>
    </div>

    <div class="operator-card">
        <div class="operator-name">
            Tiger
            <span class="operator-role">Operations & Testing</span>
        </div>
        <div class="services">
            <div class="service"><span class="light" id="tiger-github"></span> GitHub</div>
            <div class="service"><span class="light" id="tiger-netlify"></span> Netlify</div>
            <div class="service"><span class="light" id="tiger-railway"></span> Railway</div>
        </div>
    </div>

    <div class="operator-card">
        <div class="operator-name">
            Nero
            <span class="operator-role">Support & Docs</span>
        </div>
        <div class="services">
            <div class="service"><span class="light" id="nero-github"></span> GitHub</div>
            <div class="service"><span class="light" id="nero-netlify"></span> Netlify</div>
            <div class="service"><span class="light" id="nero-railway"></span> Railway</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="refreshStatus()">Refresh Status</button>
    <div class="last-check" id="lastCheck">Last check: --</div>

    <div class="quick-links">
        <a href="https://github.com/orgs/overkillkulture/people" class="quick-link" target="_blank">GitHub Org</a>
        <a href="https://app.netlify.com" class="quick-link" target="_blank">Netlify</a>
        <a href="https://railway.app" class="quick-link" target="_blank">Railway</a>
    </div>

    <script>
        // Load status from localStorage (synced from each operator's cockpit)
        function loadStatus() {
            const operators = ['ryan', 'tiger', 'nero'];
            const services = ['github', 'netlify', 'railway'];

            operators.forEach(op => {
                services.forEach(svc => {
                    const key = `${op}_${svc}_connection`;
                    const stored = localStorage.getItem(key);
                    const light = document.getElementById(`${op}-${svc}`);

                    if (stored) {
                        try {
                            const data = JSON.parse(stored);
                            light.className = 'light ' + (data.verified ? 'green' : 'red');
                        } catch (e) {
                            light.className = 'light red';
                        }
                    } else {
                        light.className = 'light red';
                    }
                });
            });

            document.getElementById('lastCheck').textContent =
                'Last check: ' + new Date().toLocaleTimeString();
        }

        function refreshStatus() {
            loadStatus();
            // Could also ping a central status API here
        }

        // Initial load
        loadStatus();

        // Auto-refresh every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
