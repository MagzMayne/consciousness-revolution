<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEE Device Compatibility Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #0a0b0f;
      color: #f0f0f0;
    }
    h1 { color: #8ab4ff; }
    .test-section {
      background: #1a1b24;
      border: 1px solid #3a4a66;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .test-item {
      padding: 10px;
      margin: 10px 0;
      border-left: 3px solid #8ab4ff;
      background: #222836;
    }
    .pass { border-left-color: #4caf50; }
    .fail { border-left-color: #f44336; }
    .warn { border-left-color: #ff9800; }
    button {
      background: #8ab4ff;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover { background: #6a94df; }
    #results { margin-top: 20px; }
    .viewport-info {
      background: #2a2b34;
      padding: 15px;
      border-radius: 6px;
      margin: 10px 0;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 2px solid #3a4a66;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>IEE Device Compatibility Test Suite</h1>
  
  <div class="viewport-info">
    <h3>Current Viewport Info</h3>
    <p><strong>Width:</strong> <span id="viewport-width"></span>px</p>
    <p><strong>Height:</strong> <span id="viewport-height"></span>px</p>
    <p><strong>Device Pixel Ratio:</strong> <span id="device-pixel-ratio"></span></p>
    <p><strong>Touch Supported:</strong> <span id="touch-support"></span></p>
    <p><strong>User Agent:</strong> <span id="user-agent"></span></p>
  </div>

  <div class="test-section">
    <h2>Responsive Design Tests</h2>
    <button onclick="testViewport(320, 568)">iPhone SE (320x568)</button>
    <button onclick="testViewport(375, 667)">iPhone 8 (375x667)</button>
    <button onclick="testViewport(414, 896)">iPhone 11 Pro (414x896)</button>
    <button onclick="testViewport(768, 1024)">iPad (768x1024)</button>
    <button onclick="testViewport(1024, 768)">iPad Landscape (1024x768)</button>
    <button onclick="testViewport(1920, 1080)">Desktop (1920x1080)</button>
    <button onclick="resetViewport()">Reset</button>
  </div>

  <div class="test-section">
    <h2>Interactive Tests</h2>
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="loadIEEPage()">Load IEE Page</button>
    <button onclick="testAccessibility()">Test Accessibility</button>
    <button onclick="testPerformance()">Test Performance</button>
  </div>

  <div id="results"></div>

  <div id="iframe-container"></div>

  <script>
    // Update viewport info
    function updateViewportInfo() {
      document.getElementById('viewport-width').textContent = window.innerWidth;
      document.getElementById('viewport-height').textContent = window.innerHeight;
      document.getElementById('device-pixel-ratio').textContent = window.devicePixelRatio || 1;
      document.getElementById('touch-support').textContent = 'ontouchstart' in window ? 'Yes' : 'No';
      document.getElementById('user-agent').textContent = navigator.userAgent;
    }
    
    updateViewportInfo();
    window.addEventListener('resize', updateViewportInfo);

    // Test different viewport sizes
    function testViewport(width, height) {
      const results = document.getElementById('results');
      results.innerHTML = `<div class="test-item">Testing viewport: ${width}x${height}px</div>`;
      
      // Note: Can't actually resize browser window, but we can test responsiveness
      const iframe = document.createElement('iframe');
      iframe.src = 'iee.html';
      iframe.style.width = width + 'px';
      iframe.style.height = height + 'px';
      
      const container = document.getElementById('iframe-container');
      container.innerHTML = '';
      container.appendChild(iframe);
      
      iframe.onload = function() {
        setTimeout(() => {
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            checkResponsiveness(doc, width, results);
          } catch (e) {
            results.innerHTML += `<div class="test-item warn">⚠️ Cannot access iframe content (CORS): ${e.message}</div>`;
          }
        }, 1000);
      };
    }

    function resetViewport() {
      document.getElementById('iframe-container').innerHTML = '';
      document.getElementById('results').innerHTML = '<div class="test-item">Viewport reset</div>';
    }

    function checkResponsiveness(doc, width, resultsEl) {
      const tests = [];
      
      // Check for horizontal overflow
      const bodyWidth = doc.body.scrollWidth;
      const viewportWidth = width;
      if (bodyWidth > viewportWidth + 10) {
        tests.push({
          name: 'Horizontal Overflow',
          pass: false,
          message: `Body width (${bodyWidth}px) exceeds viewport (${viewportWidth}px)`
        });
      } else {
        tests.push({
          name: 'Horizontal Overflow',
          pass: true,
          message: 'No horizontal overflow detected'
        });
      }
      
      // Check touch target sizes (min 44x44px)
      const buttons = doc.querySelectorAll('button, a, .character-card, .system-node');
      let smallTargets = 0;
      buttons.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        if (rect.width < 44 || rect.height < 44) {
          smallTargets++;
        }
      });
      
      tests.push({
        name: 'Touch Target Sizes',
        pass: smallTargets === 0,
        message: smallTargets > 0 
          ? `Found ${smallTargets} elements smaller than 44x44px` 
          : 'All touch targets meet minimum size'
      });
      
      // Check font sizes (min 0.813rem = ~13px)
      const textElements = doc.querySelectorAll('p, span, div, a');
      let smallText = 0;
      textElements.forEach(el => {
        const fontSize = window.getComputedStyle(el).fontSize;
        const sizeInPx = parseFloat(fontSize);
        if (sizeInPx < 12 && el.textContent.trim().length > 0) {
          smallText++;
        }
      });
      
      tests.push({
        name: 'Font Sizes',
        pass: smallText === 0,
        message: smallText > 0
          ? `Found ${smallText} elements with font smaller than 12px`
          : 'All text meets minimum size'
      });
      
      // Display results
      let html = `<h3>Test Results for ${width}px viewport:</h3>`;
      tests.forEach(test => {
        const className = test.pass ? 'pass' : 'fail';
        const icon = test.pass ? '✅' : '❌';
        html += `<div class="test-item ${className}">${icon} <strong>${test.name}:</strong> ${test.message}</div>`;
      });
      
      resultsEl.innerHTML = html;
    }

    function loadIEEPage() {
      window.open('iee.html', '_blank');
    }

    function testAccessibility() {
      const results = document.getElementById('results');
      const iframe = document.createElement('iframe');
      iframe.src = 'iee.html';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      iframe.onload = function() {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const tests = [];
          
          // Check for ARIA labels
          const interactiveElements = doc.querySelectorAll('button, a, [role="button"]');
          let missingLabels = 0;
          interactiveElements.forEach(el => {
            if (!el.hasAttribute('aria-label') && !el.textContent.trim()) {
              missingLabels++;
            }
          });
          
          tests.push({
            name: 'ARIA Labels',
            pass: missingLabels === 0,
            message: missingLabels > 0
              ? `${missingLabels} interactive elements missing ARIA labels`
              : 'All interactive elements have proper labels'
          });
          
          // Check for alt text on images
          const images = doc.querySelectorAll('img');
          let missingAlt = 0;
          images.forEach(img => {
            if (!img.hasAttribute('alt')) {
              missingAlt++;
            }
          });
          
          tests.push({
            name: 'Image Alt Text',
            pass: missingAlt === 0,
            message: missingAlt > 0
              ? `${missingAlt} images missing alt text`
              : 'All images have alt text'
          });
          
          // Check for heading hierarchy
          const headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');
          const hasH1 = doc.querySelector('h1') !== null;
          
          tests.push({
            name: 'Heading Structure',
            pass: hasH1,
            message: hasH1
              ? `Found ${headings.length} headings with proper h1`
              : 'No h1 element found'
          });
          
          // Display results
          let html = '<h3>Accessibility Test Results:</h3>';
          tests.forEach(test => {
            const className = test.pass ? 'pass' : 'fail';
            const icon = test.pass ? '✅' : '❌';
            html += `<div class="test-item ${className}">${icon} <strong>${test.name}:</strong> ${test.message}</div>`;
          });
          
          results.innerHTML = html;
          document.body.removeChild(iframe);
        } catch (e) {
          results.innerHTML = `<div class="test-item warn">⚠️ Cannot access iframe for accessibility testing: ${e.message}</div>`;
          document.body.removeChild(iframe);
        }
      };
    }

    function testPerformance() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="test-item">Running performance tests...</div>';
      
      const startTime = performance.now();
      const iframe = document.createElement('iframe');
      iframe.src = 'iee.html';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      iframe.onload = function() {
        const loadTime = performance.now() - startTime;
        
        const tests = [
          {
            name: 'Page Load Time',
            pass: loadTime < 3000,
            message: `Loaded in ${loadTime.toFixed(0)}ms ${loadTime < 3000 ? '(Good)' : '(Slow)'}`
          }
        ];
        
        let html = '<h3>Performance Test Results:</h3>';
        tests.forEach(test => {
          const className = test.pass ? 'pass' : 'warn';
          const icon = test.pass ? '✅' : '⚠️';
          html += `<div class="test-item ${className}">${icon} <strong>${test.name}:</strong> ${test.message}</div>`;
        });
        
        results.innerHTML = html;
        document.body.removeChild(iframe);
      };
    }

    function runAllTests() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="test-item">Running comprehensive test suite...</div>';
      
      setTimeout(() => testAccessibility(), 100);
      setTimeout(() => testPerformance(), 1000);
      setTimeout(() => testViewport(375, 667), 2000);
    }
  </script>
</body>
</html>
