<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>🐉 FALCOR MODE - GemBot System Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #0f0;
            background: #001100;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            animation: glow 1s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px #0f0, 0 0 10px #0f0; }
            to { text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 30px #0f0; }
        }
        
        .test-section {
            margin-bottom: 20px;
            border: 1px solid #0f0;
            padding: 15px;
            background: #001100;
        }
        
        .test-section h2 {
            color: #0ff;
            margin-bottom: 10px;
        }
        
        .test-result {
            padding: 5px 10px;
            margin: 5px 0;
            border-left: 3px solid #333;
        }
        
        .test-result.pass {
            border-left-color: #0f0;
            color: #0f0;
        }
        
        .test-result.fail {
            border-left-color: #f00;
            color: #f00;
        }
        
        .test-result.warn {
            border-left-color: #ff0;
            color: #ff0;
        }
        
        .test-result.info {
            border-left-color: #0ff;
            color: #0ff;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid #0ff;
            background: #001100;
            font-size: 1.2em;
        }
        
        .summary.success {
            border-color: #0f0;
        }
        
        .summary.failure {
            border-color: #f00;
        }
        
        pre {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            overflow-x: auto;
            border: 1px solid #333;
        }
        
        button {
            padding: 10px 20px;
            background: #0f0;
            color: #000;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin: 5px;
        }
        
        button:hover {
            background: #0ff;
        }
        
        .progress {
            width: 100%;
            height: 20px;
            background: #001100;
            border: 1px solid #0f0;
            margin: 10px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: #0f0;
            transition: width 0.3s;
            text-align: center;
            line-height: 20px;
            color: #000;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="/css/universal-styles.css">
</head>
<body>
    <div class="header">
        <h1>🐉 FALCOR MODE ACTIVATED 🐉</h1>
        <p>GemBot Comprehensive System Test Suite</p>
        <p><strong>Testing ALL systems for production readiness</strong></p>
    </div>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="runAllTests()">▶️ RUN ALL TESTS</button>
        <button onclick="clearStorage()">🗑️ CLEAR STORAGE</button>
        <button onclick="exportReport()">📥 EXPORT REPORT</button>
    </div>
    
    <div class="progress">
        <div class="progress-bar" id="progress" style="width: 0%">0%</div>
    </div>
    
    <div id="testResults"></div>
    
    <div id="summary"></div>
    
    <script>
        // Test results storage
        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            warnings: 0,
            tests: []
        };
        
        // Utility functions
        function log(section, message, type = 'info') {
            const result = { section, message, type, timestamp: new Date().toISOString() };
            testResults.tests.push(result);
            
            const container = document.getElementById('testResults');
            let sectionDiv = document.querySelector(`[data-section="${section}"]`);
            
            if (!sectionDiv) {
                sectionDiv = document.createElement('div');
                sectionDiv.className = 'test-section';
                sectionDiv.setAttribute('data-section', section);
                sectionDiv.innerHTML = `<h2>${section}</h2>`;
                container.appendChild(sectionDiv);
            }
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.textContent = `${type === 'pass' ? '✅' : type === 'fail' ? '❌' : type === 'warn' ? '⚠️' : 'ℹ️'} ${message}`;
            sectionDiv.appendChild(resultDiv);
            
            if (type === 'pass') testResults.passed++;
            if (type === 'fail') testResults.failed++;
            if (type === 'warn') testResults.warnings++;
            testResults.total++;
            
            updateProgress();
        }
        
        function updateProgress() {
            const totalTests = 50; // Approximate total tests
            const completed = testResults.total;
            const percentage = Math.min((completed / totalTests) * 100, 100);
            const progressBar = document.getElementById('progress');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = Math.round(percentage) + '%';
        }
        
        function showSummary() {
            const summaryDiv = document.getElementById('summary');
            const successRate = (testResults.passed / testResults.total * 100).toFixed(1);
            const isSuccess = testResults.failed === 0;
            
            summaryDiv.className = `summary ${isSuccess ? 'success' : 'failure'}`;
            summaryDiv.innerHTML = `
                <h2>${isSuccess ? '🎉 ALL SYSTEMS OPERATIONAL 🎉' : '⚠️ ISSUES DETECTED ⚠️'}</h2>
                <p><strong>Total Tests:</strong> ${testResults.total}</p>
                <p><strong>Passed:</strong> ${testResults.passed} ✅</p>
                <p><strong>Failed:</strong> ${testResults.failed} ❌</p>
                <p><strong>Warnings:</strong> ${testResults.warnings} ⚠️</p>
                <p><strong>Success Rate:</strong> ${successRate}%</p>
                <p><strong>Status:</strong> ${isSuccess ? 'PRODUCTION READY ✅' : 'NEEDS FIXES ❌'}</p>
            `;
        }
        
        // Test Suite
        async function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('summary').innerHTML = '';
            testResults = { total: 0, passed: 0, failed: 0, warnings: 0, tests: [] };
            
            log('System', 'Starting FALCOR MODE comprehensive test suite...', 'info');
            
            await testLocalStorage();
            await testAdminAPI();
            await testSecuritySystem();
            await testWalletSystem();
            await testGameSystem();
            await testAIAgents();
            await testMerlinAI();
            await testFileExistence();
            await test3DSystem();
            await testAcademy();
            
            showSummary();
            log('System', 'Test suite complete!', 'info');
        }
        
        // Test 1: LocalStorage
        async function testLocalStorage() {
            log('LocalStorage', 'Testing localStorage availability...', 'info');
            
            try {
                localStorage.setItem('falcor_test', 'working');
                const value = localStorage.getItem('falcor_test');
                localStorage.removeItem('falcor_test');
                
                if (value === 'working') {
                    log('LocalStorage', 'localStorage is functional', 'pass');
                } else {
                    log('LocalStorage', 'localStorage read/write failed', 'fail');
                }
            } catch (e) {
                log('LocalStorage', `localStorage error: ${e.message}`, 'fail');
            }
            
            // Check for existing data
            const keys = [
                'gembot_admin_hash',
                'gembot_wallets',
                'gembot_farm_game_save',
                'ai_agent_logs'
            ];
            
            keys.forEach(key => {
                const data = localStorage.getItem(key);
                if (data) {
                    log('LocalStorage', `Found ${key} (${(data.length / 1024).toFixed(1)}KB)`, 'pass');
                } else {
                    log('LocalStorage', `${key} not found (expected for fresh install)`, 'info');
                }
            });
        }
        
        // Test 2: Admin API
        async function testAdminAPI() {
            log('Admin API', 'Testing admin API availability...', 'info');
            
            if (window.gemBotAdminAPI) {
                log('Admin API', 'gemBotAdminAPI is loaded', 'pass');
                
                // Test methods
                const methods = ['getAllUsers', 'getAllAIAgents', 'getAIStats'];
                methods.forEach(method => {
                    if (typeof window.gemBotAdminAPI[method] === 'function') {
                        log('Admin API', `Method ${method} exists`, 'pass');
                    } else {
                        log('Admin API', `Method ${method} missing`, 'fail');
                    }
                });
            } else {
                log('Admin API', 'gemBotAdminAPI not loaded', 'warn');
            }
        }
        
        // Test 3: Security System
        async function testSecuritySystem() {
            log('Security', 'Testing anti-fraud security system...', 'info');
            
            if (window.securitySystem) {
                log('Security', 'SecurityAntiFraudSystem class found', 'pass');
                
                try {
                    const security = new window.SecurityAntiFraudSystem();
                    log('Security', 'SecurityAntiFraudSystem instantiated', 'pass');
                    
                    // Test fingerprinting
                    if (typeof security.generateCanvasFingerprint === 'function') {
                        log('Security', 'Canvas fingerprinting available', 'pass');
                    }
                    
                    if (typeof security.calculateSuspicionScore === 'function') {
                        log('Security', 'Suspicion scoring available', 'pass');
                    }
                } catch (e) {
                    log('Security', `Error instantiating: ${e.message}`, 'fail');
                }
            } else {
                log('Security', '⚠️ securitySystem not loaded', 'warn');
            }
        }
        
        // Test 4: Wallet System
        async function testWalletSystem() {
            log('Wallet', 'Testing automated wallet system...', 'info');
            
            if (typeof AutomatedWalletSystem !== 'undefined') {
                log('Wallet', '✅ AutomatedWalletSystem class available', 'pass');
                
                try {
                    const wallet = new AutomatedWalletSystem();
                    log('Wallet', 'AutomatedWalletSystem instantiated', 'pass');
                    
                    // Check Solana integration
                    if (window.solanaWeb3) {
                        log('Wallet', 'Solana Web3 library loaded', 'pass');
                    } else {
                        log('Wallet', 'Solana Web3 library not loaded', 'warn');
                    }
                } catch (e) {
                    log('Wallet', `Error: ${e.message}`, 'fail');
                }
            } else {
                log('Wallet', 'AutomatedWalletSystem not loaded', 'warn');
            }
        }
        
        // Test 5: Game System
        async function testGameSystem() {
            log('Game', 'Testing farm game system...', 'info');
            
            if (window.GemBotFarmGame) {
                log('Game', 'GemBotFarmGame class found', 'pass');
                
                // Check if game can be instantiated
                try {
                    // Don't actually create instance (would start rendering)
                    log('Game', 'GemBotFarmGame constructor available', 'pass');
                } catch (e) {
                    log('Game', `Error: ${e.message}`, 'fail');
                }
            } else {
                log('Game', 'GemBotFarmGame not loaded', 'warn');
            }
            
            // Check GameMaster
            if (window.GemBotGameMaster) {
                log('Game', 'GemBotGameMaster found', 'pass');
                
                if (window.GemBotGameMaster.achievements) {
                    const achievementCount = Object.keys(window.GemBotGameMaster.achievements).length;
                    log('Game', `${achievementCount} achievements defined`, 'pass');
                }
            } else {
                log('Game', 'GemBotGameMaster not loaded', 'warn');
            }
        }
        
        // Test 6: AI Agents
        async function testAIAgents() {
            log('AI Agents', 'Testing AI agent system...', 'info');
            
            if (typeof AIAgentPlayer !== 'undefined') {
                log('AI Agents', '✅ AIAgentPlayer class available', 'success');
            } else {
                log('AI Agents', '⚠️ AIAgentPlayer class not loaded', 'warn');
            }
            
            if (window.AIAgentManager) {
                log('AI Agents', 'AIAgentManager found', 'pass');
            } else {
                log('AI Agents', 'AIAgentManager not loaded', 'warn');
            }
            
            if (window.AIAgentLogger) {
                log('AI Agents', 'AIAgentLogger found', 'pass');
            } else {
                log('AI Agents', 'AIAgentLogger not loaded', 'warn');
            }
            
            // Check logs in localStorage
            const logs = localStorage.getItem('ai_agent_logs');
            if (logs) {
                try {
                    const parsed = JSON.parse(logs);
                    log('AI Agents', `Found ${parsed.length} logged activities`, 'pass');
                } catch (e) {
                    log('AI Agents', 'Log data corrupt', 'fail');
                }
            } else {
                log('AI Agents', 'No agent logs yet (expected for fresh install)', 'info');
            }
        }
        
        // Test 7: Merlin AI
        async function testMerlinAI() {
            log('Merlin AI', 'Testing Merlin intelligence system...', 'info');
            
            if (window.MerlinIntelligenceSystem) {
                log('Merlin AI', 'MerlinIntelligenceSystem class found', 'pass');
            } else {
                log('Merlin AI', 'MerlinIntelligenceSystem not loaded', 'warn');
            }
            
            if (window.MerlinEnhancedResponses) {
                log('Merlin AI', 'MerlinEnhancedResponses found', 'pass');
            } else {
                log('Merlin AI', 'MerlinEnhancedResponses not loaded', 'warn');
            }
            
            if (window.MerlinKnowledgeBase) {
                log('Merlin AI', 'MerlinKnowledgeBase found', 'pass');
            } else {
                log('Merlin AI', 'MerlinKnowledgeBase not loaded', 'warn');
            }
        }
        
        // Test 8: File Existence
        async function testFileExistence() {
            log('Files', 'Testing critical file availability...', 'info');
            
            const criticalFiles = [
                'admin-api.js',
                'gembot-api.js',
                'gembot-farm-game.js',
                'virtual-machine-3d.js',
                'anti-fraud-system.js',
                'automated-wallet-system.js'
            ];
            
            for (const file of criticalFiles) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        log('Files', `${file} accessible`, 'pass');
                    } else {
                        log('Files', `${file} returned ${response.status}`, 'fail');
                    }
                } catch (e) {
                    log('Files', `${file} not accessible: ${e.message}`, 'fail');
                }
            }
        }
        
        // Test 9: 3D System
        async function test3DSystem() {
            log('3D System', 'Testing Babylon.js integration...', 'info');
            
            if (window.BABYLON) {
                log('3D System', 'Babylon.js loaded', 'pass');
                
                if (window.BABYLON.Engine) {
                    log('3D System', 'Babylon.js Engine available', 'pass');
                }
                
                if (window.BABYLON.Scene) {
                    log('3D System', 'Babylon.js Scene available', 'pass');
                }
            } else {
                log('3D System', 'Babylon.js not loaded', 'fail');
            }
            
            if (window.VirtualMachine3D) {
                log('3D System', 'VirtualMachine3D class found', 'pass');
            } else {
                log('3D System', 'VirtualMachine3D not loaded', 'warn');
            }
        }
        
        // Test 10: Academy
        async function testAcademy() {
            log('Academy', 'Testing academy system...', 'info');
            
            if (window.gemBotAcademy) {
                log('Academy', 'gemBotAcademy found', 'pass');
                
                if (window.gemBotAcademy.courses) {
                    const courseCount = Object.keys(window.gemBotAcademy.courses).length;
                    log('Academy', `${courseCount} courses loaded`, 'pass');
                }
                
                if (window.gemBotAcademy.lessons) {
                    const lessonCount = Object.keys(window.gemBotAcademy.lessons).length;
                    log('Academy', `${lessonCount} lessons loaded`, 'pass');
                }
            } else {
                log('Academy', 'gemBotAcademy not loaded', 'warn');
            }
        }
        
        // Utility functions
        function clearStorage() {
            if (confirm('⚠️ This will DELETE ALL localStorage data. Are you sure?')) {
                localStorage.clear();
                sessionStorage.clear();
                alert('✅ Storage cleared! Refresh page to start fresh.');
            }
        }
        
        function exportReport() {
            const report = {
                timestamp: new Date().toISOString(),
                summary: {
                    total: testResults.total,
                    passed: testResults.passed,
                    failed: testResults.failed,
                    warnings: testResults.warnings,
                    successRate: (testResults.passed / testResults.total * 100).toFixed(1) + '%'
                },
                tests: testResults.tests
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gembot_falcor_test_report_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                log('System', '🐉 FALCOR MODE READY - Click "RUN ALL TESTS" to begin', 'info');
            }, 500);
        });
    </script>
