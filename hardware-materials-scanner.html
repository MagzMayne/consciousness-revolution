    <script>
        // Initialize systems
        let hardwareIdentifier, ebayPricing, valuationEngine, inventory = [];
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔩 Hardware & Materials Scanner initialized');
            
            // Initialize systems
            hardwareIdentifier = new HardwareIdentification();
            ebayPricing = new EbayPricingAPI();
            valuationEngine = new WarehouseValuationEngine();
            
            // Load inventory from localStorage
            loadInventory();
            
            // Setup event listeners
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Type selection
            document.querySelectorAll('[data-type]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const type = btn.dataset.type;
                    if (type === 'material') {
                        document.getElementById('hardwareInputs').style.display = 'none';
                        document.getElementById('materialInputs').style.display = 'grid';
                    } else {
                        document.getElementById('hardwareInputs').style.display = 'grid';
                        document.getElementById('materialInputs').style.display = 'none';
                        updateHardwareTypeOptions(type);
                    }
                });
            });
            
            // Calculate value button
            document.getElementById('calculateValueBtn').addEventListener('click', calculateValue);
            
            // Add to inventory button
            document.getElementById('addToInventoryBtn').addEventListener('click', addToInventory);
            
            // Navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    switchView(view);
                });
            });
            
            // Back to regular scanner
            document.getElementById('backToRegular').addEventListener('click', () => {
                window.location.href = 'warehouse-inventory-scanner.html';
            });
            
            // Export inventory
            document.getElementById('exportInventoryBtn').addEventListener('click', exportInventory);
        }
        
        function updateHardwareTypeOptions(category) {
            const typeSelect = document.getElementById('hardwareType');
            const types = {
                'nuts': ['Hex Nut', 'Lock Nut', 'Wing Nut', 'Cap Nut', 'Square Nut', 'Flange Nut'],
                'bolts': ['Hex Bolt', 'Carriage Bolt', 'Lag Bolt', 'Eye Bolt', 'U-Bolt'],
                'screws': ['Wood Screw', 'Machine Screw', 'Sheet Metal Screw', 'Drywall Screw', 'Set Screw'],
                'washers': ['Flat Washer', 'Lock Washer', 'Fender Washer', 'Star Washer'],
                'anchors': ['Concrete Anchor', 'Toggle Bolt', 'Wall Anchor']
            };
            
            typeSelect.innerHTML = '<option value="">Select...</option>';
            (types[category] || []).forEach(type => {
                const option = document.createElement('option');
                option.value = type.toLowerCase();
                option.textContent = type;
                typeSelect.appendChild(option);
            });
        }
        
        async function calculateValue() {
            const activeType = document.querySelector('[data-type].active');
            if (!activeType) {
                showToast('Please select an item type', 'warning');
                return;
            }
            
            showLoading(true);
            
            try {
                let valuation;
                
                if (activeType.dataset.type === 'material') {
                    // Material valuation
                    const materialData = {
                        material: document.getElementById('materialType').value,
                        form: document.getElementById('materialForm').value,
                        weight: parseFloat(document.getElementById('materialWeight').value),
                        purity: document.getElementById('materialPurity').value ? 
                               parseFloat(document.getElementById('materialPurity').value) : null
                    };
                    
                    if (!materialData.material || !materialData.weight) {
                        showToast('Please fill in material type and weight', 'warning');
                        showLoading(false);
                        return;
                    }
                    
                    valuation = await valuationEngine.valueMaterial(materialData);
                } else {
                    // Hardware valuation
                    const hardwareData = {
                        category: activeType.dataset.type,
                        type: document.getElementById('hardwareType').value,
                        size: document.getElementById('hardwareSize').value,
                        material: document.getElementById('hardwareMaterial').value,
                        grade: document.getElementById('hardwareGrade').value,
                        quantity: parseInt(document.getElementById('hardwareQuantity').value),
                        containerType: document.getElementById('containerType').value
                    };
                    
                    if (!hardwareData.type || !hardwareData.quantity) {
                        showToast('Please fill in type and quantity', 'warning');
                        showLoading(false);
                        return;
                    }
                    
                    valuation = await valuationEngine.valueHardware(hardwareData);
                }
                
                displayPricing(valuation);
                showLoading(false);
                showToast('✅ Valuation complete!', 'success');
            } catch (error) {
                console.error('Valuation error:', error);
                showToast('Failed to calculate value: ' + error.message, 'error');
                showLoading(false);
            }
        }
        
        function displayPricing(valuation) {
            const resultsDiv = document.getElementById('pricingResults');
            const activeType = document.querySelector('[data-type].active').dataset.type;
            
            let html = '<div class="pricing-row"><span class="pricing-label">Item:</span><span>';
            
            if (activeType === 'material') {
                html += `<span class="material-icon">${getMaterialIcon(valuation.material)}</span>`;
                html += `${valuation.material} ${valuation.form} (${valuation.weight} lbs)`;
            } else {
                html += `${valuation.size || ''} ${valuation.type} ${valuation.material || ''} (${valuation.quantity} pcs)`;
            }
            
            html += '</span></div>';
            
            if (activeType === 'material') {
                html += `
                    <div class="pricing-row">
                        <span class="pricing-label">Price per Pound:</span>
                        <span class="pricing-value">$${valuation.pricePerPound.toFixed(2)}</span>
                    </div>
                `;
            } else {
                html += `
                    <div class="pricing-row">
                        <span class="pricing-label">Price per Piece:</span>
                        <span class="pricing-value">$${valuation.unitPrice.toFixed(3)}</span>
                    </div>
                `;
            }
            
            html += `
                <div class="pricing-row">
                    <span class="pricing-label">Total Value:</span>
                    <span class="pricing-value" style="font-size: 1.5rem;">$${valuation.totalValue.toFixed(2)}</span>
                </div>
                <div class="pricing-row">
                    <span class="pricing-label">Data Source:</span>
                    <span>${valuation.pricingSource === 'ebay-live' ? '🔴 Live eBay Data' : '📊 Estimated'}</span>
                </div>
                <div class="pricing-row">
                    <span class="pricing-label">Confidence:</span>
                    <span class="confidence-badge confidence-${valuation.confidence}">${valuation.confidence}</span>
                </div>
            `;
            
            resultsDiv.innerHTML = html;
            document.getElementById('pricingSection').style.display = 'block';
            
            // Store current valuation for adding to inventory
            window.currentValuation = valuation;
        }
        
        function getMaterialIcon(material) {
            const icons = {
                'aluminum': '⚪',
                'copper': '🟠',
                'brass': '🟡',
                'stainless steel': '🔩',
                'steel': '⚙️',
                'lead': '⚫',
                'zinc': '🔹'
            };
            return icons[material?.toLowerCase()] || '⚙️';
        }
        
        function addToInventory() {
            if (!window.currentValuation) {
                showToast('Please calculate value first', 'warning');
                return;
            }
            
            const item = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                ...window.currentValuation
            };
            
            inventory.push(item);
            saveInventory();
            updateInventoryDisplay();
            
            showToast('✅ Added to inventory!', 'success');
            
            // Clear current valuation
            window.currentValuation = null;
            document.getElementById('pricingSection').style.display = 'none';
        }
        
        function loadInventory() {
            const saved = localStorage.getItem('hardwareInventory');
            if (saved) {
                inventory = JSON.parse(saved);
                updateInventoryDisplay();
            }
        }
        
        function saveInventory() {
            localStorage.setItem('hardwareInventory', JSON.stringify(inventory));
        }
        
        function updateInventoryDisplay() {
            const itemsDiv = document.getElementById('inventoryItems');
            
            if (inventory.length === 0) {
                itemsDiv.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 2rem;">No items in inventory yet</p>';
                document.getElementById('totalItems').textContent = '0';
                document.getElementById('totalPieces').textContent = '0';
                document.getElementById('totalInventoryValue').textContent = '$0.00';
                return;
            }
            
            let html = '';
            let totalValue = 0;
            let totalPieces = 0;
            
            inventory.forEach((item, index) => {
                totalValue += item.totalValue || 0;
                totalPieces += item.quantity || item.weight || 0;
                
                html += `
                    <div class="inventory-item" style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 0.5rem;">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div>
                                <strong>${item.type || item.material}</strong>
                                ${item.size ? `<span style="color: #6b7280;"> - ${item.size}</span>` : ''}
                                <br>
                                <span style="font-size: 0.875rem; color: #6b7280;">
                                    ${item.material || ''} ${item.grade || ''}
                                    ${item.form ? `(${item.form})` : ''}
                                </span>
                                <br>
                                <span style="font-size: 0.875rem;">
                                    ${item.quantity ? `${item.quantity} pieces` : `${item.weight} lbs`}
                                </span>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 1.25rem; font-weight: 700; color: #059669;">
                                    $${item.totalValue.toFixed(2)}
                                </div>
                                <button onclick="removeItem(${index})" style="font-size: 0.75rem; color: #dc2626; background: none; border: none; cursor: pointer; margin-top: 0.5rem;">
                                    🗑️ Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            itemsDiv.innerHTML = html;
            document.getElementById('totalItems').textContent = inventory.length;
            document.getElementById('totalPieces').textContent = totalPieces.toFixed(0);
            document.getElementById('totalInventoryValue').textContent = `$${totalValue.toFixed(2)}`;
        }
        
        function removeItem(index) {
            if (confirm('Remove this item from inventory?')) {
                inventory.splice(index, 1);
                saveInventory();
                updateInventoryDisplay();
                showToast('Item removed', 'success');
            }
        }
        
        function exportInventory() {
            if (inventory.length === 0) {
                showToast('No items to export', 'warning');
                return;
            }
            
            // Create CSV
            const headers = ['Type', 'Size', 'Material', 'Grade', 'Quantity/Weight', 'Unit Price', 'Total Value', 'Source', 'Timestamp'];
            const rows = inventory.map(item => [
                item.type || item.material,
                item.size || item.form || '',
                item.material || '',
                item.grade || '',
                item.quantity ? `${item.quantity} pcs` : `${item.weight} lbs`,
                item.unitPrice ? `$${item.unitPrice.toFixed(3)}` : `$${item.pricePerPound.toFixed(2)}/lb`,
                `$${item.totalValue.toFixed(2)}`,
                item.pricingSource,
                new Date(item.timestamp).toLocaleString()
            ]);
            
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(',') + '\n';
            });
            
            // Download
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hardware-inventory-${Date.now()}.csv`;
            a.click();
            
            showToast('✅ Inventory exported!', 'success');
        }
        
        function switchView(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-view="${view}"]`).classList.add('active');
            
            document.getElementById('hardwareInputSection').style.display = view === 'hardware' ? 'block' : 'none';
            document.getElementById('inventorySection').style.display = view === 'inventory' ? 'block' : 'none';
            document.getElementById('cameraSection').style.display = view === 'camera' ? 'block' : 'none';
        }
        
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }
        
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 80px;
                right: 20px;
                background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6'};
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
    
    <style>
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(400px); opacity: 0; }
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 1rem;
            font-weight: 600;
        }
    </style>
    <script src="/js/universal-utilities.js"></script>

    <!-- Universal Navigation - Added by Project Fixer -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof BarbrickUniversal !== 'undefined') {
                // Only add navigation if not already present
                if (!document.querySelector('.universal-header')) {
                    BarbrickUniversal.createBackButton();
                }
                
                // Add footer if not present
                if (!document.querySelector('.universal-footer')) {
                    BarbrickUniversal.createFooter();
                }
            }
        });
    </script>
</body>
