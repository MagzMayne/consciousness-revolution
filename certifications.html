<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-88FD2345">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse real-world certifications from Consciousness Revolution. Earn credentials that lead to actual jobs in pattern recognition, development, communication, and more.">
    <title>Real-World Certifications - Consciousness Revolution</title>
    
    <link rel="stylesheet" href="sacred-theme.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .hero {
            background: linear-gradient(135deg, #C71585 0%, #9B30FF 100%);
            padding: 4rem 2rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .filters {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #FFD700;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .filter-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .filter-buttons button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #C71585, #9B30FF);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(199, 21, 133, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .cert-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .cert-card:hover {
            transform: translateY(-5px);
            border-color: #FFD700;
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.2);
        }

        .cert-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .cert-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cert-level {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(155, 48, 255, 0.2);
            color: #9B30FF;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cert-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1rem 0 0.5rem 0;
            color: #FFD700;
        }

        .cert-description {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .cert-details {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cert-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .cert-detail strong {
            color: #FFD700;
        }

        .featured-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state h2 {
            color: #FFD700;
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .cert-grid {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                flex-direction: column;
            }
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <div class="hero">
        <h1>🎓 Real-World Certifications</h1>
        <p>Earn credentials that lead to actual jobs. Master skills employers need. Get certified in pattern recognition, development, communication, and more.</p>
    </div>

    <div class="container">
        <div class="filters">
            <div class="filter-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="">All Categories</option>
                    <option value="pattern-recognition">Pattern Recognition</option>
                    <option value="developer-skills">Developer Skills</option>
                    <option value="communication-leadership">Communication & Leadership</option>
                    <option value="financial-literacy">Financial Literacy</option>
                    <option value="consciousness-tools">Consciousness Tools</option>
                    <option value="business-management">Business Management</option>
                    <option value="security-boundaries">Security & Boundaries</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="level">Level</label>
                <select id="level">
                    <option value="">All Levels</option>
                    <option value="Foundational">Foundational</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                    <option value="Expert">Expert</option>
                    <option value="Master">Master</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="search">Search</label>
                <input type="text" id="search" placeholder="Search certifications...">
            </div>

            <div class="filter-group">
                <label>
                    <input type="checkbox" id="featured">
                    Show only featured certifications
                </label>
            </div>

            <div class="filter-buttons">
                <button class="btn-primary" onclick="applyCertFilters()">Apply Filters</button>
                <button class="btn-secondary" onclick="clearCertFilters()">Clear All</button>
            </div>
        </div>

        <div id="certifications-container">
            <div class="loading">Loading certifications...</div>
        </div>
    </div>

    <script>
        let allCertifications = [];

        async function loadCertifications() {
            try {
                const params = new URLSearchParams();
                
                const category = document.getElementById('category').value;
                const level = document.getElementById('level').value;
                const search = document.getElementById('search').value;
                const featured = document.getElementById('featured').checked;

                if (category) params.append('category', category);
                if (level) params.append('level', level);
                if (search) params.append('search', search);
                if (featured) params.append('featured', 'true');

                const response = await fetch(`/.netlify/functions/certifications-browse?${params}`);
                const data = await response.json();

                if (data.success) {
                    allCertifications = data.certifications;
                    displayCertifications(allCertifications);
                } else {
                    console.error('Failed to load certifications:', data.error);
                    document.getElementById('certifications-container').innerHTML = `
                        <div class="empty-state">
                            <h2>Unable to Load Certifications</h2>
                            <p>${data.error || 'Please try again later.'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading certifications:', error);
                document.getElementById('certifications-container').innerHTML = `
                    <div class="empty-state">
                        <h2>Connection Error</h2>
                        <p>Unable to connect to certification service. Please check your connection and try again.</p>
                    </div>
                `;
            }
        }

        function displayCertifications(certifications) {
            const container = document.getElementById('certifications-container');

            if (!certifications || certifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No Certifications Found</h2>
                        <p>Try adjusting your filters to see more results.</p>
                        <button class="btn-primary" onclick="clearCertFilters()">Clear Filters</button>
                    </div>
                `;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'cert-grid';

            certifications.forEach(cert => {
                const card = createCertCard(cert);
                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function createCertCard(cert) {
            const card = document.createElement('div');
            card.className = 'cert-card';
            card.onclick = () => {
                window.location.href = `certification-details.html?id=${cert.slug}`;
            };

            const category = cert.certification_categories;
            const jobTitlesStr = cert.job_titles?.slice(0, 3).join(', ') || 'Various roles';
            const salaryRange = cert.estimated_salary_range || 'Competitive';

            card.innerHTML = `
                ${cert.featured ? '<div class="featured-badge">⭐ FEATURED</div>' : ''}
                <div class="cert-header">
                    <span class="cert-category">${category?.name || 'General'}</span>
                    <span class="cert-level">${cert.level}</span>
                </div>
                <h3 class="cert-name">${cert.name}</h3>
                <p class="cert-description">${cert.description}</p>
                <div class="cert-details">
                    <div class="cert-detail">
                        <strong>💼 Roles:</strong> ${jobTitlesStr}
                    </div>
                    <div class="cert-detail">
                        <strong>💰 Salary:</strong> ${salaryRange}
                    </div>
                    <div class="cert-detail">
                        <strong>⏱️ Duration:</strong> ${cert.duration_hours || 'Self-paced'} hours
                    </div>
                    <div class="cert-detail">
                        <strong>✅ Passing:</strong> ${cert.passing_score_percentage}%
                    </div>
                </div>
            `;

            return card;
        }

        function applyCertFilters() {
            loadCertifications();
        }

        function clearCertFilters() {
            document.getElementById('category').value = '';
            document.getElementById('level').value = '';
            document.getElementById('search').value = '';
            document.getElementById('featured').checked = false;
            loadCertifications();
        }

        // Load certifications on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadCertifications();
        });

        // Allow Enter key in search
        document.getElementById('search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                applyCertFilters();
            }
        });
    </script>
</body>
</html>
