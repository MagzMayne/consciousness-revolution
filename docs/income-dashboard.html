<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Autonomous Income Dashboard</title>
</head>
<body>
  <h1>💰 Autonomous Income Dashboard</h1>
  <p>Live income events from engine/income.log</p>
  <pre id="log">Loading…</pre>

  <script>
    async function loadLog() {
      try {
        const res = await fetch('../engine/income.log');
        if (!res.ok) { document.getElementById('log').textContent = 'No income events yet.'; return; }
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        const entries = lines.map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
        document.getElementById('log').textContent = JSON.stringify(entries, null, 2);
      } catch (e) {
        document.getElementById('log').textContent = 'Could not load income.log: ' + e.message;
      }
    }
    loadLog();
    setInterval(loadLog, 30000);
  </script>
</body>
</html>
