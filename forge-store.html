<!DOCTYPE html>
<!-- RootIB: RB-20260319142113-FB41F273 -->
<html lang="en">
<head>
  <meta name="rootib" content="RootIB: RB-20260319142113-FB41F273">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Up - Forge Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --neon-cyan: #0ff5e0;
      --toxic-green: #39ff14;
      --rust-orange: #ff6b35;
      --warning-amber: #ffaa00;
      --hot-pink: #ff0080;
      --chrome: #c0c0c0;
      --dark-metal: #0a0a0c;
      --rust-brown: #2a1810;
      --grid-line: rgba(15, 245, 224, 0.05);
      --success-green: #00ff88;
      --gold: #ffd700;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, var(--dark-metal) 0%, #0d0a12 50%, var(--rust-brown) 100%);
      color: #c8c8c8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* CRT Scan Lines */
    body::before {
      content: '';
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.12) 2px,
        rgba(0, 0, 0, 0.12) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Industrial Grid */
    #grid-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(var(--grid-line) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 2rem;
      background: rgba(10, 10, 12, 0.8);
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(15, 245, 224, 0.3);
    }

    .forge-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px currentColor;
    }

    .forge-name {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--toxic-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .store-title {
      font-size: 1.8rem;
      color: var(--gold);
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .tagline {
      font-size: 1.2rem;
      color: var(--chrome);
      margin-top: 1rem;
    }

    /* Success Message */
    .success-banner {
      display: none;
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--success-green);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      text-align: center;
      animation: pulse 2s ease infinite;
    }

    .success-banner.show {
      display: block;
    }

    .success-banner h2 {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      color: var(--success-green);
      margin-bottom: 1rem;
      text-shadow: 0 0 20px var(--success-green);
    }

    .success-banner .xp-award {
      font-size: 3rem;
      color: var(--gold);
      font-weight: 900;
      text-shadow: 0 0 30px var(--gold);
      margin: 1rem 0;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
      50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.6); }
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    /* Product Card */
    .product-card {
      background: rgba(10, 10, 12, 0.9);
      border: 2px solid rgba(128, 128, 128, 0.3);
      border-radius: 12px;
      padding: 2rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .product-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .product-card:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 30px rgba(15, 245, 224, 0.3);
      transform: translateY(-5px);
    }

    .product-card:hover::before {
      opacity: 1;
    }

    .product-card.featured {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), rgba(10, 10, 12, 0.9));
    }

    .product-card.featured::before {
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 1;
    }

    .product-card.featured:hover {
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
    }

    .product-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .product-icon {
      font-size: 3rem;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      text-shadow: 0 0 15px currentColor;
    }

    .product-card.featured .product-icon {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .product-info {
      flex: 1;
    }

    .product-badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: var(--gold);
      color: var(--dark-metal);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .product-name {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--neon-cyan);
      margin-bottom: 0.5rem;
    }

    .product-card.featured .product-name {
      color: var(--gold);
    }

    .product-subtitle {
      font-size: 1rem;
      color: var(--chrome);
    }

    .product-description {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #c8c8c8;
      margin-bottom: 1.5rem;
    }

    .product-features {
      list-style: none;
      margin-bottom: 1.5rem;
    }

    .product-features li {
      padding: 0.5rem 0;
      padding-left: 1.5rem;
      position: relative;
      font-size: 1rem;
      color: #b0b0b0;
    }

    .product-features li::before {
      content: '⚡';
      position: absolute;
      left: 0;
      color: var(--toxic-green);
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
    }

    .xp-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.2rem;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid var(--toxic-green);
      border-radius: 8px;
    }

    .xp-badge .xp-icon {
      font-size: 1.5rem;
    }

    .xp-badge .xp-amount {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--toxic-green);
      text-shadow: 0 0 10px var(--toxic-green);
    }

    .product-pricing {
      text-align: right;
    }

    .product-price {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .product-price-label {
      font-size: 0.9rem;
      color: var(--chrome);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .buy-button {
      width: 100%;
      padding: 1.2rem 2rem;
      margin-top: 1rem;
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--dark-metal);
      background: linear-gradient(135deg, var(--neon-cyan), var(--toxic-green));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(15, 245, 224, 0.4);
    }

    .buy-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(15, 245, 224, 0.6);
    }

    .buy-button:active {
      transform: translateY(0);
    }

    .buy-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .product-card.featured .buy-button {
      background: linear-gradient(135deg, var(--gold), var(--warning-amber));
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
    }

    .product-card.featured .buy-button:hover {
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6);
    }

    /* Loading Spinner */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 2rem;
      left: 2rem;
      padding: 1rem 1.5rem;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--neon-cyan);
      background: rgba(10, 10, 12, 0.9);
      border: 2px solid var(--neon-cyan);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(15, 245, 224, 0.3);
    }

    .back-button:hover {
      background: rgba(15, 245, 224, 0.1);
      box-shadow: 0 0 30px rgba(15, 245, 224, 0.5);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .header {
        padding: 1.5rem;
      }

      .forge-name {
        font-size: 1.8rem;
      }

      .store-title {
        font-size: 1.4rem;
      }

      .product-header {
        flex-direction: column;
        text-align: center;
      }

      .product-footer {
        flex-direction: column;
      }

      .xp-badge {
        width: 100%;
        justify-content: center;
      }

      .product-pricing {
        text-align: center;
        width: 100%;
      }

      .back-button {
        top: 1rem;
        left: 1rem;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
      }
    }
  </style>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
  <div id="grid-bg"></div>

  <a href="#" class="back-button" id="backBtn">← Back to Lobby</a>

  <div class="container">
    <!-- Success Banner -->
    <div class="success-banner" id="successBanner">
      <h2>⚡ PURCHASE COMPLETE ⚡</h2>
      <div class="xp-award" id="xpAward">+500 XP</div>
      <p style="font-size: 1.2rem; color: var(--chrome);">
        Power boost activated! Check your progress to see your XP update.
      </p>
    </div>

    <!-- Header -->
    <div class="header">
      <div class="forge-icon" id="forgeIcon">🔥</div>
      <h1 class="forge-name" id="forgeName">REALITY FORGE</h1>
      <h2 class="store-title">💎 Power Up Store</h2>
      <p class="tagline" id="forgeTagline">Accelerate your mastery with XP boosters and exclusive content</p>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid">
      <!-- Products will be inserted here by JavaScript -->
    </div>
  </div>

  <script src="forge-data.js"></script>
  <script>
    // Get forge slug from URL
    const urlParams = new URLSearchParams(window.location.search);
    const forgeSlug = urlParams.get('forge') || 'reality';
    const forgeData = getForgeBySlug(forgeSlug);

    // Product catalog (aligned with Stripe products)
    const PRODUCTS = {
      starter: {
        name: 'Starter Pack',
        subtitle: 'Fast-track your journey',
        description: 'Get a head start on your mastery path with instant XP boost and exclusive starter content.',
        features: [
          '+500 XP instant boost',
          'Exclusive starter exercises',
          'Priority community access',
          'Lifetime access to content'
        ],
        price: 47,
        xp: 500,
        icon: '⚡',
        stripeProductPrefix: '-starter' // e.g., "reality-starter"
      },
      mastery: {
        name: 'Mastery Course',
        subtitle: 'Deep dive into excellence',
        description: 'Comprehensive mastery program with advanced techniques, personalized guidance, and massive XP acceleration.',
        features: [
          '+2,500 XP mega boost',
          'Complete mastery curriculum',
          '13-phase guided journey',
          'Weekly live sessions',
          'Expert mentorship access',
          'Certification upon completion'
        ],
        price: 197,
        xp: 2500,
        icon: '🎓',
        stripeProductPrefix: '-mastery' // e.g., "reality-mastery"
      },
      bundle: {
        name: 'Master Bundle',
        subtitle: 'Unlock all 7 Forges',
        description: 'The ultimate package - instant access to all 7 Forge mastery courses with maximum XP acceleration.',
        features: [
          '+20,000 XP distributed across all Forges',
          'All 7 Mastery Courses unlocked',
          '91 phases of transformation',
          'Lifetime access to all content',
          'VIP community status',
          'Monthly masterminds',
          'Personal success coach',
          'Early access to new releases'
        ],
        price: 997,
        xp: 20000,
        icon: '♾️',
        badge: 'BEST VALUE',
        featured: true,
        stripeProductPrefix: '-bundle' // "master-bundle" for bundle
      }
    };

    // Initialize page
    function init() {
      if (!forgeData) {
        console.error('Forge not found:', forgeSlug);
        return;
      }

      // Update header
      document.getElementById('forgeIcon').textContent = forgeData.icon;
      document.getElementById('forgeName').textContent = forgeData.name.toUpperCase();
      document.getElementById('forgeTagline').textContent = forgeData.tagline;

      // Set dynamic colors
      document.documentElement.style.setProperty('--forge-color', forgeData.color);

      // Render products
      renderProducts();

      // Setup back button
      document.getElementById('backBtn').href = `index.html?forge=${forgeSlug}`;

      // Check for success state
      if (urlParams.get('success') === 'true') {
        showSuccessMessage();
      }
    }

    // Render product cards
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const productTypes = ['starter', 'mastery', 'bundle'];

      productTypes.forEach(type => {
        const product = PRODUCTS[type];
        const card = createProductCard(type, product);
        grid.appendChild(card);
      });
    }

    // Create product card element
    function createProductCard(type, product) {
      const card = document.createElement('div');
      card.className = `product-card ${product.featured ? 'featured' : ''}`;

      let stripeProductId;
      if (type === 'bundle') {
        stripeProductId = 'master-bundle';
      } else {
        stripeProductId = forgeSlug + product.stripeProductPrefix;
      }

      card.innerHTML = `
        <div class="product-header">
          <div class="product-icon">${product.icon}</div>
          <div class="product-info">
            ${product.badge ? `<div class="product-badge">${product.badge}</div>` : ''}
            <h3 class="product-name">${product.name}</h3>
            <p class="product-subtitle">${product.subtitle}</p>
          </div>
        </div>

        <p class="product-description">${product.description}</p>

        <ul class="product-features">
          ${product.features.map(f => `<li>${f}</li>`).join('')}
        </ul>

        <div class="product-footer">
          <div class="xp-badge">
            <span class="xp-icon">⚡</span>
            <span class="xp-amount">+${product.xp.toLocaleString()}</span>
          </div>
          <div class="product-pricing">
            <div class="product-price">$${product.price}</div>
            <div class="product-price-label">One-time payment</div>
          </div>
        </div>

        <button
          class="buy-button"
          onclick="handlePurchase('${stripeProductId}', ${product.xp})"
        >
          Buy Now - $${product.price}
        </button>
      `;

      return card;
    }

    // Handle purchase button click
    async function handlePurchase(productId, xpAmount) {
      const button = event.target;
      const originalText = button.textContent;

      // Disable button and show loading
      button.disabled = true;
      button.innerHTML = '<span class="loading"></span> Processing...';

      try {
        // Get user email (from localStorage or prompt)
        let userEmail = localStorage.getItem('userEmail');
        if (!userEmail) {
          userEmail = prompt('Enter your email to complete purchase:');
          if (!userEmail || !userEmail.includes('@')) {
            throw new Error('Valid email required');
          }
          localStorage.setItem('userEmail', userEmail);
        }

        // Call Stripe checkout function
        const response = await fetch('/.netlify/functions/stripe-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product_id: productId,
            email: userEmail,
            success_url: `${window.location.origin}/forge-store.html?forge=${forgeSlug}&success=true&xp=${xpAmount}`,
            cancel_url: `${window.location.origin}/forge-store.html?forge=${forgeSlug}`
          })
        });

        if (!response.ok) {
          throw new Error('Payment setup failed');
        }

        const data = await response.json();

        if (data.checkout_url) {
          // Redirect to Stripe Checkout
          window.location.href = data.checkout_url;
        } else {
          throw new Error('No checkout URL returned');
        }

      } catch (error) {
        console.error('Purchase error:', error);
        alert('Purchase failed: ' + error.message + '\n\nPlease try again or contact support.');
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    // Show success message after successful payment
    function showSuccessMessage() {
      const xpAmount = urlParams.get('xp') || '500';
      document.getElementById('xpAward').textContent = `+${parseInt(xpAmount).toLocaleString()} XP`;
      document.getElementById('successBanner').classList.add('show');

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Clean URL after showing message
      setTimeout(() => {
        const cleanUrl = `${window.location.origin}${window.location.pathname}?forge=${forgeSlug}`;
        window.history.replaceState({}, '', cleanUrl);
      }, 3000);
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
