  <div class="container">
    <h1>Order Tracking</h1>
    <div class="subtitle">Real-time updates on your custom jewelry creation</div>
    
    <div id="orderContent"></div>
  </div>

  <script>
    const ORDER_STAGES = [
      { name: "Payment Confirmed", duration: 0, desc: "Your order has been received and payment confirmed" },
      { name: "Design Finalized", duration: 24, desc: "Final design specifications are being verified" },
      { name: "Materials Sourced", duration: 48, desc: "Precious metals and stones are being prepared" },
      { name: "Casting/Fabrication", duration: 96, desc: "Your jewelry piece is being crafted by our master jeweler" },
      { name: "Stone Setting", duration: 48, desc: "Gemstones are being carefully set by hand" },
      { name: "Polishing", duration: 24, desc: "Final polishing and finishing touches" },
      { name: "Quality Check", duration: 12, desc: "Comprehensive quality inspection" },
      { name: "Shipped", duration: 0, desc: "Your jewelry is on its way to you!" }
    ];

    function getOrderFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function getOrderStatus(orderId) {
      const orders = JSON.parse(localStorage.getItem("barbrickOrders") || "[]");
      const order = orders.find(o => o.orderId === orderId);
      
      if (!order) return null;

      const hoursElapsed = (Date.now() - order.startTime) / (1000 * 60 * 60);
      let cumulativeHours = 0;
      let currentStage = 0;

      for (let i = 0; i < ORDER_STAGES.length; i++) {
        cumulativeHours += ORDER_STAGES[i].duration;
        if (hoursElapsed < cumulativeHours) {
          currentStage = i;
          break;
        }
      }

      const totalDuration = ORDER_STAGES.reduce((sum, stage) => sum + stage.duration, 0);
      const progress = Math.min((hoursElapsed / totalDuration) * 100, 100);
      const hoursRemaining = Math.max(totalDuration - hoursElapsed, 0);
      const daysRemaining = Math.ceil(hoursRemaining / 24);

      return {
        ...order,
        currentStage: ORDER_STAGES[currentStage].name,
        stageIndex: currentStage,
        progress: progress.toFixed(1),
        hoursRemaining: Math.ceil(hoursRemaining),
        daysRemaining: daysRemaining
      };
    }

    function renderOrder(orderStatus) {
      if (!orderStatus) {
        document.getElementById("orderContent").innerHTML = `
          <div class="error-message">
            Order not found. Please check your order ID or link.
          </div>
        `;
        return;
      }

      const design = orderStatus.design;
      const stages = ORDER_STAGES.map((stage, idx) => {
        const isCompleted = idx < orderStatus.stageIndex;
        const isActive = idx === orderStatus.stageIndex;
        return { ...stage, isCompleted, isActive };
      });

      document.getElementById("orderContent").innerHTML = `
        <div class="order-card">
          <div class="order-id">Order ${orderStatus.orderId}</div>
          <div class="status-badge">${orderStatus.currentStage}</div>
          
          <div class="progress-bar-container">
            <div class="progress-bar" style="width: ${orderStatus.progress}%"></div>
          </div>
          
          <div class="info-grid">
            <div class="info-item">
              <div class="info-label">Progress</div>
              <div class="info-value">${orderStatus.progress}%</div>
            </div>
            <div class="info-item">
              <div class="info-label">Est. Days Remaining</div>
              <div class="info-value">${orderStatus.daysRemaining} days</div>
            </div>
            <div class="info-item">
              <div class="info-label">Design</div>
              <div class="info-value">${design.mounting.name}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Price</div>
              <div class="info-value">$${design.retailPrice.toFixed(2)}</div>
            </div>
          </div>
          
          <div class="timeline">
            ${stages.map(stage => `
              <div class="timeline-item">
                <div class="timeline-dot ${stage.isCompleted ? 'completed' : ''} ${stage.isActive ? 'active' : ''}"></div>
                <div class="timeline-content">
                  <div class="timeline-title">${stage.name}</div>
                  <div class="timeline-desc">${stage.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="share-section">
          <div class="share-title">🔗 Share this design</div>
          <div style="font-size: 12px; color: #9aa3ff; margin-bottom: 12px;">
            Others can view this piece and order the same design
          </div>
          <div class="share-link">
            <input type="text" class="share-input" id="shareLink" value="${window.location.href}" readonly />
            <button class="btn" onclick="copyShareLink()">Copy Link</button>
          </div>
        </div>
      `;
    }

    function copyShareLink() {
      const input = document.getElementById("shareLink");
      input.select();
      document.execCommand("copy");
      alert("Link copied to clipboard!");
    }

    // Initialize page
    const orderId = getOrderFromURL();
    if (orderId) {
      const orderStatus = getOrderStatus(orderId);
      renderOrder(orderStatus);
      
      // Refresh status every 30 seconds
      setInterval(() => {
        const updated = getOrderStatus(orderId);
        if (updated) {
          renderOrder(updated);
        }
      }, 30000);
    } else {
      document.getElementById("orderContent").innerHTML = `
        <div class="error-message">
          No order ID provided. Please use the tracking link from your order confirmation.
        </div>
      `;
    }
  </script>
