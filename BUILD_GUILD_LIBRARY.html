        // Render products
        function renderProducts(filter = 'all', search = '') {
            const grid = document.getElementById('productGrid');
            let filtered = PRODUCTS;

            if (filter !== 'all') {
                filtered = filtered.filter(p => p.status === filter);
            }

            if (search) {
                const s = search.toLowerCase();
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(s) ||
                    p.description.toLowerCase().includes(s) ||
                    p.forge.toLowerCase().includes(s)
                );
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card" data-id="${p.id}">
                    <div class="product-header">
                        <div class="product-name">${p.name}</div>
                        <div class="product-status status-${p.status}">
                            ${p.status.toUpperCase()}
                        </div>
                    </div>
                    <div class="product-desc">${p.description}</div>
                    <div class="product-meta">
                        <span class="forge-badge">${p.forge}</span>
                        <span>v${p.version}</span>
                        ${p.lastUpdated ? `<span>${p.lastUpdated}</span>` : ''}
                    </div>
                    <div class="product-actions">
                        ${p.url ? `<a href="${p.url}" target="_blank" class="action-btn primary">Open</a>` : ''}
                        ${p.files.length > 0 ? `<button class="action-btn" onclick="showDetails('${p.id}')">Details</button>` : ''}
                        ${p.status === 'live' ? `<button class="action-btn" onclick="copyProject('${p.id}')">Copy</button>` : ''}
                    </div>
                </div>
            `).join('');

            // Update counts
            document.getElementById('liveCount').textContent = PRODUCTS.filter(p => p.status === 'live').length;
            document.getElementById('wipCount').textContent = PRODUCTS.filter(p => p.status === 'wip').length;
            document.getElementById('plannedCount').textContent = PRODUCTS.filter(p => p.status === 'planned').length;
        }

        // Show product details
        function showDetails(id) {
            const product = PRODUCTS.find(p => p.id === id);
            if (!product) return;

            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');

            title.textContent = product.name;
            content.innerHTML = `
                <p style="color: var(--text-dim); margin-bottom: 20px;">${product.description}</p>
                <div style="margin-bottom: 15px;">
                    <strong>Forge:</strong> ${product.forge}<br>
                    <strong>Version:</strong> ${product.version}<br>
                    <strong>Status:</strong> ${product.status.toUpperCase()}
                </div>
                <h3 style="margin-bottom: 10px;">Files</h3>
                <div class="file-list">
                    ${product.files.map(f => `<div class="file-item">${f}</div>`).join('')}
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    ${product.url ? `<a href="${product.url}" target="_blank" class="action-btn primary" style="flex:1;text-decoration:none;">Open Product</a>` : ''}
                    <button class="action-btn" style="flex:1;" onclick="copyProject('${product.id}')">Copy Project</button>
                    <button class="action-btn" style="flex:1;" onclick="closeModal()">Close</button>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Copy project functionality
        function copyProject(id) {
            const product = PRODUCTS.find(p => p.id === id);
            if (!product) return;

            const projectInfo = `
# ${product.name}
Version: ${product.version}
Forge: ${product.forge}
Status: ${product.status}

## Description
${product.description}

## Files
${product.files.join('\n')}

## URL
${product.url || 'Not deployed yet'}

---
Copied from Build Guild Library
https://conciousnessrevolution.io/BUILD_GUILD_LIBRARY.html
            `.trim();

            navigator.clipboard.writeText(projectInfo).then(() => {
                showToast('Project info copied!');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProducts(btn.dataset.filter, document.getElementById('searchBox').value);
            });
        });

        document.getElementById('searchBox').addEventListener('input', (e) => {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            renderProducts(activeFilter, e.target.value);
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        // Initial render
        renderProducts();
    </script>
</body>
</html>
