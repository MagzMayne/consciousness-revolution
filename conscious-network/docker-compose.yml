version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Conscious Network — Docker Compose
#
# The "all-in-one" service runs all 7 agents in a single process sharing
# an in-memory event bus (ideal for local development and demos).
#
# For a distributed deployment where each agent runs independently, replace
# the in-memory bus with an external broker (NATS, Redis Streams, etc.) and
# uncomment the individual service definitions below.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── All-in-One (demo / dev mode) ──────────────────────────────────────────
  conscious-network:
    build:
      context: .
      dockerfile: Dockerfile
    image: conscious-network:latest
    container_name: conscious-network
    ports:
      - "3100:3100"   # Communication Agent HTTP API
      - "3102:3102"   # Learning Agent query endpoint
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      ACTION_SAFE_MODE: "true"
      COMMUNICATION_HTTP_PORT: "3100"
      LEARNING_HTTP_PORT: "3102"
      # Tune reflection / insight schedule (seconds-based via ms env vars below)
      # REFLECTION_INTERVAL_MS: "60000"
      # INSIGHT_INTERVAL_MS: "30000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Individual agent services (future: external bus) ──────────────────────
  # Uncomment and configure when using an external message broker.
  #
  # communication:
  #   build:
  #     context: .
  #     dockerfile: agents/communication/Dockerfile
  #   ports: ["3100:3100"]
  #   environment:
  #     COMMUNICATION_HTTP_PORT: "3100"
  #     BUS_URL: "nats://nats:4222"
  #   depends_on: [nats]
  #
  # coordination:
  #   build:
  #     context: .
  #     dockerfile: agents/coordination/Dockerfile
  #   environment:
  #     BUS_URL: "nats://nats:4222"
  #   depends_on: [nats]
  #
  # learning:
  #   build:
  #     context: .
  #     dockerfile: agents/learning/Dockerfile
  #   ports: ["3102:3102"]
  #   environment:
  #     LEARNING_HTTP_PORT: "3102"
  #     BUS_URL: "nats://nats:4222"
  #   depends_on: [nats]
  #
  # adaptation:
  #   build: { context: ., dockerfile: agents/adaptation/Dockerfile }
  #   environment: { BUS_URL: "nats://nats:4222" }
  #   depends_on: [nats]
  #
