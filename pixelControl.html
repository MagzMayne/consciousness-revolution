<body>
  <canvas id="pixelCanvas"></canvas>

  <div id="ui">
    <h1>Pixel Control</h1>
    <small>Full-screen per-pixel control. Write scripts to drive the display.</small>

    <textarea id="scriptInput" placeholder="// Example:
// const { width, height, setPixel, clear } = api;
// clear(0, 0, 0, 255);
// for (let y = 0; y < height; y++) {
//   for (let x = 0; x < width; x++) {
//     const r = (x * 255) / width;
//     const g = (y * 255) / height;
//     const b = 128;
//     setPixel(x, y, r, g, b, 255);
//   }
// }"></textarea>

    <div>
      <button id="runScriptBtn">Run Script</button>
      <button id="resetAnimBtn" class="secondary">Reset Animation</button>
    </div>
    <div>
      <button id="connectWalletBtn" class="secondary">Connect Wallet</button>
    </div>
  </div>

  <script>
    // =========================
    // AI Grid Link Integration Layer
    // =========================
    (function() {
      'use strict';
      
      // Initialize AI Grid Link communication
      window.aiGridLinkReady = true;
      
      // Broadcast AI pulse for grid synchronization
      function broadcastAIPulse() {
        const event = new CustomEvent('ai-grid-pulse', {
          detail: {
            source: 'pixelControl',
            timestamp: Date.now(),
            status: 'active',
            visualizerReady: true
          }
        });
        document.dispatchEvent(event);
      }
      
      // Listen for grid updates from aiGridLink.html
      document.addEventListener('grid-data-update', (event) => {
        if (event.detail && window.visualizerAPI) {
          window.visualizerAPI.onGridUpdate(event.detail);
        }
      });
      
      // Listen for autonomous agent deployments
      document.addEventListener('autonomous-agent-deploy', (event) => {
        console.log('[PixelControl] Agent deployed:', event.detail);
      });
      
      // Broadcast initial pulse on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', broadcastAIPulse);
      } else {
        broadcastAIPulse();
      }
      
      // Periodic pulse broadcast
      setInterval(broadcastAIPulse, 3000);
      
      console.log('[PixelControl] AI Grid Link integration initialized');
    })();

    // =========================
    // Core pixel engine (Canvas 2D)
    // =========================
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let width = 0;
    let height = 0;
    let imageData = null;
    let data = null;
    let t = 0;
    let useDefaultAnimation = true;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      width = Math.floor(window.innerWidth * dpr);
      height = Math.floor(window.innerHeight * dpr);
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';

      imageData = ctx.createImageData(width, height);
      data = imageData.data;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setPixel(x, y, r, g, b, a = 255) {
      if (x < 0 || x >= width || y < 0 || y >= height) return;
      const index = (y * width + x) * 4;
      data[index] = r;
      data[index + 1] = g;
      data[index + 2] = b;
      data[index + 3] = a;
    }

    function clear(r = 0, g = 0, b = 0, a = 255) {
      for (let i = 0; i < data.length; i += 4) {
        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
        data[i + 3] = a;
      }
    }

    function defaultAnimation() {
      clear(0, 0, 0, 255);
      const scale = 0.002;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const r = (Math.sin((x + t) * scale) * 0.5 + 0.5) * 255;
          const g = (Math.sin((y + t) * scale) * 0.5 + 0.5) * 255;
          const b = (Math.sin((x + y + t) * scale) * 0.5 + 0.5) * 255;
          setPixel(x, y, r, g, b, 255);
        }
      }
    }

    function render() {
      if (useDefaultAnimation) {
        defaultAnimation();
        ctx.putImageData(imageData, 0, 0);
        t += 1;
      }
      requestAnimationFrame(render);
    }

    render();

    // =========================
    // Script execution
    // =========================
    const runScriptBtn = document.getElementById('runScriptBtn');
    const resetAnimBtn = document.getElementById('resetAnimBtn');
    const scriptInput = document.getElementById('scriptInput');

    runScriptBtn.addEventListener('click', () => {
      const userCode = scriptInput.value;
      const api = {
        width,
        height,
        setPixel,
        clear,
        ctx,
        imageData,
        data,
        time: () => t
      };

      try {
        useDefaultAnimation = false;
        const fn = new Function('api', userCode);
        fn(api);
        ctx.putImageData(imageData, 0, 0);
      } catch (err) {
        console.error('Script error:', err);
        alert('Script error: ' + err.message);
      }
    });

    resetAnimBtn.addEventListener('click', () => {
      useDefaultAnimation = true;
    });

    // =========================
    // Web3 integration scaffold
    // =========================
    const connectWalletBtn = document.getElementById('connectWalletBtn');

    async function connectWallet() {
      if (!window.ethereum) {
        alert('No Web3 wallet detected (e.g., MetaMask).');
        return;
      }

      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const account = accounts[0];
        console.log('Connected wallet:', account);
        connectWalletBtn.textContent =
          'Wallet: ' + account.slice(0, 6) + '...' + account.slice(-4);
        connectWalletBtn.disabled = true;

        // Here you can:
        // - Instantiate a provider/signer (ethers.js or web3.js)
        // - Bind pixel states to on-chain data
        // - Store/retrieve scripts or frames as NFTs or state channels
      } catch (err) {
        console.error('Wallet connection error:', err);
        alert('Wallet connection error: ' + err.message);
      }
    }

    connectWalletBtn.addEventListener('click', connectWallet);
    
    // =========================
    // Visualizer API for Grid Integration
    // =========================
    window.visualizerAPI = {
      canvas,
      ctx,
      width: () => width,
      height: () => height,
      
      // Grid data visualization
      onGridUpdate: function(gridData) {
        if (!gridData) return;
        
        // Visualize grid nodes and connections
        if (gridData.nodes && gridData.nodes.length > 0) {
          clear(0, 0, 0, 255);
          
          // Draw nodes as colored pixels
          gridData.nodes.forEach(node => {
            if (node.x !== undefined && node.y !== undefined) {
              const px = Math.floor((node.x / 100) * width);
              const py = Math.floor((node.y / 100) * height);
              const color = node.anomaly ? [245, 101, 101] : 
                           node.type === 'core' ? [79, 209, 197] : 
                           [99, 179, 237];
              
              // Draw a small circle of pixels
              for (let dy = -3; dy <= 3; dy++) {
                for (let dx = -3; dx <= 3; dx++) {
                  if (dx*dx + dy*dy <= 9) {
                    setPixel(px + dx, py + dy, color[0], color[1], color[2], 255);
                  }
                }
              }
            }
          });
          
          ctx.putImageData(imageData, 0, 0);
        }
      },
      
      // Expose core rendering functions
      setPixel,
      clear,
      
      // Animation control
      pauseAnimation: function() {
        useDefaultAnimation = false;
      },
      
      resumeAnimation: function() {
        useDefaultAnimation = true;
      },
      
      // Execute custom visualization script
      executeScript: function(script) {
        try {
          const api = {
            width,
            height,
            setPixel,
            clear,
            ctx,
            imageData,
            data,
            time: () => t
          };
          useDefaultAnimation = false;
          const fn = new Function('api', script);
          fn(api);
          ctx.putImageData(imageData, 0, 0);
          return { success: true };
        } catch (err) {
          console.error('[PixelControl] Script error:', err);
          return { success: false, error: err.message };
        }
      }
    };
    
    // =========================
    // Status Indicator
    // =========================
    (function() {
      const statusDiv = document.createElement('div');
      statusDiv.style.cssText = `
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(79, 209, 197, 0.1);
        border: 1px solid #4fd1c5;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.7rem;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 1000;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        animation: pulseGlow 3s ease-in-out infinite;
      `;
      
      statusDiv.innerHTML = `
        <div style="width: 6px; height: 6px; border-radius: 50%; background: #4fd1c5; animation: beaconPulse 1.5s ease-out infinite;"></div>
        <span>AI Grid Link Active</span>
      `;
      
      // Add CSS animations
      const style = document.createElement('style');
      style.textContent = `
        @keyframes pulseGlow {
          0%, 100% { box-shadow: 0 0 10px rgba(79, 209, 197, 0.3); }
          50% { box-shadow: 0 0 20px rgba(79, 209, 197, 0.6), 0 0 30px rgba(79, 209, 197, 0.4); }
        }
        @keyframes beaconPulse {
          0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.7); }
          70% { box-shadow: 0 0 0 10px rgba(79, 209, 197, 0); }
          100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0); }
        }
      `;
      document.head.appendChild(style);
      document.body.appendChild(statusDiv);
    })();
    
    // Log initialization
    console.log('[PixelControl] Visualizer initialized and ready');
    console.log('[PixelControl] API available at window.visualizerAPI');
  </script>
