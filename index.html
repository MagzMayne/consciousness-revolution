    /* Flower of Life SVG */

      position: relative;
      width: 700px;
      height: 700px;

    .flower-of-life {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      animation: rotate-slow 120s linear infinite;
    }

    @keyframes rotate-slow {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .flower-circle {
      fill: none;
      stroke: rgba(255, 215, 0, 0.15);
      stroke-width: 1;

    .flower-circle:nth-child(odd) {

    @keyframes pulse {

    @keyframes float {

  <script>
    // Carousel functionality
    let currentIndex = 0;
    let autoRotateInterval;
    let itemsPerView = 3;
    const AUTO_ROTATE_INTERVAL = 4000; // 4 seconds

    const track = document.getElementById('carouselTrack');
    const links = track.querySelectorAll('.nav-link');
    const totalItems = links.length;

    // Calculate items per view based on viewport width
    function calculateItemsPerView() {
      const containerWidth = document.querySelector('.carousel-container').offsetWidth;
      const itemWidth = links[0].offsetWidth;
      const gap = window.innerWidth <= 768 ? 16 : 32; // 1rem or 2rem in pixels
      
      // Calculate how many items can fit
      itemsPerView = Math.floor(containerWidth / (itemWidth + gap));
      itemsPerView = Math.max(1, Math.min(itemsPerView, totalItems));
      
      return itemsPerView;
    }

    // Initial calculation
    calculateItemsPerView();
    const maxIndex = Math.max(0, totalItems - itemsPerView);

    // Create indicators
    const indicatorsContainer = document.getElementById('carouselIndicators');
    for (let i = 0; i <= maxIndex; i++) {
      const indicator = document.createElement('div');
      indicator.className = 'indicator';
      if (i === 0) indicator.classList.add('active');
      indicator.onclick = () => goToSlide(i);
      indicatorsContainer.appendChild(indicator);
    }

    function updateCarousel() {
      const itemWidth = links[0].offsetWidth;
      const gap = window.innerWidth <= 768 ? 16 : 32;
      const offset = -(currentIndex * (itemWidth + gap));
      track.style.transform = `translateX(${offset}px)`;

      // Update indicators
      const indicators = indicatorsContainer.querySelectorAll('.indicator');
      indicators.forEach((ind, idx) => {
        ind.classList.toggle('active', idx === currentIndex);
      });
    }

    function moveCarousel(direction) {
      const newMaxIndex = Math.max(0, totalItems - calculateItemsPerView());
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = newMaxIndex;
      if (currentIndex > newMaxIndex) currentIndex = 0;
      updateCarousel();
      resetAutoRotate();
    }

    function goToSlide(index) {
      const newMaxIndex = Math.max(0, totalItems - calculateItemsPerView());
      currentIndex = Math.min(index, newMaxIndex);
      updateCarousel();
      resetAutoRotate();
    }

    function autoRotate() {
      const newMaxIndex = Math.max(0, totalItems - calculateItemsPerView());
      currentIndex++;
      if (currentIndex > newMaxIndex) currentIndex = 0;
      updateCarousel();
    }

    function startAutoRotate() {
      autoRotateInterval = setInterval(autoRotate, AUTO_ROTATE_INTERVAL);
    }

    function stopAutoRotate() {
      clearInterval(autoRotateInterval);
    }

    function resetAutoRotate() {
      stopAutoRotate();
      startAutoRotate();
    }

    // Pause on hover
    const carouselContainer = document.querySelector('.carousel-container');
    carouselContainer.addEventListener('mouseenter', stopAutoRotate);
    carouselContainer.addEventListener('mouseleave', startAutoRotate);

    // Touch/swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;

    carouselContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      stopAutoRotate();
    });

    carouselContainer.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
      startAutoRotate();
    });

    function handleSwipe() {
      const swipeThreshold = 50;
      if (touchStartX - touchEndX > swipeThreshold) {
        moveCarousel(1); // Swipe left
      } else if (touchEndX - touchStartX > swipeThreshold) {
        moveCarousel(-1); // Swipe right
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        moveCarousel(-1);
      } else if (e.key === 'ArrowRight') {
        moveCarousel(1);
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      calculateItemsPerView();
      updateCarousel();
    });

    // Initialize carousel
    updateCarousel();
    startAutoRotate();

    // Existing hover effects for portals
    document.querySelectorAll('.portal, .center-portal').forEach(portal => {
      portal.addEventListener('mouseenter', () => {
        portal.style.transform = portal.classList.contains('center-portal')
          ? 'translate(-50%, -50%) scale(1.1)'
          : 'scale(1.15)';
      });
      portal.addEventListener('mouseleave', () => {
        portal.style.transform = portal.classList.contains('center-portal')
          ? 'translate(-50%, -50%) scale(1)'
          : 'scale(1)';
      });
    });
  </script>
