    <div class="container">
        <h1>🏛️ SAM.gov Authentication</h1>
        <div class="spinner"></div>
        <p>Processing your SAM.gov authentication...</p>
        <div id="status"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Get URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const state = urlParams.get('state');
                const error = urlParams.get('error');

                if (error) {
                    throw new Error(`SAM.gov authentication failed: ${error}`);
                }

                if (!code || !state) {
                    throw new Error('Missing authorization code or state parameter');
                }

                console.log('🔄 Processing SAM.gov callback...');

                // Handle the OAuth callback
                const result = await window.securityClearanceAuth.handleSAMGovCallback(code, state);

                if (result.success) {
                    document.getElementById('status').innerHTML =
                        '<div class="success">✅ Authentication successful! Redirecting...</div>';

                    // Redirect to main contracts page after successful auth
                    setTimeout(() => {
                        window.location.href = 'classified-contracts.html';
                    }, 2000);
                } else {
                    throw new Error(result.error);
                }

            } catch (error) {
                console.error('SAM.gov callback error:', error);
                document.getElementById('status').innerHTML =
                    `<div class="error">❌ ${error.message}</div>`;

                // Redirect back to login page after error
                setTimeout(() => {
                    window.location.href = 'classified-contracts.html';
                }, 5000);
            }
        });
    </script>
