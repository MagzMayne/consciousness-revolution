<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Diff Tool - Consciousness Revolution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #00ffff;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ffff;
    }

    .tagline {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 15px;
      margin-bottom: 30px;
      background: rgba(0,255,255,0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(0,255,255,0.2);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select {
      background: rgba(0,0,0,0.5);
      border: 1px solid #00ffff;
      color: #00ffff;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(0,255,255,0.5);
    }

    button {
      background: linear-gradient(135deg, #00ffff 0%, #0099ff 100%);
      border: none;
      color: #000;
      padding: 12px 30px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      align-self: end;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0,255,255,0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .panel {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 8px;
      padding: 20px;
    }

    .panel.ahead { border-color: #00ff88; }
    .panel.behind { border-color: #ff6b6b; }
    .panel.shared { border-color: #ffd700; }

    .panel h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel.ahead h2 { color: #00ff88; }
    .panel.behind h2 { color: #ff6b6b; }
    .panel.shared h2 { color: #ffd700; }

    .badge {
      background: rgba(255,255,255,0.1);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .feature-card {
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.3s ease;
    }

    .feature-card:hover {
      background: rgba(0,255,255,0.1);
      border-color: rgba(0,255,255,0.5);
      transform: translateX(5px);
    }

    .feature-name {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 5px;
      color: #00ffff;
    }

    .feature-meta {
      font-size: 0.8rem;
      color: #888;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .feature-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .version-tag {
      background: rgba(0,255,255,0.2);
      padding: 2px 8px;
      border-radius: 4px;
      color: #00ffff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0,255,255,0.5);
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: #00ffff;
    }

    .error {
      background: rgba(255,107,107,0.1);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ DASHBOARD DIFF TOOL</h1>
    <p class="tagline">Compare features between operator dashboards</p>

    <div class="controls">
      <div class="input-group">
        <label for="dashboard1">Dashboard 1</label>
        <select id="dashboard1">
          <option value="">-- Select Dashboard --</option>
        </select>
      </div>

      <div class="input-group">
        <label for="dashboard2">Dashboard 2</label>
        <select id="dashboard2">
          <option value="">-- Select Dashboard --</option>
        </select>
      </div>

      <button id="compareBtn" disabled>Compare</button>
    </div>

    <div id="statsContainer" style="display: none;">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="stat1Features">0</div>
          <div class="stat-label">Dashboard 1</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat2Features">0</div>
          <div class="stat-label">Dashboard 2</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statAhead">0</div>
          <div class="stat-label">Ahead</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statBehind">0</div>
          <div class="stat-label">Behind</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statShared">0</div>
          <div class="stat-label">Shared</div>
        </div>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    // Load available dashboards from feature registry
    async function loadDashboards() {
      try {
        const response = await fetch('/DASHBOARD_FEATURES_REGISTRY.json');
        const registry = await response.json();

        // Extract unique dashboard names
        const dashboards = new Set();
        registry.features.forEach(feature => {
          feature.installations.forEach(inst => {
            dashboards.add(inst.dashboard);
          });
        });

        // Populate dropdowns
        const sortedDashboards = Array.from(dashboards).sort();
        const dash1Select = document.getElementById('dashboard1');
        const dash2Select = document.getElementById('dashboard2');

        sortedDashboards.forEach(dash => {
          dash1Select.innerHTML += `<option value="${dash}">${dash.replace('.html', '')}</option>`;
          dash2Select.innerHTML += `<option value="${dash}">${dash.replace('.html', '')}</option>`;
        });

      } catch (error) {
        console.error('Failed to load dashboards:', error);
        document.getElementById('results').innerHTML = `
          <div class="error">Failed to load dashboard list: ${error.message}</div>
        `;
      }
    }

    // Enable compare button when both dashboards selected
    document.getElementById('dashboard1').addEventListener('change', checkReady);
    document.getElementById('dashboard2').addEventListener('change', checkReady);

    function checkReady() {
      const dash1 = document.getElementById('dashboard1').value;
      const dash2 = document.getElementById('dashboard2').value;
      document.getElementById('compareBtn').disabled = !(dash1 && dash2);
    }

    // Compare dashboards
    document.getElementById('compareBtn').addEventListener('click', async () => {
      const dash1 = document.getElementById('dashboard1').value;
      const dash2 = document.getElementById('dashboard2').value;

      document.getElementById('results').innerHTML = '<div class="loading">⚡ Analyzing dashboards...</div>';

      try {
        const response = await fetch('/.netlify/functions/dashboard-diff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dashboard1: dash1, dashboard2: dash2 })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Comparison failed');

        displayResults(data);

      } catch (error) {
        console.error('Comparison error:', error);
        document.getElementById('results').innerHTML = `
          <div class="error">Comparison failed: ${error.message}</div>
        `;
      }
    });

    function displayResults(data) {
      // Update stats
      document.getElementById('stat1Features').textContent = data.stats.dashboard1_features;
      document.getElementById('stat2Features').textContent = data.stats.dashboard2_features;
      document.getElementById('statAhead').textContent = data.stats.unique_to_dashboard1;
      document.getElementById('statBehind').textContent = data.stats.unique_to_dashboard2;
      document.getElementById('statShared').textContent = data.stats.shared;
      document.getElementById('statsContainer').style.display = 'block';

      // Render feature panels
      const resultsHTML = `
        <div class="results">
          <div class="panel ahead">
            <h2>
              ⬆️ Ahead
              <span class="badge">${data.comparison.ahead.length}</span>
            </h2>
            ${renderFeatures(data.comparison.ahead, 'ahead')}
          </div>

          <div class="panel shared">
            <h2>
              🔄 Shared
              <span class="badge">${data.comparison.shared.length}</span>
            </h2>
            ${renderSharedFeatures(data.comparison.shared)}
          </div>

          <div class="panel behind">
            <h2>
              ⬇️ Behind
              <span class="badge">${data.comparison.behind.length}</span>
            </h2>
            ${renderFeatures(data.comparison.behind, 'behind')}
          </div>
        </div>
      `;

      document.getElementById('results').innerHTML = resultsHTML;
    }

    function renderFeatures(features, type) {
      if (features.length === 0) {
        return '<div class="empty">No unique features</div>';
      }

      return features.map(feat => `
        <div class="feature-card">
          <div class="feature-name">${feat.name}</div>
          <div class="feature-meta">
            <span>📦 <span class="version-tag">v${feat.version}</span></span>
            <span>👤 ${feat.author}</span>
            <span>🏷️ ${feat.category}</span>
            <span>⚡ ${feat.lfsme_avg.toFixed(1)}/10</span>
          </div>
        </div>
      `).join('');
    }

    function renderSharedFeatures(features) {
      if (features.length === 0) {
        return '<div class="empty">No shared features</div>';
      }

      return features.map(feat => `
        <div class="feature-card">
          <div class="feature-name">${feat.name}</div>
          <div class="feature-meta">
            <span>📦 D1: <span class="version-tag">v${feat.dashboard1_version}</span></span>
            <span>📦 D2: <span class="version-tag">v${feat.dashboard2_version}</span></span>
            ${!feat.version_match ? '<span style="color: #ff6b6b;">⚠️ Version mismatch</span>' : '<span style="color: #00ff88;">✓ Synced</span>'}
          </div>
        </div>
      `).join('');
    }

    // Initialize
    loadDashboards();
  </script>
</body>
</html>
