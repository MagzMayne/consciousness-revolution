<html>
<head>
    <title>Test igGems.html</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
        .test { margin: 10px 0; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
    </style>
    <link rel="stylesheet" href="/css/universal-styles.css">
</head>
<body>
    <h1>igGems.html Feature Tests</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function test(name, fn) {
            try {
                const result = fn();
                results.innerHTML += `<div class="test pass">✓ ${name}</div>`;
                return true;
            } catch (e) {
                results.innerHTML += `<div class="test fail">✗ ${name}: ${e.message}</div>`;
                return false;
            }
        }
        
        // Test 1: Check HTML structure
        fetch('igGems.html')
            .then(r => r.text())
            .then(html => {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                
                // Test required elements
                test('Manual Entry Button Exists', () => {
                    if (!html.includes('id="manualEntryBtn"')) throw new Error('Missing');
                    return true;
                });
                
                test('CSV Import Button Exists', () => {
                    if (!html.includes('id="csvImportBtn"')) throw new Error('Missing');
                    return true;
                });
                
                test('JSON Import Button Exists', () => {
                    if (!html.includes('id="jsonImportBtn"')) throw new Error('Missing');
                    return true;
                });
                
                test('Clear Data Button Exists', () => {
                    if (!html.includes('id="clearDataBtn"')) throw new Error('Missing');
                    return true;
                });
                
                // Test table columns
                test('Table Has 10 Columns', () => {
                    const ths = html.match(/<th>/g);
                    if (!ths || ths.length !== 10) throw new Error(`Found ${ths?.length || 0} columns`);
                    return true;
                });
                
                test('Source Column Exists', () => {
                    if (!html.includes('<th>Source</th>')) throw new Error('Missing');
                    return true;
                });
                
                test('eBay Avg Column Exists', () => {
                    if (!html.includes('<th>eBay Avg</th>')) throw new Error('Missing');
                    return true;
                });
                
                test('Potential Profit Column Exists', () => {
                    if (!html.includes('<th>Potential Profit</th>')) throw new Error('Missing');
                    return true;
                });
                
                test('ROI % Column Exists', () => {
                    if (!html.includes('<th>ROI %</th>')) throw new Error('Missing');
                    return true;
                });
                
                test('Confidence Column Exists', () => {
                    if (!html.includes('<th>Confidence</th>')) throw new Error('Missing');
                    return true;
                });
                
                // Test key functions
                test('fetchEbaySoldHTML Function Exists', () => {
                    if (!html.includes('async function fetchEbaySoldHTML')) throw new Error('Missing');
                    return true;
                });
                
                test('CORS Proxy Implementation', () => {
                    if (!html.includes('cors.isomorphic-git.org')) throw new Error('Missing');
                    return true;
                });
                
                test('Jina Reader Fallback', () => {
                    if (!html.includes('r.jina.ai')) throw new Error('Missing');
                    return true;
                });
                
                test('parseEbayItemsHTML Function Exists', () => {
                    if (!html.includes('function parseEbayItemsHTML')) throw new Error('Missing');
                    return true;
                });
                
                test('parseEbayItemsText Function Exists', () => {
                    if (!html.includes('function parseEbayItemsText')) throw new Error('Missing');
                    return true;
                });
                
                test('computeStats Function Exists', () => {
                    if (!html.includes('function computeStats')) throw new Error('Missing');
                    return true;
                });
                
                test('LocalStorage saveToStorage Function', () => {
                    if (!html.includes('function saveToStorage')) throw new Error('Missing');
                    return true;
                });
                
                test('LocalStorage loadFromStorage Function', () => {
                    if (!html.includes('function loadFromStorage')) throw new Error('Missing');
                    return true;
                });
                
                test('CSV Import Handler', () => {
                    if (!html.includes('csvFileInput')) throw new Error('Missing');
                    return true;
                });
                
                test('JSON Import Handler', () => {
                    if (!html.includes('importJsonBtn')) throw new Error('Missing');
                    return true;
                });
                
                test('ROI Calculation Logic', () => {
                    if (!html.includes('(profit / stone.price_value) * 100')) throw new Error('Missing');
                    return true;
                });
                
                // Test styling
                test('Dark Theme Background', () => {
                    if (!html.includes('background: #0b1020')) throw new Error('Missing');
                    return true;
                });
                
                test('Card Layout Styling', () => {
                    if (!html.includes('background: #151a2c')) throw new Error('Missing');
                    return true;
                });
                
                test('Profit Color Coding', () => {
                    if (!html.includes('profit-positive')) throw new Error('Missing');
                    if (!html.includes('profit-negative')) throw new Error('Missing');
                    return true;
                });
                
                test('ROI Color Coding', () => {
                    if (!html.includes('roi-high')) throw new Error('Missing');
                    if (!html.includes('roi-med')) throw new Error('Missing');
                    return true;
                });
                
                test('Confidence Color Coding', () => {
                    if (!html.includes('conf-high')) throw new Error('Missing');
                    if (!html.includes('conf-med')) throw new Error('Missing');
                    return true;
                });
                
                // Test update notification system
                test('Update Notification Meta Tags', () => {
                    if (!html.includes('git-commit-hash')) throw new Error('Missing');
                    return true;
                });
                
                test('Update Notification Scripts', () => {
                    if (!html.includes('update-notification-system.js')) throw new Error('Missing');
                    if (!html.includes('update-helper.js')) throw new Error('Missing');
                    return true;
                });
                
                results.innerHTML += '<br><h2>All Tests Passed! ✓</h2>';
            })
            .catch(e => {
                results.innerHTML += `<div class="test fail">✗ Failed to load file: ${e.message}</div>`;
            });
    </script>
    <script src="/js/universal-utilities.js"></script>

    <!-- Universal Navigation - Added by Project Fixer -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof BarbrickUniversal !== 'undefined') {
                // Only add navigation if not already present
                if (!document.querySelector('.universal-header')) {
                    BarbrickUniversal.createBackButton();
                }
                
                // Add footer if not present
                if (!document.querySelector('.universal-footer')) {
                    BarbrickUniversal.createFooter();
                }
            }
        });
    </script>
</body>
</html>
