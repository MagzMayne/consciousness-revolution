SSO Landing Page
Consumes a cross-site SSO token from the URL hash, stores the user profile,
and redirects to the intended destination or the home page.
════════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Signing you in… — Consciousness Revolution</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(10, 10, 20, 0.85);
      border: 1px solid rgba(15, 245, 224, 0.3);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      backdrop-filter: blur(12px);
    }
    h1 { color: #0ff5e0; font-size: 1.4rem; margin-bottom: 12px; }
    .status { color: #9ca3af; font-size: 0.9rem; margin-bottom: 24px; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(15, 245, 224, 0.2);
      border-top-color: #0ff5e0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6464; font-size: 0.9rem; }
    .success { color: #39ff14; font-size: 0.9rem; }
    a { color: #0ff5e0; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1 id="heading">Completing Sign-In</h1>
    <p class="status" id="status-msg" aria-live="polite">Verifying your session token…</p>
  </div>

  <script>
  (async function() {
    const SSO_API = 'https://conciousnessrevolution.io/api/sso-token';
    const LS_KEY  = 'cr_user_cache';

    const headingEl = document.getElementById('heading');
    const statusEl  = document.getElementById('status-msg');
    const spinner   = document.getElementById('spinner');

    function setError(msg) {
      spinner.style.display = 'none';
      headingEl.textContent = 'Sign-In Failed';
      statusEl.innerHTML = `<span class="error">${msg}</span><br><br><a href="/login.html">Try signing in manually →</a>`;
    }

    // Parse token from URL hash: #sso_token=<token>
    const hash = window.location.hash;
    const match = hash.match(/[#&]sso_token=([a-f0-9]{64})/i);
    if (!match) {
      setError('No SSO token found in URL.');
      return;
    }
    const token = match[1];

    // Remove token from URL immediately (don't leave it in browser history)
    history.replaceState(null, '', window.location.pathname + window.location.search);

    try {
      const res = await fetch(`${SSO_API}?action=verify`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ action: 'verify', token })
      });

      const data = await res.json();

      if (!data.success || !data.user) {
        setError(data.error || 'Token verification failed.');
        return;
      }

      // Store user profile in localStorage (same format as auth-state.js)
      const cache = { user: data.user, ts: Date.now(), via: 'sso' };
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(cache));
        localStorage.setItem('currentUser', JSON.stringify(data.user));
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('sso_origin', 'conciousnessrevolution.io');
      } catch (e) { /* storage full */ }

      spinner.style.display = 'none';
      headingEl.textContent = 'Welcome, ' + (data.user.full_name || data.user.email.split('@')[0]) + '!';
      statusEl.innerHTML = '<span class="success">Signed in successfully ✓</span><br><small>Redirecting…</small>';

      // Redirect to intended page or home
      const returnUrl = sessionStorage.getItem('ssoReturnUrl') || '/index.html';
      sessionStorage.removeItem('ssoReturnUrl');
      setTimeout(() => { window.location.href = returnUrl; }, 1200);

    } catch (err) {
      setError('Network error: ' + err.message);
    }
  })();
  </script>
</body>
</html>
