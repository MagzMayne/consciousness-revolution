<html lang="en">

    <title>Merlin P5 Visuals - Control Panel 🧙‍♂️✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 25, 45, 0.95);
            border: 2px solid #7F00FF;
            border-radius: 15px;
            padding: 20px;
            width: 320px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(127, 0, 255, 0.3);
            z-index: 10000;
        }
        
        .panel-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(127, 0, 255, 0.3);
        }
        
        .panel-header h2 {
            font-size: 20px;
            background: linear-gradient(90deg, #7F00FF, #E100FF, #00FFF7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }
        
        .panel-header .subtitle {
            font-size: 12px;
            color: #888;
        }
        
        .control-section {
            margin-bottom: 20px;
        }
        
        .control-section h3 {
            font-size: 14px;
            color: #00FFF7;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .mode-btn {
            background: rgba(127, 0, 255, 0.2);
            border: 2px solid #7F00FF;
            color: #fff;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            text-align: center;
        }
        
        .mode-btn:hover {
            background: rgba(127, 0, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(127, 0, 255, 0.4);
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #7F00FF, #E100FF);
            border-color: #E100FF;
            box-shadow: 0 0 20px rgba(225, 0, 255, 0.6);
        }
        
        .color-scheme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .color-btn {
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            color: #fff;
        }
        
        .color-btn:hover {
            transform: translateY(-2px);
        }
        
        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .color-btn.mystic { background: linear-gradient(135deg, #7F00FF, #00FFF7); }
        .color-btn.galaxy { background: linear-gradient(135deg, #EF476F, #06FFA5); }
        .color-btn.rainbow { background: linear-gradient(135deg, #FF006E, #3A86FF); }
        .color-btn.fire { background: linear-gradient(135deg, #FF0000, #FFD700); }
        
        .slider-control {
            margin-bottom: 15px;
        }
        
        .slider-control label {
            display: block;
            font-size: 12px;
            color: #00FFF7;
            margin-bottom: 5px;
        }
        
        .slider-control input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(127, 0, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #7F00FF;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(127, 0, 255, 0.8);
        }
        
        .slider-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #7F00FF;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(127, 0, 255, 0.8);
        }
        
        .slider-value {
            color: #888;
            font-size: 11px;
            float: right;
        }
        
        .toggle-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #E100FF, #7F00FF);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .toggle-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(225, 0, 255, 0.5);
        }
        
        .stats {
            background: rgba(0, 255, 247, 0.1);
            border: 1px solid #00FFF7;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            color: #00FFF7;
        }
        
        .stats div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .toggle-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(127, 0, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(127, 0, 255, 0.5);
        }
        
        @media (max-width: 768px) {
            .control-panel {
                width: 90%;
                right: 5%;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/universal-styles.css">
</head>
<body>
    <!-- Toggle button (shows when panel is hidden) -->
    <button class="toggle-panel" id="togglePanelBtn" onclick="togglePanel()">🧙‍♂️</button>
    
    <!-- Control Panel -->
    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h2>🧙‍♂️ Merlin P5 Visuals ✨</h2>
            <div class="subtitle">Advanced Creative Coding Controls</div>
        </div>
        
        <!-- Visual Modes -->
        <div class="control-section">
            <h3>🎨 Visual Modes</h3>
            <div class="mode-grid">
                <button class="mode-btn active" data-mode="crystal" onclick="setMode('crystal')">
                    💎 Crystal Field
                </button>
                <button class="mode-btn" data-mode="polar" onclick="setMode('polar')">
                    🔵 Polar Gems
                </button>
                <button class="mode-btn" data-mode="flow" onclick="setMode('flow')">
                    🌊 Noise Flow
                </button>
                <button class="mode-btn" data-mode="sphere" onclick="setMode('sphere')">
                    🌍 Spherical Orbit
                </button>
                <button class="mode-btn" data-mode="torus" onclick="setMode('torus')">
                    🍩 Toroidal Dance
                </button>
                <button class="mode-btn" data-mode="aura" onclick="setMode('aura')">
                    ✨ Wizard Aura
                </button>
                <button class="mode-btn" data-mode="sacred" onclick="setMode('sacred')">
                    🕉️ Sacred Geometry
                </button>
            </div>
        </div>
        
        <!-- Color Schemes -->
        <div class="control-section">
            <h3>🎨 Color Palette</h3>
            <div class="color-scheme-grid">
                <button class="color-btn mystic active" data-scheme="mystic" onclick="setColorScheme('mystic')">
                    Mystic
                </button>
                <button class="color-btn galaxy" data-scheme="galaxy" onclick="setColorScheme('galaxy')">
                    Galaxy
                </button>
                <button class="color-btn rainbow" data-scheme="rainbow" onclick="setColorScheme('rainbow')">
                    Rainbow
                </button>
                <button class="color-btn fire" data-scheme="fire" onclick="setColorScheme('fire')">
                    Fire
                </button>
            </div>
        </div>
        
        <!-- Animation Controls -->
        <div class="control-section">
            <h3>⚙️ Animation Controls</h3>
            
            <div class="slider-control">
                <label>
                    Speed
                    <span class="slider-value" id="speedValue">0.01</span>
                </label>
                <input type="range" id="speedSlider" min="0.001" max="0.05" step="0.001" value="0.01" oninput="setSpeed(this.value)">
            </div>
            
            <div class="slider-control">
                <label>
                    Particle Count
                    <span class="slider-value" id="particleValue">100</span>
                </label>
                <input type="range" id="particleSlider" min="20" max="200" step="10" value="100" oninput="setParticleCount(this.value)">
            </div>
            
            <div class="slider-control">
                <label>
                    Glow Strength
                    <span class="slider-value" id="glowValue">3</span>
                </label>
                <input type="range" id="glowSlider" min="1" max="10" step="1" value="3" oninput="setGlowStrength(this.value)">
            </div>
        </div>
        
        <!-- Stats -->
        <div class="control-section">
            <h3>📊 Stats</h3>
            <div class="stats">
                <div>
                    <span>Current Mode:</span>
                    <span id="currentMode">Crystal Field</span>
                </div>
                <div>
                    <span>FPS:</span>
                    <span id="fps">60</span>
                </div>
                <div>
                    <span>Particles:</span>
                    <span id="particleCount">100</span>
                </div>
            </div>
        </div>
        
        <!-- Toggle Visibility -->
        <button class="toggle-btn" onclick="toggleVisibility()">
            🎭 Toggle Visuals
        </button>
        
        <button class="toggle-btn" onclick="togglePanel()" style="background: linear-gradient(135deg, #00FFF7, #0088FF);">
            🔽 Hide Panel
        </button>
    </div>
    
    <!-- Load p5.js and Merlin Visuals -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="./merlin-p5-visuals.js"></script>
    
    <script>
        // Wait for MerlinP5Visuals to initialize
        setTimeout(() => {
            if (window.MerlinP5Visuals && window.MerlinP5Visuals.initialized) {
                console.log('✅ Merlin P5 Visuals ready!');
                updateStats();
                setInterval(updateStats, 1000);
            }
        }, 2000);
        
        function setMode(mode) {
            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });
            
            // Set mode
            window.MerlinP5Visuals.setMode(mode);
            
            // Update mode name display
            const modeNames = {
                crystal: 'Crystal Field',
                polar: 'Polar Gems',
                flow: 'Noise Flow',
                sphere: 'Spherical Orbit',
                torus: 'Toroidal Dance',
                aura: 'Wizard Aura',
                sacred: 'Sacred Geometry'
            };
            document.getElementById('currentMode').textContent = modeNames[mode] || mode;
        }
        
        function setColorScheme(scheme) {
            // Update button states
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.scheme === scheme) {
                    btn.classList.add('active');
                }
            });
            
            // Set color scheme
            window.MerlinP5Visuals.setColorScheme(scheme);
        }
        
        function setSpeed(value) {
            document.getElementById('speedValue').textContent = parseFloat(value).toFixed(3);
            window.MerlinP5Visuals.setSpeed(parseFloat(value));
        }
        
        function setParticleCount(value) {
            document.getElementById('particleValue').textContent = value;
            window.MerlinP5Visuals.config.particleCount = parseInt(value);
            if (window.MerlinP5Visuals.p5Instance) {
                window.MerlinP5Visuals.initParticles(window.MerlinP5Visuals.p5Instance);
            }
        }
        
        function setGlowStrength(value) {
            document.getElementById('glowValue').textContent = value;
            window.MerlinP5Visuals.config.glowStrength = parseInt(value);
        }
        
        function toggleVisibility() {
            window.MerlinP5Visuals.toggleVisibility();
        }
        
        function togglePanel() {
            const panel = document.getElementById('controlPanel');
            const toggleBtn = document.getElementById('togglePanelBtn');
            
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                toggleBtn.style.display = 'none';
            } else {
                panel.style.display = 'none';
                toggleBtn.style.display = 'flex';
            }
        }
        
        function updateStats() {
            if (window.MerlinP5Visuals && window.MerlinP5Visuals.p5Instance) {
                const p = window.MerlinP5Visuals.p5Instance;
                document.getElementById('fps').textContent = Math.round(p.frameRate());
                document.getElementById('particleCount').textContent = window.MerlinP5Visuals.animation.particles.length;
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                togglePanel();
            } else if (e.key === 'v' || e.key === 'V') {
                toggleVisibility();
            } else if (e.key >= '1' && e.key <= '7') {
                const modes = ['crystal', 'polar', 'flow', 'sphere', 'torus', 'aura', 'sacred'];
                const mode = modes[parseInt(e.key) - 1];
                setMode(mode);
            }
        });
        
        console.log('🧙‍♂️ Merlin P5 Control Panel loaded');
        console.log('Keyboard shortcuts:');
        console.log('  H - Toggle panel');
        console.log('  V - Toggle visuals');
        console.log('  1-7 - Switch modes');
    </script>
    <script src="/js/universal-utilities.js"></script>

    <!-- Universal Navigation - Added by Project Fixer -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof BarbrickUniversal !== 'undefined') {
                // Only add navigation if not already present
                if (!document.querySelector('.universal-header')) {
                    BarbrickUniversal.createBackButton();
                }
                
                // Add footer if not present
                if (!document.querySelector('.universal-footer')) {
                    BarbrickUniversal.createFooter();
                }
            }
        });
    </script>
</body>
