<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Duplicate Detection - Warehouse Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: #fff;
        }
        h1 {
            text-align: center;
            color: #22c55e;
            margin-bottom: 30px;
        }
        .test-section {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .test-section h2 {
            color: #4f8cff;
            margin-top: 0;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
        }
        .test-result.success {
            background: #064e3b;
            border-left: 4px solid #22c55e;
        }
        .test-result.error {
            background: #7f1d1d;
            border-left: 4px solid #ef4444;
        }
        .test-result.info {
            background: #1e3a8a;
            border-left: 4px solid #3b82f6;
        }
        .test-result.warning {
            background: #78350f;
            border-left: 4px solid #f59e0b;
        }
        button {
            background: linear-gradient(135deg, #22c55e, #4f8cff);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #results {
            margin-top: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #222;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #4f8cff;
        }
        .stat-card .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
        .stat-card .value {
            color: #22c55e;
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>🧪 Warehouse Scanner - Duplicate Detection Tests</h1>

    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearDatabase()">Clear Database</button>
        <button onclick="viewInventory()">View Inventory</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div class="test-section">
        <h2>Individual Tests</h2>
        <button onclick="testVisualIdGeneration()">Test Visual ID Generation</button>
        <button onclick="testDuplicateDetection()">Test Duplicate Detection</button>
        <button onclick="testLocationTracking()">Test Location Tracking</button>
        <button onclick="testMultipleScans()">Test Multiple Scans</button>
    </div>

    <div class="test-section">
        <h2>Database Statistics</h2>
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="label">Total Items</div>
                <div class="value" id="totalItems">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Tests Passed</div>
                <div class="value" id="testsPassed">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Tests Failed</div>
                <div class="value" id="testsFailed">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Duplicates Prevented</div>
                <div class="value" id="duplicatesPrevented">0</div>
            </div>
        </div>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="results"></div>
    </div>

    <!-- Load dependencies -->
    <script src="js/warehouse-inventory-db.js"></script>
    <script src="js/warehouse-valuation-engine.js"></script>
    <script src="js/warehouse-scanner-ai.js"></script>
    
    <script>
        let testsPassed = 0;
        let testsFailed = 0;
        let duplicatesPrevented = 0;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.insertBefore(div, results.firstChild);
        }

        function updateStats() {
            document.getElementById('testsPassed').textContent = testsPassed;
            document.getElementById('testsFailed').textContent = testsFailed;
            document.getElementById('duplicatesPrevented').textContent = duplicatesPrevented;
        }

        async function updateItemCount() {
            const stats = await warehouseDB.getStats();
            document.getElementById('totalItems').textContent = stats.totalItems;
        }

        async function clearDatabase() {
            await warehouseDB.clearAll();
            log('✅ Database cleared', 'success');
            await updateItemCount();
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            testsPassed = 0;
            testsFailed = 0;
            duplicatesPrevented = 0;
            updateStats();
        }

        async function viewInventory() {
            const items = await warehouseDB.getAllItems();
            log(`📦 Current inventory: ${items.length} items`, 'info');
            items.forEach(item => {
                log(`  - ${item.name} (ID: ${item.id}, Visual ID: ${item.visualId}, Location: ${item.location})`, 'info');
            });
        }

        // Test 1: Visual ID Generation
        async function testVisualIdGeneration() {
            log('🧪 Test 1: Visual ID Generation', 'info');
            
            try {
                // Create mock detection with sample image data
                const mockDetection = {
                    class: 'tv',
                    bbox: [100, 200, 300, 400],
                    score: 0.95
                };
                
                const mockImageData = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAAA//EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AT//Z';
                
                // Generate visual ID
                const visualId = scannerAI.generateVisualId(mockImageData, mockDetection);
                
                if (visualId && visualId.length > 0) {
                    log(`✅ Visual ID generated: ${visualId}`, 'success');
                    testsPassed++;
                } else {
                    log('❌ Failed to generate visual ID', 'error');
                    testsFailed++;
                }
            } catch (error) {
                log(`❌ Error in test: ${error.message}`, 'error');
                testsFailed++;
            }
            
            updateStats();
        }

        // Test 2: Duplicate Detection
        async function testDuplicateDetection() {
            log('🧪 Test 2: Duplicate Detection', 'info');
            
            try {
                // Add first item
                const item1 = {
                    name: 'Test TV',
                    category: 'monitor',
                    visualId: 'tv_10-20-30-40_abc123',
                    location: 'A1',
                    value: 200
                };
                
                const saved1 = await warehouseDB.addItem(item1);
                log(`✅ First item added: ${saved1.name} (ID: ${saved1.id})`, 'success');
                
                // Try to add duplicate with same visual ID
                const item2 = {
                    name: 'Test TV (Duplicate)',
                    category: 'monitor',
                    visualId: 'tv_10-20-30-40_abc123',
                    location: 'A1',
                    value: 200
                };
                
                const duplicateCheck = await warehouseDB.checkForDuplicate(item2);
                
                if (duplicateCheck.isDuplicate) {
                    log(`✅ Duplicate detected correctly! Match type: ${duplicateCheck.matchType}`, 'success');
                    log(`   Existing item: ${duplicateCheck.existingItem.name} (ID: ${duplicateCheck.existingItem.id})`, 'info');
                    testsPassed++;
                    duplicatesPrevented++;
                } else {
                    log('❌ Duplicate not detected', 'error');
                    testsFailed++;
                }
                
                await updateItemCount();
            } catch (error) {
                log(`❌ Error in test: ${error.message}`, 'error');
                testsFailed++;
            }
            
            updateStats();
        }

        // Test 3: Location Tracking
        async function testLocationTracking() {
            log('🧪 Test 3: Location Tracking', 'info');
            
            try {
                // Add item at location A1
                const item = {
                    name: 'Moving TV',
                    category: 'monitor',
                    visualId: 'tv_move_test_xyz789',
                    location: 'A1',
                    value: 300
                };
                
                const saved = await warehouseDB.addItem(item);
                log(`✅ Item added at location A1 (ID: ${saved.id})`, 'success');
                
                // Move to location B2
                await warehouseDB.updateItemLocation(saved.id, 'B2');
                log('📍 Item moved to B2', 'success');
                
                // Move to location C3
                await warehouseDB.updateItemLocation(saved.id, 'C3');
                log('📍 Item moved to C3', 'success');
                
                // Verify location history
                const updated = await warehouseDB.getItem(saved.id);
                
                if (updated.locationHistory && updated.locationHistory.length === 3) {
                    log('✅ Location history tracked correctly:', 'success');
                    updated.locationHistory.forEach((entry, idx) => {
                        log(`   ${idx + 1}. ${entry.location} at ${new Date(entry.timestamp).toLocaleTimeString()}`, 'info');
                    });
                    testsPassed++;
                } else {
                    log(`❌ Location history incorrect (length: ${updated.locationHistory?.length || 0})`, 'error');
                    testsFailed++;
                }
                
                await updateItemCount();
            } catch (error) {
                log(`❌ Error in test: ${error.message}`, 'error');
                testsFailed++;
            }
            
            updateStats();
        }

        // Test 4: Multiple Scans of Same Item
        async function testMultipleScans() {
            log('🧪 Test 4: Multiple Scans of Same Item', 'info');
            
            try {
                const visualId = 'tv_multi_scan_test_456';
                const itemData = {
                    name: 'Multi-Scan TV',
                    category: 'monitor',
                    visualId: visualId,
                    location: 'A1',
                    value: 250
                };
                
                // First scan - should add
                const saved = await warehouseDB.addItem(itemData);
                log(`✅ Scan 1: Item added (ID: ${saved.id})`, 'success');
                
                // Second scan - should detect duplicate
                const check2 = await warehouseDB.checkForDuplicate(itemData);
                if (check2.isDuplicate) {
                    log('✅ Scan 2: Duplicate detected (prevented)', 'success');
                    duplicatesPrevented++;
                } else {
                    log('❌ Scan 2: Duplicate NOT detected', 'error');
                    testsFailed++;
                }
                
                // Third scan at different location
                itemData.location = 'B5';
                const check3 = await warehouseDB.checkForDuplicate(itemData);
                if (check3.isDuplicate) {
                    log('✅ Scan 3: Duplicate detected at new location', 'success');
                    await warehouseDB.updateItemLocation(check3.existingItem.id, 'B5');
                    log('📍 Location updated to B5', 'success');
                    duplicatesPrevented++;
                } else {
                    log('❌ Scan 3: Duplicate NOT detected', 'error');
                    testsFailed++;
                }
                
                // Verify only one item exists
                const allItems = await warehouseDB.getAllItems();
                const matchingItems = allItems.filter(item => item.visualId === visualId);
                
                if (matchingItems.length === 1) {
                    log(`✅ Inventory count correct: ${matchingItems.length} item (not 3)`, 'success');
                    testsPassed++;
                } else {
                    log(`❌ Inventory count incorrect: ${matchingItems.length} items found`, 'error');
                    testsFailed++;
                }
                
                await updateItemCount();
            } catch (error) {
                log(`❌ Error in test: ${error.message}`, 'error');
                testsFailed++;
            }
            
            updateStats();
        }

        // Run all tests
        async function runAllTests() {
            log('🚀 Starting test suite...', 'info');
            clearResults();
            
            // Clear database for clean test
            await clearDatabase();
            
            // Run tests sequentially
            await testVisualIdGeneration();
            await testDuplicateDetection();
            await testLocationTracking();
            await testMultipleScans();
            
            log('', 'info');
            log('='.repeat(60), 'info');
            log(`📊 Test Summary: ${testsPassed} passed, ${testsFailed} failed`, testsFailed === 0 ? 'success' : 'error');
            log(`🛡️ Duplicates prevented: ${duplicatesPrevented}`, 'success');
            log('='.repeat(60), 'info');
        }

        // Initialize database on load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await warehouseDB.init();
                log('✅ Database initialized', 'success');
                await updateItemCount();
            } catch (error) {
                log(`❌ Failed to initialize database: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
