<script>
const STORAGE_KEY = 'cr_master_roster';
let roster = [];
let currentFilter = 'all';
let currentSort = 'date';

const DEFAULT_DATA = [
  {id:genId(),name:'Francis',handle:'Francis',source:'Discord',status:'Active Builder',notes:'Community organizer, strategic thinker',date:'2025-12-01'},
  {id:genId(),name:'.acustic',handle:'.acustic',source:'Discord',status:'Active Builder',notes:'Content creator, videography, prototyping',date:'2025-12-01'},
  {id:genId(),name:'gatewalker',handle:'gatewalker',source:'Discord',status:'Active Builder',notes:'Active community member',date:'2025-12-01'},
  {id:genId(),name:'bearwav',handle:'bearwav',source:'Discord',status:'Active Builder',notes:'Music producer, sound design',date:'2025-12-01'},
  {id:genId(),name:'Ally',handle:'',source:'In Person',status:'Team',notes:'Operations coordinator',date:'2025-11-01'},
  {id:genId(),name:'Brandon',handle:'',source:'In Person',status:'Team',notes:'Microsoft background, technical architect',date:'2025-11-01'},
  {id:genId(),name:'Erica',handle:'',source:'In Person',status:'Team',notes:'Team member',date:'2025-11-01'},
  {id:genId(),name:'Tiger',handle:'',source:'In Person',status:'Team',notes:'Road partner, Mission Machine',date:'2025-10-01'}
];

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.length > 0){roster = parsed; return;}
    }
  }catch(e){}
  roster = DEFAULT_DATA;
  save();
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(roster));
}

function addPerson(){
  const name = document.getElementById('inName').value.trim();
  if(!name){showToast('Name is required');document.getElementById('inName').focus();return;}
  const person = {
    id: genId(),
    name: name,
    handle: document.getElementById('inHandle').value.trim(),
    source: document.getElementById('inSource').value,
    status: document.getElementById('inStatus').value,
    notes: document.getElementById('inNotes').value.trim(),
    date: new Date().toISOString().split('T')[0]
  };
  roster.unshift(person);
  save();
  renderAll();
  document.getElementById('inName').value='';
  document.getElementById('inHandle').value='';
  document.getElementById('inNotes').value='';
  document.getElementById('inName').focus();
  showToast('Added: '+name);
}

function deletePerson(id){
  const p = roster.find(function(r){return r.id===id;});
  if(p && confirm('Delete '+p.name+'?')){
    roster = roster.filter(function(r){return r.id!==id;});
    save();
    renderAll();
    showToast('Deleted: '+p.name);
  }
}

function openEdit(id){
  const p = roster.find(function(r){return r.id===id;});
  if(!p) return;
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = p.name;
  document.getElementById('editHandle').value = p.handle||'';
  document.getElementById('editSource').value = p.source;
  document.getElementById('editStatus').value = p.status;
  document.getElementById('editNotes').value = p.notes||'';
  document.getElementById('editModal').classList.add('open');
}

function saveEdit(){
  const id = document.getElementById('editId').value;
  const p = roster.find(function(r){return r.id===id;});
  if(!p) return;
  const name = document.getElementById('editName').value.trim();
  if(!name){showToast('Name is required');return;}
  p.name = name;
  p.handle = document.getElementById('editHandle').value.trim();
  p.source = document.getElementById('editSource').value;
  p.status = document.getElementById('editStatus').value;
  p.notes = document.getElementById('editNotes').value.trim();
  save();
  closeModal();
  renderAll();
  showToast('Updated: '+name);
}

function closeModal(){
  document.getElementById('editModal').classList.remove('open');
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  renderRoster();
}

function setSort(s, el){
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderRoster();
}

function getFiltered(){
  var q = document.getElementById('searchInput').value.toLowerCase();
  var list = roster.filter(function(p){
    if(currentFilter !== 'all' && p.status !== currentFilter) return false;
    if(q){
      return (p.name||'').toLowerCase().indexOf(q) !== -1 ||
             (p.handle||'').toLowerCase().indexOf(q) !== -1 ||
             (p.notes||'').toLowerCase().indexOf(q) !== -1 ||
             (p.source||'').toLowerCase().indexOf(q) !== -1;
    }
    return true;
  });
  var statusOrder = {'Team':0,'Active Builder':1,'Hot Lead':2,'Warm':3,'Cold':4};
  list.sort(function(a,b){
    switch(currentSort){
      case 'name': return (a.name||'').localeCompare(b.name||'');
      case 'status': return (statusOrder[a.status]||9)-(statusOrder[b.status]||9);
      case 'source': return (a.source||'').localeCompare(b.source||'');
      default: return (b.date||'').localeCompare(a.date||'');
    }
  });
  return list;
}

function badgeClass(status){
  switch(status){
    case 'Hot Lead':return 'badge-hot';
    case 'Warm':return 'badge-warm';
    case 'Cold':return 'badge-cold';
    case 'Active Builder':return 'badge-active';
    case 'Team':return 'badge-team';
    default:return '';
  }
}

function esc(s){
  var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;
}

function renderRoster(){
  var list = getFiltered();
  var el = document.getElementById('rosterList');
  if(list.length===0){
    el.innerHTML='<div class="empty"><div>No people found</div></div>';
    return;
  }
  var html = '';
  for(var i = 0; i < list.length; i++){
    var p = list[i];
    html += '<div class="roster-item">';
    html += '<div class="roster-header"><div>';
    html += '<div class="roster-name">'+esc(p.name)+'</div>';
    if(p.handle) html += '<div class="roster-handle">@'+esc(p.handle)+'</div>';
    html += '</div>';
    html += '<span class="badge '+badgeClass(p.status)+'">'+esc(p.status)+'</span>';
    html += '</div>';
    if(p.notes) html += '<div class="roster-notes">'+esc(p.notes)+'</div>';
    html += '<div class="roster-meta">';
    html += '<span class="roster-source">'+esc(p.source)+'</span>';
    html += '<span class="roster-date">'+esc(p.date||'')+'</span>';
    html += '</div>';
    html += '<div class="roster-actions">';
    html += '<button class="btn btn-sm btn-outline" onclick="openEdit(\''+p.id+'\')">Edit</button>';
    html += '<button class="btn btn-sm btn-danger" onclick="deletePerson(\''+p.id+'\')">Delete</button>';
    html += '</div></div>';
  }
  el.innerHTML = html;
}

function renderStats(){
  var counts = {total:roster.length,'Hot Lead':0,Warm:0,Cold:0,'Active Builder':0,Team:0};
  for(var i=0;i<roster.length;i++){
    var s = roster[i].status;
    if(counts[s] !== undefined) counts[s]++;
  }
  document.getElementById('sTotal').textContent=counts.total;
  document.getElementById('sHot').textContent=counts['Hot Lead'];
  document.getElementById('sWarm').textContent=counts.Warm;
  document.getElementById('sCold').textContent=counts.Cold;
  document.getElementById('sActive').textContent=counts['Active Builder'];
  document.getElementById('sTeam').textContent=counts.Team;
}

function renderAll(){renderStats();renderRoster();}

function copyText(){
  var lines = [];
  for(var i=0;i<roster.length;i++){
    var p=roster[i];
    lines.push(p.name+' | '+(p.handle||'-')+' | '+p.source+' | '+p.status+' | '+(p.notes||'-')+' | '+(p.date||''));
  }
  var header = 'Name | Handle | Source | Status | Notes | Date Added';
  var text = header+'\n'+'------------------------------------------------------------\n'+lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){showToast('Copied to clipboard');});
  } else {
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Copied to clipboard');
  }
}

function downloadCSV(){
  var header='Name,Handle,Source,Status,Notes,Date Added\n';
  var rows=[];
  for(var i=0;i<roster.length;i++){
    var p=roster[i];
    rows.push([p.name,p.handle||'',p.source,p.status,(p.notes||'').replace(/"/g,'""'),p.date||''].map(function(v){return '"'+v+'"';}).join(','));
  }
  dl(header+rows.join('\n'),'master_roster.csv','text/csv');
}

function downloadJSON(){
  dl(JSON.stringify(roster,null,2),'master_roster.json','application/json');
}

function dl(content,filename,type){
  var blob=new Blob([content],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('Downloaded: '+filename);
}

var toastTimer;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2500);
}

document.getElementById('editModal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

load();
renderAll();
