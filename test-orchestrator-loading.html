<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204035-442D7EEB">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Orchestrator Loading</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        .pass { color: #00ff00; }
        .fail { color: #ff0000; }
    </style>
</head>
<body>
    <h1>Orchestrator Loading Test</h1>
    <div id="results"></div>

    <!-- Load AI Orchestrators -->
    <script src="/src/ai/openai-orchestrator.js"></script>
    <script src="/src/ai/multi-provider-orchestrator.js"></script>

    <script>
        const results = document.getElementById('results');
        
        function addResult(test, passed, message) {
            const div = document.createElement('div');
            div.className = 'test-result ' + (passed ? 'pass' : 'fail');
            div.innerHTML = `<strong>${passed ? '✓' : '✗'} ${test}</strong><br>${message}`;
            results.appendChild(div);
        }

        // Test 1: Check if OpenAI Orchestrator loaded
        try {
            if (typeof OpenAIOrchestrator !== 'undefined') {
                addResult('OpenAI Orchestrator Class', true, 'Class definition found');
            } else {
                addResult('OpenAI Orchestrator Class', false, 'Class not found');
            }
        } catch (e) {
            addResult('OpenAI Orchestrator Class', false, `Error: ${e.message}`);
        }

        // Test 2: Check if global instance exists
        try {
            if (window.openAIOrchestrator) {
                addResult('OpenAI Orchestrator Instance', true, 'window.openAIOrchestrator exists');
            } else {
                addResult('OpenAI Orchestrator Instance', false, 'window.openAIOrchestrator not found');
            }
        } catch (e) {
            addResult('OpenAI Orchestrator Instance', false, `Error: ${e.message}`);
        }

        // Test 3: Check if Multi-Provider Orchestrator loaded
        try {
            if (typeof MultiProviderAIOrchestrator !== 'undefined') {
                addResult('Multi-Provider Orchestrator Class', true, 'Class definition found');
            } else {
                addResult('Multi-Provider Orchestrator Class', false, 'Class not found');
            }
        } catch (e) {
            addResult('Multi-Provider Orchestrator Class', false, `Error: ${e.message}`);
        }

        // Test 4: Check if global instance exists
        try {
            if (window.multiAI) {
                addResult('Multi-Provider Orchestrator Instance', true, 'window.multiAI exists');
            } else {
                addResult('Multi-Provider Orchestrator Instance', false, 'window.multiAI not found');
            }
        } catch (e) {
            addResult('Multi-Provider Orchestrator Instance', false, `Error: ${e.message}`);
        }

        // Test 5: Check if multiAI can be instantiated
        try {
            const testInstance = new MultiProviderAIOrchestrator();
            addResult('MultiProviderAIOrchestrator Instantiation', true, 'Successfully created new instance');
        } catch (e) {
            addResult('MultiProviderAIOrchestrator Instantiation', false, `Error: ${e.message}`);
        }

        // Test 6: Check helper functions
        try {
            if (typeof window.aiStatus === 'function') {
                addResult('Helper Functions', true, 'window.aiStatus() helper exists');
            } else {
                addResult('Helper Functions', false, 'window.aiStatus() not found');
            }
        } catch (e) {
            addResult('Helper Functions', false, `Error: ${e.message}`);
        }

        // Final summary
        setTimeout(() => {
            const allTests = document.querySelectorAll('.test-result');
            const passed = document.querySelectorAll('.pass').length;
            const total = allTests.length;
            
            const summary = document.createElement('div');
            summary.className = 'test-result ' + (passed === total ? 'pass' : 'fail');
            summary.innerHTML = `<h2>Summary: ${passed}/${total} tests passed</h2>`;
            results.appendChild(summary);

            console.log(`Test Summary: ${passed}/${total} tests passed`);
        }, 100);
    </script>
</body>
</html>
