<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="rootib" content="RootIB: RB-20260224204035-3BF0E924">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeshMint Vault Launcher</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: #f0f0f0; padding: 2em; }
    .container { max-width: 600px; margin: auto; background: #1a1a1a; padding: 2em; border-radius: 10px; box-shadow: 0 0 20px rgba(0,255,153,0.2); }
    input, select, button { width: 100%; padding: 1em; margin-top: 1em; border-radius: 5px; border: none; font-size: 1em; }
    button { background: #00ff99; color: #000; font-weight: bold; cursor: pointer; }
    .status { margin-top: 2em; font-size: 0.95em; color: #ccc; white-space: pre-wrap; }
    .trust-score { margin-top: 1em; font-size: 1.1em; color: #00ff99; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MeshMint Vault Launcher</h1>
    <p>Enter your BTC wallet to launch your decentralized bank. You’ll sign a message and send a small transaction to confirm your bank creation.</p>

    <label for="wallet">BTC Wallet Address:</label>
    <input type="text" id="wallet" placeholder="e.g. 3HhSLhnrAwgY6YdA3xNR8J79vu64eQwmqM" />

    <button onclick="launchBank()">Launch My Bank</button>

    <div class="status" id="status"></div>
    <div class="trust-score" id="trustScore"></div>
  </div>

  <script>
    async function launchBank() {
      const wallet = document.getElementById('wallet').value.trim();
      const status = document.getElementById('status');
      const trustScore = document.getElementById('trustScore');

      if (!wallet || wallet.length < 10) {
        status.innerText = "❌ Please enter a valid BTC wallet address.";
        trustScore.innerText = "";
        return;
      }

      status.innerText =
        "🔐 Step 1: Sign a message with your BTC wallet to confirm bank creation.\n" +
        "💸 Step 2: Send a small transaction (e.g. 0.00001 BTC) to:\n" +
        "➡️ 3HhSLhnrAwgY6YdA3xNR8J79vu64eQwmqM\n\n" +
        "⛓️ Once confirmed on-chain, your bank will be created.\n" +
        "🧊 Cold storage sync will begin.\n" +
        "💰 VaultCoin will be minted based on your wallet’s history.\n" +
        "📈 Passive income engine will activate.\n" +
        "🏦 Welcome to MeshMint.";

      trustScore.innerText = `🔒 Trust Score: Calculated after transaction confirmation\n✅ Your wallet will be ranked based on age, history, and sync integrity.`;
    }
  </script>
</body>
</html>
