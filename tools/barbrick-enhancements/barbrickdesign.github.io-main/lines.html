<title>Cyber Menu — TRON ARES (Enhanced Glitch & 3D Glow)</title>
<style>
  :root{
    --bg:#050405;
    --card-bg:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));
    --accent:#ff1f2f;
    --accent-2:#ff6b6b;
    --accent-3:#ff9aa0;
    --muted:#b33;
    --card-radius:14px;
    --card-padding:22px;
    --shadow: 0 18px 50px rgba(0,0,0,0.75);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% 10%, rgba(255,31,47,0.03), transparent 8%),
      radial-gradient(900px 400px at 90% 90%, rgba(255,31,47,0.02), transparent 6%),
      var(--bg);
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px;
    box-sizing:border-box;
    perspective: 1200px; /* enables 3D depth for children */
  }

  .menu{
    display:grid;
    grid-template-columns: repeat(2, minmax(260px, 360px));
    gap:28px;
    width:100%;
    max-width:980px;
    transform-style:preserve-3d;
  }

  .card{
    position:relative;
    background:var(--card-bg);
    border:1px solid rgba(255,31,47,0.12);
    border-radius:var(--card-radius);
    padding:var(--card-padding);
    overflow:hidden;
    box-shadow:var(--shadow);
    cursor:pointer;
    transform-origin:center;
    transition:transform 360ms cubic-bezier(.2,.9,.2,1), box-shadow 360ms, filter 360ms;
    will-change:transform, filter;
    min-height:320px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    isolation:isolate;
    transform-style:preserve-3d;
    backface-visibility:hidden;
  }

  /* layered 3D glow pseudo-elements */
  .card::before, .card::after{
    content:"";
    position:absolute;
    inset: -20% -10%;
    z-index:0;
    pointer-events:none;
    filter: blur(28px);
    opacity:0.12;
    transform: translateZ(-60px) scale(1.02);
    transition:opacity 300ms, transform 300ms;
  }
  .card::before{
    background: radial-gradient(closest-side, rgba(255,31,47,0.45), transparent 40%);
    mix-blend-mode:screen;
  }
  .card::after{
    background: radial-gradient(closest-side, rgba(255,107,107,0.28), transparent 30%);
    filter: blur(40px);
    opacity:0.08;
    transform: translateZ(-120px) scale(1.06);
  }

  .card.enter { opacity:0; transform: translateY(18px) scale(.98) rotateX(2deg); }
  .card.enter.show { animation: cardIn 640ms cubic-bezier(.2,.9,.2,1) forwards; }
  @keyframes cardIn { to { opacity:1; transform: translateY(0) scale(1) rotateX(0deg); } }

  .card:hover{
    transform: translateY(-10px) scale(1.03) rotateX(6deg);
    box-shadow: 0 40px 90px rgba(0,0,0,0.85);
    filter: saturate(1.06) drop-shadow(0 18px 40px rgba(255,31,47,0.12));
  }

  .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
    z-index:2;
    position:relative;
  }

  .title{
    font-weight:800;
    color:var(--accent);
    font-size:18px;
    letter-spacing:1.6px;
    z-index:2;
    position:relative;
  }

  .id{
    font-family: "Courier New", monospace;
    color:var(--accent-2);
    background: linear-gradient(90deg, rgba(255,31,47,0.06), transparent);
    padding:6px 10px;
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    z-index:2;
    position:relative;
  }

  .visual{
    margin-top:12px;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
    transform-style:preserve-3d;
  }

  .wire{
    width:180px;
    height:180px;
    filter: drop-shadow(0 12px 30px rgba(255,31,47,0.12));
    transform-origin:center;
    z-index:2;
    transition:transform 420ms cubic-bezier(.2,.9,.2,1);
  }

  .wire circle, .wire path{
    stroke:var(--accent);
    stroke-width:1.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .wire .orbit{
    stroke:var(--accent-2);
    stroke-opacity:0.95;
    stroke-dasharray: 6 6;
    animation: orbitRotate 8s linear infinite;
    transform-origin:center;
  }
  @keyframes orbitRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* stronger bloom/glow using SVG filter */
  svg defs filter#bloom feGaussianBlur { /* placeholder to ensure CSS selector exists */ }

  /* barcode */
  .barcode{
    position:absolute;
    right:12px;
    bottom:12px;
    height:56px;
    width:96px;
    display:flex;
    gap:3px;
    align-items:flex-end;
    transform:translateZ(40px);
    opacity:0.98;
    z-index:3;
  }
  .barcode .bar{
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    width:6px;
    border-radius:2px;
    animation: barPulse 1.6s ease-in-out infinite;
    transform-origin:bottom;
    box-shadow: 0 6px 18px rgba(255,31,47,0.12);
  }
  .barcode .bar:nth-child(1){ height:18%; animation-delay:0s; }
  .barcode .bar:nth-child(2){ height:62%; animation-delay:0.08s; }
  .barcode .bar:nth-child(3){ height:36%; animation-delay:0.16s; }
  .barcode .bar:nth-child(4){ height:86%; animation-delay:0.24s; }
  .barcode .bar:nth-child(5){ height:44%; animation-delay:0.32s; }
  .barcode .bar:nth-child(6){ height:72%; animation-delay:0.4s; }
  .barcode .bar:nth-child(7){ height:28%; animation-delay:0.48s; }
  @keyframes barPulse { 0%,100% { transform: scaleY(0.9); opacity:0.9; } 50% { transform: scaleY(1.12); opacity:1; } }

  /* scanline overlay */
  .scan{
    position:absolute;
    inset:0;
    pointer-events:none;
    background: linear-gradient(180deg, transparent 0%, rgba(255,31,47,0.02) 48%, rgba(255,31,47,0.04) 52%, transparent 100%);
    mix-blend-mode:screen;
    animation: scanMove 3.6s linear infinite;
    opacity:0.95;
    z-index:1;
  }
  @keyframes scanMove { 0% { background-position: 0 -40%; } 100% { background-position: 0 140%; } }

  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    gap:12px;
    font-size:12px;
    color:#c44;
    z-index:2;
    position:relative;
  }

  .code{
    font-family: "Courier New", monospace;
    font-weight:900;
    color:var(--accent);
    letter-spacing:2px;
    font-size:16px;
    text-shadow:
      0 0 6px rgba(255,31,47,0.9),
      0 0 18px rgba(255,31,47,0.45),
      0 6px 30px rgba(0,0,0,0.6);
  }

  /* Enhanced glitch: multi-slice clip animations + color offsets */
  .glitch{
    position:relative;
    display:inline-block;
    color:var(--accent);
    font-weight:900;
    letter-spacing:1.6px;
    z-index:3;
    transform-style:preserve-3d;
    text-shadow:
      0 0 8px rgba(255,31,47,0.9),
      0 0 22px rgba(255,107,107,0.45);
  }

  .glitch .slice{
    position:absolute;
    left:0; top:0;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
    mix-blend-mode:screen;
  }

  .glitch .base { position:relative; z-index:2; }

  /* create several slices with different clip-paths and animations */
  .glitch .slice.s1{ clip-path: inset(0 0 70% 0); transform: translateX(0); animation: g1 2.6s infinite linear; color: #ff6b6b; opacity:0.95; }
  .glitch .slice.s2{ clip-path: inset(30% 0 40% 0); transform: translateX(0); animation: g2 3.1s infinite linear; color: #ff1f2f; opacity:0.9; }
  .glitch .slice.s3{ clip-path: inset(60% 0 0 0); transform: translateX(0); animation: g3 2.2s infinite linear; color: #ff9aa0; opacity:0.85; }

  @keyframes g1 {
    0%{ transform: translateX(0) skewX(0deg); opacity:0.95; }
    20%{ transform: translateX(-8px) skewX(-2deg); opacity:1; }
    40%{ transform: translateX(6px) skewX(1deg); opacity:0.9; }
    60%{ transform: translateX(-4px) skewX(-1deg); opacity:0.95; }
    100%{ transform: translateX(0) skewX(0deg); opacity:0.95; }
  }
  @keyframes g2 {
    0%{ transform: translateX(0) skewX(0deg); opacity:0.9; }
    25%{ transform: translateX(10px) skewX(3deg); opacity:1; }
    50%{ transform: translateX(-6px) skewX(-2deg); opacity:0.85; }
    75%{ transform: translateX(4px) skewX(1deg); opacity:0.95; }
    100%{ transform: translateX(0) skewX(0deg); opacity:0.9; }
  }
  @keyframes g3 {
    0%{ transform: translateX(0) skewX(0deg); opacity:0.85; }
    30%{ transform: translateX(-12px) skewX(-4deg); opacity:1; }
    60%{ transform: translateX(8px) skewX(2deg); opacity:0.8; }
    100%{ transform: translateX(0) skewX(0deg); opacity:0.85; }
  }

  /* occasional full-card glitch jump */
  .card.glitch-jump{
    animation: cardJump 1.2s ease-in-out;
  }
  @keyframes cardJump {
    0%{ transform: translateY(0) rotateX(0deg) scale(1); filter: none; }
    30%{ transform: translateY(-6px) rotateX(6deg) scale(1.02); filter: hue-rotate(6deg) saturate(1.2); }
    60%{ transform: translateY(4px) rotateX(-2deg) scale(.995) translateX(-6px); filter: blur(0.6px) hue-rotate(-6deg); }
    100%{ transform: translateY(0) rotateX(0deg) scale(1); filter: none; }
  }

  /* responsive */
  @media (max-width:720px){
    .menu{ grid-template-columns: 1fr; }
    .wire{ width:140px; height:140px; }
  }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    .card, .card:hover, .wire .orbit, .scan, .barcode .bar, .glitch .slice { animation: none !important; transition: none !important; }
  }

<script>
  // Staggered entrance for cards
  document.addEventListener('DOMContentLoaded', function(){
    const cards = document.querySelectorAll('.card.enter');
    cards.forEach((c, i) => {
      setTimeout(() => c.classList.add('show'), i * 120);
    });

    // Tilt and 3D parallax on mouse move
    const wrap = document.querySelector('.wrap');
    const perspective = 900;
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = (e.clientX - cx) / rect.width;
        const dy = (e.clientY - cy) / rect.height;
        const rx = (dy * 12).toFixed(2);
        const ry = (dx * -18).toFixed(2);
        card.style.transform = `translateY(-6px) scale(1.02) rotateX(${rx}deg) rotateY(${ry}deg)`;
        // intensify pseudo-element glow on hover
        card.style.setProperty('--glow-intensity', Math.min(Math.abs(dx)+Math.abs(dy), 1));
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
      });

      // occasional glitch jump
      let glitchTimer;
      card.addEventListener('mouseenter', () => {
        clearTimeout(glitchTimer);
        glitchTimer = setTimeout(() => {
          card.classList.add('glitch-jump');
          setTimeout(()=> card.classList.remove('glitch-jump'), 1200);
        }, 900 + Math.random()*1200);
      });
      card.addEventListener('mouseleave', () => {
        clearTimeout(glitchTimer);
      });

      // click feedback
      card.addEventListener('click', () => {
        card.animate([
          { transform: card.style.transform || 'scale(1.02)' },
          { transform: 'scale(0.98)' },
          { transform: card.style.transform || 'scale(1.02)' }
        ], { duration: 260, easing: 'cubic-bezier(.2,.9,.2,1)' });
        console.log('Selected card index:', card.dataset.index);
      });
    });

    // keyboard focus interaction
    document.querySelectorAll('.card').forEach(c => {
      c.addEventListener('focus', () => c.classList.add('focused'));
      c.addEventListener('blur', () => c.classList.remove('focused'));
    });
  });
</script>
