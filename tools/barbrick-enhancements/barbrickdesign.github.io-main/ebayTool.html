<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <meta name="rootib" content="RootIB: RB-20260224204035-C4504D70">
<title>Metals & Gemstones Profit Calculator + eBay RSS (Mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b0f14; --card: #141a22; --text: #e7edf7; --muted: #90a4b8;
    --accent: #4bd5ff; --pos: #7effa1; --neg: #ff6b7a; --border: #2a3340;
  }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .wrap { padding: 1rem; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
  h2 { font-size: 1rem; margin: 0 0 0.5rem; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin: 0.5rem 0 0.25rem; color: var(--muted); }
  input, select, button { width: 100%; padding: 0.65rem; border-radius: 10px; border: 1px solid var(--border); background: #0f141b; color: var(--text); }
  button { background: #17202b; border-color: #263244; font-weight: 700; letter-spacing: 0.2px; }
  button:active { transform: translateY(1px); }
  .row { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
  th, td { border: 1px solid var(--border); padding: 0.5rem; text-align: right; white-space: nowrap; }
  th { background: #17202b; color: var(--muted); }
  .pos { color: var(--pos); font-weight: 700; }
  .neg { color: var(--neg); font-weight: 700; }
  .rss-item { padding: 0.5rem; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.5rem; }
  .rss-title { font-weight: 700; color: var(--accent); text-decoration: none; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .pill { display:inline-block; padding:0.25rem 0.5rem; border:1px solid var(--border); border-radius:999px; font-size:0.8rem; color:var(--muted); }
  .sticky { position: sticky; top: 0; z-index: 10; }
</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="card sticky">
    <h1>Metals & Gemstones Profit Calculator</h1>
    <div class="row">
      <div>
        <label for="mode">Select mode</label>
        <select id="mode">
          <option value="metal">Metal (grams/oz)</option>
          <option value="gem">Gemstone (stones)</option>
        </select>
      </div>
    </div>
    <div id="metalInputs">
      <label for="grams">Listing grams (.925 total weight)</label>
      <input id="grams" type="number" inputmode="decimal" value="500" />
      <label for="spot">Spot price ($/oz)</label>
      <input id="spot" type="number" inputmode="decimal" value="58.00" />
      <label for="buyPct">Buy ceiling (% of spot)</label>
      <input id="buyPct" type="number" inputmode="decimal" value="90" />
      <label for="process">Processing ($/g)</label>
      <input id="process" type="number" inputmode="decimal" value="0.10" />
      <label for="currentBid">Current bid ($)</label>
      <input id="currentBid" type="number" inputmode="decimal" value="700" />
    </div>
    <div id="gemInputs" style="display:none;">
      <label for="stones">Stone count</label>
      <input id="stones" type="number" inputmode="numeric" value="100" />
      <label for="buyStone">Buy price per stone ($)</label>
      <input id="buyStone" type="number" inputmode="decimal" value="5" />
      <label for="sellStone">Sell price per stone ($)</label>
      <input id="sellStone" type="number" inputmode="decimal" value="10" />
      <label for="processStone">Processing per stone ($)</label>
      <input id="processStone" type="number" inputmode="decimal" value="0.50" />
      <label for="currentBidGem">Current bid ($)</label>
      <input id="currentBidGem" type="number" inputmode="decimal" value="400" />
    </div>
    <div id="output"></div>
  </div>

  <div class="card">
    <h2>Live eBay auctions via RSS</h2>
    <p class="muted">Paste your eBay RSS feed URL. Example:
      <code>https://www.ebay.com/sch/i.html?_nkw=silver+scrap&_rss=1</code>
    </p>
    <input id="rssUrl" type="url" value="https://www.ebay.com/sch/i.html?_nkw=silver+scrap&_rss=1" />
    <button id="rssLoad">Load auctions</button>
    <p class="muted">Tip: Save searches on eBay to get stable RSS feeds. Tap an item to copy its bid into the calculator.</p>
    <div id="rssResults"></div>
  </div>
</div>

<script>
(function(){
  const els = {
    mode: document.getElementById('mode'),
    grams: document.getElementById('grams'),
    spot: document.getElementById('spot'),
    buyPct: document.getElementById('buyPct'),
    process: document.getElementById('process'),
    currentBid: document.getElementById('currentBid'),
    stones: document.getElementById('stones'),
    buyStone: document.getElementById('buyStone'),
    sellStone: document.getElementById('sellStone'),
    processStone: document.getElementById('processStone'),
    currentBidGem: document.getElementById('currentBidGem'),
    output: document.getElementById('output'),
    metalInputs: document.getElementById('metalInputs'),
    gemInputs: document.getElementById('gemInputs'),
    rssUrl: document.getElementById('rssUrl'),
    rssLoad: document.getElementById('rssLoad'),
    rssResults: document.getElementById('rssResults')
  };

  function fmt(n){ return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function ozToGram(oz){ return oz / 31.1035; }

  function calc(){
    const mode = els.mode.value;
    let html = '';
    if(mode === 'metal'){
      const grams = parseFloat(els.grams.value || 0);
      const spotOz = parseFloat(els.spot.value || 0);
      const buyPct = parseFloat(els.buyPct.value || 90) / 100;
      const process = parseFloat(els.process.value || 0.10);
      const currentBid = parseFloat(els.currentBid.value || 0);

      const purity = 0.925;
      const gramsPerOz = 31.1035;
      const spotGram = spotOz / gramsPerOz;
      const pureGrams = grams * purity;
      const buyCeilPerGram = spotGram * buyPct;
      const maxBid = pureGrams * buyCeilPerGram;
      const procCost = pureGrams * process;
      const totalCostCeil = maxBid + procCost;

      html += `<p><strong>Pure grams:</strong> ${fmt(pureGrams)} g<br>
               <strong>Max bid ceiling:</strong> $${fmt(maxBid)}<br>
               <strong>Total cost (at ceiling):</strong> $${fmt(totalCostCeil)}</p>`;

      html += `<table><tr><th>Sale $/oz</th><th>Sale $/g</th><th>Revenue</th><th>Profit (Ceiling)</th><th>Profit (Current Bid)</th></tr>`;
      [42,50,55,60,65,70].forEach(oz=>{
        const saleGram = ozToGram(oz);
        const revenue = pureGrams * saleGram;
        const profitCeil = revenue - totalCostCeil;
        const profitBid = revenue - (currentBid + procCost);
        html += `<tr>
          <td>$${fmt(oz)}</td>
          <td>$${fmt(saleGram)}</td>
          <td>$${fmt(revenue)}</td>
          <td class="${profitCeil>=0?'pos':'neg'}">$${fmt(profitCeil)}</td>
          <td class="${profitBid>=0?'pos':'neg'}">$${fmt(profitBid)}</td>
        </tr>`;
      });
      html += `</table>`;
    } else {
      const stones = parseFloat(els.stones.value || 0);
      const buyStone = parseFloat(els.buyStone.value || 0);
      const sellStone = parseFloat(els.sellStone.value || 0);
      const procStone = parseFloat(els.processStone.value || 0);
      const currentBid = parseFloat(els.currentBidGem.value || 0);

      const maxBid = stones * buyStone;
      const revenue = stones * sellStone;
      const procCost = stones * procStone;
      const totalCostCeil = maxBid + procCost;
      const profitCeil = revenue - totalCostCeil;
      const profitBid = revenue - (currentBid + procCost);

      html += `<p><strong>Stone count:</strong> ${fmt(stones)}<br>
               <strong>Max bid ceiling:</strong> $${fmt(maxBid)}<br>
               <strong>Total cost (at ceiling):</strong> $${fmt(totalCostCeil)}<br>
               <strong>Revenue:</strong> $${fmt(revenue)}<br>
               <strong>Profit (Ceiling):</strong> <span class="${profitCeil>=0?'pos':'neg'}">$${fmt(profitCeil)}</span><br>
               <strong>Profit (Current Bid):</strong> <span class="${profitBid>=0?'pos':'neg'}">$${fmt(profitBid)}</span></p>`;
    }
    els.output.innerHTML = html;
  }

  function toggleMode(){
    const isMetal = els.mode.value === 'metal';
    els.metalInputs.style.display = isMetal ? 'block' : 'none';
    els.gemInputs.style.display   = isMetal ? 'none'  : 'block';
    calc();
  }

  // Attempt to extract a dollar amount from a string (eBay RSS often includes current bid in description)
  function extractDollarAmount(text){
    // Match $123.45 or US $123.45 patterns
    const m = text && text.match(/(?:US\s*)?\$\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)/i);
    if(!m) return null;
    return parseFloat(m[1].replace(/,/g,''));
  }

  async function loadRSS(){
    const url = els.rssUrl.value.trim();
    els.rssResults.innerHTML = `<p class="muted">Loading…</p>`;
    try {
      // Use a public CORS-friendly proxy to retrieve the RSS text
      const resp = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
      const data = await resp.json();
      const parser = new DOMParser();
      const xml = parser.parseFromString(data.contents, 'text/xml');

      const items = Array.from(xml.querySelectorAll('item'));
      if(!items.length){
        els.rssResults.innerHTML = `<p class="muted">No items found for this feed.</p>`;
        return;
      }

      let html = '';
      items.slice(0, 12).forEach((item, i) => {
        const title = item.querySelector('title')?.textContent || 'Untitled';
        const link  = item.querySelector('link')?.textContent || '#';
        const desc  = item.querySelector('description')?.textContent || '';
        const maybeBid = extractDollarAmount(desc) || extractDollarAmount(title);
        const bidText = (maybeBid != null) ? `$${fmt(maybeBid)}` : '—';

        html += `
          <div class="rss-item">
            <div>
              <a class="rss-title" href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
            </div>
            <div class="muted">${desc ? desc.slice(0, 220) + (desc.length>220?'…':'') : ''}</div>
            <div class="actions">
              <span class="pill">Parsed bid: ${bidText}</span>
              <button data-bid="${maybeBid ?? ''}" data-link="${link}" class="applyBidBtn">Use bid</button>
              <button data-link="${link}" class="openBtn">Open</button>
            </div>
          </div>
        `;
      });

      els.rssResults.innerHTML = html;

      // Wire up buttons to apply bid into the right field based on mode
      Array.from(document.querySelectorAll('.applyBidBtn')).forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          const bidVal = e.currentTarget.getAttribute('data-bid');
          if(!bidVal){
            alert('Could not parse bid from this item. You can copy it manually.');
            return;
          }
          if(els.mode.value === 'metal'){
            els.currentBid.value = bidVal;
          } else {
            els.currentBidGem.value = bidVal;
          }
          calc();
        });
      });

      Array.from(document.querySelectorAll('.openBtn')).forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          const link = e.currentTarget.getAttribute('data-link');
          if(link) window.open(link, '_blank', 'noopener');
        });
      });

    } catch (err) {
      els.rssResults.innerHTML = `<p class="muted">Error loading feed. Try a different RSS URL or check your connection.</p>`;
    }
  }

  // Bind events
  ['input','change'].forEach(evt=>{
    els.mode.addEventListener(evt, toggleMode);
    [els.grams, els.spot, els.buyPct, els.process, els.currentBid,
     els.stones, els.buyStone, els.sellStone, els.processStone, els.currentBidGem].forEach(el=>{
      el.addEventListener(evt, calc);
    });
  });
  els.rssLoad.addEventListener('click', loadRSS);

  // Init
  toggleMode();

})();
</script>
</body>
</html>
