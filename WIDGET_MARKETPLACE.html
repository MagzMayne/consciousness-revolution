<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Marketplace - Dashboard Factory</title>

  <!-- Dashboard DNA -->
  <script type="application/json" id="dashboard-dna">
  {
    "name": "Widget Marketplace",
    "version": "1.0.0",
    "domain": "FACTORY",
    "created": "2026-02-22",
    "features": ["marketplace", "feature-browser", "one-click-install"],
    "trinity": { "c1_built": "2026-02-22", "c2_reviewed": true, "c3_validated": true }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0d1117 100%);
      min-height: 100vh;
      color: #e4e4e4;
      padding: 25px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      background: rgba(0,255,136,0.05);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #00ff88, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
    }

    .stat {
      text-align: center;
      padding: 10px 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #00ff88;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #888;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      color: #888;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .filter-btn:hover, .filter-btn.active {
      background: rgba(0,255,136,0.2);
      border-color: #00ff88;
      color: #00ff88;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 20px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      color: #fff;
      font-size: 0.9rem;
    }

    .search-box:focus {
      outline: none;
      border-color: #00ff88;
    }

    /* Widget grid */
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .widget-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      transition: all 0.3s;
      position: relative;
    }

    .widget-card:hover {
      border-color: rgba(0,255,136,0.5);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,255,136,0.1);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .widget-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .widget-version {
      padding: 4px 10px;
      background: rgba(0,255,136,0.2);
      border-radius: 10px;
      font-size: 0.75rem;
      color: #00ff88;
    }

    .widget-category {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0,170,255,0.2);
      border-radius: 15px;
      font-size: 0.75rem;
      color: #00aaff;
      margin-bottom: 10px;
    }

    .widget-description {
      color: #888;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .widget-meta {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 15px;
    }

    .widget-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .lfsme-score {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255,215,0,0.1);
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .lfsme-value {
      font-weight: bold;
      color: #ffd700;
    }

    .lfsme-label {
      font-size: 0.75rem;
      color: #888;
    }

    .installations-list {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 15px;
    }

    .installations-list strong {
      color: #00ff88;
    }

    .widget-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-install {
      background: linear-gradient(135deg, #00ff88, #00aa55);
      color: #000;
    }

    .btn-install:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 20px rgba(0,255,136,0.3);
    }

    .btn-preview {
      background: rgba(0,170,255,0.2);
      color: #00aaff;
      border: 1px solid rgba(0,170,255,0.3);
    }

    .btn-preview:hover {
      background: rgba(0,170,255,0.3);
    }

    /* Install modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: linear-gradient(135deg, #1a1a2e, #0d1117);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 {
      color: #00ff88;
      margin-bottom: 20px;
    }

    .modal label {
      display: block;
      color: #888;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .modal select {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .strategy-options {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .strategy-option {
      flex: 1;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
    }

    .strategy-option:hover, .strategy-option.active {
      border-color: #00ff88;
      background: rgba(0,255,136,0.1);
    }

    .strategy-option h4 {
      color: #fff;
      margin-bottom: 5px;
    }

    .strategy-option p {
      font-size: 0.75rem;
      color: #666;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    .btn-cancel {
      background: rgba(255,68,68,0.2);
      color: #ff4444;
      border: 1px solid rgba(255,68,68,0.3);
    }

    /* Tags */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tag {
      padding: 3px 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      font-size: 0.7rem;
      color: #666;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 15px 25px;
      background: linear-gradient(135deg, #00ff88, #00aa55);
      color: #000;
      border-radius: 10px;
      font-weight: bold;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 2000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: linear-gradient(135deg, #ff4444, #cc2222);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🏪 Widget Marketplace</h1>
      <p style="color:#888; margin-top:5px;">Dashboard Factory Phase 3 - Browse & Install Features</p>
    </div>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="totalFeatures">12</div>
        <div class="stat-label">Features</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalInstalls">26</div>
        <div class="stat-label">Installations</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="avgLFSME">8.6</div>
        <div class="stat-label">Avg LFSME</div>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="monitoring">Monitoring</button>
    <button class="filter-btn" data-filter="ai_integration">AI Integration</button>
    <button class="filter-btn" data-filter="productivity">Productivity</button>
    <button class="filter-btn" data-filter="gamification">Gamification</button>
    <button class="filter-btn" data-filter="communication">Communication</button>
    <input type="text" class="search-box" placeholder="🔍 Search features..." id="searchInput">
  </div>

  <div class="widget-grid" id="widgetGrid">
    <!-- Populated by JS -->
  </div>

  <!-- Install Modal -->
  <div class="modal-overlay" id="installModal">
    <div class="modal">
      <h2>📦 Install Feature</h2>
      <p id="modalFeatureName" style="color:#00ff88; margin-bottom:20px;"></p>

      <label>Target Dashboard:</label>
      <select id="targetDashboard">
        <option value="">Select a dashboard...</option>
        <option value="COMMANDER_COCKPIT.html">Commander Cockpit</option>
        <option value="OPERATOR_COCKPIT_RYAN.html">Ryan's Cockpit</option>
        <option value="OPERATOR_COCKPIT_AGENT_R.html">Agent R Cockpit</option>
        <option value="OPERATOR_COCKPIT_ALEX.html">Alex's Cockpit</option>
        <option value="OPERATOR_COCKPIT_TIGER.html">Tiger's Cockpit</option>
        <option value="BETA_TESTER_COCKPIT.html">Beta Tester Cockpit</option>
        <option value="TEAM_COCKPIT.html">Team Cockpit</option>
        <option value="PERSONAL_DOMAIN_1_COMMAND.html">Personal: COMMAND</option>
        <option value="PERSONAL_DOMAIN_2_BUILD.html">Personal: BUILD</option>
        <option value="PERSONAL_DOMAIN_3_CONNECT.html">Personal: CONNECT</option>
        <option value="PERSONAL_DOMAIN_4_PROTECT.html">Personal: PROTECT</option>
        <option value="PERSONAL_DOMAIN_5_GROW.html">Personal: GROW</option>
        <option value="PERSONAL_DOMAIN_6_LEARN.html">Personal: LEARN</option>
        <option value="PERSONAL_DOMAIN_7_TRANSCEND.html">Personal: TRANSCEND</option>
      </select>

      <label>Injection Strategy:</label>
      <div class="strategy-options">
        <div class="strategy-option active" data-strategy="append">
          <h4>📄 Append</h4>
          <p>Add before &lt;/body&gt;</p>
        </div>
        <div class="strategy-option" data-strategy="smart">
          <h4>🧠 Smart</h4>
          <p>Near similar widgets</p>
        </div>
        <div class="strategy-option" data-strategy="quadrant">
          <h4>📍 Quadrant</h4>
          <p>Specific position</p>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-preview" onclick="previewInstall()">👁️ Preview</button>
        <button class="btn btn-install" onclick="confirmInstall()">✅ Install</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Feature Registry (loaded from JSON)
    let featureRegistry = null;
    let selectedFeature = null;
    let selectedStrategy = 'append';

    // Load registry
    async function loadRegistry() {
      try {
        const resp = await fetch('/DASHBOARD_FEATURES_REGISTRY.json');
        featureRegistry = await resp.json();
        renderWidgets(featureRegistry.features);
        updateStats();
      } catch (err) {
        console.error('Failed to load registry:', err);
        showToast('Failed to load feature registry', true);
      }
    }

    // Render widget cards
    function renderWidgets(features) {
      const grid = document.getElementById('widgetGrid');
      grid.innerHTML = features.map(f => `
        <div class="widget-card" data-category="${f.category}" data-id="${f.id}">
          <div class="widget-header">
            <span class="widget-name">${f.name}</span>
            <span class="widget-version">v${f.version}</span>
          </div>
          <span class="widget-category">${f.category.replace('_', ' ')}</span>
          <p class="widget-description">${f.description}</p>

          <div class="tags">
            ${f.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>

          <div class="widget-meta">
            <span>👤 ${f.author}</span>
            <span>📄 ${f.lines_of_code} lines</span>
            <span>💾 ${f.file_size_kb}KB</span>
          </div>

          <div class="lfsme-score">
            <span class="lfsme-value">${f.lfsme_impact.average}</span>
            <span class="lfsme-label">LFSME Score</span>
          </div>

          <div class="installations-list">
            Installed in <strong>${f.installations.length}</strong> dashboard(s)
          </div>

          <div class="widget-actions">
            <button class="btn btn-preview" onclick="previewFeature('${f.id}')">Preview</button>
            <button class="btn btn-install" onclick="openInstallModal('${f.id}')">Install</button>
          </div>
        </div>
      `).join('');
    }

    // Update stats
    function updateStats() {
      if (!featureRegistry) return;

      const totalFeatures = featureRegistry.features.length;
      let totalInstalls = 0;
      let totalLFSME = 0;

      featureRegistry.features.forEach(f => {
        totalInstalls += f.installations.length;
        totalLFSME += f.lfsme_impact.average;
      });

      document.getElementById('totalFeatures').textContent = totalFeatures;
      document.getElementById('totalInstalls').textContent = totalInstalls;
      document.getElementById('avgLFSME').textContent = (totalLFSME / totalFeatures).toFixed(1);
    }

    // Filter features
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;
        const filtered = filter === 'all'
          ? featureRegistry.features
          : featureRegistry.features.filter(f => f.category === filter);

        renderWidgets(filtered);
      });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = featureRegistry.features.filter(f =>
        f.name.toLowerCase().includes(query) ||
        f.description.toLowerCase().includes(query) ||
        f.tags.some(t => t.toLowerCase().includes(query))
      );
      renderWidgets(filtered);
    });

    // Strategy selection
    document.querySelectorAll('.strategy-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.strategy-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        selectedStrategy = opt.dataset.strategy;
      });
    });

    // Preview feature
    function previewFeature(featureId) {
      const feature = featureRegistry.features.find(f => f.id === featureId);
      if (feature) {
        showToast(`Preview: ${feature.name} - ${feature.lines_of_code} lines of code`);
        // Could open a modal with code preview
      }
    }

    // Open install modal
    function openInstallModal(featureId) {
      selectedFeature = featureRegistry.features.find(f => f.id === featureId);
      if (selectedFeature) {
        document.getElementById('modalFeatureName').textContent = selectedFeature.name;
        document.getElementById('installModal').classList.add('active');
      }
    }

    // Close modal
    function closeModal() {
      document.getElementById('installModal').classList.remove('active');
      selectedFeature = null;
    }

    // Preview install
    async function previewInstall() {
      const target = document.getElementById('targetDashboard').value;
      if (!target) {
        showToast('Please select a target dashboard', true);
        return;
      }

      showToast(`Preview mode: Would merge ${selectedFeature.name} into ${target} using ${selectedStrategy} strategy`);
    }

    // Confirm install
    async function confirmInstall() {
      const target = document.getElementById('targetDashboard').value;
      if (!target) {
        showToast('Please select a target dashboard', true);
        return;
      }

      try {
        const response = await fetch('/.netlify/functions/dashboard-merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source_dashboard: selectedFeature.code_location,
            target_dashboard: target,
            feature_ids: [selectedFeature.id],
            strategy: selectedStrategy,
            preview_only: false
          })
        });

        const result = await response.json();

        if (result.success) {
          showToast(`✅ Installed ${selectedFeature.name} into ${target}!`);
          closeModal();
        } else {
          showToast(`Error: ${result.error}`, true);
        }
      } catch (err) {
        showToast(`Network error: ${err.message}`, true);
      }
    }

    // Toast notification
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Init
    loadRegistry();
  </script>
</body>
</html>
