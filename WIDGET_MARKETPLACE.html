<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Marketplace | Dashboard Factory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
        }

        h1 {
            color: #00ffff;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            color: #00ffff;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        /* Filters Section */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .filter-select {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #00ffff;
        }

        /* Widget Grid */
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .widget-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .widget-card:hover {
            border-color: rgba(0, 255, 255, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }

        .widget-card.installed {
            border-color: rgba(0, 255, 0, 0.4);
        }

        .widget-header {
            padding: 15px;
            background: rgba(0, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widget-name {
            color: #00ffff;
            font-size: 1.2em;
            font-weight: bold;
        }

        .widget-category {
            font-size: 0.8em;
            padding: 4px 10px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 12px;
            color: #888;
        }

        .widget-body {
            padding: 15px;
        }

        .widget-description {
            color: #aaa;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .widget-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
        }

        .meta-label {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 3px;
        }

        .meta-value {
            font-size: 1em;
            color: #00ffff;
        }

        .lfsme-bar {
            display: flex;
            gap: 3px;
            margin-top: 5px;
        }

        .lfsme-segment {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .lfsme-segment.filled {
            background: linear-gradient(90deg, #00ffff, #00ff88);
        }

        .widget-footer {
            padding: 15px;
            border-top: 1px solid rgba(0, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-install {
            background: linear-gradient(135deg, #00ffff, #00cccc);
            color: #000;
            font-weight: bold;
        }

        .btn-install:hover {
            background: linear-gradient(135deg, #00ffff, #00ffaa);
            transform: scale(1.02);
        }

        .btn-installed {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        .btn-preview {
            background: rgba(0, 0, 0, 0.5);
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-preview:hover {
            border-color: rgba(0, 255, 255, 0.3);
            color: #00ffff;
        }

        .btn-uninstall {
            background: rgba(255, 0, 0, 0.1);
            color: #ff6666;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        .btn-uninstall:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        /* Dependencies indicator */
        .dependencies {
            font-size: 0.8em;
            color: #666;
            margin-top: 10px;
        }

        .dependencies span {
            color: #ffaa00;
        }

        /* Install Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a0a 100%);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal h2 {
            color: #00ffff;
            margin-bottom: 20px;
        }

        .modal-body {
            color: #aaa;
            line-height: 1.6;
        }

        .modal-body p {
            margin-bottom: 15px;
        }

        .target-select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
        }

        .modal-buttons .btn {
            flex: 1;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }

        .toast {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-color: rgba(0, 255, 0, 0.5);
        }

        .toast.error {
            border-color: rgba(255, 0, 0, 0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Category Colors */
        .category-monitoring { background: rgba(255, 100, 100, 0.1); color: #ff6464; }
        .category-ai_integration { background: rgba(100, 255, 100, 0.1); color: #64ff64; }
        .category-analytics { background: rgba(100, 100, 255, 0.1); color: #6464ff; }
        .category-productivity { background: rgba(255, 255, 100, 0.1); color: #ffff64; }
        .category-automation { background: rgba(255, 100, 255, 0.1); color: #ff64ff; }
        .category-gamification { background: rgba(100, 255, 255, 0.1); color: #64ffff; }
        .category-communication { background: rgba(255, 200, 100, 0.1); color: #ffc864; }
        .category-community { background: rgba(200, 100, 255, 0.1); color: #c864ff; }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .stats-bar { gap: 20px; }
            .filters { flex-direction: column; }
            .search-box { min-width: 100%; }
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Widget Marketplace</h1>
            <div class="subtitle">Dashboard Factory Phase 3 - Browse and Install Features</div>
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="totalWidgets">12</div>
                    <div class="stat-label">Widgets Available</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="installedCount">0</div>
                    <div class="stat-label">Installed</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="avgLFSME">8.5</div>
                    <div class="stat-label">Avg LFSME Score</div>
                </div>
            </div>
        </header>

        <div class="filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search widgets...">
            </div>
            <select class="filter-select" id="categoryFilter">
                <option value="">All Categories</option>
                <option value="monitoring">Monitoring</option>
                <option value="ai_integration">AI Integration</option>
                <option value="analytics">Analytics</option>
                <option value="productivity">Productivity</option>
                <option value="automation">Automation</option>
                <option value="gamification">Gamification</option>
                <option value="communication">Communication</option>
                <option value="community">Community</option>
            </select>
            <select class="filter-select" id="sortBy">
                <option value="lfsme">Sort by LFSME Score</option>
                <option value="installs">Sort by Installations</option>
                <option value="name">Sort by Name</option>
                <option value="category">Sort by Category</option>
            </select>
        </div>

        <div class="widget-grid" id="widgetGrid">
            <!-- Widgets loaded dynamically -->
        </div>
    </div>

    <!-- Install Modal -->
    <div class="modal-overlay" id="installModal">
        <div class="modal">
            <h2>Install Widget</h2>
            <div class="modal-body">
                <p id="installWidgetName"></p>
                <p>Select target dashboard:</p>
                <select class="target-select" id="targetDashboard">
                    <option value="">Select a dashboard...</option>
                </select>
                <div id="dependencyWarning" style="color: #ffaa00; margin-bottom: 15px; display: none;">
                    Dependencies: <span id="depList"></span>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-preview" onclick="closeModal()">Cancel</button>
                <button class="btn btn-install" onclick="confirmInstall()">Install Now</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Feature Registry Data
        const FEATURES = [
            {
                id: "discord_round_robin",
                name: "Discord Round Robin",
                category: "communication",
                description: "Auto-rotates messages across multiple Discord channels with configurable intervals and priority queues.",
                lfsme: { L: 8, F: 9, S: 8, M: 9, E: 10 },
                installations: 3,
                dependencies: []
            },
            {
                id: "trinity_status",
                name: "Trinity Status Panel",
                category: "monitoring",
                description: "Real-time display of T1/T2/T3 terminal states with activity indicators and last-sync timestamps.",
                lfsme: { L: 9, F: 10, S: 9, M: 8, E: 9 },
                installations: 5,
                dependencies: ["trinity_hub_connection"]
            },
            {
                id: "brain_atom_search",
                name: "Brain Atom Search",
                category: "ai_integration",
                description: "Full-text search across 166K+ brain atoms with pattern matching and relevance scoring.",
                lfsme: { L: 7, F: 9, S: 10, M: 8, E: 8 },
                installations: 4,
                dependencies: ["cyclotron_core"]
            },
            {
                id: "araya_chat_embed",
                name: "Araya Chat Embed",
                category: "ai_integration",
                description: "Embedded Araya conversation interface with memory persistence and skill access.",
                lfsme: { L: 8, F: 8, S: 9, M: 9, E: 7 },
                installations: 6,
                dependencies: ["araya_api", "user_auth"]
            },
            {
                id: "bug_tracker_live",
                name: "Bug Tracker Live",
                category: "monitoring",
                description: "Live connection to GitHub issues with auto-refresh, priority sorting, and quick-fix links.",
                lfsme: { L: 9, F: 10, S: 8, M: 8, E: 9 },
                installations: 4,
                dependencies: ["github_api"]
            },
            {
                id: "xp_level_display",
                name: "XP Level Display",
                category: "gamification",
                description: "Shows user XP, level, achievements with animated progress bars and milestone celebrations.",
                lfsme: { L: 10, F: 9, S: 7, M: 10, E: 10 },
                installations: 7,
                dependencies: []
            },
            {
                id: "todo_sync",
                name: "TODO Sync Widget",
                category: "productivity",
                description: "Bi-directional sync with Desktop/1_COMMAND/TODO.md and MACHINE_TODO.md with priority tagging.",
                lfsme: { L: 8, F: 9, S: 9, M: 8, E: 9 },
                installations: 5,
                dependencies: []
            },
            {
                id: "flight_log_viewer",
                name: "Flight Log Viewer",
                category: "analytics",
                description: "Displays FLIGHT_LOG.md with session statistics, accomplishment tracking, and trend graphs.",
                lfsme: { L: 9, F: 8, S: 8, M: 9, E: 9 },
                installations: 3,
                dependencies: []
            },
            {
                id: "quick_deploy",
                name: "Quick Deploy Button",
                category: "automation",
                description: "One-click deployment to Netlify with status indicator and rollback options.",
                lfsme: { L: 10, F: 10, S: 8, M: 9, E: 10 },
                installations: 8,
                dependencies: ["netlify_cli"]
            },
            {
                id: "ai_provider_switcher",
                name: "AI Provider Switcher",
                category: "ai_integration",
                description: "Toggle between Claude, Groq, OpenRouter with real-time cost comparison and fallback chains.",
                lfsme: { L: 7, F: 9, S: 9, M: 8, E: 8 },
                installations: 4,
                dependencies: []
            },
            {
                id: "notification_center",
                name: "Notification Center",
                category: "productivity",
                description: "Aggregates Discord pings, GitHub notifications, and system alerts with filtering and snooze.",
                lfsme: { L: 8, F: 9, S: 8, M: 9, E: 8 },
                installations: 5,
                dependencies: ["discord_api", "github_api"]
            },
            {
                id: "community_pulse",
                name: "Community Pulse",
                category: "community",
                description: "Real-time activity feed from Discord server with sentiment analysis and engagement metrics.",
                lfsme: { L: 7, F: 8, S: 8, M: 9, E: 7 },
                installations: 2,
                dependencies: ["discord_api"]
            }
        ];

        // Dashboard targets
        const DASHBOARDS = [
            { id: "COMMANDER_DASHBOARD", name: "Commander Dashboard" },
            { id: "BUILDER_COCKPIT", name: "Builder Cockpit" },
            { id: "TEAM_COCKPIT", name: "Team Cockpit" },
            { id: "OPERATOR_COCKPIT_COMMANDER", name: "Operator Cockpit - Commander" },
            { id: "CONSCIOUSNESS_DASHBOARD", name: "Consciousness Dashboard" },
            { id: "BRAIN_COUNCIL_DASHBOARD", name: "Brain Council Dashboard" },
            { id: "TRINITY_COMMAND_DASHBOARD", name: "Trinity Command Dashboard" }
        ];

        // Track installed widgets per dashboard
        let installedWidgets = {};
        let currentInstallWidget = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            populateDashboardSelect();
            renderWidgets();
            setupFilters();
            loadInstalledState();
        });

        function populateDashboardSelect() {
            const select = document.getElementById('targetDashboard');
            DASHBOARDS.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                select.appendChild(opt);
            });
        }

        function calculateLFSME(lfsme) {
            const values = Object.values(lfsme);
            return (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
        }

        function renderWidgets(filter = {}) {
            const grid = document.getElementById('widgetGrid');
            let filtered = [...FEATURES];

            // Apply search filter
            if (filter.search) {
                const term = filter.search.toLowerCase();
                filtered = filtered.filter(w =>
                    w.name.toLowerCase().includes(term) ||
                    w.description.toLowerCase().includes(term) ||
                    w.category.includes(term)
                );
            }

            // Apply category filter
            if (filter.category) {
                filtered = filtered.filter(w => w.category === filter.category);
            }

            // Apply sorting
            const sortBy = filter.sortBy || 'lfsme';
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'lfsme':
                        return calculateLFSME(b.lfsme) - calculateLFSME(a.lfsme);
                    case 'installs':
                        return b.installations - a.installations;
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'category':
                        return a.category.localeCompare(b.category);
                    default:
                        return 0;
                }
            });

            grid.innerHTML = filtered.map(widget => createWidgetCard(widget)).join('');
            updateStats();
        }

        function createWidgetCard(widget) {
            const avgLFSME = calculateLFSME(widget.lfsme);
            const isInstalled = Object.values(installedWidgets).flat().includes(widget.id);

            return `
                <div class="widget-card ${isInstalled ? 'installed' : ''}" data-id="${widget.id}">
                    <div class="widget-header">
                        <span class="widget-name">${widget.name}</span>
                        <span class="widget-category category-${widget.category}">${formatCategory(widget.category)}</span>
                    </div>
                    <div class="widget-body">
                        <div class="widget-description">${widget.description}</div>
                        <div class="widget-meta">
                            <div class="meta-item">
                                <span class="meta-label">LFSME Score</span>
                                <span class="meta-value">${avgLFSME}/10</span>
                                <div class="lfsme-bar">
                                    ${[...Array(10)].map((_, i) =>
                                        `<div class="lfsme-segment ${i < Math.round(avgLFSME) ? 'filled' : ''}"></div>`
                                    ).join('')}
                                </div>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Installations</span>
                                <span class="meta-value">${widget.installations}</span>
                            </div>
                        </div>
                        ${widget.dependencies.length > 0 ? `
                            <div class="dependencies">
                                Requires: <span>${widget.dependencies.join(', ')}</span>
                            </div>
                        ` : ''}
                    </div>
                    <div class="widget-footer">
                        ${isInstalled ? `
                            <button class="btn btn-installed" disabled>Installed</button>
                            <button class="btn btn-uninstall" onclick="uninstallWidget('${widget.id}')">Uninstall</button>
                        ` : `
                            <button class="btn btn-install" onclick="showInstallModal('${widget.id}')">Install</button>
                            <button class="btn btn-preview" onclick="previewWidget('${widget.id}')">Preview</button>
                        `}
                    </div>
                </div>
            `;
        }

        function formatCategory(cat) {
            return cat.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function setupFilters() {
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const sortBy = document.getElementById('sortBy');

            const applyFilters = () => {
                renderWidgets({
                    search: searchInput.value,
                    category: categoryFilter.value,
                    sortBy: sortBy.value
                });
            };

            searchInput.addEventListener('input', applyFilters);
            categoryFilter.addEventListener('change', applyFilters);
            sortBy.addEventListener('change', applyFilters);
        }

        function showInstallModal(widgetId) {
            currentInstallWidget = FEATURES.find(w => w.id === widgetId);
            if (!currentInstallWidget) return;

            document.getElementById('installWidgetName').innerHTML =
                `Installing: <strong style="color: #00ffff">${currentInstallWidget.name}</strong>`;

            const depWarning = document.getElementById('dependencyWarning');
            if (currentInstallWidget.dependencies.length > 0) {
                document.getElementById('depList').textContent = currentInstallWidget.dependencies.join(', ');
                depWarning.style.display = 'block';
            } else {
                depWarning.style.display = 'none';
            }

            document.getElementById('installModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('installModal').classList.remove('active');
            currentInstallWidget = null;
        }

        async function confirmInstall() {
            const targetDashboard = document.getElementById('targetDashboard').value;
            if (!targetDashboard) {
                showToast('Please select a target dashboard', 'error');
                return;
            }

            if (!currentInstallWidget) return;

            closeModal();
            showToast(`Installing ${currentInstallWidget.name}...`, 'info');

            try {
                // Call the backend API
                const response = await fetch('/.netlify/functions/widget-marketplace', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'install',
                        widgetId: currentInstallWidget.id,
                        dashboardId: targetDashboard
                    })
                });

                const result = await response.json();

                if (result.success) {
                    if (!installedWidgets[targetDashboard]) {
                        installedWidgets[targetDashboard] = [];
                    }
                    installedWidgets[targetDashboard].push(currentInstallWidget.id);
                    saveInstalledState();
                    renderWidgets(getCurrentFilters());
                    showToast(`${currentInstallWidget.name} installed successfully!`, 'success');
                } else {
                    showToast(`Install failed: ${result.error}`, 'error');
                }
            } catch (err) {
                // Fallback to local state if API unavailable
                if (!installedWidgets[targetDashboard]) {
                    installedWidgets[targetDashboard] = [];
                }
                installedWidgets[targetDashboard].push(currentInstallWidget.id);
                saveInstalledState();
                renderWidgets(getCurrentFilters());
                showToast(`${currentInstallWidget.name} installed (local mode)`, 'success');
            }
        }

        function uninstallWidget(widgetId) {
            const widget = FEATURES.find(w => w.id === widgetId);
            if (!widget) return;

            // Find and remove from all dashboards
            Object.keys(installedWidgets).forEach(dashboard => {
                installedWidgets[dashboard] = installedWidgets[dashboard].filter(id => id !== widgetId);
            });

            saveInstalledState();
            renderWidgets(getCurrentFilters());
            showToast(`${widget.name} uninstalled`, 'success');
        }

        function previewWidget(widgetId) {
            const widget = FEATURES.find(w => w.id === widgetId);
            showToast(`Preview for ${widget.name} - coming soon!`, 'info');
        }

        function getCurrentFilters() {
            return {
                search: document.getElementById('searchInput').value,
                category: document.getElementById('categoryFilter').value,
                sortBy: document.getElementById('sortBy').value
            };
        }

        function updateStats() {
            const allInstalled = Object.values(installedWidgets).flat();
            const uniqueInstalled = [...new Set(allInstalled)];

            document.getElementById('totalWidgets').textContent = FEATURES.length;
            document.getElementById('installedCount').textContent = uniqueInstalled.length;

            const avgScore = FEATURES.reduce((sum, w) => sum + parseFloat(calculateLFSME(w.lfsme)), 0) / FEATURES.length;
            document.getElementById('avgLFSME').textContent = avgScore.toFixed(1);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        function saveInstalledState() {
            localStorage.setItem('widgetMarketplace_installed', JSON.stringify(installedWidgets));
        }

        function loadInstalledState() {
            const saved = localStorage.getItem('widgetMarketplace_installed');
            if (saved) {
                installedWidgets = JSON.parse(saved);
                renderWidgets();
            }
        }
    </script>
</body>
</html>
