<style>
  /* Base theme matching DASHBOARD_TEMPLATE */
  :root {
    --bg-primary: #0a0a1a;
    --bg-secondary: #0f0f2a;
    --bg-card: rgba(255,255,255,0.05);
    --border-card: rgba(255,255,255,0.1);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --connect-color: #ffdd00; /* Yellow - Solar Plexus */
    --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 12px;
    --blur: blur(12px);
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    font-family: var(--font-stack);
    background: var(--bg-primary);
    background-image: radial-gradient(ellipse at 20% 50%, rgba(255,221,0,0.08) 0%, transparent 50%);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    background: rgba(15,15,42,0.8);
    backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--border-card);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 0.75rem; }
  .header-title { font-size: 1.1rem; font-weight: 700; color: var(--connect-color); }
  .header-subtitle { font-size: 0.8rem; color: var(--text-muted); }
  .header-right { display: flex; gap: 0.5rem; }

  .btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-card);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all var(--transition);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .btn:hover {
    background: rgba(255,221,0,0.1);
    border-color: rgba(255,221,0,0.3);
    transform: translateY(-1px);
  }

  /* Seven Grid System */
  .seven-grid {
    padding: 2rem 1rem;
    max-width: 600px;
    margin: 0 auto;
  }

  .seven-grid-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .seven-grid-bottom {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }

  .grid-item {
    background: var(--bg-card);
    backdrop-filter: var(--blur);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 1.5rem;
    transition: all var(--transition);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.75rem;
    position: relative;
    min-height: 140px;
  }

  .grid-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 25px rgba(255,221,0,0.2);
    border-color: rgba(255,221,0,0.4);
    background: rgba(255,221,0,0.08);
  }

  .grid-item-icon {
    font-size: 2.5rem;
    line-height: 1;
  }

  .grid-item-label {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .grid-item-desc {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Status badge */
  .status-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 10px #00ff88;
  }

  .status-badge.pending {
    background: #ffaa00;
    box-shadow: 0 0 10px #ffaa00;
  }

  /* Bottom items responsive */
  @media (max-width: 480px) {
    .seven-grid-bottom .grid-item {
      padding: 1rem 0.5rem;
      min-height: 120px;
    }
    .seven-grid-bottom .grid-item-icon {
      font-size: 2rem;
    }
    .seven-grid-bottom .grid-item-label {
      font-size: 0.85rem;
    }
  }

  }

    text-decoration: none;
  }

  }
</style>

<!-- JavaScript -->
<script>
(function() {
  'use strict';

  // Parse DNA
  const DNA = JSON.parse(document.getElementById('dashboard-dna').textContent);

  // Render items
  function renderGrid() {
    const topContainer = document.getElementById('grid-top');
    const bottomContainer = document.getElementById('grid-bottom');

    // Top 4 items
    topContainer.innerHTML = DNA.items.slice(0, 4).map(item => `
      <a href="${item.link}" class="grid-item">
        ${item.status === 'active' ? '<div class="status-badge"></div>' : ''}
        ${item.status === 'pending' ? '<div class="status-badge pending"></div>' : ''}
        <div class="grid-item-icon">${item.icon}</div>
        <div class="grid-item-label">${item.name}</div>
        <div class="grid-item-desc">${item.description}</div>
      </a>
    `).join('');

    // Bottom 3 items
    bottomContainer.innerHTML = DNA.items.slice(4, 7).map(item => `
      <a href="${item.link}" class="grid-item">
        ${item.status === 'active' ? '<div class="status-badge"></div>' : ''}
        ${item.status === 'pending' ? '<div class="status-badge pending"></div>' : ''}
        <div class="grid-item-icon">${item.icon}</div>
        <div class="grid-item-label">${item.name}</div>
        <div class="grid-item-desc">${item.description}</div>
      </a>
    `).join('');
  }

  // Boot
  document.title = DNA.name + ' | ' + DNA.layer;
  renderGrid();

  console.log('[DASHBOARD] ' + DNA.name + ' v' + DNA.version + ' loaded');
})();
</script>
