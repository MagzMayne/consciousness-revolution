<!-- ============================================================
     SEVEN ITEM GRID COMPONENT v1.0.0
     Phone-optimized: No scrolling required
     Pattern: 4 items top (2×2), 3 items bottom (1×3)
============================================================ -->

<style>
  .seven-grid {
    display: grid;
    gap: 0.75rem;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 1rem;
  }

  /* Top 4 items: 2×2 grid */
  .seven-grid-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  /* Bottom 3 items: 1×3 grid */
  .seven-grid-bottom {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }

  /* Item card - reusable */
  .grid-item {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 1.25rem;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
  }

  .grid-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0,240,255,0.15);
    border-color: rgba(0,240,255,0.2);
    background: rgba(255,255,255,0.08);
  }

  /* Icon */
  .grid-item-icon {
    font-size: 2rem;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    margin-bottom: 0.25rem;
  }

  /* Label */
  .grid-item-label {
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1.3;
  }

  /* Status badge (optional) */
  .grid-item-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--badge-color, #00ff88);
    box-shadow: 0 0 8px var(--badge-color, #00ff88);
  }

  /* Bottom items smaller on mobile */
  @media (max-width: 480px) {
    .seven-grid-bottom .grid-item {
      padding: 1rem 0.5rem;
    }
    .seven-grid-bottom .grid-item-icon {
      font-size: 1.5rem;
      width: 48px;
      height: 48px;
    }
    .seven-grid-bottom .grid-item-label {
      font-size: 0.75rem;
    }
  }

  /* Domain color variants */
  .grid-item.command { --accent: #ff4444; }
  .grid-item.build { --accent: #ff8800; }
  .grid-item.connect { --accent: #ffdd00; }
  .grid-item.protect { --accent: #00ff88; }
  .grid-item.grow { --accent: #00aaff; }
  .grid-item.learn { --accent: #8844ff; }
  .grid-item.transcend { --accent: #ff00ff; }

  .grid-item:hover .grid-item-icon {
    background: rgba(var(--accent-rgb, 0, 240, 255), 0.15);
  }
</style>
