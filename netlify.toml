# Netlify Configuration for Barbrick Design Repository
# This configuration allows the entire repository to be deployed to Netlify
# https://app.netlify.com/

[build]
  # Publish directory - the entire repository
  publish = "."
  
  # Build command - npm install for function dependencies
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"
  
  # Functions directory for serverless functions
  functions = "netlify/functions"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"

  # NPM version
  NPM_VERSION = "9"

[functions]
  # External modules - these will be installed via npm install during build
  external_node_modules = [
    "@supabase/supabase-js",
    "@octokit/rest",
    "stripe",
    "openai",
    "@anthropic-ai/sdk",
    "@google/generative-ai",
    "twilio",
    "nodemailer",
    "axios",
    "crypto",
    "fs",
    "path",
    "url"
  ]
  node_bundler = "esbuild"

# Redirects and rewrites
# Handle SPA routing - all routes should serve index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = ["admin"]}

# Default redirect for non-API routes (force=false means serve existing files first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.paypal.com https://www.paypalobjects.com https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; frame-src 'self' https://www.paypal.com;"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Deploy contexts for different environments
[context.production]
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"
  [context.production.environment]
    NODE_ENV = "production"

[context.deploy-preview]
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"
  [context.deploy-preview.environment]
    NODE_ENV = "development"

[context.branch-deploy]
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"

# Dev command for local development
[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  framework = "#static"
  
# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-functions-install-core"
