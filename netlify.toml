[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Redirects for cleaner URLs
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirect old Araya to new version
[[redirects]]
  from = "/araya-light-mvp.html"
  to = "/araya-chat.html"
  status = 301

[[redirects]]
  from = "/araya-light-mvp"
  to = "/araya-chat.html"
  status = 301
