# Netlify Configuration for Barbrick Design Repository
# This configuration allows the entire repository to be deployed to Netlify
# https://app.netlify.com/

[build]
  # Publish directory - the entire repository
  publish = "."
  
  # Build command - install dependencies for functions
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"
  
  # Functions directory for serverless functions
  functions = "netlify/functions"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"

  # NPM version
  NPM_VERSION = "9"

[functions]
  # External modules - ONLY Node.js built-ins (npm packages get bundled by esbuild)
  external_node_modules = [
    "crypto",
    "fs",
    "path",
    "url",
    "http",
    "https",
    "stream",
    "buffer",
    "events",
    "util",
    "os",
    "child_process"
  ]
  node_bundler = "esbuild"

# Redirects and rewrites
# Handle SPA routing - all routes should serve index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = ["admin"]}

# Default redirect for non-API routes (force=false means serve existing files first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # HARDENED CSP - Removed 'unsafe-eval', restricted connect-src, added security directives
    # Last updated: 2026-02-18 (Security Phase 2)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.paypal.com https://www.paypalobjects.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.anthropic.com https://api.deepseek.com https://api.openai.com https://api.groq.com https://api.together.ai https://api.replicate.com https://api.huggingface.co https://api.cohere.ai https://api.stripe.com https://api.paypal.com https://api.github.com https://*.supabase.co https://*.netlify.app wss://*.supabase.co; frame-src 'self' https://www.paypal.com https://js.stripe.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Deploy contexts for different environments
[context.production]
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"
  [context.production.environment]
    NODE_ENV = "production"

[context.deploy-preview]
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"
  [context.deploy-preview.environment]
    NODE_ENV = "development"

[context.branch-deploy]
  command = "npm ci --legacy-peer-deps || npm install --legacy-peer-deps"

# Dev command for local development
[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  framework = "#static"
  
# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-functions-install-core"
