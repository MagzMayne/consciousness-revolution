<body>
  <header>
    <a href="peaceAi.html" class="back-link">← Back to PeaceAI</a>
    <h1>PeaceAI Admin Panel</h1>
    <p>User Approval & Access Management</p>
  </header>

  <div class="container">
    <!-- Add New User -->
    <div class="admin-section">
      <h2>Approve New User</h2>
      <div class="admin-controls">
        <input type="text" id="userIdInput" placeholder="User ID (wallet address or email)" />
        <select id="roleSelect">
          <option value="user">User - View only</option>
          <option value="steward">Steward - View and configure alerts</option>
          <option value="admin">Admin - Full control</option>
        </select>
        <button id="approveUserBtn">Approve User</button>
      </div>
    </div>

    <!-- Approved Users List -->
    <div class="admin-section">
      <h2>Approved Users</h2>
      <div id="approvedUsersList" class="user-list">
        <div class="empty-state">
          <p>No approved users yet. Add users above to grant them access.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="universal-wallet-auth.js"></script>
  <script src="peaceai-auth-manager.js"></script>
  <script>
    // Initialize auth manager
    let adminUser = null;

    async function init() {
      await window.PeaceAIAuthManager.init();

      // Check if user is admin
      adminUser = window.PeaceAIAuthManager.getCurrentUser();
      
      if (!adminUser || !window.PeaceAIAuthManager.hasPermission('approve_users')) {
        showToast('❌ Admin access required', 'error');
        setTimeout(() => {
          window.location.href = 'peaceAi.html';
        }, 2000);
        return;
      }

      loadApprovedUsers();
    }

    // Load and display approved users
    function loadApprovedUsers() {
      try {
        const approvedUsers = window.PeaceAIAuthManager.getApprovedUsers();
        const listEl = document.getElementById('approvedUsersList');
        
        if (Object.keys(approvedUsers).length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <p>No approved users yet. Add users above to grant them access.</p>
            </div>
          `;
          return;
        }

        listEl.innerHTML = '';
        
        for (const [userId, userData] of Object.entries(approvedUsers)) {
          const card = document.createElement('div');
          card.className = 'user-card approved';
          card.innerHTML = `
            <div class="user-info">
              <div class="name">${userId.includes('@') ? 'Email User' : 'Wallet User'}</div>
              <div class="identifier">${userId}</div>
              <div class="role">${window.PeaceAIAuthManager.getRoleDescription(userData.role)}</div>
              <div style="font-size: 0.75rem; color: #6b7280; margin-top: 0.5rem;">
                Approved by: ${userData.approvedBy} on ${new Date(userData.approvedAt).toLocaleString()}
              </div>
            </div>
            <div class="user-actions">
              <span class="status-badge approved">✅ Approved</span>
              <button class="btn btn-revoke" onclick="revokeUser('${userId}')">Revoke</button>
            </div>
          `;
          listEl.appendChild(card);
        }
      } catch (error) {
        console.error('Error loading approved users:', error);
        showToast('❌ ' + error.message, 'error');
      }
    }

    // Approve user
    document.getElementById('approveUserBtn').addEventListener('click', () => {
      const userId = document.getElementById('userIdInput').value.trim();
      const role = document.getElementById('roleSelect').value;

      if (!userId) {
        showToast('⚠️ Please enter a user ID', 'error');
        return;
      }

      try {
        window.PeaceAIAuthManager.approveUser(userId, role, adminUser.id);
        showToast(`✅ User approved as ${role}`, 'success');
        
        // Clear input
        document.getElementById('userIdInput').value = '';
        
        // Reload list
        loadApprovedUsers();
      } catch (error) {
        console.error('Error approving user:', error);
        showToast('❌ ' + error.message, 'error');
      }
    });

    // Revoke user approval
    function revokeUser(userId) {
      if (!confirm(`Revoke approval for ${userId}?`)) {
        return;
      }

      try {
        window.PeaceAIAuthManager.revokeApproval(userId);
        showToast('✅ User approval revoked', 'success');
        loadApprovedUsers();
      } catch (error) {
        console.error('Error revoking approval:', error);
        showToast('❌ ' + error.message, 'error');
      }
    }

    // Toast notification
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Initialize on page load
    init();
  </script>
