<body>
    <h1>🧪 Test GitHub Redundancy Checker</h1>
    
    <div class="test-section">
        <h2>Automated Tests</h2>
        <button onclick="runAllTests()">▶️ Run All Tests</button>
        <div id="testResults"></div>
    </div>
    
    <div class="test-section">
        <h2>Manual Test</h2>
        <button onclick="testManual()">🔍 Test with Sample Idea</button>
        <div id="manualResults"></div>
    </div>
    
    <script src="src/utils/github-redundancy-checker.js"></script>
    <script>
        let checker;
        
        function log(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            document.getElementById('testResults').appendChild(div);
        }
        
        async function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            
            try {
                // Test 1: Initialization
                log('Test 1: Initializing checker...');
                checker = new GitHubRedundancyChecker();
                await checker.init();
                log('✅ Test 1 PASSED: Checker initialized successfully');
                
                // Test 2: Local projects loaded
                log(`Test 2: Checking local projects...`);
                if (checker.localProjects.length > 0) {
                    log(`✅ Test 2 PASSED: Loaded ${checker.localProjects.length} local projects`);
                } else {
                    log(`⚠️ Test 2 WARNING: No local projects loaded`, 'error');
                }
                
                // Test 3: Search local projects
                log('Test 3: Testing local search...');
                const localResults = await checker.searchLocalProjects(
                    '3D visualization gemstone tool',
                    { keywords: ['3D', 'gemstone'] }
                );
                log(`✅ Test 3 PASSED: Found ${localResults.length} local matches`);
                
                // Test 4: Similarity calculation
                log('Test 4: Testing similarity calculation...');
                const similarity = checker.calculateSimilarity(
                    'A 3D gemstone viewer',
                    'GemBot 3D Viewer',
                    'Interactive 3D gemstone visualization tool',
                    ['3D', 'gemstone', 'viewer']
                );
                if (similarity >= 0.5) {
                    log(`✅ Test 4 PASSED: Similarity score = ${(similarity * 100).toFixed(0)}%`);
                } else {
                    log(`⚠️ Test 4 WARNING: Low similarity score = ${(similarity * 100).toFixed(0)}%`, 'error');
                }
                
                // Test 5: Search query building
                log('Test 5: Testing search query builder...');
                const query = checker.buildSearchQuery(
                    'A cryptocurrency trading bot with machine learning',
                    ['crypto', 'ML']
                );
                if (query.includes('cryptocurrency') || query.includes('trading')) {
                    log(`✅ Test 5 PASSED: Query = "${query}"`);
                } else {
                    log(`⚠️ Test 5 WARNING: Unexpected query = "${query}"`, 'error');
                }
                
                // Test 6: Cache system
                log('Test 6: Testing cache system...');
                checker.cache.set('test', { data: 'cached', timestamp: Date.now() });
                if (checker.cache.has('test')) {
                    log('✅ Test 6 PASSED: Cache working correctly');
                    checker.clearCache();
                } else {
                    log('❌ Test 6 FAILED: Cache not working', 'error');
                }
                
                // Test 7: Export functionality
                log('Test 7: Testing export functionality...');
                const mockResults = {
                    idea: 'Test idea',
                    summary: { totalMatches: 0 },
                    matches: { local: [], organization: [], public: [] }
                };
                const exported = checker.exportResults(mockResults);
                if (exported && typeof exported === 'string') {
                    log('✅ Test 7 PASSED: Export working correctly');
                } else {
                    log('❌ Test 7 FAILED: Export not working', 'error');
                }
                
                log('\n🎉 All tests completed!', 'success');
                
            } catch (error) {
                log(`❌ TEST FAILED: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function testManual() {
            const resultsDiv = document.getElementById('manualResults');
            resultsDiv.innerHTML = '<p>🔍 Checking redundancy...</p>';
            
            try {
                if (!checker) {
                    checker = new GitHubRedundancyChecker();
                    await checker.init();
                }
                
                // Test with a sample idea
                const results = await checker.checkRedundancy(
                    'A web-based 3D gemstone visualization tool with AI-powered identification and interactive rotation',
                    {
                        keywords: ['3D', 'gemstone', 'visualization', 'AI'],
                        searchLocal: true,
                        searchOrg: false,  // Skip to avoid API rate limits in test
                        searchPublic: false
                    }
                );
                
                // Display results
                resultsDiv.innerHTML = `
                    <h3>Results Summary</h3>
                    <pre>${JSON.stringify(results.summary, null, 2)}</pre>
                    
                    <h3>Recommendations (${results.recommendations.length})</h3>
                    <pre>${JSON.stringify(results.recommendations, null, 2)}</pre>
                    
                    <h3>Local Matches (${results.matches.local.length})</h3>
                    <pre>${JSON.stringify(results.matches.local.slice(0, 3), null, 2)}</pre>
                    
                    <p style="color: #22c55e;">✅ Manual test completed successfully!</p>
                `;
                
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: #ef4444;">❌ Error: ${error.message}</p>`;
                console.error(error);
            }
        }
        
        // Auto-run tests on load
        window.addEventListener('load', () => {
            console.log('Test page loaded. Click "Run All Tests" to begin.');
        });
    </script>
</body>
