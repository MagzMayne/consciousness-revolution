<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-EE9CE2BE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey Dashboard | Consciousness Revolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #FFD700;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .back-link:hover {
            color: #FFA500;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .dashboard-card h3 {
            color: #FFD700;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .stat {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFA500;
            margin: 15px 0;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            transition: width 0.5s ease;
        }

        .milestone-list {
            list-style: none;
            padding: 0;
        }

        .milestone-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border-left: 4px solid #FFD700;
        }

        .milestone-item.completed {
            opacity: 0.7;
            border-left-color: #2ecc71;
        }

        .milestone-icon {
            font-size: 1.5rem;
        }

        .milestone-content {
            flex: 1;
        }

        .milestone-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #FFD700;
        }

        .milestone-date {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .domain-progress {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .domain-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .domain-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .domain-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .domain-score {
            font-size: 1.5rem;
            color: #FFD700;
            font-weight: bold;
        }

        .journey-phase-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .journey-phase-display .phase-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .journey-phase-display h2 {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            color: #FFD700;
            margin-bottom: 15px;
        }

        .empty-state p {
            opacity: 0.8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Hub</a>

        <div class="header">
            <h1>🌟 My Journey Dashboard</h1>
            <p>Track your progress on the path to your best self</p>
        </div>

        <!-- Content will be dynamically loaded -->
        <div id="dashboardContent"></div>

        <div class="action-buttons">
            <a href="life-journey-explorer.html" class="btn btn-primary">🧭 Explore My Journey</a>
            <a href="consciousness-tools.html" class="btn btn-secondary">🛠️ Consciousness Tools</a>
            <a href="seven-domains.html" class="btn btn-secondary">🌟 7 Sacred Domains</a>
        </div>
    </div>

    <script>
        function loadDashboard() {
            const savedJourney = localStorage.getItem('lifeJourneyData');
            const dashboardContent = document.getElementById('dashboardContent');

            if (!savedJourney) {
                // Show empty state
                dashboardContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🌱</div>
                        <h2>Begin Your Journey</h2>
                        <p>You haven't started exploring your unique life path yet. The Life Journey Explorer will help you discover your phase, identify your callings, and create a personalized roadmap for becoming your best self.</p>
                        <a href="life-journey-explorer.html" class="btn btn-primary" style="display: inline-block;">🚀 Start Journey Exploration</a>
                    </div>
                `;
                return;
            }

            const journey = JSON.parse(savedJourney);
            
            // Phase icons and names
            const phaseInfo = {
                awakening: { icon: '🌅', name: 'Awakening' },
                discovery: { icon: '🔍', name: 'Discovery' },
                transformation: { icon: '🦋', name: 'Transformation' },
                integration: { icon: '🌺', name: 'Integration' },
                creation: { icon: '✨', name: 'Creation' },
                mastery: { icon: '🏔️', name: 'Mastery' }
            };

            const callingInfo = {
                creation: { icon: '🎨', name: 'Creative Expression' },
                healing: { icon: '🌿', name: 'Healing & Restoration' },
                wisdom: { icon: '📚', name: 'Learning & Wisdom' },
                connection: { icon: '🤝', name: 'Connection & Community' },
                leadership: { icon: '🎯', name: 'Leadership & Vision' },
                service: { icon: '💝', name: 'Service & Support' }
            };

            const phase = phaseInfo[journey.phase];
            const daysSince = Math.floor((Date.now() - new Date(journey.timestamp).getTime()) / (1000 * 60 * 60 * 24));

            let dashboardHTML = `
                <!-- Current Phase -->
                <div class="journey-phase-display">
                    <div class="phase-icon">${phase.icon}</div>
                    <h2>Current Phase: ${phase.name}</h2>
                    <p>You've been on this journey for ${daysSince} day${daysSince !== 1 ? 's' : ''}</p>
                </div>

                <!-- Dashboard Stats -->
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>🎯 Journey Phase</h3>
                        <div class="stat">${phase.name}</div>
                        <p>Your current stage of personal evolution</p>
                    </div>

                    <div class="dashboard-card">
                        <h3>💫 Soul Callings</h3>
                        <div class="stat">${journey.callings.length}</div>
                        <p>Areas that resonate with your authentic self</p>
                    </div>

                    <div class="dashboard-card">
                        <h3>📅 Journey Started</h3>
                        <div class="stat">${daysSince}</div>
                        <p>Days of conscious self-creation</p>
                    </div>
                </div>

                <!-- Your Callings -->
                <div class="dashboard-card">
                    <h3>✨ Your Soul Callings</h3>
                    <p>These areas call to your authentic self:</p>
                    <div class="milestone-list">
                        ${journey.callings.map(calling => {
                            const info = callingInfo[calling];
                            return `
                                <div class="milestone-item">
                                    <div class="milestone-icon">${info.icon}</div>
                                    <div class="milestone-content">
                                        <div class="milestone-title">${info.name}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- 7 Domains Progress -->
                <div class="dashboard-card">
                    <h3>🌟 7 Sacred Domains</h3>
                    <p>Explore and grow in each domain:</p>
                    <div class="domain-progress">
                        <div class="domain-item">
                            <div class="domain-icon">🎯</div>
                            <div class="domain-name">Command</div>
                            <div class="domain-score">-</div>
                        </div>
                        <div class="domain-item">
                            <div class="domain-icon">🎨</div>
                            <div class="domain-name">Creation</div>
                            <div class="domain-score">-</div>
                        </div>
                        <div class="domain-item">
                            <div class="domain-icon">🤝</div>
                            <div class="domain-name">Connection</div>
                            <div class="domain-score">-</div>
                        </div>
                        <div class="domain-item">
                            <div class="domain-icon">🕊️</div>
                            <div class="domain-name">Peace</div>
                            <div class="domain-score">-</div>
                        </div>
                        <div class="domain-item">
                            <div class="domain-icon">💰</div>
                            <div class="domain-name">Abundance</div>
                            <div class="domain-score">-</div>
                        </div>
                        <div class="domain-item">
                            <div class="domain-icon">📚</div>
                            <div class="domain-name">Wisdom</div>
                            <div class="domain-score">-</div>
                        </div>
                        <div class="domain-item">
                            <div class="domain-icon">🙏</div>
                            <div class="domain-name">Purpose</div>
                            <div class="domain-score">-</div>
                        </div>
                    </div>
                </div>

                <!-- Reflections -->
                ${journey.reflections.bestSelf ? `
                    <div class="dashboard-card">
                        <h3>💭 Your Vision of Your Best Self</h3>
                        <p style="font-style: italic; line-height: 1.8; opacity: 0.9;">"${journey.reflections.bestSelf}"</p>
                    </div>
                ` : ''}

                ${journey.reflections.creation ? `
                    <div class="dashboard-card">
                        <h3>🎨 What You're Called to Create</h3>
                        <p style="font-style: italic; line-height: 1.8; opacity: 0.9;">"${journey.reflections.creation}"</p>
                    </div>
                ` : ''}
            `;

            dashboardContent.innerHTML = dashboardHTML;
        }

        // Load dashboard on page load
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
