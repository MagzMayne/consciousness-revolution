        // Blockchain simulation layer
        class BlockchainLedger {
            constructor() {
                this.transactions = [];
                this.userPacks = {};
                this.loadFromLocalStorage();
            }

            loadFromLocalStorage() {
                const saved = localStorage.getItem('blockchain_ledger');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.transactions = data.transactions || [];
                    this.userPacks = data.userPacks || {};
                }
            }

            save() {
                localStorage.setItem('blockchain_ledger', JSON.stringify({
                    transactions: this.transactions,
                    userPacks: this.userPacks
                }));
            }

            async recordPurchase(userId, packId, price) {
                const transaction = {
                    id: `tx_${Date.now()}_${Math.random().toString(36).substring(2, 11)}`,
                    type: 'PACK_PURCHASE',
                    userId: userId,
                    packId: packId,
                    price: price,
                    timestamp: new Date().toISOString(),
                    blockNumber: this.transactions.length + 1,
                    status: 'confirmed'
                };

                this.transactions.push(transaction);

                if (!this.userPacks[userId]) {
                    this.userPacks[userId] = [];
                }
                this.userPacks[userId].push({
                    packId: packId,
                    purchaseId: transaction.id,
                    opened: false,
                    timestamp: transaction.timestamp
                });

                this.save();
                return transaction;
            }

            getUserPacks(userId) {
                return this.userPacks[userId] || [];
            }

            getTransactionHistory(userId) {
                return this.transactions.filter(tx => tx.userId === userId);
            }
        }

        // Initialize blockchain ledger
        const blockchain = new BlockchainLedger();

        // Wallet state
        let currentWallet = null;
        let currentBalance = 10.0; // Demo balance

        // Initialize wallet
        async function initWallet() {
            if (window.SharedWalletSystem) {
                const wallet = new SharedWalletSystem();
                if (wallet.connected) {
                    currentWallet = wallet.address;
                    updateWalletUI();
                }
            }
        }

        function updateWalletUI() {
            const walletEl = document.getElementById('walletAddress');
            const balanceEl = document.getElementById('balance');

            if (currentWallet) {
                walletEl.textContent = currentWallet.substring(0, 6) + '...' + currentWallet.substring(currentWallet.length - 4);
                balanceEl.textContent = `${currentBalance.toFixed(2)} SOL`;
            } else {
                walletEl.textContent = 'Connect Wallet';
                balanceEl.textContent = '—';
            }
        }

        // Render packs
        function renderPacks() {
            const container = document.getElementById('packsContainer');
            container.innerHTML = '';

            PACK_TYPES.forEach(pack => {
                const packCard = document.createElement('div');
                packCard.className = `pack-card ${pack.theme || pack.rarity}`;
                packCard.innerHTML = `
                    <span class="rarity-badge ${pack.rarity}">${pack.rarity}</span>
                    <div class="pack-3d-viewer" id="pack-viewer-${pack.id}"></div>
                    <div class="pack-info">
                        <h3 class="pack-name">${pack.name}</h3>
                        <p class="pack-description">${pack.description}</p>
                        <div class="pack-stats">
                            <div class="stat">
                                <div class="stat-label">Cards</div>
                                <div class="stat-value">${pack.cards}</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">Legendary</div>
                                <div class="stat-value">${pack.chances.legendary}%</div>
                            </div>
                        </div>
                        <div class="pack-price">${pack.price} SOL</div>
                        <button class="btn btn-primary" onclick="purchasePack('${pack.id}')">
                            Purchase Pack
                        </button>
                    </div>
                `;
                container.appendChild(packCard);

                // Initialize 3D viewer for this pack
                init3DViewer(`pack-viewer-${pack.id}`, pack.theme || pack.rarity, pack);
            });
        }

        // 3D Pack Viewer with parallax
        function init3DViewer(containerId, theme, packData) {
            const container = document.getElementById(containerId);
            if (!container || !window.THREE) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Create pack geometry
            const geometry = new THREE.BoxGeometry(2, 3, 0.5);
            
            // Rarity-based colors (fallback)
            const rarityColors = {
                common: 0x9ca3af,
                rare: 0x3b82f6,
                epic: 0xa855f7,
                legendary: 0xfbbf24
            };

            // Theme-based colors
            const themeColors = {
                disney: 0x4169E1,
                marvel: 0xEC1C24,
                starwars: 0xFFE81F,
                dc: 0x0074E8,
                pixar: 0x1FB6FF,
                classic: 0xFF6B6B,
                scifi: 0x9D4EDD,
                fantasy: 0x7209B7,
                gaming: 0x00F5FF,
                anime: 0xFF006E
            };

            const color = themeColors[theme] || (packData && rarityColors[packData.rarity]) || 0x38bdf8;

            const material = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                shininess: 100
            });

            const pack = new THREE.Mesh(geometry, material);
            scene.add(pack);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(color, 1.5, 100);
            pointLight.position.set(0, 5, 5);
            scene.add(pointLight);

            camera.position.z = 6;

            // Mouse parallax effect
            let mouseX = 0;
            let mouseY = 0;

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            });

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);

                // Slow rotation
                pack.rotation.y += 0.005;

                // Parallax effect
                pack.rotation.x = mouseY * 0.3;
                pack.rotation.y += mouseX * 0.01;

                renderer.render(scene, camera);
            }

            animate();
        }

        // Purchase pack
        async function purchasePack(packId) {
            const pack = PACK_TYPES.find(p => p.id === packId);
            if (!pack) return;

            // Check if wallet connected
            if (!currentWallet) {
                currentWallet = 'demo_' + Math.random().toString(36).substring(2, 11);
            }

            // Check balance
            if (currentBalance < pack.price) {
                alert('Insufficient balance!');
                return;
            }

            // Get the pack card element for animation
            const packCard = event.target.closest('.pack-card');

            // Show purchase modal
            const modal = document.getElementById('purchaseModal');
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <div class="transaction-status">
                    <div class="spinner"></div>
                    <p>Processing purchase...</p>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 8px;">
                        Recording transaction on blockchain
                    </p>
                </div>
            `;
            
            modal.classList.add('active');

            // Simulate blockchain transaction
            setTimeout(async () => {
                try {
                    // Deduct balance
                    currentBalance -= pack.price;
                    updateWalletUI();

                    // Record on blockchain
                    const transaction = await blockchain.recordPurchase(currentWallet, packId, pack.price);

                    // Trigger pack animation
                    if (packCard) {
                        packCard.classList.add('purchasing');
                        
                        // Highlight collection button
                        const collectionBtn = document.querySelector('.nav-item[href="collection.html"]');
                        if (collectionBtn) {
                            collectionBtn.classList.add('collection-highlight');
                            setTimeout(() => {
                                collectionBtn.classList.remove('collection-highlight');
                            }, 1500);
                        }
                    }

                    // Success message
                    modalBody.innerHTML = `
                        <div class="transaction-status" style="background: rgba(74, 222, 128, 0.1);">
                            <div style="font-size: 3rem; margin-bottom: 12px;">✅</div>
                            <h4 style="color: var(--success); margin-bottom: 12px;">Purchase Successful!</h4>
                            <p style="color: var(--text-secondary); margin-bottom: 16px;">
                                ${pack.name} has been added to your collection
                            </p>
                            <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin: 16px 0;">
                                <p style="font-size: 0.85rem; color: var(--text-secondary);">Transaction ID</p>
                                <p style="font-family: monospace; font-size: 0.9rem; color: var(--accent-cyan); word-break: break-all;">
                                    ${transaction.id}
                                </p>
                            </div>
                            <button class="btn btn-primary" onclick="openPack('${packId}', '${transaction.id}')">
                                Open Pack Now
                            </button>
                            <button class="btn btn-secondary" onclick="closePurchaseModal()" style="margin-top: 12px;">
                                Open Later
                            </button>
                        </div>
                    `;
                } catch (error) {
                    modalBody.innerHTML = `
                        <div class="transaction-status" style="background: rgba(248, 113, 113, 0.1);">
                            <div style="font-size: 3rem; margin-bottom: 12px;">❌</div>
                            <h4 style="color: var(--danger);">Transaction Failed</h4>
                            <p style="color: var(--text-secondary);">${error.message}</p>
                            <button class="btn btn-secondary" onclick="closePurchaseModal()" style="margin-top: 16px;">
                                Close
                            </button>
                        </div>
                    `;
                }
            }, 2000);
        }

        function closePurchaseModal() {
            document.getElementById('purchaseModal').classList.remove('active');
        }

        function openPack(packId, transactionId) {
            // Redirect to pack opening page (to be implemented)
            window.location.href = `pack-opening.html?pack=${packId}&tx=${transactionId}`;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initWallet();
            renderPacks();
            updateWalletUI();
        });
    </script>
