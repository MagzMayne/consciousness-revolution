<script>
/*
  Client-only flow using Venmo profile link:
  - btnVenmo opens the Venmo profile (user sends $1 manually)
  - btnRecord records a paid join with txnRef provided by the user
  - Pool cycles when playersNeeded reached. Prepares payout CSV and opens mailto: to barbrickdesign@gmail.com
  - Data persisted in IndexedDB
*/

const VENMO_PROFILE = 'https://venmo.com/u/Rytb333';
const PAYOUT_EMAIL = 'barbrickdesign@gmail.com';
const ENTRY = 1.00;

let pool = { id:'main', balance:0.00, players:[], cycles:0, feesCollected:0.00 };
let players = []; // {id,email,txnRef,earned,pending}
const logEl = document.getElementById('log');
const canvas = document.getElementById('bubble');
const ctx = canvas.getContext('2d');
canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;

function appendLog(msg){
  const ts = new Date().toISOString();
  logEl.textContent = `[${ts}] ${msg}\n` + logEl.textContent;
}
function formatUSD(v){ return `$${Number(v||0).toFixed(2)}`; }

function openVenmo(){
  // Try deep link first; fallback to web URL
  const deep = 'venmo://paycharge?txn=pay&recipients=Rytb333&amount=1&note=Play+to+earn';
  // open deep link (mobile) then fallback
  window.location.href = deep;
  setTimeout(()=> window.open(VENMO_PROFILE, '_blank'), 800);
  appendLog('Opened Venmo for payment (profile). User must send $1 and copy txn id.');
}

async function ensureDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open('p2e-db',1);
    rq.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('players')) db.createObjectStore('players',{keyPath:'id'});
      if(!db.objectStoreNames.contains('pool')) db.createObjectStore('pool',{keyPath:'id'});
    };
    rq.onsuccess = e => res(e.target.result);
    rq.onerror = e => rej(e.target.error);
  });
}
async function dbPut(store, obj){
  const db = await ensureDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = ()=>res(true);
    tx.onerror = e=>rej(e.target.error);
  });
}
async function dbGetAll(store){
  const db = await ensureDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const rq = tx.objectStore(store).getAll();
    rq.onsuccess = e=>res(e.target.result || []);
    rq.onerror = e=>rej(e.target.error);
  });
}
async function dbClear(){
  const db = await ensureDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(['players','pool'],'readwrite');
    tx.objectStore('players').clear();
    tx.objectStore('pool').clear();
    tx.oncomplete = ()=>res(true);
    tx.onerror = e=>rej(e.target.error);
  });
}

function renderPlayers(){
  const wrap = document.getElementById('playersWrap');
  if(players.length===0) { wrap.innerHTML = '<div class="small">No players yet.</div>'; return; }
  let html = '<table><thead><tr><th>id</th><th>email</th><th>txnRef</th><th>earned</th><th>pending</th></tr></thead><tbody>';
  players.forEach(p=>{
    html += `<tr><td>${p.id}</td><td>${p.email}</td><td>${p.txnRef||''}</td><td>${formatUSD(p.earned||0)}</td><td>${p.pending? 'yes':'no'}</td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  drawBubbles();
  document.getElementById('playersWrap').scrollIntoView({behavior:'smooth'});
}

function drawBubbles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx = canvas.width*0.25, cy = canvas.height/2;
  const poolR = 40 + Math.min(120, pool.balance * 10);
  ctx.beginPath(); ctx.fillStyle='#dbeeff'; ctx.strokeStyle='#9fc6ff'; ctx.arc(cx,cy,poolR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#0b69ff'; ctx.font='600 14px sans-serif'; ctx.fillText(`Pool ${formatUSD(pool.balance)}`, cx-poolR+10, cy);
  // players on right
  const startX = canvas.width*0.6; const gapY = canvas.height / Math.max(1, players.length+1);
  players.forEach((p,i)=>{
    const px = startX; const py = gapY*(i+1);
    const r = 18 + Math.min(40, (p.earned||0)*10);
    ctx.beginPath(); ctx.fillStyle='#fff'; ctx.strokeStyle='#cfe8ff'; ctx.arc(px,py,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#0b69ff'; ctx.font='600 12px sans-serif'; ctx.fillText(p.id.substring(0,6), px-10, py+4);
    if(p.pending) { ctx.beginPath(); ctx.strokeStyle='#f59e0b'; ctx.moveTo(px-r-4,py); ctx.lineTo(cx+poolR+4,cy); ctx.stroke(); }
  });
}

/* join flow when user reports they've paid */
async function recordPayment(){
  const email = document.getElementById('userEmail').value.trim();
  const txn = document.getElementById('txnRef').value.trim();
  if(!email){ alert('Enter your email (for record).'); return; }
  if(!txn){ if(!confirm('No txn reference provided. Continue recording as paid?')) return; }
  const id = email + '-' + Math.random().toString(36).slice(2,6);
  const p = { id, email, txnRef: txn || null, earned:0.00, pending:true };
  players.push(p);
  await dbPut('players', p);
  pool.players.push(p.id);
  pool.balance = +(pool.balance + ENTRY).toFixed(2);
  await dbPut('pool', pool);
  appendLog(`Recorded paid join ${p.id} (txn ${txn||'n/a'}). Pool ${formatUSD(pool.balance)}.`);
  renderPlayers();
  tryRunCycle();
}

/* When playersNeeded reached, create payouts and email admin */
async function tryRunCycle(){
  const need = Number(document.getElementById('playersNeeded').value || 5);
  if(pool.players.length < need){
    appendLog(`Waiting for players: ${pool.players.length}/${need}.`);
    return;
  }
  // simple distribution: available pool minus fee (10%) => even split
  const feePct = 10;
  const available = +(pool.balance * (1 - feePct/100)).toFixed(2);
  const per = +(available / pool.players.length).toFixed(2);
  appendLog(`Cycle: ${pool.players.length} players. Pool ${formatUSD(pool.balance)}; avail ${formatUSD(available)}; per player ${formatUSD(per)}.`);
  // assign earnings and create payout CSV
  const allPlayers = await dbGetAll('players');
  const payoutRows = [];
  for(const pid of pool.players){
    const p = allPlayers.find(x=>x.id===pid);
    if(!p) continue;
    p.earned = +(p.earned + per).toFixed(2);
    p.pending = true;
    await dbPut('players', p);
    payoutRows.push({ id: p.id, email: p.email || '', amount: per.toFixed(2), txnRef: p.txnRef || '' });
  }
  pool.cycles = (pool.cycles || 0) + 1;
  pool.balance = +(pool.balance - available).toFixed(2);
  pool.feesCollected = +(pool.feesCollected + (available * feePct/100)).toFixed(2);
  pool.players = [];
  await dbPut('pool', pool);
  appendLog(`Prepared ${payoutRows.length} payouts. Pool left ${formatUSD(pool.balance)}. Composing email to admin.`);
  // compose CSV and mailto:
  const csvLines = ['playerId,email,amount,txnRef'];
  payoutRows.forEach(r => csvLines.push([r.id,r.email,r.amount,r.txnRef].map(s=>String(s).replace(/"/g,'""')).join(',')));
  const body = [
    `Payout request — cycle ${pool.cycles}`,
    `Pool id: ${pool.id}`,
    `Pool balance after payouts: ${formatUSD(pool.balance)}`,
    `Fee percent: ${feePct}%`,
    '',
    'CSV:',
    csvLines.join('\n'),
    '',
    'Please process payouts and confirm. After processing, use admin action to clear pending flags.'
  ].join('\n\n');
  const subject = encodeURIComponent(`Payout Request — pool ${pool.id} cycle ${pool.cycles}`);
  const mailto = `mailto:${PAYOUT_EMAIL}?subject=${subject}&body=${encodeURIComponent(body)}`;
  // open mail client
  window.location.href = mailto;
  appendLog('Opened mail client with payout CSV (mailto). Admin: ' + PAYOUT_EMAIL);
  renderPlayers();
}

/* admin helper: clear pending flags after payouts processed */
async function clearPending(){
  const all = await dbGetAll('players');
  for(const p of all){ if(p.pending){ p.pending = false; p.earned = 0; await dbPut('players', p); } }
  pool.feesCollected = 0;
  await dbPut('pool', pool);
  appendLog('Cleared pending flags and reset earned for all players (admin).');
  players = await dbGetAll('players'); renderPlayers();
}

/* load persisted state */
async function load(){
  const ps = await dbGetAll('pool');
  if(ps.length) pool = ps[0];
  players = await dbGetAll('players');
  document.getElementById('userEmail').value = '';
  document.getElementById('txnRef').value = '';
  renderPlayers();
  appendLog('Loaded state. Pool ' + formatUSD(pool.balance) + ', players ' + players.length);
}

/* clear DB */
async function clearAll(){
  if(!confirm('Clear local data?')) return;
  await dbClear();
  pool = { id:'main', balance:0.00, players:[], cycles:0, feesCollected:0.00 };
  players = [];
  await dbPut('pool', pool);
  appendLog('Cleared local DB.');
  renderPlayers();
}

/* wire buttons */
document.getElementById('btnVenmo').addEventListener('click', openVenmo);
document.getElementById('btnRecord').addEventListener('click', recordPayment);
document.getElementById('btnEmailPayout').addEventListener('click', tryRunCycle);
document.getElementById('btnClear').addEventListener('click', clearAll);

// expose admin functions in console
window.__p2e = { clearPending, tryRunCycle, load, openVenmo };

load();
</script>
