<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-5049271F">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Domains | Consciousness Revolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            height: 100dvh; /* dynamic viewport height — prevents mobile browser chrome from cutting off content */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .domain-nav {
            display: flex;
            background: linear-gradient(180deg, #1a1a2e 0%, #16162a 100%);
            border-bottom: 2px solid #333;
            padding: 0;
            height: 60px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .domain-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #333;
            text-decoration: none;
            color: #888;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .domain-tab:last-child {
            border-right: none;
        }

        .domain-tab:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .domain-tab.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .domain-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--domain-color, #00d4ff);
        }

        .domain-tab .icon {
            font-size: 20px;
        }

        .domain-tab .label {
            display: block;
        }

        /* Domain-specific colors */
        .domain-tab[data-domain="command"] { --domain-color: #ff6b35; }
        .domain-tab[data-domain="build"] { --domain-color: #00d4ff; }
        .domain-tab[data-domain="connect"] { --domain-color: #a855f7; }
        .domain-tab[data-domain="protect"] { --domain-color: #22c55e; }
        .domain-tab[data-domain="grow"] { --domain-color: #fbbf24; }
        .domain-tab[data-domain="learn"] { --domain-color: #3b82f6; }
        .domain-tab[data-domain="transcend"] { --domain-color: #f472b6; }

        .domain-tab.active[data-domain="command"] { color: #ff6b35; }
        .domain-tab.active[data-domain="build"] { color: #00d4ff; }
        .domain-tab.active[data-domain="connect"] { color: #a855f7; }
        .domain-tab.active[data-domain="protect"] { color: #22c55e; }
        .domain-tab.active[data-domain="grow"] { color: #fbbf24; }
        .domain-tab.active[data-domain="learn"] { color: #3b82f6; }
        .domain-tab.active[data-domain="transcend"] { color: #f472b6; }

        /* Main content area - must fill remaining viewport height */
        main {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Dashboard Container */
        .dashboard-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .dashboard-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a0f;
        }

        /* Loading State */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .domain-nav {
                height: 50px;
            }

            .domain-tab {
                padding: 8px 4px;
                flex-direction: column;
                gap: 2px;
            }

            .domain-tab .icon {
                font-size: 18px;
            }

            .domain-tab .label {
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .domain-tab .label {
                display: none;
            }

            .domain-tab .icon {
                font-size: 22px;
            }
        }

        /* Keyboard shortcut hint */
        .shortcut-hint {
            position: fixed;
            bottom: 60px; /* raised above the beta-banner footer injected by cockpit pages */
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            z-index: 1000;
        }

        .shortcut-hint kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
        }

        /* Accessibility */
        *:focus-visible { outline: 2px solid #00d4ff; outline-offset: 2px; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <h1 class="visually-hidden" id="page-title">Seven Domains Hub</h1>
    <!-- 7 Domain Navigation -->
    <nav class="domain-nav" role="navigation" aria-label="Domain navigation">
        <a class="domain-tab active" data-domain="command" data-index="0" href="#command">
            <span class="icon">🎯</span>
            <span class="label">COMMAND</span>
        </a>
        <a class="domain-tab" data-domain="build" data-index="1" href="#build">
            <span class="icon">🔨</span>
            <span class="label">BUILD</span>
        </a>
        <a class="domain-tab" data-domain="connect" data-index="2" href="#connect">
            <span class="icon">🤝</span>
            <span class="label">CONNECT</span>
        </a>
        <a class="domain-tab" data-domain="protect" data-index="3" href="#protect">
            <span class="icon">⚖️</span>
            <span class="label">PROTECT</span>
        </a>
        <a class="domain-tab" data-domain="grow" data-index="4" href="#grow">
            <span class="icon">💰</span>
            <span class="label">GROW</span>
        </a>
        <a class="domain-tab" data-domain="learn" data-index="5" href="#learn">
            <span class="icon">📚</span>
            <span class="label">LEARN</span>
        </a>
        <a class="domain-tab" data-domain="transcend" data-index="6" href="#transcend">
            <span class="icon">✨</span>
            <span class="label">TRANSCEND</span>
        </a>
    </nav>

    <!-- Dashboard Display Area -->
    <main role="main" aria-labelledby="page-title">
    <div class="dashboard-container">
        <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
            <div class="loading-spinner"></div>
        </div>
        <iframe class="dashboard-frame" id="dashboardFrame" src="COMMANDER_COCKPIT.html" title="Domain dashboard content"></iframe>
    </div>
    </main>

    <!-- Keyboard shortcut hint -->
    <div class="shortcut-hint">
        <kbd>1</kbd>-<kbd>7</kbd> Switch domains | <kbd>←</kbd><kbd>→</kbd> Navigate
    </div>

    <script>
        // Auth guard: redirect to login if not authenticated
        (function() {
            var isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            var currentUser = localStorage.getItem('currentUser');
            if (!isLoggedIn || !currentUser) {
                localStorage.setItem('authRedirect', window.location.href);
                window.location.replace('login.html');
            }
        })();

        // Domain to Dashboard mapping
        const domainDashboards = {
            command: 'COMMANDER_COCKPIT.html',
            build: 'BUILDER_COCKPIT.html',
            connect: 'TEAM_DASHBOARD_HUB.html',
            protect: 'LEGAL_COCKPIT.html',
            grow: 'GROWTH_COCKPIT.html',
            learn: 'LEARNING_COCKPIT.html',
            transcend: 'CONSCIOUSNESS_COCKPIT.html'
        };

        const tabs = document.querySelectorAll('.domain-tab');
        const frame = document.getElementById('dashboardFrame');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let currentIndex = 0;

        // Switch to a domain
        function switchDomain(domain) {
            const dashboardUrl = domainDashboards[domain];
            if (!dashboardUrl) return;

            // Update active tab
            tabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.domain === domain);
                if (tab.dataset.domain === domain) {
                    currentIndex = parseInt(tab.dataset.index);
                }
            });

            // Show loading
            loadingOverlay.classList.remove('hidden');

            // Load dashboard
            frame.src = dashboardUrl;

            // Update URL hash
            window.location.hash = domain;
        }

        // Tab click handlers
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                switchDomain(tab.dataset.domain);
            });
        });

        // Frame load complete
        frame.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
            suppressIframeFooters(frame);
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            // Number keys 1-7
            if (e.key >= '1' && e.key <= '7') {
                const index = parseInt(e.key) - 1;
                const domains = Object.keys(domainDashboards);
                if (domains[index]) {
                    switchDomain(domains[index]);
                }
            }

            // Arrow keys
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                const domains = Object.keys(domainDashboards);
                currentIndex = (currentIndex + 1) % domains.length;
                switchDomain(domains[currentIndex]);
            }

            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                const domains = Object.keys(domainDashboards);
                currentIndex = (currentIndex - 1 + domains.length) % domains.length;
                switchDomain(domains[currentIndex]);
            }
        });

        // Touch swipe support
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            // Horizontal swipe (minimum 50px)
            if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
                const domains = Object.keys(domainDashboards);
                if (diffX > 0) {
                    // Swipe left - next domain
                    currentIndex = (currentIndex + 1) % domains.length;
                } else {
                    // Swipe right - previous domain
                    currentIndex = (currentIndex - 1 + domains.length) % domains.length;
                }
                switchDomain(domains[currentIndex]);
            }
        });

        // Handle URL hash on load
        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash && domainDashboards[hash]) {
                switchDomain(hash);
            } else {
                loadingOverlay.classList.add('hidden');
                suppressIframeFooters(frame);
            }
        });

        // Suppress fixed footer widgets injected by cockpit pages (beta-banner, donation button,
        // rootib badge) so they don't cover content when rendered inside the hub iframe.
        function suppressIframeFooters(iframeEl) {
            try {
                const doc = iframeEl.contentDocument || iframeEl.contentWindow.document;
                if (!doc || !doc.head) return;
                const styleId = 'hub-iframe-footer-suppress';
                if (doc.getElementById(styleId)) return; // already injected
                const style = doc.createElement('style');
                style.id = styleId;
                style.textContent = [
                    '/* Hub: hide fixed footer widgets that cover content inside the iframe */',
                    '#beta-maturity-banner { display: none !important; }',
                    '#barbrick-donation-btn { display: none !important; }',
                    '#rootib-provenance-badge { display: none !important; }',
                ].join('\n');
                doc.head.appendChild(style);
            } catch (e) {
                // Silently ignore cross-origin SecurityError — nothing to do for external frames.
                // Log any other unexpected error for debugging.
                if (e.name !== 'SecurityError') {
                    console.warn('[Hub] suppressIframeFooters unexpected error:', e);
                }
            }
        }

        // Hide shortcut hint on mobile
        if ('ontouchstart' in window) {
            document.querySelector('.shortcut-hint').style.display = 'none';
        }
    </script>
  <script src="/js/mesh-engine-client.js"></script>
  <!-- Face auth client — enables face enrollment prompt for logged-in users -->
  <script src="/js/face-auth-client.js" defer></script>
  <script>
    // After page loads, check if the user has a face enrolled.
    // If not, show a one-time banner inviting them to enroll.
    document.addEventListener('crAuthReady', async function(e) {
      if (!e.detail || !e.detail.isLoggedIn) return;
      // Only check once per session
      if (sessionStorage.getItem('cr_face_enroll_checked')) return;
      sessionStorage.setItem('cr_face_enroll_checked', '1');

      try {
        const isEnrolled = await window.FaceAuthClient?.isEnrolled?.();
        if (isEnrolled) return; // already enrolled — nothing to do

        const banner = document.createElement('div');
        banner.id = 'face-enroll-banner';
        banner.setAttribute('role', 'alert');
        banner.style.cssText = [
          'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);',
          'background:rgba(10,12,20,.95);border:1px solid rgba(15,245,224,.4);',
          'border-radius:12px;padding:14px 20px;z-index:9990;',
          'font-family:\'Share Tech Mono\',monospace;font-size:.82rem;color:#e0e0e0;',
          'display:flex;align-items:center;gap:12px;max-width:min(500px,92vw);',
          'box-shadow:0 4px 24px rgba(0,0,0,.6);'
        ].join('');
        banner.innerHTML = [
          '<span aria-hidden="true" style="font-size:1.4rem;">🙂</span>',
          '<span>Enable <strong style="color:#0ff5e0;">face login</strong> for one-tap sign-in across all dashboards.</span>',
          '<button id="face-enroll-yes" style="',
            'background:linear-gradient(135deg,#0ff5e0,#39ff14);color:#0a0a0c;',
            'border:none;border-radius:20px;padding:6px 14px;font-weight:700;cursor:pointer;',
            'white-space:nowrap;font-family:inherit;">Set Up</button>',
          '<button id="face-enroll-no" aria-label="Dismiss face enrollment prompt" style="',
            'background:none;border:none;color:#9ca3af;cursor:pointer;font-size:1.1rem;">✕</button>'
        ].join('');
        document.body.appendChild(banner);

        document.getElementById('face-enroll-no').addEventListener('click', () => {
          banner.remove();
          localStorage.setItem('cr_face_enroll_dismissed', '1');
        });

        document.getElementById('face-enroll-yes').addEventListener('click', () => {
          banner.remove();
          if (!window.FaceAuthClient) return;
          window.FaceAuthClient.renderModal(document.body, {
            mode: 'enroll',
            onSuccess: () => {
              const note = document.createElement('div');
              note.textContent = '✓ Face enrolled! You can now sign in by face.';
              note.style.cssText = [
                'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);',
                'background:rgba(10,20,10,.95);border:1px solid #39ff14;border-radius:10px;',
                'padding:12px 20px;color:#39ff14;font-family:\'Share Tech Mono\',monospace;',
                'font-size:.85rem;z-index:9990;'
              ].join('');
              document.body.appendChild(note);
              setTimeout(() => note.remove(), 3500);
            }
          });
        });

        // Auto-hide after 15 seconds
        setTimeout(() => { if (banner.parentNode) banner.remove(); }, 15000);
      } catch (err) {
        console.warn('[Hub] face enroll check failed:', err.message);
      }
    });
  </script>
</body>
