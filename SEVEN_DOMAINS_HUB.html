<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="rootib" content="RootIB: RB-20260224204034-5049271F">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Domains | Consciousness Revolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .domain-nav {
            display: flex;
            background: linear-gradient(180deg, #1a1a2e 0%, #16162a 100%);
            border-bottom: 2px solid #333;
            padding: 0;
            height: 60px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .domain-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #333;
            text-decoration: none;
            color: #888;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .domain-tab:last-child {
            border-right: none;
        }

        .domain-tab:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .domain-tab.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .domain-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--domain-color, #00d4ff);
        }

        .domain-tab .icon {
            font-size: 20px;
        }

        .domain-tab .label {
            display: block;
        }

        /* Domain-specific colors */
        .domain-tab[data-domain="command"] { --domain-color: #ff6b35; }
        .domain-tab[data-domain="build"] { --domain-color: #00d4ff; }
        .domain-tab[data-domain="connect"] { --domain-color: #a855f7; }
        .domain-tab[data-domain="protect"] { --domain-color: #22c55e; }
        .domain-tab[data-domain="grow"] { --domain-color: #fbbf24; }
        .domain-tab[data-domain="learn"] { --domain-color: #3b82f6; }
        .domain-tab[data-domain="transcend"] { --domain-color: #f472b6; }

        .domain-tab.active[data-domain="command"] { color: #ff6b35; }
        .domain-tab.active[data-domain="build"] { color: #00d4ff; }
        .domain-tab.active[data-domain="connect"] { color: #a855f7; }
        .domain-tab.active[data-domain="protect"] { color: #22c55e; }
        .domain-tab.active[data-domain="grow"] { color: #fbbf24; }
        .domain-tab.active[data-domain="learn"] { color: #3b82f6; }
        .domain-tab.active[data-domain="transcend"] { color: #f472b6; }

        /* Dashboard Container */
        .dashboard-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .dashboard-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a0f;
        }

        /* Loading State */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .domain-nav {
                height: 50px;
            }

            .domain-tab {
                padding: 8px 4px;
                flex-direction: column;
                gap: 2px;
            }

            .domain-tab .icon {
                font-size: 18px;
            }

            .domain-tab .label {
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .domain-tab .label {
                display: none;
            }

            .domain-tab .icon {
                font-size: 22px;
            }
        }

        /* Keyboard shortcut hint */
        .shortcut-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            z-index: 1000;
        }

        .shortcut-hint kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <!-- 7 Domain Navigation -->
    <nav class="domain-nav">
        <a class="domain-tab active" data-domain="command" data-index="0" href="#command">
            <span class="icon">🎯</span>
            <span class="label">COMMAND</span>
        </a>
        <a class="domain-tab" data-domain="build" data-index="1" href="#build">
            <span class="icon">🔨</span>
            <span class="label">BUILD</span>
        </a>
        <a class="domain-tab" data-domain="connect" data-index="2" href="#connect">
            <span class="icon">🤝</span>
            <span class="label">CONNECT</span>
        </a>
        <a class="domain-tab" data-domain="protect" data-index="3" href="#protect">
            <span class="icon">⚖️</span>
            <span class="label">PROTECT</span>
        </a>
        <a class="domain-tab" data-domain="grow" data-index="4" href="#grow">
            <span class="icon">💰</span>
            <span class="label">GROW</span>
        </a>
        <a class="domain-tab" data-domain="learn" data-index="5" href="#learn">
            <span class="icon">📚</span>
            <span class="label">LEARN</span>
        </a>
        <a class="domain-tab" data-domain="transcend" data-index="6" href="#transcend">
            <span class="icon">✨</span>
            <span class="label">TRANSCEND</span>
        </a>
    </nav>

    <!-- Dashboard Display Area -->
    <div class="dashboard-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
        </div>
        <iframe class="dashboard-frame" id="dashboardFrame" src="COMMANDER_COCKPIT.html"></iframe>
    </div>

    <!-- Keyboard shortcut hint -->
    <div class="shortcut-hint">
        <kbd>1</kbd>-<kbd>7</kbd> Switch domains | <kbd>←</kbd><kbd>→</kbd> Navigate
    </div>

    <script>
        // Domain to Dashboard mapping
        const domainDashboards = {
            command: 'COMMANDER_COCKPIT.html',
            build: 'BUILDER_COCKPIT.html',
            connect: 'TEAM_DASHBOARD_HUB.html',
            protect: 'LEGAL_COCKPIT.html',
            grow: 'GROWTH_DASHBOARD.html',
            learn: 'BRAIN_QUERY_DASHBOARD.html',
            transcend: 'CONSCIOUSNESS_DASHBOARD.html'
        };

        const tabs = document.querySelectorAll('.domain-tab');
        const frame = document.getElementById('dashboardFrame');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let currentIndex = 0;

        // Switch to a domain
        function switchDomain(domain) {
            const dashboardUrl = domainDashboards[domain];
            if (!dashboardUrl) return;

            // Update active tab
            tabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.domain === domain);
                if (tab.dataset.domain === domain) {
                    currentIndex = parseInt(tab.dataset.index);
                }
            });

            // Show loading
            loadingOverlay.classList.remove('hidden');

            // Load dashboard
            frame.src = dashboardUrl;

            // Update URL hash
            window.location.hash = domain;
        }

        // Tab click handlers
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                switchDomain(tab.dataset.domain);
            });
        });

        // Frame load complete
        frame.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            // Number keys 1-7
            if (e.key >= '1' && e.key <= '7') {
                const index = parseInt(e.key) - 1;
                const domains = Object.keys(domainDashboards);
                if (domains[index]) {
                    switchDomain(domains[index]);
                }
            }

            // Arrow keys
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                const domains = Object.keys(domainDashboards);
                currentIndex = (currentIndex + 1) % domains.length;
                switchDomain(domains[currentIndex]);
            }

            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                const domains = Object.keys(domainDashboards);
                currentIndex = (currentIndex - 1 + domains.length) % domains.length;
                switchDomain(domains[currentIndex]);
            }
        });

        // Touch swipe support
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            // Horizontal swipe (minimum 50px)
            if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
                const domains = Object.keys(domainDashboards);
                if (diffX > 0) {
                    // Swipe left - next domain
                    currentIndex = (currentIndex + 1) % domains.length;
                } else {
                    // Swipe right - previous domain
                    currentIndex = (currentIndex - 1 + domains.length) % domains.length;
                }
                switchDomain(domains[currentIndex]);
            }
        });

        // Handle URL hash on load
        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash && domainDashboards[hash]) {
                switchDomain(hash);
            } else {
                loadingOverlay.classList.add('hidden');
            }
        });

        // Hide shortcut hint on mobile
        if ('ontouchstart' in window) {
            document.querySelector('.shortcut-hint').style.display = 'none';
        }
    </script>
</body>
</html>
