/* UI elements */
const ui = {
  toggle: document.getElementById('merlinToggle'),
  panel: document.getElementById('merlinPanel'),
  filter: document.getElementById('merlinFilter'),
  pageSize: document.getElementById('merlinPageSize'),
  refresh: document.getElementById('merlinRefresh'),
  close: document.getElementById('merlinClose'),
  grid: document.getElementById('merlinGrid'),
  prev: document.getElementById('prevPage'),
  next: document.getElementById('nextPage'),
  pageInfo: document.getElementById('pageInfo'),
  cacheStatus: document.getElementById('cacheStatus'),
  snapshotStatus: document.getElementById('snapshotStatus'),
};

/* Open/close overlay */
ui.toggle.addEventListener('click', () => ui.panel.classList.toggle('open'));
ui.close.addEventListener('click', () => ui.panel.classList.remove('open'));

/* Fetch with timeout */
function fetchJSON(url, timeout = 20000) {
  return new Promise((resolve, reject) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => { ctrl.abort(); reject(new Error('timeout')); }, timeout);
    fetch(url, { signal: ctrl.signal, headers: { 'Accept': 'application/vnd.github+json' } })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('http '+r.status)))
      .then(j => { clearTimeout(t); resolve(j); })
      .catch(err => { clearTimeout(t); reject(err); });
  });
}

/* Crawl repo for .html files */
async function listHtmlFiles() {
  try {
    const tree = await fetchJSON(API_TREE, 25000);
    const files = (tree.tree || [])
      .filter(n => n.type === 'blob' && n.path.toLowerCase().endsWith('.html'))
      .map(n => n.path);
    return files;
  } catch (e) {
    console.warn('Tree fetch failed, using snapshot if present', e);
    const snap = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
    return snap.map(x => x.path);
  }
}

/* Extract metadata: title, first image for tags; live and raw URLs */
async function enrichPage(path) {
  const rawUrl = `${RAW_BASE}/${path}`;
  const liveUrl = `${LIVE_BASE}/${path.replace('index.html','')}`;
  let title = path.split('/').slice(-1)[0];
  let tags = [];
  try {
    const html = await fetch(rawUrl).then(r => r.ok ? r.text() : '');
    const tMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
    if (tMatch) title = tMatch[1].trim();
    const metaTags = [...html.matchAll(/<meta[^>]+name=["']?keywords["']?[^>]+content=["']([^"']+)["']/ig)]
      .map(m => m[1].split(',').map(x => x.trim())).flat();
    tags = metaTags.slice(0, 5);
  } catch (e) {}
  return { path, title, liveUrl, rawUrl, tags };
}

/* Build a single card HTML with a scaled iframe preview */
function cardHTML(item, scale) {
  const previewStyle = `transform: scale(${scale}); width:${MAX_IFRAME_WIDTH}px; height:${MAX_IFRAME_HEIGHT}px;`;
  return `
    <div class="merlin-card" role="listitem" data-title="${item.title.toLowerCase()}" data-path="${item.path.toLowerCase()}">
      <div class="merlin-thumb">
        <div class="loading">Loading preview…</div>
        <iframe class="preview-frame" sandbox="allow-scripts allow-same-origin"
          src="${item.liveUrl}" style="${previewStyle}" title="Preview of ${item.title}"></iframe>
      </div>
      <div class="merlin-body">
        <div class="merlin-name">${item.title}</div>
        <div class="merlin-path">${item.path}</div>
        <div class="merlin-tags">${(item.tags||[]).map(t=>`<span class="merlin-tag">${t}</span>`).join('')}</div>
        <div class="merlin-actions-row">
          <a class="merlin-link" href="${item.liveUrl}" target="_blank" rel="noopener">Open</a>
          <a class="merlin-link" href="${item.rawUrl}" target="_blank" rel="noopener">Raw</a>
          <button class="merlin-link" data-copy="${item.liveUrl}">Copy URL</button>
        </div>
      </div>
    </div>
  `;
}

/* Compute preview scale to fit iframe within thumb */
function computeScale() {
  const thumbH = 180;
  const thumbW = 280; // approx card width column; used for scale calculation
  const sx = thumbW / MAX_IFRAME_WIDTH;
  const sy = thumbH / MAX_IFRAME_HEIGHT;
  return Math.min(sx, sy);
}

/* Render paginated grid and wire copy buttons + hide loader on load */
function renderGrid(items, page, pageSize) {
  const start = page * pageSize;
  const slice = items.slice(start, start + pageSize);
  const scale = computeScale();
  ui.grid.innerHTML = slice.map(it => cardHTML(it, scale)).join('');

  // Hide loader when iframe loads
  ui.grid.querySelectorAll('.merlin-card').forEach(card => {
    const iframe = card.querySelector('.preview-frame');
    const loader = card.querySelector('.loading');
    iframe.addEventListener('load', () => {
      loader.style.display = 'none';
    });
  });

  // Copy URL buttons
  ui.grid.querySelectorAll('button[data-copy]').forEach(b => {
    b.addEventListener('click', () => {
      const url = b.getAttribute('data-copy');
      navigator.clipboard.writeText(url).then(() => {
        b.textContent = 'Copied';
        setTimeout(() => b.textContent = 'Copy URL', 1200);
      });
    });
  });
}

/* Filter and pagination state */
let allEntries = [];
let filteredEntries = [];
let currentPage = 0;

function updatePageInfo(total, page, pageSize) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  ui.pageInfo.textContent = `Page ${Math.min(page+1, pages)} / ${pages}`;
  ui.prev.disabled = page <= 0;
  ui.next.disabled = page >= pages - 1;
}

function applyFilter() {
  const q = ui.filter.value.trim().toLowerCase();
  filteredEntries = allEntries.filter(x =>
    x.title.toLowerCase().includes(q) || x.path.toLowerCase().includes(q)
  );
  currentPage = 0;
  const pageSize = parseInt(ui.pageSize.value, 10);
  renderGrid(filteredEntries, currentPage, pageSize);
  updatePageInfo(filteredEntries.length, currentPage, pageSize);
}

/* Snapshot saving */
function saveSnapshot(entries) {
  localStorage.setItem(SNAP_KEY, JSON.stringify(entries));
  ui.snapshotStatus.textContent = `Snapshot: ${entries.length} pages`;
  ui.snapshotStatus.classList.add('ok');
}

/* Boot: use embedded snapshot, optionally refresh from API */
async function boot(forceRefresh = false) {
  // Always start with embedded snapshot for instant display
  if (!forceRefresh && EMBEDDED_SNAPSHOT.length > 0) {
    allEntries = EMBEDDED_SNAPSHOT;
    filteredEntries = EMBEDDED_SNAPSHOT.slice();
    const pageSize = parseInt(ui.pageSize.value, 10);
    renderGrid(filteredEntries, currentPage, pageSize);
    updatePageInfo(filteredEntries.length, currentPage, pageSize);
    ui.snapshotStatus.textContent = `Snapshot: ${EMBEDDED_SNAPSHOT.length} pages (embedded)`;
    ui.snapshotStatus.classList.add('ok');
    return;
  }
  
  // Try to refresh from API if forced
  ui.snapshotStatus.textContent = 'Refreshing from API…';
  try {
    const paths = await listHtmlFiles();
    const entries = [];
    for (const p of paths) {
      // Skip typical build artifacts or hidden dirs if present
      if (p.startsWith('node_modules') || p.startsWith('dist/') || p.startsWith('build/')) continue;
      entries.push(await enrichPage(p));
    }
    allEntries = entries;
    filteredEntries = entries.slice();
    const pageSize = parseInt(ui.pageSize.value, 10);
    renderGrid(filteredEntries, currentPage, pageSize);
    updatePageInfo(filteredEntries.length, currentPage, pageSize);
    saveSnapshot(entries);
  } catch (e) {
    console.warn('Failed to refresh from API, using embedded snapshot', e);
    ui.snapshotStatus.textContent = 'Using embedded snapshot';
    ui.snapshotStatus.classList.add('warn');
  }
}

/* Events */
ui.refresh.addEventListener('click', () => boot(true));
ui.pageSize.addEventListener('change', applyFilter);
ui.filter.addEventListener('input', applyFilter);
ui.prev.addEventListener('click', () => {
  const pageSize = parseInt(ui.pageSize.value, 10);
  currentPage = Math.max(0, currentPage - 1);
  renderGrid(filteredEntries, currentPage, pageSize);
  updatePageInfo(filteredEntries.length, currentPage, pageSize);
});
ui.next.addEventListener('click', () => {
  const pageSize = parseInt(ui.pageSize.value, 10);
  const pages = Math.max(1, Math.ceil(filteredEntries.length / pageSize));
  currentPage = Math.min(pages - 1, currentPage + 1);
  renderGrid(filteredEntries, currentPage, pageSize);
  updatePageInfo(filteredEntries.length, currentPage, pageSize);
});

/* Service Worker for offline caching - optional enhancement */
(function registerSW(){
  if (!('serviceWorker' in navigator)) {
    ui.cacheStatus.textContent = 'Offline cache: Not available';
    ui.cacheStatus.classList.remove('ok', 'warn');
    return;
  }
  
  // Skip service worker in development (localhost)
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    ui.cacheStatus.textContent = 'Offline cache: Dev mode';
    ui.cacheStatus.classList.remove('ok', 'warn');
    return;
  }
  
  const swCode = `
    const CACHE = 'merlin-gallery-v1';
    const ORIGINS = [
      '${LIVE_BASE}',
      'https://raw.githubusercontent.com',
      'https://api.github.com'
    ];
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      const url = new URL(e.request.url);
      if (ORIGINS.some(origin => url.origin.startsWith(origin))) {
        e.respondWith((async () => {
          const cache = await caches.open(CACHE);
          const cached = await cache.match(e.request);
          if (cached) return cached;
          try {
            const res = await fetch(e.request);
            if (res.ok && e.request.method === 'GET') {
              cache.put(e.request, res.clone());
            }
            return res;
          } catch (err) {
            return cached || new Response('Offline', { status: 503 });
          }
        })());
      }
    });
  `;
  const blob = new Blob([swCode], { type: 'text/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).then(() => {
    ui.cacheStatus.textContent = 'Offline cache: Ready';
    ui.cacheStatus.classList.add('ok');
  }).catch(() => {
    ui.cacheStatus.textContent = 'Offline cache: Disabled';
    ui.cacheStatus.classList.remove('ok', 'warn');
  });
})();

/* Start: Load immediately with embedded snapshot */
(async function start(){
  await boot();
})();
</script>
