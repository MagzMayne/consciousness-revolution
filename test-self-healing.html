  <h1>🔧 Self-Healing Script Test</h1>
  
  <div id="status" class="status">
    <strong>Status:</strong> <span id="statusText">Initializing...</span>
  </div>

    <button onclick="testManualHeal()">Run Manual Heal</button>

    <button onclick="showState()">Show State</button>
  </div>

  <div>
    <h2>Metrics</h2>
    <div id="metrics" class="status ok">
      <div><strong>Healing Runs:</strong> <span id="healingRuns">0</span></div>
      <div><strong>Evaluation Runs:</strong> <span id="evalRuns">0</span></div>
      <div><strong>Healing Failures:</strong> <span id="healingFailures">0</span></div>
      <div><strong>Recovery Attempts:</strong> <span id="recoveryAttempts">0</span></div>
      <div><strong>Listeners Attached:</strong> <span id="listenersCount">0</span></div>
      <div><strong>Quarantine Items:</strong> <span id="quarantineCount">0</span></div>
      <div><strong>Device Type:</strong> <span id="deviceType">unknown</span></div>
      <div><strong>Dependencies:</strong> <span id="depsStatus">checking...</span></div>
      <div><strong>Version:</strong> <span id="version">-</span></div>
    </div>
  </div>

  <div>
    <h2>Console Log</h2>
    <div id="log"></div>
  </div>

  <!-- Include the self-healing script -->
  <script src="/self-healing.js"></script>

  <script>
    // Test script
    const statusDiv = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const logDiv = document.getElementById('log');
    
    // Override console.log to capture logs
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;
    
    function addLogEntry(type, message) {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${type.toUpperCase()}: ${message}`;
      logDiv.insertBefore(entry, logDiv.firstChild);
      
      // Keep only last 50 entries
      while (logDiv.children.length > 50) {
        logDiv.removeChild(logDiv.lastChild);
      }
    }
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      addLogEntry('info', args.join(' '));
    };
    
    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLogEntry('warn', args.join(' '));
    };
    
    console.error = function(...args) {
      originalError.apply(console, args);
      addLogEntry('error', args.join(' '));
    };

    // Update metrics periodically
    function updateMetrics() {
      if (window.SelfHealing) {
        const state = window.SelfHealing.getState();
        document.getElementById('healingRuns').textContent = state.healing.runs;
        document.getElementById('evalRuns').textContent = state.evaluation.runs;
        document.getElementById('healingFailures').textContent = state.healing.failures || 0;
        document.getElementById('recoveryAttempts').textContent = state.recovery.attempts || 0;
        document.getElementById('listenersCount').textContent = Object.keys(state.listeners).length;
        document.getElementById('quarantineCount').textContent = state.quarantine.items.length;
        document.getElementById('deviceType').textContent = state.device.type;
        document.getElementById('depsStatus').textContent = state.deps.core ? 'OK ✓' : 'Missing ✗';
        document.getElementById('version').textContent = state.version;
        
        // Update status
        if (state.healing.selfOk) {
          statusDiv.className = 'status ok';
          statusText.textContent = 'Healthy ✓';
        } else {
          statusDiv.className = 'status warn';
          statusText.textContent = 'Degraded ⚠';
        }
      }
    }
    
    setInterval(updateMetrics, 1000);
    
    // Wait for self-healing to initialize
    setTimeout(() => {
      if (window.SelfHealing) {
        console.log('✓ Self-Healing API detected');
        console.log('Version: ' + window.SelfHealing.getVersion());
        updateMetrics();
      } else {
        console.error('✗ Self-Healing API not found');
        statusDiv.className = 'status error';
        statusText.textContent = 'Failed to Initialize ✗';
      }
    }, 1000);

    // Test functions
    function testManualHeal() {
      console.log('Testing manual heal...');
      if (window.SelfHealing) {
        const result = window.SelfHealing.heal();
        console.log('Heal result:', result ? 'OK' : 'Degraded');
      }
    }

    function testEvaluation() {
      console.log('Testing evaluation...');
      if (window.SelfHealing) {
        const result = window.SelfHealing.evaluate();
        console.log('Evaluation result:', result ? 'OK' : 'Failed');
      }
    }

    function testBrokenButton() {
      console.log('Testing broken button (will throw error)...');
      try {
        throw new Error('Test error from button click');
      } catch (e) {
        console.error('Caught test error:', e.message);
      }
    }

    function testQuarantine() {
      console.log('Testing quarantine...');
      if (window.SelfHealing) {
        window.SelfHealing.quarantine({ test: 'payload' }, 'manual test');
        console.log('Item added to quarantine');
      }
    }

    function testGetHealth() {
      console.log('Getting health report...');
      if (window.SelfHealing) {
        const health = window.SelfHealing.getHealth();
        console.log('Health Report:', health);
        alert(JSON.stringify(health, null, 2));
      }
    }

    function testForceReset() {
      console.log('Testing force reset...');
      if (window.SelfHealing && confirm('Force reset the self-healing system?')) {
        window.SelfHealing.forceReset();
        console.log('System reset complete');
      }
    }

    function clearLog() {
      logDiv.innerHTML = '';
      console.log('Log cleared');
    }

    function showState() {
      if (window.SelfHealing) {
        const state = window.SelfHealing.getState();
        console.log('Current State:', JSON.stringify(state, null, 2));
      }
    }
  </script>
