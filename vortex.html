  <script>
    // =========================
    // Core Three.js setup
    // =========================
    const container = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000208, 0.18); // Enhanced fog for depth

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1.0);
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      65, // Increased FOV for better depth perception
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 1.4, 8);

    // Subtle color grading
    const hemi = new THREE.HemisphereLight(0x7fe1ff, 0x020208, 0.6);
    hemi.position.set(0, 5, 0);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0x88b4ff, 0.7);
    keyLight.position.set(4, 6, 2);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xff6aa4, 0.5);
    backLight.position.set(-6, 3, -5);
    scene.add(backLight);

    // =========================
    // Vortex tunnel (line rectangles)
    // Inspired by pencil drawing
    // Enhanced with pulsing energy flow
    // =========================
    function createRectRing(width, height, z, twist, index, total) {
      const hw = width / 2;
      const hh = height / 2;
      const points = [
        new THREE.Vector3(-hw, -hh, z),
        new THREE.Vector3(hw, -hh, z),

        new THREE.Vector3(hw, -hh, z),
        new THREE.Vector3(hw, hh, z),

        new THREE.Vector3(hw, hh, z),
        new THREE.Vector3(-hw, hh, z),

        new THREE.Vector3(-hw, hh, z),
        new THREE.Vector3(-hw, -hh, z),
      ];

      const geom = new THREE.BufferGeometry().setFromPoints(points);
      
      // Dynamic color based on depth for energy flow effect
      const t = index / total;
      const hue = 0.55 + 0.15 * Math.sin(t * Math.PI * 2);
      
      const mat = new THREE.LineBasicMaterial({
        color: new THREE.Color().setHSL(hue, 0.85, 0.6),
        transparent: true,
        opacity: 0.85,
        linewidth: 2
      });
      const lines = new THREE.LineSegments(geom, mat);
      lines.rotation.z = twist;
      lines.userData.baseHue = hue;
      lines.userData.index = index;
      lines.userData.pulsePhase = (index / total) * Math.PI * 2;
      return lines;
    }

    const vortexGroup = new THREE.Group();
    scene.add(vortexGroup);

    const vortexRings = [];
    const ringCount = 28;
    for (let i = 0; i < ringCount; i++) {
      const t = i / (ringCount - 1);
      const width = 10 * (1 - 0.8 * t);
      const height = 6 * (1 - 0.7 * t);
      const z = -t * 40;
      const twist = (Math.sin(t * Math.PI * 1.6) + t * 1.1) * 0.5;
      const ring = createRectRing(width, height, z, twist, i, ringCount);
      vortexGroup.add(ring);
      vortexRings.push(ring);
    }

    // Dark focal disk at center
    const centerDiskGeom = new THREE.CircleGeometry(0.8, 64);
    const centerDiskMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.85,
    });
    const centerDisk = new THREE.Mesh(centerDiskGeom, centerDiskMat);
    centerDisk.position.set(0, 0, -40.5);
    scene.add(centerDisk);

    // =========================
    // Grid room around everything
    // Inspired by monitor perspective grid
    // Enhanced for shadow box depth perception
    // =========================
    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    function createGridPlane(size, divisions, color, rotation, position) {
      const grid = new THREE.GridHelper(size, divisions, color, color);
      grid.material.opacity = 0.25;
      grid.material.transparent = true;
      grid.material.depthWrite = false;
      grid.rotation.set(rotation.x, rotation.y, rotation.z);
      grid.position.set(position.x, position.y, position.z);
      return grid;
    }

    const roomSize = 30;
    const divisions = 25;
    const gridColor = 0x4b82ff;

    // Floor
    roomGroup.add(
      createGridPlane(
        roomSize,
        divisions,
        gridColor,
        { x: -Math.PI / 2, y: 0, z: 0 },
        { x: 0, y: -4, z: 0 }
      )
    );
    // Ceiling
    roomGroup.add(
      createGridPlane(
        roomSize,
        divisions,
        gridColor,
        { x: Math.PI / 2, y: 0, z: 0 },
        { x: 0, y: 4, z: 0 }
      )
    );
    // Back wall
    roomGroup.add(
      createGridPlane(
        roomSize,
        divisions,
        gridColor,
        { x: 0, y: 0, z: 0 },
        { x: 0, y: 0, z: -15 }
      )
    );
    // Front wall (dim)
    const front = createGridPlane(
      roomSize,
      divisions,
      gridColor,
      { x: 0, y: Math.PI, z: 0 },
      { x: 0, y: 0, z: 15 }
    );
    front.material.opacity = 0.07;
    roomGroup.add(front);
    // Left wall
    roomGroup.add(
      createGridPlane(
        roomSize,
        divisions,
        gridColor,
        { x: 0, y: Math.PI / 2, z: 0 },
        { x: -15, y: 0, z: 0 }
      )
    );
    // Right wall
    roomGroup.add(
      createGridPlane(
        roomSize,
        divisions,
        gridColor,
        { x: 0, y: -Math.PI / 2, z: 0 },
        { x: 15, y: 0, z: 0 }
      )
    );

    // Subtle star-like points near periphery (colorful background specks)
    const starsGeom = new THREE.BufferGeometry();
    const starCount = 500;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 45 + Math.random() * 15;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi);
      starPositions[i * 3 + 0] = x;
      starPositions[i * 3 + 1] = y;
      starPositions[i * 3 + 2] = z;

      const hue = 0.6 + (Math.random() - 0.5) * 0.4; // bluish to magenta
      const color = new THREE.Color().setHSL(hue, 0.9, 0.7);
      starColors[i * 3 + 0] = color.r;
      starColors[i * 3 + 1] = color.g;
      starColors[i * 3 + 2] = color.b;
    }
    starsGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starsGeom.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starsMat = new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
    });
    const stars = new THREE.Points(starsGeom, starsMat);
    scene.add(stars);

    // =========================
    // Central cube cluster (nodes)
    // =========================
    const cubeGroup = new THREE.Group();
    cubeGroup.position.set(0, 0, -8);
    scene.add(cubeGroup);

    const cubes = [];
    const baseCubeGeom = new THREE.BoxGeometry(0.7, 0.7, 0.7);

    for (let i = 0; i < 6; i++) {
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.55 + 0.1 * Math.random(), 0.7, 0.55),
        roughness: 0.2,
        metalness: 0.6,
        emissive: 0x0a1230,
        emissiveIntensity: 0.6,
      });
      const cube = new THREE.Mesh(baseCubeGeom, mat);
      const radius = 1.6 + Math.random() * 0.3;
      const angle = (i / 6) * Math.PI * 2 + Math.random() * 0.3;
      cube.position.set(
        Math.cos(angle) * radius,
        (Math.random() - 0.5) * 1.4,
        Math.sin(angle) * radius
      );
      cube.userData.baseY = cube.position.y;
      cube.userData.pulse = 0;
      cubeGroup.add(cube);
      cubes.push(cube);
    }

    // Thin line connections between cubes (like sketched graph edges)
    // Enhanced with energy flow pulses
    const cubeLinesGeom = new THREE.BufferGeometry();
    const cubeLinePositions = new Float32Array(cubes.length * cubes.length * 6);
    const cubeLineColors = new Float32Array(cubes.length * cubes.length * 6);
    const cubeLinesMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      linewidth: 2
    });
    const cubeLines = new THREE.LineSegments(cubeLinesGeom, cubeLinesMat);
    cubeGroup.add(cubeLines);

    function updateCubeLines(time = 0) {
      let idx = 0;
      let colorIdx = 0;
      for (let i = 0; i < cubes.length; i++) {
        for (let j = i + 1; j < cubes.length; j++) {
          const a = cubes[i].position;
          const b = cubes[j].position;
          cubeLinePositions[idx++] = a.x;
          cubeLinePositions[idx++] = a.y;
          cubeLinePositions[idx++] = a.z;
          cubeLinePositions[idx++] = b.x;
          cubeLinePositions[idx++] = b.y;
          cubeLinePositions[idx++] = b.z;
          
          // Pulsing energy colors
          const pulsePhase = time * 2 + (i + j) * 0.5;
          const intensity = 0.5 + 0.5 * Math.sin(pulsePhase);
          const hue = 0.55 + 0.15 * Math.sin(time * 0.5 + i * 0.3);
          const color = new THREE.Color().setHSL(hue, 0.8, 0.4 + intensity * 0.3);
          
          // Apply color to both vertices of the line
          cubeLineColors[colorIdx++] = color.r;
          cubeLineColors[colorIdx++] = color.g;
          cubeLineColors[colorIdx++] = color.b;
          cubeLineColors[colorIdx++] = color.r;
          cubeLineColors[colorIdx++] = color.g;
          cubeLineColors[colorIdx++] = color.b;
        }
      }
      cubeLinesGeom.setAttribute(
        'position',
        new THREE.BufferAttribute(cubeLinePositions.slice(0, idx), 3)
      );
      cubeLinesGeom.setAttribute(
        'color',
        new THREE.BufferAttribute(cubeLineColors.slice(0, colorIdx), 3)
      );
      cubeLinesGeom.computeBoundingSphere();
    }
    updateCubeLines();

    // =========================
    // Elliptical orbit (ellipse notes)
    // x = a cos t, y = b sin t
    // =========================
    const ellipseGroup = new THREE.Group();
    ellipseGroup.position.set(0, 0.1, -8);
    scene.add(ellipseGroup);

    const a = 3.4;
    const b = 1.6;
    const ellipseSegments = 128;
    const ellipsePoints = [];
    for (let i = 0; i <= ellipseSegments; i++) {
      const t = (i / ellipseSegments) * Math.PI * 2;
      const x = a * Math.cos(t);
      const y = b * Math.sin(t);
      ellipsePoints.push(new THREE.Vector3(x, y, 0));
    }
    const ellipseGeom = new THREE.BufferGeometry().setFromPoints(ellipsePoints);
    const ellipseMat = new THREE.LineBasicMaterial({
      color: 0xff6aa4,
      transparent: true,
      opacity: 0.7,
    });
    const ellipse = new THREE.LineLoop(ellipseGeom, ellipseMat);
    ellipseGroup.add(ellipse);

    // Small orbiting spheres along ellipse (depth samples)
    const sampleCount = 12;
    const samples = [];
    const sampleGeom = new THREE.SphereGeometry(0.08, 16, 16);
    for (let i = 0; i < sampleCount; i++) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0xfff3b3,
        emissive: 0x402020,
        emissiveIntensity: 0.5,
        roughness: 0.4,
        metalness: 0.4,
      });
      const s = new THREE.Mesh(sampleGeom, mat);
      ellipseGroup.add(s);
      samples.push(s);
    }

    // =========================
    // Camera interaction (mouse as viewer position)
    // =========================
    const mouse = new THREE.Vector2(0, 0);
    let targetYaw = 0;
    let targetPitch = 0;
    let camDistance = 8;

    window.addEventListener('mousemove', (event) => {
      const nx = (event.clientX / window.innerWidth) * 2 - 1;
      const ny = (event.clientY / window.innerHeight) * 2 - 1;
      mouse.set(nx, ny);
      targetYaw = nx * 0.5;     // left / right look
      targetPitch = ny * 0.25;  // up / down look
    });

    window.addEventListener('wheel', (event) => {
      camDistance += event.deltaY * 0.002;
      camDistance = Math.min(Math.max(camDistance, 4.5), 12);
    });

    // =========================
    // Raycaster for cube clicks
    // =========================
    const raycaster = new THREE.Raycaster();
    const cubeLabel = document.getElementById('cubeLabel');

    window.addEventListener('click', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera({ x, y }, camera);
      const intersects = raycaster.intersectObjects(cubes, true);
      if (intersects.length > 0) {
        const cube = intersects[0].object;
        cube.userData.pulse = 1.0;
        cube.material.emissiveIntensity = 1.4;

        // Position label over cube
        const screenPos = intersects[0].point.clone();
        screenPos.project(camera);
        const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

        cubeLabel.style.left = sx + 'px';
        cubeLabel.style.top = sy + 'px';
        cubeLabel.style.opacity = '1';
        cubeLabel.style.transform = 'translate(-50%, -160%)';
        setTimeout(() => {
          cubeLabel.style.opacity = '0';
          cubeLabel.style.transform = 'translate(-50%, -140%)';
        }, 620);
      }
    });

    // =========================
    // Web3: basic wallet connect
    // =========================
    const walletBtn = document.getElementById('walletButton');
    const walletStatus = document.getElementById('walletStatus');
    let provider = null;
    let signer = null;

    async function connectWallet() {
      if (!window.ethereum) {
        walletStatus.textContent = 'No wallet found (install MetaMask or compatible provider).';
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        const addr = accounts[0];
        walletBtn.classList.add('connected');
        walletStatus.textContent = `Connected: ${addr.slice(0, 6)}…${addr.slice(-4)}`;
      } catch (err) {
        console.error(err);
        walletStatus.textContent = 'Connection cancelled or failed.';
      }
    }

    walletBtn.addEventListener('click', () => {
      connectWallet();
    });

    // =========================
    // Page Navigation with Color Transitions
    // =========================
    const navButtons = document.querySelectorAll('.nav-button');
    let currentNavColor = { r: 0, g: 1, b: 1 }; // Start with cyan
    
    navButtons.forEach((button, index) => {
      button.addEventListener('click', () => {
        const page = button.getAttribute('data-page');
        const buttonStyle = window.getComputedStyle(button);
        const color = buttonStyle.borderColor;
        
        // Parse RGB and convert to normalized values
        const rgb = color.match(/\d+/g).map(v => parseInt(v) / 255);
        currentNavColor = { r: rgb[0], g: rgb[1], b: rgb[2] };
        
        // Trigger warp effect
        scene.fog.density = 0.35;
        vortexGroup.rotation.z += 0.5;
        
        // Navigate after transition
        setTimeout(() => {
          window.location.href = page;
        }, 600);
      });
      
      // Hover effect changes vortex colors
      button.addEventListener('mouseenter', () => {
        const buttonStyle = window.getComputedStyle(button);
        const color = buttonStyle.borderColor;
        const rgb = color.match(/\d+/g).map(v => parseInt(v) / 255);
        currentNavColor = { r: rgb[0], g: rgb[1], b: rgb[2] };
      });
    });

    // =========================
    // Resize handling
    // =========================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    const debugCamPos = document.getElementById('debugCamPos');
    const debugCamFov = document.getElementById('debugCamFov');

    // =========================
    // Animation loop
    // =========================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Camera orbit around vortex center, biased by mouse
      const lerpFactor = 0.06;
      const yaw = THREE.MathUtils.lerp(camera.rotation.y, targetYaw, lerpFactor);
      const pitch = THREE.MathUtils.lerp(camera.rotation.x, targetPitch, lerpFactor);

      const orbitRadius = camDistance;
      const yawOffset = yaw + Math.sin(t * 0.1) * 0.05;
      const pitchOffset = THREE.MathUtils.clamp(pitch, -0.55, 0.4);

      const target = new THREE.Vector3(0, 0, -10);

      const x = target.x + orbitRadius * Math.sin(yawOffset) * Math.cos(pitchOffset);
      const y = target.y + orbitRadius * Math.sin(pitchOffset) + 0.4;
      const z = target.z + orbitRadius * Math.cos(yawOffset) * Math.cos(pitchOffset);

      camera.position.lerp(new THREE.Vector3(x, y, z), 0.06);
      camera.lookAt(target);

      // Enhanced vortex rings with pulsing energy flow
      vortexRings.forEach((ring, i) => {
        const tt = i / (vortexRings.length - 1);
        ring.rotation.z += 0.0008 * (1 - tt);
        
        // Breathing scale effect
        const s = 1 + 0.05 * Math.sin(t * 1.3 + tt * 7.0);
        ring.scale.setScalar(s);
        
        // Energy pulse color shift
        const pulseIntensity = 0.5 + 0.5 * Math.sin(t * 2 + ring.userData.pulsePhase);
        const hue = ring.userData.baseHue + 0.1 * Math.sin(t * 0.8 + tt * 3);
        const lightness = 0.5 + 0.2 * pulseIntensity;
        ring.material.color.setHSL(hue, 0.85, lightness);
        ring.material.opacity = 0.7 + 0.2 * pulseIntensity;
      });

      // Room pulse with depth
      const roomScale = 1 + 0.03 * Math.sin(t * 0.7);
      roomGroup.scale.set(roomScale, roomScale, roomScale);
      
      // Fog density pulse for depth perception
      scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, 0.18, 0.1);

      // Cube float + pulse
      cubes.forEach((cube, i) => {
        const baseY = cube.userData.baseY;
        cube.position.y = baseY + Math.sin(t * 1.4 + i * 1.5) * 0.15;
        cube.rotation.x += 0.005 + i * 0.0007;
        cube.rotation.y -= 0.007 + i * 0.0012;

        if (cube.userData.pulse > 0) {
          cube.userData.pulse *= 0.92;
          const scale = 1 + cube.userData.pulse * 0.5;
          cube.scale.set(scale, scale, scale);
          cube.material.emissiveIntensity = 0.6 + cube.userData.pulse * 0.8;
        } else {
          cube.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
          cube.material.emissiveIntensity = THREE.MathUtils.lerp(
            cube.material.emissiveIntensity,
            0.6,
            0.1
          );
        }
      });

      // Update cube connection lines with energy flow
      updateCubeLines(t);
      cubeLines.rotation.y = Math.sin(t * 0.3) * 0.2;

      // Ellipse orbiting samples
      samples.forEach((s, i) => {
        const phase = (i / sampleCount) * Math.PI * 2;
        const tt = t * 0.4 + phase;
        const ex = a * Math.cos(tt);
        const ey = b * Math.sin(tt);
        s.position.set(ex, ey, 0);
      });
      ellipseGroup.rotation.z = t * 0.08;

      // Star twinkle
      stars.rotation.y = t * 0.01;
      stars.material.opacity = 0.75 + 0.1 * Math.sin(t * 0.9);

      // Debug HUD
      debugCamPos.textContent = `pos: ${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}`;
      debugCamFov.textContent = `fov: ${camera.fov.toFixed(0)}°`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
