    <script>
        let currentFilter = 'all';
        let currentWallet = null;
        let userCollection = [];
        let unopenedPacks = [];

        // Pack types reference
        const PACK_TYPES = {
            'disney': { name: 'Disney Classics Pack', cards: 8 },
            'marvel': { name: 'Marvel Heroes Pack', cards: 10 },
            'starwars': { name: 'Star Wars Universe Pack', cards: 12 },
            'dc': { name: 'DC Universe Pack', cards: 10 },
            'pixar': { name: 'Pixar Adventures Pack', cards: 8 },
            'classic': { name: 'Classic Animation Pack', cards: 10 },
            'scifi': { name: 'Sci-Fi Universe Pack', cards: 12 },
            'fantasy': { name: 'Fantasy Realm Pack', cards: 10 },
            'gaming': { name: 'Gaming Legends Pack', cards: 15 },
            'anime': { name: 'Anime Legends Pack', cards: 15 }
        };

        // Card base values by rarity
        const BASE_VALUES = {
            common: 0.1,
            rare: 0.5,
            epic: 2.0,
            legendary: 8.0
        };

        function init() {
            initWallet();
            loadCollection();
            loadUnopenedPacks();
            setupFilters();
            updateStats();
            renderUnopenedPacks();
            renderCards();
        }

        function loadUnopenedPacks() {
            // Load from blockchain ledger
            const ledgerData = localStorage.getItem('blockchain_ledger');
            if (ledgerData) {
                const ledger = JSON.parse(ledgerData);
                const userPacks = ledger.userPacks[currentWallet] || [];
                unopenedPacks = userPacks.filter(pack => !pack.opened);
            }
        }

        function renderUnopenedPacks() {
            const section = document.getElementById('unopenedPacksSection');
            const grid = document.getElementById('unopenedPacksGrid');
            
            if (unopenedPacks.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            grid.innerHTML = '';

            unopenedPacks.forEach((pack, index) => {
                const packInfo = PACK_TYPES[pack.packId] || { name: 'Mystery Pack', cards: 8 };
                const packEl = document.createElement('div');
                packEl.className = 'unopened-pack-item';
                packEl.innerHTML = `
                    <h4 class="pack-name">${packInfo.name}</h4>
                    <p class="pack-info-text">${packInfo.cards} cards inside</p>
                    <p class="pack-info-text" style="font-size: 0.8rem; opacity: 0.7;">
                        Purchased: ${new Date(pack.timestamp).toLocaleDateString()}
                    </p>
                    <div class="pack-actions">
                        <button class="btn-small btn-open" onclick="openPackNow('${pack.packId}', '${pack.purchaseId}', ${index})">
                            Open Pack
                        </button>
                        <button class="btn-small btn-list" onclick="listPackOnMarket('${pack.packId}', '${pack.purchaseId}', ${index})">
                            List on Market
                        </button>
                    </div>
                `;
                grid.appendChild(packEl);
            });
        }

        function openPackNow(packId, purchaseId, index) {
            // Mark pack as opened
            unopenedPacks[index].opened = true;
            
            // Update blockchain ledger
            const ledgerData = localStorage.getItem('blockchain_ledger');
            if (ledgerData) {
                const ledger = JSON.parse(ledgerData);
                if (ledger.userPacks[currentWallet]) {
                    ledger.userPacks[currentWallet] = ledger.userPacks[currentWallet].map(pack => {
                        if (pack.purchaseId === purchaseId) {
                            return { ...pack, opened: true };
                        }
                        return pack;
                    });
                    localStorage.setItem('blockchain_ledger', JSON.stringify(ledger));
                }
            }

            // Redirect to pack opening page
            window.location.href = `pack-opening.html?pack=${packId}&tx=${purchaseId}`;
        }

        function listPackOnMarket(packId, purchaseId, index) {
            const packInfo = PACK_TYPES[packId] || { name: 'Mystery Pack' };
            
            const price = prompt(`List ${packInfo.name} on the marketplace?\n\nEnter your asking price in GBUV:`);
            
            if (price && !isNaN(price) && parseFloat(price) > 0) {
                // Create marketplace listing
                const listing = {
                    id: Date.now(),
                    packId: packId,
                    purchaseId: purchaseId,
                    seller: window.currentUser?.username || 'Anonymous',
                    price: parseFloat(price),
                    listedAt: new Date().toISOString(),
                    status: 'active'
                };
                
                // Save to localStorage (marketplace listings)
                const listings = JSON.parse(localStorage.getItem('marketplace_listings') || '[]');
                listings.push(listing);
                localStorage.setItem('marketplace_listings', JSON.stringify(listings));
                
                // Remove from collection
                collection.splice(index, 1);
                saveCollection();
                renderCollection();
                
                alert(`✅ ${packInfo.name} listed on marketplace for ${price} GBUV!\n\nOther players can now purchase this pack from the marketplace.`);
            }
        }

        function initWallet() {
            if (window.SharedWalletSystem) {
                const wallet = new SharedWalletSystem();
                if (wallet.connected) {
                    currentWallet = wallet.address;
                }
            }
            if (!currentWallet) {
                currentWallet = 'demo_' + Math.random().toString(36).substring(2, 11);
            }
            updateWalletUI();
        }

        function updateWalletUI() {
            const walletEl = document.getElementById('walletAddress');
            if (currentWallet) {
                walletEl.textContent = currentWallet.substring(0, 6) + '...' + currentWallet.substring(currentWallet.length - 4);
            }
        }

        function loadCollection() {
            // Load from localStorage
            const saved = localStorage.getItem('card_collection');
            if (saved) {
                userCollection = JSON.parse(saved);
            }

            // Add some demo cards if empty
            if (userCollection.length === 0) {
                userCollection = generateDemoCards();
                localStorage.setItem('card_collection', JSON.stringify(userCollection));
            }
        }

        function generateDemoCards() {
            const demoCards = [
                { id: 'demo_1', name: 'Shadow Warrior', rarity: 'rare', power: 75, purchasePrice: 0.5 },
                { id: 'demo_2', name: 'Fire Spirit', rarity: 'common', power: 60, purchasePrice: 0.1 },
                { id: 'demo_3', name: 'Ice Guardian', rarity: 'epic', power: 88, purchasePrice: 2.0 },
                { id: 'demo_4', name: 'Thunder God', rarity: 'legendary', power: 96, purchasePrice: 8.5 },
                { id: 'demo_5', name: 'Earth Golem', rarity: 'rare', power: 72, purchasePrice: 0.45 }
            ];

            return demoCards.map(card => ({
                ...card,
                purchaseDate: new Date().toISOString(),
                owner: currentWallet,
                baseValue: BASE_VALUES[card.rarity] * (1 + Math.random() * 0.3)
            }));
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderCards();
                });
            });
        }

        function updateStats() {
            const totalCards = userCollection.length;
            const totalValue = userCollection.reduce((sum, card) => sum + (card.baseValue || BASE_VALUES[card.rarity]), 0);
            const totalPaid = userCollection.reduce((sum, card) => sum + card.purchasePrice, 0);
            const netProfit = totalValue - totalPaid;

            document.getElementById('totalCards').textContent = totalCards;
            document.getElementById('totalValue').textContent = totalValue.toFixed(2) + ' SOL';
            document.getElementById('totalPaid').textContent = totalPaid.toFixed(2) + ' SOL';
            
            const netProfitEl = document.getElementById('netProfit');
            netProfitEl.textContent = (netProfit >= 0 ? '+' : '') + netProfit.toFixed(2) + ' SOL';
            netProfitEl.style.color = netProfit >= 0 ? 'var(--success)' : 'var(--danger)';
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            
            let filteredCards = userCollection;
            if (currentFilter !== 'all') {
                filteredCards = userCollection.filter(c => c.rarity === currentFilter);
            }

            if (filteredCards.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <h3>No cards in collection</h3>
                        <p>Start by purchasing some packs!</p>
                        <a href="packs.html">Browse Packs</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            filteredCards.forEach(card => {
                const baseValue = card.baseValue || BASE_VALUES[card.rarity];
                const profit = baseValue - card.purchasePrice;
                const profitPercent = ((profit / card.purchasePrice) * 100).toFixed(1);

                const cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                cardEl.innerHTML = `
                    <div class="card-3d-preview" id="preview-${card.id}"></div>
                    <div class="card-details">
                        <h3 class="card-name">${card.name}</h3>
                        <span class="card-rarity ${card.rarity}">${card.rarity}</span>
                        
                        <div class="card-values">
                            <div class="value-item">
                                <div class="value-label">Base Value</div>
                                <div class="value-amount">${baseValue.toFixed(2)} SOL</div>
                            </div>
                            <div class="value-item">
                                <div class="value-label">Price Paid</div>
                                <div class="value-amount paid">${card.purchasePrice.toFixed(2)} SOL</div>
                            </div>
                        </div>

                        <div class="profit-indicator ${profit >= 0 ? 'positive' : 'negative'}">
                            ${profit >= 0 ? '↗' : '↘'} ${profit >= 0 ? '+' : ''}${profit.toFixed(2)} SOL (${profitPercent}%)
                        </div>

                        <div class="card-actions">
                            <button class="btn btn-primary" onclick="listForSale('${card.id}')">
                                Sell
                            </button>
                            <button class="btn btn-secondary" onclick="transferCard('${card.id}')">
                                Transfer
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(cardEl);

                init3DCardPreview(`preview-${card.id}`, card.rarity);
            });
        }

        function init3DCardPreview(containerId, rarity) {
            const container = document.getElementById(containerId);
            if (!container || !window.THREE) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(2.5, 3.5, 0.1);
            
            const colors = {
                common: 0x9ca3af,
                rare: 0x3b82f6,
                epic: 0xa855f7,
                legendary: 0xfbbf24
            };

            const material = new THREE.MeshPhongMaterial({
                color: colors[rarity] || 0x38bdf8,
                emissive: colors[rarity] || 0x38bdf8,
                emissiveIntensity: 0.3,
                shininess: 100
            });

            const card = new THREE.Mesh(geometry, material);
            scene.add(card);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(colors[rarity] || 0x38bdf8, 1.5, 100);
            pointLight.position.set(2, 3, 5);
            scene.add(pointLight);

            camera.position.z = 6;

            let rotation = 0;
            function animate() {
                requestAnimationFrame(animate);
                rotation += 0.01;
                card.rotation.y = Math.sin(rotation) * 0.3;
                card.rotation.x = Math.cos(rotation * 0.5) * 0.1;
                renderer.render(scene, camera);
            }
            animate();
        }

        function listForSale(cardId) {
            const card = userCollection.find(c => c.id === cardId);
            if (!card) return;

            const baseValue = card.baseValue || BASE_VALUES[card.rarity];
            const suggestedPrice = (baseValue * 1.1).toFixed(2);

            const price = prompt(`List ${card.name} for sale\n\nSuggested price: ${suggestedPrice} SOL\nEnter your price:`, suggestedPrice);
            
            if (price && !isNaN(parseFloat(price))) {
                alert(`${card.name} listed for ${parseFloat(price).toFixed(2)} SOL in the Showroom!`);
                // In a real implementation, this would update the showroom marketplace
            }
        }

        function transferCard(cardId) {
            const card = userCollection.find(c => c.id === cardId);
            if (!card) return;

            const recipient = prompt(`Transfer ${card.name}\n\nEnter recipient wallet address:`);
            
            if (recipient && recipient.length > 10) {
                if (confirm(`Transfer ${card.name} to ${recipient}?\n\nThis action cannot be undone.`)) {
                    // Remove from collection
                    userCollection = userCollection.filter(c => c.id !== cardId);
                    localStorage.setItem('card_collection', JSON.stringify(userCollection));
                    
                    alert(`${card.name} transferred to ${recipient.substring(0, 6)}...${recipient.substring(recipient.length - 4)}`);
                    
                    updateStats();
                    renderCards();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
