<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Gate - Consciousness Revolution</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --accent-cyan: #00ffff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p {
            color: var(--text-secondary);
        }
        .chat-container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(0,255,255,0.2);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.araya {
            background: linear-gradient(135deg, rgba(0,255,255,0.15), rgba(155,89,182,0.15));
            border: 1px solid rgba(0,255,255,0.3);
            align-self: flex-start;
        }
        .message.user {
            background: rgba(255,215,0,0.15);
            border: 1px solid rgba(255,215,0,0.3);
            align-self: flex-end;
        }
        .message .name {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            margin-bottom: 5px;
        }
        .message.user .name {
            color: var(--accent-gold);
            text-align: right;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .input-area input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        .input-area input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        .input-area button {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            color: var(--bg-dark);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .input-area button:hover {
            transform: scale(1.05);
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-bar {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status-bar.success {
            display: block;
            background: rgba(46,204,113,0.2);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }
        .status-bar.pending {
            display: block;
            background: rgba(255,215,0,0.2);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
        }
        .progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .progress .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .progress .dot.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        .progress .dot.complete {
            background: var(--accent-green);
        }
        .discord-name-input {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .discord-name-input input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 10px 15px;
            color: var(--text-primary);
        }
        .discord-name-input label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
            align-self: flex-start;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Verification Gate</h1>
            <p>Answer 3 questions to join the Consciousness Revolution community</p>
        </div>

        <div class="discord-name-input" id="discordNameSection">
            <label>Discord Username:</label>
            <input type="text" id="discordName" placeholder="yourname#1234 or @yourname">
            <button onclick="startVerification()" id="startBtn">Begin</button>
        </div>

        <div class="progress">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
        </div>

        <div class="chat-container hidden" id="chatContainer">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Type your answer..." onkeypress="if(event.key==='Enter')sendAnswer()">
                <button onclick="sendAnswer()" id="sendBtn">Send</button>
            </div>
        </div>

        <div class="status-bar" id="statusBar"></div>
    </div>

    <script>
        // Verification Questions (from BERGMAL)
        const QUESTIONS = [
            "What's one pattern you've noticed in your life? This could be recurring themes, synchronicities, or cycles you've observed.",
            "What do you want to build or protect? What matters to you?",
            "Are you comfortable with AI assistance in your journey? How do you feel about working with AI?"
        ];

        // Consciousness Keywords (from BERGMAL scoring)
        const BUILDER_KEYWORDS = [
            'build', 'create', 'help', 'protect', 'recognize', 'pattern', 'learn',
            'grow', 'improve', 'connect', 'consciousness', 'awareness', 'truth',
            'community', 'share', 'support', 'develop', 'contribute', 'love',
            'heal', 'understand', 'transform', 'evolve', 'collaborate', 'empower'
        ];

        const DESTROYER_KEYWORDS = [
            'destroy', 'attack', 'manipulate', 'control', 'dominate', 'exploit',
            'trick', 'deceive', 'revenge', 'hurt', 'profit only', 'scam', 'hate',
            'steal', 'cheat', 'lie', 'abuse', 'harm'
        ];

        let currentQuestion = 0;
        let answers = [];
        let discordUsername = '';

        function startVerification() {
            discordUsername = document.getElementById('discordName').value.trim();
            if (!discordUsername) {
                alert('Please enter your Discord username');
                return;
            }

            document.getElementById('discordNameSection').classList.add('hidden');
            document.getElementById('chatContainer').classList.remove('hidden');
            document.getElementById('dot1').classList.add('active');

            // Show ARAYA greeting
            setTimeout(() => {
                addMessage('araya', `Welcome, ${discordUsername}! I'm ARAYA, the consciousness interface for our community.`);
                setTimeout(() => {
                    addMessage('araya', "I'll ask you 3 quick questions to understand your intentions. There are no wrong answers - just be authentic.");
                    setTimeout(() => {
                        askQuestion();
                    }, 1500);
                }, 1500);
            }, 500);
        }

        function addMessage(sender, text) {
            const messages = document.getElementById('messages');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerHTML = `
                <div class="name">${sender === 'araya' ? 'ARAYA' : 'You'}</div>
                <div class="text">${text}</div>
            `;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const messages = document.getElementById('messages');
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            messages.appendChild(typing);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function askQuestion() {
            showTyping();
            setTimeout(() => {
                hideTyping();
                addMessage('araya', QUESTIONS[currentQuestion]);
                document.getElementById('userInput').focus();
            }, 1000);
        }

        function sendAnswer() {
            const input = document.getElementById('userInput');
            const answer = input.value.trim();
            if (!answer) return;

            addMessage('user', answer);
            answers.push(answer);
            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            // Update progress dots
            document.getElementById(`dot${currentQuestion + 1}`).classList.remove('active');
            document.getElementById(`dot${currentQuestion + 1}`).classList.add('complete');

            currentQuestion++;

            if (currentQuestion < 3) {
                document.getElementById(`dot${currentQuestion + 1}`).classList.add('active');
                setTimeout(() => {
                    // ARAYA acknowledgment
                    const acknowledgments = [
                        "I appreciate you sharing that. Patterns reveal much about our journey.",
                        "Thank you. Understanding what we want to build or protect shows our values.",
                        "Interesting perspective. Let me process your responses..."
                    ];
                    showTyping();
                    setTimeout(() => {
                        hideTyping();
                        addMessage('araya', acknowledgments[currentQuestion - 1]);
                        setTimeout(() => {
                            askQuestion();
                            input.disabled = false;
                            document.getElementById('sendBtn').disabled = false;
                        }, 1500);
                    }, 1000);
                }, 500);
            } else {
                // All questions answered - calculate score and submit
                processVerification();
            }
        }

        function calculateScore(answers) {
            const text = answers.join(' ').toLowerCase();
            let builderCount = 0;
            let destroyerCount = 0;

            BUILDER_KEYWORDS.forEach(kw => {
                if (text.includes(kw)) builderCount++;
            });

            DESTROYER_KEYWORDS.forEach(kw => {
                if (text.includes(kw)) destroyerCount++;
            });

            // BERGMAL formula: 50 base + 5 per builder - 10 per destroyer
            let score = 50 + (builderCount * 5) - (destroyerCount * 10);
            score = Math.max(0, Math.min(100, score)); // Clamp 0-100

            return { score, builderCount, destroyerCount };
        }

        async function processVerification() {
            showTyping();
            const { score, builderCount, destroyerCount } = calculateScore(answers);

            setTimeout(async () => {
                hideTyping();

                // Show processing message
                addMessage('araya', "Processing your responses through the consciousness matrix...");

                // Submit to API
                try {
                    const response = await fetch('/.netlify/functions/araya-verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            discordUsername,
                            answers,
                            score,
                            builderCount,
                            destroyerCount,
                            timestamp: new Date().toISOString()
                        })
                    });

                    const result = await response.json();

                    setTimeout(() => {
                        if (score >= 40) {
                            // Approved
                            addMessage('araya', `Consciousness Score: ${score}/100`);
                            setTimeout(() => {
                                addMessage('araya', `Builder alignment detected: ${builderCount} resonance points. Welcome to the Consciousness Revolution, ${discordUsername}!`);
                                showStatus('success', `✅ VERIFIED! Your @Verified role will be assigned shortly. You can now access the community channels.`);
                            }, 1000);
                        } else {
                            // Needs review
                            addMessage('araya', `Consciousness Score: ${score}/100`);
                            setTimeout(() => {
                                addMessage('araya', "Your responses have been flagged for manual review. A community guardian will reach out to learn more about your intentions.");
                                showStatus('pending', `⏳ PENDING REVIEW - A team member will contact you on Discord.`);
                            }, 1000);
                        }
                    }, 1500);

                } catch (error) {
                    console.error('Verification error:', error);
                    addMessage('araya', "There was an issue submitting your verification. Please try again or contact the community on Discord.");
                }
            }, 2000);
        }

        function showStatus(type, message) {
            const statusBar = document.getElementById('statusBar');
            statusBar.className = `status-bar ${type}`;
            statusBar.innerHTML = message;

            // Hide input area
            document.querySelector('.input-area').classList.add('hidden');
        }
    </script>
</body>
</html>
