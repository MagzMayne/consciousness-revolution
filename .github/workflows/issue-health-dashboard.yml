name: Issue Health Dashboard

# Generates and displays issue health metrics
# Runs bi-weekly (every 2 weeks) to reduce API usage

on:
  schedule:
    # Run bi-weekly on Monday at 9 AM UTC (1st and 3rd week of month)
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  generate-dashboard:
    name: Generate Issue Health Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Run Issue Health Dashboard
        id: dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          node .github/scripts/issue-health-dashboard.js | tee dashboard_output.txt
          echo "dashboard_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Post Dashboard to Summary
        if: always()
        run: |
          echo "## 📊 Issue Health Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat dashboard_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u)" >> $GITHUB_STEP_SUMMARY
      
      - name: Create Issue if Critical
        if: steps.dashboard.outputs.dashboard_exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('dashboard_output.txt', 'utf8');
            
            // Check if there's already an open critical health issue
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'issue-health,critical,automated'
            });
            
            if (existingIssues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔴 CRITICAL: Issue Health Alert',
                body: `## Issue Health Dashboard Alert
            
            The automated issue health check has detected a critical situation.
            
            \`\`\`
            ${output}
            \`\`\`
            
            ### Immediate Actions Required
            
            1. Review the dashboard output above
            2. Run the Bulk Issue Cleanup workflow:
               - Go to Actions tab
               - Select "Bulk Issue Cleanup" 
               - Click "Run workflow"
               - Run with dry_run: false
            
            3. Monitor the cleanup progress
            4. This issue will auto-close once the situation is resolved
            
            ---
            *Generated by Issue Health Dashboard*
            *Dashboard runs daily at 9 AM UTC*`,
                labels: ['issue-health', 'critical', 'automated', 'needs-attention']
              });
              
              console.log('✅ Created critical health alert issue');
            } else {
              console.log('ℹ️ Critical health alert already exists');
            }
      
      - name: Close Health Issues if Healthy
        if: steps.dashboard.outputs.dashboard_exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            // Get open health alert issues
            const { data: healthIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'issue-health,automated'
            });
            
            for (const issue of healthIssues) {
              console.log(`Closing resolved health issue #${issue.number}`);
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `🟢 **Health Restored:** Issue metrics have returned to healthy levels.\n\n---\n*Auto-closed by Issue Health Dashboard*`
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
            
            console.log(`✅ Closed ${healthIssues.length} resolved health issues`);
      
      - name: Upload Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-health-dashboard-${{ github.run_number }}
          path: dashboard_output.txt
          retention-days: 30
