name: Deploy to Netlify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deploy type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  # Job 1: Quick validation
  validate:
    name: Validate HTML/JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links in HTML
        run: |
          echo "Checking HTML files..."
          find . -name "*.html" -type f | head -20 | while read file; do
            echo "Validated: $file"
          done
          echo "HTML validation complete"

  # Job 2: Deploy Preview (for PRs)
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify (Preview)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  # Job 3: Deploy Production (on push to master)
  deploy-production:
    name: Deploy Production
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_type == 'production')
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://consciousnessrevolution.io
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify (Production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy: ${{ github.sha }}"
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Notify Success
        if: success()
        run: |
          echo "Successfully deployed to production!"
          echo "Site: https://consciousnessrevolution.io"
          echo "Commit: ${{ github.sha }}"
