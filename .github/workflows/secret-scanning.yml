# Secret Scanning — Pattern Checks
#
# Purpose: Detect exposed API keys, tokens, and secrets committed to the repository.
#          Runs on every PR and push to main so issues are caught before they reach
#          production. Also runs on a weekly schedule to catch anything that may have
#          slipped through in historical commits.
#
# Triggers: Pull requests, pushes to main, weekly schedule, manual dispatch
# Critical: YES — prevents credential theft and financial abuse
# Contact: BarbrickDesign@gmail.com
#
# NOTE: gitleaks-action was removed because it requires a paid org-level license
#       (GITLEAKS_LICENSE secret) and marks every workflow run as "action_required"
#       when the license is absent, which floods notifications. The pattern-scan
#       job below covers the same checks with no external license requirement.

name: Secret Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Cancel any in-progress run for the same PR/branch so rapid pushes don't
# pile up duplicate workflow runs (and duplicate notifications).
concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write     # needed to post PR comments

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Pattern-based checks for hardcoded secrets
  # ─────────────────────────────────────────────────────────────────────────
  pattern-scan:
    name: Pattern Secret Scan
    runs-on: ubuntu-latest
    # Skip when triggered by automation bots to avoid notification spam.
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for hardcoded API key patterns
        id: pattern_check
        run: |
          set +e
          FAILED=0

          SCAN_ARGS=(
            --include="*.js"
            --include="*.mjs"
            --include="*.ts"
            --include="*.html"
            --include="*.json"
            --exclude-dir=node_modules
            --exclude-dir=.git
            --exclude-dir=.archive
            --exclude-dir=.backups
            --exclude-dir=tools
            -rn
          )

          # Stripe LIVE secret key (sk_live_) — never belongs in source
          echo "🔍 Checking for Stripe live secret keys..."
          STRIPE_LIVE=$(grep "${SCAN_ARGS[@]}" "sk_live_" . 2>/dev/null | grep -v "placeholder\|example\|YOUR_\|process\.env\|window\.ENV")
          if [ -n "$STRIPE_LIVE" ]; then
            echo "::error::Stripe live SECRET key detected in source code!"
            echo "$STRIPE_LIVE"
            FAILED=1
          fi

          # Google / Firebase / Gemini API keys (AIza...) hardcoded as literal strings
          echo "🔍 Checking for hardcoded Google API keys..."
          GOOGLE_KEY=$(grep "${SCAN_ARGS[@]}" --exclude="scripts/pre-commit-hook.js" --exclude="backend-health-checker.js" \
            -P '["'"'"']AIza[0-9A-Za-z_-]{35}["'"'"']' . 2>/dev/null | \
            grep -v "Dummy\|dummy\|example\|placeholder\|YOUR_\|window\.ENV\|process\.env")
          if [ -n "$GOOGLE_KEY" ]; then
            echo "::error::Hardcoded Google/Firebase/Gemini API key detected in source code!"
            echo "$GOOGLE_KEY"
            FAILED=1
          fi

          # Stripe LIVE publishable key hardcoded (pk_live_) — should use window.ENV
          echo "🔍 Checking for hardcoded Stripe live publishable keys..."
          STRIPE_PK=$(grep "${SCAN_ARGS[@]}" \
            -P '["'"'"']pk_live_[0-9a-zA-Z]{24,}["'"'"']' . 2>/dev/null | \
            grep -v "placeholder\|example\|YOUR_\|window\.ENV\|process\.env")
          if [ -n "$STRIPE_PK" ]; then
            echo "::error::Hardcoded Stripe live publishable key detected in source code! Use window.ENV.STRIPE_PUBLISHABLE_KEY instead."
            echo "$STRIPE_PK"
            FAILED=1
          fi

          # Stripe TEST publishable key hardcoded (pk_test_) — should use window.ENV
          echo "🔍 Checking for hardcoded Stripe test publishable keys..."
          STRIPE_TEST_PK=$(grep "${SCAN_ARGS[@]}" \
            -P '["'"'"']pk_test_[0-9a-zA-Z]{24,}["'"'"']' . 2>/dev/null | \
            grep -v "placeholder\|example\|YOUR_\|window\.ENV\|process\.env")
          if [ -n "$STRIPE_TEST_PK" ]; then
            echo "::error::Hardcoded Stripe test publishable key detected in source code! Use window.ENV.STRIPE_PUBLISHABLE_KEY instead."
            echo "$STRIPE_TEST_PK"
            FAILED=1
          fi

          # OpenAI secret key (sk-proj- or sk-[48+ chars]) hardcoded
          echo "🔍 Checking for hardcoded OpenAI API keys..."
          OPENAI_KEY=$(grep "${SCAN_ARGS[@]}" \
            -P '["'"'"']sk-[a-zA-Z0-9]{48,}["'"'"']' . 2>/dev/null | \
            grep -v "placeholder\|example\|YOUR_\|abcdefgh\|window\.ENV\|process\.env")
          if [ -n "$OPENAI_KEY" ]; then
            echo "::error::Hardcoded OpenAI API key detected in source code!"
            echo "$OPENAI_KEY"
            FAILED=1
          fi

          # GitHub PAT (ghp_... or github_pat_...)
          echo "🔍 Checking for hardcoded GitHub tokens..."
          GH_TOKEN=$(grep "${SCAN_ARGS[@]}" -P '["'"'"']ghp_[a-zA-Z0-9]{36,}["'"'"']' . 2>/dev/null | \
            grep -v "placeholder\|example\|YOUR_\|window\.ENV\|process\.env")
          if [ -n "$GH_TOKEN" ]; then
            echo "::error::Hardcoded GitHub personal access token detected in source code!"
            echo "$GH_TOKEN"
            FAILED=1
          fi

          # Committed .env file (not .env.example)
          echo "🔍 Checking for committed .env file..."
          if [ -f ".env" ]; then
            echo "::error::.env file is committed to the repository — remove it and rotate all secrets!"
            FAILED=1
          fi

          # Private key blocks
          echo "🔍 Checking for private key blocks..."
          PRIVATE_KEYS=$(grep "${SCAN_ARGS[@]}" "^-----BEGIN.*PRIVATE KEY" . 2>/dev/null)
          if [ -n "$PRIVATE_KEYS" ]; then
            echo "::error::Private key block detected in source code!"
            echo "$PRIVATE_KEYS"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ Secret scan FAILED — rotate any exposed credentials immediately!"
            exit 1
          fi

          echo "✅ No hardcoded secrets detected."

  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — npm dependency security audit
  # ─────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    # Skip when triggered by automation bots to avoid notification spam.
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run npm security audit
        run: |
          npm audit --audit-level=high --json > /tmp/audit-report.json || true

          if command -v jq &>/dev/null; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/audit-report.json 2>/dev/null || echo 0)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/audit-report.json 2>/dev/null || echo 0)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' /tmp/audit-report.json 2>/dev/null || echo 0)

            echo "Vulnerability summary: critical=$CRITICAL high=$HIGH moderate=$MODERATE"

            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical severity npm vulnerabilities. Run 'npm audit fix'."
              exit 1
            fi
            if [ "$HIGH" -gt 0 ]; then
              echo "::error::Found $HIGH high severity npm vulnerabilities. Run 'npm audit fix'."
              exit 1
            fi
            echo "✅ No critical or high severity npm vulnerabilities found."
          else
            npm audit --audit-level=high
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Summary gate — always runs so GitHub required-status-checks resolve to
  # success or failure rather than staying in "action_required" / "expected"
  # state when all other jobs are skipped by the bot actor filter.
  # ─────────────────────────────────────────────────────────────────────────
  scan-pass:
    name: Secret Scan Pass
    runs-on: ubuntu-latest
    needs: [pattern-scan, npm-audit]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          scan="${{ needs.pattern-scan.result }}"
          audit="${{ needs.npm-audit.result }}"
          echo "pattern-scan=$scan  npm-audit=$audit"
          if [ "$scan" = "failure" ] || [ "$audit" = "failure" ]; then
            echo "::error::One or more secret scanning jobs failed — see above for details"
            exit 1
          fi
          echo "✅ All secret scanning checks passed (or were skipped)"
