# CI — Lint and Test
#
# Purpose: Validate code quality and run tests on every pull request and push to main.
#          Catches regressions, security issues, and quality problems before merge.
#
# Triggers: All pull requests, pushes to main, and manual dispatch
# Critical: NO — informational; failures block merge but not production
#
# Jobs:
#   1. lint        — npm audit, check for exposed secrets
#   2. test        — run existing test suite (npm test)
#   3. build       — verify the build step succeeds (npm run build)

name: CI — Lint and Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: Security & Quality Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run npm security audit
        run: |
          npm audit --audit-level=high --json > /tmp/audit-report.json || true

          if command -v jq &>/dev/null; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/audit-report.json 2>/dev/null || echo 0)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/audit-report.json 2>/dev/null || echo 0)
            echo "Critical: $CRITICAL, High: $HIGH"
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical severity vulnerabilities. Run 'npm audit fix' locally."
              exit 1
            fi
            if [ "$HIGH" -gt 3 ]; then
              echo "::warning::Found $HIGH high severity vulnerabilities. Consider running 'npm audit fix'."
            fi
          else
            echo "jq not available — skipping structured audit parsing"
          fi

      - name: Check for exposed secrets patterns
        run: |
          FAILED=0

          # Check for live PayPal/Stripe keys accidentally committed
          if grep -r "sk_live_" . \
              --include="*.js" --include="*.html" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git -l 2>/dev/null; then
            echo "::error::Potential live Stripe key found in committed files"
            FAILED=1
          fi

          # Check for hardcoded private key headers (line-start anchor avoids false positives
          # from regex strings in code that reference the pattern for detection purposes)
          if grep -rln "^-----BEGIN.*PRIVATE KEY" . \
              --include="*.js" --include="*.html" --include="*.ts" --include="*.json" \
              --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null | grep -q .; then
            echo "::error::Potential private key found in committed files"
            FAILED=1
          fi

          # Check for accidental .env file commits (not .env.example)
          if [ -f ".env" ]; then
            echo "::error::.env file is committed — remove it immediately and rotate all secrets"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "✅ No exposed secret patterns detected"

      - name: Validate semantic index
        run: |
          validate_json() {
            local file="$1"
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" \
              && echo "✅ $file is valid JSON" \
              || { echo "::error::$file is invalid JSON"; return 1; }
          }
          FAILED=0
          if [ -f "semantic-index/manifest.json" ]; then
            validate_json "semantic-index/manifest.json" || FAILED=1
          fi
          for f in semantic-index/subsystems/*.json; do
            [ -f "$f" ] || continue
            validate_json "$f" || FAILED=1
          done
          # Validate tools-catalog.json and llm-context.json if they exist
          for f in tools-catalog.json llm-context.json; do
            [ -f "$f" ] && { validate_json "$f" || FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Verify tools catalog is current
        run: |
          if [ -f "tools-catalog.json" ] && [ -f "scripts/sync-forges.js" ]; then
            node scripts/sync-forges.js --verify && echo "✅ tools-catalog.json is current" \
              || echo "::warning::tools-catalog.json may be out of date — run 'npm run sync:forges'"
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run tests
        run: npm test
        env:
          CI: true
        continue-on-error: false

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run build
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output directory exists"
            ls -la dist/ | head -20
          else
            echo "::warning::No dist/ directory produced — build may be a no-op"
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn
