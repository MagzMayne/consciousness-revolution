# CI — Lint and Test
#
# Purpose: Validate code quality and run tests on every pull request and push to main.
#          Catches regressions, security issues, and quality problems before merge.
#
# Triggers: All pull requests, pushes to main, and manual dispatch
# Critical: NO — informational; failures block merge but not production
#
# Jobs:
#   1. lint        — npm audit, check for exposed secrets
#   2. test        — run existing test suite (npm test)
#   3. build       — verify the build step succeeds (npm run build)

name: CI — Lint and Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel any in-progress run for the same PR/branch so rapid pushes don't
# pile up duplicate workflow runs (and duplicate notifications).
concurrency:
  group: ci-lint-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: Security & Quality Lint
    runs-on: ubuntu-latest
    # Skip when triggered by automation bots to avoid notification spam.
    # Copilot SWE agent actor is "Copilot"; github-actions bot is "github-actions[bot]".
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run npm security audit
        run: |
          npm audit --audit-level=high --json > /tmp/audit-report.json || true

          if command -v jq &>/dev/null; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/audit-report.json 2>/dev/null || echo 0)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/audit-report.json 2>/dev/null || echo 0)
            echo "Critical: $CRITICAL, High: $HIGH"
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical severity vulnerabilities. Run 'npm audit fix' locally."
              exit 1
            fi
            if [ "$HIGH" -gt 3 ]; then
              echo "::warning::Found $HIGH high severity vulnerabilities. Consider running 'npm audit fix'."
            fi
          else
            echo "jq not available — skipping structured audit parsing"
          fi

      - name: Check for exposed secrets patterns
        run: |
          FAILED=0

          # Check for live Stripe SECRET keys (sk_live_) accidentally committed
          if grep -rn "sk_live_" . \
              --include="*.js" --include="*.html" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git \
              --exclude-dir=.archive --exclude-dir=.backups 2>/dev/null | \
              grep -v "placeholder\|example\|YOUR_\|process\.env\|window\.ENV" | grep -q .; then
            echo "::error::Stripe live SECRET key (sk_live_) found in committed files"
            FAILED=1
          fi

          # Check for hardcoded Google/Firebase/Gemini API keys (AIza...)
          if grep -rn \
              --include="*.js" --include="*.mjs" --include="*.html" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git \
              --exclude-dir=.archive --exclude-dir=.backups --exclude-dir=tools \
              --exclude="scripts/pre-commit-hook.js" --exclude="backend-health-checker.js" \
              -P '["'"'"']AIza[0-9A-Za-z_-]{35}["'"'"']' . 2>/dev/null | \
              grep -v "Dummy\|dummy\|example\|placeholder\|YOUR_\|window\.ENV\|process\.env" | grep -q .; then
            echo "::error::Hardcoded Google/Firebase/Gemini API key (AIza...) found in committed files. Use window.ENV.FIREBASE_API_KEY / window.ENV.GEMINI_API_KEY instead."
            FAILED=1
          fi

          # Check for hardcoded Stripe live publishable key (pk_live_)
          if grep -rn \
              --include="*.js" --include="*.mjs" --include="*.html" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git \
              --exclude-dir=.archive --exclude-dir=.backups --exclude-dir=tools \
              -P '["'"'"']pk_live_[0-9a-zA-Z]{24,}["'"'"']' . 2>/dev/null | \
              grep -v "placeholder\|example\|YOUR_\|window\.ENV\|process\.env" | grep -q .; then
            echo "::error::Hardcoded Stripe live publishable key (pk_live_) found in committed files. Use window.ENV.STRIPE_PUBLISHABLE_KEY instead."
            FAILED=1
          fi

          # Check for hardcoded private key headers (line-start anchor avoids false positives
          # from regex strings in code that reference the pattern for detection purposes)
          if grep -rln "^-----BEGIN.*PRIVATE KEY" . \
              --include="*.js" --include="*.html" --include="*.ts" --include="*.json" \
              --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null | grep -q .; then
            echo "::error::Potential private key found in committed files"
            FAILED=1
          fi

          # Check for accidental .env file commits (not .env.example)
          if [ -f ".env" ]; then
            echo "::error::.env file is committed — remove it immediately and rotate all secrets"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "✅ No exposed secret patterns detected"

      - name: Validate semantic index
        run: |
          validate_json() {
            local file="$1"
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" \
              && echo "✅ $file is valid JSON" \
              || { echo "::error::$file is invalid JSON"; return 1; }
          }
          FAILED=0
          if [ -f "semantic-index/manifest.json" ]; then
            validate_json "semantic-index/manifest.json" || FAILED=1
          fi
          for f in semantic-index/subsystems/*.json; do
            [ -f "$f" ] || continue
            validate_json "$f" || FAILED=1
          done
          # Validate tools-catalog.json and llm-context.json if they exist
          for f in tools-catalog.json llm-context.json; do
            [ -f "$f" ] && { validate_json "$f" || FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Verify tools catalog is current
        run: |
          if [ -f "tools-catalog.json" ] && [ -f "scripts/sync-forges.js" ]; then
            node scripts/sync-forges.js --verify && echo "✅ tools-catalog.json is current" \
              || echo "::warning::tools-catalog.json may be out of date — run 'npm run sync:forges'"
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    # Same bot filter as the lint job above
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run tests
        # Use test:ci (node tests/run-all.js) — the deterministic unit suite.
        # npm test also runs test-banksky.js which requires live backend
        # services unavailable in GitHub Actions runners.
        run: npm run test:ci
        env:
          CI: true

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: lint
    # Same bot filter as the lint job above
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run build
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output directory exists"
            ls -la dist/ | head -20
          else
            echo "::warning::No dist/ directory produced — build may be a no-op"
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Summary gate — always runs so GitHub required-status-checks resolve to
  # success or failure rather than staying in "action_required" / "expected"
  # state when all other jobs are skipped by the bot actor filter above.
  # ─────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          lint="${{ needs.lint.result }}"
          test="${{ needs.test.result }}"
          build="${{ needs.build.result }}"
          echo "lint=$lint  test=$test  build=$build"
          if [ "$lint" = "failure" ] || [ "$test" = "failure" ] || [ "$build" = "failure" ]; then
            echo "::error::One or more CI jobs failed — see above for details"
            exit 1
          fi
          echo "✅ All CI checks passed (or were skipped)"
