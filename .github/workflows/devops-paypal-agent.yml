# DevOps + PayPal Sales Agent
#
# Purpose: Automates the full DevOps lifecycle for BarbrickDesign product commerce:
#   1. PLAN   — validate product catalog and pricing integrity
#   2. BUILD  — verify PayPal checkout function deploys cleanly
#   3. TEST   — run payment-flow unit tests
#   4. MONITOR — health-check live PayPal endpoint and report sales system status
#   5. ALERT  — post summary to GitHub step summary for observability
#
# Triggers:
#   - Push / PR to main or master (CODE + BUILD + TEST)
#   - Schedule: daily at 08:00 UTC (MONITOR)
#   - Manual dispatch (all phases)
#
# Critical: YES — payment system availability affects revenue
# Contact: BarbrickDesign@gmail.com
# Author: Barbrick Design DevOps Agent (Merlin AI)

name: DevOps + PayPal Sales Agent

on:
  push:
    branches: [main, master]
    paths:
      - 'netlify/functions/paypal-checkout.mjs'
      - 'netlify/functions/contributor-paypal-webhook.mjs'
      - 'netlify/functions/paypal-payout.mjs'
      - 'src/utils/paypal-integration.js'
      - 'barbrick-design-store.html'
      - 'store.html'
      - 'tests/paypal-checkout.test.js'
      - '.github/workflows/devops-paypal-agent.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'netlify/functions/paypal-checkout.mjs'
      - 'netlify/functions/contributor-paypal-webhook.mjs'
      - 'netlify/functions/paypal-payout.mjs'
      - 'src/utils/paypal-integration.js'
      - 'barbrick-design-store.html'
      - 'store.html'
      - 'tests/paypal-checkout.test.js'
      - '.github/workflows/devops-paypal-agent.yml'
  schedule:
    # Daily at 08:00 UTC — continuous monitoring
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      skip_monitor:
        description: 'Skip live monitoring (useful for dry-run CI)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: devops-paypal-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  NODE_VERSION: '18'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Validate payment files
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate Payment Files
    runs-on: ubuntu-latest
    # Skip bot-triggered runs to avoid notification spam
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      # ── Syntax validation ──────────────────────────────────────────────────
      - name: Validate paypal-checkout.mjs syntax
        run: |
          node --input-type=module < /dev/null 2>/dev/null || true
          # Check each payment function compiles without syntax errors
          for f in \
            netlify/functions/paypal-checkout.mjs \
            netlify/functions/contributor-paypal-webhook.mjs \
            netlify/functions/paypal-payout.mjs; do
            if [ -f "$f" ]; then
              node --check "$f" && echo "✅ $f — syntax OK" || {
                echo "::error file=$f::Syntax error in $f"
                exit 1
              }
            fi
          done

      # ── Secret hygiene ─────────────────────────────────────────────────────
      - name: Check payment files for hardcoded secrets
        run: |
          FAILED=0
          for f in \
            netlify/functions/paypal-checkout.mjs \
            netlify/functions/contributor-paypal-webhook.mjs \
            src/utils/paypal-integration.js \
            barbrick-design-store.html; do
            [ -f "$f" ] || continue

            # Must not contain live PayPal client secrets hardcoded
            if grep -qn "PAYPAL_CLIENT_SECRET\s*=\s*['\"][A-Za-z0-9_-]\{10,\}" "$f" 2>/dev/null; then
              echo "::error file=$f::Potential hardcoded PayPal secret found in $f"
              FAILED=1
            fi

            # Must not contain live Stripe keys
            if grep -qn "sk_live_" "$f" 2>/dev/null; then
              echo "::error file=$f::Live Stripe key in $f"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] && echo "✅ No hardcoded secrets detected in payment files"
          [ "$FAILED" -eq 0 ] || exit 1

      # ── Environment variable documentation check ───────────────────────────
      - name: Verify required env vars are documented
        run: |
          REQUIRED_VARS="PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET PAYPAL_MODE"
          CHECKOUT_FILE="netlify/functions/paypal-checkout.mjs"
          FAILED=0
          for var in $REQUIRED_VARS; do
            if ! grep -q "$var" "$CHECKOUT_FILE"; then
              echo "::warning::$var not referenced in $CHECKOUT_FILE"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] && echo "✅ All required env vars referenced in checkout function"

      # ── Store page HTML validation ─────────────────────────────────────────
      - name: Validate store page structure
        run: |
          STORE="barbrick-design-store.html"
          FAILED=0
          # Must have PayPal-related endpoints
          grep -q "paypal-checkout" "$STORE" || { echo "::warning::Store page missing paypal-checkout API calls"; FAILED=1; }
          # Must have ARIA labels for accessibility
          grep -q 'aria-label' "$STORE" || { echo "::warning::Store page missing aria-label attributes"; FAILED=1; }
          # Must have viewport meta tag
          grep -q 'viewport' "$STORE" || { echo "::error file=$STORE::Missing viewport meta tag in store page"; FAILED=1; }
          # Must reference BarbrickDesign email
          grep -q 'BarbrickDesign@gmail.com' "$STORE" || { echo "::warning::Store page missing BarbrickDesign@gmail.com contact"; }
          [ "$FAILED" -eq 0 ] && echo "✅ Store page structure valid"
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Write validate summary
        run: |
          echo "## ✅ Payment File Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Syntax (paypal-checkout.mjs) | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret hygiene | ✅ Clean |" >> $GITHUB_STEP_SUMMARY
          echo "| Env var documentation | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Store page structure | ✅ Valid |" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Payment flow unit tests
# ─────────────────────────────────────────────────────────────────────────────
  test-payment-flow:
    name: Payment Flow Tests
    runs-on: ubuntu-latest
    needs: validate
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run PayPal checkout tests
        run: |
          if [ -f "tests/paypal-checkout.test.js" ]; then
            node tests/paypal-checkout.test.js
          else
            echo "::notice::tests/paypal-checkout.test.js not found — skipping dedicated payment tests"
          fi
        env:
          CI: true
          # Use sandbox mode for all CI testing
          PAYPAL_MODE: sandbox

      - name: Run full test suite
        run: npm run test:ci
        env:
          CI: true

      - name: Write test summary
        run: |
          echo "## ✅ Payment Flow Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All unit tests passed with \`PAYPAL_MODE=sandbox\`." >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Live payment system monitoring
# Runs on schedule and manual dispatch; skipped on PR to avoid external calls
# ─────────────────────────────────────────────────────────────────────────────
  monitor:
    name: Payment System Monitor
    runs-on: ubuntu-latest
    # Only on schedule and manual dispatch (not PR)
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.skip_monitor != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PayPal endpoint health (Netlify)
        id: paypal_health
        run: |
          # Use a repository variable if configured, otherwise fall back to the known production URL.
          BASE_URL="${{ vars.SITE_URL || 'https://consciousnessrevolution.io' }}"
          HEALTH_URL="$BASE_URL/.netlify/functions/paypal-checkout/health"
          echo "Checking: $HEALTH_URL"

          STATUS=$(curl -s -o /tmp/health-response.json \
            -w "%{http_code}" \
            "$HEALTH_URL" 2>/dev/null || echo "000")

          echo "http_status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" = "200" ]; then
            CONFIGURED=$(jq -r '.configured // false' /tmp/health-response.json 2>/dev/null || echo "false")
            MODE=$(jq -r '.mode // "unknown"' /tmp/health-response.json 2>/dev/null || echo "unknown")
            echo "paypal_configured=$CONFIGURED" >> $GITHUB_OUTPUT
            echo "paypal_mode=$MODE" >> $GITHUB_OUTPUT
            echo "PayPal endpoint: HTTP $STATUS | configured=$CONFIGURED | mode=$MODE"
          else
            echo "paypal_configured=false" >> $GITHUB_OUTPUT
            echo "paypal_mode=unknown" >> $GITHUB_OUTPUT
            echo "::warning::PayPal health check returned HTTP $STATUS"
          fi

      - name: Check contributor webhook health
        id: webhook_health
        run: |
          BASE_URL="${{ vars.SITE_URL || 'https://consciousnessrevolution.io' }}"
          # Ping with OPTIONS to check function is deployed
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X OPTIONS \
            "$BASE_URL/.netlify/functions/contributor-paypal-webhook" \
            2>/dev/null || echo "000")
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Contributor webhook: HTTP $STATUS"

      - name: Generate monitoring report
        run: |
          PAYPAL_STATUS="${{ steps.paypal_health.outputs.http_status }}"
          PAYPAL_CONFIGURED="${{ steps.paypal_health.outputs.paypal_configured }}"
          PAYPAL_MODE="${{ steps.paypal_health.outputs.paypal_mode }}"
          WEBHOOK_STATUS="${{ steps.webhook_health.outputs.http_status }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "## 📊 BarbrickDesign Payment System Monitor" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report Time:** $TIMESTAMP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoint Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | HTTP Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|---------|" >> $GITHUB_STEP_SUMMARY

          # PayPal checkout
          if [ "$PAYPAL_STATUS" = "200" ]; then
            echo "| PayPal Checkout | ✅ $PAYPAL_STATUS | mode=$PAYPAL_MODE, configured=$PAYPAL_CONFIGURED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| PayPal Checkout | ⚠️ $PAYPAL_STATUS | Check Netlify logs |" >> $GITHUB_STEP_SUMMARY
          fi

          # Contributor webhook
          if [ "$WEBHOOK_STATUS" = "200" ] || [ "$WEBHOOK_STATUS" = "204" ] || [ "$WEBHOOK_STATUS" = "405" ]; then
            echo "| Contributor Webhook | ✅ deployed | HTTP $WEBHOOK_STATUS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Contributor Webhook | ⚠️ $WEBHOOK_STATUS | Check Netlify logs |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DevOps Checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Payment files syntactically valid" >> $GITHUB_STEP_SUMMARY
          echo "- [x] No hardcoded secrets in payment files" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Endpoint health checks completed" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Review Netlify function logs if any endpoint returned non-200" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Set \`PAYPAL_CLIENT_ID\`, \`PAYPAL_CLIENT_SECRET\`, \`PAYPAL_MODE=live\` in Netlify environment variables" >> $GITHUB_STEP_SUMMARY
          echo "- Configure PayPal webhook URL: \`https://consciousnessrevolution.io/.netlify/functions/contributor-paypal-webhook\`" >> $GITHUB_STEP_SUMMARY
          echo "- Subscribe to PayPal events: \`PAYMENT.CAPTURE.COMPLETED\`, \`CHECKOUT.ORDER.COMPLETED\`" >> $GITHUB_STEP_SUMMARY
          echo "- Set \`CONTRIBUTOR_PAYPAL_WEBHOOK_ID\` in Netlify from the webhook dashboard" >> $GITHUB_STEP_SUMMARY

      - name: Alert on critical failures
        if: steps.paypal_health.outputs.http_status != '200'
        uses: actions/github-script@v7
        with:
          script: |
            const paypalStatus = '${{ steps.paypal_health.outputs.http_status }}';
            const timestamp = new Date().toISOString();

            // Search for existing open alert issues to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'payment-system,monitoring-alert',
              per_page: 5
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ PayPal Checkout Endpoint Unhealthy — HTTP ${paypalStatus}`,
                body: [
                  '## Payment System Alert',
                  '',
                  `The PayPal checkout health check returned HTTP **${paypalStatus}** at ${timestamp}.`,
                  '',
                  '### Impact',
                  '- Product purchases via BarbrickDesign Store may be unavailable',
                  '- Revenue generation is at risk',
                  '',
                  '### Immediate Actions',
                  '1. Check Netlify function logs for `paypal-checkout`',
                  '2. Verify `PAYPAL_CLIENT_ID` and `PAYPAL_CLIENT_SECRET` are set in Netlify',
                  '3. Check `PAYPAL_MODE` is set correctly (`live` or `sandbox`)',
                  '4. Review recent deployments for regressions',
                  '',
                  `[View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                  '',
                  '---',
                  '*Automated by DevOps + PayPal Sales Agent*'
                ].join('\n'),
                labels: ['payment-system', 'monitoring-alert', 'revenue-critical']
              });
              core.warning(`Created alert issue for PayPal endpoint HTTP ${paypalStatus}`);
            } else {
              core.info(`Existing alert issue found (#${issues[0].number}) — skipping duplicate`);
            }

# ─────────────────────────────────────────────────────────────────────────────
# Summary gate — resolves required-status-checks even when jobs are skipped
# ─────────────────────────────────────────────────────────────────────────────
  agent-pass:
    name: DevOps Agent Pass
    runs-on: ubuntu-latest
    needs: [validate, test-payment-flow]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          validate="${{ needs.validate.result }}"
          tests="${{ needs.test-payment-flow.result }}"
          echo "validate=$validate  tests=$tests"
          if [ "$validate" = "failure" ] || [ "$tests" = "failure" ]; then
            echo "::error::DevOps + PayPal Agent: one or more jobs failed"
            exit 1
          fi
          echo "✅ DevOps + PayPal Agent: all checks passed (or skipped)"
