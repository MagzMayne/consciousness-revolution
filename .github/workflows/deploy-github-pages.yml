# GitHub Pages Deployment - Fallback when Netlify is down
#
# Purpose: Deploy the static site to GitHub Pages as a backup hosting option.
#          When Netlify is unavailable, the site remains accessible at:
#          https://overkor-tek.github.io/consciousness-revolution/
#          (or at the custom domain if DNS is updated to point to GitHub Pages)
#
# Triggers: Every push to main/master, plus manual dispatch
# Critical: YES - Provides site availability when Netlify is down
#
# Note: This workflow pushes to the gh-pages branch. In GitHub repository
# Settings → Pages, set the source to "Deploy from a branch" → gh-pages / root.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          # This repo's static site lives at the repo root (300+ HTML files).
          # GitHub Pages never serves .git/ or .github/, so deploying from .
          # is safe and correct here.
          folder: .
          # Remove stale files from the gh-pages branch so deleted source
          # files don't linger in the deployment.
          clean: true

      - name: Report deployment
        run: |
          echo "## GitHub Pages Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://overkor-tek.github.io/consciousness-revolution/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Content deployed to the \`gh-pages\` branch." >> $GITHUB_STEP_SUMMARY
          echo "Ensure GitHub Pages source is set to: **gh-pages branch / root**" >> $GITHUB_STEP_SUMMARY
