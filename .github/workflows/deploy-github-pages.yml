# GitHub Pages Deployment - Fallback when Netlify is down
#
# Purpose: Deploy the static site to GitHub Pages as a backup hosting option.
#          When Netlify is unavailable, the site remains accessible at:
#          https://overkor-tek.github.io/consciousness-revolution/
#
# Why this workflow exists:
#   The primary site runs on Netlify (consciousnessrevolution.io).  When Netlify
#   is unavailable (e.g. payment pending), GitHub Pages at the github.io URL
#   serves as an automatic backup.
#
# Two problems this workflow solves:
#   1. CNAME redirect: If the CNAME file is included in the deployment, GitHub
#      Pages redirects the github.io URL to the custom domain, which defeats the
#      purpose of the backup.  We therefore exclude CNAME from the deployment.
#   2. Root-relative paths: The source files use root-relative paths (e.g.
#      src="/js/foo.js") that work fine at a domain root but break when the site
#      is served at the /consciousness-revolution/ subpath on GitHub Pages.
#      A path-fixing script rewrites those paths before publishing.
#
# Triggers: Every push to main/master, plus manual dispatch
# Critical: YES - Provides site availability when Netlify is down
#
# Note: In GitHub repository Settings → Pages, set the source to
#       "Deploy from a branch" → gh-pages / root.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/gh-pages-deploy
          # Copy all files except CNAME and node_modules.
          # Excluding CNAME prevents GitHub Pages from configuring a custom-domain
          # redirect that would send github.io visitors to the (potentially down)
          # Netlify domain.
          rsync -a \
            --exclude='.git' \
            --exclude='CNAME' \
            --exclude='node_modules' \
            . /tmp/gh-pages-deploy/

          # Rewrite root-relative paths (e.g. src="/js/foo.js") so they resolve
          # correctly when served from the /consciousness-revolution/ subpath.
          python3 .github/scripts/fix-gh-pages-paths.py /tmp/gh-pages-deploy

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: /tmp/gh-pages-deploy
          # Remove stale files from the gh-pages branch so deleted source
          # files don't linger in the deployment.
          clean: true

      - name: Report deployment
        run: |
          echo "## GitHub Pages Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://overkor-tek.github.io/consciousness-revolution/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CNAME excluded – github.io URL is served directly (no Netlify redirect)." >> $GITHUB_STEP_SUMMARY
          echo "Ensure GitHub Pages source is set to: **gh-pages branch / root**" >> $GITHUB_STEP_SUMMARY
