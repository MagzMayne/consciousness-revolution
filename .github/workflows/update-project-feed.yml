name: Update Project Feed

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.html'
      - '!node_modules/**'
      - '!vendor/**'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Scan for new projects
        id: scan
        run: |
          echo "Scanning for HTML project files..."
          node .github/scripts/scan-projects.js

      - name: Update projects.json
        run: |
          echo "Updating projects.json with new entries..."
          node .github/scripts/update-projects-json.js

      - name: Update README.md
        run: |
          echo "Updating README.md with recent projects..."
          node .github/scripts/update-readme.js

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git add projects.json README.md
            git commit -m "🤖 Auto-update: New projects detected and added to feed [skip ci]" || echo "Nothing to commit"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create project feed summary
        if: success()
        run: |
          echo "## 📊 Project Feed Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Projects scanned and feed updated successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Updated Files:**" >> $GITHUB_STEP_SUMMARY
          echo "- projects.json" >> $GITHUB_STEP_SUMMARY
          echo "- README.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
