# Release Engineering Pipeline
#
# Purpose: Package, tag, and publish a new platform release.
#          Creates a GitHub Release with packaged bundles for:
#          - consciousness-core (semantic index, architecture docs, agent tools)
#          - static-ui-bundle   (HTML pages, CSS, JS assets)
#          - backend-services   (backend/ and netlify/ packages)
#
# Triggers: Manual dispatch with version input; automatic on semver tags (v*.*.*)
# Critical: NO — releases are additive; does not modify running production
#
# How to use:
#   1. Manual: GitHub Actions → Release Engineering → Run workflow → enter version
#   2. Automatic: Push a git tag like v0.2.0 to trigger release

name: Release Engineering

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NODE_VERSION: '18'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Ensure version starts with 'v'
          [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Validate CHANGELOG entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Strip leading 'v' for CHANGELOG lookup
          VER="${VERSION#v}"
          if grep -q "\[$VER\]" CHANGELOG.md 2>/dev/null; then
            echo "✅ CHANGELOG entry found for $VER"
          else
            echo "::warning::No CHANGELOG entry found for $VER — consider updating CHANGELOG.md before releasing"
          fi

  build-packages:
    name: Build Release Packages
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run tests before packaging
        run: npm test
        env:
          CI: true

      - name: Run build
        run: npm run build

      - name: Package — consciousness-core
        run: |
          mkdir -p /tmp/release-packages/consciousness-core
          # Architecture and documentation
          cp PLATFORM_OVERVIEW.md /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          cp ARCHITECTURE.md /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          cp CHANGELOG.md /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          cp README.md /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          cp .env.example /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          # Semantic index
          cp -r semantic-index/ /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          # Agent instructions
          cp -r agent/ /tmp/release-packages/consciousness-core/ 2>/dev/null || true
          # Sync protocol
          cp -r .consciousness/ /tmp/release-packages/consciousness-core/ 2>/dev/null || true

          cd /tmp/release-packages
          tar -czf consciousness-core-${{ needs.prepare-release.outputs.version }}.tar.gz consciousness-core/
          echo "✅ consciousness-core package created"

      - name: Package — static-ui-bundle
        run: |
          mkdir -p /tmp/release-packages/static-ui
          # Copy built output if it exists
          if [ -d "dist" ]; then
            cp -r dist/. /tmp/release-packages/static-ui/
          else
            # Fall back to source HTML/CSS/JS
            find . -maxdepth 1 -name "*.html" -exec cp -t /tmp/release-packages/static-ui/ {} + 2>/dev/null || true
            cp -r css/ /tmp/release-packages/static-ui/ 2>/dev/null || true
            cp -r CSS/ /tmp/release-packages/static-ui/ 2>/dev/null || true
            cp -r js/ /tmp/release-packages/static-ui/ 2>/dev/null || true
            cp -r images/ /tmp/release-packages/static-ui/ 2>/dev/null || true
          fi

          cd /tmp/release-packages
          tar -czf static-ui-bundle-${{ needs.prepare-release.outputs.version }}.tar.gz static-ui/
          echo "✅ static-ui-bundle package created"

      - name: Package — backend-services
        run: |
          mkdir -p /tmp/release-packages/backend-services
          cp -r backend/ /tmp/release-packages/backend-services/ 2>/dev/null || true
          cp -r netlify/ /tmp/release-packages/backend-services/ 2>/dev/null || true
          cp netlify.toml /tmp/release-packages/backend-services/ 2>/dev/null || true
          cp package.json /tmp/release-packages/backend-services/ 2>/dev/null || true

          cd /tmp/release-packages
          tar -czf backend-services-${{ needs.prepare-release.outputs.version }}.tar.gz backend-services/
          echo "✅ backend-services package created"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ needs.prepare-release.outputs.version }}
          path: /tmp/release-packages/*.tar.gz
          retention-days: 30

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-packages]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.prepare-release.outputs.version }}
          path: /tmp/release-assets/

      - name: Extract CHANGELOG notes for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          VER="${VERSION#v}"
          # Extract section between this version and the next version header
          NOTES=$(awk "/^\#\# \[$VER\]/{found=1; next} found && /^\#\# \[/{exit} found{print}" CHANGELOG.md 2>/dev/null || echo "See CHANGELOG.md for full release notes.")
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for full release notes."
          fi
          # Write to file to preserve multi-line content
          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes extracted"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = '${{ needs.prepare-release.outputs.version }}';
            const isPrerelease = '${{ github.event.inputs.prerelease }}' === 'true';

            // Read release notes
            let body;
            try {
              body = fs.readFileSync('/tmp/release-notes.md', 'utf8').trim();
            } catch {
              body = 'See CHANGELOG.md for full release notes.';
            }

            // Create the release
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Consciousness Revolution ${version}`,
              body: `## What's in this release\n\n${body}\n\n---\n\n**Packages included:**\n- \`consciousness-core\` — architecture docs, semantic index, agent tools\n- \`static-ui-bundle\` — HTML pages and frontend assets\n- \`backend-services\` — Node.js backend and Netlify functions`,
              draft: false,
              prerelease: isPrerelease
            });

            console.log(`Created release: ${release.data.html_url}`);

            // Attach packages
            const assetsDir = '/tmp/release-assets/';
            const files = fs.readdirSync(assetsDir).filter(f => f.endsWith('.tar.gz'));
            for (const file of files) {
              const filePath = path.join(assetsDir, file);
              const fileData = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: fileData
              });
              console.log(`Uploaded asset: ${file}`);
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Release failed: ${{ needs.prepare-release.outputs.version }}`,
              body: 'The release engineering pipeline failed. Check the workflow run for details.',
              labels: ['bug', 'release']
            });
