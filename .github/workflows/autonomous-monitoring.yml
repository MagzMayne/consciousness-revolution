name: Autonomous Monitoring

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  comprehensive-testing:
    name: Comprehensive Functionality Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run functionality test suite
        id: tests
        run: |
          python3 FUNCTIONALITY_TEST_SUITE.py
          echo "test_status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: FUNCTIONALITY_TEST_RESULTS.json
          retention-days: 30
      
      - name: Check test results
        run: |
          if [ -f FUNCTIONALITY_TEST_RESULTS.json ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            total=$(python3 -c "import json; d=json.load(open('FUNCTIONALITY_TEST_RESULTS.json')); print(d['summary']['total_tests'])")
            passed=$(python3 -c "import json; d=json.load(open('FUNCTIONALITY_TEST_RESULTS.json')); print(d['summary']['passed'])")
            failed=$(python3 -c "import json; d=json.load(open('FUNCTIONALITY_TEST_RESULTS.json')); print(d['summary']['failed'])")
            rate=$(python3 -c "import json; d=json.load(open('FUNCTIONALITY_TEST_RESULTS.json')); print(f\"{d['summary']['success_rate']:.1f}\")")
            
            echo "Total Tests: $total" >> $GITHUB_STEP_SUMMARY
            echo "Passed: $passed ✅" >> $GITHUB_STEP_SUMMARY
            echo "Failed: $failed ❌" >> $GITHUB_STEP_SUMMARY
            echo "Success Rate: ${rate}%" >> $GITHUB_STEP_SUMMARY
          fi

  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run health monitor
        run: python3 SYSTEM_HEALTH_MONITOR.py || true
      
      - name: Count files
        run: |
          echo "## File Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- HTML files: $(find . -name '*.html' -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Python files: $(find . -name '*.py' -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript files: $(find . -name '*.js' -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
      
      - name: Check critical pages
        run: |
          echo "## Critical Pages Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          pages=("index.html" "login.html" "araya-chat.html" "consciousness-tools.html" "seven-domains.html" "start.html" "dashboard.html")
          
          for page in "${pages[@]}"; do
            if [ -f "$page" ]; then
              echo "- ✅ $page" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ $page (missing)" >> $GITHUB_STEP_SUMMARY
            fi
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Run npm audit
        run: |
          npm install --legacy-peer-deps
          npm audit --json > npm-audit.json || true
        continue-on-error: true
      
      - name: Check for vulnerabilities
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scan completed. Check npm-audit.json for details." >> $GITHUB_STEP_SUMMARY

  status-report:
    name: Generate Status Report
    runs-on: ubuntu-latest
    needs: [comprehensive-testing, health-check, security-scan]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Generate overall status
        run: |
          echo "# 🤖 Autonomous Monitoring Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All monitoring jobs completed. Check individual job results for details." >> $GITHUB_STEP_SUMMARY
