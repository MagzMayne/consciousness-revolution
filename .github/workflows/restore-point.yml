name: Autonomous Restore Point

on:
  workflow_dispatch:
  push:
    tags:
      - "restore-*"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          mkdir -p snapshots
          ts=$(date -u +"%Y%m%d-%H%M%S")
          git archive --format=tar.gz -o snapshots/repo-$ts.tar.gz HEAD

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: snapshots/
