# CI - Lint and Test (legacy compatibility shim)
#
# Purpose: Lightweight CI gate kept for backward compatibility with any branch
#          protection rules that reference this workflow name.  The authoritative
#          pipeline is ci-lint-test.yml which runs three parallel jobs (lint /
#          test / build) with full reporting.
#
# Triggers: PRs and pushes to main/master
# Critical: NO — informational; failures block merge but not production

name: CI - Lint and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel any in-progress run for the same PR/branch so rapid pushes don't
# pile up duplicate workflow runs (and duplicate notifications).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Skip when triggered by automation bots (Copilot SWE agent actor is "Copilot",
    # not "github-copilot[bot]", so the check must use the real login).
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --prefer-offline || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Run unit tests
        # Use test:ci (node tests/run-all.js) instead of npm test.
        # npm test also runs test-banksky.js which requires live backend
        # services that are unavailable in CI runners.
        run: npm run test:ci
        env:
          CI: true

  # Always-running gate job so required-status-checks resolve to success/failure
  # even when the ci job above is skipped (bot actor filter).  GitHub marks
  # skipped-only workflow runs as "action_required" which blocks branch protection.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check CI result
        run: |
          result="${{ needs.ci.result }}"
          if [ "$result" = "failure" ]; then
            echo "::error::CI job failed"
            exit 1
          fi
          echo "CI gate passed (result: $result)"
