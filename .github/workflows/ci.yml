name: CI - Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel any in-progress run for the same PR/branch so rapid pushes don't
# pile up duplicate workflow runs (and duplicate notifications).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Skip when triggered by automation bots (Copilot SWE agent actor is "Copilot",
    # not "github-copilot[bot]", so the check must use the real login).
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
