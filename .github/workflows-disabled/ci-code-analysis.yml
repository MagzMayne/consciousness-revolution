name: Comprehensive Code Analysis & Security

on:
  push:
    branches: [ main, master, develop, copilot/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  code-schema-analysis:
    name: Code Schema & Structure Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Analyze JavaScript Code Structure
        run: |
          echo "## 📊 Code Schema Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count file types
          JS_FILES=$(find . -name "*.js" ! -path "./node_modules/*" ! -path "./.git/*" | wc -l)
          HTML_FILES=$(find . -name "*.html" ! -path "./node_modules/*" ! -path "./.git/*" | wc -l)
          SOL_FILES=$(find . -name "*.sol" ! -path "./node_modules/*" ! -path "./.git/*" | wc -l)
          
          echo "### File Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript files: $JS_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- HTML files: $HTML_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- Solidity contracts: $SOL_FILES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Analyze JavaScript patterns
          echo "### JavaScript Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Check for async/await usage
          ASYNC_COUNT=$(grep -r "async " . --include="*.js" ! -path "./node_modules/*" | wc -l)
          echo "- Async functions: $ASYNC_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Check for fetch/axios usage
          API_CALLS=$(grep -r -E "(fetch\(|axios\.|\.get\(|\.post\()" . --include="*.js" ! -path "./node_modules/*" | wc -l)
          echo "- API calls detected: $API_CALLS" >> $GITHUB_STEP_SUMMARY
          
          # Check for event listeners
          EVENT_LISTENERS=$(grep -r "addEventListener" . --include="*.js" --include="*.html" ! -path "./node_modules/*" | wc -l)
          echo "- Event listeners: $EVENT_LISTENERS" >> $GITHUB_STEP_SUMMARY
          
          # Check for Web3/blockchain interactions
          WEB3_USAGE=$(grep -r -E "(web3|ethers|window\.ethereum)" . --include="*.js" --include="*.html" ! -path "./node_modules/*" | wc -l)
          echo "- Web3 interactions: $WEB3_USAGE" >> $GITHUB_STEP_SUMMARY
          
      - name: Analyze HTML Structure
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### HTML Structure Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Check for script tags
          INLINE_SCRIPTS=$(grep -r "<script>" . --include="*.html" | wc -l)
          EXTERNAL_SCRIPTS=$(grep -r "<script src=" . --include="*.html" | wc -l)
          echo "- Inline scripts: $INLINE_SCRIPTS" >> $GITHUB_STEP_SUMMARY
          echo "- External scripts: $EXTERNAL_SCRIPTS" >> $GITHUB_STEP_SUMMARY
          
          # Check for forms
          FORMS=$(grep -r "<form" . --include="*.html" | wc -l)
          echo "- Forms: $FORMS" >> $GITHUB_STEP_SUMMARY
          
          # Check for input fields
          INPUTS=$(grep -r "<input" . --include="*.html" | wc -l)
          echo "- Input fields: $INPUTS" >> $GITHUB_STEP_SUMMARY
      
      - name: Generate Code Quality Report
        run: |
          mkdir -p reports
          
          # Create a detailed code structure report
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          JS_COUNT=$(find . -name "*.js" ! -path "./node_modules/*" ! -path "./.git/*" | wc -l)
          HTML_COUNT=$(find . -name "*.html" ! -path "./node_modules/*" ! -path "./.git/*" | wc -l)
          SOL_COUNT=$(find . -name "*.sol" ! -path "./node_modules/*" ! -path "./.git/*" | wc -l)
          
          cat > reports/code-schema-report.json << EOF
          {
            "timestamp": "$TIMESTAMP",
            "analysis_type": "code_schema",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "statistics": {
              "javascript_files": $JS_COUNT,
              "html_files": $HTML_COUNT,
              "solidity_files": $SOL_COUNT
            }
          }
          EOF
          
          echo "✅ Code schema report generated"
      
      - name: Upload Code Schema Report
        uses: actions/upload-artifact@v4
        with:
          name: code-schema-report
          path: reports/code-schema-report.json
          retention-days: 90

  security-vulnerability-scan:
    name: Security Vulnerability Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Run npm audit
        continue-on-error: true
        run: |
          echo "## 🔒 Security Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          npm audit --json > npm-audit-report.json || true
          
          # Parse and display results
          if [ -f npm-audit-report.json ]; then
            CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
            HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
            MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit-report.json)
            LOW=$(jq -r '.metadata.vulnerabilities.low // 0' npm-audit-report.json)
            
            echo "### NPM Audit Results" >> $GITHUB_STEP_SUMMARY
            echo "- 🔴 Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- 🟠 High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- 🟡 Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
            echo "- 🟢 Low: $LOW" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Fail if critical or high vulnerabilities found
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "❌ Critical or high severity vulnerabilities detected!" >> $GITHUB_STEP_SUMMARY
              echo "Run 'npm audit fix' to address these issues." >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical or high severity vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Scan for hardcoded secrets
        run: |
          echo "### Secret Scanning" >> $GITHUB_STEP_SUMMARY
          
          # Check for common secret patterns
          SECRET_PATTERNS="api[_-]?key|secret|password|token|auth[_-]?key|private[_-]?key|access[_-]?key"
          
          # Scan JavaScript files
          POTENTIAL_SECRETS=$(grep -r -i -E "$SECRET_PATTERNS\s*=\s*['\"][^'\"]{10,}" . \
            --include="*.js" --include="*.html" \
            ! -path "./node_modules/*" ! -path "./.git/*" \
            ! -path "*/.env.example" \
            ! -path "*/test/*" \
            ! -path "*/tests/*" \
            || true)
          
          if [ -n "$POTENTIAL_SECRETS" ]; then
            echo "⚠️ Potential secrets found in code:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$POTENTIAL_SECRETS" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Please review these findings and ensure no actual secrets are committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No obvious hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Check for insecure dependencies
        run: |
          echo "### Dependency Security" >> $GITHUB_STEP_SUMMARY
          
          # Check for outdated packages
          npm outdated --json > outdated.json || true
          
          if [ -s outdated.json ]; then
            OUTDATED_COUNT=$(jq 'length' outdated.json)
            echo "- Outdated packages: $OUTDATED_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "Run 'npm update' to update dependencies" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Scan for XSS vulnerabilities
        run: |
          echo "### XSS Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          
          # Check for innerHTML usage without sanitization
          INNERHTML_USAGE=$(grep -r "innerHTML\s*=" . \
            --include="*.js" --include="*.html" \
            ! -path "./node_modules/*" ! -path "./.git/*" \
            || true)
          
          if [ -n "$INNERHTML_USAGE" ]; then
            INNERHTML_COUNT=$(echo "$INNERHTML_USAGE" | wc -l)
            echo "⚠️ Found $INNERHTML_COUNT instances of innerHTML usage" >> $GITHUB_STEP_SUMMARY
            echo "Please ensure proper input sanitization is in place" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No direct innerHTML usage found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            npm-audit-report.json
            outdated.json
          retention-days: 90

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  performance-analysis:
    name: Performance & Optimization Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Analyze Bundle Size
        run: |
          echo "## ⚡ Performance Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Calculate total JavaScript size
          JS_SIZE=$(find . -name "*.js" ! -path "./node_modules/*" ! -path "./.git/*" -exec du -ch {} + | grep total$ | awk '{print $1}')
          HTML_SIZE=$(find . -name "*.html" ! -path "./node_modules/*" ! -path "./.git/*" -exec du -ch {} + | grep total$ | awk '{print $1}')
          
          echo "- Total JavaScript: $JS_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Total HTML: $HTML_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Check for Performance Anti-patterns
        run: |
          echo "### Performance Checks" >> $GITHUB_STEP_SUMMARY
          
          # Check for synchronous XHR
          SYNC_XHR=$(grep -r "XMLHttpRequest" . --include="*.js" ! -path "./node_modules/*" | grep -v "async" || true)
          if [ -n "$SYNC_XHR" ]; then
            echo "⚠️ Synchronous XMLHttpRequest detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for document.write
          DOC_WRITE=$(grep -r "document\.write" . --include="*.js" --include="*.html" ! -path "./node_modules/*" || true)
          if [ -n "$DOC_WRITE" ]; then
            DOC_WRITE_COUNT=$(echo "$DOC_WRITE" | wc -l)
            echo "⚠️ Found $DOC_WRITE_COUNT instances of document.write (blocks rendering)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for large loops without optimization
          LARGE_LOOPS=$(grep -r "for.*length" . --include="*.js" ! -path "./node_modules/*" | wc -l)
          echo "- Loop optimizations to review: $LARGE_LOOPS" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Performance analysis complete" >> $GITHUB_STEP_SUMMARY
      
      - name: Analyze Code Complexity
        run: |
          echo "### Code Complexity Metrics" >> $GITHUB_STEP_SUMMARY
          
          # Count functions
          FUNCTION_COUNT=$(grep -r "function\s" . --include="*.js" ! -path "./node_modules/*" | wc -l)
          ARROW_FUNCTIONS=$(grep -r "=>" . --include="*.js" ! -path "./node_modules/*" | wc -l)
          
          echo "- Regular functions: $FUNCTION_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Arrow functions: $ARROW_FUNCTIONS" >> $GITHUB_STEP_SUMMARY
          
          # Calculate average file size
          AVG_JS_SIZE=$(find . -name "*.js" ! -path "./node_modules/*" ! -path "./.git/*" -exec wc -l {} \; | awk '{sum+=$1; count++} END {if(count>0) print int(sum/count); else print 0}')
          echo "- Average JavaScript file size: $AVG_JS_SIZE lines" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY

  solidity-security:
    name: Smart Contract Security
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/*.sol') != '' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Analyze Solidity Contracts
        run: |
          echo "## 🔐 Smart Contract Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count Solidity files
          SOL_FILES=$(find . -name "*.sol" ! -path "./node_modules/*" | wc -l)
          echo "- Solidity contracts found: $SOL_FILES" >> $GITHUB_STEP_SUMMARY
          
          # List contract files
          echo "### Contract Files" >> $GITHUB_STEP_SUMMARY
          find . -name "*.sol" ! -path "./node_modules/*" | while read file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Check for common vulnerabilities
        run: |
          echo "### Security Checks" >> $GITHUB_STEP_SUMMARY
          
          # Check for reentrancy patterns
          REENTRANCY=$(grep -r "\.call\.value" . --include="*.sol" || true)
          if [ -n "$REENTRANCY" ]; then
            echo "⚠️ Potential reentrancy vulnerability detected" >> $GITHUB_STEP_SUMMARY
            echo "Review call.value usage for proper checks-effects-interactions pattern" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for tx.origin usage
          TX_ORIGIN=$(grep -r "tx\.origin" . --include="*.sol" || true)
          if [ -n "$TX_ORIGIN" ]; then
            echo "⚠️ tx.origin usage detected (use msg.sender instead)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for timestamp dependence
          TIMESTAMP=$(grep -r "block\.timestamp\|now" . --include="*.sol" || true)
          if [ -n "$TIMESTAMP" ]; then
            echo "ℹ️ Timestamp dependence detected - review for manipulation risks" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Smart contract security scan complete" >> $GITHUB_STEP_SUMMARY

  code-quality-metrics:
    name: Code Quality & Best Practices
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Code Quality Checks
        run: |
          echo "## 📈 Code Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for console.log statements (should be removed in production)
          CONSOLE_LOGS=$(grep -r "console\.log" . --include="*.js" ! -path "./node_modules/*" ! -path "./tests/*" ! -path "./test/*" || true)
          if [ -n "$CONSOLE_LOGS" ]; then
            CONSOLE_COUNT=$(echo "$CONSOLE_LOGS" | wc -l)
            echo "⚠️ Found $CONSOLE_COUNT console.log statements" >> $GITHUB_STEP_SUMMARY
            echo "Consider removing debug logs from production code" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No console.log statements in production code" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for TODO/FIXME comments
          TODOS=$(grep -r "TODO\|FIXME" . --include="*.js" --include="*.html" ! -path "./node_modules/*" || true)
          if [ -n "$TODOS" ]; then
            TODO_COUNT=$(echo "$TODOS" | wc -l)
            echo "### TODO/FIXME Items: $TODO_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for proper error handling
          TRY_CATCH=$(grep -r "try\s*{" . --include="*.js" ! -path "./node_modules/*" | wc -l)
          echo "- Try-catch blocks: $TRY_CATCH" >> $GITHUB_STEP_SUMMARY
          
          # Check for comments
          COMMENTS=$(grep -r "//\|/\*" . --include="*.js" ! -path "./node_modules/*" | wc -l)
          echo "- Comment lines: $COMMENTS" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code quality analysis complete" >> $GITHUB_STEP_SUMMARY

  comprehensive-report:
    name: Generate Comprehensive Report
    needs: [code-schema-analysis, security-vulnerability-scan, performance-analysis, code-quality-metrics]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        continue-on-error: true
      
      - name: Generate Summary Report
        run: |
          mkdir -p reports
          
          cat > reports/comprehensive-analysis-report.md << 'EOF'
          # Comprehensive Code Analysis Report
          
          **Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          
          ## Analysis Results
          
          ### Code Schema Analysis
          ✅ Completed - See artifacts for detailed schema report
          
          ### Security Vulnerability Scan
          ✅ Completed - NPM audit and secret scanning performed
          
          ### Performance Analysis
          ✅ Completed - Bundle size and optimization checks performed
          
          ### Code Quality Metrics
          ✅ Completed - Best practices and quality metrics analyzed
          
          ## Recommendations
          
          1. Review security scan results for any high-priority issues
          2. Address performance anti-patterns identified
          3. Consider automated dependency updates for security patches
          4. Implement ESLint for consistent code quality
          
          EOF
          
          echo "✅ Comprehensive report generated"
      
      - name: Upload Comprehensive Report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-analysis-report
          path: reports/
          retention-days: 90
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## 🔍 Comprehensive Code Analysis Complete
            
            The automated code analysis workflow has completed. Review the job summaries above for detailed findings:
            
            - ✅ Code Schema Analysis
            - ✅ Security Vulnerability Scan  
            - ✅ Performance Analysis
            - ✅ Code Quality Metrics
            
            📊 Detailed reports are available in the workflow artifacts.
            
            ---
            *Automated by Comprehensive Code Analysis Workflow*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
