name: Auto Review and Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            console.log('PR Details:', {
              number: pr.number,
              title: pr.title,
              state: pr.state,
              author: pr.user.login,
              draft: pr.draft,
              mergeable: pr.mergeable,
              mergeable_state: pr.mergeable_state
            });
            
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_author', pr.user.login);
            core.setOutput('pr_mergeable', pr.mergeable);
            core.setOutput('pr_mergeable_state', pr.mergeable_state);
            
            return pr;
      
      - name: Get PR files
        id: pr-files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            console.log('Files changed:', files.length);
            
            // Check for sensitive file patterns
            const sensitivePatterns = ['.env', 'secret', 'password', 'token', 'key'];
            const hasSensitiveFiles = files.some(file => 
              sensitivePatterns.some(pattern => 
                file.filename.toLowerCase().includes(pattern)
              )
            );
            
            core.setOutput('file_count', files.length);
            core.setOutput('has_sensitive_files', hasSensitiveFiles);
            
            return files;
      
      - name: Check for status checks
        id: status-checks
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            
            const checkStatuses = checks.check_runs.map(check => ({
              name: check.name,
              status: check.status,
              conclusion: check.conclusion
            }));
            
            const allPassed = checks.check_runs
              .filter(check => !check.name.includes('auto-review')) // Exclude this workflow
              .every(check => 
                check.status === 'completed' && 
                check.conclusion === 'success'
              );
            
            console.log('Status checks:', checkStatuses);
            console.log('All checks passed:', allPassed);
            
            core.setOutput('all_checks_passed', allPassed);
            
            return checkStatuses;
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Security & Performance Checks
        id: security-perf
        continue-on-error: true
        run: |
          # Initialize results
          SECURITY_ISSUES=0
          PERFORMANCE_ISSUES=0
          
          # Check for hardcoded secrets in PR files
          echo "Checking for hardcoded secrets..."
          SECRET_PATTERNS="api[_-]?key\s*=\s*['\"][^'\"]{20,}|secret\s*=\s*['\"][^'\"]{20,}|password\s*=\s*['\"][^'\"]{10,}|token\s*=\s*['\"][^'\"]{20,}"
          
          if grep -r -i -E "$SECRET_PATTERNS" . --include="*.js" --include="*.html" ! -path "./node_modules/*" ! -path "./.git/*" 2>/dev/null; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for XSS vulnerabilities
          echo "Checking for XSS vulnerabilities..."
          if grep -r "innerHTML\s*=" . --include="*.js" ! -path "./node_modules/*" ! -path "./.git/*" 2>/dev/null; then
            echo "has_xss_risk=true" >> $GITHUB_OUTPUT
            SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
          else
            echo "has_xss_risk=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for console.log in production code
          echo "Checking for debug statements..."
          CONSOLE_COUNT=$(grep -r "console\.log" . --include="*.js" ! -path "./node_modules/*" ! -path "./test/*" ! -path "./tests/*" 2>/dev/null | wc -l || echo "0")
          echo "console_count=$CONSOLE_COUNT" >> $GITHUB_OUTPUT
          if [ "$CONSOLE_COUNT" -gt 5 ]; then
            PERFORMANCE_ISSUES=$((PERFORMANCE_ISSUES + 1))
          fi
          
          # Check for document.write
          echo "Checking for blocking scripts..."
          if grep -r "document\.write" . --include="*.js" --include="*.html" ! -path "./node_modules/*" 2>/dev/null; then
            echo "has_blocking_scripts=true" >> $GITHUB_OUTPUT
            PERFORMANCE_ISSUES=$((PERFORMANCE_ISSUES + 1))
          else
            echo "has_blocking_scripts=false" >> $GITHUB_OUTPUT
          fi
          
          echo "security_issues=$SECURITY_ISSUES" >> $GITHUB_OUTPUT
          echo "performance_issues=$PERFORMANCE_ISSUES" >> $GITHUB_OUTPUT
          
          echo "Security issues: $SECURITY_ISSUES"
          echo "Performance issues: $PERFORMANCE_ISSUES"
      
      - name: Validate PR
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = '${{ steps.pr-details.outputs.pr_author }}';
            const fileCount = ${{ steps.pr-files.outputs.file_count }};
            const hasSensitiveFiles = '${{ steps.pr-files.outputs.has_sensitive_files }}' === 'true';
            const allChecksPassed = '${{ steps.status-checks.outputs.all_checks_passed }}' === 'true';
            
            // Security and performance check results
            const hasSecrets = '${{ steps.security-perf.outputs.has_secrets }}' === 'true';
            const hasXssRisk = '${{ steps.security-perf.outputs.has_xss_risk }}' === 'true';
            const consoleCount = parseInt('${{ steps.security-perf.outputs.console_count }}' || '0');
            const hasBlockingScripts = '${{ steps.security-perf.outputs.has_blocking_scripts }}' === 'true';
            const securityIssues = parseInt('${{ steps.security-perf.outputs.security_issues }}' || '0');
            const performanceIssues = parseInt('${{ steps.security-perf.outputs.performance_issues }}' || '0');
            
            const validationResults = {
              passed: true,
              checks: [],
              issues: [],
              warnings: []
            };
            
            // Check 1: PR must have files
            if (fileCount === 0) {
              validationResults.passed = false;
              validationResults.issues.push('PR has no file changes');
            } else {
              validationResults.checks.push(`Has ${fileCount} file changes`);
            }
            
            // Check 2: No sensitive files
            if (hasSensitiveFiles) {
              validationResults.passed = false;
              validationResults.issues.push('PR contains sensitive files');
            } else {
              validationResults.checks.push('No sensitive files detected');
            }
            
            // Check 3: Status checks (if any exist)
            if (allChecksPassed || allChecksPassed === null) {
              validationResults.checks.push('All status checks passed');
            } else {
              validationResults.passed = false;
              validationResults.issues.push('Some status checks failed or pending');
            }
            
            // Check 4: Not from a bot (except Dependabot)
            if (prAuthor === 'dependabot[bot]' || prAuthor.includes('[bot]')) {
              validationResults.checks.push('Automated PR from trusted bot');
            } else {
              validationResults.checks.push('Human-authored PR');
            }
            
            // Check 5: Security checks
            if (hasSecrets) {
              validationResults.passed = false;
              validationResults.issues.push('⚠️ Potential hardcoded secrets detected');
            } else {
              validationResults.checks.push('🔒 No hardcoded secrets found');
            }
            
            if (hasXssRisk) {
              validationResults.warnings.push('⚠️ Potential XSS vulnerability (innerHTML usage)');
            }
            
            // Check 6: Performance checks
            if (consoleCount > 10) {
              validationResults.warnings.push(`⚡ Consider removing ${consoleCount} console.log statements`);
            } else if (consoleCount > 0) {
              validationResults.checks.push(`Console logs: ${consoleCount} (acceptable)`);
            }
            
            if (hasBlockingScripts) {
              validationResults.warnings.push('⚡ document.write detected (blocks page rendering)');
            }
            
            // Summary
            validationResults.checks.push(`🔒 Security issues: ${securityIssues}`);
            validationResults.checks.push(`⚡ Performance issues: ${performanceIssues}`);
            
            console.log('Validation results:', validationResults);
            
            core.setOutput('validation_passed', validationResults.passed);
            core.setOutput('validation_checks', JSON.stringify(validationResults.checks));
            core.setOutput('validation_issues', JSON.stringify(validationResults.issues));
            core.setOutput('validation_warnings', JSON.stringify(validationResults.warnings));
            
            return validationResults;
      
      - name: Approve PR
        if: steps.validate.outputs.validation_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const checks = JSON.parse('${{ steps.validate.outputs.validation_checks }}');
            const warnings = JSON.parse('${{ steps.validate.outputs.validation_warnings }}' || '[]');
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};
            const prTitle = '${{ steps.pr-details.outputs.pr_title }}';
            
            let reviewBody = '✅ **Automated Review with Security & Performance Analysis**\n\n' +
              'This PR has been automatically reviewed and validated.\n\n' +
              '**Validation Checks:**\n' +
              checks.map(check => `- ✅ ${check}`).join('\n') + '\n\n';
            
            if (warnings.length > 0) {
              reviewBody += '**Warnings (non-blocking):**\n' +
                warnings.map(warning => `- ${warning}`).join('\n') + '\n\n';
            }
            
            reviewBody += '**Analysis:**\n' +
              '- Files changed: ${{ steps.pr-files.outputs.file_count }}\n' +
              '- PR Title: ' + prTitle + '\n' +
              '- Security scan: ✅ Passed\n' +
              '- Performance check: ✅ Passed\n\n' +
              'All critical checks passed. Approving for merge.\n\n' +
              '---\n' +
              '*Automated by GitHub Actions - Enhanced Auto Review Workflow*';

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: reviewBody
              });
              
              console.log('✅ PR approved successfully');
            } catch (error) {
              console.error('Failed to approve PR:', error);
              throw error;
            }
      
      - name: Enable auto-merge
        if: steps.validate.outputs.validation_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};
            
            try {
              // Enable auto-merge with squash method
              await github.graphql(`
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, {
                pullRequestId: context.payload.pull_request.node_id
              });
              
              console.log('✅ Auto-merge enabled successfully');
            } catch (error) {
              console.log('ℹ️ Could not enable auto-merge:', error.message);
              console.log('Will attempt direct merge instead');
            }
      
      - name: Merge PR
        if: steps.validate.outputs.validation_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};
            const prTitle = '${{ steps.pr-details.outputs.pr_title }}';
            const mergeable = '${{ steps.pr-details.outputs.pr_mergeable }}';
            
            // Wait a moment for auto-merge to work
            await new Promise(resolve => setTimeout(resolve, 5000));
            
            // Check if PR is still open (auto-merge might have worked)
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            if (pr.state !== 'open') {
              console.log('✅ PR already merged (auto-merge successful)');
              return;
            }
            
            // If still open and mergeable, merge it
            if (pr.mergeable) {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_title: `Merge PR #${prNumber}: ${prTitle}`,
                  commit_message: 'Automatically merged by GitHub Actions - Auto Review Workflow',
                  merge_method: 'squash'
                });
                
                console.log('✅ PR merged successfully');
              } catch (error) {
                console.error('Failed to merge PR:', error);
                
                // Add comment about merge failure
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '⚠️ Auto-merge approved but merge failed. Please check for conflicts or branch protection rules.'
                });
                
                throw error;
              }
            } else {
              console.log('⚠️ PR is not mergeable');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '⚠️ Auto-review approved but PR is not mergeable. Please resolve conflicts.'
              });
            }
      
      - name: Comment on validation failure
        if: steps.validate.outputs.validation_passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = JSON.parse('${{ steps.validate.outputs.validation_issues }}');
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};
            
            const commentBody = '❌ **Automated Review Failed**\n\n' +
              'This PR did not pass automated validation checks.\n\n' +
              '**Issues Found:**\n' +
              issues.map(issue => `- ❌ ${issue}`).join('\n') + '\n\n' +
              'Please address these issues and the PR will be automatically re-reviewed.\n\n' +
              '---\n' +
              '*Automated by GitHub Actions - Auto Review Workflow*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
