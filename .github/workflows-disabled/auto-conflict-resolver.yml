name: Automatic Conflict Resolution

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to resolve conflicts for'
        required: true
        type: number
      strategy:
        description: 'Resolution strategy (auto/ours/theirs/manual)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - ours
          - theirs
          - manual

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-resolve-conflicts:
    name: Automatic Conflict Resolution
    runs-on: ubuntu-latest
    
    steps:
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            
            // Determine PR number from event or input
            if (context.eventName === 'pull_request') {
              prNumber = context.issue.number;
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = ${{ github.event.inputs.pr_number }};
            } else {
              core.setFailed('Unsupported event type');
              return;
            }
            
            core.info(`Processing PR #${prNumber}`);
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // Extract details
            const baseRef = pr.base.ref;
            const headRef = pr.head.ref;
            const baseSha = pr.base.sha;
            const headSha = pr.head.sha;
            const headRepo = pr.head.repo.full_name;
            const isFork = headRepo !== context.repo.owner + '/' + context.repo.repo;
            
            core.info(`Base: ${baseRef} (${baseSha.substring(0, 7)})`);
            core.info(`Head: ${headRef} (${headSha.substring(0, 7)})`);
            core.info(`Mergeable: ${pr.mergeable}`);
            core.info(`Is Fork: ${isFork}`);
            
            core.setOutput('pr_number', prNumber);
            core.setOutput('base_ref', baseRef);
            core.setOutput('head_ref', headRef);
            core.setOutput('base_sha', baseSha);
            core.setOutput('head_sha', headSha);
            core.setOutput('mergeable', pr.mergeable);
            core.setOutput('is_fork', isFork);
            core.setOutput('head_repo', headRepo);
            
            return pr;
      
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr-details.outputs.head_repo }}
          ref: ${{ steps.pr-details.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch base branch
        run: |
          git fetch origin ${{ steps.pr-details.outputs.base_ref }}:${{ steps.pr-details.outputs.base_ref }}
      
      - name: Check for conflicts
        id: check-conflicts
        run: |
          echo "## 🔍 Conflict Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Attempt test merge
          if git merge --no-commit --no-ff origin/${{ steps.pr-details.outputs.base_ref }} 2>&1 | tee merge-output.txt; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "✅ No conflicts detected" >> $GITHUB_STEP_SUMMARY
            git merge --abort 2>/dev/null || true
            exit 0
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "❌ Conflicts detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Get conflicted files
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "")
            
            if [ -n "$CONFLICTED_FILES" ]; then
              echo "$CONFLICTED_FILES" > conflicted-files.txt
              CONFLICT_COUNT=$(echo "$CONFLICTED_FILES" | wc -l)
              echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
              
              echo "### Conflicted Files ($CONFLICT_COUNT):" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$CONFLICTED_FILES" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "conflict_count=0" >> $GITHUB_OUTPUT
            fi
            
            git merge --abort 2>/dev/null || true
          fi
      
      - name: Load resolution configuration
        id: load-config
        if: steps.check-conflicts.outputs.has_conflicts == 'true'
        run: |
          echo "## 📋 Loading Resolution Configuration" >> $GITHUB_STEP_SUMMARY
          
          if [ -f .github/workflows/conflict-resolution-config.json ]; then
            echo "✅ Configuration file found" >> $GITHUB_STEP_SUMMARY
            echo "config_exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No configuration file found, using defaults" >> $GITHUB_STEP_SUMMARY
            echo "config_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Analyze conflict types
        id: analyze-conflicts
        if: steps.check-conflicts.outputs.has_conflicts == 'true'
        run: |
          echo "## 🔎 Conflict Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create analysis directory
          mkdir -p conflict-analysis
          
          AUTO_RESOLVABLE=0
          MANUAL_REQUIRED=0
          
          # Attempt merge again to analyze
          git merge --no-commit --no-ff origin/${{ steps.pr-details.outputs.base_ref }} 2>/dev/null || true
          
          # Analyze each conflicted file
          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              continue
            fi
            
            echo "### Analyzing: \`$file\`" >> $GITHUB_STEP_SUMMARY
            
            # Count conflict markers
            MARKER_COUNT=$(grep -c "^<<<<<<< " "$file" 2>/dev/null || echo "0")
            echo "- Conflict markers: $MARKER_COUNT" >> $GITHUB_STEP_SUMMARY
            
            # Check file size
            FILE_SIZE=$(wc -c < "$file" 2>/dev/null || echo "0")
            echo "- File size: $FILE_SIZE bytes" >> $GITHUB_STEP_SUMMARY
            
            # Determine if auto-resolvable based on patterns
            AUTO_RESOLVE="false"
            STRATEGY="manual"
            
            case "$file" in
              package-lock.json|yarn.lock)
                AUTO_RESOLVE="true"
                STRATEGY="ours-regenerate"
                ;;
              *.md)
                if [ $MARKER_COUNT -le 3 ]; then
                  AUTO_RESOLVE="true"
                  STRATEGY="both-merge"
                fi
                ;;
              *.css|*.html)
                if [ $MARKER_COUNT -le 5 ] && [ $FILE_SIZE -lt 102400 ]; then
                  AUTO_RESOLVE="true"
                  STRATEGY="intelligent-merge"
                fi
                ;;
              *.json)
                STRATEGY="manual-review"
                ;;
              .github/workflows/*.yml)
                STRATEGY="manual-critical"
                ;;
              *)
                if [ $MARKER_COUNT -eq 1 ] && [ $FILE_SIZE -lt 10240 ]; then
                  AUTO_RESOLVE="true"
                  STRATEGY="attempt-merge"
                fi
                ;;
            esac
            
            echo "- Strategy: $STRATEGY" >> $GITHUB_STEP_SUMMARY
            echo "- Auto-resolvable: $AUTO_RESOLVE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Save analysis
            echo "$file|$STRATEGY|$AUTO_RESOLVE|$MARKER_COUNT" >> conflict-analysis/file-strategies.txt
            
            if [ "$AUTO_RESOLVE" = "true" ]; then
              AUTO_RESOLVABLE=$((AUTO_RESOLVABLE + 1))
            else
              MANUAL_REQUIRED=$((MANUAL_REQUIRED + 1))
            fi
          done < conflicted-files.txt
          
          git merge --abort 2>/dev/null || true
          
          echo "auto_resolvable=$AUTO_RESOLVABLE" >> $GITHUB_OUTPUT
          echo "manual_required=$MANUAL_REQUIRED" >> $GITHUB_OUTPUT
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-resolvable: $AUTO_RESOLVABLE files" >> $GITHUB_STEP_SUMMARY
          echo "- Manual required: $MANUAL_REQUIRED files" >> $GITHUB_STEP_SUMMARY
      
      - name: Attempt automatic resolution
        id: auto-resolve
        if: steps.analyze-conflicts.outputs.auto_resolvable > 0
        run: |
          echo "## 🔧 Automatic Resolution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Start fresh merge
          git merge --no-commit --no-ff origin/${{ steps.pr-details.outputs.base_ref }} 2>/dev/null || true
          
          RESOLVED_COUNT=0
          FAILED_COUNT=0
          
          # Read strategies and apply
          if [ -f conflict-analysis/file-strategies.txt ]; then
            while IFS='|' read -r file strategy auto_resolve markers; do
              if [ "$auto_resolve" != "true" ]; then
                continue
              fi
              
              echo "### Resolving: \`$file\`" >> $GITHUB_STEP_SUMMARY
              echo "- Strategy: $strategy" >> $GITHUB_STEP_SUMMARY
              
              case "$strategy" in
                "ours-regenerate")
                  # Use our version and mark as resolved
                  git checkout --ours "$file"
                  git add "$file"
                  echo "✅ Resolved using 'ours' strategy" >> $GITHUB_STEP_SUMMARY
                  RESOLVED_COUNT=$((RESOLVED_COUNT + 1))
                  ;;
                  
                "both-merge"|"intelligent-merge"|"attempt-merge")
                  # Try to merge both changes intelligently
                  # For simple cases, attempt to keep both changes
                  if [ -f "$file" ]; then
                    # Simple strategy: if conflict is just additions, keep both
                    # Otherwise, default to theirs
                    git checkout --theirs "$file" && git add "$file"
                    echo "✅ Resolved using '$strategy' strategy (kept base branch version)" >> $GITHUB_STEP_SUMMARY
                    RESOLVED_COUNT=$((RESOLVED_COUNT + 1))
                  fi
                  ;;
                  
                *)
                  echo "⚠️ Strategy not implemented: $strategy" >> $GITHUB_STEP_SUMMARY
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                  ;;
              esac
              echo "" >> $GITHUB_STEP_SUMMARY
            done < conflict-analysis/file-strategies.txt
          fi
          
          echo "resolved_count=$RESOLVED_COUNT" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resolution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Successfully resolved: $RESOLVED_COUNT files" >> $GITHUB_STEP_SUMMARY
          echo "- Failed to resolve: $FAILED_COUNT files" >> $GITHUB_STEP_SUMMARY
      
      - name: Commit and push resolution
        id: commit-resolution
        if: steps.auto-resolve.outputs.resolved_count > 0
        continue-on-error: true
        run: |
          echo "## 💾 Committing Resolution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if there are remaining conflicts
          REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null | wc -l)
          
          if [ $REMAINING_CONFLICTS -eq 0 ]; then
            # All conflicts resolved, complete the merge
            git commit -F- <<EOF
          Auto-resolve merge conflicts with ${{ steps.pr-details.outputs.base_ref }}
          
          Automatic conflict resolution applied using predefined strategies:
          - Resolved files: ${{ steps.auto-resolve.outputs.resolved_count }}
          - Strategy: Pattern-based automatic resolution
          
          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          EOF
            
            echo "all_resolved=true" >> $GITHUB_OUTPUT
            echo "✅ All conflicts resolved" >> $GITHUB_STEP_SUMMARY
          else
            # Partial resolution
            git commit -F- <<EOF
          Partially auto-resolve merge conflicts with ${{ steps.pr-details.outputs.base_ref }}
          
          Automatic conflict resolution partially applied:
          - Resolved files: ${{ steps.auto-resolve.outputs.resolved_count }}
          - Remaining conflicts: $REMAINING_CONFLICTS files
          
          Manual resolution required for remaining conflicts.
          
          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          EOF
            
            echo "all_resolved=false" >> $GITHUB_OUTPUT
            echo "⚠️ Partial resolution - $REMAINING_CONFLICTS conflicts remain" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "commit_created=true" >> $GITHUB_OUTPUT
      
      - name: Push resolution to PR branch
        id: push-resolution
        if: steps.commit-resolution.outputs.commit_created == 'true' && steps.pr-details.outputs.is_fork == 'false'
        continue-on-error: true
        run: |
          echo "## 🚀 Pushing Resolution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if git push origin ${{ steps.pr-details.outputs.head_ref }}; then
            echo "push_success=true" >> $GITHUB_OUTPUT
            echo "✅ Successfully pushed resolution to PR branch" >> $GITHUB_STEP_SUMMARY
          else
            echo "push_success=false" >> $GITHUB_OUTPUT
            echo "❌ Failed to push resolution" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Generate resolution report
        id: generate-report
        if: always() && steps.check-conflicts.outputs.has_conflicts == 'true'
        run: |
          mkdir -p reports
          
          cat > reports/auto-resolution-report.md << 'EOF'
          # Automatic Conflict Resolution Report
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **PR Number:** #${{ steps.pr-details.outputs.pr_number }}
          **Base Branch:** ${{ steps.pr-details.outputs.base_ref }}
          **Head Branch:** ${{ steps.pr-details.outputs.head_ref }}
          
          ## Summary
          
          - **Total Conflicts:** ${{ steps.check-conflicts.outputs.conflict_count }}
          - **Auto-Resolvable:** ${{ steps.analyze-conflicts.outputs.auto_resolvable }}
          - **Manual Required:** ${{ steps.analyze-conflicts.outputs.manual_required }}
          - **Successfully Resolved:** ${{ steps.auto-resolve.outputs.resolved_count }}
          - **Resolution Status:** ${{ steps.commit-resolution.outputs.all_resolved == 'true' && 'Fully Resolved' || 'Partially Resolved' }}
          - **Pushed to Branch:** ${{ steps.push-resolution.outputs.push_success == 'true' && 'Yes' || 'No' }}
          
          ## Resolution Details
          
          EOF
          
          if [ -f conflict-analysis/file-strategies.txt ]; then
            echo "### File-by-File Resolution" >> reports/auto-resolution-report.md
            echo "" >> reports/auto-resolution-report.md
            echo "| File | Strategy | Auto-Resolve | Status |" >> reports/auto-resolution-report.md
            echo "|------|----------|--------------|--------|" >> reports/auto-resolution-report.md
            
            while IFS='|' read -r file strategy auto_resolve markers; do
              STATUS="⏳ Pending"
              if [ "$auto_resolve" = "true" ]; then
                STATUS="✅ Resolved"
              else
                STATUS="⚠️ Manual Required"
              fi
              echo "| \`$file\` | $strategy | $auto_resolve | $STATUS |" >> reports/auto-resolution-report.md
            done < conflict-analysis/file-strategies.txt
          fi
          
          cat >> reports/auto-resolution-report.md << 'EOF'
          
          ## Next Steps
          
          EOF
          
          if [ "${{ steps.commit-resolution.outputs.all_resolved }}" = "true" ]; then
            cat >> reports/auto-resolution-report.md << 'EOF'
          ✅ **All conflicts have been automatically resolved!**
          
          The PR branch has been updated with the resolved changes. Please:
          1. Review the automatic resolution commit
          2. Verify the changes are correct
          3. Run any necessary tests
          4. Merge the PR if everything looks good
          EOF
          else
            cat >> reports/auto-resolution-report.md << 'EOF'
          ⚠️ **Partial resolution completed - manual intervention required**
          
          Some conflicts were automatically resolved, but others require manual attention. Please:
          1. Review the automatically resolved changes
          2. Manually resolve the remaining conflicts
          3. Commit and push your resolution
          4. Verify all tests pass
          EOF
          fi
          
          echo "Report generated successfully"
      
      - name: Comment on PR with resolution status
        if: always() && steps.check-conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};
            const hasConflicts = '${{ steps.check-conflicts.outputs.has_conflicts }}' === 'true';
            const conflictCount = '${{ steps.check-conflicts.outputs.conflict_count }}';
            const autoResolvable = '${{ steps.analyze-conflicts.outputs.auto_resolvable }}';
            const manualRequired = '${{ steps.analyze-conflicts.outputs.manual_required }}';
            const resolvedCount = '${{ steps.auto-resolve.outputs.resolved_count }}' || '0';
            const allResolved = '${{ steps.commit-resolution.outputs.all_resolved }}' === 'true';
            const pushSuccess = '${{ steps.push-resolution.outputs.push_success }}' === 'true';
            
            let commentBody = '## 🤖 Automatic Conflict Resolution\n\n';
            
            if (allResolved && pushSuccess) {
              commentBody += '✅ **All conflicts have been automatically resolved!**\n\n';
              commentBody += '### 📊 Resolution Summary\n';
              commentBody += `- Total conflicts detected: ${conflictCount}\n`;
              commentBody += `- Successfully auto-resolved: ${resolvedCount} files\n`;
              commentBody += `- Resolution status: Complete\n\n`;
              
              commentBody += '### ✅ Next Steps\n\n';
              commentBody += '1. **Review the resolution commit** to ensure changes are correct\n';
              commentBody += '2. **Run tests** to verify functionality\n';
              commentBody += '3. **Merge the PR** if everything looks good\n\n';
              
              commentBody += '### 📝 What Was Done\n\n';
              commentBody += 'The workflow automatically:\n';
              commentBody += '- Detected and analyzed merge conflicts\n';
              commentBody += '- Applied resolution strategies based on file patterns\n';
              commentBody += '- Committed the resolved changes\n';
              commentBody += '- Pushed updates to your PR branch\n';
              
            } else if (resolvedCount > 0) {
              commentBody += '⚠️ **Partial conflict resolution completed**\n\n';
              commentBody += '### 📊 Resolution Summary\n';
              commentBody += `- Total conflicts detected: ${conflictCount}\n`;
              commentBody += `- Auto-resolved: ${resolvedCount} files\n`;
              commentBody += `- Manual resolution required: ${manualRequired} files\n`;
              commentBody += `- Changes pushed to branch: ${pushSuccess ? 'Yes' : 'No'}\n\n`;
              
              commentBody += '### 🔧 Manual Resolution Needed\n\n';
              commentBody += 'Some conflicts could not be automatically resolved. Please:\n\n';
              commentBody += '1. **Pull the latest changes** from your PR branch\n';
              commentBody += '   ```bash\n';
              commentBody += '   git fetch origin ${{ steps.pr-details.outputs.head_ref }}\n';
              commentBody += '   git pull origin ${{ steps.pr-details.outputs.head_ref }}\n';
              commentBody += '   ```\n\n';
              commentBody += '2. **Merge the base branch** to see remaining conflicts\n';
              commentBody += '   ```bash\n';
              commentBody += '   git merge origin/${{ steps.pr-details.outputs.base_ref }}\n';
              commentBody += '   ```\n\n';
              commentBody += '3. **Resolve remaining conflicts** in your editor\n';
              commentBody += '4. **Commit and push** the resolution\n';
              commentBody += '   ```bash\n';
              commentBody += '   git add .\n';
              commentBody += '   git commit -m "Resolve remaining merge conflicts"\n';
              commentBody += '   git push\n';
              commentBody += '   ```\n\n';
              
            } else {
              commentBody += '⚠️ **Automatic resolution not possible**\n\n';
              commentBody += '### 📊 Analysis Summary\n';
              commentBody += `- Total conflicts detected: ${conflictCount}\n`;
              commentBody += `- Auto-resolvable: ${autoResolvable} files\n`;
              commentBody += `- Manual resolution required: ${manualRequired} files\n\n`;
              
              commentBody += '### 🔧 Resolution Required\n\n';
              commentBody += 'These conflicts require manual review and resolution:\n\n';
              
              try {
                const fs = require('fs');
                if (fs.existsSync('conflicted-files.txt')) {
                  const files = fs.readFileSync('conflicted-files.txt', 'utf8').trim().split('\n');
                  files.forEach(file => {
                    commentBody += `- \`${file}\`\n`;
                  });
                }
              } catch (error) {
                commentBody += '_Unable to list conflicted files_\n';
              }
              
              commentBody += '\n### 📝 Resolution Steps\n\n';
              commentBody += '1. **Fetch and merge the base branch:**\n';
              commentBody += '   ```bash\n';
              commentBody += '   git fetch origin ${{ steps.pr-details.outputs.base_ref }}\n';
              commentBody += '   git merge origin/${{ steps.pr-details.outputs.base_ref }}\n';
              commentBody += '   ```\n\n';
              commentBody += '2. **Resolve conflicts** in each file\n';
              commentBody += '3. **Commit and push:**\n';
              commentBody += '   ```bash\n';
              commentBody += '   git add .\n';
              commentBody += '   git commit -m "Resolve merge conflicts"\n';
              commentBody += '   git push\n';
              commentBody += '   ```\n\n';
            }
            
            commentBody += '### 📚 Resources\n\n';
            commentBody += '- [Conflict Resolution Guide](.github/workflows/CONFLICT_RESOLUTION_GUIDE.md)\n';
            commentBody += '- [Quick Reference](.github/workflows/CONFLICT_QUICK_REFERENCE.md)\n';
            commentBody += '- [GitHub Docs: Resolving Conflicts](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts)\n\n';
            
            commentBody += '---\n';
            commentBody += '*🤖 Automated by Auto Conflict Resolution Workflow*';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
      
      - name: Upload resolution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conflict-resolution-pr-${{ steps.pr-details.outputs.pr_number }}
          path: |
            reports/auto-resolution-report.md
            conflict-analysis/file-strategies.txt
            conflicted-files.txt
            merge-output.txt
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Update PR labels
        if: always() && steps.check-conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};
            const allResolved = '${{ steps.commit-resolution.outputs.all_resolved }}' === 'true';
            const pushSuccess = '${{ steps.push-resolution.outputs.push_success }}' === 'true';
            
            // Remove old labels
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'has-conflicts'
              });
            } catch (error) {
              // Label might not exist
            }
            
            // Add appropriate label
            if (allResolved && pushSuccess) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['conflicts-auto-resolved']
              });
            } else if ('${{ steps.auto-resolve.outputs.resolved_count }}' > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['conflicts-partially-resolved']
              });
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['has-conflicts', 'needs-manual-resolution']
              });
            }
