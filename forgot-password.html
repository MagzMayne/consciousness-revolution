<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Consciousness Revolution</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.8em; margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 25px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e5ee;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .back-link { margin-top: 20px; }
        .back-link a { color: #667eea; text-decoration: none; font-weight: 500; }
        .back-link a:hover { text-decoration: underline; }
        .success { display: none; color: #27ae60; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container" role="main" aria-label="Password Reset">
        <h1>Reset Password</h1>
        <p>Enter your email address and we'll send you instructions to reset your password.</p>
        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required aria-label="Email address">
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
        <p class="success" id="successMsg">Check your email for reset instructions.</p>
        <div class="back-link">
            <a href="login.html">Back to Login</a>
        </div>
    </div>
    <script>
        function handleReset(e) {
            e.preventDefault();
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        }
    </script>
    <script src="/js/robot-assistant-loader.js"></script>
</body>
</html>
