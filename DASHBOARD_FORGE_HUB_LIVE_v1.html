<!DOCTYPE html>
<!-- RootIB: RB-20260319142113-3ED451BB -->
<html lang="en">
<head>
  <meta name="rootib" content="RootIB: RB-20260319142113-3ED451BB">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Forges Hub - LIVE DATA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --neon-cyan: #0ff5e0;
      --toxic-green: #39ff14;
      --rust-orange: #ff6b35;
      --warning-amber: #ffaa00;
      --hot-pink: #ff0080;
      --chrome: #c0c0c0;
      --dark-metal: #0a0a0c;
      --rust-brown: #2a1810;
      --grid-line: rgba(15, 245, 224, 0.05);
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, var(--dark-metal) 0%, #0d0a12 50%, var(--rust-brown) 100%);
      color: #c8c8c8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* CRT Scan Lines */
    body::before {
      content: '';
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.12) 2px,
        rgba(0, 0, 0, 0.12) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Industrial Grid */
    #grid-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(var(--grid-line) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 2rem;
      background: rgba(10, 10, 12, 0.9);
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(15, 245, 224, 0.3);
    }

    .header-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px var(--neon-cyan);
    }

    .header-title {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--toxic-green), var(--warning-amber));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-subtitle {
      font-size: 1.2rem;
      color: var(--chrome);
      margin-bottom: 1.5rem;
    }

    .live-badge {
      display: inline-block;
      background: linear-gradient(135deg, #39ff14 0%, #0ff5e0 100%);
      color: #000;
      padding: 0.5rem 1.5rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    /* User Controls */
    .user-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: rgba(10, 10, 12, 0.9);
      border: 2px solid rgba(128, 128, 128, 0.3);
      border-radius: 12px;
    }

    .user-controls input {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
    }

    .user-controls button {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--toxic-green) 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .user-controls button:hover {
      transform: translateY(-2px);
    }

    /* Overall Progress */
    .overall-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .progress-stat {
      background: rgba(10, 10, 12, 0.9);
      border: 2px solid rgba(128, 128, 128, 0.3);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .progress-stat:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(15, 245, 224, 0.3);
      transform: translateY(-2px);
    }

    .stat-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      margin-bottom: 0.5rem;
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--chrome);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Forges Grid */
    .forges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .forge-card {
      background: rgba(10, 10, 12, 0.9);
      border: 2px solid rgba(128, 128, 128, 0.3);
      border-radius: 12px;
      padding: 2rem;
      transition: all 0.3s ease;
      position: relative;
      cursor: pointer;
    }

    .forge-card:hover {
      transform: translateY(-5px);
      border-color: var(--forge-color);
      box-shadow: 0 0 30px var(--forge-glow);
    }

    .forge-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }

    .forge-card.locked:hover {
      transform: none;
    }

    .forge-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .forge-icon {
      font-size: 3rem;
      filter: drop-shadow(0 0 10px currentColor);
    }

    .forge-info {
      flex: 1;
    }

    .forge-name {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .forge-tagline {
      font-size: 0.9rem;
      color: #888;
    }

    .forge-level {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .xp-bar {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      height: 12px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.3), var(--forge-color));
      transition: width 0.5s ease;
    }

    .xp-text {
      text-align: right;
      font-size: 0.85rem;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 4rem;
      font-size: 1.5rem;
      color: var(--neon-cyan);
    }
  </style>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/dashboard-enhancements.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
  <div id="grid-bg"></div>

  <div class="container">
    <div class="header">
      <div class="header-icon">⚡</div>
      <h1 class="header-title">7 Forges</h1>
      <p class="header-subtitle">Your Journey Through Pattern Mastery</p>
      <div class="live-badge">🔴 LIVE DATA</div>
    </div>

    <div class="user-controls">
      <input type="text" id="userId" placeholder="Enter User ID (e.g., user@email.com)" value="demo-user-123">
      <button onclick="loadUserData()">Load Progress</button>
      <button onclick="initNewUser()">Initialize New User</button>
    </div>

    <div id="loading" class="loading">Enter your User ID to view your progress</div>

    <div id="statsSection" style="display: none;">
      <div class="overall-progress">
        <div class="progress-stat">
          <div class="stat-icon">🎯</div>
          <div class="stat-value" id="totalXP">0</div>
          <div class="stat-label">Total XP</div>
        </div>
        <div class="progress-stat">
          <div class="stat-icon">📊</div>
          <div class="stat-value" id="totalLevel">0</div>
          <div class="stat-label">Total Level</div>
        </div>
        <div class="progress-stat">
          <div class="stat-icon">🔓</div>
          <div class="stat-value" id="unlockedForges">0/7</div>
          <div class="stat-label">Forges Unlocked</div>
        </div>
        <div class="progress-stat">
          <div class="stat-icon">∞</div>
          <div class="stat-value" id="octave">1</div>
          <div class="stat-label">Octave</div>
        </div>
      </div>

      <div class="forges-grid" id="forgesGrid"></div>
    </div>
  </div>

  <script src="js/spiral-engine.js"></script>
  <script src="forge-data.js"></script>
  <script>
    let currentUserData = null;

    async function loadUserData() {
      const userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert('Please enter a User ID');
        return;
      }

      document.getElementById('loading').textContent = 'Loading progress...';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('statsSection').style.display = 'none';

      try {
        const result = await SpiralEngine.getUserProgress(userId);

        if (result.success && result.data.is_initialized) {
          currentUserData = result.data;
          renderDashboard();
        } else if (result.success && !result.data.is_initialized) {
          if (confirm('User not found. Would you like to initialize a new account?')) {
            await initNewUser();
          } else {
            document.getElementById('loading').textContent = 'User not initialized. Click "Initialize New User"';
          }
        } else {
          alert('Error loading progress: ' + (result.error || 'Unknown error'));
          document.getElementById('loading').textContent = 'Error loading data. Try again.';
        }
      } catch (error) {
        console.error('Load error:', error);
        alert('Network error. Check console for details.');
        document.getElementById('loading').textContent = 'Network error. Try again.';
      }
    }

    async function initNewUser() {
      const userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert('Please enter a User ID');
        return;
      }

      document.getElementById('loading').textContent = 'Initializing new user...';
      document.getElementById('loading').style.display = 'block';

      try {
        const result = await SpiralEngine.initializeUser(userId);

        if (result.success) {
          currentUserData = result.data;
          renderDashboard();
          alert('🎉 Welcome to the 7 Forges! Your journey begins now.');
        } else {
          alert('Error initializing user: ' + (result.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Init error:', error);
        alert('Network error. Check console for details.');
      }
    }

    function renderDashboard() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('statsSection').style.display = 'block';

      // Update overall stats
      const totalLevel = currentUserData.forges.reduce((sum, f) => sum + f.level, 0);
      const unlockedCount = currentUserData.forges.filter(f => f.status === 'unlocked').length;

      document.getElementById('totalXP').textContent = currentUserData.total_xp.toLocaleString();
      document.getElementById('totalLevel').textContent = totalLevel;
      document.getElementById('unlockedForges').textContent = `${unlockedCount}/7`;
      document.getElementById('octave').textContent = currentUserData.octave;

      // Render forge cards
      const grid = document.getElementById('forgesGrid');
      grid.innerHTML = '';

      currentUserData.forges.forEach(forgeData => {
        const forgeInfo = FORGE_DATA[forgeData.slug];
        if (!forgeInfo) return;

        const isUnlocked = forgeData.status === 'unlocked';
        const progress = SpiralEngine.calculateLevelProgress(forgeData.total_xp, forgeData.level);
        const xpForNext = SpiralEngine.calculateXPForLevel(forgeData.level + 1);
        const xpNeeded = xpForNext - forgeData.total_xp;
        const levelName = SpiralEngine.getLevelName(forgeData.level);

        const card = document.createElement('div');
        card.className = `forge-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        card.style.setProperty('--forge-color', forgeInfo.color);
        card.style.setProperty('--forge-glow', forgeInfo.color + '40');

        card.innerHTML = `
          <div class="forge-header">
            <div class="forge-icon" style="color: ${forgeInfo.color}">${forgeInfo.icon}</div>
            <div class="forge-info">
              <div class="forge-name" style="color: ${forgeInfo.color}">${forgeInfo.name}</div>
              <div class="forge-tagline">${forgeInfo.tagline}</div>
            </div>
          </div>

          ${isUnlocked ? `
            <div class="forge-level" style="color: ${forgeInfo.color}">
              Level ${forgeData.level} - ${levelName}
            </div>

            <div class="xp-bar">
              <div class="xp-fill" style="width: ${progress}%; --forge-color: ${forgeInfo.color}"></div>
            </div>

            <div class="xp-text">
              ${forgeData.total_xp.toLocaleString()} XP | ${xpNeeded.toLocaleString()} to next level
            </div>
          ` : `
            <div style="text-align: center; padding: 2rem; color: #666;">
              <div style="font-size: 3rem;">🔒</div>
              <div style="margin-top: 1rem;">Locked - Reach Level ${forgeInfo.unlockLevel} in any Forge</div>
            </div>
          `}
        `;

        if (isUnlocked) {
          card.onclick = () => {
            window.location.href = `forge-lobby-template.html?forge=${forgeData.slug}`;
          };
        }

        grid.appendChild(card);
      });
    }

    // Auto-load if user ID in localStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedUserId = localStorage.getItem('spiralUserId');
      if (savedUserId) {
        document.getElementById('userId').value = savedUserId;
        loadUserData();
      }
    });

    // Save user ID to localStorage on successful load
    const originalRenderDashboard = renderDashboard;
    renderDashboard = function() {
      const userId = document.getElementById('userId').value.trim();
      if (userId) {
        localStorage.setItem('spiralUserId', userId);
      }
      originalRenderDashboard();
    };
  </script>
  <script src="/js/mesh-engine-client.js"></script>
</body>
</html>
