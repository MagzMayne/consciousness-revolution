    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #1a1a2e 100%);
            background-attachment: fixed;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        /* Header */
        .header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #8a2be2, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .back-link:hover {
            background: rgba(138, 43, 226, 0.2);
            border-color: #8a2be2;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            text-align: center;
            min-width: 150px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #8a2be2;
            box-shadow: 0 8px 30px rgba(138, 43, 226, 0.4);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #8a2be2, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Search and Filter */
        .controls {
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #8a2be2;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .filter-btn:hover {
            background: rgba(138, 43, 226, 0.2);
            border-color: #8a2be2;
            color: #fff;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #8a2be2, #0080ff);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 3rem;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
        }

        .category-icon {
            font-size: 2rem;
        }

        .category-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8a2be2, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .category-count {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-left: auto;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8a2be2, #00d4ff);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: #8a2be2;
            box-shadow: 0 8px 30px rgba(138, 43, 226, 0.4);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.75rem;
        }

        .project-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .project-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.25rem 0.75rem;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Completion and Functionality Status */
        .project-status {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(138, 43, 226, 0.2);
            align-items: center;
        }

        .completion-bar-container {
            flex: 1;
        }

        .completion-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completion-percentage {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .completion-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .completion-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #00d4ff);
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        .functionality-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .functionality-working {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
        }

        .functionality-partial {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.5);
            color: #fbbf24;
        }

        .functionality-broken {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .functionality-untested {
            background: rgba(107, 114, 128, 0.2);
            border: 1px solid rgba(107, 114, 128, 0.5);
            color: #9ca3af;
        }

        .status-icon {
            font-size: 0.8rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(138, 43, 226, 0.2);
            border-top: 4px solid #8a2be2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 0 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>

<body>
    <header class="header">
        <div class="header-content">
            <h1>🎯 Organized Projects Hub</h1>
            <a href="index.html" class="back-link">← Back to Main Hub</a>
        </div>
    </header>

    <div class="container">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="total-projects">0</div>
                <div class="stat-label">Total Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-categories">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avg-completion">0%</div>
                <div class="stat-label">Avg Completion</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="working-projects">0</div>
                <div class="stat-label">Working Projects</div>
            </div>
        </div>

        <!-- Search and Filter Controls -->
        <div class="controls">
            <input 
                type="text" 
                id="search-input" 
                class="search-box" 
                placeholder="🔍 Search projects by name, description, or tags..."
                aria-label="Search projects"
            >
            <div class="filter-buttons" id="category-filters">
                <button class="filter-btn active" data-category="all">All Projects</button>
            </div>
            <div style="margin-top: 1rem;">
                <div style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; margin-bottom: 0.5rem;">Filter by Status:</div>
                <div class="filter-buttons" id="status-filters">
                    <button class="filter-btn active" data-status="all" onclick="filterByStatus('all')">All Status</button>
                    <button class="filter-btn" data-status="working" onclick="filterByStatus('working')">✓ Working</button>
                    <button class="filter-btn" data-status="partial" onclick="filterByStatus('partial')">◐ Partial</button>
                    <button class="filter-btn" data-status="broken" onclick="filterByStatus('broken')">✗ Broken</button>
                    <button class="filter-btn" data-status="untested" onclick="filterByStatus('untested')">? Untested</button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading projects...</p>
        </div>

        <!-- Projects Content -->
        <div id="projects-content"></div>

        <!-- No Results State -->
        <div id="no-results" class="no-results" style="display: none;">
            <div class="no-results-icon">🔍</div>
            <h2>No projects found</h2>
            <p>Try adjusting your search or filters</p>
        </div>
    </div>

    <script>
        // State
        let allProjects = [];
        let currentFilter = 'all';
        let currentStatusFilter = 'all';
        let searchQuery = '';

        // Category icons mapping
        const categoryIcons = {
            '3D Graphics': '🎨',
            'AI & Machine Learning': '🤖',
            'Art & Design': '🖼️',
            'Blockchain & Crypto': '⛓️',
            'Dashboards': '📊',
            'Data & Analytics': '📈',
            'E-commerce & Sales': '🛒',
            'Education & Learning': '📚',
            'Gaming': '🎮',
            'Government & Grants': '🏛️',
            'Miscellaneous': '🔧',
            'Real Estate': '🏠',
            'Security & Safety': '🔒',
            'Social & Communication': '💬',
            'Tools & Utilities': '🛠️',
            'Trading & Finance': '💰'
        };

        // Load projects data
        async function loadProjects() {
            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                
                allProjects = data.projects || [];
                
                // Update stats
                document.getElementById('total-projects').textContent = data.meta.total_projects || allProjects.length;
                document.getElementById('total-categories').textContent = data.meta.categories || 0;
                
                // Calculate average completion
                const avgCompletion = data.meta.stats?.avgCompletion || 
                    Math.round(allProjects.reduce((sum, p) => sum + (p.completion || 0), 0) / allProjects.length);
                document.getElementById('avg-completion').textContent = `${avgCompletion}%`;
                
                // Count working projects
                const workingCount = allProjects.filter(p => p.functionality === 'working').length;
                document.getElementById('working-projects').textContent = workingCount;
                
                // Create category filters
                createCategoryFilters(data.category_summary);
                
                // Hide loading, render projects
                document.getElementById('loading').style.display = 'none';
                renderProjects();
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('loading').innerHTML = '<p>Error loading projects. Please try again later.</p>';
            }
        }

        // Create category filter buttons
        function createCategoryFilters(categorySummary) {
            const filtersContainer = document.getElementById('category-filters');
            
            // Keep "All Projects" button
            const allButton = filtersContainer.querySelector('[data-category="all"]');
            
            // Add category buttons
            Object.entries(categorySummary).forEach(([category, count]) => {
                const button = document.createElement('button');
                button.className = 'filter-btn';
                button.dataset.category = category;
                button.innerHTML = `${categoryIcons[category] || '📁'} ${category} (${count})`;
                button.addEventListener('click', () => filterByCategory(category));
                filtersContainer.appendChild(button);
            });
        }

        // Filter by category
        function filterByCategory(category) {
            currentFilter = category;
            
            // Update active button
            document.querySelectorAll('#category-filters .filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });
            
            renderProjects();
        }

        // Filter by status
        function filterByStatus(status) {
            currentStatusFilter = status;
            
            // Update active button
            document.querySelectorAll('#status-filters .filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.status === status) {
                    btn.classList.add('active');
                }
            });
            
            renderProjects();
        }

        // Search functionality
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderProjects();
        });

        // Render projects
        function renderProjects() {
            const contentContainer = document.getElementById('projects-content');
            const noResultsContainer = document.getElementById('no-results');
            
            // Filter projects
            let filteredProjects = allProjects;
            
            // Filter by category
            if (currentFilter !== 'all') {
                filteredProjects = filteredProjects.filter(p => p.category === currentFilter);
            }
            
            // Filter by status
            if (currentStatusFilter !== 'all') {
                filteredProjects = filteredProjects.filter(p => p.functionality === currentStatusFilter);
            }
            
            // Filter by search query
            if (searchQuery) {
                filteredProjects = filteredProjects.filter(p => {
                    const searchText = `${p.title} ${p.description} ${p.tags.join(' ')}`.toLowerCase();
                    return searchText.includes(searchQuery);
                });
            }
            
            // Show/hide no results
            if (filteredProjects.length === 0) {
                contentContainer.innerHTML = '';
                noResultsContainer.style.display = 'block';
                return;
            } else {
                noResultsContainer.style.display = 'none';
            }
            
            // Group by category
            const projectsByCategory = {};
            filteredProjects.forEach(project => {
                if (!projectsByCategory[project.category]) {
                    projectsByCategory[project.category] = [];
                }
                projectsByCategory[project.category].push(project);
            });
            
            // Render categories
            contentContainer.innerHTML = '';
            Object.entries(projectsByCategory).forEach(([category, projects]) => {
                const categorySection = document.createElement('div');
                categorySection.className = 'category-section';
                
                categorySection.innerHTML = `
                    <div class="category-header">
                        <span class="category-icon">${categoryIcons[category] || '📁'}</span>
                        <h2 class="category-title">${category}</h2>
                        <span class="category-count">${projects.length} project${projects.length !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="projects-grid">
                        ${projects.map(project => createProjectCard(project)).join('')}
                    </div>
                `;
                
                contentContainer.appendChild(categorySection);
            });
        }

        // Create project card HTML
        function createProjectCard(project) {
            const tags = project.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('');
            
            // Get completion percentage
            const completion = project.completion || 0;
            
            // Get functionality status
            const functionality = project.functionality || 'untested';
            const functionalityClass = `functionality-${functionality}`;
            
            // Functionality icons and labels
            const functionalityInfo = {
                'working': { icon: '✓', label: 'Working' },
                'partial': { icon: '◐', label: 'Partial' },
                'broken': { icon: '✗', label: 'Broken' },
                'untested': { icon: '?', label: 'Untested' }
            };
            
            const funcInfo = functionalityInfo[functionality] || functionalityInfo.untested;
            
            return `
                <div class="project-card" onclick="openProject('${project.url}')">
                    <h3 class="project-title">${project.title}</h3>
                    <p class="project-description">${project.description}</p>
                    <div class="project-tags">${tags}</div>
                    <div class="project-status">
                        <div class="completion-bar-container">
                            <div class="completion-label">
                                <span>Completion</span>
                                <span class="completion-percentage">${completion}%</span>
                            </div>
                            <div class="completion-bar">
                                <div class="completion-fill" style="width: ${completion}%"></div>
                            </div>
                        </div>
                        <div class="functionality-badge ${functionalityClass}">
                            <span class="status-icon">${funcInfo.icon}</span>
                            <span>${funcInfo.label}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Open project
        function openProject(url) {
            window.location.href = url;
        }

        // Initialize
        loadProjects();
    </script>
</body>
