<!DOCTYPE html>

<html lang="en">
<head>
  <meta name="rootib" content="RootIB: RB-20260319142113-7319A19A">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Passport - Consciousness Revolution</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }

        .auth-container {
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #7b2cbf, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #888;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab:hover { color: #fff; }

        .tab.active {
            color: #7b2cbf;
            border-bottom-color: #7b2cbf;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7b2cbf;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #7b2cbf, #00d4ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: rgba(0, 200, 83, 0.1);
            border: 1px solid #00c853;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #00c853;
            font-size: 0.9rem;
            display: none;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .footer-links a {
            color: #7b2cbf;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .journey-hint {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(123, 44, 191, 0.1);
            border-radius: 10px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .journey-hint strong {
            color: #7b2cbf;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        .forgot-password-link {
            text-align: right;
            margin-top: 10px;
        }

        .forgot-password-link a {
            color: #7b2cbf;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>Forge Passport</h1>
            <p>Your journey through the 7 Forges begins here</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">Login</div>
            <div class="tab" onclick="showTab('signup')">Create Account</div>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <!-- Login Form -->
        <div class="form-section active" id="login-section">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">Enter the Forge</button>
                <div class="forgot-password-link">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>
            </form>
        </div>

        <!-- Signup Form -->
        <div class="form-section" id="signup-section">
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required minlength="8">
                    <p class="password-requirements">8+ characters with letters and numbers</p>
                </div>
                <div class="form-group">
                    <label for="signup-password-confirm">Confirm Password</label>
                    <input type="password" id="signup-password-confirm" placeholder="Enter password again" required minlength="8">
                </div>
                <button type="submit" class="submit-btn" id="signup-btn">Begin Your Journey</button>
            </form>
        </div>

        <div class="journey-hint">
            <strong>Pattern:</strong> 3 &rarr; 7 &rarr; 13 &rarr; &infin;<br>
            Your identity evolves as you traverse the Forges
        </div>

        <div class="footer-links">
            <a href="index.html">Return to Home</a>
        </div>
    </div>

    <script>
        function showTab(tab) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update sections
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab + '-section').classList.add('active');

            // Clear messages
            hideMessages();
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const el = document.getElementById('success-message');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();

            const btn = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            btn.disabled = true;
            btn.textContent = 'Entering...';

            try {
                const res = await fetch('/.netlify/functions/auth-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Login failed. Please check your credentials.');
                    btn.disabled = false;
                    btn.textContent = 'Enter the Forge';
                    return;
                }

                // Success - redirect to dashboard
                showSuccess('Welcome back! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 500);

            } catch (err) {
                showError('Connection error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Enter the Forge';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            hideMessages();

            const btn = document.getElementById('signup-btn');
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;

            // Password match validation
            if (password !== passwordConfirm) {
                showError('Passwords do not match.');
                return;
            }

            // Basic validation
            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                showError('Password must contain both letters and numbers.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const res = await fetch('/.netlify/functions/auth-signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        full_name: name
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Signup failed. Please try again.');
                    btn.disabled = false;
                    btn.textContent = 'Begin Your Journey';
                    return;
                }

                // Check if email confirmation needed
                if (data.needs_confirmation) {
                    showSuccess('Account created! Check your email for a confirmation link, then come back and login.');
                    btn.disabled = false;
                    btn.textContent = 'Begin Your Journey';

                    // Pre-fill email and switch to login tab after delay
                    setTimeout(() => {
                        document.getElementById('login-email').value = email;
                        document.querySelectorAll('.tab')[0].click();
                        hideMessages();
                        showSuccess('Email pre-filled. Login after confirming your email.');
                    }, 3000);
                } else {
                    // No confirmation needed - auto-login
                    showSuccess('Account created! Logging you in...');
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = password;

                    setTimeout(() => {
                        document.getElementById('login-btn').click();
                    }, 500);
                }

            } catch (err) {
                showError('Connection error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Begin Your Journey';
            }
        }

        // Check if already logged in
        async function checkSession() {
            try {
                const res = await fetch('/.netlify/functions/auth-me', {
                    credentials: 'include'
                });

                if (res.ok) {
                    // Already logged in, redirect to dashboard
                    window.location.href = '/dashboard.html';
                }
            } catch (err) {
                // Not logged in, stay on page
            }
        }

        // Check on load
        checkSession();
    </script>
  <script src="/js/mesh-engine-client.js"></script>
</body>
</html>
