<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander Approval Queue | Framework Changes</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --surface-hover: #1a1a1a;
            --border: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --warning: #ff8800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,68,68,0.1));
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-dim);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
        }

        .stat-value.pending { color: var(--warning); }
        .stat-value.approved { color: var(--success); }
        .stat-value.denied { color: var(--danger); }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .queue-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .queue-section {
            margin-bottom: 30px;
        }

        .queue-section h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .queue-item {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .queue-item:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .queue-item.approved {
            border-color: var(--success);
            opacity: 0.7;
        }

        .queue-item.denied {
            border-color: var(--danger);
            opacity: 0.7;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .item-source {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255,215,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .item-meta {
            font-size: 0.85rem;
        }

        .item-dashboard {
            font-weight: 600;
            color: var(--text);
        }

        .item-time {
            color: var(--text-dim);
        }

        .item-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .item-badge.pending {
            background: rgba(255,136,0,0.2);
            color: var(--warning);
        }

        .item-badge.approved {
            background: rgba(0,255,136,0.2);
            color: var(--success);
        }

        .item-badge.denied {
            background: rgba(255,68,68,0.2);
            color: var(--danger);
        }

        .item-content {
            background: var(--bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .change-type {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .change-detail {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 8px;
        }

        .change-label {
            color: var(--text-dim);
        }

        .change-value {
            color: var(--text);
        }

        .change-value.old {
            color: var(--danger);
            text-decoration: line-through;
        }

        .change-value.new {
            color: var(--success);
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-approve {
            background: var(--success);
            color: var(--bg);
            flex: 1;
        }

        .btn-approve:hover {
            background: #00cc6a;
            transform: scale(1.02);
        }

        .btn-deny {
            background: var(--danger);
            color: var(--bg);
            flex: 1;
        }

        .btn-deny:hover {
            background: #cc3333;
            transform: scale(1.02);
        }

        .btn-modify {
            background: var(--border);
            color: var(--text);
        }

        .btn-modify:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 10px;
            color: var(--text);
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(255,215,0,0.3);
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .nav-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .stats-bar {
                flex-wrap: wrap;
                gap: 20px;
            }

            .item-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🔒 COMMANDER APPROVAL QUEUE</h1>
        <p>Framework changes requiring your authorization</p>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value pending" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat">
                <div class="stat-value approved" id="approvedCount">0</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat">
                <div class="stat-value denied" id="deniedCount">0</div>
                <div class="stat-label">Denied</div>
            </div>
        </div>

        <div class="nav-links">
            <a href="/LIFEFORGE_DOMAIN_REMINDER_v1.html" class="nav-link">← LIFEFORGE Widget</a>
            <a href="/araya-chat.html" class="nav-link">ARAYA Chat →</a>
        </div>
    </header>

    <div class="queue-container">
        <!-- Pending Section -->
        <div class="queue-section" id="pendingSection">
            <h2>⏳ Pending Approval</h2>
            <div id="pendingQueue"></div>
        </div>

        <!-- History Section -->
        <div class="queue-section" id="historySection">
            <h2>📋 Recent Decisions</h2>
            <div id="historyQueue"></div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadQueue()" title="Refresh">🔄</button>

    <script>
        // ============================================================
        // APPROVAL QUEUE MANAGEMENT
        // ============================================================

        const QUEUE_KEY = 'araya_approval_queue';
        const HISTORY_KEY = 'araya_approval_history';

        function loadQueue() {
            const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

            // Count stats
            const pending = queue.filter(item => item.status === 'pending');
            const approved = history.filter(item => item.status === 'approved');
            const denied = history.filter(item => item.status === 'denied');

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('approvedCount').textContent = approved.length;
            document.getElementById('deniedCount').textContent = denied.length;

            // Render pending
            renderPending(pending);

            // Render history (last 10)
            renderHistory(history.slice(-10).reverse());
        }

        function renderPending(items) {
            const container = document.getElementById('pendingQueue');

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">✅</div>
                        <h3>All Clear, Commander</h3>
                        <p>No framework changes pending approval</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="queue-item" data-id="${item.id}">
                    <div class="item-header">
                        <div class="item-source">
                            <div class="item-icon">📝</div>
                            <div class="item-meta">
                                <div class="item-dashboard">${item.dashboard || 'Unknown Dashboard'}</div>
                                <div class="item-time">${formatTime(item.timestamp)}</div>
                            </div>
                        </div>
                        <span class="item-badge pending">Pending</span>
                    </div>

                    <div class="item-content">
                        <div class="change-type">Change Type: ${item.change?.type || 'content'}</div>
                        <div class="change-detail">
                            <span class="change-label">Target:</span>
                            <span class="change-value">${item.change?.selector || 'N/A'}</span>
                        </div>
                        <div class="change-detail">
                            <span class="change-label">Old:</span>
                            <span class="change-value old">${truncate(item.change?.oldValue, 100)}</span>
                        </div>
                        <div class="change-detail">
                            <span class="change-label">New:</span>
                            <span class="change-value new">${truncate(item.change?.newValue, 100)}</span>
                        </div>
                        <div class="change-detail">
                            <span class="change-label">Reason:</span>
                            <span class="change-value">${item.change?.reason || 'Framework protection'}</span>
                        </div>
                    </div>

                    <div class="item-actions">
                        <button class="btn btn-approve" onclick="approve(${item.id})">
                            ✓ Approve
                        </button>
                        <button class="btn btn-deny" onclick="deny(${item.id})">
                            ✕ Deny
                        </button>
                        <button class="btn btn-modify" onclick="modify(${item.id})">
                            ✎ Modify
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderHistory(items) {
            const container = document.getElementById('historyQueue');

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📜</div>
                        <h3>No History Yet</h3>
                        <p>Decisions will appear here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="queue-item ${item.status}">
                    <div class="item-header">
                        <div class="item-source">
                            <div class="item-icon">${item.status === 'approved' ? '✅' : '❌'}</div>
                            <div class="item-meta">
                                <div class="item-dashboard">${item.dashboard || 'Unknown Dashboard'}</div>
                                <div class="item-time">${formatTime(item.decidedAt)}</div>
                            </div>
                        </div>
                        <span class="item-badge ${item.status}">${item.status}</span>
                    </div>

                    <div class="item-content">
                        <div class="change-type">Change Type: ${item.change?.type || 'content'}</div>
                        <div class="change-detail">
                            <span class="change-label">Target:</span>
                            <span class="change-value">${item.change?.selector || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function approve(id) {
            processDecision(id, 'approved');
        }

        function deny(id) {
            processDecision(id, 'denied');
        }

        function modify(id) {
            const newValue = prompt('Enter modified value:');
            if (newValue !== null) {
                const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
                const item = queue.find(i => i.id === id);
                if (item) {
                    item.change.newValue = newValue;
                    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
                    loadQueue();
                }
            }
        }

        function processDecision(id, status) {
            const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

            const itemIndex = queue.findIndex(i => i.id === id);
            if (itemIndex === -1) return;

            const item = queue[itemIndex];
            item.status = status;
            item.decidedAt = new Date().toISOString();

            // Move to history
            history.push(item);
            queue.splice(itemIndex, 1);

            localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

            // If approved, apply the change (broadcast to dashboard)
            if (status === 'approved') {
                applyChange(item);
            }

            loadQueue();
        }

        function applyChange(item) {
            // Store approved changes for dashboards to pick up
            const approved = JSON.parse(localStorage.getItem('araya_approved_changes') || '[]');
            approved.push(item);
            localStorage.setItem('araya_approved_changes', JSON.stringify(approved));
            console.log('Change approved and queued for application:', item);
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'Unknown';
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        function truncate(str, max) {
            if (!str) return 'N/A';
            return str.length > max ? str.substring(0, max) + '...' : str;
        }

        // Add some demo data if empty (for testing)
        function addDemoData() {
            const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            if (queue.length === 0) {
                queue.push({
                    id: Date.now(),
                    timestamp: new Date().toISOString(),
                    dashboard: 'lifeforge-domain-reminder',
                    change: {
                        type: 'content',
                        selector: '.lifeforge-title',
                        oldValue: 'LIFEFORGE',
                        newValue: 'MY COMMAND CENTER',
                        reason: 'Framework element - requires Commander approval'
                    },
                    status: 'pending'
                });
                localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Uncomment to add demo data for testing:
            // addDemoData();
            loadQueue();
        });

        // Auto-refresh every 30 seconds
        setInterval(loadQueue, 30000);
    </script>

</body>
</html>
