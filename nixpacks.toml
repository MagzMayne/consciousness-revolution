# Nixpacks Configuration
# Explicitly configure this as a Node.js ONLY project
# Prevents Ruby/Python detection from Gemfile/.python-version

[phases.setup]
# Use only Node.js 18 - don't auto-detect other languages
nixPkgs = ["nodejs-18_x"]
aptPkgs = []

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit"]

[phases.build]
cmds = ["npm run build || echo 'No build step required'"]

[start]
# Run Node directly so Railway's SIGTERM reaches the Node process, not npm.
# Using "npm run start" caused "npm error signal SIGTERM" because npm itself
# received the signal and reported it as an error even when Node exited cleanly.
cmd = "node start-banksky.js"

[variables]
NODE_ENV = "production"
NPM_CONFIG_LOGLEVEL = "error"
