# Nixpacks Configuration
# Explicitly configure this as a Node.js ONLY project
# Prevents Ruby/Python detection from Gemfile/.python-version

[phases.setup]
# Use only Node.js 18 - don't auto-detect other languages
nixPkgs = ["nodejs-18_x"]
aptPkgs = []

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit"]

[phases.build]
cmds = ["npm run build || echo 'No build step required'"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
NPM_CONFIG_LOGLEVEL = "error"
