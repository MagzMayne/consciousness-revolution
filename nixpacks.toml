# Nixpacks Configuration
# Explicitly configure this as a Node.js project to prevent Ruby detection

[phases.setup]
nixPkgs = ["nodejs-18_x", "npm"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build || echo 'No build step required'"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
