<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander Message Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select option {
            background: #1a1a2e;
            color: white;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            display: block;
            background: rgba(46, 213, 115, 0.2);
            border: 1px solid #2ed573;
            color: #2ed573;
        }

        .status.error {
            display: block;
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .team-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 30px;
        }

        .team-member {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-member .name {
            color: #fff;
        }

        .team-member .role {
            color: #888;
            font-size: 12px;
        }

        .history-section {
            margin-top: 30px;
        }

        .history-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #888;
        }

        .history-text {
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Commander Message Center</h1>
        <p class="subtitle">Send messages directly to team dashboards</p>

        <div class="card">
            <label>Commander Key</label>
            <input type="password" id="commanderKey" placeholder="Enter your commander key" value="">

            <label>Send To</label>
            <select id="recipient">
                <option value="all">ALL TEAM (Broadcast)</option>
                <optgroup label="Individual Members">
                    <option value="josh_serrano">Josh Serrano</option>
                    <option value="maggie">Maggie</option>
                    <option value="josh_bogart">Josh Bogart</option>
                    <option value="patrick">Patrick (Irish)</option>
                    <option value="chris_dobbins">Chris Dobbins</option>
                    <option value="toby">Toby</option>
                    <option value="dean">Dean</option>
                    <option value="alex">Alex</option>
                    <option value="nero">Nero</option>
                    <option value="tiger">Tiger</option>
                </optgroup>
            </select>

            <label>Priority</label>
            <div class="row">
                <select id="priority">
                    <option value="normal">Normal</option>
                    <option value="low">Low</option>
                    <option value="high">High</option>
                    <option value="urgent">URGENT</option>
                </select>
                <input type="text" id="senderName" placeholder="From (default: Commander)" value="Commander">
            </div>

            <label>Message</label>
            <textarea id="messageText" placeholder="Type your message to the team..."></textarea>

            <label>Quick Messages</label>
            <div class="quick-buttons">
                <button type="button" class="quick-btn" onclick="setQuickMessage('Check your dashboard for updates.')">Dashboard Update</button>
                <button type="button" class="quick-btn" onclick="setQuickMessage('Team call in 30 minutes. Join Discord.')">Team Call</button>
                <button type="button" class="quick-btn" onclick="setQuickMessage('Great work today. Keep it up!')">Encouragement</button>
                <button type="button" class="quick-btn" onclick="setQuickMessage('Please check in when you get a chance.')">Check In</button>
                <button type="button" class="quick-btn" onclick="setQuickMessage('New task assigned. See your cockpit.')">New Task</button>
                <button type="button" class="quick-btn" onclick="setQuickMessage('Call me when you can.')">Call Request</button>
            </div>

            <button onclick="sendMessage()" id="sendBtn">Send Message</button>

            <div class="status" id="status"></div>
        </div>

        <div class="card">
            <label>Team Members</label>
            <div class="team-list">
                <div class="team-member">
                    <span class="name">Josh Serrano</span>
                    <span class="role">Philadelphia</span>
                </div>
                <div class="team-member">
                    <span class="name">Maggie</span>
                    <span class="role">Seattle</span>
                </div>
                <div class="team-member">
                    <span class="name">Josh Bogart</span>
                    <span class="role">Spokane</span>
                </div>
                <div class="team-member">
                    <span class="name">Patrick</span>
                    <span class="role">Hawaii</span>
                </div>
                <div class="team-member">
                    <span class="name">Chris Dobbins</span>
                    <span class="role">New York</span>
                </div>
                <div class="team-member">
                    <span class="name">Toby</span>
                    <span class="role">-</span>
                </div>
                <div class="team-member">
                    <span class="name">Dean</span>
                    <span class="role">-</span>
                </div>
                <div class="team-member">
                    <span class="name">Alex</span>
                    <span class="role">New</span>
                </div>
            </div>
        </div>

        <div class="card history-section">
            <label>Recent Sent Messages</label>
            <div id="historyList">
                <p style="color: #666; font-size: 14px;">Messages you send will appear here.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/.netlify/functions/team-messages';
        let sentHistory = JSON.parse(localStorage.getItem('commanderMessageHistory') || '[]');

        function setQuickMessage(text) {
            document.getElementById('messageText').value = text;
        }

        async function sendMessage() {
            const key = document.getElementById('commanderKey').value.trim();
            const to = document.getElementById('recipient').value;
            const priority = document.getElementById('priority').value;
            const from = document.getElementById('senderName').value.trim() || 'Commander';
            const message = document.getElementById('messageText').value.trim();

            const status = document.getElementById('status');
            const sendBtn = document.getElementById('sendBtn');

            if (!key) {
                showStatus('Please enter your commander key', 'error');
                return;
            }

            if (!message) {
                showStatus('Please enter a message', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, to, message, priority, from })
                });

                const data = await response.json();

                if (data.success) {
                    showStatus(`Message sent to ${to === 'all' ? 'ALL TEAM' : to}!`, 'success');

                    // Add to history
                    sentHistory.unshift({
                        to,
                        message,
                        priority,
                        time: new Date().toISOString()
                    });
                    sentHistory = sentHistory.slice(0, 10); // Keep last 10
                    localStorage.setItem('commanderMessageHistory', JSON.stringify(sentHistory));
                    renderHistory();

                    // Clear message
                    document.getElementById('messageText').value = '';
                } else {
                    showStatus(data.error || 'Failed to send', 'error');
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
            }

            sendBtn.disabled = false;
            sendBtn.textContent = 'Send Message';
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function renderHistory() {
            const list = document.getElementById('historyList');

            if (sentHistory.length === 0) {
                list.innerHTML = '<p style="color: #666; font-size: 14px;">Messages you send will appear here.</p>';
                return;
            }

            list.innerHTML = sentHistory.map(item => `
                <div class="history-item">
                    <div class="history-meta">
                        <span>To: ${item.to === 'all' ? 'ALL TEAM' : item.to}</span>
                        <span>${formatTime(item.time)}</span>
                    </div>
                    <div class="history-text">${escapeHtml(item.message)}</div>
                </div>
            `).join('');
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load saved key if exists
        const savedKey = localStorage.getItem('commanderKey');
        if (savedKey) {
            document.getElementById('commanderKey').value = savedKey;
        }

        // Save key on change
        document.getElementById('commanderKey').addEventListener('change', function() {
            localStorage.setItem('commanderKey', this.value);
        });

        // Initial render
        renderHistory();
    </script>
</body>
</html>
