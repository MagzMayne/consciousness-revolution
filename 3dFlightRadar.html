/* ════════════════════════════════════════════════════════
   OPENSKY FETCH  (city bbox OR full-global for WORLD)
════════════════════════════════════════════════════════ */
const BBOX_DEG = 4.0;

async function fetchOpenSky(cityKey) {
  let url;
  if (cityKey === 'WORLD') {
    url = 'https://opensky-network.org/api/states/all';
  } else {
    const { lat, lon } = CITIES[cityKey];
    url = `https://opensky-network.org/api/states/all?lamin=${(lat-BBOX_DEG).toFixed(4)}&lomin=${(lon-BBOX_DEG).toFixed(4)}&lamax=${(lat+BBOX_DEG).toFixed(4)}&lomax=${(lon+BBOX_DEG).toFixed(4)}`;
  }
  const ctrl    = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 10000);
  try {
    const resp = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timeout);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data || !Array.isArray(data.states)) return null;
    let states = data.states.filter(s => s[5] != null && s[6] != null);
    // Limit global view to 800 aircraft to maintain performance
    if (cityKey === 'WORLD' && states.length > 800) {
      states = states.filter((_, i) => i % Math.ceil(states.length / 800) === 0);
    }
    return states.map(s => {
      const icao24   = s[0] || '';
      const callsign = (s[1] || s[0] || '???').trim();
      const flight = {
        icao24,
        callsign,
        country:  s[2]  || '',
        lon:      s[5],
        lat:      s[6],
        altFt:    s[7]  != null ? Math.round(s[7]  * 3.28084) : 5000,
        onGround: !!s[8],
        spdKts:   s[9]  != null ? Math.round(s[9]  * 1.94384) : 0,
        heading:  s[10] != null ? s[10] : 0,
        vertRate: s[11] != null ? s[11] : 0,
      };
      flight.military   = isMilitary(flight);
      flight.flightType = classifyFlight(flight);
      return flight;
    });
  } catch (_) { clearTimeout(timeout); return null; }
}

const MILITARY_COLOR_RGB  = [255, 60, 80];
const COMMERCIAL_COLOR_RGB = [72, 187, 120];   // #48bb78 green
const PRIVATE_COLOR_RGB    = [159, 122, 234];  // #9f7aea purple

function altColor(altFt, military = false) {
  if (military) return '#ff3c50';
  if (altFt < 10000) return '#00e5ff';
  if (altFt < 30000) return '#63b3ed';
  return '#f6ad55';
}

function altRGBA(altFt, a = 255, military = false) {
  if (military) return [255, 60, 80, a];
  if (altFt < 10000) return [0, 229, 255, a];
  if (altFt < 30000) return [99, 179, 237, a];
  return [246, 173, 85, a];
}

/* Type-based colour — commercial=green, private=purple, military=red */
function typeRGBA(flight, a = 255) {
  if (flight.military) return [...MILITARY_COLOR_RGB, a];
  if (flight.flightType === 'private') return [...PRIVATE_COLOR_RGB, a];
  return [...COMMERCIAL_COLOR_RGB, a];
}

/* ════════════════════════════════════════════════════════
   MILITARY AIRCRAFT DETECTION
   Sources: callsign patterns + ICAO Mode-S hex ranges
════════════════════════════════════════════════════════ */
const MIL_CALLSIGN_RE = [
  /^RCH\d+/,   // USAF Air Mobility Command (Reach)
  /^DUKE\d*/,  // USAF
  /^VENUS\d*/, // USAF
  /^BLADE\d*/, // USAF
  /^RAGE\d*/,  // USAF
  /^SPAR\d+/,  // USAF VIP transport
  /^SAM\d+/,   // Special Air Mission
  /^PAT\d+/,   // US Presidential / VIP
  /^IRON\d*/,  // RAF
  /^NATO\d*/,  // NATO
  /^USAF\d*/,  // US Air Force generic
  /^USMC\d*/,  // US Marines
  /^USCG\d*/,  // US Coast Guard
  /^ARMY\d*/,  // US Army
  /^NAVY\d*/,  // US Navy
  /^GAF\d+/,   // German Air Force (Luftwaffe)
  /^BAF\d+/,   // Belgian Air Force
  /^FAF\d+/,   // French Air Force
  /^RFR\d+/,   // Armée de l'Air (France)
  /^SHF\d*/,   // Swiss Air Force
  /^NOAA\d*/,  // NOAA aircraft
  /^NASA\d*/,  // NASA
  /^EXEC\d+/,  // US Executive flights
  /^ASCOT\d*/, // RAF Air Transport (UK)
  /^ATLAS\d*/, // NATO heavy transport
  /^SVF\d+/,   // Swedish Air Force
  /^NAF\d+/,   // Norwegian Air Force
  /^FNF\d+/,   // Finnish Air Force
  /^PLF\d+/,   // Polish Air Force
  /^AMI\d+/,   // Italian Aeronautica Militare
  /^IAM\d+/,   // Italian Air Force variant
  /^TFF\d+/,   // Turkish Air Force
  /^UAF\d+/,   // Ukrainian Air Force
  /^UKF\d+/,   // Ukrainian Air Force variant
  /^RAAF\d*/,  // Royal Australian Air Force
  /^RNZAF\d*/, // Royal New Zealand Air Force
  /^RNAF\d*/,  // Royal Netherlands Air Force / Royal Norwegian
  /^CAF\d+/,   // Canadian Air Force
  /^SPARTA\d*/, // Various military transport
  /^JAKE\d*/,  // USAF training
  /^BISON\d*/, // USAF / NATO
  /^RFF\d*/,   // Russian Air Force (state)
  /^RSD\d*/,   // Russian state transport
  /^IAF\d*/,   // Israeli Air Force
  /^ISAF\d*/,  // Israeli Air Force variant
  /^RSAF\d*/,  // Royal Saudi Air Force
  /^UAEAF\d*/, // UAE Air Force
  /^QEAF\d*/,  // Qatar Emiri Air Force
];

function isMilitary(flight) {
  const cs   = (flight.callsign || '').trim().toUpperCase();
  const icao = (flight.icao24   || '').toLowerCase();
  if (MIL_CALLSIGN_RE.some(re => re.test(cs))) return true;
  // US military ICAO hex: AE0000–AEFFFF
  if (icao >= 'ae0000' && icao <= 'aeffff') return true;
  // UK military: 43C000–43CFFF
  if (icao >= '43c000' && icao <= '43cfff') return true;
  // French military: 3A8000–3A8FFF
  if (icao >= '3a8000' && icao <= '3a8fff') return true;
  // German Luftwaffe: 3DC000–3DFFFF
  if (icao >= '3dc000' && icao <= '3dffff') return true;
  // Italian Aeronautica Militare: 3E8000–3EFFFF
  if (icao >= '3e8000' && icao <= '3effff') return true;
  // Swedish Air Force: 4A8000–4A9FFF
  if (icao >= '4a8000' && icao <= '4a9fff') return true;
  // Norwegian Air Force: 47C000–47FFFF
  if (icao >= '47c000' && icao <= '47ffff') return true;
  // NATO AWACS / joint: 45C000–45CFFF
  if (icao >= '45c000' && icao <= '45cfff') return true;
  // Israeli Air Force: 738000–73BFFF
  if (icao >= '738000' && icao <= '73bfff') return true;
  // Saudi Air Force: 710000–717FFF
  if (icao >= '710000' && icao <= '717fff') return true;
  // UAE Air Force: 896000–899FFF
  if (icao >= '896000' && icao <= '899fff') return true;
  return false;
}

/* ════════════════════════════════════════════════════════
   FLIGHT TYPE CLASSIFICATION  (commercial / private / military)
   Commercial: ICAO airline designator (2–3 letters) + flight number
   Private:    registration-style callsign or unknown format
════════════════════════════════════════════════════════ */
function classifyFlight(flight) {
  if (flight.military) return 'military';
  const cs = (flight.callsign || '').trim().toUpperCase();
  // 2–3 uppercase letters (ICAO airline code) + 1–4 digits + optional suffix letter.
  // Note: best-effort heuristic; edge-case registrations matching this pattern are rare.
  if (cs.length >= 4 && /^[A-Z]{2,3}\d{1,4}[A-Z]?$/.test(cs)) return 'commercial';
  return 'private';
}

   SAFETY ZONES  (persisted to localStorage)
════════════════════════════════════════════════════════ */
const ZONES_KEY = 'flightRadar_zones_v1';
let zones = [];
try { zones = JSON.parse(localStorage.getItem(ZONES_KEY) || '[]'); } catch (err) {
  console.error('[FlightRadar] Failed to load zones from localStorage:', err);
}

// Use a simple counter for zone IDs to avoid Date.now() collision risk
let _zoneIdCounter = zones.length ? Math.max(...zones.map(z => z.id)) + 1 : 1;

function saveZones() {
  try { localStorage.setItem(ZONES_KEY, JSON.stringify(zones)); } catch (_) {}
}

function addZone(lat, lon, type, name) {
  zones.push({ id: _zoneIdCounter++, lat, lon, type, name, radiusM: 50000 });
  saveZones();
  renderZonePanel();
}

function removeZone(id) {
  zones = zones.filter(z => z.id !== id);
  saveZones();
  renderZonePanel();
}

function renderZonePanel() {
  const list = document.getElementById('zone-list');
  if (!list) return;
  list.innerHTML = '';
  if (zones.length === 0) {
    list.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);padding:4px 0">No zones defined</div>';
    return;
  }
  zones.forEach(z => {
    const item = document.createElement('div');
    item.className = 'zone-item';
    const color = z.type === 'safe' ? '#00c864' : '#ff3c50';
    item.innerHTML = `
      <div class="zone-dot" style="background:${color};box-shadow:0 0 4px ${color};"></div>
      <span class="zone-item-name" title="${z.name}">${z.name}</span>
      <button class="zone-del" aria-label="Remove zone ${z.name}" data-id="${z.id}">×</button>`;
    list.appendChild(item);
  });
  list.querySelectorAll('.zone-del').forEach(btn => {
    btn.addEventListener('click', () => removeZone(Number(btn.dataset.id)));
  });
}

/* ════════════════════════════════════════════════════════
   EVACUATION ALERTS
════════════════════════════════════════════════════════ */
const alertedZones = new Set();

/**
 * Returns the great-circle distance in metres between two WGS-84 coordinates.
 * Uses the Haversine formula with Earth radius R = 6 371 000 m.
 */
function haversineDistM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function checkEvacuationAlerts(flights) {
  zones.filter(z => z.type === 'danger').forEach(zone => {
    const nearby = flights.filter(f =>
      !f.onGround && haversineDistM(zone.lat, zone.lon, f.lat, f.lon) < zone.radiusM
    );
    if (nearby.length > 0 && !alertedZones.has(zone.id)) {
      alertedZones.add(zone.id);
      triggerEvacAlert(zone, nearby);
    } else if (nearby.length === 0) {
      alertedZones.delete(zone.id);
    }
  });
}

function triggerEvacAlert(zone, flights) {
  const banner = document.getElementById('evac-banner');
  if (!banner) return;
  const mil = flights.filter(f => f.military);
  banner.innerHTML =
    `⚠️ <strong>AREA ALERT</strong>: ${flights.length} aircraft` +
    (mil.length ? ` (${mil.length} military)` : '') +
    ` approaching danger zone "<strong>${zone.name}</strong>". ` +
    `<span style="opacity:0.8">Consider evacuating nearby areas.</span>` +
    ` <button id="evac-dismiss-btn" style="margin-left:10px;background:rgba(255,255,255,0.2);` +
    `border:none;color:#fff;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px">Dismiss</button>`;
  banner.classList.add('visible');
  const dismissBtn = document.getElementById('evac-dismiss-btn');
  if (dismissBtn) dismissBtn.addEventListener('click', dismissEvacAlert);
  setTimeout(() => banner.classList.remove('visible'), EVAC_ALERT_TIMEOUT_MS);
}

function dismissEvacAlert() {
  document.getElementById('evac-banner').classList.remove('visible');
}

/* ════════════════════════════════════════════════════════
   DECK.GL ICON ATLAS — three distinct plane shapes (white mask)
   Slot 0 (x=0):   Commercial airliner — wide wingspan, moderate sweep
   Slot 1 (x=64):  Private jet         — swept wings, narrow fuselage
   Slot 2 (x=128): Military            — original generic fighter shape
════════════════════════════════════════════════════════ */
function buildIconAtlas() {
  const SZ = 64;
  const c = document.createElement('canvas');
  c.width = SZ * 3; c.height = SZ;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';

  // ── Slot 0: Commercial airliner (wide wings, noticeable fuselage width) ──
  {
    const cx = SZ / 2, sc = SZ / 24;
    ctx.beginPath();
    ctx.moveTo(cx,             1   * sc);  // nose tip
    ctx.lineTo(cx + 1.5 * sc,  7.5 * sc);  // forward fuselage right
    ctx.lineTo(cx + 12  * sc,  9.5 * sc);  // right wing tip (wide span)
    ctx.lineTo(cx + 11  * sc, 12   * sc);  // right wing trailing edge
    ctx.lineTo(cx + 2.5 * sc, 11   * sc);  // right wing/body junction
    ctx.lineTo(cx + 3   * sc, 19   * sc);  // right tail root
    ctx.lineTo(cx + 7.5 * sc, 21   * sc);  // right stabiliser tip
    ctx.lineTo(cx + 6.5 * sc, 22.5 * sc);  // right stabiliser trailing
    ctx.lineTo(cx,            21   * sc);  // tail centre
    ctx.lineTo(cx - 6.5 * sc, 22.5 * sc);
    ctx.lineTo(cx - 7.5 * sc, 21   * sc);
    ctx.lineTo(cx - 3   * sc, 19   * sc);
    ctx.lineTo(cx - 2.5 * sc, 11   * sc);
    ctx.lineTo(cx - 11  * sc, 12   * sc);
    ctx.lineTo(cx - 12  * sc,  9.5 * sc);
    ctx.lineTo(cx - 1.5 * sc,  7.5 * sc);
    ctx.closePath();
    ctx.fill();
  }

  // ── Slot 1: Private jet (swept wings further back, narrow fuselage) ──
  {
    const cx = SZ + SZ / 2, sc = SZ / 24;
    ctx.beginPath();
    ctx.moveTo(cx,             0.5 * sc);  // sharper nose
    ctx.lineTo(cx + 1   * sc, 10   * sc);  // narrow forward fuselage right
    ctx.lineTo(cx + 9   * sc, 14   * sc);  // right wing tip (swept back)
    ctx.lineTo(cx + 8   * sc, 16   * sc);  // right wing trailing
    ctx.lineTo(cx + 2   * sc, 13.5 * sc);  // right wing/body junction
    ctx.lineTo(cx + 2   * sc, 20   * sc);  // right tail root
    ctx.lineTo(cx + 5   * sc, 21.5 * sc);  // right stabiliser tip (narrow)
    ctx.lineTo(cx + 4   * sc, 23   * sc);  // right stabiliser trailing
    ctx.lineTo(cx,            22   * sc);  // tail centre
    ctx.lineTo(cx - 4   * sc, 23   * sc);
    ctx.lineTo(cx - 5   * sc, 21.5 * sc);
    ctx.lineTo(cx - 2   * sc, 20   * sc);
    ctx.lineTo(cx - 2   * sc, 13.5 * sc);
    ctx.lineTo(cx - 8   * sc, 16   * sc);
    ctx.lineTo(cx - 9   * sc, 14   * sc);
    ctx.lineTo(cx - 1   * sc, 10   * sc);
    ctx.closePath();
    ctx.fill();
  }

  // ── Slot 2: Military (original generic shape) ──
  {
    const cx = 2 * SZ + SZ / 2, sc = SZ / 24;
    ctx.beginPath();
    ctx.moveTo(cx,              1   * sc);
    ctx.lineTo(cx + 1.2 * sc,   7   * sc);
    ctx.lineTo(cx + 11  * sc,   9   * sc);
    ctx.lineTo(cx + 10  * sc,  11   * sc);
    ctx.lineTo(cx + 2   * sc,  10   * sc);
    ctx.lineTo(cx + 2.5 * sc,  18   * sc);
    ctx.lineTo(cx + 6   * sc,  20   * sc);
    ctx.lineTo(cx + 5   * sc,  21.5 * sc);
    ctx.lineTo(cx,             20   * sc);
    ctx.lineTo(cx - 5   * sc,  21.5 * sc);
    ctx.lineTo(cx - 6   * sc,  20   * sc);
    ctx.lineTo(cx - 2.5 * sc,  18   * sc);
    ctx.lineTo(cx - 2   * sc,  10   * sc);
    ctx.lineTo(cx - 10  * sc,  11   * sc);
    ctx.lineTo(cx - 11  * sc,   9   * sc);
    ctx.lineTo(cx - 1.2 * sc,   7   * sc);
    ctx.closePath();
    ctx.fill();
  }

  return c.toDataURL();
}

const ICON_ATLAS   = buildIconAtlas();
const ICON_MAPPING = {
  commercial: { x:   0, y: 0, width: 64, height: 64, anchorY: 32, mask: true },
  private:    { x:  64, y: 0, width: 64, height: 64, anchorY: 32, mask: true },
  military:   { x: 128, y: 0, width: 64, height: 64, anchorY: 32, mask: true },
};

/* ════════════════════════════════════════════════════════
   TRAIL HISTORY
════════════════════════════════════════════════════════ */
const trailHistory = new Map();
const MAX_TRAIL = 8;

function updateTrails(flights) {
  const active = new Set(flights.map(f => f.icao24));
  flights.forEach(f => {
    const h = trailHistory.get(f.icao24) || [];
    h.push([f.lon, f.lat]);
    if (h.length > MAX_TRAIL) h.shift();
    trailHistory.set(f.icao24, h);
  });
  for (const k of trailHistory.keys()) if (!active.has(k)) trailHistory.delete(k);
}

/* ════════════════════════════════════════════════════════
   MAP INIT
════════════════════════════════════════════════════════ */
const urlParams  = new URLSearchParams(window.location.search);
const paramCity  = (urlParams.get('city') || 'SFO').toUpperCase();
const activeCity = CITIES[paramCity] ? paramCity : 'SFO';

map.getCanvas().addEventListener('contextmenu', e => e.preventDefault());

/* ════════════════════════════════════════════════════════
   CITY PANEL
════════════════════════════════════════════════════════ */
let currentCity = activeCity;

function buildCityPanel() {
  const list = document.getElementById('city-list');
  list.innerHTML = '';
  Object.entries(CITIES).forEach(([iata, info]) => {
    const btn = document.createElement('button');
    btn.className = 'city-btn' + (iata === currentCity ? ' active' : '');

}

function selectCity(iata) {
  currentCity = iata;
  buildCityPanel();
  const { lat, lon, zoom } = CITIES[iata];
  map.flyTo({ center: [lon, lat], zoom, pitch: 55, bearing: -12, duration: 1800, essential: true });
  loadFlights(iata);
}

buildCityPanel();

/* ════════════════════════════════════════════════════════
   FLIGHT CARD
════════════════════════════════════════════════════════ */
const flightCard   = document.getElementById('flight-card');
const cardCallsign = document.getElementById('card-callsign');
const cardCountry  = document.getElementById('card-country');
const cardAlt      = document.getElementById('card-alt-val');
const cardSpd      = document.getElementById('card-spd-val');
const cardHdg      = document.getElementById('card-hdg-val');
const cardVrate    = document.getElementById('card-vrate');

document.getElementById('card-close').addEventListener('click', () => {
  flightCard.classList.remove('visible');
  if (selectedMarker) { selectedMarker.remove(); selectedMarker = null; }
});

function showFlightCard(props) {
  cardCallsign.textContent = props.callsign || props.icao24 || '---';
  let typeLabel, typeColor;
  if (props.military) {
    typeLabel = '⚔ MILITARY';
    typeColor = '#ff3c50';
  } else if (props.flightType === 'private') {
    typeLabel = '🛩 PRIVATE JET';
    typeColor = '#9f7aea';
  } else {
    typeLabel = '✈ COMMERCIAL';
    typeColor = '#48bb78';
  }
  cardCountry.textContent = typeLabel + (props.country ? ' — ' + props.country : '');
  cardCountry.style.color = typeColor;
  cardAlt.textContent      = props.altFt  != null ? props.altFt.toLocaleString()  : '---';
  cardSpd.textContent      = props.spdKts != null ? props.spdKts : '---';
  cardHdg.textContent      = props.heading != null ? Math.round(props.heading) : '---';
  const vr = props.vertRate;
  if (vr != null && Math.abs(vr) > 0.5) {
    const fpm = Math.round(vr * 196.85);
    cardVrate.textContent = (vr > 0 ? '▲ Climbing ' : '▼ Descending ') + Math.abs(fpm).toLocaleString() + ' fpm';
    cardVrate.style.color = vr > 0 ? '#68d391' : '#fc8181';
  } else {
    cardVrate.textContent = '— Cruising';
    cardVrate.style.color = 'rgba(255,255,255,0.35)';
  }
  flightCard.classList.add('visible');
}

/* ════════════════════════════════════════════════════════
   STATUS BAR
════════════════════════════════════════════════════════ */
const statusDot     = document.getElementById('status-dot');
const aircraftCount = document.getElementById('aircraft-count');
const militaryCount = document.getElementById('military-count');

   FLIGHT FILTER (All / Commercial / Military)

/* ════════════════════════════════════════════════════════
   DECK.GL OVERLAY + ANIMATION ENGINE
════════════════════════════════════════════════════════ */
let selectedMarker = null;
let deckOverlay    = null;

// Smooth lerp state for live-data transitions
let aniPrev  = [], aniNext = [], aniT = 1, aniStart = 0;
const ANI_DUR = 2500;

// Demo continuous fly-through state
let isDemoMode = false, lastFrameMs = 0, demoCityKey = null;

// Flag to prevent map-click from closing card when deck handled the click
let deckHandledClick = false;

requestAnimationFrame(function loop(ts) {
  requestAnimationFrame(loop);
  if (!deckOverlay) return;

  let display;

  if (isDemoMode) {
    // Move demo aircraft along their heading each frame
    const realDt = Math.min((ts - lastFrameMs) / 1000, 0.05);
    const dt = realDt * DEMO_TIME_SCALE;  // accelerated demo time
    lastFrameMs = ts;
    aniNext = aniNext.map(f => {
      if (f.onGround) return f;
      const rad  = f.heading * Math.PI / 180;
      const spd  = f.spdKts * KTS_TO_MS;
      const dlat = Math.cos(rad) * spd * dt / M_PER_DEG_LAT;
      const dlon = Math.sin(rad) * spd * dt / (M_PER_DEG_LAT * Math.cos(f.lat * Math.PI / 180));
      return { ...f, lat: f.lat + dlat, lon: f.lon + dlon };
    });
    // Periodically append trail waypoints (every TRAIL_UPDATE_INTERVAL ms, real time)
    if (Math.floor(ts / TRAIL_UPDATE_INTERVAL) !== Math.floor((ts - realDt * 1000) / TRAIL_UPDATE_INTERVAL)) {
      updateTrails(aniNext);
    }
    display = aniNext;
  } else {
    // Lerp between previous and latest position snapshot
    aniT = Math.min(1, (ts - aniStart) / ANI_DUR);
    if (aniT >= 1) {
      display = aniNext;
    } else {
      const pm = new Map(aniPrev.map(f => [f.icao24, f]));
      display = aniNext.map(f => {
        const p = pm.get(f.icao24);
        if (!p) return f;
        // Shortest-path heading lerp: +540%360−180 converts to signed difference in [−180, +180]
        const dh = ((f.heading - p.heading + 540) % 360) - 180;
        return {
          ...f,
          lon:     p.lon     + (f.lon     - p.lon)     * aniT,
          lat:     p.lat     + (f.lat     - p.lat)     * aniT,
          heading: p.heading + dh                      * aniT,
        };
      });
    }
  }

  // Apply active filter
  const filtered = flightFilter === 'commercial' ? display.filter(f => !f.military)
                 : flightFilter === 'military'   ? display.filter(f =>  f.military)
                 : display;

  // Update counts
  const milTotal = display.filter(f => f.military).length;
  aircraftCount.textContent = filtered.length + ' AC';
  if (militaryCount) {
    militaryCount.textContent = milTotal + ' MIL';
    militaryCount.style.display = milTotal > 0 ? '' : 'none';
  }

  // Build trail geometry with altitude z-offset
  const trailData = [];
  filtered.forEach(f => {
    const h = trailHistory.get(f.icao24);
    if (h && h.length >= 2) {
      trailData.push({
        path:       h.map(([lo, la]) => [lo, la, f.altFt * FEET_TO_METERS]),
        altFt:      f.altFt,
        military:   f.military,
        flightType: f.flightType,
      });
    }
  });

  deckOverlay.setProps({ layers: [

    // Safe zones (green circles)
    new deck.ScatterplotLayer({
      id: 'safe-zones',
      data: zones.filter(z => z.type === 'safe'),
      getPosition: d => [d.lon, d.lat, 0],
      getRadius:   d => d.radiusM,
      radiusUnits: 'meters',
      getFillColor: [0, 200, 100, 22],
      getLineColor: [0, 200, 100, 180],
      stroked: true, filled: true,
      lineWidthUnits: 'pixels', getLineWidth: 2,
    }),

    // Danger zones (red circles)
    new deck.ScatterplotLayer({
      id: 'danger-zones',
      data: zones.filter(z => z.type === 'danger'),
      getPosition: d => [d.lon, d.lat, 0],
      getRadius:   d => d.radiusM,
      radiusUnits: 'meters',
      getFillColor: [255, 50, 50, 22],
      getLineColor: [255, 80, 80, 200],
      stroked: true, filled: true,
      lineWidthUnits: 'pixels', getLineWidth: 2,
    }),

    // Ground-shadow dots beneath each airborne aircraft
    new deck.ScatterplotLayer({
      id: 'shadows',
      data: filtered.filter(f => !f.onGround),
      getPosition: d => [d.lon, d.lat, 0],
      getRadius:   2500,
      radiusUnits: 'meters',
      getFillColor: [0, 0, 0, 45],
      stroked: false,
    }),

    // Flight-path trails with altitude colour, z-offset
    new deck.PathLayer({
      id: 'trails',
      data: trailData,
      getPath:  d => d.path,
      getColor: d => typeRGBA(d, TRAIL_ALPHA),
      getWidth: 1.5,
      widthUnits: 'pixels',
    }),

    // Military aircraft glow rings (red pulsing halo)
    new deck.ScatterplotLayer({
      id: 'military-glow',
      data: display.filter(f => f.military),
      getPosition: d => [d.lon, d.lat, d.altFt * FEET_TO_METERS],
      getRadius: 38,
      radiusUnits: 'pixels',
      getFillColor: [...MILITARY_COLOR_RGB, 55],
      stroked: true,
      getLineColor: [...MILITARY_COLOR_RGB, 200],
      getLineWidth: 3,
      lineWidthUnits: 'pixels',
    }),

    // Aircraft icons at true altitude (ft → metres for z)
    new deck.IconLayer({
      id: 'aircraft',
      data: filtered,
      iconAtlas:   ICON_ATLAS,
      iconMapping: ICON_MAPPING,
      getIcon:     d => d.military ? 'military' : (d.flightType === 'private' ? 'private' : 'commercial'),
      getPosition: d => [d.lon, d.lat, d.altFt * FEET_TO_METERS],
      getAngle:    d => -d.heading,
      getSize:     d => d.military ? 32 : (d.flightType === 'private' ? 22 : 30),
      getColor:    d => typeRGBA(d, d.onGround ? 80 : 255),
      pickable: true,
      onHover: info => {
        map.getCanvas().style.cursor = info.object ? 'pointer' : '';
        if (info.object) showFlightCard(info.object);
      },
      onClick: info => {
        if (!info.object) return;
        deckHandledClick = true;
        Promise.resolve().then(() => { deckHandledClick = false; });
        if (selectedMarker) selectedMarker.remove();
        const el = document.createElement('div');
        el.style.cssText = 'width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.7);pointer-events:none;';
        selectedMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
          .setLngLat([info.object.lon, info.object.lat]).addTo(map);
        showFlightCard(info.object);
      }
    }),

  ]});
});

/* ════════════════════════════════════════════════════════
   MAP LOAD
════════════════════════════════════════════════════════ */
map.on('load', () => {
  // ── Lat/lon graticule (military standard) ──────────────────────────────
  (function addGraticuleLines() {
    var feats = [];
    for (var lat = -80; lat <= 80; lat += 10) {
      feats.push({ type:'Feature', geometry:{ type:'LineString', coordinates:[[-180,lat],[180,lat]] }, properties:{} });
    }
    for (var lon = -180; lon <= 180; lon += 10) {
      feats.push({ type:'Feature', geometry:{ type:'LineString', coordinates:[[lon,-80],[lon,80]] }, properties:{} });
    }
    map.addSource('graticule', { type:'geojson', data:{ type:'FeatureCollection', features:feats } });
    map.addLayer({ id:'graticule-lines', type:'line', source:'graticule', paint:{ 'line-color':'rgba(255,255,255,0.2)', 'line-width':0.5, 'line-dasharray':[4,4] } });
  }());
  // ── End graticule ───────────────────────────────────────────────────────

  deckOverlay = new deck.MapboxOverlay({ interleaved: false, layers: [] });
  map.addControl(deckOverlay);

  // Close card when clicking empty map (deck.gl click fires first)
  map.on('click', () => {
    if (!deckHandledClick) {
      flightCard.classList.remove('visible');
      if (selectedMarker) { selectedMarker.remove(); selectedMarker = null; }
    }
  });

  // Right-click to place a zone when in zone-adding mode
  map.on('contextmenu', e => {
    if (!addZoneMode) return;
    e.preventDefault();
    const { lng, lat } = e.lngLat;
    const name = prompt(
      `Name this ${addZoneMode === 'safe' ? '✅ safe zone' : '⚠️ danger zone'}:`,
      `Zone ${zones.length + 1}`
    );
    if (name && name.trim()) {
      addZone(lat, lng, addZoneMode, name.trim());
    }
    setZoneMode(null);
  });

  // Zones toggle button
  document.getElementById('zones-toggle').addEventListener('click', () => {
    const panel = document.getElementById('zones-panel');
    const btn   = document.getElementById('zones-toggle');
    const shown = panel.style.display !== 'none';
    panel.style.display = shown ? 'none' : '';
    btn.classList.toggle('active', !shown);
    if (!shown) renderZonePanel();
  });

  // Zone mode buttons
  document.querySelectorAll('.zone-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      setZoneMode(addZoneMode === mode ? null : mode);
    });
  });

  loadFlights(activeCity);
});

/* ════════════════════════════════════════════════════════
   LOAD / REFRESH FLIGHTS
════════════════════════════════════════════════════════ */
let refreshTimer   = null;
let currentFlights = [];
// Zone placement mode state
let addZoneMode = null;

function setZoneMode(mode) {
  addZoneMode = mode;
  document.querySelectorAll('.zone-mode-btn').forEach(b => b.classList.remove('active'));
  if (mode) {
    const btn = document.querySelector(`.zone-mode-btn[data-mode="${mode}"]`);
    if (btn) btn.classList.add('active');
  }
  document.getElementById('zone-hint').style.display = mode ? '' : 'none';
  document.body.classList.toggle('zone-placing', !!mode);
}

async function loadFlights(cityKey) {
  statusDot.className    = 'loading';
  dataSource.textContent = 'LOADING…';

  let flights = await fetchOpenSky(cityKey);
  const isLive = !!(flights && flights.length > 0);

  if (!isLive) {
    if (!isDemoMode || demoCityKey !== cityKey || aniNext.length === 0) {
      // Generate demo planes on first load or when the city changes
      flights      = generateDemoFlights(cityKey);
      aniPrev      = aniNext.length ? [...aniNext] : [...flights];
      aniNext      = flights;
      aniT         = 0;
      aniStart     = performance.now();
      lastFrameMs  = performance.now();
      updateTrails(flights);
      currentFlights = flights;
      demoCityKey  = cityKey;
    }
    // else: already animating demo for this city – keep current positions
    isDemoMode = true;
  } else {
    isDemoMode = false;
    // Set up smooth position lerp for live data
    aniPrev  = aniNext.length ? [...aniNext] : [...flights];
    aniNext  = flights;
    aniT     = 0;
    aniStart = performance.now();
    updateTrails(flights);
    currentFlights = flights;
  }

  statusDot.className    = isLive ? '' : 'error';
  dataSource.textContent = isLive ? 'LIVE · OpenSky' : 'DEMO';

  // Check evacuation alerts whenever flight data refreshes
  checkEvacuationAlerts(currentFlights);

  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => loadFlights(currentCity), REFRESH_INTERVAL_MS);
}
