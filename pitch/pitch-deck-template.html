<!DOCTYPE html>
<!-- RootIB: RB-20260319142113-C176614C -->
<html lang="en">
<head>
  <meta name="rootib" content="RootIB: RB-20260319142113-C176614C">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Pitch Deck - Consciousness Revolution</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --accent: #00ff00;
            --accent2: #00ffff;
            --text: #e0e0e0;
            --muted: #888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* Slide Container */
        .slides-container {
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .slide {
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .slide.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1 {
            font-size: 72px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 48px;
            color: #fff;
            margin-bottom: 30px;
        }

        h3 {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 28px;
            color: var(--muted);
            margin-bottom: 40px;
        }

        .highlight {
            font-size: 96px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 30px 0;
        }

        /* Cards Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin-top: 40px;
        }

        .card {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 30px;
            text-align: left;
        }

        .card h4 {
            font-size: 24px;
            color: var(--accent2);
            margin-bottom: 15px;
        }

        .card p, .card li {
            font-size: 18px;
            color: #ccc;
            line-height: 1.6;
        }

        .card ul {
            list-style: none;
            padding-left: 0;
        }

        .card li::before {
            content: ">";
            color: var(--accent);
            margin-right: 10px;
        }

        /* Stats */
        .stat {
            text-align: center;
        }

        .stat .value {
            font-size: 48px;
            font-weight: bold;
            color: var(--accent);
        }

        .stat .label {
            font-size: 18px;
            color: var(--muted);
        }

        /* Market Circles */
        .market-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        .market-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--accent);
        }

        .market-circle.tam { width: 250px; height: 250px; }
        .market-circle.sam { width: 180px; height: 180px; background: rgba(0,255,0,0.1); }
        .market-circle.som { width: 120px; height: 120px; background: rgba(0,255,0,0.2); }

        /* Pricing Table */
        .pricing {
            display: flex;
            gap: 30px;
            margin-top: 40px;
        }

        .tier {
            flex: 1;
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .tier.featured {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .tier .price {
            font-size: 48px;
            color: var(--accent);
        }

        .tier .period {
            color: var(--muted);
        }

        /* Progress Bar */
        .use-of-funds {
            width: 100%;
            max-width: 800px;
        }

        .fund-bar {
            display: flex;
            height: 40px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .fund-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        /* Navigation */
        .nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .nav button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav button:hover {
            background: var(--accent);
            color: #000;
        }

        /* Progress Indicator */
        .progress {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .progress .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }

        .progress .dot.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        /* CTA Button */
        .cta {
            display: inline-block;
            padding: 20px 60px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .cta:hover {
            background: var(--accent2);
            transform: scale(1.05);
        }

        /* List */
        .bullet-list {
            text-align: left;
            max-width: 800px;
        }

        .bullet-list li {
            font-size: 24px;
            margin: 15px 0;
            padding-left: 30px;
            position: relative;
        }

        .bullet-list li::before {
            content: ">";
            position: absolute;
            left: 0;
            color: var(--accent);
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="/js/animate-init.js" defer></script>
  <script src="/js/mobile-responsive.js" defer></script>
  <script src="/js/rootib-footer.js" defer></script>
  <script src="/js/futuristic-init.js" defer></script>
</head>
<body>
    <div class="progress" id="progress"></div>

    <div class="slides-container" id="slides"></div>

    <div class="nav">
        <button onclick="prevSlide()">&#8592;</button>
        <button onclick="nextSlide()">&#8594;</button>
    </div>

    <script>
        // Load config from URL param or default
        const urlParams = new URLSearchParams(window.location.search);
        const configFile = urlParams.get('product') || 'araya';

        let config = null;
        let currentSlide = 0;

        async function loadConfig() {
            try {
                const response = await fetch(`configs/${configFile}.json`);
                config = await response.json();
                renderDeck();
            } catch (e) {
                console.error('Failed to load config:', e);
                document.body.innerHTML = '<h1 style="color:#ff0000;text-align:center;margin-top:200px">Config not found: ' + configFile + '</h1>';
            }
        }

        function renderDeck() {
            document.getElementById('page-title').textContent = `${config.product_name} - Investment Deck`;

            const slides = [
                // Slide 1: Title
                `<div class="slide active">
                    <h1>${config.product_name}</h1>
                    <p class="tagline">${config.tagline}</p>
                    <p style="font-size:20px;color:#666">Consciousness Revolution</p>
                </div>`,

                // Slide 2: Problem
                `<div class="slide">
                    <h2>The Problem</h2>
                    <h3>${config.problem.headline}</h3>
                    <ul class="bullet-list">
                        ${config.problem.pain_points.map(p => `<li>${p}</li>`).join('')}
                    </ul>
                    <p class="highlight" style="font-size:48px">${config.problem.market_impact}</p>
                </div>`,

                // Slide 3: Solution
                `<div class="slide">
                    <h2>The Solution</h2>
                    <h3>${config.solution.headline}</h3>
                    <div class="cards">
                        ${config.solution.key_features.map(f => `
                            <div class="card">
                                <p>${f}</p>
                            </div>
                        `).join('')}
                    </div>
                    <p style="margin-top:40px;font-size:24px;color:var(--accent2)">${config.solution.differentiator}</p>
                </div>`,

                // Slide 4: Demo
                `<div class="slide">
                    <h2>See It In Action</h2>
                    <a href="${config.demo.live_url}" target="_blank" class="cta">Live Demo</a>
                    <div class="cards" style="margin-top:40px">
                        ${config.demo.demo_commands.map(c => `
                            <div class="card"><p>"${c}"</p></div>
                        `).join('')}
                    </div>
                </div>`,

                // Slide 5: Market
                `<div class="slide">
                    <h2>Market Opportunity</h2>
                    <div class="market-visual">
                        <div class="market-circle tam">
                            <span class="value" style="font-size:36px">${config.market.tam}</span>
                            <span class="label">TAM</span>
                        </div>
                        <div class="market-circle sam">
                            <span class="value" style="font-size:28px">${config.market.sam}</span>
                            <span class="label">SAM</span>
                        </div>
                        <div class="market-circle som">
                            <span class="value" style="font-size:24px">${config.market.som}</span>
                            <span class="label">SOM</span>
                        </div>
                    </div>
                    <p style="max-width:600px">${config.market.tam_desc}</p>
                </div>`,

                // Slide 6: Business Model
                `<div class="slide">
                    <h2>Business Model</h2>
                    <p style="font-size:28px;margin-bottom:30px">${config.business_model.model}</p>
                    <div class="pricing">
                        ${config.business_model.pricing_tiers.map((t, i) => `
                            <div class="tier ${i === 1 ? 'featured' : ''}">
                                <h4>${t.name}</h4>
                                <p class="price">$${t.price}</p>
                                <p class="period">/month</p>
                                <ul style="text-align:left;margin-top:20px;list-style:none">
                                    ${t.features.map(f => `<li style="margin:10px 0">✓ ${f}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                    <p style="margin-top:30px;color:var(--accent)">LTV:CAC = ${config.business_model.unit_economics.ltv_cac_ratio}</p>
                </div>`,

                // Slide 7: Traction
                `<div class="slide">
                    <h2>Traction</h2>
                    <div class="cards">
                        ${config.traction.growth_metrics.map(m => `
                            <div class="card stat">
                                <p class="value">${m.value}</p>
                                <p class="label">${m.label}</p>
                            </div>
                        `).join('')}
                    </div>
                    <p style="margin-top:40px;font-size:24px">${config.traction.users} ${config.traction.users_label}</p>
                </div>`,

                // Slide 8: Team
                `<div class="slide">
                    <h2>Team</h2>
                    <div class="cards">
                        ${config.team.map(t => `
                            <div class="card">
                                <h4>${t.name}</h4>
                                <p style="color:var(--accent)">${t.role}</p>
                                <p style="margin-top:15px">${t.background}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>`,

                // Slide 9: Ask
                `<div class="slide">
                    <h2>The Ask</h2>
                    <p class="highlight">${config.ask.raising}</p>
                    <p style="font-size:24px;margin-bottom:30px">${config.ask.round} @ ${config.ask.valuation} valuation</p>
                    <div class="use-of-funds">
                        <div class="fund-bar">
                            ${config.ask.use_of_funds.map((f, i) => `
                                <div class="fund-segment" style="width:${f.percent}%;background:${i === 0 ? 'var(--accent)' : i === 1 ? 'var(--accent2)' : '#666'}">${f.percent}%</div>
                            `).join('')}
                        </div>
                        <div style="display:flex;justify-content:space-around">
                            ${config.ask.use_of_funds.map((f, i) => `
                                <div><span style="color:${i === 0 ? 'var(--accent)' : i === 1 ? 'var(--accent2)' : '#666'}">■</span> ${f.category}</div>
                            `).join('')}
                        </div>
                    </div>
                    <p style="margin-top:30px">${config.ask.runway} runway</p>
                </div>`,

                // Slide 10: Contact
                `<div class="slide">
                    <h1>Let's Talk</h1>
                    <p style="font-size:28px;margin:30px 0">${config.contact.email}</p>
                    <a href="https://${config.contact.website}" target="_blank" class="cta">Visit ${config.contact.website}</a>
                    <p style="margin-top:50px;color:var(--muted)">Pattern: 3 → 7 → 13 → ∞</p>
                </div>`
            ];

            document.getElementById('slides').innerHTML = slides.join('');

            // Progress dots
            document.getElementById('progress').innerHTML = slides.map((_, i) =>
                `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`
            ).join('');
        }

        function updateSlide() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        function prevSlide() {
            const slides = document.querySelectorAll('.slide');
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        }

        function goToSlide(n) {
            currentSlide = n;
            updateSlide();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Load on start
        loadConfig();
    </script>
</body>
</html>
