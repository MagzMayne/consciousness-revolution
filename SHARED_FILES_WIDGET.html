<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Files Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           SHARED FILES WIDGET - GTA × RETRO-FUTURE × CYBERPUNK
           In-house file sharing for beta testers
           ═══════════════════════════════════════════════════════════════ */

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.95);
            --cyan: #00ffff;
            --magenta: #ff00ff;
            --gold: #ffd700;
            --green: #00ff00;
            --red: #ff3333;
            --text: #e0e0e0;
            --text-dim: #888;
            --border: rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        /* CRT Scanline Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .widget-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--cyan);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,255,255,0.2);
        }

        /* Header */
        .widget-header {
            background: linear-gradient(90deg, rgba(0,255,255,0.1), transparent);
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widget-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            letter-spacing: 2px;
        }

        .widget-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--green); }
            50% { opacity: 0.5; box-shadow: 0 0 15px var(--green); }
        }

        /* Controls */
        .controls {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 8px 16px;
            background: rgba(0,255,255,0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .control-btn:hover {
            background: rgba(0,255,255,0.2);
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }

        .control-btn.upload {
            border-color: var(--green);
            color: var(--green);
            background: rgba(0,255,0,0.1);
        }

        .control-btn.upload:hover {
            background: rgba(0,255,0,0.2);
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }

        /* File List */
        .file-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            cursor: pointer;
        }

        .file-item:hover {
            background: rgba(0,255,255,0.05);
        }

        .file-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 4px;
        }

        .file-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            gap: 15px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(0,255,255,0.1);
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .action-btn.delete:hover {
            background: rgba(255,0,0,0.1);
            border-color: var(--red);
            color: var(--red);
        }

        /* Category Tags */
        .file-category {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .cat-build { background: rgba(0,255,255,0.2); color: var(--cyan); }
        .cat-docs { background: rgba(255,0,255,0.2); color: var(--magenta); }
        .cat-asset { background: rgba(255,215,0,0.2); color: var(--gold); }
        .cat-code { background: rgba(0,255,0,0.2); color: var(--green); }

        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-dim);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Footer */
        .widget-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .storage-bar {
            width: 150px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .storage-used {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--magenta));
            width: 35%;
        }

        /* Upload Modal */
        .upload-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .upload-modal.active {
            display: flex;
        }

        .upload-box {
            background: var(--bg-card);
            border: 2px dashed var(--cyan);
            border-radius: 12px;
            padding: 60px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .upload-box.dragover {
            border-color: var(--green);
            background: rgba(0,255,0,0.05);
        }

        .upload-box h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan);
            margin-bottom: 15px;
        }

        /* HUD Corner Brackets */
        .hud-bracket {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--cyan);
        }
        .hud-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .hud-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .hud-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .hud-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .widget-container {
            position: relative;
        }

        /* Scrollbar */
        .file-list::-webkit-scrollbar {
            width: 6px;
        }
        .file-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        .file-list::-webkit-scrollbar-thumb {
            background: var(--cyan);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="hud-bracket hud-tl"></div>
        <div class="hud-bracket hud-tr"></div>
        <div class="hud-bracket hud-bl"></div>
        <div class="hud-bracket hud-br"></div>

        <div class="widget-header">
            <div class="widget-title">SHARED FILES</div>
            <div class="widget-status">
                <span class="status-dot"></span>
                <span>IN-HOUSE STORAGE</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn upload" onclick="openUpload()">+ UPLOAD</button>
            <button class="control-btn" onclick="filterFiles('all')">ALL</button>
            <button class="control-btn" onclick="filterFiles('build')">BUILD</button>
            <button class="control-btn" onclick="filterFiles('docs')">DOCS</button>
            <button class="control-btn" onclick="filterFiles('code')">CODE</button>
            <button class="control-btn" onclick="filterFiles('asset')">ASSETS</button>
        </div>

        <div class="file-list" id="fileList">
            <!-- Files populated by JS -->
        </div>

        <div class="widget-footer">
            <span>In-house storage • No Syncthing required</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="storageText">35% used</span>
                <div class="storage-bar">
                    <div class="storage-used" id="storageBar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="upload-modal" id="uploadModal">
        <div class="upload-box" id="uploadBox">
            <h3>DROP FILES HERE</h3>
            <p style="color: var(--text-dim); margin-bottom: 20px;">or click to browse</p>
            <input type="file" id="fileInput" style="display: none;" multiple>
            <button class="control-btn" onclick="document.getElementById('fileInput').click()">BROWSE FILES</button>
            <button class="control-btn" onclick="closeUpload()" style="margin-left: 10px;">CANCEL</button>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // SHARED FILES WIDGET - NETLIFY BLOBS STORAGE
        // Real storage via /.netlify/functions/file-upload
        // ═══════════════════════════════════════════════════════════════

        const STORAGE_API = '/.netlify/functions/file-upload';

        // Get icon based on file extension
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'html': '🔧', 'htm': '🔧',
                'js': '⚡', 'mjs': '⚡', 'ts': '⚡',
                'py': '🐍',
                'json': '🧠',
                'md': '📄', 'txt': '📄', 'pdf': '📄',
                'png': '🎨', 'jpg': '🎨', 'jpeg': '🎨', 'gif': '🎨', 'svg': '🎨', 'webp': '🎨',
                'mp3': '🎵', 'wav': '🎵', 'ogg': '🎵',
                'mp4': '🎬', 'webm': '🎬', 'mov': '🎬',
                'zip': '📦', 'tar': '📦', 'gz': '📦',
                'css': '🎨'
            };
            return icons[ext] || '📁';
        }

        // Get category based on file extension
        function getFileCategory(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['html', 'htm', 'js', 'mjs', 'ts', 'py', 'css'].includes(ext)) return 'build';
            if (['json', 'xml', 'yaml', 'yml'].includes(ext)) return 'code';
            if (['md', 'txt', 'pdf', 'doc', 'docx'].includes(ext)) return 'docs';
            if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'mp3', 'wav', 'mp4'].includes(ext)) return 'asset';
            return 'build';
        }

        // Format file size
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Format date
        function formatDate(isoDate) {
            if (!isoDate) return 'Unknown';
            return new Date(isoDate).toISOString().split('T')[0];
        }

        let allFiles = [];
        let currentFiles = [];
        let currentFilter = 'all';

        // Fetch files from storage
        async function fetchFiles() {
            try {
                const response = await fetch(STORAGE_API);
                if (!response.ok) throw new Error('Failed to fetch files');
                const data = await response.json();

                allFiles = (data.files || []).map(file => ({
                    id: file.id,
                    name: file.filename,
                    category: getFileCategory(file.filename),
                    size: formatSize(file.size),
                    modified: formatDate(file.uploadedAt),
                    author: file.uploadedBy || 'Unknown',
                    icon: getFileIcon(file.filename),
                    url: `${STORAGE_API}?id=${file.id}`
                }));

                currentFiles = [...allFiles];
                renderFiles(currentFiles);
                updateStats();
            } catch (error) {
                console.error('Error fetching files:', error);
                document.getElementById('fileList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>Error loading files: ${error.message}</p>
                        <button class="control-btn" onclick="fetchFiles()" style="margin-top: 10px;">RETRY</button>
                    </div>
                `;
            }
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalFiles').textContent = allFiles.length;
            const totalSize = allFiles.reduce((sum, f) => {
                const match = f.size.match(/([\d.]+)\s*(B|KB|MB)/);
                if (!match) return sum;
                const val = parseFloat(match[1]);
                const unit = match[2];
                if (unit === 'B') return sum + val;
                if (unit === 'KB') return sum + val * 1024;
                if (unit === 'MB') return sum + val * 1024 * 1024;
                return sum;
            }, 0);
            document.getElementById('totalSize').textContent = formatSize(totalSize);
        }

        // Render files
        function renderFiles(files) {
            const container = document.getElementById('fileList');

            if (files.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <p>No files found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = files.map(file => `
                <div class="file-item" data-category="${file.category}">
                    <div class="file-icon">${file.icon}</div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-meta">
                            <span class="file-category cat-${file.category}">${file.category}</span>
                            <span>${file.size}</span>
                            <span>${file.modified}</span>
                            <span>by ${file.author}</span>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="action-btn" title="Download" onclick="downloadFile(${file.id})">⬇</button>
                        <button class="action-btn" title="Share" onclick="shareFile(${file.id})">🔗</button>
                        <button class="action-btn delete" title="Delete" onclick="deleteFile(${file.id})">✕</button>
                    </div>
                </div>
            `).join('');
        }

        // Filter files
        function filterFiles(category) {
            currentFilter = category;
            if (category === 'all') {
                currentFiles = [...allFiles];
            } else {
                currentFiles = allFiles.filter(f => f.category === category);
            }
            renderFiles(currentFiles);

            // Update button states
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.style.background = 'rgba(0,255,255,0.1)';
            });
        }

        // Upload modal
        function openUpload() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUpload() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        // File actions - REAL IMPLEMENTATIONS
        function downloadFile(id) {
            const file = allFiles.find(f => f.id === id);
            if (file) {
                // Create download link and trigger
                const link = document.createElement('a');
                link.href = file.url;
                link.download = file.name;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function shareFile(id) {
            const file = allFiles.find(f => f.id === id);
            if (file) {
                const shareUrl = window.location.origin + file.url;
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Link copied to clipboard!\n' + shareUrl);
                }).catch(() => {
                    prompt('Copy this link:', shareUrl);
                });
            }
        }

        async function deleteFile(id) {
            const file = allFiles.find(f => f.id === id);
            if (file && confirm(`Delete "${file.name}"?`)) {
                try {
                    const response = await fetch(`${STORAGE_API}?id=${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        // Refresh file list
                        await fetchFiles();
                        alert('File deleted');
                    } else {
                        throw new Error('Delete failed');
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    alert('Error deleting file: ' + error.message);
                }
            }
        }

        // Upload file to storage
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('filename', file.name);
            formData.append('uploadedBy', 'shared-widget');

            try {
                const response = await fetch(STORAGE_API, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Upload failed');
                const data = await response.json();
                console.log('Upload success:', data);
                return data;
            } catch (error) {
                console.error('Upload error:', error);
                throw error;
            }
        }

        // Drag and drop
        const uploadBox = document.getElementById('uploadBox');

        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const files = e.dataTransfer.files;
            closeUpload();

            // Upload all files
            for (const file of files) {
                try {
                    await uploadFile(file);
                } catch (error) {
                    alert(`Error uploading ${file.name}: ${error.message}`);
                }
            }
            // Refresh list
            await fetchFiles();
        });

        // File input
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = e.target.files;
            closeUpload();

            // Upload all files
            for (const file of files) {
                try {
                    await uploadFile(file);
                } catch (error) {
                    alert(`Error uploading ${file.name}: ${error.message}`);
                }
            }
            // Refresh list
            await fetchFiles();
            e.target.value = ''; // Reset input
        });

        // Click outside modal to close
        document.getElementById('uploadModal').addEventListener('click', (e) => {
            if (e.target.id === 'uploadModal') {
                closeUpload();
            }
        });

        // Initialize - fetch real files
        fetchFiles();

        // ═══════════════════════════════════════════════════════════════
        // STORAGE BACKEND (Replace with actual implementation)
        // Options: Supabase, Netlify Blob, Local API, Cyclotron
        // ═══════════════════════════════════════════════════════════════

        const StorageBackend = {
            // Initialize connection
            async init() {
                // ENHANCEMENT: Connect to Supabase when scaling
                // Current: Uses localStorage + sample data (works for demo)
                console.log('Storage backend initialized (demo mode)');
            },

            // List all files
            async listFiles() {
                // Returns sample files for demo
                return sampleFiles;
            },

            // Upload file
            async upload(file) {
                // Demo mode - logs only
                console.log('Demo upload:', file.name);
                alert('Demo mode: File would be uploaded to cloud storage');
            },

            // Download file
            async download(fileId) {
                // Demo mode - logs only
                console.log('Demo download:', fileId);
                alert('Demo mode: File would download from cloud storage');
            },

            // Delete file
            async delete(fileId) {
                // Demo mode - logs only
                console.log('Demo delete:', fileId);
                alert('Demo mode: File would be deleted from cloud storage');
            }
        };

        // Initialize storage
        StorageBackend.init();
    </script>
