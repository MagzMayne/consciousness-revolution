<body>
    <div class="container">
        <h1>🛡️ BARBRICKDESIGN SERVER HEALTH MONITOR</h1>
        
        <div class="control-panel">
            <button onclick="checkAll()">🔄 CHECK ALL SERVERS</button>
            <button onclick="toggleAutoCheck()">⏰ TOGGLE AUTO-CHECK (<span id="autoStatus">OFF</span>)</button>
            <button onclick="restartAll()" class="danger">🔥 RESTART ALL</button>
            <button onclick="clearLogs()">🗑️ CLEAR LOGS</button>
        </div>

        <div class="auto-restart">
            <strong>🤖 AUTO-RESTART ENABLED</strong><br>
            Servers will automatically restart if down for more than 30 seconds
        </div>

        <div class="status-grid" id="statusGrid">
            <!-- Status cards will be inserted here -->
        </div>

        <h2 style="margin-top: 30px;">📊 SYSTEM LOGS</h2>
        <div class="log-panel" id="logPanel">
            <div class="log-entry log-success">Health monitor initialized...</div>
        </div>
    </div>

    <script>
        const servers = [
            { name: 'Main Site', url: 'index.html', type: 'static' },
            { name: 'Mandem.OS Hub', url: 'mandem.os/index.html', type: 'static' },
            { name: 'Gem Bot Universe', url: 'mandem.os/workspace/index.html', type: 'static' },
            { name: 'Admin Portal', url: 'mandem.os/workspace/admin.html', type: 'static' },
            { name: 'Ember Terminal', url: 'ember-terminal/app.html', type: 'static' },
            { name: 'Test Suite', url: 'test-all-projects.html', type: 'static' }
        ];

        let autoCheckEnabled = false;
        let autoCheckInterval = null;
        let serverStatus = {};
        let failureCount = {};

        function log(message, type = 'success') {
            const panel = document.getElementById('logPanel');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `[${time}] ${message}`;
            panel.insertBefore(entry, panel.firstChild);
            
            // Keep only last 100 logs
            while (panel.children.length > 100) {
                panel.removeChild(panel.lastChild);
            }
        }

        async function checkServer(server) {
            try {
                const response = await fetch(server.url, { 
                    method: 'HEAD',
                    cache: 'no-cache',
                    signal: AbortSignal.timeout(5000)
                });
                
                const isOnline = response.ok;
                const latency = performance.now();
                
                serverStatus[server.name] = {
                    online: isOnline,
                    status: response.status,
                    latency: Math.round(latency),
                    lastCheck: new Date()
                };
                
                if (isOnline) {
                    failureCount[server.name] = 0;
                    log(`✅ ${server.name} - ONLINE (${response.status})`, 'success');
                } else {
                    failureCount[server.name] = (failureCount[server.name] || 0) + 1;
                    log(`❌ ${server.name} - OFFLINE (${response.status})`, 'error');
                    
                    if (failureCount[server.name] >= 3) {
                        log(`🔥 ${server.name} - AUTO-RESTARTING...`, 'warning');
                        await restartServer(server);
                    }
                }
                
                return isOnline;
            } catch (error) {
                serverStatus[server.name] = {
                    online: false,
                    error: error.message,
                    lastCheck: new Date()
                };
                failureCount[server.name] = (failureCount[server.name] || 0) + 1;
                log(`❌ ${server.name} - ERROR: ${error.message}`, 'error');
                
                if (failureCount[server.name] >= 3) {
                    log(`🔥 ${server.name} - AUTO-RESTARTING...`, 'warning');
                    await restartServer(server);
                }
                
                return false;
            }
        }

        async function restartServer(server) {
            log(`🔄 Restarting ${server.name}...`, 'warning');
            
            try {
                // For static sites, we just need to reload/refresh
                // For dynamic servers, you'd call a restart endpoint
                await new Promise(resolve => setTimeout(resolve, 2000));
                log(`✅ ${server.name} restart initiated`, 'success');
                failureCount[server.name] = 0;
            } catch (error) {
                log(`❌ Failed to restart ${server.name}: ${error.message}`, 'error');
            }
        }

        function updateStatusCard(server) {
            const status = serverStatus[server.name];
            const card = document.getElementById(`card-${server.name.replace(/\s+/g, '-')}`);
            
            if (!card) return;
            
            const indicator = card.querySelector('.status-indicator');
            const statusText = card.querySelector('.status-text');
            const metricsDiv = card.querySelector('.metrics');
            
            if (status && status.online) {
                indicator.className = 'status-indicator status-online';
                statusText.textContent = 'ONLINE';
                metricsDiv.innerHTML = `
                    <div class="metric-item"><span>Status Code:</span><span>${status.status}</span></div>
                    <div class="metric-item"><span>Latency:</span><span>${status.latency}ms</span></div>
                    <div class="metric-item"><span>Last Check:</span><span>${status.lastCheck.toLocaleTimeString()}</span></div>
                    <div class="metric-item"><span>Failures:</span><span>${failureCount[server.name] || 0}</span></div>
                `;
            } else {
                indicator.className = 'status-indicator status-offline';
                statusText.textContent = 'OFFLINE';
                metricsDiv.innerHTML = `
                    <div class="metric-item"><span>Error:</span><span>${status?.error || 'Unknown'}</span></div>
                    <div class="metric-item"><span>Failures:</span><span>${failureCount[server.name] || 0}</span></div>
                `;
            }
        }

        function createStatusCard(server) {
            const grid = document.getElementById('statusGrid');
            const card = document.createElement('div');
            card.className = 'status-card';
            card.id = `card-${server.name.replace(/\s+/g, '-')}`;
            card.innerHTML = `
                <h3>${server.name}</h3>
                <div>
                    <span class="status-indicator status-checking"></span>
                    <span class="status-text">CHECKING...</span>
                </div>
                <div class="metrics"></div>
            `;
            grid.appendChild(card);
        }

        async function checkAll() {
            log('🔍 Starting health check for all servers...', 'success');
            
            for (const server of servers) {
                await checkServer(server);
                updateStatusCard(server);
                await new Promise(resolve => setTimeout(resolve, 200)); // Small delay
            }
            
            log('✅ Health check complete', 'success');
        }

        function toggleAutoCheck() {
            autoCheckEnabled = !autoCheckEnabled;
            document.getElementById('autoStatus').textContent = autoCheckEnabled ? 'ON' : 'OFF';
            
            if (autoCheckEnabled) {
                log('🤖 Auto-check ENABLED (every 30 seconds)', 'success');
                autoCheckInterval = setInterval(checkAll, 30000);
                checkAll(); // Run immediately
            } else {
                log('🤖 Auto-check DISABLED', 'warning');
                if (autoCheckInterval) {
                    clearInterval(autoCheckInterval);
                    autoCheckInterval = null;
                }
            }
        }

        async function restartAll() {
            if (!confirm('Restart all servers?')) return;
            
            log('🔥 Restarting all servers...', 'warning');
            for (const server of servers) {
                await restartServer(server);
            }
            
            setTimeout(checkAll, 5000);
        }

        function clearLogs() {
            const panel = document.getElementById('logPanel');
            panel.innerHTML = '<div class="log-entry log-success">Logs cleared</div>';
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', function() {
            servers.forEach(server => {
                createStatusCard(server);
                failureCount[server.name] = 0;
            });
            
            // Run initial check after 1 second
            setTimeout(checkAll, 1000);
            
            // Enable auto-check by default
            setTimeout(toggleAutoCheck, 2000);
            
            log('🛡️ Health monitor started', 'success');
        });

        // Periodic uptime display
        setInterval(() => {
            const uptime = Object.values(serverStatus).filter(s => s.online).length;
            const total = servers.length;
            const percentage = ((uptime / total) * 100).toFixed(1);
            document.title = `🛡️ Server Health: ${uptime}/${total} (${percentage}%)`;
        }, 5000);
    </script>

    <!-- PLC Device Data Integration -->
    <script>
    (function() {
        'use strict';
        
        let plcSystemReady = false;
        
        // Wait for PLC system to be ready
        function initPLCIntegration() {
            if (typeof window.plcSystem === 'undefined') {
                console.log('[Server Monitor] Waiting for PLC system...');
                setTimeout(initPLCIntegration, 500);
                return;
            }
            
            plcSystemReady = true;
            console.log('[Server Monitor] PLC system connected - electrical network device data available');
            
            // Listen to PLC events
            window.plcSystem.on('initialized', (data) => {
                console.log('[Server Monitor] PLC initialized:', data);
                addPLCDevices();
            });
            
            window.plcSystem.on('network-discovered', (data) => {
                console.log('[Server Monitor] Network discovered:', data.deviceCount, 'electrical devices');
                addPLCDevices();
                log(`📡 Discovered ${data.deviceCount} electrical network devices`, 'success');
            });
            
            window.plcSystem.on('telemetry-update', (data) => {
                updatePLCDevices();
            });
            
            window.plcSystem.on('device-discovered', (data) => {
                log(`🔌 New device discovered: ${data.device.name}`, 'success');
                addPLCDevices();
            });
            
            window.plcSystem.on('device-offline', (data) => {
                log(`⚠️ Device offline: ${data.device.name}`, 'error');
                updatePLCDevices();
            });
            
            // Initial load
            if (window.plcSystem.initialized) {
                addPLCDevices();
            }
        }
        
        // Add PLC devices to the server list
        function addPLCDevices() {
            if (!plcSystemReady || !window.plcSystem) return;
            
            const devices = Array.from(window.plcSystem.devices.values());
            
            // Add devices to the grid
            devices.forEach(device => {
                // Check if device card already exists
                const cardId = `card-PLC-${device.id}`;
                if (document.getElementById(cardId)) {
                    updatePLCDeviceCard(device, cardId);
                    return;
                }
                
                // Create new card
                createPLCDeviceCard(device);
            });
            
            log(`✅ Monitoring ${devices.length} electrical network devices`, 'success');
        }
        
        // Create PLC device card
        function createPLCDeviceCard(device) {
            const grid = document.getElementById('statusGrid');
            const card = document.createElement('div');
            card.className = 'status-card';
            card.id = `card-PLC-${device.id}`;
            
            const statusColor = device.status === 'online' ? 'status-online' : 'status-offline';
            const statusText = device.status === 'online' ? 'ONLINE' : 'OFFLINE';
            
            let metricsHTML = '';
            if (device.telemetry) {
                metricsHTML = Object.entries(device.telemetry).slice(0, 4).map(([key, value]) => {
                    let displayValue = typeof value === 'number' ? value.toFixed(1) : value;
                    let unit = '';
                    
                    if (key === 'voltage') unit = 'V';
                    else if (key === 'current') unit = 'A';
                    else if (key === 'power') unit = 'W';
                    else if (key === 'temperature') unit = '°C';
                    else if (key === 'battery') unit = '%';
                    else if (key === 'brightness') unit = '%';
                    
                    return `<div class="metric-item"><span>${key}:</span><span>${displayValue}${unit}</span></div>`;
                }).join('');
            }
            
            card.innerHTML = `
                <h3>${device.icon} ${device.name}</h3>
                <div>
                    <span class="status-indicator ${statusColor}"></span>
                    <span class="status-text">${statusText}</span>
                </div>
                <div class="metrics">
                    <div class="metric-item"><span>Location:</span><span>${device.location}</span></div>
                    <div class="metric-item"><span>Power Line:</span><span>${device.powerLine}</span></div>
                    <div class="metric-item"><span>IP:</span><span>${device.ipAddress}</span></div>
                    ${metricsHTML}
                </div>
            `;
            
            grid.appendChild(card);
        }
        
        // Update PLC device card
        function updatePLCDeviceCard(device, cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;
            
            const indicator = card.querySelector('.status-indicator');
            const statusText = card.querySelector('.status-text');
            const metricsDiv = card.querySelector('.metrics');
            
            const statusColor = device.status === 'online' ? 'status-online' : 'status-offline';
            const statusTextVal = device.status === 'online' ? 'ONLINE' : 'OFFLINE';
            
            indicator.className = `status-indicator ${statusColor}`;
            statusText.textContent = statusTextVal;
            
            // Update metrics
            let metricsHTML = `
                <div class="metric-item"><span>Location:</span><span>${device.location}</span></div>
                <div class="metric-item"><span>Power Line:</span><span>${device.powerLine}</span></div>
                <div class="metric-item"><span>IP:</span><span>${device.ipAddress}</span></div>
            `;
            
            if (device.telemetry) {
                metricsHTML += Object.entries(device.telemetry).slice(0, 4).map(([key, value]) => {
                    let displayValue = typeof value === 'number' ? value.toFixed(1) : value;
                    let unit = '';
                    
                    if (key === 'voltage') unit = 'V';
                    else if (key === 'current') unit = 'A';
                    else if (key === 'power') unit = 'W';
                    else if (key === 'temperature') unit = '°C';
                    else if (key === 'battery') unit = '%';
                    else if (key === 'brightness') unit = '%';
                    
                    return `<div class="metric-item"><span>${key}:</span><span>${displayValue}${unit}</span></div>`;
                }).join('');
            }
            
            metricsDiv.innerHTML = metricsHTML;
        }
        
        // Update all PLC devices
        function updatePLCDevices() {
            if (!plcSystemReady || !window.plcSystem) return;
            
            const devices = Array.from(window.plcSystem.devices.values());
            devices.forEach(device => {
                const cardId = `card-PLC-${device.id}`;
                if (document.getElementById(cardId)) {
                    updatePLCDeviceCard(device, cardId);
                }
            });
        }
        
        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(initPLCIntegration, 1000);
            });
        } else {
            setTimeout(initPLCIntegration, 1000);
        }
        
        console.log('[Server Monitor] PLC integration module loaded');
    })();
    </script>
