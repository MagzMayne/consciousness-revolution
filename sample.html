<main>
    <div class="container">
        <h2>Ask Copilot Something</h2>

        <label for="userInput" class="input-label">Your Question:</label>
        <textarea 
            id="userInput" 
            placeholder="Type your question here..." 
            aria-label="Enter your question for Copilot"
        ></textarea>

        <button type="button" onclick="sendToCopilot()" aria-label="Send question to Copilot">
            Send to Copilot
        </button>

        <section id="responseBox" aria-live="polite" aria-label="Copilot response area">
            Copilot responses will appear here.
        </section>
    </div>

<script>
/*
    This is a DEMO script showing how a webpage could call Copilot.
    In a real implementation, you would replace the mock API call
    with your actual backend endpoint that communicates with Copilot.
*/

async function sendToCopilot() {
    const input = document.getElementById("userInput").value.trim();
    const box = document.getElementById("responseBox");

    if (!input) {
        box.textContent = "Please enter a question first.";
        return;
    }

    box.textContent = "Thinking...";

    // Simulated Copilot response (offline demo)
    const mockResponse = await mockCopilotAPI(input);

    box.textContent = mockResponse;
}

// Mock Copilot API for demo purposes
function mockCopilotAPI(prompt) {
    return new Promise(resolve => {
        setTimeout(() => {
            resolve(
                "Copilot says:\n\n" +
                "You asked: \"" + prompt + "\"\n\n" +
                "This is a sample response showing how Copilot could reply inside a webpage."
            );
        }, 900);
    });
}
</script>
